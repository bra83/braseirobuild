let state=null, screen='home', openedId=null, tab='sintese', wizardStep=0, draft=null,

let errorLocked=false;
function appUnlock(){
 try {
   const raw=window.NativeVault.loadState(); const data=JSON.parse(raw);
   if(data.__loadError) throw new Error(data.__loadError);
   if(window.NativeVault.loadDraft){
     const draftText=window.NativeVault.loadDraft();
     if(draftText){
       const journal=JSON.parse(draftText);
       if(journal.__loadError)throw Error(journal.__loadError);
       if(journal.caseId&&journal.session)data.mlDraft=journal;
     }
   }
   if(data.version!==1||!Array.isArray(data.cases)||!Array.isArray(data.appointments)) throw new Error('Esquema não reconhecido');
   state=data;errorLocked=false;
   // Recover the encrypted autosave even after OS process death. This cannot
   // restore a deleted temporary WAV, but preserves already transcribed text.
   const recovered=state.mlDraft;
   const caseExists=recovered&&state.cases.some(c=>c.id===recovered.caseId);
   if(caseExists && recovered.session && typeof recovered.session==="object"){
      openedId=recovered.caseId;
      sessionDraft=JSON.parse(JSON.stringify(recovered.session));
      editSessionId=state.cases.find(c=>c.id===openedId)?.sessoes?.some(s=>s.id===sessionDraft.id)?sessionDraft.id:null;
      screen="session";
      ecoWorkspaceTab="revisar";
      ecoStatus="RASCUNHO RESTAURADO · TRANSCRIÇÃO ANTERIOR INTERROMPIDA · CONFIRA O TEXTO";
   }
   render();
 } catch(e){errorLocked=true;$('#app').innerHTML='<div class="alert red"><strong>Dados não abertos</strong><p>'+esc(e.message)+'</p><p>Não crie registros novos nem reinstale o app antes de avaliar a recuperação.</p></div>';$('#bottom').innerHTML='';}
}
window.appUnlock=appUnlock;
function persist(){
 if(errorLocked||!state) return false;
 const response=window.NativeVault.saveState(JSON.stringify(state));
 if(response!=='OK'){notify('Erro de gravação: '+response,'red');return false;}return true;
}
function change(fn){ const before=JSON.stringify(state);fn();if(!persist()){state=JSON.parse(before);return false;}render();return true; }
function notify(text,kind='blue'){
 const target=$('#app'); if(!target)return;
 const box=document.createElement('div');box.className='alert '+kind;box.textContent=text;
 target.prepend(box);setTimeout(()=>box.remove(),5500);
}
function currentCase(){return state.cases.find(c=>c.id===openedId);}

}

function ecoCaseAnalysis(c){
 const ss=(c?.sessoes||[]).filter(s=>!!(s.mlTranscricao||s.mlRevisada||s.mlSegments?.length));
 if(!ss.length)return '<section class="eco-outline"><h2>Registros para análise</h2><p>Este caso ainda não possui transcrição arquivada. Grave uma sessão ou importe um arquivo e salve a transcrição.</p>'+
 btn("Gravar ou importar","ecoOpen","",'data-id="'+esc(c.id)+'"')+'</section>';
 const compiled=new Map();
 for(const session of ss)for(const row of ecoWordRows(session).slice(0,150)){
   if(!compiled.has(row.word))compiled.set(row.word,{word:row.word,count:0,mentions:[]});
   const current=compiled.get(row.word);
   current.count+=row.count;
   current.mentions.push(...row.locations.slice(0,20).map(loc=>({date:session.data,id:session.id,atMs:loc.atMs,quote:loc.quote})));
 }
 const top=[...compiled.values()].sort((a,b)=>b.count-a.count).slice(0,25);
 let out='<section class="eco-outline"><h2>Termos recorrentes neste caso</h2>'+
  '<p class="eco-caption">Contagem lexical das transcrições arquivadas. Não representa sintoma, diagnóstico ou relação psicológica.</p>'+
  '<div class="eco-wordcloud">'+top.slice(0,20).map(r=>'<span class="eco-cloud-token" style="font-size:'+
    (14+Math.round(13*Math.sqrt(r.count/Math.max(1,top[0]?.count||1))))+'px">'+esc(r.word)+' <small>'+r.count+'</small></span>').join('')+'</div>'+
  '<h3>Ocorrências no histórico</h3>';
 out+=top.slice(0,12).map(row=>'<div class="eco-evidence"><strong>'+esc(row.word)+' · '+row.count+
   ' menção(ões)</strong>'+row.mentions.slice(0,5).map(loc=>'<p>'+
   (loc.atMs==null?'<span class="eco-caption">Horário indisponível</span>':
     btn(ecoTimecode(loc.atMs),'ecoJumpToSession','secondary','data-id="'+esc(c.id+'|'+loc.id+'|'+loc.atMs)+'"'))+
   ' · '+esc(formatDate(loc.date))+' — “'+esc(loc.quote)+'”</p>').join('')+'</div>').join('');
 out+='<h3>Abra uma sessão para revisar as evidências</h3>'+
 ss.slice().reverse().map(session=>'<div class="eco-evidence">'+
 '<strong>'+esc(formatDate(session.data))+'</strong> · '+(session.mlSegments?.length||0)+' trechos'+
 btn("Ver transcrição, NLP e marcações","editSession","secondary",'data-id="'+esc(session.id)+'"')+
 '</div>').join('')+'</section>';
 return out;
}

 if(tab==='anamnese')content=`<div class="card"><h2>Identificação e história</h2>${[['Idade',c.idade],['Primeiro atendimento',formatDate(c.data)],['Modalidade',c.modalidade],['Queixa nas palavras da pessoa',c.queixaTexto],['Intensidade',c.intensidade+'/10'],['Desde quando',c.desde],['Gatilhos',c.gatilhos],['Família e história',c.familia],['Relações',c.relacoes],['Apoios',c.recursos],['Sonhos e repetições',c.sonhos],['Observações',c.obs]].map(x=>keyval(...x)).join('')}${btn('Editar anamnese','editCase','secondary')}</div>`;

function field(k,label,type='text',opts={}){
 const value=(opts.source||draft||{})[k]??'';
 const id='f_'+k;
 const required=opts.required?' required':'';
 const inp=type==='textarea'?`<textarea id="${id}" data-field="${k}" placeholder="${esc(opts.placeholder||'')}"${required}>${esc(value)}</textarea>`:
 type==='select'?`<select id="${id}" data-field="${k}">${(opts.values||[]).map(x=>`<option value="${esc(x)}" ${String(value)===String(x)?'selected':''}>${esc(x||'Selecione')}</option>`).join('')}</select>`:
 `<input id="${id}" data-field="${k}" type="${type}" value="${esc(value)}" ${opts.min!=null?'min="'+opts.min+'"':''} ${opts.max!=null?'max="'+opts.max+'"':''} ${opts.placeholder?'placeholder="'+esc(opts.placeholder)+'"':''}${required}>`;
 return `<div class="field"><label for="${id}">${esc(label)}</label>${inp}</div>`;
}

 if(wizardStep===0){if(!draft.nome.trim()){notify('Informe um apelido.','red');return false;}

  if(!validDate(draft.data)){notify('Data do primeiro atendimento inválida.','red');return false;}}

function overlaps(a,b){return a.data===b.data&&a.status!=='Cancelado'&&b.status!=='Cancelado'&&a.id!==b.id&&asMinutes(a)<asMinutes(b)+Number(b.duracao)&&asMinutes(b)<asMinutes(a)+Number(a.duracao);}
function normalizeImported(raw){
 let sourceCases,sourceAppointments=[];
 if(Array.isArray(raw)){sourceCases=raw;}else if(raw&&raw.version===1&&Array.isArray(raw.cases)){sourceCases=raw.cases;sourceAppointments=raw.appointments||[];}
 else throw Error('Estrutura do arquivo não reconhecida');
 if(!Array.isArray(sourceCases)||sourceCases.length>5000||!Array.isArray(sourceAppointments)||sourceAppointments.length>20000)throw Error('Quantidade de registros inválida');
 const cases=sourceCases.map(c=>{
  if(!c||typeof c!=='object'||!c.id||!c.nome)throw Error('Caso sem ID ou apelido');
  const obj=makeCase();const fields=['id','criado','nome','idade','data','modalidade','queixas','queixaTexto','intensidade','desde','gatilhos','familia','relacoes','recursos','sonhos','obs','alertas','status','atualizadoEm'];
  fields.forEach(k=>{if(Object.prototype.hasOwnProperty.call(c,k))obj[k]=c[k];});
  obj.queixas=Array.isArray(obj.queixas)?obj.queixas:[];obj.alertas=Array.isArray(obj.alertas)?obj.alertas:[];
  if(!Array.isArray(c.sessoes)||c.sessoes.length>10000)throw Error('Sessões inválidas');
  obj.sessoes=c.sessoes.map(s=>{
   if(!s||typeof s!=='object'||typeof s.texto!=='string'||!validDate(s.data))throw Error('Registro de sessão inválido');
   // Preserve all structured ML and revision fields rather than projecting a reduced legacy schema.
   const copy=JSON.parse(JSON.stringify(s));
   copy.id=s.id||uid();copy.data=s.data;
   copy.texto=s.texto;copy.intervencoes=s.intervencoes||'';copy.plano=s.plano||'';
   copy.criadoEm=s.criadoEm||new Date().toISOString();
   copy.revisoes=Array.isArray(s.revisoes)?JSON.parse(JSON.stringify(s.revisoes)):[];
   copy.mlSegments=Array.isArray(s.mlSegments)?JSON.parse(JSON.stringify(s.mlSegments)):[];
   copy.mlTags=Array.isArray(s.mlTags)?[...s.mlTags]:[];
   copy.mlEvidence=Array.isArray(s.mlEvidence)?JSON.parse(JSON.stringify(s.mlEvidence)):[];
   copy.mlTranscricao=typeof s.mlTranscricao==='string'?s.mlTranscricao:'';
   copy.mlRevisada=typeof s.mlRevisada==='string'?s.mlRevisada:'';
   return copy;
  });
  return obj;
 });
 const appointments=sourceAppointments.map(a=>{
   if(!a||!a.id||!a.caseId||!validDate(a.data)||!/^\d\d:\d\d$/.test(a.hora||''))throw Error('Consulta inválida');
   return {id:a.id,caseId:a.caseId,data:a.data,hora:a.hora,duracao:Number(a.duracao)||50,status:a.status||'Agendado',notas:a.notas||''};
 });
 return {cases,appointments,legacy:Array.isArray(raw),mlDraft:raw&&raw.mlDraft&&typeof raw.mlDraft==='object'?JSON.parse(JSON.stringify(raw.mlDraft)):null,uiTheme:raw&&raw.uiTheme==='dark'?'dark':'light'};
}

 return `<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><style>body{font:12px/1.5 Arial,sans-serif;color:#20342e;margin:30px}h1{font-size:22px;color:#155c52}h2{color:#155c52;border-bottom:1px solid #b8cfc3}h3{font-size:13px}p{white-space:normal;overflow-wrap:anywhere}small{color:#666}.kv{margin:5px 0}</style></head><body><h1>Relatório de acompanhamento</h1><small>Documento gerado localmente em ${esc(formatDate(datestr()))}. Revisar antes de compartilhar.</small><h2>Identificação e anamnese</h2>${[['Caso',c.nome],['Idade',c.idade],['Modalidade',c.modalidade],['Primeiro atendimento',formatDate(c.data)],['Status',c.status],['Queixa',c.queixaTexto],['Intensidade',String(c.intensidade)],['Desde quando',c.desde],['Gatilhos',c.gatilhos],['Histórico familiar',c.familia],['Relacionamentos',c.relacoes],['Recursos',c.recursos],['Sonhos e recorrências',c.sonhos],['Observações',c.obs]].map(([k,v])=>`<div class="kv"><strong>${esc(k)}:</strong> ${esc(v||'Não informado')}</div>`).join('')}<h2>Registros das sessões</h2>${rows()||'Nenhuma sessão registrada.'}<p><small>Material confidencial. A geração não equivale a assinatura, validação ou certificação de prontuário.</small></p></body></html>`;

function act(name,id){
 if(name==='nav'){screen=id||'home';render();return;}
 if(name==='newCase'){draft=makeCase();wizardStep=0;screen='wizard';render();return;}
 if(name==='editCase'){draft=JSON.parse(JSON.stringify(currentCase()));draft._isEditing=true;wizardStep=0;screen='wizard';render();return;}
 if(name==='cancelWizard'){draft=null;screen='cases';render();return;}
 if(name==='wizardBack'){wizardStep=Math.max(0,wizardStep-1);render();return;}
 if(name==='wizardNext'){if(!validateWizard())return;wizardStep=Math.min(3,wizardStep+1);render();return;}
 if(name==='saveCase'){if(!validateWizard())return;
  const copy=JSON.parse(JSON.stringify(draft));delete copy._isEditing;
  const ok=change(()=>{copy.atualizadoEm=new Date().toISOString();const idx=state.cases.findIndex(c=>c.id===copy.id);if(idx>=0)state.cases[idx]=copy;else state.cases.push(copy);});
  if(ok){openedId=copy.id;draft=null;screen='case';tab='sintese';render();}return;
 }
 if(name==='openCase'){openedId=id||openedId;screen='case';tab=tab==='sessoes'?'sessoes':'sintese';render();return;}
 if(name==='caseTab'){tab=id;render();return;}
 if(name==='toggleStatus'){change(()=>{const c=currentCase();c.status=c.status==='Concluído'?'Em andamento':'Concluído';c.atualizadoEm=new Date().toISOString();});return;}
 if(name==='newSession'){editSessionId=null;sessionDraft=newSessionDraft();screen='session';render();return;}
 if(name==='editSession'){
  const sess=currentCase()?.sessoes?.find(s=>s.id===id);if(!sess)return;
  editSessionId=id;sessionDraft=JSON.parse(JSON.stringify(sess));screen='session';render();return;
 }
 if(name==='saveSession'){
  const s=sessionDraft,c=currentCase();if(!s||!c)return;
  if(!validDate(s.data)){notify('Informe a data da sessão.','red');return;}
  if(!s.texto?.trim() && (s.mlTranscricao||s.mlRevisada||"").trim())
    s.texto="Registro de transcrição arquivada, ainda sem síntese profissional.";
  if(!s.texto?.trim()){notify('Registre um resumo ou uma transcrição antes de salvar a sessão.','red');return;}
  if(s.data>datestr()){notify('Data de sessão futura: use a Agenda para uma consulta ainda não realizada.','red');return;}
  if(s.data<c.data){notify('Sessão anterior à data inicial do caso. Corrija a data inicial ou a data da sessão.','red');return;}
  let saved=false;
  if(editSessionId){const prior=c.sessoes.find(v=>v.id===editSessionId);if(!prior)return;
   if(['data','texto','intervencoes','plano','mlTranscricao','mlRevisada'].every(k=>String(s[k]||'')===String(prior[k]||'')) &&
    ['mlTags','mlSegments','mlEvidence','mlEvents','mlAcoustic'].every(k=>JSON.stringify(s[k]||[])===JSON.stringify(prior[k]||[]))){notify('Nenhuma alteração para registrar.');return;}
   saved=change(()=>{const index=c.sessoes.findIndex(v=>v.id===editSessionId);
    const old=c.sessoes[index];const revisoes=Array.isArray(old.revisoes)?old.revisoes:[];
    const revision={...JSON.parse(JSON.stringify(old)),revisoes:undefined,registradoEm:new Date().toISOString()};
    c.sessoes[index]={...s,criadoEm:old.criadoEm,revisoes:[...revisoes,revision]};});
  }else{saved=change(()=>{c.sessoes.push(s);});}
  if(!saved){notify('Falha ao salvar. A sessão permanece aberta para recuperação.','red');return;}
  if(window.NativeVault.clearDraft)window.NativeVault.clearDraft();
  if(state.mlDraft?.session?.id===s.id){state.mlDraft=null;persist();}
  editSessionId=null;sessionDraft=null;screen='case';tab='sessoes';render();return;
 }
 if(name==='newAppointment'){
  if(!state.cases.length){notify('Cadastre um caso antes de agendar.','red');return;}
  editApptId=null;apptDraft={id:uid(),caseId:id||state.cases[0].id,data:datestr(),hora:'09:00',duracao:'50',status:'Agendado',notas:''};screen='appointment';render();return;
 }
 if(name==='editAppointment'){
  const a=state.appointments.find(v=>v.id===id);if(!a)return;
  editApptId=id;apptDraft=JSON.parse(JSON.stringify(a));screen='appointment';render();return;
 }
 if(name==='saveAppointment'){
  const a=apptDraft;if(!a)return;
  if(!state.cases.some(c=>c.id===a.caseId)||!validDate(a.data)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(a.hora||'')||Number(a.duracao)<=0){notify('Confira o caso, a data, a hora e a duração.','red');return;}
  const match=state.appointments.find(b=>overlaps(a,b));
  if(match){const c=state.cases.find(c=>c.id===match.caseId);notify('Conflito: '+(c?.nome||'outro caso')+' às '+match.hora+' em '+formatDate(match.data),'red');return;}
  change(()=>{const o={...a,duracao:Number(a.duracao)};const ix=state.appointments.findIndex(v=>v.id===o.id);if(ix>=0)state.appointments[ix]=o;else state.appointments.push(o);});
  apptDraft=null;editApptId=null;screen='agenda';render();return;
 }
 if(name==='studyMode'){studyMode=id;render();return;}
 if(name==='todayAgenda'){render();return;}
 if(name==='doSearch'){render();return;}
 if(name==='pdfCase'){const c=currentCase();if(c)window.NativeVault.printReport(pdfForCase(c));return;}
 if(name==='exportBackup'){
  const input=$('#backupPass');const pass=input?.value||'';
  if(pass.length<10){notify('Senha do backup: use pelo menos 10 caracteres.','red');return;}
  window.NativeVault.exportBackup(pass);input.value='';return;
 }
 if(name==='importBackup'){
  const input=$('#backupPass');const pass=input?.value||'';window.NativeVault.importBackup(pass);if(input)input.value='';return;
 }
 if(name==='confirmImport'){
  if(!pendingImport)return;const data=pendingImport;
  const present=new Set(state.cases.map(c=>c.id));const newCases=data.cases.filter(c=>!present.has(c.id));
  const validIds=new Set([...present,...newCases.map(c=>c.id)]);
  const apptIds=new Set(state.appointments.map(a=>a.id));const newAppointments=data.appointments.filter(a=>validIds.has(a.caseId)&&!apptIds.has(a.id));
  const success=change(()=>{
   state.cases.push(...newCases);state.appointments.push(...newAppointments);
   if(!state.mlDraft && data.mlDraft && state.cases.some(c=>c.id===data.mlDraft.caseId))
      state.mlDraft=JSON.parse(JSON.stringify(data.mlDraft));
  });
  if(success&&data.mlDraft&&window.NativeVault.saveDraft&&state.mlDraft?.caseId===data.mlDraft.caseId)
     window.NativeVault.saveDraft(JSON.stringify(data.mlDraft));
  if(success){pendingImport=null;closeModal();notify(`${newCases.length} caso(s) e ${newAppointments.length} consulta(s adicionados, com dados ML preservados.`);}
  return;
 }
 if(name==='closeModal'){pendingImport=null;closeModal();return;}
}

function ecoRank(query,docs,max=6){
 const rows=[query,...docs.map(x=>x.text)].map(ecoFeatures),df=new Map();
 rows.forEach(row=>{for(const w of new Set(row))df.set(w,(df.get(w)||0)+1)});
 function vec(row){const count=new Map(),v=new Map();let norm=0;
  row.forEach(w=>count.set(w,(count.get(w)||0)+1));
  count.forEach((n,w)=>{const z=(1+Math.log(n))*(1+Math.log(1+(rows.length+1)/(1+df.get(w))));v.set(w,z);norm+=z*z});
  norm=Math.sqrt(norm)||1;v.forEach((z,w)=>v.set(w,z/norm));return v}
 const a=vec(rows[0]);
 return docs.map((d,i)=>{const b=vec(rows[i+1]);let score=0;const shared=[];
  a.forEach((w,k)=>{if(b.has(k)){score+=w*b.get(k);if(!k.includes("_"))shared.push(k)}});
  return {...d,score:score,shared:shared.slice(0,8)}})
 .filter(x=>x.score>=.065&&x.shared.length>=2).sort((a,b)=>b.score-a.score).slice(0,max);

// Every suggestion cites a literal span of the original transcription.
const ecoLexicon=[
 ["Pessoa","mãe",/\b(mãe|mamãe)\b/giu],
 ["Pessoa","pai",/\b(pai|papai)\b/giu],
 ["Pessoa","irmão",/\b(irmão|irmãos)\b/giu],
 ["Pessoa","irmã",/\b(irmã|irmãs)\b/giu],
 ["Pessoa","avó",/\b(avó|avós|vovó|vovozinha)\b/giu],
 ["Pessoa","avô",/\b(avô|avôs|vovô|vovozinho)\b/giu],
 ["Pessoa","tio",/\b(tio|tios)\b/giu],
 ["Pessoa","tia",/\b(tia|tias)\b/giu],
 ["Pessoa","chefe",/\b(chefe|supervisor[a]?)\b/giu],
 ["Pessoa","parceiro",/\b(marido|esposa|namorad[oa]|companheir[oa])\b/giu],
 ["Contexto","infância",/\b(infância|criança|pequeno[a]?)\b/giu],
 ["Contexto","trabalho",/\b(trabalho|emprego|escritório|empresa)\b/giu],
 ["Contexto","casa",/\b(casa|cozinha|quarto)\b/giu],
 ["Experiência relatada","sonho",/\b(sonhei|sonho|sonhava|pesadelo|sonhando)\b/giu],
 ["Experiência relatada","medo",/\b(medo|assustad[oa]|assustou)\b/giu],
 ["Experiência relatada","ansiedade",/\b(ansiedade|ansios[oa]|angústia|angustiad[oa])\b/giu],
 ["Referência temporal","passado",/\b(ontem|antigamente|antes|quando era criança|na infância)\b/giu],
 ["Referência temporal","recente",/\b(hoje|essa semana|esta semana|semana passada|agora)\b/giu],
 ["Referência temporal","futuro",/\b(amanhã|na próxima semana|depois)\b/giu]
];
function ecoExtractEvidence(text,sessionId="rascunho"){
 if(typeof text!=="string"||!text.trim())return [];
 let lines=[...text.matchAll(/[^\n.!?…]+[.!?…]?/gu)],out=[],seen=new Set();
 for(const match of lines){
  const quote=match[0].trim();if(!quote)continue;
  const offset=(match.index||0)+match[0].indexOf(quote);
  for(const [category,label,rx] of ecoLexicon){
   // JavaScript \b does not treat accented letters as word characters.
   // Unicode lookarounds keep mãe, irmão, infância etc. matched reliably.
   const pattern=rx.source.replace(/^\\b/,"").replace(/\\b$/,"");
   const unicodeRx=new RegExp("(?<![\\p{L}\\p{N}])(?:"+pattern+")(?![\\p{L}\\p{N}])","giu");
   for(const term of quote.matchAll(unicodeRx)){
    const at=term.index||0,begin=Math.max(0,at-45),prior=quote.slice(begin,at);
    const neg=/\b(não|nunca|jamais|sem)\s+(?:(?:tenho|tinha|sinto|sentia|estou|estava|me|eu|havia|tive|é)\s+)?(?:\w+\s+){0,2}$/iu.test(prior);
    const fingerprint=Array.from(quote).reduce((n,ch)=>((n*33)^ch.charCodeAt(0))>>>0,5381).toString(36);
    const key=[category,label,offset+at,fingerprint].join(":");
    if(seen.has(key))continue;seen.add(key);
    out.push({id:"ev:"+sessionId+":"+key,sessionId,category,label,
      quote,start:offset+at,end:offset+at+term[0].length,
      polarity:neg?"possível negação":"menção",
      speaker:"desconhecido",status:"sugerido",source:"transcrição",
      timeMs:null});
   }
  }
 }
 return out.slice(0,250);
}

/**
 * Deterministic WER (word error rate). No external model or network.
 * Compare only with a human-verified reference; never use a hypothesis as its own target.
 * Complexity O(referenceWords*hypothesisWords), O(hypothesisWords) memory.
 */
function ecoWordTokens(source){
 return String(source||"").toLocaleLowerCase("pt-BR").normalize("NFC")
   .replace(/[^\p{L}\p{N}]+/gu," ").trim().split(/\s+/u).filter(Boolean);
}
function ecoCalculateWer(reference,hypothesis){
 const expected=ecoWordTokens(reference),actual=ecoWordTokens(hypothesis);
 if(!expected.length)throw Error("Cole uma transcrição de referência verificada.");
 if(expected.length>5000||actual.length>5000)
   throw Error("Teste WER limitado a cinco mil palavras por texto para evitar travamentos.");
 let prev=Array.from({length:actual.length+1},(_,i)=>i);
 for(let i=1;i<=expected.length;i++){
  const row=new Array(actual.length+1);row[0]=i;
  for(let j=1;j<=actual.length;j++){
   const sub=prev[j-1]+(expected[i-1]===actual[j-1]?0:1);
   row[j]=Math.min(prev[j]+1,row[j-1]+1,sub);
  }
  prev=row;
 }
 return {distance:prev[actual.length],referenceWords:expected.length,
  recognizedWords:actual.length,wer:prev[actual.length]/expected.length};
}

function ecoEvidenceCurrent(session,evidence){
 if(!session || !evidence || evidence.status!=="confirmado")return false;
 const source=String(session.mlRevisada?.trim()||session.mlTranscricao||"");
 const quote=String(evidence.quote||"").trim();
 return quote.length>0 && source.includes(quote);
}
function ecoLongitudinalEvidence(sessions){
 const byLabel=new Map();
 for(const s of sessions||[]){
  const es=(s.mlEvidence||[]).filter(e=>ecoEvidenceCurrent(s,e));
  for(const e of es){
   const key=String(e.category||"")+"|"+String(e.label||"");
   if(!byLabel.has(key))byLabel.set(key,[]);
   byLabel.get(key).push({...e,sessionId:s.id,sessionDate:s.data});
  }
 }
 return [...byLabel].map(([key,items])=>{
  const ids=new Set(items.map(e=>e.sessionId));
  const polarities=new Set(items.map(e=>e.polarity));
  return {key,label:items[0]?.label||"",category:items[0]?.category||"",
   sessions:ids.size,mentions:items.length,items,
   textualVariation:polarities.has("menção")&&polarities.has("possível negação")};
 }).filter(x=>x.sessions>=2).sort((a,b)=>b.sessions-a.sessions||b.mentions-a.mentions);
}

function ecoEvidenceForDraft(){
 if(!sessionDraft)return [];
 ecoEnsure();
 const reviewed=!!sessionDraft.mlRevisada?.trim();
 const source=reviewed?sessionDraft.mlRevisada:sessionDraft.mlTranscricao||"";
 const existing=new Set((sessionDraft.mlEvidence||[]).map(x=>x.id));
 const evidences=ecoExtractEvidence(source,sessionDraft.id).filter(x=>!existing.has(x.id));
 for(const e of evidences)e.source=reviewed?"transcrição revisada":"transcrição automática";
 // Speaker and source time are groundable only against unchanged raw ASR text.
 if(!reviewed){
  const ranges=[];let cursor=0;
  for(const segment of sessionDraft.mlSegments){
   const text=String(segment.text||"").trim();
   const at=source.indexOf(text,cursor);
   if(at>=0){ranges.push({from:at,to:at+text.length,segment});cursor=at+text.length}
  }
  for(const e of evidences){
   const r=ranges.find(r=>e.start>=r.from&&e.start<r.to);
   if(r){e.speaker=r.segment.speaker||"desconhecido";e.timeMs=r.segment.startMs??null}
  }
 }
 return evidences;
}

// emotional motive, truthfulness or unconscious meaning. Every item cites source.
const ecoActionRules=[
 {kind:"Sonho relatado",verb:/\b(sonhei|sonhava|sonhou|sonhar|pesadelo)\b/giu},
 {kind:"Lembrança relatada",verb:/\b(lembrei|lembrava|recordo|recordava|me lembro|me recordo)\b/giu},
 {kind:"Comunicação relatada",verb:/\b(disse|falou|falei|perguntou|respondeu|gritou|pedi|conversei|contou)\b/giu},
 {kind:"Mudança relatada",verb:/\b(mudei|mudou|mudamos|saí|entrei|comecei|terminei|parei)\b/giu},
 {kind:"Espera relatada",verb:/\b(esperei|esperava|espero|aguardei|aguardava)\b/giu},
 {kind:"Experiência relatada",verb:/\b(senti|sentia|sinto|chorei|chorava|acordei|tremia|tive medo)\b/giu},
 {kind:"Conflito relatado",verb:/\b(briguei|brigamos|discuti|discutimos|brigou|discutiu)\b/giu},
 {kind:"Perda mencionada",verb:/\b(perdi|perdeu|morreu|falecimento|morte)\b/giu}
];
function ecoSourceUnits(session){
 const revised=!!session?.mlRevisada?.trim();
 if(revised){
  return String(session.mlRevisada).split(/(?<=[.!?…])\s+|\n+/u)
     .filter(x=>x.trim()).map(text=>({text,atMs:null,speaker:"desconhecido",source:"revisada"}));
 }
 const segments=session?.mlSegments||[];
 if(segments.length)return segments.flatMap(e=>String(e.text||"").split(/(?<=[.!?…])\s+|\n+/u)
    .filter(x=>x.trim()).map(text=>({text,atMs:e.startMs??null,speaker:e.speaker||"desconhecido",source:"automática"})));
 return String(session?.mlTranscricao||"").split(/(?<=[.!?…])\s+|\n+/u)
    .filter(x=>x.trim()).map(text=>({text,atMs:null,speaker:"desconhecido",source:"automática"}));
}
function ecoStructuredEvents(session){
 const results=[],seen=new Set();
 for(const unit of ecoSourceUnits(session)){
  const quote=unit.text.trim();if(!quote)continue;
  const entities=[...new Set(ecoExtractEvidence(quote,session?.id||"rascunho").map(e=>e.label))];
  const dates=(quote.match(/\b(ontem|hoje|amanhã|semana passada|na infância|quando era criança|naquele dia|à noite|pela manhã)\b/giu)||[]);
  for(const rule of ecoActionRules){
   const pattern=new RegExp(rule.verb.source,"giu");
   for(const m of quote.matchAll(pattern)){
    const before=quote.slice(Math.max(0,(m.index||0)-45),m.index||0);
    const negative=/\b(não|nunca|jamais)\s+(?:(?:me|se|eu|ele|ela)\s+)?(?:\p{L}+\s+){0,2}$/iu.test(before);
    const key=[session?.id||"rascunho",rule.kind,quote,m.index].join("|");
    if(seen.has(key))continue;seen.add(key);
    const hash=Array.from(key).reduce((x,ch)=>((x*31)^ch.charCodeAt(0))>>>0,7).toString(36);
    results.push({id:"action:"+hash,kind:rule.kind,verb:m[0],quote,
      atMs:unit.atMs,source:unit.source,speaker:unit.speaker,
      polarity:negative?"possível negação":"relato",
      timeReference:dates[0]||null,
      peopleOrContext:entities,status:"sugerido"});
   }
  }
 }
 return results.slice(0,250);
}
function ecoEventCurrent(session,e){
 const text=session?.mlRevisada?.trim()||session?.mlTranscricao||"";
 return !!e&&e.status==="confirmado"&&!!e.quote&&String(text).includes(e.quote);
}

function ecoWordKey(value){
 let w=String(value||"").toLocaleLowerCase("pt-BR").normalize("NFD").replace(/[\u0300-\u036f]/gu,"");
 const aliases={maes:"mae",mae:"mae",sonhei:"sonho",sonhava:"sonho",sonhando:"sonho",sonhos:"sonho",
 pesadelos:"pesadelo",escadas:"escada",onibus:"onibus",trabalhando:"trabalho",trabalhei:"trabalho",
 irmaos:"irmao",irmas:"irma",pais:"pai",criancas:"crianca",lembrancas:"lembranca",lembrava:"lembranca",
 esperava:"esperar",esperando:"esperar",esperei:"esperar",medos:"medo",crises:"crise"};
 return aliases[w]||w;
}
function ecoWordRows(session){
 const raw=session?.mlSegments||[];
 const rows=raw.length?raw.map((e,i)=>({...e,index:i})):
  [{text:session?.mlTranscricao||"",startMs:null,endMs:null,index:0,speaker:"desconhecido"}];
 const counts=new Map(),locations=new Map(),total=new Set();
 for(const item of rows){
  for(const token of String(item.text||"").matchAll(/[\p{L}]{2,}/gu)){
   const key=ecoWordKey(token[0]);
   if(key.length<3||ecoNlpStop.has(key)||/^\d+$/u.test(key))continue;
   counts.set(key,(counts.get(key)||0)+1);
   if(!locations.has(key))locations.set(key,[]);
   locations.get(key).push({atMs:Number.isFinite(item.startMs)?item.startMs:null,
      speaker:item.speaker||"desconhecido",index:item.index,
      quote:String(item.text||"").trim()});
   total.add(item.index);
  }
 }
 return [...counts].map(([word,count])=>({word,count,
   locations:locations.get(word)||[]}))
  .sort((a,b)=>b.count-a.count||a.word.localeCompare(b.word,"pt-BR"));
}
function ecoNlpSignals(session){
 const segments=ecoSourceUnits(session),negations=[],interruptions=[];
 for(const item of segments){
  const quote=String(item.text||"").trim();if(!quote)continue;
  const neg=[...quote.matchAll(/(?<![\p{L}])(?:não|nunca|jamais|nem|sem)(?![\p{L}])/giu)];
  for(const m of neg){
   negations.push({word:m[0],quote,atMs:item.atMs??null,speaker:item.speaker||"desconhecido"});
  }
  // Literal trailing punctuation only; ASR punctuation may be unreliable.
  if(/(?:\.{3}|…|—)\s*$/u.test(quote) && !/["'»]\s*$/u.test(quote)){
    interruptions.push({quote,atMs:item.atMs??null,speaker:item.speaker||"desconhecido"});
  }
 }
 return {negations:negations.slice(0,150),interruptions:interruptions.slice(0,80)};
}

 }
 if((ecoIsCapturing()||ecoIsPaused()) && ["nav","openCase","newCase","newSession","editSession","saveSession","ecoOpen"].includes(name)){
  notify("Encerre o processamento do áudio antes de sair ou salvar.",'red');return;
 }
 if(name==="ecoImportFile"){

  if(!ecoConsent){notify("Confirme a declaração antes da importação.",'red');return}

   if(ecoIsCapturing()||ecoIsPaused()){notify("Finalize o áudio temporário antes de abrir outra sessão.",'red');return;}
   const [caseId,sessionId,atText]=String(id||"").split("|");

   if(target&&target.scrollIntoView)target.scrollIntoView({behavior:"smooth",block:"center"});
   return;
 }
 if(name==="ecoWorkspaceTab"){ecoWorkspaceTab=id;render();return}
 if(name==="ecoTagsCategory"){ecoCategory=id;render();return}
 if(name==="ecoBenchmark"){
   try{
     if(!sessionDraft?.mlTranscricao?.trim())throw Error("Ainda não existe transcrição automática.");
     const val=ecoCalculateWer(ecoReferenceText,sessionDraft.mlTranscricao);
     ecoBenchmarkResult={...val,wer:Math.round(val.wer*1000)/10};
     render();
   }catch(e){ecoBenchmarkResult=null;notify("Não foi possível medir: "+e.message,'red')}
   return;
 }
 if(name==="ecoRemoveEvidence"){
   ecoEnsure();
   const before=JSON.stringify(sessionDraft.mlEvidence);
   sessionDraft.mlEvidence=sessionDraft.mlEvidence.filter(e=>e.id!==id);
   if(before===JSON.stringify(sessionDraft.mlEvidence))return;
   const payload={caseId:openedId,session:JSON.parse(JSON.stringify(sessionDraft))};
   const result=window.NativeVault.saveDraft?window.NativeVault.saveDraft(JSON.stringify(payload)):(state.mlDraft=payload,persist()?"OK":"ERRO");
   if(result!=="OK"){sessionDraft.mlEvidence=JSON.parse(before);notify("Falha ao remover marcação: "+result,'red');return;}
   render();return;
 }
 if(name==="ecoAcceptEvent"){
  const event=ecoStructuredEvents(sessionDraft).find(x=>x.id===id);
  if(!event)return;
  ecoEnsure();const old=JSON.stringify(sessionDraft.mlEvents);
  sessionDraft.mlEvents.push({...event,status:"confirmado",reviewedAt:new Date().toISOString()});
  const json=JSON.stringify({caseId:openedId,session:sessionDraft});
  const status=window.NativeVault.saveDraft?window.NativeVault.saveDraft(json):(state.mlDraft={caseId:openedId,session:sessionDraft},persist()?"OK":"ERRO");
  if(status!=="OK"){sessionDraft.mlEvents=JSON.parse(old);notify("Não foi possível salvar ocorrência: "+status,"red");return;}
  render();return;
 }
 if(name==="ecoAcceptEvidence"){
   const item=ecoEvidenceForDraft().find(e=>e.id===id);
   if(!item)return;
   ecoEnsure();const before=JSON.stringify(sessionDraft.mlEvidence);
   sessionDraft.mlEvidence.push({...item,status:"confirmado",reviewedAt:new Date().toISOString(),reviewer:"usuário"});
   const payload={caseId:openedId,session:JSON.parse(JSON.stringify(sessionDraft))};
   let result="OK";
   if(window.NativeVault.saveDraft)result=window.NativeVault.saveDraft(JSON.stringify(payload));
   else {state.mlDraft=payload;result=persist()?"OK":"Erro ao salvar"}
   if(result!=="OK"){sessionDraft.mlEvidence=JSON.parse(before);notify("Não foi possível confirmar sem salvar: "+result,'red');return}
   render();return;
 }
 if(name==="ecoSave"){
   if(ecoIsCapturing()||ecoIsPaused()){notify("Pause para revisar, mas antes de salvar conclua ou descarte o áudio restante.",'red');return;}
   return ecoActBase("saveSession");
 }
 if(name==="ecoBackCase"){if(ecoIsCapturing()||ecoIsPaused()){notify("Conclua ou descarte o áudio temporário antes de sair.",'red');return;}return ecoActBase("openCase",openedId)}
 if(name==="ecoStart" && !ecoIsCapturing() && ecoConsent){
  if(!ecoDocumentConsent())return;
 }
 const previous=screen;
 const result=ecoActBase(name,id);
 if(name==="ecoOpen"||name==="newSession"||name==="editSession"){
   ecoWorkspaceTab=(name==="editSession"?"analise":"captura");
   ecoReferenceText="";ecoBenchmarkResult=null;ecoTimelineQuery="";ecoSelectedWord="";render();
 }
 if(name==="nav"&&id==="atlas"&&previous!=="atlas"){ecoOverviewCase=openedId||state?.cases?.[0]?.id||null}
 return result;
};
document.addEventListener("input",e=>{
 if(e.target?.dataset?.ecoConsentReference!==undefined)ecoConsentReference=e.target.value||"";
 if(e.target?.dataset?.ecoTimelineSearch!==undefined)ecoTimelineQuery=e.target.value||"";
 if(e.target?.dataset?.ecoReference!==undefined){ecoReferenceText=e.target.value||"";ecoBenchmarkResult=null;}
});
document.addEventListener("change",e=>{
 if(e.target?.dataset?.ecoAsrModel){ecoChosenAsr=e.target.value==="base"?"base":"small"}
 if(e.target?.dataset?.ecoMicEngine){ecoChosenMic=["whisper-base","whisper-small"].includes(e.target.value)?e.target.value:"whisper-small"}
 if(e.target?.dataset?.ecoConsentKind){ecoConsentKind=e.target.value==="autorizado"?"autorizado":"simulacao";render()}
 if(e.target?.dataset?.ecoAtlasCase){ecoOverviewCase=e.target.value;render()}
 if(e.target?.dataset?.ecoSpeaker!==undefined&&sessionDraft){
  const ix=Number(e.target.dataset.ecoSpeaker),value=e.target.value;
  if(!["paciente","terapeuta","desconhecido"].includes(value)||!sessionDraft.mlSegments?.[ix])return;
  const old=sessionDraft.mlSegments[ix].speaker;
  sessionDraft.mlSegments[ix].speaker=value;
  const payload={caseId:openedId,session:JSON.parse(JSON.stringify(sessionDraft))};
  const result=window.NativeVault.saveDraft?window.NativeVault.saveDraft(JSON.stringify(payload)):(state.mlDraft=payload,persist()?"OK":"Falha");
  if(result!=="OK"){sessionDraft.mlSegments[ix].speaker=old;notify("Não foi possível salvar alteração de falante.",'red')}
 }
});
const ecoPriorDisplay=ecoDisplay;
ecoDisplay=function(){
 ecoPriorDisplay();
 const banner=document.querySelector("#ecoStatusBanner");
 if(banner&&banner.classList){banner.classList.toggle("capturing",ecoIsCapturing())}
};


const ecoOldPdfForCase=pdfForCase;
pdfForCase=function(c){
 const base=ecoOldPdfForCase(c);
 const section=(c.sessoes||[]).map(s=>{
   const title='<h3>Registro íntegro da sessão '+esc(formatDate(s.data))+'</h3>';
   const record='<p><strong>Registro da condição da gravação:</strong> '+esc(s.mlConsent?.kind||"Não documentado")+
  ' · '+esc(s.mlConsent?.attestedAt||"Sem declaração")+
  ' · referência '+esc(s.mlConsent?.documentReference||"Não informada")+'</p>'+
  '<p><strong>Transcrição automática sem correção:</strong> '+esc(s.mlTranscricao||"Não registrada")+'</p>'+
   '<p><strong>Versão corrigida pelo profissional:</strong> '+esc(s.mlRevisada||"Não revisada")+'</p>'+
   '<p><strong>Marcações manuais:</strong> '+esc((s.mlTags||[]).join(" · ")||"Nenhuma")+'</p>';
   const clips='<h4>Trechos e proveniência</h4>'+(s.mlSegments||[]).map((e,i)=>
     '<p><small>'+esc(String(i+1))+' · '+esc(e.origem||"Motor não identificado")+
     ' · falante '+esc(e.speaker||"desconhecido")+
     ' · '+esc(e.startMs==null?"sem posição no áudio":Math.round(e.startMs/1000)+"s")+
     '</small> '+esc(e.text||"")+'</p>').join('');
   const evidence='<h4>Menções confirmadas e válidas</h4>'+(s.mlEvidence||[]).filter(e=>ecoEvidenceCurrent(s,e)).map(e=>
     '<p><strong>'+esc(e.category||"Tema")+" · "+esc(e.label||"")+'</strong> — “'+esc(e.quote||"")+
     '” <small>'+esc(e.polarity||"menção")+" · "+esc(e.speaker||"desconhecido")+
  " · minuto "+esc(ecoTimecode(e.timeMs))+'</small></p>').join('');
   const staleEvidence=(s.mlEvidence||[]).filter(e=>e.status==="confirmado"&&!ecoEvidenceCurrent(s,e));
   const outdated='<h4>Referências desatualizadas</h4>'+staleEvidence.map(e=>'<p>“'+esc(e.quote||"")+
   '” — alterada ou ausente na transcrição revisada, não considerada evidência atual</p>').join('');
   const actions='<h4>Eventos relatados e confirmados</h4>'+(s.mlEvents||[]).filter(e=>ecoEventCurrent(s,e)).map(e=>
   '<p><strong>'+esc(e.kind)+'</strong> '+esc(ecoTimecode(e.atMs))+' · “'+esc(e.quote)+'”</p>').join('');
   const history='<p><small>Versões anteriores preservadas: '+(s.revisoes||[]).length+'</small></p>';
   return '<section style="break-before:page">'+title+record+clips+evidence+actions+outdated+history+'</section>';
 }).join('');
 return base.replace('</body></html>',
  '<h2>Anexo técnico: transcrição, trechos e evidências</h2>'+
  '<p><strong>Atenção:</strong> este documento não é criptografado ao ser impresso ou exportado em PDF; controle o destino. Rótulos de falantes dependem de revisão humana. Sugestões de NLP não validadas nunca equivalem a diagnóstico.</p>'+
  section+'</body></html>');
};
