      if(ana.experienciasAnteriores) body += '<p><strong>Terapias e intervenções anteriores:</strong> '+esc(deidentify(ana.experienciasAnteriores))+'</p>';
      if(ana.sintomatologia) body += '<p><strong>Sintomatologia e sofrimento:</strong> '+esc(deidentify(ana.sintomatologia))+'</p>';
      if(ana.historia_queixa) body += '<p><strong>História da queixa:</strong> '+esc(deidentify(ana.historia_queixa))+'</p>';
      if(ana.nascimentoPrimeirosAnos) body += '<p><strong>Nascimento e primeiros anos:</strong> '+esc(deidentify(ana.nascimentoPrimeirosAnos))+'</p>';
      if(ana.infanciaEscola) body += '<p><strong>Infância e escolarização:</strong> '+esc(deidentify(ana.infanciaEscola))+'</p>';
      if(ana.adolescenciaCrises) body += '<p><strong>Adolescência e crises:</strong> '+esc(deidentify(ana.adolescenciaCrises))+'</p>';
      if(ana.figuraMaterna) body += '<p><strong>Relação materna:</strong> '+esc(deidentify(ana.figuraMaterna))+'</p>';
      if(ana.figuraPaterna) body += '<p><strong>Relação paterna:</strong> '+esc(deidentify(ana.figuraPaterna))+'</p>';
      if(ana.irmaosParentes) body += '<p><strong>Irmãos e dinâmica familiar:</strong> '+esc(deidentify(ana.irmaosParentes))+'</p>';
      if(ana.mitosSegredos) body += '<p><strong>Segredos familiares e lutos transgeracionais:</strong> '+esc(deidentify(ana.mitosSegredos))+'</p>';
      if(ana.parceriasAfetivas) body += '<p><strong>Relações afetivas e amorosas:</strong> '+esc(deidentify(ana.parceriasAfetivas))+'</p>';
      if(ana.amizadesConvivio) body += '<p><strong>Amizades e sociabilidade:</strong> '+esc(deidentify(ana.amizadesConvivio))+'</p>';
      if(ana.padroesVinculo) body += '<p><strong>Padrões de vinculação:</strong> '+esc(deidentify(ana.padroesVinculo))+'</p>';
      if(ana.sexualidadeRelatada) body += '<p><strong>Vivência afetivo-sexual:</strong> '+esc(deidentify(ana.sexualidadeRelatada))+'</p>';
      if(ana.vidaProfissional) body += '<p><strong>Trabalho e vida profissional:</strong> '+esc(deidentify(ana.vidaProfissional))+'</p>';
      if(ana.medicacoesUso) body += '<p><strong>Medicamentos e tratamentos médicos:</strong> '+esc(deidentify(ana.medicacoesUso))+'</p>';
      if(ana.substanciasUso) body += '<p><strong>Uso de substâncias:</strong> '+esc(deidentify(ana.substanciasUso))+'</p>';
      if(ana.padroesSono) body += '<p><strong>Padrões de sono e descanso:</strong> '+esc(deidentify(ana.padroesSono))+'</p>';
      if(ana.apetiteRitmos) body += '<p><strong>Alimentação e rotinas vitais:</strong> '+esc(deidentify(ana.apetiteRitmos))+'</p>';
      if(ana.sintomasSomaticos) body += '<p><strong>Manifestações somáticas:</strong> '+esc(deidentify(ana.sintomasSomaticos))+'</p>';
      if(ana.lutosSignificativos) body += '<p><strong>Lutos marcantes:</strong> '+esc(deidentify(ana.lutosSignificativos))+'</p>';
      if(ana.recursosEnfrentamento) body += '<p><strong>Recursos pessoais e interesses:</strong> '+esc(deidentify(ana.recursosEnfrentamento))+'</p>';
      if(ana.redeApoioEfetiva) body += '<p><strong>Rede de apoio efetiva:</strong> '+esc(deidentify(ana.redeApoioEfetiva))+'</p>';
    }
    if(c.familia) body += '<p><strong>Histórico familiar:</strong> '+esc(deidentify(c.familia))+'</p>';
    if(c.relacoes) body += '<p><strong>Relações significativas:</strong> '+esc(deidentify(c.relacoes))+'</p>';
    if(c.recursos) body += '<p><strong>Recursos e rede de apoio:</strong> '+esc(deidentify(c.recursos))+'</p>';
  }

  if(sections.sessoes){
    let ss = (c.sessoes||[]).filter(s=>!opts.sessionId||s.id===opts.sessionId).slice().reverse();
    if(opts.docDateFrom){ ss = ss.filter(s => (s.data||'') >= opts.docDateFrom); }
    if(opts.docDateTo){ ss = ss.filter(s => (s.data||'') <= opts.docDateTo); }
    body += '<h2>4. Registros das Sessões Selecionadas ('+ss.length+')</h2>';
    if(ss.length){
      body += ss.map(s=>'<div style="margin:10px 0;padding-bottom:10px;border-bottom:1px solid #ddd">'+
        '<strong>Sessão de '+formatDate(s.data)+'</strong>'+
        '<p>'+esc(deidentify(s.texto||'')).replace(/\n/g,'<br>')+'</p>'+
        (s.intervencoes?'<p class="small"><strong>Intervenções:</strong> '+esc(deidentify(s.intervencoes))+'</p>':'')+
        (s.plano?'<p class="small"><strong>Próximos passos:</strong> '+esc(deidentify(s.plano))+'</p>':'')+
        '</div>').join('');
    } else { body += '<p class="muted">Nenhuma sessão encontrada para o período selecionado.</p>'; }
  }

  if(['ficha','transcricao','sessao'].includes(type)&&(sections.bruto||sections.revisado||sections.falantes)){
    const ss=(c.sessoes||[]).filter(s=>(!opts.sessionId||s.id===opts.sessionId)&&(!opts.docDateFrom||s.data>=opts.docDateFrom)&&(!opts.docDateTo||s.data<=opts.docDateTo));
    body+='<h2>Anexo de transcrições selecionadas</h2>'+ss.map(s=>'<section class="doc-session"><h3>'+esc(formatDate(s.data))+'</h3>'+
      (sections.bruto?'<h4>Texto bruto</h4><p class="pre">'+esc(s.mlTranscricao||'Não registrado')+'</p>':'')+
      (sections.revisado?'<h4>Texto revisado</h4><p class="pre">'+esc(s.mlRevisada||'Não revisado')+'</p>':'')+
      (sections.falantes?'<h4>Trechos e falantes</h4>'+(s.mlSegments||[]).map(e=>'<p><strong>'+esc(ecoTimecode(e.startMs))+' · '+esc(e.speaker||'desconhecido')+'</strong> '+esc(e.text||'')+'</p>').join(''):'')+'</section>').join('');
  }
  if(sections.graficos){
    const ss=(c.sessoes||[]).filter(s=>(!opts.sessionId||s.id===opts.sessionId)&&(!opts.docDateFrom||s.data>=opts.docDateFrom)&&(!opts.docDateTo||s.data<=opts.docDateTo)),counts=new Map();
    for(const s of ss)for(const t of new Set(s.mlTags||[]))counts.set(t,(counts.get(t)||0)+1);
    body+='<h2>Indicadores longitudinais</h2><p>Contagem de sessões com cada marcação; não indica gravidade, diagnóstico ou melhora clínica.</p>'+[...counts].sort((a,b)=>b[1]-a[1]).map(([t,n])=>'<div class="doc-bar"><strong>'+esc(deidentify(t))+' · '+n+'</strong><div style="background:#185b50;width:'+Math.round(100*n/Math.max(1,ss.length))+'%;height:8px"></div></div>').join('');
  }
  if(sections.investigacao&&['ficha','evolucao'].includes(type)&&(c.ecoQuestions||[]).length){body+='<h2>Perguntas de acompanhamento</h2>'+(c.ecoQuestions||[]).map(q=>'<p><strong>'+esc(q.text)+'</strong> · '+esc(ecoQuestionStatus.find(v=>v[0]===q.status)?.[1]||q.status)+'</p>'+(q.note?'<p>'+esc(q.note)+'</p>':'')).join('');}
  if(sections.investigacao && c.investigacaoAxes){
    body += '<h2>5. Eixos de Investigação</h2>';
    const active = Object.entries(c.investigacaoAxes).filter(([k,v])=>v.nota);
    if(active.length){
      body += active.map(([k,v])=>{
        const axis = ecoInvestigationAxes.find(a=>a.id===k);
        return '<p><strong>'+esc(axis?axis.nome:k)+':</strong> '+esc(deidentify(v.nota))+' ('+esc(v.status||'em curso')+')</p>';
      }).join('');
    } else { body += '<p class="muted">Sem apontamentos registrados nos eixos.</p>'; }
  }

  if(sections.hipoteses && c.hipotesesList?.length){
    body += '<h2>6. Hipóteses Clínicas Formuladas</h2>'+
      c.hipotesesList.map(h=>'<div style="margin:6px 0"><strong>'+esc(deidentify(h.texto))+'</strong>'+
        (h.favoraveis?'<p class="small"><em>Evidências a favor:</em> '+esc(deidentify(h.favoraveis))+'</p>':'')+
        (h.contrarias?'<p class="small"><em>Evidências contrárias:</em> '+esc(deidentify(h.contrarias))+'</p>':'')+
        '</div>').join('');
  }

  if(sections.tecnicas && c.intervencoesList?.length){
    body += '<h2>7. Técnicas e Intervenções</h2>'+
      c.intervencoesList.map(i=>'<p>'+formatDate(i.data||datestr())+' — <strong>'+esc(i.tecnica)+':</strong> '+esc(deidentify(i.efeito||i.resposta||''))+'</p>').join('');
  }

  if(sections.sonhos && c.sonhosList?.length){
    body += '<h2>8. Produções Oníricas Registradas</h2>'+
      c.sonhosList.map(d=>'<div style="margin:6px 0"><strong>Sonho em '+formatDate(d.data)+':</strong> “'+esc(deidentify(d.texto))+'”'+
        (d.associacoes?'<p class="small"><em>Associações:</em> '+esc(deidentify(d.associacoes))+'</p>':'')+
        '</div>').join('');
  }

  if(sections.genograma && c.genograma?.membros?.length){
    body += '<h2>9. Dinâmica Familiar e Transgeracional</h2>'+
      '<p>Membros catalogados no genograma: '+c.genograma.membros.map(m=>esc(deidentify(m.nome))+' ('+esc(m.parentesco||'')+')').join(', ')+'</p>'+(type==='ficha'?(ecoRenderGenogram(c,'genograma').match(/<svg[\s\S]*?<\/svg>/)?.[0]||'').replace(/width="\d+" height="\d+"/,'width="100%" height="auto"'):'');
  }

  if(sections.cronologia && c.cronologia?.length){
    body += '<h2>10. Cronologia Biográfica</h2>'+
      [...c.cronologia].sort((a,b)=>(a.ano||'').localeCompare(b.ano||'')).map(e=>'<p><strong>'+esc(e.ano||'Data incerta')+' · '+esc(deidentify(e.titulo))+':</strong> '+esc(deidentify(e.descricao||''))+'</p>').join('');
  }

  if(sections.seguranca && c.seguranca?.plano){
    body += '<h2>11. Plano de Segurança Clínica</h2>'+
      '<p><strong>Estratégias acordadas:</strong> '+esc(deidentify(c.seguranca.plano))+'</p>';
  }

  if(sections.rede&&['ficha','evolucao'].includes(type)&&ecoNetworkRows(c).length){body+='<h2>Rede social e afetiva relatada</h2>'+ecoNetworkSvg(c)+ecoNetworkRows(c).map(x=>'<p><strong>'+esc(x.name)+'</strong> · '+esc(ecoNetworkKinds.find(k=>k[0]===x.kind)?.[1]||'Outros')+' · '+esc(ecoNetworkRelations.find(k=>k[0]===x.relation)?.[1]||'Não informado')+' · '+esc(ecoNetworkSource(c,x))+'</p>').join('');}
  if(sections.fechamento&&['ficha','sessao','evolucao'].includes(type)){const ss=(c.sessoes||[]).filter(s=>(!opts.sessionId||s.id===opts.sessionId)&&(!opts.docDateFrom||s.data>=opts.docDateFrom)&&(!opts.docDateTo||s.data<=opts.docDateTo));body+='<h2>Fechamentos revisados</h2>'+ss.map(s=>{const x=c.ecoVisitClosure?.[s.id];if(x?.status!=='revisado')return '';const valid=(x.sourceIds||[]).every(id=>ecoVisitSourceIds(c,s.id).some(r=>r.id===id));if(!valid)return '<p>'+esc(formatDate(s.data))+' — fontes alteradas, fechamento requer nova revisão.</p>';return '<h3>'+esc(formatDate(s.data))+'</h3><p>'+esc(x.summary)+'</p><p>Intervenções: '+esc(x.interventions||'Não registradas')+'</p><p>Continuidade: '+esc(x.next||'Não registrada')+'</p><p>Incertezas: '+esc(x.uncertainty||'Não registradas')+'</p>';}).join('');}
  if(sections.plano){
    body += '<h2>12. Observações e Plano de Continuidade</h2>';
    if(c.obs && c.obs.trim().length > 0){
      body += '<p>'+esc(deidentify(c.obs))+'</p>';
    } else {
      body += '<p class="muted">Sem observações complementares registradas.</p>';
    }
  }

  const profHeader = (opts.profNome || opts.profRegistro)
    ? `<div style="margin-bottom:12px;font-size:12px;color:#334155;border-bottom:1px dashed #cbd5e1;padding-bottom:6px">
         <strong>Profissional Responsável:</strong> ${esc(opts.profNome||'')} · <strong>Registro:</strong> ${esc(opts.profRegistro||'')} · ${esc(opts.profContato||'')}
       </div>`
    : '';

  const footerText = opts.confirmed
    ? `Documento revisado e liberado pelo profissional responsável em ${esc(formatDate(datestr()))}; a geração técnica auxilia o registro e não substitui a assinatura física manual ou o julgamento clínico.`
    : `MINUTA NÃO CONFIRMADA · Exige revisão humana e confirmação explícita antes do uso oficial ou compartilhamento.`;

  return `<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><title>${title}</title><style>
    body{font:13px/1.5 Arial,sans-serif;color:#182b27;margin:35px}
    h1{font-size:20px;color:#125950;margin-bottom:4px}
    .doc-sub{font-size:11px;color:#666;margin-bottom:15px;border-bottom:2px solid #125950;padding-bottom:8px}
    h2{font-size:14px;color:#125950;border-bottom:1px solid #c2d6cd;margin-top:20px;padding-bottom:3px}
    p{margin:6px 0}
    .kv{margin:4px 0}
    .footer{margin-top:35px;border-top:1px solid #ccc;padding-top:10px;font-size:10px;color:#666}
    .alert-draft{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3;padding:8px;border-radius:4px}
    @page{size:A4;margin:17mm 16mm 19mm} body{overflow-wrap:anywhere} .pre{white-space:pre-wrap} h1,h2,h3,h4{break-after:avoid} .doc-bar{break-inside:avoid;margin:6px 0} p{orphans:3;widows:3} svg{max-width:100%;height:auto} @media print { body{margin:0} }
  </style></head><body>
    <h1>${title}</h1>
    <div class="doc-sub">ECO · SISTEMA DE REGISTRO CLÍNICO CONFIDENCIAL · Gerado em ${esc(formatDate(datestr()))} · Documento local</div>
    ${profHeader}
    ${body}
    <div style="margin-top:32px;break-inside:avoid"><p>________________________________________</p><p>Assinatura do profissional (manual) · ${esc(opts.profNome||'')}</p></div>
    <div class="footer ${opts.confirmed ? '' : 'alert-draft'}">
      <strong>Aviso ético e de privacidade:</strong> Documento de uso estritamente profissional, protegido por sigilo profissional e pela Lei Geral de Proteção de Dados (Lei 13.709/2018).
      <br>${footerText}
    </div>
  </body></html>`;
}

   '</section>';

function ecoAtlasScreen(){
 const count=state.cases.reduce((s,c)=>s+(c.sessoes||[]).length,0);
 let out=head("ECO / atlas","Memória das sessões","Recorrências documentadas — cada marcação remete a uma sessão, sem interpretação automatizada.");
 out+='<div class="main-stats"><div class="main-stat"><strong>'+state.cases.length+'</strong><span>Casos</span></div><div class="main-stat"><strong>'+count+'</strong><span>Sessões</span></div><div class="main-stat"><strong>'+state.cases.reduce((n,c)=>n+ecoSummary(c).mentions,0)+'</strong><span>Marcações</span></div></div>';
 if(!state.cases.length)return out+'<div class="card empty">Crie um caso fictício para começar.</div>';
 out+='<div class="field"><label for="ecoAtlasCase">Escolher caso</label><select id="ecoAtlasCase" data-eco-atlas-case>'+state.cases.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===(ecoOverviewCase||state.cases[0].id)?'selected':'')+'>'+caseName(c)+'</option>').join('')+'</select></div>';
 const c=state.cases.find(c=>c.id===(ecoOverviewCase||state.cases[0].id))||state.cases[0],ss=c.sessoes||[];
 const atlasTabs=[
  ['recorrencias','Recorrências & Histórico'],
  ['sonhos','Sonhos & Símbolos'],
  ['investigar','Eixos de Investigação'],
  ['tecnicas','Técnicas Clínicas'],
  ['genograma','Genograma & Cronologia'],
  ['diario','Diário do Terapeuta'],
  ['seguranca','Segurança Clínica'],
  ['documentos','Emissão de Documentos']
 ];
 out+='<div class="tabs">'+atlasTabs.map(([id,n])=>'<button type="button" data-act="ecoAtlasTab" data-id="'+id+'" class="'+(ecoAtlasTab===id?'active':'')+'">'+n+'</button>').join('')+'</div>';
 if(ecoAtlasTab==="sonhos")return out+ecoRenderDreamAtlas(c);
 if(ecoAtlasTab==="investigar")return out+ecoRenderInvestigation(c);
 if(ecoAtlasTab==="tecnicas")return out+ecoRenderTechniques(c);
 if(ecoAtlasTab==="genograma")return out+ecoRenderGenogram(c);
 if(ecoAtlasTab==="diario")return out+ecoRenderTherapistDiary(c);
 if(ecoAtlasTab==="seguranca")return out+ecoRenderClinicalSafety(c);
 if(ecoAtlasTab==="documentos")return out+ecoRenderDocuments(c);
 const counts=new Map();for(const s of ss){for(const tag of new Set(s.mlTags||[]))counts.set(tag,(counts.get(tag)||0)+1)}
 const frequent=[...counts].sort((a,b)=>b[1]-a[1]).slice(0,16);
 const verified=ss.flatMap(s=>(s.mlEvidence||[]).filter(e=>ecoEvidenceCurrent(s,e)).map(e=>({...e,sessionId:s.id,sessionDate:s.data}))).slice(-150);
 const repeated=ecoLongitudinalEvidence(ss);
 const stale=ss.flatMap(s=>(s.mlEvidence||[]).filter(e=>e.status==="confirmado"&&!ecoEvidenceCurrent(s,e)).map(e=>({...e,sessionDate:s.data})));
 const recordedEvents=ss.flatMap(s=>(s.mlEvents||[]).filter(e=>ecoEventCurrent(s,e)).map(e=>({...e,sessionId:s.id,sessionDate:s.data})));
 const eventCounts=new Map();
 for(const e of recordedEvents){
    const key=e.kind;
    if(!eventCounts.has(key))eventCounts.set(key,{sessions:new Set(),items:[]});
    eventCounts.get(key).sessions.add(e.sessionDate);
    eventCounts.get(key).items.push(e);
 }
 out+='<div class="eco-outline"><h2>Temas registrados</h2>'+ (frequent.length?frequent.map(([k,n])=>'<span class="chip">'+esc(k)+' · '+n+'</span>').join(''):'<p class="muted">Ainda não existem marcações.</p>')+'<p class="eco-caption">Contagens de marcações manuais, não de sintomas confirmados.</p></div>';
 out+='<div class="eco-outline"><h2>Recorrências entre sessões</h2>'+
 '<p class="eco-caption">Menções confirmadas em pelo menos duas sessões diferentes. São recorrências lexicais, não interpretações psicológicas.</p>'+
 (repeated.length?repeated.slice(0,18).map(group=>'<div class="eco-evidence"><strong>'+esc(group.category)+' · '+esc(group.label)+
 '</strong> <span class="eco-pill">'+group.sessions+' sessões</span>'+
 (group.textualVariation?'<p class="eco-caption">Formulações positivas e possivelmente negativas: conferir o contexto. Não significa contradição clínica.</p>':'')+
 group.items.slice(0,8).map(e=>'<p><small>'+esc(formatDate(e.sessionDate))+'</small> — “'+esc(e.quote)+'”</p>').join('')+
 '</div>').join(''):'<p class="muted">Nenhuma recorrência confirmada em múltiplas sessões.</p>')+'</div>';
 out+='<div class="eco-outline"><h2>Acontecimentos e falas confirmadas</h2>'+
 '<p class="eco-caption">Ações explicitamente mencionadas. Agrupadas por tipo e sessão; não são interpretações automáticas.</p>'+
 ([...eventCounts].length?[...eventCounts].map(([name,row])=>
 '<div class="eco-evidence"><strong>'+esc(name)+'</strong> · '+row.sessions.size+' sessão(ões)'+
 row.items.slice(0,10).map(e=>'<p><small>'+esc(formatDate(e.sessionDate))+' · '+esc(ecoTimecode(e.atMs))+
 '</small> “'+esc(e.quote)+'”'+(Number.isFinite(e.atMs)?btn('Ver no minuto','ecoJumpToSession','secondary','data-id="'+esc(c.id+'|'+e.sessionId+'|'+e.atMs)+'"'):'')+'</p>').join('')+'</div>').join(''):'<p class="muted">Não há eventos confirmados.</p>')+'</div>';
 out+='<div class="eco-outline"><h2>Evidências confirmadas</h2><p class="eco-caption">Somente confirmações humanas com citações ainda presentes no texto vigente.</p>'+

 (verified.length?verified.map(e=>'<div class="eco-evidence"><strong>'+esc(e.label)+' · '+esc(formatDate(e.sessionDate))+'</strong><p>“'+esc(e.quote)+'”</p><small>'+esc(e.category)+' · '+esc(e.polarity||"menção")+' · falante '+esc(e.speaker||"desconhecido")+' · minuto '+esc(ecoTimecode(e.timeMs))+'</small>'+
  (Number.isFinite(e.timeMs)?btn('Abrir sessão neste minuto','ecoJumpToSession','secondary','data-id="'+esc(c.id+'|'+e.sessionId+'|'+e.timeMs)+'"'):'')+'</div>').join(''):'<p class="muted">Ainda não há evidências confirmadas.</p>')+'</div>';
 if(stale.length)out+='<div class="eco-outline"><h2>Referências desatualizadas ('+stale.length+')</h2>'+
 '<p class="eco-caption">Menções anteriormente confirmadas cujo trecho não corresponde mais ao texto revisado. Não são tratadas como evidência válida.</p>'+
 stale.slice(0,25).map(e=>'<div class="eco-evidence">'+esc(formatDate(e.sessionDate))+' · '+esc(e.label)+' — “'+esc(e.quote)+'”</div>').join('')+'</div>';
 out+='<div class="eco-outline"><h2>Histórico das sessões</h2>'+ (ss.length?[...ss].sort((a,b)=>(b.data||'').localeCompare(a.data||'')).map(s=>'<div class="eco-evidence"><strong>'+esc(formatDate(s.data))+'</strong> <span class="eco-pill">'+(s.mlSegments?.length||0)+' trechos de áudio transcritos</span><p>'+esc((s.mlRevisada||s.texto||s.mlTranscricao||"Sem resumo").slice(0,270))+'</p><small>'+esc((s.mlTags||[]).slice(0,9).join(' · '))+'</small></div>').join(''):'<p class="muted">Nenhuma sessão registrada.</p>')+'</div>';
 return out;
}
const ecoRenderBase=render;
homeScreen=ecoLanding;ecoHubScreen=ecoSessionEntry;sessionScreen=ecoWorkspace;
const ecoActBase=act;
act=function(name,id,button){

  if(name.startsWith("ecoFicha")||name==="ecoLongStart"){
   const caseId=button?.dataset?.case;
   const c=state.cases.find(x=>x.id===caseId);
   if(!c||c.id!==openedId||screen!=="case"||tab!=="fichaEvolutiva"){notify("Contexto da ficha inválido.","red");return;}
   if(name==="ecoLongStart"){
    if(ecoNeuralRun?.pending){notify("Análise em andamento.");return;}
    const from=document.getElementById("ecoLongFrom")?.value||"",to=document.getElementById("ecoLongTo")?.value||"";
    if((from&&!validDate(from))||(to&&!validDate(to))||(from&&to&&from>to)){notify("Período inválido.","red");return;}
    ecoLongFrom=from;ecoLongTo=to;ecoNeuralStart(true);return;
   }
   if(name==="ecoFichaEdit"){if(!(c.fichaEvolutiva||[]).some(x=>x.id===id))return;ecoFichaEdit={caseId,id};render();return;}
   if(name==="ecoFichaCancel"){ecoFichaEdit=null;render();return;}
   if(name==="ecoFichaInspect"){
    const session=c.sessoes.find(x=>x.id===document.getElementById("fichaSession")?.value);
    const source=ecoFichaSource(session,document.getElementById("fichaOrigin")?.value);
    const el=document.getElementById("fichaSourcePreview");
    if(el)el.textContent=source||"Fonte vazia ou indisponível.";return;
   }
   if(name==="ecoFichaSave"){
    const kind=document.getElementById("fichaKind")?.value,sessionId=document.getElementById("fichaSession")?.value,origin=document.getElementById("fichaOrigin")?.value;
    const quote=String(document.getElementById("fichaQuote")?.value||"").trim(),text=String(document.getElementById("fichaText")?.value||"").trim();
    const old=ecoFichaEdit?.caseId===caseId?(c.fichaEvolutiva||[]).find(x=>x.id===ecoFichaEdit.id):null;
    const item={id:old?.id||uid(),kind,sessionId,origin,quote,text,updatedAt:new Date().toISOString()};
    if(!ecoFichaKinds.includes(kind)||!text||!quote||!ecoFichaValid(c,item)){notify("Informe categoria, síntese e trecho literal presente na fonte selecionada.","red");return;}
    const ok=change(()=>{c.fichaEvolutiva=[...(c.fichaEvolutiva||[]).filter(x=>x.id!==item.id),item];c.atualizadoEm=item.updatedAt;});
    if(!ok){notify("Falha ao salvar ficha. Dados mantidos.","red");return;}ecoFichaEdit=null;render();return;
   }
   if(name==="ecoFichaDelete"){
    if(!(c.fichaEvolutiva||[]).some(x=>x.id===id))return;
    if(!change(()=>{c.fichaEvolutiva=c.fichaEvolutiva.filter(x=>x.id!==id);})){notify("Falha ao excluir registro.","red");return;}ecoFichaEdit=null;render();return;
   }
   if(name==="ecoFichaPrint"){
    if(!document.getElementById("fichaPrintConfirm")?.checked){notify("Revise e confirme a ficha antes da impressão.","warn");return;}
    if(!window.NativeVault?.printReport){notify("Impressão disponível no Android.");return;}
    document.getElementById("fichaPrintConfirm").checked=false;
    window.NativeVault.printReport('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>body{font:12pt sans-serif;color:#111}table{border-collapse:collapse;width:100%}th,td{border:1px solid #aaa;padding:8px;text-align:left;vertical-align:top}th{width:28%;background:#eee}tr{break-inside:avoid}h3{background:#eee;padding:8px}p{white-space:pre-wrap}</style>'+ecoFichaBody(c)+'<p>Documento confidencial de uso interno. Não é laudo diagnóstico.</p></html>');return;
   }
  }

  if(name==="ecoAtlasTab"){ecoAtlasTab=id;render();return;}
  if(name==="newManualSession"){
    const caseId=button?.dataset?.case||id||openedId;
    openedId=caseId;
    manualSessionDraft={id:uid(),data:datestr(),hora:nowHHMM(),texto:'',intervencoes:'',plano:''};
    screen="manualSession";render();return;
  }
  if(name==="saveManualSession"){
    const caseId=button?.dataset?.case||openedId;
    const targetCase=state.cases.find(x=>x.id===caseId);
    if(!targetCase){notify("Caso não encontrado.",'red');return;}

    const hora=document.getElementById("manualSessHora")?.value||nowHHMM();
    const texto=document.getElementById("manualSessTexto")?.value||"";
    const interv=document.getElementById("manualSessInterv")?.value||"";
    const plano=document.getElementById("manualSessPlano")?.value||"";
    if(!texto.trim()){notify("Informe o relato ou síntese clínica da sessão.",'red');return;}
    const session={
      id:manualSessionDraft?.id||uid(),
      data:data,hora:hora,
      texto:texto.trim(),
      intervencoes:interv.trim(),
      plano:plano.trim(),
      origem:'manual',
      criadoEm:new Date().toISOString(),
      revisoes:[]

    const ok=change(()=>{
      if(!Array.isArray(targetCase.sessoes))targetCase.sessoes=[];

      targetCase.atualizadoEm=new Date().toISOString();

  if(name==="ecoSaveAnamnese"){

      targetCase.atualizadoEm=new Date().toISOString();

      docDateTo: ecoDocDateTo,sessionId:ecoDocSessionId

      vinculo:document.getElementById("genVinculo")?.value||"",
      notas:document.getElementById("genNotas")?.value||""
    };

  " · minuto "+esc(ecoTimecode(e.timeMs))+'</small></p>').join('');

  for(let i=0;i<units.length;i++){
   const u=units[i],q=u.text.trim();

   const key=s.id+'|'+u.source+'|'+i+'|'+q;
   if(!recorded.has(key))out.push({originKey:key,sessionId:s.id,data:s.data,source:u.source,speaker:u.speaker,atMs:u.atMs,texto:quote,...ecoDreamFields(quote)});

const ecoClinicalChapters=[["escuta","Escuta clínica, associação livre e enquadre","Freud","Recomendações aos médicos que exercem a psicanálise (1912); Sobre o início do tratamento (1913)","Associação livre","Na associação livre, o convite é falar sem selecionar previamente aquilo que parece relevante. A atenção flutuante é a contrapartida do analista: não decidir de antemão quais elementos confirmam uma teoria. O enquadre oferece continuidade, limites e previsibilidade. A escuta não consiste em preencher categorias a qualquer custo.","Um silêncio pode acompanhar reflexão, desconforto, cansaço, privacidade ou dificuldade para encontrar palavras. Registre a ocorrência e a própria explicação da pessoa, caso a ofereça. Não transforme a ausência de resposta em sinal de resistência.","Caso fictício: alguém diz que não tem nada importante para contar e menciona uma conversa banal com a irmã. Uma intervenção possível é perguntar o que lhe veio à mente ao lembrar a conversa. Compare o sentido atribuído hoje ao que apareceu em encontros anteriores.","Convite aberto, sem exigir lembranças; distinguir nota do profissional de fala literal; consultar o acordo de atendimento antes de alterar o enquadre.","O que ficou de fora desta escuta? O relato admite uma explicação cotidiana? O paciente reconhece a formulação?"],["transferencia","Transferência, repetição e elaboração","Freud","A dinâmica da transferência (1912); Recordar, repetir e elaborar (1914)","Transferência","Transferência é uma hipótese sobre modalidades de vínculo atualizadas na relação analítica, não um nome para qualquer reação ao terapeuta. Repetição envolve padrões que podem surgir em ações e relações. Elaboração é trabalho ao longo do tempo, não um efeito garantido por uma interpretação isolada.","Distinguir expectativa expressa na relação atual, episódios anteriores narrados e hipótese de conexão. Considerar fatos do próprio atendimento: atraso, desencontro, falha de comunicação, diferença cultural e condições materiais.","Caso fictício: uma pessoa teme que o terapeuta desmarque uma sessão após uma divergência. Em outro encontro relata medo de perder amizades ao discordar. As duas falas sugerem uma pergunta, não provam identidade de causas.","Registrar a expectativa com sua fonte; explorar sem confrontar; procurar episódios incompatíveis com a hipótese; acompanhar mudanças espontâneas.","Como foi a experiência concreta do encontro? Em quais relações discordar foi seguro? O que mudou quando a pessoa retomou o assunto?"],["sonhos","Sonhos, trabalho onírico e associações","Freud · Jung","Freud: A interpretação dos sonhos (1900); Jung: Aspectos gerais da psicologia do sonho (1916, revisado posteriormente)","Sonhos","Freud distingue conteúdo manifesto e pensamentos latentes, investigados por associações e pelo contexto do sonhador. Condensação e deslocamento descrevem operações teóricas do trabalho do sonho. Jung investiga a função do sonho no conjunto da vida psíquica; compensação é uma possibilidade teórica, não uma regra para traduzir imagens.","O relato lembrado não é registro integral do sonho. Anote imagens, sequência, personagens e afetos nomeados; deixe ausentes os elementos que não foram descritos. Uma associação posterior pertence a um registro distinto do relato inicial.","Caso fictício: uma casa sem portas aparece em dois sonhos. Em um, a pessoa relata curiosidade; no outro, medo. A repetição da imagem não implica estabilidade de significado. Convide a pessoa a associar livremente casa e portas.","Comparar imagens ao longo do tempo e preservar contextos distintos. Apresentar leituras como perguntas opcionais e não como chaves universais. Não sugerir memórias traumáticas a partir de símbolos.","O que a imagem evoca? Qual a diferença entre os dois sonhos? Que acontecimentos a pessoa considera relacionados?"],["lacan","Significante, demanda e posição do sujeito","Lacan","Função e campo da fala e da linguagem em psicanálise (1953); A direção do tratamento e os princípios de seu poder (1958)","Significante","Na orientação lacaniana, a fala é considerada em sua articulação e nas relações entre significantes, não apenas como informação comunicada. Demanda não se reduz à solicitação explícita. O desejo não é um atributo que um sistema possa extrair automaticamente de uma frase.","Observar palavras repetidas, equívocos percebidos pelo próprio sujeito, mudanças de pronome e formulações recorrentes. A polissemia depende do contexto e não justifica atribuição automática de sentido.","Caso fictício: alguém usa repetidamente a expressão 'dar conta' ao falar de trabalho e família. Perguntar o que significa dar conta naquele momento pode abrir associações. A frequência lexical é apenas uma pista.","Registrar expressão exata, contexto e associação posterior. Não inferir estrutura clínica, desejo inconsciente ou diagnóstico por padrões de linguagem.","A palavra tem o mesmo sentido nos contextos? Quem formula a expectativa? Há ocasiões em que a pessoa não usa essa expressão?"],["winnicott","Ambiente facilitador, brincar e experiência de continuidade","Winnicott","A teoria do relacionamento paterno-infantil (1960); O brincar e a realidade (1971)","Holding","Holding descreve, na teoria do desenvolvimento, condições ambientais de sustentação e continuidade. O brincar e os fenômenos transicionais permitem pensar a relação entre experiência subjetiva e realidade compartilhada. A aplicação clínica exige cuidado com analogias entre infância e situação adulta.","Não deduzir falhas ambientais históricas de um sintoma presente. Considerar circunstâncias concretas, recursos atuais, vínculos protetores e experiências de espontaneidade relatadas.","Caso fictício: uma pessoa diz sentir-se obrigada a representar um papel em todos os encontros, mas relata liberdade ao tocar um instrumento. Explore as condições que tornam a atividade diferente sem concluir que exista falso self patológico.","Oferecer um enquadre previsível; respeitar o ritmo; perguntar sobre experiências de espontaneidade e apoio; não prescrever dependência do terapeuta.","Onde há espaço para experimentar sem avaliação? O que torna certas relações mais previsíveis? Que exceções existem?"],["klein","Relações de objeto, ambivalência e reparação","Klein","Notas sobre alguns mecanismos esquizoides (1946); Uma contribuição à psicogênese dos estados maníaco-depressivos (1935)","Relações de objeto","Na teoria kleiniana, objetos internos e fantasias inconscientes ajudam a pensar a organização da experiência emocional. As posições esquizoparanoide e depressiva são conceitos teóricos, não diagnósticos produzidos por análise de texto. Ambivalência pode envolver sentimentos distintos em relação à mesma pessoa.","Uma fala de raiva não comprova cisão ou projeção. Investigar a sequência, o contexto relacional e o relato de sentimentos simultâneos, sem impor uma interpretação da infância.","Caso fictício: uma pessoa descreve irritação com uma amiga e preocupação após uma discussão. Perguntar como compreende os dois afetos permite explorar a coexistência deles.","Separar observação, associação e hipótese; não converter categorias históricas em escala de gravidade; reconhecer conflitos reais na relação.","Como a pessoa descreve os sentimentos coexistentes? A preocupação surgiu antes ou depois do conflito? Que outros aspectos da relação aparecem?"],["bion","Continência, função alfa e tolerância à incerteza","Bion","Aprendendo com a experiência (1962); Elementos de psicanálise (1963)","Continência","A relação continente-conteúdo e a função alfa constituem modelos teóricos sobre a transformação da experiência emocional e a possibilidade de pensar. Continência não é sinônimo de tranquilizar nem uma técnica automatizada de regulação emocional.","Evitar tratar dificuldade de nomear uma experiência como prova de ausência de pensamento. Considerar linguagem, contexto, confiança, condições sensoriais e fatores médicos quando pertinentes.","Caso fictício: alguém relata uma sensação corporal difícil de descrever e depois encontra uma imagem para ela. O profissional acompanha a passagem da descrição corporal à imagem sem decidir seu significado.","Escutar o modo como a pessoa encontra palavras; tolerar material incompleto; avaliar risco e necessidades de encaminhamento de maneira independente de hipóteses teóricas.","Que descrição parece mais próxima da experiência? O que ainda não pode ser nomeado? O que mudou quando a imagem apareceu?"],["longitudinal","Formulação longitudinal, evidência e contraponto","Método clínico ECO","Síntese didática original: não atribuída a um autor psicanalítico","Hipótese clínica","Uma formulação longitudinal reúne questões de trabalho provisórias, fontes e alternativas. O registro deve distinguir transcrição, nota profissional, relato de terceiro e interpretação. Recorrência textual não equivale a mecanismo psíquico nem a relação causal.","Uma hipótese deve admitir revisão. Registre uma evidência favorável, uma contrária ou ausência de confirmação, alternativas contextuais e data de revisão. Não trate indicadores de software como instrumentos diagnósticos validados.","Caso fictício: atrasos são mencionados em três sessões. Há explicação de transporte em duas e uma divergência de agenda na terceira. Uma interpretação de resistência não está demonstrada. A formulação mantém as explicações concretas e a possibilidade de investigação posterior.","Verificar a fonte e falante; obter consentimento e respeitar o escopo de atuação; guardar apenas informação necessária; discutir incerteza com supervisão quando apropriado.","Qual fato contrariaria a hipótese? Qual fonte mudou? Existe explicação alternativa mais simples? A hipótese ainda é útil?"]];
let ecoChapterOpen='';
function ecoAxisReading(id){const map={repeticao:'transferencia',ambivalencia:'klein',divergencias:'longitudinal',lacunas:'escuta',associacao:'escuta',familia:'winnicott',transferencia:'transferencia',defesas:'longitudinal',discurso:'lacan',sonhos:'sonhos',desejos:'lacan',angustias:'bion'};const r=ecoClinicalChapters.find(x=>x[0]===map[id]);return r?'<details class="card"><summary>Fundamentação: '+esc(r[1])+'</summary>'+ecoChapterBody(r)+'<p class="small muted">Leitura didática; não constitui conclusão sobre este paciente.</p></details>':'';}
function ecoChapterBody(row){return [['Conceitos e fundamentos',row[5]],['Distinções e limites',row[6]],['Exemplo fictício',row[7]],['Aplicação na prática',row[8]],['Questões de revisão',row[9]],['Leituras de referência',row[3]]].map(([title,body])=>'<h4>'+esc(title)+'</h4><p>'+esc(body)+'</p>').join('');}
function ecoChapterPanel(id){const r=ecoClinicalChapters.find(x=>x[0]===id);return r?'<article class="card"><span class="chip">Capítulo didático original · '+esc(r[2])+'</span><h2>'+esc(r[1])+'</h2>'+ecoChapterBody(r)+'<p class="small muted">Síntese autoral para estudo, não transcrição de obra; edição e página ainda não conferidas.</p>'+btn('Voltar à pesquisa','ecoCloseChapter','secondary')+'</article>':'';}
function ecoManualAnalysis(c){
 const sessions=(c.sessoes||[]).filter(s=>s.origem==='manual'&&s.texto?.trim());
 if(!sessions.length)return '';
 return '<section class="eco-outline"><h2>Atendimentos manuais — evidências</h2><p class="small muted">Trechos da nota do profissional, não transcrição literal do paciente. Extração lexical; confirmar contexto antes de usar como evidência clínica.</p>'+sessions.map(s=>'<details class="card"><summary>'+esc(formatDate(s.data))+' · nota manual</summary><p style="white-space:pre-line">'+esc(s.texto)+'</p>'+ecoStructuredEvents(s).slice(0,20).map(e=>'<div class="eco-evidence"><strong>'+esc(e.kind)+'</strong><p>'+esc(e.quote)+'</p><small>Origem: nota manual · falante não atribuído</small></div>').join('')+'</details>').join('')+'</section>';
}
const ecoCaseAnalysisBeforeManual=ecoCaseAnalysis;
ecoCaseAnalysis=function(c){return ecoManualAnalysis(c)+ecoCaseAnalysisBeforeManual(c);};


let ecoCaseWordSelection="";
let ecoReviewRun=null,ecoReviewSerial=0,ecoReviewType='anamnese',ecoReviewScope='paciente',ecoReviewFrom='',ecoReviewTo='';
function ecoReviewQueries(type){
 if(type==='anamnese')return ecoAnamneseCategories.flatMap(cat=>cat.campos.map(f=>({key:f.k,text:f.label,section:cat.nome})));
 if(type==='investigacao')return ecoInvestigationAxes.map(a=>({key:a.id,text:a.perguntaPadrao,section:a.nome}));
 if(type==='sonhos')return [{key:'relato',text:'Relato de sonho ou pesadelo durante o sono, narrativa do que aconteceu no sonho',section:'Relato onírico'},{key:'imagens',text:'Imagens, objetos, pessoas e lugares vistos em sonhos',section:'Imagens'},{key:'afetos',text:'Sentimentos experimentados em sonho ou ao despertar',section:'Afetos'},{key:'associacoes',text:'Associações pessoais, lembranças ou pensamentos relacionados a um sonho contado',section:'Associações'}];
 if(type==='vinculos')return [{key:'familia',text:'Pessoas da família, parentes, parceiros, convivência e história familiar',section:'Família'},{key:'amizade',text:'Amigos, amizades, pessoas próximas e convívio social',section:'Amizades'},{key:'trabalho',text:'Colegas de trabalho, estudos, professores ou chefias',section:'Trabalho e estudo'},{key:'apoio',text:'Pessoas ou grupos que oferecem apoio, cuidado e ajuda',section:'Apoio'},{key:'conflito',text:'Conflitos, afastamento ou dificuldades relatadas em relações interpessoais',section:'Dificuldades'}];
 return [
 {key:'relacoes',text:'Relações importantes, apoio, conflitos e mudanças nas relações',section:'Vínculos'},
 {key:'mudancas',text:'Mudanças relatadas ao longo do acompanhamento, melhorias ou dificuldades recentes',section:'Mudanças relatadas'},
 {key:'objetivos',text:'Objetivos, expectativas e próximos passos de acompanhamento relatados',section:'Objetivos'},
 {key:'sono',text:'Sono, descanso, pesadelos, despertar e hábitos de sono',section:'Sono'},
 {key:'corpo',text:'Sensações físicas, saúde, tratamentos ou medicações relatados',section:'Corpo e saúde'},
 {key:'sonhos',text:'Descrição de sonhos ou pesadelos, imagens e associações pessoais',section:'Sonhos'},
 {key:'trabalho',text:'Trabalho, rotina, estudo, dificuldades e realizações',section:'Rotina'},
 {key:'recursos',text:'Atividades significativas, interesses, apoio e recursos relatados',section:'Recursos'}];
}
function ecoReviewRows(c,scope,from,to){
 const rows=[];
 for(const s of (c?.sessoes||[]).filter(s=>(!from||s.data>=from)&&(!to||s.data<=to)).sort((a,b)=>String(a.data||'').localeCompare(String(b.data||'')))){
  const units=scope==='manual'?(s.origem==='manual'?ecoSourceUnits(s).filter(u=>u.source==='nota clínica manual'):[]):ecoAnalysisRows(s,'paciente');
  for(const u of units)if(u.text?.trim())rows.push({text:u.text,atMs:u.atMs??null,speaker:scope==='manual'?'desconhecido':'paciente',source:scope==='manual'?'nota clínica manual':'transcrição atribuída ao paciente',sessionId:s.id,sessionDate:s.data||''});
 }
 return rows;
}
function ecoReviewKey(c,scope,from,to,type){return JSON.stringify([c?.id,scope,from,to,type,ecoReviewRows(c,scope,from,to)]);}
function ecoReviewValid(c,x){
 const s=(c?.sessoes||[]).find(s=>s.id===x.sessionId);if(!s||!x.quote)return false;
 return ecoReviewRows({sessoes:[s]},x.scope,'','').some(u=>u.text===x.quote&&u.atMs===(x.atMs??null));
}
function ecoReviewCurrent(r){return !!r&&screen==='case'&&tab==='revisaoInteligente'&&openedId===r.caseId&&r.key===ecoReviewKey(currentCase(),r.scope,r.from,r.to,r.type);}
function ecoReviewCancel(reason='Consulta cancelada.'){
 const r=ecoReviewRun;if(!r)return;
 if(r.pending){try{window.NativeVault.cancelSemantic?.(r.id);}catch(e){}}
 ecoReviewRun=null;if(screen==='case'&&tab==='revisaoInteligente'&&reason){notify(reason);render();}
}
function ecoReviewWatch(id){const r=ecoReviewRun;if(!r?.pending||r.id!==id)return;if(!ecoReviewCurrent(r)){ecoReviewCancel('');return;}if(Date.now()-r.last>180000){ecoReviewCancel('Motor sem progresso. Reduza o período e tente novamente.');return;}setTimeout(()=>ecoReviewWatch(id),5000);}
function ecoReviewStart(c){
 if(!c||ecoReviewRun?.pending||ecoNeuralRun?.pending||ecoIsCapturing()){notify('Finalize a operação de áudio ou análise anterior.','red');return;}
 const from=document.getElementById('ecoReviewFrom')?.value||'',to=document.getElementById('ecoReviewTo')?.value||'';
 if(from&&to&&from>to){notify('Período inválido.','red');return;}
 ecoReviewFrom=from;ecoReviewTo=to;
 const rows=ecoReviewRows(c,ecoReviewScope,from,to),queries=ecoReviewQueries(ecoReviewType),id='review-'+(++ecoReviewSerial)+'-'+Date.now();
 const payload=JSON.stringify({id,rows,scope:ecoReviewScope==='manual'?'desconhecido':'paciente',longitudinal:ecoReviewScope==='paciente',queries:queries.map(({key,text})=>({key,text}))});
 if(!rows.length||rows.length>1200||payload.length>500000||rows.some(u=>u.text.length>12000)){notify('Selecione um período com 1 a 1200 trechos válidos, até 500 mil caracteres.','red');return;}
 if(typeof window.NativeVault?.analyzeSemantic!=='function'){notify('Motor neural indisponível; nenhuma simulação utilizada.','red');return;}
 ecoReviewRun={id,caseId:c.id,type:ecoReviewType,scope:ecoReviewScope,from,to,key:ecoReviewKey(c,ecoReviewScope,from,to,ecoReviewType),rows,queries,pending:true,last:Date.now(),done:0,total:rows.length,stage:'Preparando modelo'};
 try{const status=window.NativeVault.analyzeSemantic(payload);if(status!=='OK'){ecoReviewRun.pending=false;ecoReviewRun.error=String(status||'Falha de inicialização');}}catch(e){ecoReviewRun.pending=false;ecoReviewRun.error='Falha ao iniciar a inferência.';}
 render();if(ecoReviewRun.pending)setTimeout(()=>ecoReviewWatch(id),5000);
}
function ecoReviewCandidate(r,key,index){
 if(!r||r.pending||r.error||!ecoReviewCurrent(r))return null;
 const group=r.groups?.find(g=>g.key===key),hit=group?.hits?.[index],u=r.rows[hit?.i],q=r.queries.find(x=>x.key===key);
 if(!u||!q||!Number.isFinite(hit.score))return null;
 return {id:uid(),type:r.type,key,label:q.text,scope:r.scope,quote:u.text,sessionId:u.sessionId,atMs:u.atMs,sessionDate:u.sessionDate,source:u.source,score:hit.score,model:r.model,createdAt:new Date().toISOString(),status:'confirmado'};
}
function ecoReviewAccept(c,key,index){
 const x=ecoReviewCandidate(ecoReviewRun,key,index);if(!x||!ecoReviewValid(c,x)){notify('Fonte indisponível ou alterada. Execute novamente.','red');return;}
 const existing=(c.ecoReviewRecords||[]).some(y=>y.type===x.type&&y.key===x.key&&y.sessionId===x.sessionId&&y.quote===x.quote&&y.atMs===x.atMs);
 if(existing){notify('Este trecho já foi confirmado.');return;}
 if(!change(()=>{c.ecoReviewRecords=[...(c.ecoReviewRecords||[]),x];c.atualizadoEm=new Date().toISOString();}))return;
 notify('Fonte confirmada. Nenhum diagnóstico ou campo clínico foi alterado automaticamente.');
}
function ecoReviewRecords(c,type){
 const rows=(c.ecoReviewRecords||[]).filter(x=>x.type===type);
 if(!rows.length)return '<p class="small muted">Nenhuma fonte confirmada neste módulo.</p>';
 return rows.map(x=>'<div class="eco-evidence"><strong>'+esc(x.label)+'</strong><p>'+esc(x.quote)+'</p><p class="small">'+esc(formatDate(x.sessionDate))+' · '+esc(x.source)+(x.atMs==null?'':' · '+esc(ecoTimecode(x.atMs)))+'</p>'+(ecoReviewValid(c,x)?'<span class="chip good">Fonte atual</span>':'<span class="chip warn">Fonte alterada — não utilizar sem revisão</span>')+'<div class="actions">'+btn('Excluir fonte','ecoReviewDelete','ghost','data-case="'+esc(c.id)+'" data-id="'+esc(x.id)+'"')+'</div></div>').join('');
}
function ecoReviewPanel(c){
 const r=ecoReviewCurrent(ecoReviewRun)?ecoReviewRun:null;
 let out='<div class="card"><h2>Revisão inteligente do histórico</h2><p>O modelo DistilUSE procura trechos relacionados a vários temas em uma única execução local. Similaridade não comprova um fato, diagnóstico, contradição ou hipótese. Confirme cada fonte.</p><div class="actions">'+[['anamnese','Anamnese'],['investigacao','Investigação'],['evolucao','Evolução'],['sonhos','Sonhos'],['vinculos','Vínculos']].map(([k,l])=>btn(l,'ecoReviewType',k===ecoReviewType?'':'secondary','data-id="'+k+'"')).join('')+'</div><div class="actions">'+[['paciente','Falas do paciente'],['manual','Notas manuais']].map(([k,l])=>btn(l,'ecoReviewScope',k===ecoReviewScope?'':'secondary','data-id="'+k+'"')).join('')+'</div><p class="small muted">'+(ecoReviewScope==='manual'?'Notas do profissional: não são falas literais do paciente.':'Somente trechos identificados como paciente. Falas não identificadas e do terapeuta ficam de fora.')+'</p><div class="split"><div class="field"><label>De</label><input id="ecoReviewFrom" type="date" value="'+esc(ecoReviewFrom)+'"></div><div class="field"><label>Até</label><input id="ecoReviewTo" type="date" value="'+esc(ecoReviewTo)+'"></div></div>'+btn('Executar análise neural','ecoReviewStart','','data-case="'+esc(c.id)+'"')+'</div>';
 if(r?.pending)out+='<div class="card"><p id="ecoReviewStage">'+esc(r.stage)+'</p><progress id="ecoReviewProgress" max="'+Math.max(1,r.total)+'" value="'+r.done+'"></progress><p id="ecoReviewCount">'+r.done+' / '+r.total+'</p>'+btn('Cancelar','ecoReviewCancel','secondary')+'</div>';
 else if(r?.error)out+='<p class="alert red">'+esc(r.error)+'</p>';
 else if(r?.groups){out+='<div class="card"><h3>Resultados · '+esc(r.model)+'</h3><p>'+r.rows.length+' trechos · '+r.queries.length+' consultas. Pontuação de cosseno experimental, não probabilidade.</p></div>';for(const q of r.queries){const hits=r.groups.find(g=>g.key===q.key)?.hits||[];out+='<details class="card" '+(hits.length?'open':'')+'><summary>'+esc(q.section+' — '+q.text)+' ('+hits.length+')</summary>'+hits.map((hit,i)=>{const u=r.rows[hit.i];if(!u)return '';return '<div class="eco-evidence"><p>'+esc(u.text)+'</p><small>'+esc(formatDate(u.sessionDate))+' · '+esc(u.source)+' · cosseno '+Number(hit.score).toFixed(3)+'</small>'+btn('Confirmar fonte','ecoReviewAccept','secondary','data-case="'+esc(c.id)+'" data-id="'+esc(q.key+'|'+i)+'"')+'</div>';}).join('')+(hits.length?'':'<p>Nenhum candidato acima do limiar.</p>')+'</details>';}}
 return out+'<div class="card"><h2>Fontes confirmadas</h2>'+ecoReviewRecords(c,ecoReviewType)+'</div>'+(ecoReviewType==='evolucao'?ecoEvolutionPanel(c):'');
}
function ecoReviewRelated(c,type,key){
 const rows=(c.ecoReviewRecords||[]).filter(x=>x.type===type&&x.key===key);
 return rows.length?'<details class="card"><summary>Fontes confirmadas ('+rows.length+')</summary>'+rows.map(x=>'<p>'+esc(x.quote)+'<br><small>'+esc(formatDate(x.sessionDate))+' · '+esc(x.source)+' · '+(ecoReviewValid(c,x)?'Fonte atual':'Fonte alterada')+'</small></p>'+(type==='anamnese'&&ecoReviewValid(c,x)?btn('Acrescentar ao campo','ecoReviewApply','secondary','data-case="'+esc(c.id)+'" data-id="'+esc(x.id)+'"'):'')).join('')+'</details>':'';
}
const ecoReviewPreviousProgress=window.nativeSemanticProgress,ecoReviewPreviousResult=window.nativeSemanticResult,ecoReviewPreviousUnlock=window.nativeSemanticUnlocked;
window.nativeSemanticProgress=function(raw){let v;try{v=JSON.parse(raw);}catch(e){return;}if(!String(v.id||'').startsWith('review-'))return ecoReviewPreviousProgress(raw);const r=ecoReviewRun;if(!r?.pending||v.id!==r.id)return;if(!ecoReviewCurrent(r)){ecoReviewCancel('');return;}r.stage=String(v.stage||'Analisando');r.done=Number(v.done)||0;r.total=Number(v.total)||r.total;r.last=Date.now();const a=document.getElementById('ecoReviewStage'),b=document.getElementById('ecoReviewProgress'),c=document.getElementById('ecoReviewCount');if(a)a.textContent=r.stage;if(b){b.max=Math.max(1,r.total);b.value=r.done;}if(c)c.textContent=r.done+' / '+r.total;};
window.nativeSemanticResult=function(raw){let v;try{v=JSON.parse(raw);}catch(e){return;}if(!String(v.id||'').startsWith('review-'))return ecoReviewPreviousResult(raw);const r=ecoReviewRun;if(!r?.pending||v.id!==r.id)return;if(!ecoReviewCurrent(r)){ecoReviewRun=null;return;}r.pending=false;if(v.error)r.error=String(v.error);else if(v.count!==r.rows.length||!Array.isArray(v.groups)||v.groups.length!==r.queries.length||v.scope!==(r.scope==='manual'?'desconhecido':'paciente')||!r.queries.every(q=>v.groups.filter(g=>g.key===q.key).length===1)||!v.groups.every(g=>Array.isArray(g.hits)&&g.hits.length<=5&&g.hits.every(h=>Number.isInteger(h.i)&&h.i>=0&&h.i<r.rows.length&&Number.isFinite(h.score)&&h.score>=-1.001&&h.score<=1.001)))r.error='Resposta neural inválida; nenhum resultado aceito.';else{r.groups=v.groups;r.model=String(v.model||'DistilUSE');}render();};
window.nativeSemanticUnlocked=function(){ecoReviewCancel('');return ecoReviewPreviousUnlock();};

function ecoReviewApply(c,id){
 const x=(c.ecoReviewRecords||[]).find(v=>v.id===id&&v.type==='anamnese');
 if(!x||!ecoReviewValid(c,x)||!ecoAnamneseCategories.some(cat=>cat.campos.some(f=>f.k===x.key))){notify('Fonte ausente ou alterada.','red');return;}
 const old=String(c.anamnese?.[x.key]||'');
 const line='['+formatDate(x.sessionDate)+' · '+x.source+'] '+x.quote;
 if(old.split('\n').includes(line)){notify('Esta fonte já consta do campo.');return;}
 const input=document.getElementById('ana_'+x.key);
 if(input&&String(input.value||'')!==old){notify('Salve suas alterações na anamnese antes de incorporar esta fonte.','red');return;}
 if(change(()=>{c.anamnese={...(c.anamnese||{}),[x.key]:[old,line].filter(Boolean).join('\n')};x.appliedAt=new Date().toISOString();c.atualizadoEm=x.appliedAt;}))notify('Trecho acrescentado à anamnese sem apagar conteúdo anterior.');
}

const ecoReviewPrevAct=act;
act=function(name,id,button){

function ecoDreamSourceState(c,d){
 if(!d.sessionId)return 'Registro manual independente';
 const s=(c.sessoes||[]).find(x=>x.id===d.sessionId);
 if(!s)return 'Fonte removida';
 if(d.reviewSourceId){const x=(c.ecoReviewRecords||[]).find(x=>x.id===d.reviewSourceId);return x&&ecoReviewValid(c,x)?'Fonte atual':'Fonte alterada ou removida';}
 const units=ecoSourceUnits(s);const source=units.filter(u=>(!d.source||u.source===d.source)&&(!d.speaker||u.speaker===d.speaker)).map(u=>u.text.trim()).join(' ');
 const original=d.originalQuote||d.texto;
 return original&&(source.includes(original)||(!units.length&&s.texto?.includes(original)))?'Fonte atual':'Fonte alterada ou removida';
}

function ecoNliPanel(c){

function ecoNliStart(c){
 if(!c||ecoNliRun?.pending||ecoReviewRun?.pending||ecoNeuralRun?.pending||ecoIsCapturing()){notify('Finalize a operação anterior.','red');return;}
 const rows=ecoNliRows(c),a=String(document.getElementById('ecoNliA')?.value||''),b=String(document.getElementById('ecoNliB')?.value||'');
 if(!/^\d+$/.test(a)||!/^\d+$/.test(b)||a===b||!rows[Number(a)]||!rows[Number(b)]||rows.length>1200){notify('Selecione dois trechos distintos.','red');return;}
 const x=rows[Number(a)],y=rows[Number(b)];if(x.text.length>3000||y.text.length>3000){notify('Trechos muito longos; o motor não corta conteúdo clínico.','red');return;}
 ecoNliA=a;ecoNliB=b;const id='nli-'+(++ecoNliSerial)+'-'+Date.now();ecoNliRun={id,caseId:c.id,key:ecoNliKey(c),a:x,b:y,pending:true,last:Date.now(),stage:'Carregando BERTimbau NLI'};
 try{const status=window.NativeVault?.analyzeSemantic?.(JSON.stringify({id,mode:'nli',pairs:[{a:x.text,b:y.text}]}));if(status!=='OK'){ecoNliRun.pending=false;ecoNliRun.error=String(status||'Modelo indisponível.');}}catch(e){ecoNliRun.pending=false;ecoNliRun.error='Falha ao iniciar o modelo.';}
 render();if(ecoNliRun.pending)setTimeout(()=>ecoNliWatch(id),5000);
}
const ecoNliProgressPrevious=window.nativeSemanticProgress,ecoNliResultPrevious=window.nativeSemanticResult,ecoNliUnlockPrevious=window.nativeSemanticUnlocked;
window.nativeSemanticProgress=function(raw){let v;try{v=JSON.parse(raw);}catch(e){return;}if(!String(v.id||'').startsWith('nli-'))return ecoNliProgressPrevious(raw);const r=ecoNliRun;if(!r?.pending||r.id!==v.id)return;if(!ecoNliCurrent(r)){ecoNliCancel();return;}r.last=Date.now();r.stage=String(v.stage||'Comparando');const el=document.getElementById('ecoNliStage');if(el)el.textContent=r.stage;};
window.nativeSemanticResult=function(raw){let v;try{v=JSON.parse(raw);}catch(e){return;}if(!String(v.id||'').startsWith('nli-'))return ecoNliResultPrevious(raw);const r=ecoNliRun;if(!r?.pending||r.id!==v.id)return;if(!ecoNliCurrent(r)){ecoNliRun=null;return;}r.pending=false;const valid=x=>Array.isArray(x)&&x.length===3&&x.every(n=>Number.isFinite(n)&&n>=0&&n<=1)&&Math.abs(x.reduce((a,b)=>a+b,0)-1)<.01;const x=v.comparisons?.[0];if(v.error)r.error=String(v.error);else if(JSON.stringify(v.labels)!=='["contradiction","entailment","neutral"]'||v.comparisons?.length!==1||x.i!==0||!valid(x.ab)||!valid(x.ba))r.error='Resposta NLI inválida.';else r.result=v;render();};

 if(!selected.length){notify('Selecione ao menos uma passagem para comparação.','red');return;}

 const id='claim-nli-'+(++ecoClaimSerial)+'-'+Date.now(),payload=JSON.stringify({id,mode:'nli',pairs:selected.map(x=>({a:r.rows[x.i].text,b:r.claim}))});
 r.id=id;r.selected=selected;r.pending=true;r.phase='compare';r.stage='Comparando fontes com BERTimbau NLI';r.last=Date.now();
 try{const status=window.NativeVault?.analyzeSemantic?.(payload);if(status!=='OK'){r.pending=false;r.error=String(status||'Motor NLI indisponível.');}}catch(e){r.pending=false;r.error='Falha ao iniciar NLI.';}
 render();if(r.pending)setTimeout(()=>ecoClaimWatch(id),5000);
}
function ecoClaimPanel(c){
 const r=ecoClaimCurrent(ecoClaimRun)?ecoClaimRun:null;let out='<section class="card"><h2>Conferir uma afirmação no histórico</h2><p class="small muted">Busca semântica seguida de NLI opcional, com dois modelos separados. Use uma afirmação factual com sujeito e período quando pertinente, não rótulos clínicos. Os resultados são pistas de leitura, não prova de verdade, mentira ou diagnóstico.</p><div class="field"><label>Afirmação a conferir</label><textarea id="ecoClaimText" maxlength="500" placeholder="Ex.: Em 2024 a pessoa morava em Ubá.">'+esc(r?.claim||'')+'</textarea></div>'+btn('Localizar fontes relacionadas','ecoClaimStart','secondary','data-case="'+esc(c.id)+'"');
 if(r?.pending)out+='<p id="ecoClaimStage">'+esc(r.stage)+'</p>'+btn('Cancelar','ecoClaimCancel','ghost');
 else if(r?.error)out+='<p class="alert red">'+esc(r.error)+'</p>';
 else if(r?.phase==='ready'){out+='<h3>Trechos recuperados</h3>'+(r.hits.length?r.hits.map((x,i)=>{const u=r.rows[x.i];return '<div class="eco-evidence"><label class="choice"><input type="checkbox" id="ecoClaimPick_'+i+'" '+(u.text.length<=3000?'checked':'disabled')+'>Selecionar para NLI</label><p>'+esc(u.text)+'</p><small>'+esc(formatDate(u.sessionDate))+' · '+esc(u.source)+' · cosseno '+x.score.toFixed(3)+'</small></div>';}).join('')+btn('Comparar trechos selecionados','ecoClaimCompare','','data-case="'+esc(c.id)+'"'):'<p>Nenhum trecho recuperado acima do limiar.</p>');}
 else if(r?.phase==='done'){out+='<h3>Comparação textual por fonte</h3><p class="small muted">A passagem é a premissa e a afirmação é a hipótese. As saídas softmax não são probabilidades clínicas. Não há decisão global automatizada.</p>'+r.selected.map((x,i)=>{const u=r.rows[x.i],p=r.comparisons[i];return '<div class="eco-evidence"><p>'+esc(u.text)+'</p><small>'+esc(formatDate(u.sessionDate))+' · '+esc(u.source)+' · cosseno '+x.score.toFixed(3)+'</small><p>Possível incompatibilidade: '+(100*p.ab[0]).toFixed(1)+'% · Implicação: '+(100*p.ab[1]).toFixed(1)+'% · Indeterminada: '+(100*p.ab[2]).toFixed(1)+'%</p></div>';}).join('');}
 return out+'</section>';
}
const ecoClaimPriorPanel=ecoNliPanel;ecoNliPanel=function(c){return ecoClaimPriorPanel(c)+ecoClaimPanel(c);};
const ecoClaimPriorProgress=window.nativeSemanticProgress,ecoClaimPriorResult=window.nativeSemanticResult,ecoClaimPriorUnlock=window.nativeSemanticUnlocked;
window.nativeSemanticProgress=function(raw){let v;try{v=JSON.parse(raw);}catch(e){return;}if(!String(v.id||'').startsWith('claim-'))return ecoClaimPriorProgress(raw);const r=ecoClaimRun;if(!r?.pending||v.id!==r.id)return;if(!ecoClaimCurrent(r)){ecoClaimCancel();return;}r.stage=String(v.stage||'Processando');r.last=Date.now();const e=document.getElementById('ecoClaimStage');if(e)e.textContent=r.stage;};
window.nativeSemanticResult=function(raw){let v;try{v=JSON.parse(raw);}catch(e){return;}if(!String(v.id||'').startsWith('claim-'))return ecoClaimPriorResult(raw);const r=ecoClaimRun;if(!r?.pending||v.id!==r.id)return;if(!ecoClaimCurrent(r)){ecoClaimRun=null;return;}r.pending=false;
 if(v.error)r.error=String(v.error);
 else if(r.phase==='retrieve'){const hits=v.groups?.[0]?.hits;if(v.count!==r.rows.length||v.scope!==r.scope||v.groups?.length!==1||v.groups[0].key!=='claim'||!Array.isArray(hits)||hits.length>5||!hits.every(x=>Number.isInteger(x.i)&&x.i>=0&&x.i<r.rows.length&&Number.isFinite(x.score)&&x.score>=-1.001&&x.score<=1.001)||new Set(hits.map(x=>x.i)).size!==hits.length)r.error='Resposta da recuperação inválida.';else{r.hits=hits;r.phase='ready';}}
 else if(r.phase==='compare'){const valid=x=>Array.isArray(x)&&x.length===3&&x.every(n=>Number.isFinite(n)&&n>=0&&n<=1)&&Math.abs(x.reduce((a,b)=>a+b,0)-1)<.01;if(JSON.stringify(v.labels)!=='["contradiction","entailment","neutral"]'||!Array.isArray(v.comparisons)||v.comparisons.length!==r.selected.length||!v.comparisons.every((x,i)=>x.i===i&&valid(x.ab)&&valid(x.ba)))r.error='Resposta NLI inválida.';else{r.comparisons=v.comparisons;r.phase='done';}}
 render();};
window.nativeSemanticUnlocked=function(){ecoClaimCancel();return ecoClaimPriorUnlock();};
const ecoClaimPriorAct=act;
act=function(name,id,button){
 const c=state?.cases?currentCase():null;
 if(name==='ecoClaimStart'){if(c&&button?.dataset?.case===c.id)ecoClaimStart(c);return;}
 if(name==='ecoClaimCompare'){if(c&&button?.dataset?.case===c.id)ecoClaimCompare(c);return;}
 if(name==='ecoClaimCancel'){ecoClaimCancel();render();return;}
 if(['nav','openCase','caseTab','ecoAtlasTab','ecoNliScope','ecoNliFilter'].includes(name))ecoClaimCancel();
 if(name==='ecoNliStart'&&ecoClaimRun?.pending){notify('Aguarde a conferência de fontes.','red');return;}
 return ecoClaimPriorAct(name,id,button);
};


let ecoAiRun=null,ecoAiSerial=0,ecoAiScope='paciente';
function ecoAiRows(c,scope){return scope==='teoria'?ecoLibraryChunks().map(x=>({...x,text:x.text,speaker:'desconhecido'})):ecoReviewRows(c,scope,'','');}
function ecoAiKey(c,scope){return JSON.stringify([c?.id,scope,ecoAiRows(c,scope)]);}
function ecoAiCurrent(r){return !!r&&screen==='case'&&tab==='assistenteIA'&&r.caseId===openedId&&r.key===ecoAiKey(currentCase(),r.scope);}
function ecoAiCancel(){if(ecoAiRun?.pending)try{window.NativeVault.cancelSemantic?.(ecoAiRun.id);}catch(e){}ecoAiRun=null;}
function ecoAiSend(r,phase,payload,stage){
 r.id='ai-'+(++ecoAiSerial)+'-'+Date.now();r.phase=phase;r.pending=true;r.error='';r.stage=stage;r.last=Date.now();
 try{const result=window.NativeVault?.analyzeSemantic?.(JSON.stringify({...payload,id:r.id}));if(result!=='OK'){r.pending=false;r.error=String(result||'Motor indisponível');}}catch(e){r.pending=false;r.error='Falha ao iniciar a inferência.';}
 render();if(r.pending)setTimeout(()=>ecoAiWatch(r.id),5000);
}
function ecoAiWatch(id){const r=ecoAiRun;if(!r?.pending||r.id!==id)return;if(!ecoAiCurrent(r)){ecoAiCancel();return;}if(Date.now()-r.last>300000){ecoAiCancel();notify('Motor sem progresso.','red');render();return;}setTimeout(()=>ecoAiWatch(id),5000);}
function ecoAiStart(c){
 if(ecoAiRun?.pending||ecoNliRun?.pending||ecoClaimRun?.pending||ecoLibraryRun?.pending||ecoReviewRun?.pending||ecoNeuralRun?.pending||ecoIsCapturing()){notify('Finalize a operação anterior.','red');return;}
 const query=String(document.getElementById('ecoAiQuery')?.value||'').trim(),rows=ecoAiRows(c,ecoAiScope);
 const scope=ecoAiScope==='paciente'?'paciente':'desconhecido';
 const payload={query,scope,rows:rows.map(x=>({text:x.text,speaker:x.speaker,sessionId:x.sessionId||'',atMs:x.atMs??null}))};
 if(!query||query.length>500||!rows.length||rows.length>1200||JSON.stringify(payload).length>490000||rows.some(x=>x.text.length>12000)){notify('Consulta ou corpus acima do limite. Use uma consulta de até 500 caracteres e até 1200 trechos.','red');return;}
 const r=ecoAiRun={caseId:c.id,scope:ecoAiScope,nativeScope:scope,key:ecoAiKey(c,ecoAiScope),rows,query};
 ecoAiSend(r,'retrieve',payload,'1/3 · Recuperando fontes com DistilUSE');
}
function ecoAiRerank(r){
 const rows=r.hits.map(x=>({text:r.rows[x.i].text}));
 ecoAiSend(r,'rerank',{mode:'rerank',query:r.query,rows},'2/3 · Reordenando fontes com mMARCO');
}
function ecoAiGenerate(c){
 const r=ecoAiRun;if(!ecoAiCurrent(r)||r.pending||r.phase!=='ready')return;
 const selected=r.ranked.filter((x,i)=>document.getElementById('ecoAiPick_'+i)?.checked);
 if(!selected.length||selected.length>5||selected.some(x=>r.rows[x.i].text.length>1800)||selected.reduce((n,x)=>n+r.rows[x.i].text.length,0)>4200){notify('Selecione 1 a 5 fontes inteiras, até 4200 caracteres no total.','red');return;}
 r.selected=selected;ecoAiSend(r,'generate',{mode:'generate',query:r.query,sources:selected.map(x=>({text:r.rows[x.i].text}))},'3/3 · Gerando minuta com Qwen');
}
function ecoAiSource(r,x){const u=r.rows[x.i];return '<p>'+esc(u.text)+'</p><small>'+esc(r.scope==='teoria'?(u.author+' · '+u.ref):(formatDate(u.sessionDate)+' · '+u.source))+' · cosseno '+Number(x.score).toFixed(3)+(Number.isFinite(x.rank)?' · relevância neural '+x.rank.toFixed(3):'')+'</small>';}
function ecoAiPanel(c){
 const r=ecoAiCurrent(ecoAiRun)?ecoAiRun:null;
 let out='<section class="card"><h2>Assistente IA local · RAG</h2><p class="alert">Experimental: recuperação, reranking e geração em etapas, sem APIs. A minuta pode conter erros, mesmo quando cita fontes. Não é diagnóstico, prescrição, avaliação de risco ou conclusão clínica. Não é salva automaticamente.</p><div class="actions">'+[['paciente','Paciente'],['manual','Notas manuais'],['teoria','Biblioteca teórica']].map(([k,l])=>btn(l,'ecoAiScope',ecoAiScope===k?'':'secondary','data-id="'+k+'"')).join('')+'</div><p class="small muted">Corpus: '+esc(ecoAiScope==='teoria'?'Somente material didático; não inclua dados pessoais na consulta.':ecoAiScope==='manual'?'Notas profissionais, não falas literais.':'Falas atribuídas ao paciente deste caso.')+'</p><div class="field"><label>Questão ou síntese a preparar</label><textarea id="ecoAiQuery" maxlength="500">'+esc(r?.query||'')+'</textarea></div>'+btn('Recuperar e reordenar fontes','ecoAiStart','secondary','data-case="'+esc(c.id)+'"');
 if(r?.pending)out+='<p id="ecoAiStage">'+esc(r.stage)+'</p>'+btn('Cancelar','ecoAiCancel','ghost');
 else if(r?.error)out+='<p class="alert red">'+esc(r.error)+'</p>';
 else if(r?.phase==='ready'){out+='<h3>Fontes reordenadas pelo cross-encoder</h3><p class="small">Selecione as fontes antes de gerar. Passagens longas não são cortadas silenciosamente.</p>'+r.ranked.map((x,i)=>'<div class="eco-evidence"><label class="choice"><input type="checkbox" id="ecoAiPick_'+i+'" '+(r.rows[x.i].text.length>1800?'disabled':'')+'>Selecionar fonte</label>'+ecoAiSource(r,x)+'</div>').join('')+(r.ranked.length?btn('Gerar minuta local','ecoAiGenerate','','data-case="'+esc(c.id)+'"'):'<p>Nenhuma fonte elegível; não gerar resposta.</p>')+(r.skipped?.length?'<p>'+r.skipped.length+' fonte(s) excederam o limite do reranker.</p>':'');}
 else if(r?.phase==='done'){out+='<h3>Minuta não revisada</h3><p class="alert">Compare cada afirmação com as passagens abaixo. Identificadores de fonte não garantem sustentação semântica.</p><div class="eco-evidence" style="white-space:pre-wrap">'+esc(r.draft)+'</div><p class="small">'+esc(r.model)+'</p>'+r.selected.map((x,i)=>'<div class="eco-evidence"><strong>[S'+(i+1)+']</strong>'+ecoAiSource(r,x)+'</div>').join('')+btn('Abrir comparação NLI','caseTab','secondary','data-id="compararRelatos"');}
 return out+'</section>';
}
const ecoAiPriorProgress=window.nativeSemanticProgress,ecoAiPriorResult=window.nativeSemanticResult,ecoAiPriorUnlock=window.nativeSemanticUnlocked;
window.nativeSemanticProgress=function(raw){let v;try{v=JSON.parse(raw);}catch(e){return;}if(!String(v.id||'').startsWith('ai-'))return ecoAiPriorProgress(raw);const r=ecoAiRun;if(!r?.pending||v.id!==r.id)return;if(!ecoAiCurrent(r)){ecoAiCancel();return;}r.last=Date.now();r.stage=String(v.stage||r.stage);const el=document.getElementById('ecoAiStage');if(el)el.textContent=r.stage;};
window.nativeSemanticResult=function(raw){let v;try{v=JSON.parse(raw);}catch(e){return;}if(!String(v.id||'').startsWith('ai-'))return ecoAiPriorResult(raw);const r=ecoAiRun;if(!r?.pending||v.id!==r.id)return;if(!ecoAiCurrent(r)){ecoAiRun=null;return;}r.pending=false;
 const hitsValid=(hits,n,lo,hi,max)=>Array.isArray(hits)&&hits.length<=max&&new Set(hits.map(x=>x.i)).size===hits.length&&hits.every(x=>Number.isInteger(x.i)&&x.i>=0&&x.i<n&&Number.isFinite(x.score)&&x.score>=lo&&x.score<=hi);
 if(v.error)r.error=String(v.error);
 else if(r.phase==='retrieve'){if(v.count!==r.rows.length||v.scope!==r.nativeScope||!hitsValid(v.hits,r.rows.length,-1.001,1.001,20))r.error='Retorno de recuperação inválido.';else if(!v.hits.length){r.ranked=[];r.phase='ready';}else{r.hits=v.hits;ecoAiRerank(r);return;}}
 else if(r.phase==='rerank'){if(v.count!==r.hits.length||!hitsValid(v.hits,r.hits.length,0,1,20)||!Array.isArray(v.skipped)||v.skipped.some(i=>!Number.isInteger(i)||i<0||i>=r.hits.length)||new Set([...v.hits.map(x=>x.i),...v.skipped]).size!==r.hits.length||v.hits.length+v.skipped.length!==r.hits.length)r.error='Retorno de reranking inválido.';else{r.ranked=v.hits.map(x=>({...r.hits[x.i],rank:x.score}));r.skipped=v.skipped;r.phase='ready';}}
 else if(r.phase==='generate'){if(v.sourceCount!==r.selected.length||v.clinicalValidation!==false||typeof v.draft!=='string'||!v.draft.trim()||v.draft.length>16000)r.error='Minuta inválida.';else{r.draft=v.draft;r.model=String(v.model||'Qwen');r.phase='done';}}
 render();
};
window.nativeSemanticUnlocked=function(){ecoAiCancel();return ecoAiPriorUnlock();};
const ecoAiPriorAct=act;
act=function(name,id,button){const c=state?.cases?currentCase():null;if(name==='ecoAiScope'){if(['paciente','manual','teoria'].includes(id)){ecoAiCancel();ecoAiScope=id;render();}return;}if(name==='ecoAiStart'){if(c&&button?.dataset?.case===c.id)ecoAiStart(c);return;}if(name==='ecoAiGenerate'){if(c&&button?.dataset?.case===c.id)ecoAiGenerate(c);return;}if(name==='ecoAiCancel'){ecoAiCancel();render();return;}if(['nav','openCase','caseTab','ecoAtlasTab'].includes(name)){ecoAiCancel();ecoAiScope='paciente';}return ecoAiPriorAct(name,id,button);};

</script></body></html>
