name: Build Mausritter R26 SCREEN_SESSION APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mausritter-r26-screen-session.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      TAG: mausritter-6.1.0-r26
      SOURCE_NAME: Mausritter_Mestre_Vivo_6.1.0-r26_SCREEN_SESSION_ANDROID_STUDIO.zip
      SOURCE_SHA256: 972e10a3d98f8ef07b7cdfe762866ab4ea02aa9bfcf9bc032fc8dd3173ebaa9c
      SOURCE_BYTES: 203121615
      APK_NAME: Mausritter_Mestre_Vivo_6.1.0-r26_SCREEN_SESSION_DEBUG.apk
      P00_ID: 0G-655hHxqjQ
      P01_ID: 1TEgmsZhqD5v
      P02_ID: YL2MToIaxdmi
      P03_ID: RJEV2JLjbXBB
      P04_ID: 7eHBLBJuOTU6
      P05_ID: cojWramW6vpt
      P06_ID: ciumtc_5ap2M
      P00_SHA: 9e69321b0bab0aafb28dd6f272531391602dbacf172b37feeec233fc176a6196
      P01_SHA: bbed972ee254e507520ba453f662cabd6f94b874891ab7ec653c0a051f4f56ce
      P02_SHA: b039055528b1e4748f195e2c95f0381d4d43cdf96ea2becb7925f770a82b7771
      P03_SHA: 395ea007944b76a4886c9e4914b2ba0ae46d2f89c56265ea904d5d57e87fc505
      P04_SHA: 56cbdc290d517b0c66019de804206e6fef681e4da13dd997a40937ffce822f49
      P05_SHA: bb8f23e4df461bce89842fd0b1076508881329ca2ddf4c2ac68f3e58cdb96865
      P06_SHA: 5a1ecaec6082d7106c36019d3524f048e61dabd69c872dd507715f971f83e60f

    steps:
      - name: Confirm BRELGA
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA; got $env:RUNNER_NAME" }
          Write-Host "Runner=$env:RUNNER_NAME"

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $candidates += 'C:\Android\Sdk'
          $sdkRoot=$null; $sdkmanager=$null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ([string]::IsNullOrWhiteSpace($candidate) -or -not (Test-Path $candidate)) { continue }
            $found=Get-ChildItem $candidate -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $sdkRoot=$candidate; $sdkmanager=$found.FullName; break }
          }
          if (-not $sdkmanager) { throw 'Android SDK/sdkmanager not found on BRELGA' }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path $sdkmanager) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $sdkRoot 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $sdkmanager --version
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager validation failed' }
          1..100 | ForEach-Object { 'y' } | & $sdkmanager --licenses | Out-Null
          & $sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package install failed' }

      - name: Download and verify R26 parts
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          function Get-Part([string]$ShareId,[string]$OutFile) {
            $api="https://api.firestorage.ai/dev/file/shares/$ShareId"
            $meta=Invoke-RestMethod -Uri "$api/files?maxResults=100"
            $files=@($meta.files)
            if ($files.Count -ne 1) { throw "Expected one file for $ShareId; found $($files.Count)" }
            $ticket=Invoke-RestMethod -Method Post -Uri "$api/files/$($files[0].fileId)/download"
            if ([string]::IsNullOrWhiteSpace($ticket.downloadUrl)) { throw "No download URL for $ShareId" }
            & curl.exe -L --fail --retry 5 --retry-delay 2 -o $OutFile $ticket.downloadUrl
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $OutFile)) { throw "Download failed $ShareId" }
          }
          Get-Part $env:P00_ID 'part.00'
          Get-Part $env:P01_ID 'part.01'
          Get-Part $env:P02_ID 'part.02'
          Get-Part $env:P03_ID 'part.03'
          Get-Part $env:P04_ID 'part.04'
          Get-Part $env:P05_ID 'part.05'
          Get-Part $env:P06_ID 'part.06'
          $parts=@(
            @{P='part.00';H=$env:P00_SHA},@{P='part.01';H=$env:P01_SHA},@{P='part.02';H=$env:P02_SHA},
            @{P='part.03';H=$env:P03_SHA},@{P='part.04';H=$env:P04_SHA},@{P='part.05';H=$env:P05_SHA},
            @{P='part.06';H=$env:P06_SHA}
          )
          foreach($p in $parts){
            $h=(Get-FileHash $p.P -Algorithm SHA256).Hash.ToLowerInvariant()
            if($h -ne $p.H){throw "Part hash mismatch $($p.P): $h"}
            Write-Host "$($p.P) PASS $h"
          }

      - name: Reconstruct exact R26 source
        id: source
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'mausritter-r26-source'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip=Join-Path $dir $env:SOURCE_NAME
          cmd.exe /c "copy /b part.00+part.01+part.02+part.03+part.04+part.05+part.06 \"$zip\" >nul"
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $zip)){throw 'R26 source reconstruction failed'}
          $bytes=(Get-Item $zip).Length
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($bytes -ne [int64]$env:SOURCE_BYTES){throw "Source size mismatch $bytes"}
          if($hash -ne $env:SOURCE_SHA256){throw "Source SHA mismatch $hash"}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[System.IO.Compression.ZipFile]::OpenRead($zip); $entries=$z.Entries.Count; $z.Dispose()
          if($entries -le 0){throw 'Source ZIP empty'}
          "$hash  $env:SOURCE_NAME" | Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "SOURCE_PASS BYTES=$bytes ENTRIES=$entries SHA256=$hash"
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$zip.sha256" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract Android project
        id: project
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.zip }}
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'mausritter-r26-work'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          & tar.exe -xf $env:SOURCE_ZIP -C $work
          if($LASTEXITCODE -ne 0){throw 'Source extraction failed'}
          $settings=Get-ChildItem $work -Recurse -File -Filter 'settings.gradle.kts' | Where-Object {
            (Test-Path (Join-Path $_.Directory.FullName 'gradlew.bat')) -and
            (Test-Path (Join-Path $_.Directory.FullName 'gradle\wrapper\gradle-wrapper.jar')) -and
            (Test-Path (Join-Path $_.Directory.FullName 'app\src\main\AndroidManifest.xml'))
          } | Select-Object -First 1
          if(-not $settings){throw 'Complete Android Studio project not found'}
          $root=$settings.Directory.FullName
          $vp=Join-Path $root '..\version.properties'
          if(-not(Test-Path $vp)){throw 'version.properties missing'}
          $v=Get-Content $vp -Raw
          if($v -notmatch 'VERSION_NAME=6\.1\.0-mausritter\.26' -or $v -notmatch 'VERSION_CODE=610026'){throw 'R26 version properties not found'}
          "root=$root" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ANDROID_ROOT=$root"

      - name: Build R26 APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Continue'
          if(Test-Path variable:PSNativeCommandUseErrorActionPreference){$PSNativeCommandUseErrorActionPreference=$false}
          $log=Join-Path $env:RUNNER_TEMP 'MAUSRITTER_R26_GRADLE_BUILD.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          & .\gradlew.bat --version --no-daemon 2>&1 | Tee-Object -FilePath $log
          if($LASTEXITCODE -ne 0){throw "Gradle wrapper failed $LASTEXITCODE"}
          & .\gradlew.bat clean assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath $log -Append
          if($LASTEXITCODE -ne 0){throw "assembleDebug failed $LASTEXITCODE"}

      - name: Validate R26 APK and SCREEN_SESSION
        id: apk
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $apk=Get-ChildItem $env:ROOT -Recurse -File -Filter '*.apk' | Where-Object { $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]' } | Sort-Object FullName | Select-Object -First 1
          if(-not $apk){throw 'Debug APK not found'}
          $out=Join-Path $env:RUNNER_TEMP 'mausritter-r26-out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $dest=Join-Path $out $env:APK_NAME
          Copy-Item $apk.FullName $dest -Force

          $buildTools=Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object { [version]($_.Name -replace '[^0-9.]','') } -Descending | Select-Object -First 1
          $aapt=Join-Path $buildTools.FullName 'aapt.exe'
          $signer=Join-Path $buildTools.FullName 'apksigner.bat'
          $badging=Join-Path $out 'MAUSRITTER_R26_APK_BADGING.txt'
          & $aapt dump badging $dest 2>&1 | Tee-Object -FilePath $badging
          if($LASTEXITCODE -ne 0){throw 'aapt validation failed'}
          $badge=Get-Content $badging -Raw
          if($badge -notmatch "package: name='com\.braseiro\.mausritter\.mestrevivo'"){throw 'Unexpected applicationId'}
          if($badge -notmatch "versionCode='610026'"){throw 'Unexpected versionCode'}
          if($badge -notmatch "versionName='6\.1\.0-mausritter\.26-debug'"){throw 'Unexpected versionName'}

          $sig=Join-Path $out 'MAUSRITTER_R26_APK_SIGNATURE.txt'
          & $signer verify --verbose --print-certs $dest 2>&1 | Tee-Object -FilePath $sig
          if($LASTEXITCODE -ne 0){throw 'APK signature verification failed'}

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[System.IO.Compression.ZipFile]::OpenRead($dest)
          $session=$z.GetEntry('assets/mausritter_session/session.html')
          $art=$z.GetEntry('assets/mausritter_session/screen_session.png')
          $atlas=$z.GetEntry('assets/mausritter_atlas/runtime/atlas_vivo.js')
          if($null -eq $session){$z.Dispose();throw 'SCREEN_SESSION html missing from APK'}
          if($null -eq $art -or $art.Length -lt 2000000){$z.Dispose();throw 'Approved SCREEN_SESSION art missing from APK'}
          if($null -eq $atlas){$z.Dispose();throw 'Atlas runtime missing from APK'}
          $sr=New-Object IO.StreamReader($session.Open());$sessionText=$sr.ReadToEnd();$sr.Dispose()
          $ar=New-Object IO.StreamReader($atlas.Open());$atlasText=$ar.ReadToEnd();$ar.Dispose();$z.Dispose()
          if($sessionText -notmatch 'screen_session\.png' -or $sessionText -notmatch 'mausritter_atlas/atlas\.html\?embed=session'){throw 'SCREEN_SESSION runtime wiring missing'}
          if($atlasText -notmatch 'MausritterSession' -or $atlasText -notmatch 'exploreCurrent' -or $atlasText -notmatch 'campCurrent'){throw 'Embedded Atlas actions missing'}

          $hash=(Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content "$dest.sha256" -Encoding ascii
          $log=Join-Path $env:RUNNER_TEMP 'MAUSRITTER_R26_GRADLE_BUILD.log'
          if(Test-Path $log){Copy-Item $log (Join-Path $out 'MAUSRITTER_R26_GRADLE_BUILD.log') -Force}
          @('SCREEN_SESSION=PASS','PACKAGE=com.braseiro.mausritter.mestrevivo','VERSION_CODE=610026','VERSION_NAME=6.1.0-mausritter.26-debug',"APK_SHA256=$hash") | Set-Content (Join-Path $out 'R26_BUILD_PROOF.txt') -Encoding utf8
          Write-Host "APK_PASS SCREEN_SESSION=PASS BYTES=$((Get-Item $dest).Length) SHA256=$hash"
          "dir=$out" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create R26 draft release
        id: release
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $headers=@{'Authorization'="Bearer $env:GITHUB_TOKEN";'Accept'='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='braseiro-brelga'}
          try{
            $old=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG"
            if($old){Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($old.id)" | Out-Null}
          }catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          $body=@{
            tag_name=$env:TAG
            target_commitish='main'
            name='Mausritter Mestre Vivo 6.1.0 R26 - SCREEN_SESSION'
            body='R26 incorpora a SCREEN_SESSION 415x915 aprovada ao runtime, com Atlas Vivo real, Mover/Explorar/Acampar e navegacao Sessao/Mapa/Ratos/Mochila. Preserva regras R20-R25 e TTS Braseiro Kokoro PT-BR.'
            draft=$true
            prerelease=$false
          } | ConvertTo-Json
          $release=Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/releases" -Body $body -ContentType 'application/json'
          "id=$($release.id)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "url=$($release.html_url)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload source and verified APK
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          SOURCE_ZIP: ${{ steps.source.outputs.zip }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          OUT_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $files=@($env:SOURCE_ZIP,$env:SOURCE_SHA)
          $files += @(Get-ChildItem $env:OUT_DIR -File | ForEach-Object {$_.FullName})
          foreach($file in $files){
            $encoded=[uri]::EscapeDataString([IO.Path]::GetFileName($file))
            $upload="https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$encoded"
            & curl.exe -L --fail --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$file" $upload
            if($LASTEXITCODE -ne 0){throw "Release upload failed for $file"}
            Write-Host "Uploaded $([IO.Path]::GetFileName($file))"
          }

      - name: Publish R26 only after assets exist
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $headers=@{'Authorization'="Bearer $env:GITHUB_TOKEN";'Accept'='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='braseiro-brelga'}
          $r=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID"
          $apk=@($r.assets | Where-Object {$_.name -eq $env:APK_NAME})
          $src=@($r.assets | Where-Object {$_.name -eq $env:SOURCE_NAME})
          $proof=@($r.assets | Where-Object {$_.name -eq 'R26_BUILD_PROOF.txt'})
          if($apk.Count -ne 1 -or $src.Count -ne 1 -or $proof.Count -ne 1){throw 'Required release assets missing'}
          $body=@{draft=$false} | ConvertTo-Json
          $published=Invoke-RestMethod -Method Patch -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID" -Body $body -ContentType 'application/json'
          Write-Host "PUBLISHED=$($published.html_url)"
