name: P70 transfer probe on BRELGA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p70-transfer-probe.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect exact firestorage download logic
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          $out=Join-Path $env:RUNNER_TEMP 'fs4899.js'
          & curl.exe -L --fail --retry 3 -o $out $url
          if($LASTEXITCODE -ne 0){ throw "curl failed $LASTEXITCODE" }
          $text=Get-Content $out -Raw
          $needles=@('window.location.assign','/download','fileId','fetch(')
          foreach($needle in $needles){
            $start=0
            while(($idx=$text.IndexOf($needle,$start,[System.StringComparison]::Ordinal)) -ge 0){
              $a=[Math]::Max(0,$idx-1400)
              $len=[Math]::Min(3200,$text.Length-$a)
              Write-Host ("---NEEDLE="+$needle+" IDX="+$idx+"---")
              Write-Host $text.Substring($a,$len)
              $start=$idx+$needle.Length
            }
          }
