name: P70 transfer probe on BRELGA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p70-transfer-probe.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect firestorage client chunk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url='https://firestorage.ai/_next/static/chunks/app/%28files%29/ja/f/page-4d19ae0a4ce39d79.js'
          $out=Join-Path $env:RUNNER_TEMP 'fs.js'
          & curl.exe -L --fail --retry 3 -o $out $url
          if ($LASTEXITCODE -ne 0) { throw "curl failed $LASTEXITCODE" }
          Write-Host "BYTES=$((Get-Item $out).Length)"
          Write-Host (Get-Content $out -Raw)
