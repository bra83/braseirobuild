name: P70 transfer probe on BRELGA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p70-transfer-probe.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Check visitor upload on P70 transfer share
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://api.firestorage.ai/dev/file/shares/UIPwpTBvtyqi/files?maxResults=1000'
          $meta=Invoke-RestMethod -Method Get -Uri $uri
          Write-Host ("allowVisitorUpload="+$meta.allowVisitorUpload)
          Write-Host ("visitorUploadRetentionHours="+$meta.visitorUploadRetentionHours)
          Write-Host ("passwordProtected="+$meta.passwordProtected)
          Write-Host ("title="+$meta.title)
