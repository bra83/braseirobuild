name: BRELGA Star Wars live probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p70-transfer-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Persist runner proof
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path diagnostics -Force | Out-Null
          @(
            "RUNNER_NAME=$env:RUNNER_NAME",
            "RUNNER_OS=$env:RUNNER_OS",
            "RUNNER_ARCH=$env:RUNNER_ARCH",
            "GITHUB_RUN_ID=$env:GITHUB_RUN_ID",
            "GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT"
          ) | Set-Content diagnostics/brelga-live.txt -Encoding utf8
          git config user.name "BRELGA Builder"
          git config user.email "brelga-builder@users.noreply.github.com"
          git add diagnostics/brelga-live.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "diagnostic: BRELGA live proof"
          git push origin HEAD:main
