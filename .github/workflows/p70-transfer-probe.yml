name: P70 transfer probe on BRELGA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p70-transfer-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect firestorage client API
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          $base='https://firestorage.ai'
          $jsUrl=$base+'/_next/static/chunks/app/(files)/ja/f/page-4d19ae0a4ce39d79.js'
          $js=Join-Path $env:RUNNER_TEMP 'firestorage-page.js'
          & curl.exe -L --fail --retry 3 -o $js $jsUrl
          if ($LASTEXITCODE -ne 0) { throw "curl failed $LASTEXITCODE" }
          $text=Get-Content $js -Raw
          Write-Host "JS_BYTES=$((Get-Item $js).Length)"
          [regex]::Matches($text,'[^,;{}]{0,180}(?:/api/|download|public_id|publicId|share_url|shareUrl|file_id|fileId)[^,;{}]{0,260}') |
            ForEach-Object { Write-Host ("MATCH="+$_.Value) }
