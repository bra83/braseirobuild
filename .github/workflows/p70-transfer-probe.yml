name: P70 transfer probe on BRELGA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p70-transfer-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Probe firestorage share
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          $url='https://firestorage.ai/ja/f/UIPwpTBvtyqi'
          $out=Join-Path $env:RUNNER_TEMP 'p70-share.html'
          & curl.exe -L --fail --retry 3 -o $out $url
          if ($LASTEXITCODE -ne 0) { throw "curl failed $LASTEXITCODE" }
          $text=Get-Content $out -Raw
          Write-Host "HTML_BYTES=$((Get-Item $out).Length)"
          Write-Host '---BEGIN_HTML---'
          Write-Host $text
          Write-Host '---END_HTML---'
