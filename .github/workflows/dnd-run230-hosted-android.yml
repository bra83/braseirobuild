name: Braseiro DnD RUN230 hosted Android validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dnd-run230-hosted-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-run230-hosted
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Download and authenticate RUN230 source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'gdown==5.2.0'
          python3 ci/dnd-run230/fetch_source.py --output "$RUNNER_TEMP/dnd230"
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Java, run unit tests and build APK candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/dnd230/out"
          cd "$RUNNER_TEMP/dnd230/source/android"
          chmod +x gradlew
          for task in :app:compileDebugJavaWithJavac :app:testDebugUnitTest :app:assembleDebug; do
            label="${task//:/_}"
            set +e
            ./gradlew "$task" --no-daemon --console=plain --stacktrace >"$OUT/$label.log" 2>&1
            rc=$?
            set -e
            echo "$task exit=$rc" | tee -a "$OUT/GRADLE_STATUS.txt"
            if [ "$rc" -ne 0 ]; then tail -100 "$OUT/$label.log"; exit "$rc"; fi
          done
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          cp "$APK" "$OUT/BRASEIRO_DND_RUN230_UNCERTIFIED_DEBUG.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/BRASEIRO_DND_RUN230_UNCERTIFIED_DEBUG.apk" >"$OUT/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.dnd5e'" "$OUT/APK_BADGING.txt"
          grep -q "versionCode='606530'" "$OUT/APK_BADGING.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT/BRASEIRO_DND_RUN230_UNCERTIFIED_DEBUG.apk" >"$OUT/APK_SIGNATURE.txt"
          sha256sum "$OUT/BRASEIRO_DND_RUN230_UNCERTIFIED_DEBUG.apk" >"$OUT/APK_SHA256.txt"
          echo 'ANDROID_APK=COMPILED; UPGRADE_SIGNING_MATCH=NOT_VERIFIED; G05_COMPLETE=NO' >>"$OUT/GRADLE_STATUS.txt"
      - name: Preserve evidence and candidate APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DND_RUN230_HOSTED_ANDROID
          path: ${{ runner.temp }}/dnd230/out/*
          if-no-files-found: warn
          retention-days: 14
