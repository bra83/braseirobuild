name: Audit OUA 4.9.4 Runtime

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-oua-4.9.4-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          gh release download OUA-v4.9.4 -R bra83/braseirobuild --pattern 'OUA_4.9.4_VISUAL_FIX_ANDROID_STUDIO.zip' --dir incoming
          unzip -q incoming/OUA_4.9.4_VISUAL_FIX_ANDROID_STUDIO.zip -d work
          ROOT="$(dirname "$(find work -maxdepth 3 -type f -name package.json | head -n1)")"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Bridge audit
        shell: bash
        run: |
          set -euo pipefail
          echo '===== geminiTransport ====='
          sed -n '1,180p' "$ROOT/lib/geminiTransport.ts"
          echo '===== bridge callback search ====='
          grep -RniE --include='*.ts' --include='*.tsx' --include='*.kt' '__braseiroGeminiCallbacks|geminiRequest\(' "$ROOT" | grep -vE '/dist/|/android/app/src/main/assets/' | head -n 400 || true
          echo '===== MainActivity bridge ====='
          sed -n '2128,2170p' "$ROOT/android/app/src/main/java/com/braseiro/oumanel/MainActivity.kt"
          echo '===== declarations ====='
          grep -RniE --include='*.d.ts' --include='*.ts' 'BraseiroAndroid|geminiRequest' "$ROOT" | grep -vE '/dist/|/android/app/src/main/assets/' | head -n 400 || true
