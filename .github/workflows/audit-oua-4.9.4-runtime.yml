name: Audit OUA 4.9.5 Runtime

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-oua-4.9.4-runtime.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          gh release download OUA-v4.9.5 -R bra83/braseirobuild --pattern 'OUA_4.9.5_ATLAS_RECOVERY_ANDROID_STUDIO.zip' --dir incoming
          unzip -q incoming/OUA_4.9.5_ATLAS_RECOVERY_ANDROID_STUDIO.zip -d work
          ROOT="$(dirname "$(find work -maxdepth 4 -type f -name package.json | head -n1)")"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT"
      - name: Inspect 4.9.5
        shell: bash
        run: |
          set -euo pipefail
          echo '===== package/version ====='
          cat "$ROOT/package.json" | head -n 30
          grep -n "APP_VERSION" "$ROOT/lib/version.ts" || true
          echo '===== Settings ====='
          sed -n '1,180p' "$ROOT/components/SettingsView.tsx"
          echo '===== models ====='
          grep -n -B4 -A8 "ECONOMY_MODEL\|CINEMATIC_MODEL" "$ROOT/services/geminiService.ts" || true
          echo '===== immersive background ====='
          sed -n '1,190p' "$ROOT/components/immersive/ImmersiveJourneyView.tsx"
          echo '===== GameView immersive ====='
          sed -n '315,355p' "$ROOT/components/GameView.tsx"
          echo '===== start/reset ====='
          grep -n -B8 -A55 "handleStartAdventure\|handleResetCampaign" "$ROOT/App.tsx" | head -n 260
          echo '===== map exports ====='
          grep -nE "^export (async )?function|^export const" "$ROOT/lib/map.ts" | grep -E "Discovery|Map|Hex|Location" | head -n 180
          echo '===== map discovery persistence refs ====='
          grep -RniE --include='*.ts' --include='*.tsx' "saveMapDiscovery|loadMapDiscovery|currentHexId" "$ROOT/App.tsx" "$ROOT/components" "$ROOT/lib" | head -n 400
