name: Audit OUA 4.9.4 Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-oua-4.9.4-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          gh release download OUA-v4.9.4 -R bra83/braseirobuild --pattern 'OUA_4.9.4_VISUAL_FIX_ANDROID_STUDIO.zip' --dir incoming
          unzip -q incoming/OUA_4.9.4_VISUAL_FIX_ANDROID_STUDIO.zip -d work
          ROOT="$(dirname "$(find work -maxdepth 3 -type f -name package.json | head -n1)")"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Focused source dump
        shell: bash
        run: |
          set -euo pipefail
          echo '===== App.tsx 1940-2055 ====='
          sed -n '1940,2055p' "$ROOT/App.tsx"
          echo '===== App.tsx 2100-2185 ====='
          sed -n '2100,2185p' "$ROOT/App.tsx"
          echo '===== App.tsx currentImage state/handlers ====='
          grep -n -B8 -A18 'currentImage\|setCurrentImage\|handleImportSceneImage\|handleRegenerateImage' "$ROOT/App.tsx" | head -n 700 || true
          echo '===== SettingsView.tsx ====='
          sed -n '1,240p' "$ROOT/components/SettingsView.tsx"
          echo '===== ImmersiveJourneyView.tsx ====='
          sed -n '1,260p' "$ROOT/components/immersive/ImmersiveJourneyView.tsx"
          echo '===== GameView immersive section ====='
          sed -n '300,430p' "$ROOT/components/GameView.tsx"
          echo '===== GameView adventure section ====='
          sed -n '450,525p' "$ROOT/components/GameView.tsx"
          echo '===== geminiService models ====='
          sed -n '60,115p' "$ROOT/services/geminiService.ts"
          sed -n '430,585p' "$ROOT/services/geminiService.ts"
          echo '===== apiKey ====='
          sed -n '1,180p' "$ROOT/lib/apiKey.ts"
