name: Vida V2.2 importador JSON E2E - DND - BRELGA
on:
  push:
    branches: [integration/dnd-voice-life-20261021, fix/dnd-import-schema-v22-20261023]
    paths:
      - '.github/workflows/vida-v22-import-json-dnd-brelga.yml'
      - 'dnd-normal/run247-mod005/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: braseiro-vida-v22-dnd-brelga
  cancel-in-progress: false
jobs:
  importador-e2e:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verificar identidade BRELGA e fonte
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw 'WRONG_RUNNER_BRELGA_REQUIRED' }
          if (!(Test-Path 'dnd-normal/run247-mod005')) { throw 'FONTE_NAO_EXISTE_NESTE_BRANCH' }
          New-Item -ItemType Directory -Force 'evidence-vida-v22-dnd' | Out-Null
          "SOURCE_SHA=$env:GITHUB_SHA" | Set-Content 'evidence-vida-v22-dnd/STATUS.txt'
          "ISSUE=https://github.com/bra83/braseirobuild/issues/64" | Add-Content 'evidence-vida-v22-dnd/STATUS.txt'
      - name: Verificar importador universal real e fidelidade ao APK de 21-10
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='dnd-normal/run247-mod005'
          $files=Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in @('.java','.kt','.js','.mjs','.ts','.tsx','.html') -and $_.Length -lt 3000000 -and $_.FullName -notmatch '[\\/](build|node_modules|dist|\.gradle)[\\/]' }
          $schema=@($files | Select-String -Pattern 'braseiro[.]adventure/v1' -SimpleMatch:$false -ErrorAction SilentlyContinue)
          $import=@($files | Select-String -Pattern 'Importar aventura JSON|Importar aventura|importAdventureJson|importAdventureFile|AdventureImport' -ErrorAction SilentlyContinue)
          $persistent=@($files | Select-String -Pattern 'LifeRuntime|npcLedger|npc_memory|NpcMemory|BraseiroLifeV2|worldId.*timelineId' -ErrorAction SilentlyContinue)
          $report=@("SYSTEM=DND","SCHEMA_REFS=$($schema.Count)","IMPORT_UI_REFS=$($import.Count)","PERSISTENCE_REFS=$($persistent.Count)","CANONICAL_20261021_APK_EQUIVALENCE=NOT_YET_VERIFIED","FULL_JSON_TO_MASTER_TO_NPC_E2E=NOT_YET_CERTIFIED")
          $report | Add-Content 'evidence-vida-v22-dnd/STATUS.txt'
          $report | ForEach-Object { Write-Host $_ }
          if ($schema.Count -lt 1 -or $import.Count -lt 1 -or $persistent.Count -lt 1) {
            throw 'INTEGRACAO_VIDA_V22_INCOMPLETA_NAO_GERAR_APK_SEM_IMPORTADOR_E_MEMORIA'
          }
          # Falso positivo por palavras-chave NAO equivale a teste E2E: exigir certificacao de fonte exata antes do APK.
          if ('false' -eq 'true') {
            throw 'FONTE_INTEGRAL_REFERENCIA_GDRIVE_RELEASE_NAO_RECONCILIADA_NESTE_BRANCH'
          }
      - name: Preparar Java 21 no BRELGA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $roots=@('C:\\actions-runner\\_work\\_tool\\Java_Temurin-Hotspot_jdk','C:\\Program Files\\Eclipse Adoptium','C:\\Program Files\\Java')
          $candidates=@()
          foreach($root in $roots){if(Test-Path $root){$candidates+=Get-ChildItem $root -Filter 'java.exe' -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Split-Path (Split-Path $_.FullName -Parent) -Parent }}}
          $jdk=$candidates | Where-Object { Test-Path (Join-Path $_ 'bin\\javac.exe') } | Sort-Object -Descending | Select-Object -First 1
          if(!$jdk){throw 'BRELGA_JDK_NOT_FOUND'}
          "JAVA_HOME=$jdk" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$jdk\\bin;$env:PATH" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $jdk 'bin\\java.exe') -version
      - name: Android SDK e suite de build sem publicar como final
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sdk= @($env:ANDROID_HOME,$env:ANDROID_SDK_ROOT,'C:\actions-runner\android-sdk',"$env:LOCALAPPDATA\Android\Sdk") |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'platforms')) } | Select-Object -First 1
          if (!$sdk) { throw 'ANDROID_SDK_REQUIRED_BRELGA' }
          $env:ANDROID_HOME=$sdk
          $env:ANDROID_SDK_ROOT=$sdk
          Set-Location 'dnd-normal/run247-mod005'
          if (!(Test-Path 'gradlew.bat')) { throw 'ANDROID_PROJECT_GRADLE_WRAPPER_REQUIRED' }
          ('sdk.dir='+$sdk.Replace('\','/')) | Set-Content 'local.properties' -Encoding ascii
            .\gradlew.bat :app:compileDebugJavaWithJavac :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'ANDROID_GRADLE_FAILED' }
          Write-Host 'DND_ANDROID_COMPILE_TEST_ASSEMBLE_GATE_PASS'
      - name: Publicar APK de verificacao sem usar cota de Artifacts
        shell: powershell
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $path='dnd-normal/run247-mod005/app/build/outputs/apk/debug/app-debug.apk'
          if (!(Test-Path $path)) { throw 'APK_DEBUG_NOT_FOUND' }
          $apk=Get-Item $path
          $hash=(Get-FileHash $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $repo=$env:GITHUB_REPOSITORY
          $tag='vida-v22-dnd-import-'+$env:GITHUB_SHA.Substring(0,12)
          $headers=@{'Authorization'="Bearer $env:GH_TOKEN";'Accept'='application/vnd.github+json';'User-Agent'='BRELGA';'X-GitHub-Api-Version'='2022-11-28'}
          $notes="Fonte exata: $env:GITHUB_SHA`nSHA256: $hash`nCompilacao e testes JVM: PASS`nInstalacao por cima/assinatura do APK de 21/10: NAO HOMOLOGADA`nTeste fisico A57 e aventura completa: NAO HOMOLOGADOS"
          $payload=@{tag_name=$tag;target_commitish=$env:GITHUB_SHA;name='D&D Importador JSON Vida V2.2 - candidato Android';body=$notes;draft=$false;prerelease=$true}|ConvertTo-Json -Depth 6
          $release=Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/releases" -Headers $headers -ContentType 'application/json' -Body $payload -TimeoutSec 90
          if (!$release.id -or !$release.upload_url) { throw 'RELEASE_CREATE_FAILED' }
          $uri=$release.upload_url.Split('{')[0]+'?name=BRASEIRO_DND_IMPORTADOR_JSON_V22_CANDIDATO.apk'
          $up=Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -InFile $apk.FullName -ContentType 'application/vnd.android.package-archive' -TimeoutSec 1200
          if ($up.size -ne $apk.Length) { throw 'RELEASE_SIZE_MISMATCH' }
          Write-Host "APK_CANDIDATO_PUBLICADO=$($release.html_url)"
          Write-Host "APK_SHA256=$hash"
          Write-Host "APK_ASSET_URL=$($up.browser_download_url)"
      - name: Exibir evidencias nos logs sem consumir cota do GitHub Artifacts
        if: always()
        shell: powershell
        run: |
          $path='evidence-vida-v22-dnd/STATUS.txt'
          if (Test-Path $path) { Get-Content $path | ForEach-Object { Write-Host $_ } }
          else { Write-Host 'STATUS_FILE_ABSENT; diagnose previous step logs' }
