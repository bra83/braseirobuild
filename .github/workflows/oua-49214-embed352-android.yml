name: OUA 4.9.214 — 472 Tokens + TTS + Gemini
on:
  push:
    branches: [feature/oua-49214-hero-token-catalog]
    paths:
      - ".github/workflows/oua-49214-embed352-android.yml"
  workflow_dispatch:
concurrency:
  group: oua-49214-472-tokens-final
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/oua-braseiro-tts
            ci/oua-4.9.214
            build-signing
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download exactly the original 352 transparent PNG tokens
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --user --quiet gdown Pillow
          cat > "$RUNNER_TEMP/fetch-352.py" <<'PY'
          import gdown,pathlib,hashlib,time,zipfile,sys
          root=pathlib.Path(sys.argv[1]);root.mkdir(parents=True,exist_ok=True)
          ids=["1JqL6rbjpj83q_k1ul7xVlFZ4SUjUY1Rg","135s4ms4jmSR1c2pvpLbDRk4Ln-V4SbZb","1Rg7Bq5PTZpkZqKJMmf0LKJqaASr1vAwE","1nCxfFeH5d-Xo2t4wJN-PWZcIuTyQ_lTW","1u-INYbhuwErkqhUc14O2YwfeFhQwIzDa","1EpI73-PAqjBiq-JnnvD-_lsQsLFu43nR","1UkMW7uxZCj5oWSBes8d1owco8k6IFPYU","1KSJPagmcGORdZiomPSMIUG2XONKPhf3y","1yZU2iGjg0wIjrB1A23M3OcAMELJ9kU_s","1cgEysQxaSa9Cl4nvvlnFntIBdP66EWUJ","1A7mdJOF8NevNEHTYcK7Cues9lAKwfink","1DqczCfZ_UatQKlZwAGZ9VCl-lir8b15S","1BfWSoJTKGi6to-Wijh6QzE15ARdpFqWc","1LHYBQZkJLuTSCGToiQb_UGh8Stzu9aB1","1IFxaSRO7jy2tkpVW5jLPdSMo6U8AVLQd","12Vk5LU0uPpE3IsxXH7PmilVPrfKxnkfa"]
          parts=[]
          for n,drive_id in enumerate(ids):
              dest=root/f'part{n:02d}'
              for attempt in range(3):
                  try:
                      if not dest.exists() or dest.stat().st_size!= (7000000 if n<15 else 5560677):
                          got=gdown.download(id=drive_id,output=str(dest),quiet=True)
                          if not got:raise RuntimeError('Download returned empty path')
                      size=dest.stat().st_size
                      expected=7000000 if n<15 else 5560677
                      if size!=expected:raise RuntimeError(f'Part {n} size mismatch {size} expected {expected}')
                      print(f'OUA352_PART_{n:02d}_OK size={size}',flush=True)
                      break
                  except Exception as e:
                      if dest.exists():dest.unlink()
                      if attempt==2:raise
                      time.sleep(3*(attempt+1))
              parts.append(dest)
          target=root/'original352.zip'
          with target.open('wb') as f:
           for p in parts:
              with p.open('rb') as r:
               while True:
                b=r.read(1048576)
                if not b:break
                f.write(b)
          sha=hashlib.sha256(target.read_bytes()).hexdigest()
          assert sha=='a30da14b31867e9e5f01dc837046b21ebff0ceb0d16852bfb6e09724a0e19039',f'ORIGINAL_SHA_MISMATCH:{sha}'
          with zipfile.ZipFile(target) as z:
           assert z.testzip() is None
           assert len([x for x in z.namelist() if x.lower().endswith('.png')])==352
          print('OUA_49214_ORIGINAL_352_REASSEMBLED_SHA256_PASS',flush=True)
          PY
          python "$RUNNER_TEMP/fetch-352.py" "$RUNNER_TEMP/oua-49214-pack"
      - name: Fetch the latest validated canonical OUA Android project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oua-49214/source"
          gh release download OUA-v4.9.211 --repo "$GITHUB_REPOSITORY" --pattern 'BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip' --dir "$RUNNER_TEMP/oua-49214" --clobber
          unzip -q "$RUNNER_TEMP/oua-49214/BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip" -d "$RUNNER_TEMP/oua-49214/source"
          PKG=""
          while IFS= read -r candidate; do
            if [ -d "$(dirname "$candidate")/android" ]; then PKG="$candidate"; break; fi
          done < <(find "$RUNNER_TEMP/oua-49214/source" -type f -name package.json -not -path '*/node_modules/*' | sort)
          test -n "$PKG"
          echo "OUA_ROOT=$(dirname "$PKG")" >> "$GITHUB_ENV"
      - name: Integrate stable TTS, Gemini continuation, hero picker and 352 token PNGs
        shell: bash
        run: |
          set -euo pipefail
          node ci/oua-braseiro-tts/apply.mjs "$OUA_ROOT"
          node ci/oua-braseiro-tts/patch-ui.mjs "$OUA_ROOT"
          node ci/oua-braseiro-tts/auto-tags-apply.mjs "$OUA_ROOT"
          node ci/oua-braseiro-tts/auto-tags-verify.mjs "$OUA_ROOT"
          node ci/oua-braseiro-tts/turn-continuity-apply.mjs "$OUA_ROOT"
          node ci/oua-braseiro-tts/turn-continuity-verify.mjs "$OUA_ROOT"
          node ci/oua-4.9.214/apply-hero-token-catalog.mjs "$OUA_ROOT"
          python ci/oua-4.9.214/embed-352-tokens.py "$RUNNER_TEMP/oua-49214-pack/original352.zip" "$OUA_ROOT"
      - name: Verify React build and all bundled assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUA_ROOT"
          npm config set registry https://registry.npmjs.org/
          npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund esbuild @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
          npm run lint
          npm run build
          node scripts/sync-android-assets.mjs
          node "$GITHUB_WORKSPACE/ci/oua-braseiro-tts/turn-continuity-verify.mjs" "$OUA_ROOT"
          python - <<'PY'
          import os,json,pathlib
          root=pathlib.Path(os.environ['OUA_ROOT']);assets=root/'android/app/src/main/assets/tor2e-ui'
          m=json.loads((root/'public/tor2e-ui/hero-token-pack-352.json').read_text())
          old=json.loads((root/'public/tor2e-ui/party-token-manifest.json').read_text())
          assert len(m['tokens'])==352 and len(old['tokens'])==120
          for t in m['tokens']:
              assert (root/'public/tor2e-ui/assets'/t['asset']).is_file(),t['asset']
          print('OUA_49214_WEB_472_TOKEN_MANIFESTS_PASS')
          PY
      - name: Build signed Android APK 4.9.214
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 -d "$GITHUB_WORKSPACE/build-signing/braseiro-stable-debug.keystore.b64" > "$HOME/.android/debug.keystore"
          cd "$OUA_ROOT/android"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | sort | head -n 1)"
          test -s "$APK"
          DEST="$RUNNER_TEMP/BRASEIRO_O_UM_ANEL_4.9.214_472_TOKENS_TTS_GEMINI.apk"
          cp "$APK" "$DEST"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/aapt" dump badging "$DEST" > "$RUNNER_TEMP/APK_BADGING.txt"
          "$TOOLS/apksigner" verify --verbose --print-certs "$DEST" > "$RUNNER_TEMP/APK_SIGNATURE.txt"
          grep -q "package: name='com.braseiro.oumanel'" "$RUNNER_TEMP/APK_BADGING.txt"
          grep -q "versionCode='49214'" "$RUNNER_TEMP/APK_BADGING.txt"
          grep -q "versionName='4.9.214'" "$RUNNER_TEMP/APK_BADGING.txt"
          grep -q 'b08a0f2943a4786e87e8202bcfa78bb7d6eea431861bae1c46333aec19e4df8e' "$RUNNER_TEMP/APK_SIGNATURE.txt"
          python - "$DEST" <<'PY'
          import sys,json,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              paths=set(z.namelist())
              m=json.loads(z.read('assets/tor2e-ui/hero-token-pack-352.json'))
              old=json.loads(z.read('assets/tor2e-ui/party-token-manifest.json'))
              assert len(m['tokens'])==352 and len(old['tokens'])==120
              for t in m['tokens']:
                  name='assets/tor2e-ui/assets/'+t['asset']
                  assert name in paths,name
              assert len([x for x in paths if x.startswith('assets/tor2e-ui/assets/party/characters/braseiro352/') and x.endswith('.png')])==352
              assert any(x.endswith('.js') and x.startswith('assets/assets/index') for x in paths)
          print('OUA_49214_FINAL_APK_472_TOKENS_VERIFIED')
          PY
          sha256sum "$DEST" > "$RUNNER_TEMP/APK_SHA256.txt"
          echo 'OUA_49214_SIGNED_APK_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_O_UM_ANEL_4.9.214_472_TOKENS_TTS_GEMINI
          path: |
            ${{ runner.temp }}/BRASEIRO_O_UM_ANEL_4.9.214_472_TOKENS_TTS_GEMINI.apk
            ${{ runner.temp }}/APK_SHA256.txt
            ${{ runner.temp }}/APK_BADGING.txt
            ${{ runner.temp }}/APK_SIGNATURE.txt
          if-no-files-found: error
