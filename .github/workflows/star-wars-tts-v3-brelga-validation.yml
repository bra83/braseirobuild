name: Star Wars TTS v3 BRELGA real-runtime validation
on:
  push:
    branches: [feature/tts-universal-v3-star-wars-20261020]
    paths:
      - 'star-wars/r54/source/**'
      - '.github/workflows/star-wars-tts-v3-brelga-validation.yml'
permissions:
  contents: write
concurrency:
  group: star-wars-tts-v3-brelga
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: star-wars/r54/source
      - name: Install Java 21 on the BRELGA runner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate and validate Android SDK on BRELGA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'EXPECTED_BRELGA'}
          $candidates=@('C:\actions-runner\android-sdk', 'C:\Android\Sdk', $env:ANDROID_SDK_ROOT, $env:ANDROID_HOME)
          if($env:LOCALAPPDATA){$candidates+=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          $sdk=$null
          foreach($candidate in ($candidates|Where-Object{$_}|Select-Object -Unique)){
            if((Test-Path (Join-Path $candidate 'platforms')) -and
               (Test-Path (Join-Path $candidate 'build-tools')) -and
               (Test-Path (Join-Path $candidate 'platform-tools'))){
              $sdk=(Resolve-Path $candidate).Path;break
            }
          }
          if(!$sdk){throw 'ANDROID_SDK_MISSING_ON_BRELGA'}
          $env:ANDROID_HOME=$sdk
          $env:ANDROID_SDK_ROOT=$sdk
          "ANDROID_HOME=$sdk"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $project=Join-Path $env:GITHUB_WORKSPACE 'star-wars/r54/source'
          if(!(Test-Path (Join-Path $project 'gradlew.bat'))){throw 'ANDROID_PROJECT_ROOT_MISSING'}
          $escaped=$sdk.Replace('\','/')
          "sdk.dir=$escaped"|Set-Content -LiteralPath (Join-Path $project 'local.properties') -Encoding ASCII
          Write-Host 'BRELGA_SDK_RESOLVED=PASS'
      - name: Gate exact runtime entry and TTS v3 contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'WRONG_RUNNER'}
          Set-Location 'star-wars/r54/source'
          node --check app/src/main/assets/vtt/js/ui/tts.mjs
          if($LASTEXITCODE -ne 0){throw 'WEB_TTS_SYNTAX_FAILED'}
          node --test tests/tts-universal-v3-bridge.test.mjs tests/r54-p76-tts-kokoro-pipeline.test.mjs tests/r54-p77-android-build-fix.test.mjs
          if($LASTEXITCODE -ne 0){throw 'TTS_V3_SOURCE_TESTS_FAILED'}
          $entry=Get-Content 'app/src/main/java/com/braseiro/starwarsedge/MainActivity.java' -Raw
          if(!$entry.Contains('r46-shell.html')){throw 'ANDROID_ENTRY_UNKNOWN'}
          Write-Host 'SW_REAL_RUNTIME_SOURCE_GATES_PASS'
      - name: Full Android JVM and compilation regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location 'star-wars/r54/source'
          .\gradlew.bat :app:compileDebugJavaWithJavac :app:testDebugUnitTest --no-daemon --console=plain
          if($LASTEXITCODE -ne 0){throw 'SW_ANDROID_JVM_REGRESSION_FAILED'}
      - name: Assemble only after source and JVM gates passed
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location 'star-wars/r54/source'
          .\gradlew.bat :app:assembleDebug --no-daemon --console=plain
          if($LASTEXITCODE -ne 0){throw 'SW_APK_BUILD_FAILED'}
      - name: Verify package/signature and preserve internal evidence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $apk='star-wars/r54/source/app/build/outputs/apk/debug/app-debug.apk'
          if(!(Test-Path $apk)){throw 'SW_APK_MISSING'}
          $sdk=$env:ANDROID_HOME;if(!$sdk){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          $toolDir=Get-ChildItem (Join-Path $sdk 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if(!$toolDir){throw 'SW_BUILD_TOOLS_MISSING'}
          $badging=(& (Join-Path $toolDir.FullName 'aapt.exe') dump badging $apk)-join "`n"
          if($LASTEXITCODE -ne 0 -or $badging -notmatch "package: name='com[.]braseiro[.]starwarsedge'"){throw 'SW_APPLICATION_ID_MISMATCH'}
          $cert=(& (Join-Path $toolDir.FullName 'apksigner.bat') verify --verbose --print-certs $apk)-join "`n"
          if($LASTEXITCODE -ne 0){throw 'SW_APK_SIGNATURE_INVALID'}
          $hash=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Path evidence -Force|Out-Null
          Copy-Item $apk 'evidence/star-wars-tts-v3-internal-verification.apk'
          @("HEAD=$env:GITHUB_SHA","APK_SHA256=$hash","ANDROID_JVM=PASS","APP_ID=PASS","SIGNED=PASS","INSTALL_OVER=NOT_TESTED","A57_AUDIO=NOT_TESTED","FINAL_RELEASE=BLOCKED") | Set-Content evidence/provenance.txt
          Write-Host "SW_INTERNAL_BUILD_SHA256=$hash"
      - name: Publish signed APK to draft GitHub Release via REST (no gh binary)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 18
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='braseiro-star-wars-tts-v3-'+$env:GITHUB_SHA.Substring(0,12)
          $apk='evidence/star-wars-tts-v3-internal-verification.apk'
          $proof='evidence/provenance.txt'
          if(!(Test-Path -LiteralPath $apk) -or !(Test-Path -LiteralPath $proof)){throw 'APK_OR_PROVENANCE_MISSING'}
          if(!$env:GH_TOKEN){throw 'WORKFLOW_CONTENTS_WRITE_TOKEN_MISSING'}
          $headers=@{'Authorization'="Bearer $env:GH_TOKEN";'Accept'='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Braseiro-BRELGA'}
          $body=@{tag_name=$tag;target_commitish=$env:GITHUB_SHA;name='Star Wars · TTS v3 · APK assinado (homologação Android pendente)';body='Built on BRELGA. Source and Android signatures PASS. A57 physical playback and install-over-existing NOT TESTED. Not marked final.';draft=$true;prerelease=$false}
          $release=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ($body | ConvertTo-Json -Depth 6) -TimeoutSec 90
          if(!$release.id -or !$release.upload_url){throw 'DRAFT_RELEASE_CREATION_INCOMPLETE'}
          $upload=$release.upload_url.Split('{')[0]
          foreach($file in @($apk,$proof)){
            $name=[Uri]::EscapeDataString([IO.Path]::GetFileName($file))
            $uri=$upload+'?name='+$name
            $uploaded=Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $file -TimeoutSec 900
            if(!$uploaded.id -or $uploaded.size -ne (Get-Item $file).Length){throw 'RELEASE_UPLOAD_SIZE_MISMATCH'}
            Write-Host ("RELEASE_ASSET_STORED="+$uploaded.name+" bytes="+$uploaded.size)
          }
          $assets=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets" -Method Get -Headers $headers -TimeoutSec 90
          $names=@($assets | ForEach-Object {$_.name})
          foreach($file in @($apk,$proof)){
            if($names -notcontains [IO.Path]::GetFileName($file)){throw 'RELEASE_ASSET_MISSING_AFTER_UPLOAD'}
          }
          Write-Host ("DRAFT_RELEASE_APK_DELIVERED="+$release.html_url)
          Write-Host 'A57_HOMOLOGATION=NOT_TESTED'
