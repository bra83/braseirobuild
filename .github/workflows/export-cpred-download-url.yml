name: Export Cyberpunk APK signed download URL

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-cpred-download-url.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Generate signed GitHub release asset URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # refreshed for R4.64.2 source recovery
          ASSET_ID=562179248
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          HDR="$(mktemp)"
          curl -sS -D "$HDR" -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL"
          URL="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$HDR")"
          [ -n "$URL" ] || { echo 'missing redirect'; cat "$HDR"; exit 1; }
          printf 'SIGNED_URL_B64=%s\n' "$(printf '%s' "$URL" | base64 -w0)"
