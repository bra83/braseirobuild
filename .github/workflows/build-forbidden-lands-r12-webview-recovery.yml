name: Forbidden Lands 3.3.8 R12 WebView Recovery

on:
  push:
    paths:
      - '.github/workflows/build-forbidden-lands-r12-webview-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forbidden-lands-r12-webview-recovery
  cancel-in-progress: true

env:
  FIRESTORAGE_API: "https://api.firestorage.ai/dev/file/shares/9U2Qwn54TgjB"
  SOURCE_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5_BUGREPORT_FREEZE_FIX_R6_1_SOURCE.zip"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.8_R12_WEBVIEW_RECOVERY.apk"
  EXPECTED_SHA1: "9d0f1089b3fb6c225f1f59462750864e897c4d92"

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact source
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID=$(curl -fsSL "$FIRESTORAGE_API/files?maxResults=100" | jq -r --arg n "$SOURCE_NAME" '.files[] | select(.fileName==$n) | .fileId' | head -n1)
          test -n "$FILE_ID"
          URL=$(curl -fsSL -X POST "$FIRESTORAGE_API/files/$FILE_ID/download" | jq -r '.downloadUrl')
          test -n "$URL"
          rm -rf work/fl && mkdir -p work/fl
          curl -fL --retry 3 "$URL" -o work/source.zip
          unzip -q work/source.zip -d work/fl

      - name: Apply R10 plus native renderer recovery
        shell: bash
        run: |
          set -euo pipefail
          node ci/forbidden-lands-r10/apply-r10.mjs work/fl
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('work/fl')

          main = root/'android/app/src/main/java/com/braseiro/forbiddenlands/MainActivity.java'
          s = main.read_text()
          s = s.replace('import android.os.Bundle;', '''import android.os.Bundle;
          import android.content.SharedPreferences;
          import android.util.Log;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewParent;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebView;''')
          s = s.replace('import com.getcapacitor.BridgeActivity;', '''import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.WebViewListener;''')
          s = s.replace('public class MainActivity extends BridgeActivity {', '''public class MainActivity extends BridgeActivity {
              private static final String TAG = "BraseiroMainActivity";
              private static final String RECOVERY_PREFS = "webview_renderer_recovery";
              private static final long RENDERER_RECOVERY_WINDOW_MS = 60000L;
              private boolean rendererRecoveryScheduled = false;

              private void installRendererRecovery() {
                  if (getBridge() == null || getBridge().getWebView() == null) return;

                  final WebView currentWebView = getBridge().getWebView();
                  final SharedPreferences prefs = getSharedPreferences(RECOVERY_PREFS, MODE_PRIVATE);
                  final long now = System.currentTimeMillis();
                  final long lastCrashAt = prefs.getLong("last_crash_at", 0L);
                  final int recentCrashCount = now - lastCrashAt <= RENDERER_RECOVERY_WINDOW_MS
                      ? prefs.getInt("recent_crash_count", 0)
                      : 0;

                  if (recentCrashCount >= 2) {
                      currentWebView.setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                      Log.w(TAG, "WebView renderer safe mode enabled after repeated native crashes.");
                  }

                  getBridge().addWebViewListener(new WebViewListener() {
                      @Override
                      public boolean onRenderProcessGone(WebView webView, RenderProcessGoneDetail detail) {
                          if (rendererRecoveryScheduled) return true;
                          rendererRecoveryScheduled = true;

                          final long crashAt = System.currentTimeMillis();
                          final long previous = prefs.getLong("last_crash_at", 0L);
                          final int count = crashAt - previous <= RENDERER_RECOVERY_WINDOW_MS
                              ? prefs.getInt("recent_crash_count", 0) + 1
                              : 1;
                          prefs.edit()
                              .putLong("last_crash_at", crashAt)
                              .putInt("recent_crash_count", count)
                              .apply();

                          Log.e(TAG,
                              "WebView renderer died. didCrash=" + detail.didCrash() +
                              ", priorityAtExit=" + detail.rendererPriorityAtExit() +
                              ", recoveryCount=" + count);

                          try {
                              ViewParent parent = webView.getParent();
                              if (parent instanceof ViewGroup) {
                                  ((ViewGroup) parent).removeView(webView);
                              }
                              webView.stopLoading();
                              webView.removeAllViews();
                              webView.destroy();
                          } catch (Throwable cleanupError) {
                              Log.e(TAG, "Renderer cleanup failed", cleanupError);
                          }

                          getWindow().getDecorView().postDelayed(() -> {
                              if (!isFinishing() && !isDestroyed()) {
                                  Log.w(TAG, "Recreating Capacitor activity after WebView renderer crash.");
                                  recreate();
                              }
                          }, 250L);

                          return true;
                      }
                  });
              }''')
          s = s.replace('''        controller.setAppearanceLightStatusBars(false);
                  controller.setAppearanceLightNavigationBars(false);''', '''        controller.setAppearanceLightStatusBars(false);
                  controller.setAppearanceLightNavigationBars(false);

                  installRendererRecovery();''')
          main.write_text(s)

          manifest = root/'android/app/src/main/AndroidManifest.xml'
          m = manifest.read_text()
          if 'android:hardwareAccelerated="true"' not in m:
              m = m.replace('<application\\n', '<application\\n        android:hardwareAccelerated="true"\\n')
          manifest.write_text(m)

          pkg_path = root/'package.json'
          pkg = json.loads(pkg_path.read_text())
          pkg['version'] = '3.3.8'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2)+'\\n')

          lock_path = root/'package-lock.json'
          if lock_path.exists():
              lock = json.loads(lock_path.read_text())
              lock['version'] = '3.3.8'
              if isinstance(lock.get('packages'), dict) and '' in lock['packages']:
                  lock['packages']['']['version'] = '3.3.8'
              lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2)+'\\n')

          for file in (root/'scripts').iterdir():
              if not file.is_file():
                  continue
              t = file.read_text(errors='ignore')
              t = t.replace('3\\\\.3\\\\.6','3\\\\.3\\\\.8').replace('3.3.6','3.3.8').replace('303600','303800')
              file.write_text(t)

          version = root/'src/version.ts'
          v = version.read_text().replace('3.3.6','3.3.8').replace('303600','303800').replace('Runtime 3.3.8 R10','Runtime 3.3.8 R12')
          version.write_text(v)

          gradle = root/'android/app/build.gradle'
          g = gradle.read_text()
          g = re.sub(r'versionCode\\s+\\d+', 'versionCode 303800', g)
          g = re.sub(r'versionName\\s+"[^"]+"', 'versionName "3.3.8"', g)
          g = g.replace('3.3.6','3.3.8').replace('303600','303800')
          gradle.write_text(g)
          PY

      - name: Verify renderer recovery source
        shell: bash
        run: |
          set -euo pipefail
          MAIN='work/fl/android/app/src/main/java/com/braseiro/forbiddenlands/MainActivity.java'
          grep -F 'onRenderProcessGone(WebView webView, RenderProcessGoneDetail detail)' "$MAIN" >/dev/null
          grep -F 'return true;' "$MAIN" >/dev/null
          grep -F 'webView.destroy();' "$MAIN" >/dev/null
          grep -F 'recreate();' "$MAIN" >/dev/null
          grep -F 'recentCrashCount >= 2' "$MAIN" >/dev/null
          grep -F 'View.LAYER_TYPE_SOFTWARE' "$MAIN" >/dev/null
          grep -F 'rendererPriorityAtExit' "$MAIN" >/dev/null
          grep -F 'android:hardwareAccelerated="true"' work/fl/android/app/src/main/AndroidManifest.xml >/dev/null
          grep -q 'versionCode 303800' work/fl/android/app/build.gradle
          grep -q 'versionName "3.3.8"' work/fl/android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify update signer
        shell: bash
        run: |
          set -euo pipefail
          PROP='work/fl/android/keystore.properties'
          KS='work/fl/android/app/braseiro-debug.jks'
          STORE_PASS=$(grep -E '^BRASEIRO_STORE_PASSWORD=' "$PROP" | head -n1 | cut -d= -f2-)
          ALIAS=$(grep -E '^BRASEIRO_KEY_ALIAS=' "$PROP" | head -n1 | cut -d= -f2-)
          if [ -z "$ALIAS" ]; then ALIAS=braseiro; fi
          SHA1=$(keytool -list -v -keystore "$KS" -storepass "$STORE_PASS" -alias "$ALIAS" 2>/dev/null | awk -F': ' '/SHA1:/{gsub(":","",$2); print tolower($2); exit}')
          test "$SHA1" = "$EXPECTED_SHA1"

      - name: Install dependencies
        working-directory: work/fl
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund jsdom@26

      - name: Re-run R10 freeze gates
        working-directory: work/fl
        shell: bash
        run: |
          set -euo pipefail
          cp ../../ci/forbidden-lands-r10/verify-r10-touch-and-safety.mjs scripts/verify-r10-touch-and-safety.mjs
          cp ../../ci/forbidden-lands-r10/verify-r10-choice-flow.mjs scripts/verify-r10-choice-flow.mjs
          node -r ./work/tsx-userinfo-shim.cjs --import tsx scripts/verify-r10-touch-and-safety.mjs
          node -r ./work/tsx-userinfo-shim.cjs --import tsx scripts/verify-r10-choice-flow.mjs
          npm run verify:master-no-freeze-r5
          npm run verify:bugreport-freeze-2026-10-05
          npm run lint
          npm run build:web

      - name: Android sync and compile
        working-directory: work/fl
        shell: bash
        run: |
          set -euo pipefail
          npm run android:sync
          npm run verify:android
          npm run lint
          node scripts/run-gradle-task.mjs assembleDebug

      - name: Validate update APK
        working-directory: work/fl
        shell: bash
        run: |
          set -euo pipefail
          BUILT='android/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$BUILT"
          mkdir -p out
          cp "$BUILT" "out/$APK_NAME"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$BT/aapt" dump badging "out/$APK_NAME" > out/APK_BADGING.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" out/APK_BADGING.txt
          grep -q "versionCode='303800'" out/APK_BADGING.txt
          grep -q "versionName='3.3.8'" out/APK_BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs "out/$APK_NAME" > out/APK_SIGNATURE.txt 2>&1
          ACTUAL=$(grep -E 'certificate SHA-1 digest:' out/APK_SIGNATURE.txt | head -n1 | sed -E 's/.*digest:[[:space:]]*//' | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          test "$ACTUAL" = "$EXPECTED_SHA1"
          sha256sum "out/$APK_NAME" > "out/$APK_NAME.sha256"
          printf '%s\n' \
            'STATUS=PASS' \
            'BUGREPORT_CAUSE=WEBVIEW_RENDERER_SIGSEGV' \
            'ON_RENDER_PROCESS_GONE_HANDLED=PASS' \
            'HOST_PROCESS_KILL_PREVENTION=PASS' \
            'RENDERER_RECOVERY_RECREATE=PASS' \
            'REPEATED_CRASH_SAFE_MODE=PASS' \
            'R10_TOUCH_GATE=PASS' \
            'R10_CHOICE_FLOW_GATE=PASS' \
            'UPDATE_IN_PLACE=PASS' > out/R12_WEBVIEW_RECOVERY_PROOF.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_FORBIDDEN_LANDS_3.3.8_R12_WEBVIEW_RECOVERY
          path: work/fl/out/*
          retention-days: 30
