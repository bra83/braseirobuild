name: Repair R54 idempotent image binding
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-r54-idempotent-binding.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore R54 hotfix and make item binding idempotent
        run: |
          git show a6abd074ea0547730c1c068555af3bdd0569996a:star-wars/r54/hotfix_r54.py > star-wars/r54/hotfix_r54.py
          python - <<'PY'
          from pathlib import Path
          p=Path('star-wars/r54/hotfix_r54.py')
          s=p.read_text('utf-8')
          old="""  const exact=idx.get(r54Norm(name));if(!exact)continue;\n  host.querySelectorAll('.r53-item-visual,.r54-item-visual').forEach(x=>x.remove());const fig=document.createElement('figure');fig.className='r54-item-visual';fig.innerHTML=`<img loading=\"lazy\" alt=\"${name.replace(/[\"<&]/g,'')}\" src=\"${exact}\">`;host.insertBefore(fig,host.firstChild);"""
          new="""  const exact=idx.get(r54Norm(name));if(!exact)continue;\n  const current=host.querySelector('.r54-item-visual img');if(current&&current.getAttribute('src')===exact)continue;\n  host.querySelectorAll('.r53-item-visual,.r54-item-visual').forEach(x=>x.remove());const fig=document.createElement('figure');fig.className='r54-item-visual';fig.innerHTML=`<img loading=\"lazy\" alt=\"${name.replace(/[\"<&]/g,'')}\" src=\"${exact}\">`;host.insertBefore(fig,host.firstChild);"""
          if s.count(old)!=1: raise SystemExit(f'expected binding block once, got {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert "current&&current.getAttribute('src')===exact" in s
          PY
      - name: Static regression gate
        run: |
          python -m py_compile star-wars/r54/hotfix_r54.py
          grep -F "current&&current.getAttribute('src')===exact" star-wars/r54/hotfix_r54.py
          test "$(grep -c "host.querySelectorAll('.r53-item-visual,.r54-item-visual').forEach" star-wars/r54/hotfix_r54.py)" -eq 1
      - name: Persist correction
        run: |
          git config user.name 'braseiro-r54-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add star-wars/r54/hotfix_r54.py
          git commit -m 'fix(star-wars-r54): make image binding idempotent'
          git push
