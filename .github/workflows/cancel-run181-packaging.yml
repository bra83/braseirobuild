name: Cancel RUN181 Source Packaging
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-run181-packaging.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel already-built RUN181 packaging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/bra83/braseirobuild/actions/runs/37425814586/cancel
