name: Extract Star Wars R54 P0 Source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/extract-star-wars-r54-p0-source.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract compact P0 source evidence
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip
          rm -rf /tmp/r54 && mkdir -p /tmp/r54
          unzip -q "$ZIP" -d /tmp/r54
          ROOT="$(dirname "$(find /tmp/r54 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)")"
          V="$ROOT/app/src/main/assets/vtt"
          OUT=star-wars/r54/audit/p0-src; rm -rf "$OUT"; mkdir -p "$OUT"
          MAIN="$(find "$ROOT/app/src/main" -type f \( -name MainActivity.java -o -name MainActivity.kt \) | head -n1)"; cp "$MAIN" "$OUT/MainActivity.txt"
          cp "$ROOT/app/src/main/AndroidManifest.xml" "$OUT/AndroidManifest.txt"
          cp "$V/r54-final-map-travel.js" "$OUT/r54-final-map-travel.js.txt"
          cp "$V/r46-shell.html" "$OUT/r46-shell.html.txt"
          python3 - "$V" "$OUT" <<'PY'
          import json,sys,re
          from pathlib import Path
          v=Path(sys.argv[1]); out=Path(sys.argv[2])
          m=json.loads((v/'image-library/manifest.json').read_text('utf-8'))
          assets=m.get('assets',[])
          def rows(match):
              r=[]
              for a in assets:
                  text=' '.join(str(a.get(k,'')) for k in ('assetId','category','path','src','file','label','name','entityId','entityKey'))
                  if match(text.lower()): r.append({k:a.get(k) for k in ('assetId','category','path','src','file','label','name','entityId','entityKey') if a.get(k) is not None})
              return r
          (out/'manifest-weapons.json').write_text(json.dumps(rows(lambda s:'weapon' in s or any(x in s for x in ['blaster','rifle','pistol','carbine','vibro','saber'])),indent=2,ensure_ascii=False),'utf-8')
          (out/'manifest-portraits.json').write_text(json.dumps(rows(lambda s:'portrait' in s or 'gand' in s or 'character' in s),indent=2,ensure_ascii=False),'utf-8')
          (out/'manifest-maps.json').write_text(json.dumps(rows(lambda s:'map' in s or 'galax' in s),indent=2,ensure_ascii=False),'utf-8')
          # compact candidate files and sizes
          lines=[]
          for p in v.rglob('*'):
              if p.is_file() and re.search(r'(map|galax|sector|planet)',p.name,re.I): lines.append(f'{p.relative_to(v)}\t{p.stat().st_size}')
          (out/'map-files.txt').write_text('\n'.join(sorted(lines)),'utf-8')
          # focused code references, truncate each source line to keep report readable
          pats=re.compile(r'(portrait|avatar|characterImage|weapon|imageAsset|screen.?06|screen.?08|screen.?09)',re.I)
          refs=[]
          for p in v.rglob('*'):
              if p.suffix.lower() not in ('.js','.mjs','.html','.json'): continue
              try: txt=p.read_text('utf-8',errors='ignore')
              except: continue
              for i,line in enumerate(txt.splitlines(),1):
                  if pats.search(line): refs.append(f'{p.relative_to(v)}:{i}: {line[:500]}')
                  if len(refs)>2500: break
              if len(refs)>2500: break
          (out/'visual-code-refs.txt').write_text('\n'.join(refs),'utf-8')
          PY
          # include Gradle deps for Android WebView/PDF fixes
          find "$ROOT" -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradle.properties' \) -print -exec sh -c 'echo === $1; cat "$1"' _ {} \; > "$OUT/gradle.txt"
          git config user.name github-actions; git config user.email github-actions@github.com
          git add "$OUT"; git commit -m 'audit(star-wars): extract R54 P0 source slices' || true; git push origin HEAD:main
