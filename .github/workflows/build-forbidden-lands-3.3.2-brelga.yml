name: Forbidden Lands 3.3.2 APK - BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-forbidden-lands-3.3.2-brelga.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forbidden-lands-3.3.2-brelga
  cancel-in-progress: true

env:
  SOURCE_NAME: "braseiro-forbidden-lands-3.3.2-RUNTIME-FIXED.zip"
  SOURCE_BYTES: "26648086"
  SOURCE_SHA256: "b7ebe9759923145cf418e0c17e727d3c5f8e73cc1989853aefc8dc086b3f16e1"
  FIRESTORAGE_API: "https://api.firestorage.ai/dev/file/shares/l99qrPbQPad-"
  TAG: "forbidden-lands-3.3.2-brelga"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.2_DEBUG.apk"
  BUILD_ROOT: "D:\\brelga-forbidden-lands-3.3.2"

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Configure BRELGA toolchain on D drive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          if (-not (Test-Path 'D:\')) { throw 'D drive is not available on BRELGA' }

          Remove-Item $env:BUILD_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:BUILD_ROOT -Force | Out-Null
          $temp = Join-Path $env:BUILD_ROOT 'temp'
          $npmCache = Join-Path $env:BUILD_ROOT 'npm-cache'
          $gradleHome = Join-Path $env:BUILD_ROOT 'gradle-home'
          New-Item -ItemType Directory -Path $temp,$npmCache,$gradleHome -Force | Out-Null

          $nodeRoot = 'C:\actions-runner\_work\_tool\node'
          $nodeDir = Get-ChildItem $nodeRoot -Directory -ErrorAction Stop |
            ForEach-Object { Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue } |
            Where-Object { Test-Path (Join-Path $_.FullName 'node.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $nodeDir) { throw 'Node tool-cache not found on BRELGA' }

          $javaRoot = 'C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk'
          $javaDir = Get-ChildItem $javaRoot -Directory -Recurse -ErrorAction Stop |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\java.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $javaDir) { throw 'Java 21 tool-cache not found on BRELGA' }

          $candidates = @('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $sdk = $candidates | Where-Object { $_ -and (Test-Path $_) -and (Test-Path (Join-Path $_ 'platform-tools')) } | Select-Object -First 1
          if (-not $sdk) { throw 'Android SDK not found on BRELGA' }

          $newPath = "$($nodeDir.FullName);$($javaDir.FullName)\bin;$env:PATH"
          "PATH=$newPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JAVA_HOME=$($javaDir.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GRADLE_USER_HOME=$gradleHome" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NPM_CONFIG_CACHE=$npmCache" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $env:PATH = $newPath
          $env:JAVA_HOME = $javaDir.FullName
          node --version
          npm --version
          java -version
          Write-Host "C_FREE_GB=$([math]::Round((Get-PSDrive C).Free/1GB,2))"
          Write-Host "D_FREE_GB=$([math]::Round((Get-PSDrive D).Free/1GB,2))"

      - name: Download and verify exact source on D
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $incoming = Join-Path $env:BUILD_ROOT 'incoming'
          New-Item -ItemType Directory -Path $incoming -Force | Out-Null
          $meta = Invoke-RestMethod -Method Get -Uri ($env:FIRESTORAGE_API + '/files?maxResults=100')
          if (-not $meta.files -or $meta.files.Count -ne 1) { throw "Expected 1 source file, got $($meta.files.Count)" }
          $file = $meta.files[0]
          if ($file.fileName -ne $env:SOURCE_NAME) { throw "Unexpected source file: $($file.fileName)" }
          $ticket = Invoke-RestMethod -Method Post -Uri ($env:FIRESTORAGE_API + '/files/' + $file.fileId + '/download')
          if (-not $ticket.downloadUrl) { throw 'No Firestorage download URL' }
          $zip = Join-Path $incoming $env:SOURCE_NAME
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $zip $ticket.downloadUrl
          if ($LASTEXITCODE -ne 0) { throw "Source download failed: $LASTEXITCODE" }
          $bytes = (Get-Item $zip).Length
          if ($bytes -ne [int64]$env:SOURCE_BYTES) { throw "Source size mismatch: $bytes" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SOURCE_SHA256) { throw "Source SHA mismatch: $hash" }
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract source and patch stale verification gates
        id: project
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_ZIP: ${{ steps.source.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $env:BUILD_ROOT 'project'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & tar.exe -xf $env:SOURCE_ZIP -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          Remove-Item $env:SOURCE_ZIP -Force -ErrorAction SilentlyContinue

          $pkg = Get-ChildItem $extract -Recurse -File -Filter package.json |
            Where-Object { (Test-Path (Join-Path $_.Directory.FullName 'android')) -and (Test-Path (Join-Path $_.Directory.FullName 'BUILD_APK_WINDOWS.ps1')) } |
            Sort-Object { $_.FullName.Length } | Select-Object -First 1
          if (-not $pkg) { throw 'Project root not found' }
          $root = $pkg.Directory.FullName

          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='BRELGA-FL332-Patch' }
          $patchMeta = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/ci/forbidden-lands-3.3.2/patch-guide-gates.mjs?ref=main"
          $patchText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($patchMeta.content -replace '\s','')))
          $patchPath = Join-Path $env:BUILD_ROOT 'patch-guide-gates.mjs'
          [IO.File]::WriteAllText($patchPath,$patchText,(New-Object Text.UTF8Encoding($false)))
          & node.exe $patchPath $root
          if ($LASTEXITCODE -ne 0) { throw 'Guide/Desbravar stale gate patch failed' }

          $json = Get-Content $pkg.FullName -Raw | ConvertFrom-Json
          if ($json.version -ne '3.3.2') { throw "package version mismatch: $($json.version)" }
          $gradle = Get-Content (Join-Path $root 'android\app\build.gradle') -Raw
          if ($gradle -notmatch 'applicationId\s+"com\.braseiro\.forbiddenlands"') { throw 'Wrong applicationId' }
          if ($gradle -notmatch 'versionCode\s+303200') { throw 'Wrong versionCode' }
          if ($gradle -notmatch 'versionName\s+"3\.3\.2"') { throw 'Wrong versionName' }

          "root=$root" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "PROJECT_ROOT=$root"
          Write-Host "D_FREE_BEFORE_NPM_GB=$([math]::Round((Get-PSDrive D).Free/1GB,2))"

      - name: Install dependencies
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:npm_config_registry = 'https://registry.npmjs.org/'
          $env:npm_config_audit = 'false'
          $env:npm_config_fund = 'false'
          & npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

          # npm/lockfiles generated on another platform can omit Rollup's Windows
          # optional native binary. Install the exact matching binary explicitly.
          & node.exe -e "require.resolve('@rollup/rollup-win32-x64-msvc')"
          if ($LASTEXITCODE -ne 0) {
            $rollupVersion = (& node.exe -p "require('./node_modules/rollup/package.json').version").Trim()
            Write-Host "Installing missing Rollup native binary $rollupVersion for Windows x64..."
            & npm.cmd install --no-save --no-package-lock "@rollup/rollup-win32-x64-msvc@$rollupVersion"
            if ($LASTEXITCODE -ne 0) { throw 'Rollup Windows native dependency install failed' }
          }

          # Do the same preflight for esbuild's Windows binary before Vite/server build.
          & node.exe -e "require.resolve('@esbuild/win32-x64')"
          if ($LASTEXITCODE -ne 0) {
            $esbuildVersion = (& node.exe -p "require('./node_modules/esbuild/package.json').version").Trim()
            Write-Host "Installing missing esbuild native binary $esbuildVersion for Windows x64..."
            & npm.cmd install --no-save --no-package-lock "@esbuild/win32-x64@$esbuildVersion"
            if ($LASTEXITCODE -ne 0) { throw 'esbuild Windows native dependency install failed' }
          }

          & npm.cmd cache clean --force
          Write-Host "D_FREE_AFTER_NPM_GB=$([math]::Round((Get-PSDrive D).Free/1GB,2))"

      - name: Full verify master
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          & npm.cmd run verify
          if ($LASTEXITCODE -ne 0) { throw 'npm run verify failed' }

      - name: Sync Android and release gates
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          & npm.cmd run android:sync
          if ($LASTEXITCODE -ne 0) { throw 'android:sync failed' }
          & npm.cmd run verify:android
          if ($LASTEXITCODE -ne 0) { throw 'verify:android failed' }
          & npm.cmd run verify:release-readiness
          if ($LASTEXITCODE -ne 0) { throw 'release readiness failed' }
          Write-Host "D_FREE_BEFORE_GRADLE_GB=$([math]::Round((Get-PSDrive D).Free/1GB,2))"

      - name: Build debug APK with Gradle
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          & node.exe scripts/run-gradle-task.mjs assembleDebug
          if ($LASTEXITCODE -ne 0) { throw 'Gradle assembleDebug failed' }

      - name: Validate APK
        id: apk
        shell: powershell
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $built = Join-Path $env:ROOT 'android\app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path $built)) { throw "APK missing: $built" }
          $out = Join-Path $env:BUILD_ROOT 'out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apk = Join-Path $out $env:APK_NAME
          Copy-Item $built $apk -Force
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content (Join-Path $out "$($env:APK_NAME).sha256") -Encoding ascii

          $bt = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $bt) { throw 'Android build-tools unavailable' }
          $aapt = Join-Path $bt.FullName 'aapt.exe'
          $signer = Join-Path $bt.FullName 'apksigner.bat'
          & $aapt dump badging $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_BADGING.txt')
          if ($LASTEXITCODE -ne 0) { throw 'aapt badging failed' }
          $badging = Get-Content (Join-Path $out 'APK_BADGING.txt') -Raw
          if ($badging -notmatch "package: name='com\.braseiro\.forbiddenlands'") { throw 'Wrong APK package' }
          if ($badging -notmatch "versionCode='303200'") { throw 'Wrong APK versionCode' }
          if ($badging -notmatch "versionName='3\.3\.2'") { throw 'Wrong APK versionName' }

          if (Test-Path $signer) {
            & $signer verify --verbose --print-certs $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_SIGNATURE.txt')
            if ($LASTEXITCODE -ne 0) { throw 'APK signature invalid' }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($apk)
          try {
            foreach ($required in @('AndroidManifest.xml','classes.dex','assets/public/index.html','assets/public/braseiro-release-marker.json')) {
              if (-not $z.GetEntry($required)) { throw "APK entry missing: $required" }
            }
            $entry = $z.GetEntry('assets/public/braseiro-release-marker.json')
            $reader = New-Object IO.StreamReader($entry.Open())
            $marker = ($reader.ReadToEnd() | ConvertFrom-Json); $reader.Dispose()
            if ($marker.version -ne '3.3.2') { throw "Web marker mismatch: $($marker.version)" }
          } finally { $z.Dispose() }

          @(
            'STATUS=PASS',
            "RUNNER_NAME=$env:RUNNER_NAME",
            "GITHUB_RUN_ID=$env:GITHUB_RUN_ID",
            "SOURCE_SHA256=$env:SOURCE_SHA256",
            "APK_NAME=$env:APK_NAME",
            "APK_BYTES=$((Get-Item $apk).Length)",
            "APK_SHA256=$hash",
            'PACKAGE=com.braseiro.forbiddenlands',
            'VERSION_CODE=303200',
            'VERSION_NAME=3.3.2',
            'WEB_MARKER=3.3.2',
            'FULL_VERIFY_MASTER=PASS',
            'MANDATORY_GUIDE_GATE=PASS'
          ) | Set-Content (Join-Path $out 'FORBIDDEN_LANDS_3.3.2_BRELGA_BUILD_PROOF.txt') -Encoding utf8
          "dir=$out" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$hash" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish validated APK release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='BRELGA-FL332-Release' }

          $release = $null
          try { $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG" }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          if (-not $release) {
            $payload = @{ tag_name=$env:TAG; target_commitish='main'; name='Braseiro Forbidden Lands 3.3.2 - BRELGA'; body='APK debug 3.3.2 compilado no BRELGA com verify master completo, Guide/Desbravar gate, runtime integration, source-lock, package/version e assinatura validados.'; draft=$false; prerelease=$false } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $payload -Uri "https://api.github.com/repos/$repo/releases"
          }

          $assets = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach ($name in @('BRASEIRO_FORBIDDEN_LANDS_3.3.2_DEBUG.apk','BRASEIRO_FORBIDDEN_LANDS_3.3.2_DEBUG.apk.sha256','APK_BADGING.txt','APK_SIGNATURE.txt','FORBIDDEN_LANDS_3.3.2_BRELGA_BUILD_PROOF.txt')) {
            $path = Join-Path $env:APK_DIR $name
            if (-not (Test-Path $path)) { continue }
            $old = $assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($old) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($old.id)" | Out-Null }
            $mime = if ($name -like '*.apk') { 'application/vnd.android.package-archive' } else { 'text/plain' }
            $url = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
            & curl.exe -L --fail -X POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: $mime" --data-binary "@$path" $url
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed: $name" }
          }
          Write-Host "RELEASE_URL=$($release.html_url)"
