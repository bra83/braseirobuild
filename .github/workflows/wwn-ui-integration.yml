name: BRASEIRO WWN UI Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wwn-ui-integration.yml"

permissions:
  contents: write

jobs:
  player-surfaces-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge

      - name: Apply Jornada integration
        run: python3 tools/wwn_patch_jornada_mechanics.py
      - name: Apply Ficha canonical integration
        run: python3 tools/wwn_patch_ficha_canonical.py
      - name: Apply Mochila catalog integration
        run: python3 tools/wwn_patch_mochila_catalog.py
      - name: Apply full manual creation links and Focus restrictions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/wwn_patch_ficha_manual_link.py
          python3 tools/wwn_patch_focus_class_restrictions.py
      - name: Apply cumulative special-combat integrations
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'goProne({campaignId' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_prone_combat.py; fi
          if ! grep -q 'dualWieldAttackNpc({' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_dual_wield.py; fi
          if ! grep -q 'resolveAttackHitOnly' app/src/main/assets/www/core/wwn-combat-core.js; then python3 tools/wwn_patch_shove_core.py; fi
          if ! grep -q 'shoveNpc({' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_shove_stateful.py; fi
          if ! grep -q "effect='PRONE',pushFeet=null" app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_shove_push.py; fi
          if ! grep -q 'resolveAutomaticWeaponHitDamage' app/src/main/assets/www/core/wwn-combat-core.js; then python3 tools/wwn_patch_grapple_core.py; fi
          if ! grep -q 'grappleNpc({' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_grapple_stateful.py; fi
          if grep -q 'function applyGrappleEndRoundDamageInPlace' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_fix_grapple_round_hook.py; fi
          python3 tools/wwn_patch_grapple_move_core.py
          if ! grep -q 'manipulateGrappledNpc({' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_grapple_manipulation.py; fi
          if ! grep -q 'chargeNpc({' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_charge_combat.py; fi
          if grep -q 'chargeNpc({' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_fix_charge_edge_cases.py; fi
          if ! grep -q 'swarmAssistNpc({' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_swarm_attack.py; fi
          if ! grep -q 'screenAlly({' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_screen_ally.py; fi
          if ! grep -q 'holdAction({' app/src/main/assets/www/core/combat-service.js; then python3 tools/wwn_patch_snap_hold.py; fi
          python3 tools/wwn_normalize_combat_imports.py

      - name: Commit player-surface integrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BRASEIRO WWN UI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/www/jornada.js app/src/main/assets/www/ficha.js app/src/main/assets/www/mochila.js app/src/main/assets/www/core/wwn-focus-catalog.js app/src/main/assets/www/core/wwn-combat-core.js app/src/main/assets/www/core/wwn-special-combat-core.js app/src/main/assets/www/core/wwn-npc-combat.js app/src/main/assets/www/core/combat-prone-state.js app/src/main/assets/www/core/combat-grapple-state.js app/src/main/assets/www/core/combat-hand-state.js app/src/main/assets/www/core/combat-service.js app/src/main/assets/www/core/combat-session-service.js app/src/main/assets/www/core/combat-projection.js app/src/main/assets/www/scr022.html app/src/main/assets/www/scr022.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: expose canonical snap and held actions"
            git push origin HEAD:wwn-source-105-bridge
          fi

      - name: Validate player-surface JavaScript and DOM contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/www/core/player-mechanics-facade.js
          node --check app/src/main/assets/www/core/wwn-background-catalog.js
          node --check app/src/main/assets/www/core/wwn-manual-character-builder.js
          node --check app/src/main/assets/www/core/character-creation-service.js
          node --check app/src/main/assets/www/core/character-roster-service.js
          node --check app/src/main/assets/www/core/wwn-focus-catalog.js
          node --check app/src/main/assets/www/core/wwn-combat-core.js
          node --check app/src/main/assets/www/core/wwn-special-combat-core.js
          node --check app/src/main/assets/www/core/wwn-npc-combat.js
          node --check app/src/main/assets/www/core/combat-prone-state.js
          node --check app/src/main/assets/www/core/combat-grapple-state.js
          node --check app/src/main/assets/www/core/combat-hand-state.js
          node --check app/src/main/assets/www/core/combat-service.js
          node --check app/src/main/assets/www/core/combat-session-service.js
          node --check app/src/main/assets/www/core/combat-projection.js
          node --check app/src/main/assets/www/jornada.js
          node --check app/src/main/assets/www/ficha.js
          node --check app/src/main/assets/www/mochila.js
          node --check app/src/main/assets/www/criacao.js
          node --check app/src/main/assets/www/scr022.js
          python3 - <<'PY'
          from pathlib import Path
          jornada=Path('app/src/main/assets/www/jornada.html').read_text()
          req=['mechanicsPanel','mechanicsAttribute','mechanicsSkill','mechanicsDifficulty','mechanicsTestButton','mechanicsSavePane','mechanicsEnemy','mechanicsWeapon','mechanicsStartCombatButton','mechanicsAttackButton','mechanicsReloadButton','mechanicsResult']
          missing=[x for x in req if f'id="{x}"' not in jornada]
          if missing: raise SystemExit(f'Missing Jornada mechanics ids: {missing}')
          for page in ['jornada.html','ficha.html','mochila.html','criacao.html','scr022.html']:
            h=Path('app/src/main/assets/www/'+page).read_text()
            if 'width=415' not in h: raise SystemExit(f'{page} lost 415px viewport contract')
          mochila=Path('app/src/main/assets/www/mochila.html').read_text()
          for x in ['inventoryList','marketButton','catalogList','marketSilver']:
            if f'id="{x}"' not in mochila: raise SystemExit(f'Mochila missing {x}')
          creation=Path('app/src/main/assets/www/criacao.html').read_text()
          for x in ['attributeMode','background','learning1','learning2','classPath','classTraining','focusSlots','freeSkill','gearMode','create']:
            if f'id="{x}"' not in creation: raise SystemExit(f'Criação manual missing {x}')
          ficha=Path('app/src/main/assets/www/ficha.js').read_text()
          if 'data-manual' not in ficha or "location.href='criacao.html'" not in ficha: raise SystemExit('Ficha manual creation entry point missing')
          combat=Path('app/src/main/assets/www/scr022.html').read_text()
          for x in ['maneuverButton','proneButton','dualButton','swarmAssistButton','swarmAttackButton','chargeButton','screenButton','holdButton','snapAttackButton','heldAttackButton','shoveExertButton','shovePunchButton','shovePushExertButton','shovePushPunchButton','grappleButton','grappleMoveButton','grappleThrowButton','maneuverPopup']:
            if f'id="{x}"' not in combat: raise SystemExit(f'Combat special action missing: {x}')
          print('WWN player surfaces DOM contracts: OK')
          PY

      - name: Run UI and mechanical regression smokes
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f package.json' EXIT
          printf '{"type":"module"}\n' > package.json
          node tools/wwn_manual_creation_smoke.mjs
          node tools/wwn_prone_stateful_smoke.mjs
          node tools/wwn_dual_wield_stateful_smoke.mjs
          node tools/wwn_shove_stateful_smoke.mjs
          node tools/wwn_shove_push_stateful_smoke.mjs
          node tools/wwn_grapple_stateful_smoke.mjs
          node tools/wwn_grapple_manipulation_smoke.mjs
          node tools/wwn_charge_stateful_smoke.mjs
          node tools/wwn_swarm_stateful_smoke.mjs
          node tools/wwn_screen_ally_stateful_smoke.mjs
          node tools/wwn_snap_hold_stateful_smoke.mjs
          node tools/wwn_ui_mechanics_smoke.mjs
          node tools/wwn_parity_smoke.mjs
          node tools/wwn_stateful_smoke.mjs
          node tools/wwn_mod_runtime_stateful_smoke.mjs

      - name: Compile Kotlin only
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

# Full manual creation + Prone/Stand Up + Dual-Wield + Shove prone/push + Grapple full flow + Charge + Swarm Attack + Screen Ally + Snap Attack + Hold Action + Jornada + Ficha + Mochila. Closure 071 remains untouched.
