name: DND V1 P0 - Subclass Selection and Full Regression (BRELGA)
on:
  push:
    branches:
      - fix/dnd-v1-p0-evidence-subclass-20261016
    paths:
      - '.github/workflows/dnd-v1-p0-subclass-qa-brelga.yml'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/AppDb.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/Core2024SubclassRuntimeEngine.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/Core2024SubclassRobolectricTest.java'
      - 'dnd-normal/run247-mod005/docs/dnd-v1-3core/GAP_LEDGER.csv'
      - 'dnd-normal/run247-mod005/tools/build_dnd_v1_3core_gap_ledger.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-v1-p0-subclass-brelga
  cancel-in-progress: false
jobs:
  subclass-regression:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 100
    steps:
      - name: Require exact BRELGA runner and refuse APK builds
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'WRONG_RUNNER'}
          Write-Host ('DND_P0_SHA='+$env:GITHUB_SHA)
          Write-Host 'APK_BUILD=FORBIDDEN'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Configure Java 17 and Android SDK
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $java='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if(Test-Path $java) {
            Add-Content $env:GITHUB_ENV ('JAVA_HOME='+$java)
            Add-Content $env:GITHUB_PATH (Join-Path $java 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if(!$sdk -or !(Test-Path $sdk)){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if(!(Test-Path $sdk)){throw 'ANDROID_SDK_MISSING'}
          Add-Content $env:GITHUB_ENV ('ANDROID_HOME='+$sdk)
          Add-Content $env:GITHUB_ENV ('ANDROID_SDK_ROOT='+$sdk)
          $shared=Join-Path $env:USERPROFILE '.gradle'
          $isolated=Join-Path $env:RUNNER_TEMP ('dnd-p0-subclass-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          foreach($item in @('wrapper','caches')){
            $from=Join-Path $shared $item
            $to=Join-Path $isolated $item
            if((Test-Path $from)-and !(Test-Path $to)){
              New-Item -ItemType Junction -Path $to -Target $from | Out-Null
            }
          }
          Add-Content $env:GITHUB_ENV ('GRADLE_USER_HOME='+$isolated)
      - name: Verify that the recorded ledger matches the generator
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $py=Get-Command python -ErrorAction SilentlyContinue
          if(!$py){throw 'PYTHON_REQUIRED_FOR_LEDGER_CHECK'}
          & python tools/build_dnd_v1_3core_gap_ledger.py --check
          if($LASTEXITCODE -ne 0){throw 'DND_P0_LEDGER_DIVERGENCE'}
      - name: Test PHB 2024 subclass selection and SQL reopen
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --tests com.braseiro.dnd5e.Core2024SubclassRobolectricTest --no-daemon --console=plain --stacktrace
          if($LASTEXITCODE -ne 0){throw 'DND_P0_SUBCLASS_GRADLE_FAILED'}
          $xml=Join-Path $dir 'TEST-com.braseiro.dnd5e.Core2024SubclassRobolectricTest.xml'
          if(!(Test-Path $xml)){throw 'DND_P0_SUBCLASS_MISSING_XML'}
          [xml]$doc=Get-Content -LiteralPath $xml -Raw
          $n=[int]$doc.testsuite.tests;$f=[int]$doc.testsuite.failures
          $e=[int]$doc.testsuite.errors;$s=[int]$doc.testsuite.skipped
          Write-Host ('DND_P0_SUBCLASS_TESTS='+$n+' FAIL='+$f+' ERR='+$e+' SKIP='+$s)
          if($n -lt 7 -or $f -ne 0 -or $e -ne 0 -or $s -ne 0){throw 'DND_P0_SUBCLASS_ASSERTIONS_FAILED'}
      - name: Full Android Robolectric regression same SHA
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
          $code=$LASTEXITCODE
          $docs=@()
          if(Test-Path $dir){$docs=@(Get-ChildItem -LiteralPath $dir -Filter 'TEST-*.xml' -File)}
          $tests=0;$fail=0;$err=0;$skip=0
          foreach($file in $docs){
            [xml]$d=Get-Content -LiteralPath $file.FullName -Raw
            $tests += [int]$d.testsuite.tests
            $fail += [int]$d.testsuite.failures
            $err += [int]$d.testsuite.errors
            $skip += [int]$d.testsuite.skipped
          }
          Write-Host ('DND_P0_FULL_TESTS='+$tests+' FAIL='+$fail+' ERR='+$err+' SKIP='+$skip)
          if($code -ne 0 -or $tests -lt 2690 -or $fail -ne 0 -or $err -ne 0 -or $skip -ne 0){throw 'DND_P0_FULL_REGRESSION_FAILED'}
          Write-Host 'DND_P0_SUBCLASS_AND_FULL_SUITE=PASS'
          Write-Host 'THREE_BOOKS_MECHANICAL_PARITY=NOT_CERTIFIED'
