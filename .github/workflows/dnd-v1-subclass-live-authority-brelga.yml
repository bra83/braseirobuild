name: DND V1 - Subclass live authority and regression (BRELGA)
on:
  push:
    branches:
      - fix/dnd-v1-subclass-live-authority-20261016
    paths:
      - '.github/workflows/dnd-v1-subclass-live-authority-brelga.yml'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/AppDb.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/Core2024SubclassRuntimeEngine.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/Core2024SubclassRobolectricTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-v1-live-subclass-${{ github.sha }}
  cancel-in-progress: false
jobs:
  live-subclass-and-full-android:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 110
    steps:
      - name: Check BRELGA / no APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'WRONG_RUNNER'}
          Write-Host ('SUBCLASS_SOURCE_SHA='+$env:GITHUB_SHA)
          Write-Host 'APK_BUILD=FORBIDDEN'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Configure Java 17 and Android SDK
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $java='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if(Test-Path $java) {
            Add-Content $env:GITHUB_ENV ('JAVA_HOME='+$java)
            Add-Content $env:GITHUB_PATH (Join-Path $java 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if(!$sdk -or !(Test-Path $sdk)){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if(!(Test-Path $sdk)){throw 'ANDROID_SDK_MISSING'}
          Add-Content $env:GITHUB_ENV ('ANDROID_HOME='+$sdk)
          Add-Content $env:GITHUB_ENV ('ANDROID_SDK_ROOT='+$sdk)
          $shared=Join-Path $env:USERPROFILE '.gradle'
          $isolated=Join-Path $env:RUNNER_TEMP ('dnd-subclass-authority-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          foreach($item in @('wrapper','caches')){
            $from=Join-Path $shared $item
            $to=Join-Path $isolated $item
            if((Test-Path $from)-and !(Test-Path $to)){
              New-Item -ItemType Junction -Path $to -Target $from | Out-Null
            }
          }
          Add-Content $env:GITHUB_ENV ('GRADLE_USER_HOME='+$isolated)
      - name: Validate subclass ownership in Android Robolectric
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --tests com.braseiro.dnd5e.Core2024SubclassRobolectricTest --no-daemon --console=plain
          $exit=$LASTEXITCODE
          $xml=Join-Path $dir 'TEST-com.braseiro.dnd5e.Core2024SubclassRobolectricTest.xml'
          if(!(Test-Path $xml)){throw 'MISSING_SUBCLASS_TEST_XML'}
          [xml]$d=Get-Content -LiteralPath $xml -Raw
          $total=[int]$d.testsuite.tests;$fail=[int]$d.testsuite.failures
          $err=[int]$d.testsuite.errors;$skip=[int]$d.testsuite.skipped
          foreach($node in @($d.SelectNodes('//testcase/failure | //testcase/error'))){
            Write-Host ('FAIL_CASE='+$node.ParentNode.GetAttribute('name'))
            Write-Host ('FAIL_REASON='+$node.GetAttribute('message'))
          }
          Write-Host ('SUBCLASS_TARGETED_TESTS='+$total+' FAIL='+$fail+' ERR='+$err+' SKIP='+$skip)
          if($exit -ne 0 -or $total -lt 10 -or $fail -ne 0 -or $err -ne 0 -or $skip -ne 0){throw 'SUBCLASS_GATE_FAILED'}
      - name: Full regression on the same SHA
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain
          $exit=$LASTEXITCODE
          $docs=@()
          if(Test-Path $dir){$docs=@(Get-ChildItem -LiteralPath $dir -Filter 'TEST-*.xml' -File)}
          $total=0;$fail=0;$err=0;$skip=0
          foreach($file in $docs){
            [xml]$d=Get-Content -LiteralPath $file.FullName -Raw
            $total += [int]$d.testsuite.tests
            $fail += [int]$d.testsuite.failures
            $err += [int]$d.testsuite.errors
            $skip += [int]$d.testsuite.skipped
            foreach($node in @($d.SelectNodes('//testcase/failure | //testcase/error'))){
              Write-Host ('FAIL_CASE='+$node.ParentNode.GetAttribute('classname')+'::'+$node.ParentNode.GetAttribute('name'))
              Write-Host ('FAIL_REASON='+$node.GetAttribute('message'))
            }
          }
          Write-Host ('SUBCLASS_FULL_TESTS='+$total+' FAIL='+$fail+' ERR='+$err+' SKIP='+$skip)
          if($exit -ne 0 -or $total -lt 2741 -or $fail -ne 0 -or $err -ne 0 -or $skip -ne 0){throw 'SUBCLASS_FULL_GATE_FAILED'}
          Write-Host 'SUBCLASS_FULL_ANDROID=PASS'
          Write-Host 'PHB_DMG_XMM_FULL_PARITY=NOT_CERTIFIED'
