name: DnD 6.6.57 post-Strixhaven on top of 6.6.56 (strict QA)
on:
  push:
    branches:
      - fix/dnd-6656-pos-strixhaven-integrado-20261114
    paths:
      - .github/workflows/dnd-6656-pos-strixhaven-integracao.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integration branch with full history and sparse DnD tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: dnd-normal/run247-mod005
          persist-credentials: true
      - name: Merge isolated post-Strixhaven changes WITHOUT losing the 6.6.56 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/fix/dnd-6654-pos-strixhaven-integration-20261114:refs/remotes/origin/post-strixhaven'
          git config user.name "braseiro-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On conflicting HUNKS, preserve 6.6.56. Non-conflicting new features
          # are applied by the normal three-way Git merge. Tests must prove parity.
          git merge --no-edit --no-ff -X ours origin/post-strixhaven \
            -m "integration(dnd): reconcile QA post-Strixhaven on 6.6.56 without overwriting existing fixes"
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('dnd-normal/run247-mod005/version.properties')
          lines=path.read_text(encoding='utf8').splitlines()
          options={}
          for line in lines:
              if '=' in line:
                  k,v=line.split('=',1)
                  options[k]=v
          assert int(options['VERSION_CODE'])==203900619, options
          assert options['DB_SCHEMA']=='61',options
          assert options['BACKUP_FORMAT']=='21',options
          lines=['VERSION_NAME=6.6.57-post-strixhaven-integration-QA' if x.startswith('VERSION_NAME=') else
                 'VERSION_CODE=203900620' if x.startswith('VERSION_CODE=') else x for x in lines]
          path.write_text('\n'.join(lines)+'\n',encoding='utf8')
          print('BASE_6_6_56_VERSION_UPGRADE_GATE=PASS; RELEASE_AUTHORIZED=FALSE')
          assert int(options['VERSION_CODE'])==203900619, 'latest 6.6.56 base was not checked out'
          PY
          test -f dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/PostStrixhavenActivitiesEngine.java
          test -f dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/PostStrixhavenEncounterEngine.java
          test -f dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/PostStrixhavenLongCampaignRobolectricTest.java
          git diff --stat origin/fix/dnd-6654-actions-professional-20261111 > integration-diff-summary.txt || true
      - name: Restore three-way merge portions required for mechanical integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e')
          appdb=root/'AppDb.java'
          db=appdb.read_text(encoding='utf8')
          if 'boolean isStrixhavenAdventureActive()' not in db:
              assert 'public AppDb(Context context)' in db,'AppDb constructor unavailable'
              needle='    public AppDb(Context context)'
              addition='    public boolean isStrixhavenAdventureActive(){\n        return StrixhavenAdventureProfile.isActive(appContext);\n    }\n\n'
              db=db.replace(needle,addition+needle,1)
              appdb.write_text(db,encoding='utf8')
          main=root/'MainActivity.java'
          code=main.read_text(encoding='utf8')
          if 'final String hostCombatIdBefore=' not in code:
              needle='JSONObject combatPlan=prepared.optJSONObject("combat");'
              assert code.count(needle)==1,'Combate não pôde ser vinculado com segurança'
              before='final String hostCombatIdBefore=db.getCombatState().optInt("running",0)==1\n' \
                  '                        ?db.getCombatState().optString("encounter_id",""):"";'
              code=code.replace(needle,needle+'\n                '+before,1)
              main.write_text(code,encoding='utf8')
          # Keep 6.6.56 NPC/scenery logic; only replace the unsafe temporal
          # calculation. AI text, AI day/time JSON and narration cannot mutate
          # the canonical clock, but an accepted local action still may.
          scene_path=root/'SceneStateEngine.java'
          scene=scene_path.read_text(encoding='utf8')
          block_start=scene.index('            SceneTemporalResolver.Result temporal=')
          block_end=scene.index('            JSONArray npcs = envelope',block_start)
          replacement="""            // Local authoritative clock: Gemini's scene JSON and prose can
            // never jump day/hour. Preserve 6.6.56 accepted-action minutes,
            // unless the WorldStateEngine already committed their duration.
            int resolvedDay=Math.max(1,current.optInt("day_number",1));
            double hour=current.optDouble("clock_hour",9d);
            if(!Double.isFinite(hour))hour=9d;
            String declared=envelope==null?"":envelope.optString("_accepted_player_action","");
            boolean alreadyAdvancedOnAccept=envelope!=null
                    &&envelope.optBoolean("_clock_advanced_on_accept",false);
            double minutes=(alreadyAdvancedOnAccept
                    ||(envelope!=null&&envelope.optBoolean("_non_advancing",false)))
                    ?0d:SceneActionClock.minutesFor(declared);
            if(minutes>0d){
                double total=hour+minutes/60d;
                resolvedDay+=(int)Math.floor(total/24d);
                hour=total%24d;
            }
            merged.put("day_number",resolvedDay);
            merged.put("clock_hour",hour);
            merged.put("time_of_day",SceneTemporalResolver.labelForHour(hour));
            merged.put("lighting",SceneTemporalResolver.resolveLighting(
                    SceneTemporalResolver.labelForHour(hour),"",merged.optString("lighting","")));
          """
          scene=scene[:block_start]+replacement+scene[block_end:]
          scene_path.write_text(scene,encoding='utf8')
          assert 'double minutes=(alreadyAdvancedOnAccept' in scene
          print('SIX_SIX_FIFTY_FOUR_SCENE_PERSISTED_TIME_AUTHORITY=PASS')
          assert 'boolean isStrixhavenAdventureActive()' in db
          assert 'final String hostCombatIdBefore=' in code
          print('MERGE_CONFLICT_CORE_WIRING_RESTORED=TRUE')
          PY
      - name: Validate merged feature source markers
        shell: bash
        run: |
          set -euo pipefail
          test -f dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/PostStrixhavenActivitiesEngine.java
          test -f dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/PostStrixhavenEncounterEngine.java
          test -f dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/PostStrixhavenLongCampaignRobolectricTest.java

      - name: Configure Java 17 and Android SDK 35
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make sure Android toolchain is installed
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Run full old+new suite with original map assets (never QA-lite)
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          files=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          counts={k:0 for k in ('tests','failures','errors','skipped')}
          for path in files:
              root=ET.parse(path).getroot()
              for key in counts: counts[key]+=int(root.get(key,'0'))
          required=['PostStrixhavenWorldLifecycleRobolectricTest','PostStrixhavenActivitiesRobolectricTest',
                    'PostStrixhavenEncounterRobolectricTest','PostStrixhavenLongCampaignRobolectricTest',
                    'CoreGameLaunchRobolectricTest','FourSceneActionsDropdownRegressionTest',
                    'SceneOptionQualityRegressionTest','StoryMomentumActionRegressionTest',
                    'GroundedSceneActionSlots6654Test','AppDbBackupRobolectricTest']
          for name in required:
              assert any(path.endswith(name+'.xml') for path in files), name
          print('6_6_56_INTEGRATED_FULL_TESTS=',counts,'SUITES=',len(files))
          assert counts['tests']>0 and not any(counts[k] for k in ('failures','errors','skipped'))
          PY
      - name: Build complete Android APK
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          python3 - <<'PY'
          import zipfile,os,hashlib
          path='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as z:
              asset='assets/maps/PACOTE_MAPA_FAERUN_2025_PTBR_MAX_V2.zip'
              assert z.getinfo(asset).file_size==102373336
          print('INTEGRATION_APK_BYTES=',os.path.getsize(path))
          print('INTEGRATION_APK_SHA256=',hashlib.sha256(open(path,'rb').read()).hexdigest())
          PY
      - name: Upload 6.6.56 integrated debug APK and test XML
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-6656-integrated-post-strixhaven-full-qa
          path: |
            dnd-normal/run247-mod005/app/build/outputs/apk/debug/app-debug.apk
            dnd-normal/run247-mod005/app/build/test-results/testDebugUnitTest/TEST-*.xml
          retention-days: 14
      - name: Publish isolated integration branch only after all gates pass
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- dnd-normal/run247-mod005
          git commit -m "qa(dnd): bump integrated 6.6.56 candidate to versionCode 203900620"
          git push origin HEAD:refs/heads/fix/dnd-6656-pos-strixhaven-integrado-20261114
          echo 'INTEGRATION_BRANCH_PUSHED=TRUE; PRODUCTION_MERGE=FALSE; DEVICE_QA=PENDING'
