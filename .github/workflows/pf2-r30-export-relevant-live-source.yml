name: PF2 R30 Export Relevant Live Source

on:
  push:
    branches: [audit-pf2-kingmaker-r30-20260928]
    paths:
      - '.github/workflows/pf2-r30-export-relevant-live-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-pf2-kingmaker-r30-20260928

      - name: Download and extract exact post-Antigravity R30
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){ throw "Expected BRELGA, got $env:RUNNER_NAME" }
          $root=Join-Path $env:RUNNER_TEMP 'pf2-r30-live-export'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $rar=Join-Path $root 'pf2e_r30_work.rar'
          & curl.exe -L --fail --retry 5 --retry-delay 3 "https://drive.usercontent.google.com/download?id=1UbJq8m518f1jIQkkXASvEp0j0Uf6qNkR&export=download&confirm=t" -o $rar
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          $size=(Get-Item $rar).Length
          if($size -ne 553809972){throw "Unexpected archive size $size"}
          $out=Join-Path $root 'extracted'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $seven='C:\Program Files\7-Zip\7z.exe'
          if(-not(Test-Path $seven)){ $seven=(Get-Command 7z.exe -ErrorAction SilentlyContinue).Source }
          if(-not $seven){throw '7z missing'}
          & $seven x -y $rar "-o$out"
          if($LASTEXITCODE -ne 0){throw 'extract failed'}
          $work=Join-Path $out 'pf2e_r30_work'
          if(-not(Test-Path $work)){throw 'work root missing'}
          "WORK_ROOT=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Collect relevant live source
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'ci\pf2-r30-live-src'
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dest -Force | Out-Null

          function Copy-Rel([string]$rel){
            $src=Join-Path $env:WORK_ROOT $rel
            if(Test-Path $src){
              $to=Join-Path $dest $rel
              New-Item -ItemType Directory -Path (Split-Path $to -Parent) -Force | Out-Null
              Copy-Item $src $to -Force
            }
          }

          $known=@(
            'version.properties',
            'android\app\src\main\java\com\braseiro\pathfinder2e\MainActivity.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\AppDb.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerRulesEngine.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerRepository.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerWarfareEngine.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\NarrationChunker.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\PortugueseNarrationSanitizer.java'
          )
          foreach($k in $known){Copy-Rel $k}

          $roots=@(
            'android\app\src\main\java\com\braseiro\pathfinder2e',
            'android\app\src\main\assets',
            'tests_pf2'
          )
          $patterns='DESCREVER PERSONAGEM|Gemini|token|portrait|retrato|scene image|imagem de cena|Kingmaker|Reino|narrat|Barbara|Bárbara|TTS|Charon|Kokoro|voice|tom|tags|\\p\{M\}|character|personagem|companion|solo'
          $matches=@()
          foreach($root in $roots){
            if(Test-Path $root){
              $matches += Get-ChildItem $root -Recurse -File -Include *.java,*.json,*.xml,*.html,*.js,*.ts,*.py,*.md |
                Select-String -Pattern $patterns -CaseSensitive:$false -ErrorAction SilentlyContinue
            }
          }
          $paths=$matches | ForEach-Object {$_.Path} | Sort-Object -Unique
          foreach($abs in $paths){
            $rel=$abs.Substring($env:WORK_ROOT.Length).TrimStart('\','/')
            Copy-Rel $rel
          }

          $inventory=Get-ChildItem $dest -Recurse -File | ForEach-Object {
            $_.FullName.Substring($dest.Length).TrimStart('\','/')
          } | Sort-Object
          $inventory | Set-Content (Join-Path $dest 'INVENTORY.txt') -Encoding utf8
          "COUNT=$($inventory.Count)" | Write-Host

      - name: Commit live source snapshot to audit branch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name "BRELGA Audit"
          git config user.email "actions@braseiro.local"
          git add ci/pf2-r30-live-src
          if(git diff --cached --quiet){ Write-Host 'No changes'; exit 0 }
          git commit -m "audit: snapshot relevant PF2 R30 post-Antigravity source"
          git push origin HEAD:audit-pf2-kingmaker-r30-20260928
