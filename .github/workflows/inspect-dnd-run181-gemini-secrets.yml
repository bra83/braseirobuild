name: Inspect DnD RUN181 Gemini Secrets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-dnd-run181-gemini-secrets.yml']
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Show secret methods
        shell: powershell
        run: |
          $p='C:\DND181\extract\dnd_work\android\app\src\main\java\com\braseiro\dnd5e\MainActivity.java'
          $ls=Get-Content $p
          foreach($pat in @('private String geminiKey','private String geminiPaidKey','saveGeminiSecretsAtomically','decryptSecret','encryptSecret')){
            "===== $pat ====="
            $ms=Select-String -Path $p -Pattern $pat -AllMatches
            foreach($m in $ms){
              $a=[Math]::Max(1,$m.LineNumber-6);$b=[Math]::Min($ls.Count,$m.LineNumber+35)
              for($i=$a;$i -le $b;$i++){"{0,6}: {1}" -f $i,$ls[$i-1]}
            }
          }
