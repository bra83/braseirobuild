name: DnD NORMAL RUN247 MOD005 BRELGA native Android validation
on:
  workflow_dispatch:
  push:
    branches:
      - dnd/run247-mod005-reconciled-g05-brelga
    paths:
      - .github/workflows/dnd-run247-mod005-normal-brelga.yml
      - ci/dnd-normal-run247/compare_exact_trees.py
      - ci/dnd-normal-run247/verify_pinned_tree_no_drive.py
      - ci/dnd-normal-run247/RUN247_ORIGINAL_SHA256_MANIFEST.json.gz.b64.txt
      - ci/dnd-normal-run247/integration_fix_manifest.json
      - dnd-normal/run247-mod005/**
permissions:
  contents: write
concurrency:
  group: dnd-normal-run247-mod005-g05-brelga
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - name: Use installed toolchains and clone only Braseiro DnD on D drive (no setup actions)
        shell: powershell
        env:
          GH_REPO_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw 'WRONG_RUNNER' }
          if ($env:GITHUB_REF_NAME -ne 'dnd/run247-mod005-reconciled-g05-brelga') { throw 'WRONG_SOURCE_BRANCH' }
          $d=Get-PSDrive -Name D -PSProvider FileSystem
          if ($d.Free -lt 5GB) { throw 'D_DRIVE_LESS_THAN_5GB' }
          $root=Join-Path 'D:\' ('braseiro-dnd-native-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          $repo=Join-Path $root 'repo'
          $out=Join-Path $root 'out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $java17='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          $python311='C:\actions-runner\_work\_tool\Python\3.11.9\x64\python.exe'
          if (!(Test-Path $java17) -or !(Test-Path $python311)) { throw 'KNOWN_INSTALLED_JAVA17_OR_PYTHON311_MISSING' }
          $env:JAVA_HOME=$java17
          $env:PATH=(Join-Path $java17 'bin')+';'+$env:PATH
          $env:GRADLE_USER_HOME='D:\braseiro-dnd-native-cache\gradle-home'
          New-Item -ItemType Directory -Path $env:GRADLE_USER_HOME -Force | Out-Null
          $env:TEMP=Join-Path $root 'temp'
          $env:TMP=$env:TEMP
          New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
          if (!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)) {
            $sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'
            if (Test-Path $sdk) { $env:ANDROID_HOME=$sdk }
          }
          if (!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)) { throw 'BRELGA_ANDROID_SDK_NOT_FOUND' }
          $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($env:GH_REPO_TOKEN)) { throw 'GITHUB_TOKEN_MISSING' }
          $auth=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:'+$env:GH_REPO_TOKEN))
          $env:GIT_CONFIG_COUNT='1'; $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'; $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+$auth
          try {
            & git -c core.autocrlf=false -c core.eol=lf clone --filter=blob:none --sparse --depth 1 --single-branch -b 'dnd/run247-mod005-reconciled-g05-brelga' https://github.com/bra83/braseirobuild.git $repo
            if ($LASTEXITCODE -ne 0) { throw 'GIT_CLONE_FAILED' }
            & git -C $repo fetch --depth 1 origin $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'EXACT_TRIGGER_COMMIT_FETCH_FAILED' }
            & git -C $repo checkout --detach $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'EXACT_TRIGGER_COMMIT_CHECKOUT_FAILED' }
            & git -C $repo config core.autocrlf false
            & git -C $repo config core.eol lf
            & git -C $repo sparse-checkout set ci/dnd-normal-run247 dnd-normal/run247-mod005
            if ($LASTEXITCODE -ne 0) { throw 'GIT_SPARSE_CHECKOUT_FAILED' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }
          @("DND_ROOT=$root","DND_REPO=$repo","DND_OUT=$out","DND_PROJECT=$(Join-Path $repo 'dnd-normal/run247-mod005')","DND_PYTHON=$python311","JAVA_HOME=$java17","GRADLE_USER_HOME=$env:GRADLE_USER_HOME","TEMP=$env:TEMP","TMP=$env:TMP","ANDROID_HOME=$env:ANDROID_HOME","ANDROID_SDK_ROOT=$env:ANDROID_HOME") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $actual=(& git -C $repo rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'SOURCE_COMMIT_MISMATCH' }
          "SOURCE_GIT_COMMIT=$((& git -C $repo rev-parse HEAD).Trim())" | Out-File (Join-Path $out 'PROVENANCE.txt') -Encoding utf8
          "BASELINE_SHA256=2774b450ecf5be179976199b22bab8584f76939dcf305d82a84171a199282e06" | Out-File (Join-Path $out 'PROVENANCE.txt') -Encoding utf8 -Append
          'NO_APK_BUILD=YES' | Out-File (Join-Path $out 'PROVENANCE.txt') -Encoding utf8 -Append
          Write-Host 'BRELGA_D_DRIVE=ACTIVE; EXISTING_JAVA17_PYTHON311=ACTIVE; APK=DISABLED'
      - name: Verify all 1437 SHA-pinned reconciled source files offline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $verify=Join-Path $env:DND_REPO 'ci/dnd-normal-run247/verify_pinned_tree_no_drive.py'
          $baseline=Join-Path $env:DND_REPO 'ci/dnd-normal-run247/RUN247_ORIGINAL_SHA256_MANIFEST.json.gz.b64.txt'
          $allowed=Join-Path $env:DND_REPO 'ci/dnd-normal-run247/integration_fix_manifest.json'
          $output=Join-Path $env:DND_OUT 'SOURCE_VERIFY.txt'
          $ErrorActionPreference='Continue'
          & $env:DND_PYTHON -u $verify --root $env:DND_PROJECT --baseline $baseline --allowed-manifest $allowed --output $output 2>&1 | Tee-Object (Join-Path $env:DND_OUT 'SOURCE_TREE_VERIFY.log')
          $rc=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          "SOURCE_TREE_EXIT_CODE=$rc" | Out-File (Join-Path $env:DND_OUT 'STAGES.txt') -Encoding utf8 -Append
          if ($rc -ne 0) { throw 'ORIGINAL_RUN247_TREE_SHA256_VERIFICATION_FAILED' }
          'SOURCE_FIX_VERIFY_EXIT_CODE=0' | Out-File (Join-Path $env:DND_OUT 'STAGES.txt') -Encoding utf8 -Append
      - name: Compile Android Java on reconciled source
        shell: powershell
        run: |
          Set-Location $env:DND_PROJECT
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:compileDebugJavaWithJavac --no-daemon --console=plain --stacktrace 2>&1 | Tee-Object (Join-Path $env:DND_OUT '01_android_compile.log')
          $rc=$LASTEXITCODE
          "COMPILE_EXIT_CODE=$rc" | Out-File (Join-Path $env:DND_OUT 'STAGES.txt') -Encoding utf8 -Append
          if ($rc -ne 0) { throw 'COMPILE_NOT_GREEN' }
      - name: Full Android JVM Robolectric suite and required focused classes
        shell: powershell
        run: |
          Set-Location $env:DND_PROJECT
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain --stacktrace 2>&1 | Tee-Object (Join-Path $env:DND_OUT '04_full_suite.log')
          $rc=$LASTEXITCODE
          "FULL_SUITE_EXIT_CODE=$rc" | Out-File (Join-Path $env:DND_OUT 'STAGES.txt') -Encoding utf8 -Append
          $ErrorActionPreference='Stop'
          if ($rc -ne 0) { throw 'FULL_SUITE_NOT_GREEN' }
          $required=@{
            RUN246='com.braseiro.dnd5e.Run246G05TypedOnHitBatchRobolectricTest'
            RUN247='com.braseiro.dnd5e.Run247G05UntimedProneRobolectricTest'
          }
          foreach ($label in @('RUN246','RUN247')) {
            $xmlPath=Join-Path $env:DND_PROJECT ('app/build/test-results/testDebugUnitTest/TEST-'+$required[$label]+'.xml')
            if (!(Test-Path $xmlPath)) { throw ('REQUIRED_TEST_XML_MISSING_'+$label) }
            [xml]$result=Get-Content -LiteralPath $xmlPath -Raw
            $suite=$result.testsuite
            if (!$suite -or $suite.name -ne $required[$label] -or [int]$suite.tests -lt 1 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0 -or [int]$suite.skipped -ne 0) { throw ('REQUIRED_TESTS_NOT_GREEN_'+$label) }
            ($label+'_EXIT_CODE=0') | Out-File (Join-Path $env:DND_OUT 'STAGES.txt') -Encoding utf8 -Append
            Write-Host ($label+'_EXECUTED_TESTS='+$suite.tests)
          }
      - name: Save logs XMLs and exact source commit to GitHub tree, bypassing artifact quota
        if: always()
        shell: powershell
        env:
          GH_REPO_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if (!(Test-Path $env:DND_REPO)) { throw 'SOURCE_TREE_UNAVAILABLE' }
          $relative='ci/dnd-normal-run247/evidence/'+$env:GITHUB_RUN_ID+'/'+$env:GITHUB_RUN_ATTEMPT
          $target=Join-Path $env:DND_REPO $relative
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $testout=Join-Path $env:DND_PROJECT 'app/build/test-results/testDebugUnitTest'
          if (Test-Path $testout) { Copy-Item -LiteralPath $testout -Destination (Join-Path $target 'junit') -Recurse -Force }
          $reports=Join-Path $env:DND_PROJECT 'app/build/reports/tests/testDebugUnitTest'
          if (Test-Path $reports) { Copy-Item -LiteralPath $reports -Destination (Join-Path $target 'html') -Recurse -Force }
          foreach ($file in @(Get-ChildItem -LiteralPath $env:DND_OUT -File -ErrorAction SilentlyContinue)) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $target $file.Name) -Force
          }
          & git -C $env:DND_REPO add --force -- $relative
          if ($LASTEXITCODE -ne 0) { throw 'GIT_EVIDENCE_STAGE_FAILED' }
          $pending=& git -C $env:DND_REPO status --porcelain -- $relative
          if (!$pending) { throw 'NO_EVIDENCE_TO_COMMIT' }
          & git -C $env:DND_REPO -c user.name='braseiro-brelga[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m ('evidence(dnd-normal): pinned Android validation '+$env:GITHUB_RUN_ID) -- $relative
          if ($LASTEXITCODE -ne 0) { throw 'GIT_EVIDENCE_COMMIT_FAILED' }
          $auth=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:'+$env:GH_REPO_TOKEN))
          $env:GIT_CONFIG_COUNT='1'; $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'; $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+$auth
          try {
            $evidenceBranch='dnd/evidence-run247-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT
            & git -C $env:DND_REPO push https://github.com/bra83/braseirobuild.git ('HEAD:refs/heads/'+$evidenceBranch)
            if ($LASTEXITCODE -ne 0) { throw 'GIT_EVIDENCE_PUSH_FAILED' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }
          Write-Host ('GITHUB_EVIDENCE_PATH='+$relative)
      - name: Require every Android gate green (no silent approval)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $lines=Get-Content (Join-Path $env:DND_OUT 'STAGES.txt')
          foreach($label in @('SOURCE_TREE','SOURCE_FIX_VERIFY','COMPILE','RUN246','RUN247','FULL_SUITE')) {
            if (!(($lines | Where-Object { $_ -eq ($label+'_EXIT_CODE=0') }).Count -eq 1)) { throw ('DND_ANDROID_GATE_NOT_GREEN_'+$label) }
          }
          Write-Host 'DND_ANDROID_GATES_PASS=YES'
          Write-Host 'G05_OPEN_235=STILL_PENDING; APP_HOMOLOGATION=NOT_ATTESTED; NO_APK_BUILD=YES'
