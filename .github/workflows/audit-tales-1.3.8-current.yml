name: Audit Tales 1.3.8 Current Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-tales-1.3.8-current.yml"
      - ".github/TALES_138_AUDIT_TRIGGER"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Download 1.3.8 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work audit/tales-1.3.8-current
          mkdir -p incoming work audit/tales-1.3.8-current
          gh release download TALES-1.3.8 --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip' --dir incoming
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip -d work
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          echo "$ROOT" > audit/tales-1.3.8-current/root.txt

          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys, re, shutil
          root=Path(sys.argv[1])
          out=Path('audit/tales-1.3.8-current')
          pats=[
            re.compile(r'portrait|retrato|photo|foto|base64',re.I),
            re.compile(r'gemini.*image|image.*gemini|prompt.*visual|Referência de composição|referencia de composicao|scene.*prompt|prompt.*scene',re.I),
            re.compile(r'group|grupo',re.I),
          ]
          allowed={'.kt','.java','.kts','.xml','.json','.js','.mjs','.md','.txt'}
          hits=[]; matched=[]
          for p in root.rglob('*'):
            if not p.is_file() or p.suffix.lower() not in allowed: continue
            try: txt=p.read_text(encoding='utf-8')
            except: continue
            lines=txt.splitlines()
            found=False
            for i,line in enumerate(lines,1):
              if any(r.search(line) for r in pats):
                found=True
                a=max(1,i-3); b=min(len(lines),i+5)
                hits.append(f'FILE {p.relative_to(root)} L{i}\n'+'\n'.join(f'{j}: {lines[j-1]}' for j in range(a,b+1))+'\n')
            if found:
              matched.append(p)
          (out/'grep_hits.txt').write_text('\n'.join(hits),encoding='utf-8')
          # Copy the most relevant compact source files verbatim.
          keep=[]
          for p in matched:
            rel=str(p.relative_to(root))
            low=rel.lower()
            if any(k in low for k in ['groupscreen','kidscreen','kid','portrait','image','gemini','motorbarbara','scene','adventure','prompt','group']):
              keep.append(p)
          for p in keep[:80]:
            rel=p.relative_to(root)
            dest=out/'src'/rel
            dest.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(p,dest)
          (out/'matched_files.txt').write_text('\n'.join(str(p.relative_to(root)) for p in matched),encoding='utf-8')
          PY

      - name: Commit audit snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/tales-1.3.8-current
          git commit -m 'Audit current Tales 1.3.8 source' || exit 0
          git push
