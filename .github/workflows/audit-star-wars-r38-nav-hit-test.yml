name: Audit Star Wars R38 nav hit test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-star-wars-r38-nav-hit-test.yml"]
permissions:
  contents: write
jobs:
  hit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: src
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'));print('url='+d['source_share_url']);print('sha='+d['sha256']);print('file='+d['file'])
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prepare exact Block01 state
        env:
          U: ${{ steps.src.outputs.url }}
          F: ${{ steps.src.outputs.file }}
          S: ${{ steps.src.outputs.sha }}
          SU: https://firestorage.ai/ja/f/PbM3XvdzNMAk
          SF: scene-assets-v1-tiny.tar.gz
          SS: 2ca16b2cd0d3f489fe10f1df718be1243febeef38fb88a52bd50502528f60711
        run: |
          set -euo pipefail; rm -rf incoming work; mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          def dl(u,n,o):
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);q=b.new_page(accept_downloads=True);q.goto(u,wait_until='domcontentloaded',timeout=120000);q.wait_for_timeout(3000);d=False
              for s in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
                try:
                  x=q.locator(s).first
                  if not x.count() or not x.is_visible():continue
                  with q.expect_download(timeout=120000) as i:x.click(timeout=10000)
                  i.value.save_as(str(o));d=True;break
                except:pass
              if not d:
                x=q.get_by_text(n,exact=False).first
                with q.expect_download(timeout=120000) as i:x.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
                i.value.save_as(str(o));d=True
              b.close()
            if not d:raise SystemExit('download failed')
          dl(os.environ['U'],os.environ['F'],pathlib.Path('incoming')/os.environ['F']);dl(os.environ['SU'],os.environ['SF'],pathlib.Path('incoming')/os.environ['SF'])
          PY
          echo "${S}  incoming/${F}"|sha256sum -c -;echo "${SS}  incoming/${SF}"|sha256sum -c -
          unzip -q "incoming/${F}" -d work; G="$(find work -name gradlew -type f -not -path '*/build/*'|head -1)";R="$(dirname "$G")";echo "$R">/tmp/root
          base64 -w0 "incoming/${SF}" > star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          python3 star-wars/r38/patches/block01_repair_safe.py "$R"
      - name: Hit-test visible nav buttons
        run: |
          export ROOT="$(cat /tmp/root)"
          python3 - <<'PY'
          import os,json,pathlib,threading,http.server,socketserver
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(os.environ['ROOT']);vtt=root/'app/src/main/assets/vtt';os.chdir(vtt)
          class H(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          s=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=s.serve_forever,daemon=True).start();port=s.server_address[1]
          out=[]
          try:
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915})
              pg.add_init_script('''const h={get:(t,p)=>{if(p==='then')return undefined;return(...a)=>JSON.stringify({ok:true,items:[],data:[],state:{}})}};for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroGemini','BraseiroImages','BraseiroFiles','BraseiroTts'])window[n]=new Proxy({},h);''')
              pg.goto(f'http://127.0.0.1:{port}/r46-shell.html',wait_until='domcontentloaded');pg.wait_for_timeout(2000)
              loc=pg.locator('.bottom-nav-button:visible')
              for i in range(loc.count()):
                el=loc.nth(i);lab=(el.inner_text() or f'#{i}').strip().replace('\n',' ');box=el.bounding_box()
                d=pg.evaluate('''({i})=>{const e=document.querySelectorAll('.bottom-nav-button')[i];const r=e.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;const top=document.elementFromPoint(x,y);const chain=[];let n=top;while(n&&chain.length<8){chain.push({tag:n.tagName,id:n.id,cls:n.className,aria:n.getAttribute&&n.getAttribute('aria-label'),pe:getComputedStyle(n).pointerEvents,z:getComputedStyle(n).zIndex,pos:getComputedStyle(n).position});n=n.parentElement}return {button:{tag:e.tagName,cls:e.className,disabled:e.disabled,rect:{x:r.x,y:r.y,w:r.width,h:r.height},z:getComputedStyle(e).zIndex,pos:getComputedStyle(e).position,pe:getComputedStyle(e).pointerEvents},point:{x,y},top:chain}}''',{'i':i})
                normal={'ok':True,'error':None};forced={'ok':True,'error':None}
                try:el.click(timeout=2000);pg.wait_for_timeout(100)
                except Exception as ex:normal={'ok':False,'error':str(ex)[:2000]}
                try:el.click(timeout=1000,force=True);pg.wait_for_timeout(100)
                except Exception as ex:forced={'ok':False,'error':str(ex)[:1000]}
                d.update({'label':lab,'normal':normal,'forced':forced,'ariaCurrent':el.get_attribute('aria-current')});out.append(d)
              b.close()
          finally:s.shutdown();s.server_close()
          dest=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit/NAV_HIT_TEST.json';dest.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          md=['# R38 NAV HIT TEST','']
          for x in out:
            top=x['top'][0] if x['top'] else {};md.append(f"- **{x['label']}** normal={x['normal']['ok']} force={x['forced']['ok']} centerTop=`{top.get('tag')}#{top.get('id')}.{top.get('cls')}` buttonRect={x['button']['rect']}")
            if not x['normal']['ok']:md.append('  - '+x['normal']['error'].replace('\n',' ')[:900])
          (dest.parent/'NAV_HIT_TEST.md').write_text('\n'.join(md)+'\n')
          PY
      - name: Commit evidence
        run: |
          git checkout -- star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          git config user.name braseiro-audit-bot;git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/NAV_HIT_TEST.*;git commit -m 'audit(star-wars): identify nav hit-test blocker' || true;git push
