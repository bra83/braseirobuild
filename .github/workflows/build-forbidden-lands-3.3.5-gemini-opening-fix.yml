name: Forbidden Lands 3.3.5 Gemini Opening Fix - BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-forbidden-lands-3.3.5-gemini-opening-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forbidden-lands-3.3.5-gemini-opening-fix
  cancel-in-progress: true

env:
  SOURCE_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5_GEMINI_OPENING_FIX_SOURCE.zip"
  SOURCE_BYTES: "26711184"
  SOURCE_SHA256: "bd0bb4753cca84d0ed49e684578aae52838b0440c0a63d6f6f9a8c5d8bd650bc"
  FIRESTORAGE_API: "https://api.firestorage.ai/dev/file/shares/pVpRTK4whCQb"
  BUILD_ROOT: "D:\\brelga-forbidden-lands-gemini-fix"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5_GEMINI_OPENING_FIX.apk"
  TAG: "forbidden-lands-3.3.5-gemini-opening-fix"
  EXPECTED_SHA1: "9d0f1089b3fb6c225f1f59462750864e897c4d92"

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - name: Configure BRELGA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          Remove-Item $env:BUILD_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:BUILD_ROOT -Force | Out-Null

          $nodeRoot='C:\actions-runner\_work\_tool\node'
          $nodeDir=Get-ChildItem $nodeRoot -Directory |
            ForEach-Object { Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue } |
            Where-Object { Test-Path (Join-Path $_.FullName 'node.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          $javaRoot='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk'
          $javaDir=Get-ChildItem $javaRoot -Directory -Recurse |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\java.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          $sdk='C:\actions-runner\android-sdk'
          if (-not $nodeDir -or -not $javaDir -or -not (Test-Path $sdk)) { throw 'BRELGA toolchain incomplete' }

          $temp=Join-Path $env:BUILD_ROOT 'temp'
          $gradle=Join-Path $env:BUILD_ROOT 'gradle-home'
          $npm=Join-Path $env:BUILD_ROOT 'npm-cache'
          New-Item -ItemType Directory -Path $temp,$gradle,$npm -Force | Out-Null
          $newPath="$($nodeDir.FullName);$($javaDir.FullName)\bin;$env:PATH"
          "PATH=$newPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JAVA_HOME=$($javaDir.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GRADLE_USER_HOME=$gradle" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NPM_CONFIG_CACHE=$npm" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $env:PATH=$newPath
          node --version
          java -version

      - name: Download corrected source
        id: src
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $meta=Invoke-RestMethod -Method Get -Uri ($env:FIRESTORAGE_API + '/files?maxResults=100')
          $file=$meta.files | Where-Object { $_.fileName -eq $env:SOURCE_NAME } | Select-Object -First 1
          if (-not $file) { throw "Source not found: $env:SOURCE_NAME" }
          $ticket=Invoke-RestMethod -Method Post -Uri ($env:FIRESTORAGE_API + '/files/' + $file.fileId + '/download')
          $zip=Join-Path $env:BUILD_ROOT $env:SOURCE_NAME
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $zip $ticket.downloadUrl
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-Item $zip).Length -ne [int64]$env:SOURCE_BYTES) { throw "Source size mismatch: $((Get-Item $zip).Length)" }
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SOURCE_SHA256) { throw "Source SHA mismatch: $hash" }
          $root=Join-Path $env:BUILD_ROOT 'project'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          & tar.exe -xf $zip -C $root
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          "root=$root" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install dependencies
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Ensure Windows native dependencies
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & node.exe -e "try{require.resolve('@rollup/rollup-win32-x64-msvc');process.exit(0)}catch{process.exit(1)}"
          if ($LASTEXITCODE -ne 0) {
            $v=(& node.exe -p "require('./node_modules/rollup/package.json').version").Trim()
            & npm.cmd install --no-save --no-package-lock --no-audit --no-fund "@rollup/rollup-win32-x64-msvc@$v"
            if ($LASTEXITCODE -ne 0) { throw 'Rollup native dependency install failed' }
          }
          & node.exe -e "try{require.resolve('@esbuild/win32-x64');process.exit(0)}catch{process.exit(1)}"
          if ($LASTEXITCODE -ne 0) {
            $v=(& node.exe -p "require('./node_modules/esbuild/package.json').version").Trim()
            & npm.cmd install --no-save --no-package-lock --no-audit --no-fund "@esbuild/win32-x64@$v"
            if ($LASTEXITCODE -ne 0) { throw 'esbuild native dependency install failed' }
          }

      - name: Compile and regression gates
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd run lint
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript lint failed' }
          & node.exe scripts/verify-user-reported-regressions.mjs
          if ($LASTEXITCODE -ne 0) { throw 'User regression gate failed' }
          & node.exe scripts/verify-runtime-hotfix-3d-startup.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Startup/3D gate failed' }
          & npm.cmd run verify:runtime-hotfix-3.3.5
          if ($LASTEXITCODE -ne 0) { throw 'Runtime 3.3.5 gate failed' }

      - name: Android sync and verification
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd run android:sync
          if ($LASTEXITCODE -ne 0) { throw 'Android sync failed' }
          & npm.cmd run verify:android
          if ($LASTEXITCODE -ne 0) { throw 'Android verify failed' }
          & npm.cmd run lint
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript regressed after sync' }
          & node.exe scripts/verify-user-reported-regressions.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Gemini/opening fix regressed after sync' }

      - name: Bump install versionCode
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $path='android\app\build.gradle'
          $text=Get-Content $path -Raw
          if ($text -match 'versionCode\s+303503') { exit 0 }
          if ($text -notmatch 'versionCode\s+303500') { throw 'Base versionCode 303500 not found' }
          $text=$text -replace 'versionCode\s+303500','versionCode 303503'
          Set-Content $path $text -Encoding utf8

      - name: Build APK
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & node.exe scripts/run-gradle-task.mjs assembleDebug
          if ($LASTEXITCODE -ne 0) { throw 'assembleDebug failed' }

      - name: Validate APK
        id: apk
        shell: powershell
        env:
          ROOT: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $built=Join-Path $env:ROOT 'android\app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path $built)) { throw 'APK not produced' }
          $out=Join-Path $env:BUILD_ROOT 'out'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apk=Join-Path $out $env:APK_NAME
          Copy-Item $built $apk -Force

          $bt=Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $aapt=Join-Path $bt.FullName 'aapt.exe'
          $signer=Join-Path $bt.FullName 'apksigner.bat'

          & $aapt dump badging $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_BADGING.txt')
          if ($LASTEXITCODE -ne 0) { throw 'aapt failed' }
          $badging=Get-Content (Join-Path $out 'APK_BADGING.txt') -Raw
          if ($badging -notmatch "package: name='com\.braseiro\.forbiddenlands'") { throw 'Wrong package' }
          if ($badging -notmatch "versionCode='303500'") { throw 'Wrong versionCode' }
          if ($badging -notmatch "versionName='3\.3\.5'") { throw 'Wrong versionName' }

          & $signer verify --verbose --print-certs $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_SIGNATURE.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Signature invalid' }
          $signature=Get-Content (Join-Path $out 'APK_SIGNATURE.txt') -Raw
          $m=[regex]::Match($signature,'Signer #1 certificate SHA-1 digest:\s*([0-9A-Fa-f:]+)')
          if (-not $m.Success) { throw 'Signer digest absent' }
          $actual=($m.Groups[1].Value -replace ':','').ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA1) { throw "Historical signer mismatch: $actual" }

          $hash=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content (Join-Path $out "$($env:APK_NAME).sha256") -Encoding ascii
          @(
            'STATUS=PASS',
            "SOURCE_SHA256=$env:SOURCE_SHA256",
            "APK_SHA256=$hash",
            'GEMINI_GATEWAY_TOTAL_DEADLINE=PASS',
            'MODEL_ROUTER_TOTAL_BUDGET=PASS',
            'OPENING_REMOTE_RESPONSE_PRESERVED=PASS',
            'OPENING_TECHNICAL_PROMPT_NOT_ECHOED=PASS',
            'REALISTIC_GEMINI_SETTINGS_TEST=PASS',
            'STALE_MODEL_STATUS_RESET=PASS',
            'PREDEFINED_ACTIONS=PASS',
            'NATIVE_3D_DICE_REGRESSION_GATE=PASS',
            'ANDROID_SYNC=PASS',
            'ANDROID_BUILD=PASS',
            "SIGNER_SHA1=$actual"
          ) | Set-Content (Join-Path $out 'GEMINI_OPENING_FIX_PROOF.txt') -Encoding utf8
          "dir=$out" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_FORBIDDEN_LANDS_3.3.5_GEMINI_OPENING_FIX
          path: |
            ${{ steps.apk.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_GEMINI_OPENING_FIX.apk
            ${{ steps.apk.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_GEMINI_OPENING_FIX.apk.sha256
            ${{ steps.apk.outputs.dir }}/APK_BADGING.txt
            ${{ steps.apk.outputs.dir }}/APK_SIGNATURE.txt
            ${{ steps.apk.outputs.dir }}/GEMINI_OPENING_FIX_PROOF.txt
          retention-days: 30

      - name: Publish release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $headers=@{ Authorization="Bearer $env:GITHUB_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='BRELGA-FL-GEMINI-FIX' }
          $release=$null
          try { $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG" } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          if (-not $release) {
            $payload=@{ tag_name=$env:TAG; target_commitish='main'; name='Braseiro Forbidden Lands 3.3.5 - Gemini Opening Fix'; body='Fix: Gemini opening uses bounded total budgets across router/gateway, valid remote text is never discarded only for length, technical bootstrap prompts cannot leak into fallback, and Settings performs a real GM-schema test.'; draft=$false; prerelease=$false } | ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $payload -Uri "https://api.github.com/repos/$repo/releases"
          }
          $assets=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach ($name in @($env:APK_NAME,"$($env:APK_NAME).sha256",'APK_BADGING.txt','APK_SIGNATURE.txt','GEMINI_OPENING_FIX_PROOF.txt')) {
            $path=Join-Path $env:APK_DIR $name
            if (-not (Test-Path $path)) { throw "Missing asset: $name" }
            $old=$assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($old) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($old.id)" | Out-Null }
            $mime=if ($name -like '*.apk') { 'application/vnd.android.package-archive' } else { 'text/plain' }
            $url="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
            & curl.exe -L --fail -X POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: $mime" --data-binary "@$path" $url
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed: $name" }
          }
