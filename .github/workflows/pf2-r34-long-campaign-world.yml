name: PF2 R34 Long Campaign + Autonomous Causal World

on:
  push:
    branches:
      - pf2-r34-long-campaign-world-20260929
    paths:
      - '.github/workflows/pf2-r34-long-campaign-world.yml'
      - 'ci/pf2-r34-long-campaign-world/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pf2-r34-long-campaign-world-final
  cancel-in-progress: true

jobs:
  build:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 240
    steps:
      - name: Checkout R34
        uses: actions/checkout@v4
        with:
          ref: pf2-r34-long-campaign-world-20260929

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate build and publish R34
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\ci\pf2-r34-long-campaign-world\run_r34_ci.ps1
