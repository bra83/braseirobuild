name: Build Braseiro Fichas Final 2026-09-16

on:
  push:
    branches: [fichas-final-20260916]
    paths:
      - ".github/workflows/build-fichas-final-20260916.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_URL: "https://firestorage.ai/ja/f/FamlbFgCpuKz"
      SOURCE_SHA256: "a7ce356b8c478aa7c60af6a7dae2f8482b3e71f5e3feb9d1e1fbfd5b294c3bd1"
      SOURCE_FILE_ID: "01a0a868362471ce917187aa06456a20"
      SOURCE_PUBLIC_ID: "Nm63yEl1vDkDPZcA"
      SOURCE_NAME: "BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO_FINAL_2026-09-16.zip"

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Baixar checkpoint final e validar SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, html, os, re, sys, urllib.parse, urllib.request

          source_url=os.environ['SOURCE_URL']
          expected=os.environ['SOURCE_SHA256'].lower()
          file_id=os.environ['SOURCE_FILE_ID']
          public_id=os.environ['SOURCE_PUBLIC_ID']
          source_name=os.environ['SOURCE_NAME']
          out=os.path.join(os.environ['RUNNER_TEMP'], source_name)
          headers={'User-Agent':'Mozilla/5.0 GitHub-Actions-BraseiroBuild/1.0','Accept':'*/*'}

          def fetch(url):
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.geturl(), r.headers.get('Content-Type',''), r.read()

          def accept(data):
              if not data.startswith(b'PK'):
                  return False
              sha=hashlib.sha256(data).hexdigest().lower()
              print('candidate zip sha256=', sha, 'bytes=', len(data))
              if sha != expected:
                  return False
              with open(out,'wb') as f: f.write(data)
              return True

          final_url, ctype, data=fetch(source_url)
          print('share status target=', final_url, 'content-type=', ctype, 'bytes=', len(data))
          if accept(data):
              print('ZIP obtained directly from share URL')
              sys.exit(0)

          text=data.decode('utf-8','ignore')
          decoded=html.unescape(text)
          raw=[]
          raw += re.findall(r'''(?:href|src)=["']([^"']+)["']''', decoded, flags=re.I)
          raw += re.findall(r'''https?://[^"'<>\\s]+''', decoded, flags=re.I)
          raw += re.findall(r'''["']([^"']*(?:download|file|storage|api)[^"']*)["']''', decoded, flags=re.I)
          candidates=[]
          seen=set()
          for x in raw:
              x=x.replace('\\/','/').strip()
              if not x or x.startswith(('javascript:','data:','#')): continue
              u=urllib.parse.urljoin(final_url, x)
              if u in seen: continue
              seen.add(u)
              score=sum(t.lower() in u.lower() for t in ('download','.zip',source_name,file_id,public_id,'api','file'))
              if score: candidates.append((score,u))
          candidates.sort(reverse=True)
          print('download candidates=', len(candidates))
          for score,u in candidates[:80]:
              try:
                  print('trying', score, u)
                  _, ct, body=fetch(u)
                  if accept(body):
                      print('ZIP resolved from',u,'content-type=',ct)
                      sys.exit(0)
              except Exception as e:
                  print('candidate failed:', type(e).__name__, str(e)[:200])
          print('Could not resolve exact ZIP. Share page prefix follows:')
          print(decoded[:4000])
          sys.exit(2)
          PY
          ZIP="$RUNNER_TEMP/$SOURCE_NAME"
          test -f "$ZIP"
          echo "$SOURCE_SHA256  $ZIP" | sha256sum -c -
          unzip -t "$ZIP"

      - name: Extrair projeto Android Studio
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fichas-final"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$RUNNER_TEMP/$SOURCE_NAME" -d "$WORK"
          GRADLEW="$(find "$WORK" -type f -name gradlew -print -quit)"
          test -n "$GRADLEW"
          ROOT="$(dirname "$GRADLEW")"
          test -f "$ROOT/settings.gradle.kts" -o -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/build.gradle.kts" -o -f "$ROOT/app/build.gradle"
          echo "ANDROID_PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android root: $ROOT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --stacktrace --no-daemon

      - name: Validar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_PROJECT_ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -f "$APK"
          OUT="$GITHUB_WORKSPACE/build-artifacts/fichas-final-20260916"
          mkdir -p "$OUT"
          unzip -t "$APK" > "$OUT/unzip-apk.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$OUT/aapt.txt"
          grep -q "package: name='com.braseiro.fichas' versionCode='1' versionName='1.0.0'" "$OUT/aapt.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$OUT/apksigner.txt"
          cp "$APK" "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.0-final-debug.apk"
          sha256sum "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.0-final-debug.apk" | tee "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.0-final-debug.apk.sha256"
          echo "$SOURCE_SHA256  $SOURCE_NAME" > "$OUT/source-project.sha256"

      - name: Upload APK final
        uses: actions/upload-artifact@v4
        with:
          name: braseiro-fichas-final-20260916
          path: build-artifacts/fichas-final-20260916
          if-no-files-found: error
          retention-days: 30
