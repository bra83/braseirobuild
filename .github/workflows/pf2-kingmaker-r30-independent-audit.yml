name: PF2 Kingmaker R30 Independent Audit

on:
  push:
    branches: [audit-pf2-kingmaker-r30-20260928]
    paths:
      - '.github/workflows/pf2-kingmaker-r30-independent-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and extract R30
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Expected BRELGA"}
          $root=Join-Path $env:RUNNER_TEMP 'pf2-r30-integrated-discovery'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root -Force|Out-Null
          $rar=Join-Path $root 'pf2e_r30_work.rar'
          & curl.exe -L --fail --retry 5 --retry-delay 3 "https://drive.usercontent.google.com/download?id=1UbJq8m518f1jIQkkXASvEp0j0Uf6qNkR&export=download&confirm=t" -o $rar
          if($LASTEXITCODE -ne 0){throw 'download failed'}
          if((Get-Item $rar).Length -ne 553809972){throw 'wrong size'}
          $out=Join-Path $root 'extracted'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          & 'C:\Program Files\WinRAR\UnRAR.exe' x -y $rar "$out\"
          if($LASTEXITCODE -ne 0){throw 'extract failed'}
          $work=Join-Path $out 'pf2e_r30_work'
          "WORK_ROOT=$work"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Discover integration points
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          @'
          from pathlib import Path
          root=Path(".")
          needles=[
            "DESCREVER PERSONAGEM","Imagem recebida","Braseiro Kokoro PT-BR",
            "com.k2fsa.sherpa.onnx.tts.engine","\\\\p{M}","\\p{M}",
            "Turno do Reino","Kingmaker Solo","token","scene_image","scene image",
            "Narrative","Narrativa","Barbara","Bárbara"
          ]
          exts={".java",".kt",".json",".xml",".html",".js",".ts",".tsx"}
          shown=0
          for p in list((root/"android/app/src/main").rglob("*"))+list((root/"tests_pf2").rglob("*")):
            if not p.is_file() or p.suffix.lower() not in exts or p.stat().st_size>900000: continue
            s=p.read_text("utf-8",errors="ignore")
            lines=s.splitlines()
            for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                a=max(0,i-6); b=min(len(lines),i+9)
                print(f"--- {p}:{i+1} ---")
                print("\n".join(f"{j+1}: {lines[j]}" for j in range(a,b)))
                shown+=1
                if shown>=220: raise SystemExit
          print("SHOWN",shown)
          '@ | Set-Content "$env:RUNNER_TEMP\discover_pf2.py" -Encoding utf8
          python "$env:RUNNER_TEMP\discover_pf2.py"
