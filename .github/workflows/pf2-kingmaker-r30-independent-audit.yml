name: PF2 Kingmaker R30 Independent Audit

on:
  push:
    branches: [audit-pf2-kingmaker-r30-20260928]
    paths:
      - '.github/workflows/pf2-kingmaker-r30-independent-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact post-Antigravity archive
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            'https://drive.usercontent.google.com/download?id=1UbJq8m518f1jIQkkXASvEp0j0Uf6qNkR&export=download&confirm=t' \
            -o pf2e_r30_work.rar
          ls -lh pf2e_r30_work.rar
          test "$(stat -c%s pf2e_r30_work.rar)" -eq 553809972

      - name: Extract archive
        shell: bash
        run: |
          set -euxo pipefail
          7z x -y pf2e_r30_work.rar -oextracted
          test -d extracted/pf2e_r30_work
          test -f extracted/pf2e_r30_work/version.properties
          test -d extracted/pf2e_r30_work/tests_pf2

      - name: Static mechanical closure checks
        working-directory: extracted/pf2e_r30_work
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p audit-results
          {
            echo '=== VERSION ==='
            cat version.properties
            echo
            echo '=== KINGMAKER TEST FILE COUNT ==='
            find tests_pf2 -maxdepth 1 -type f -name 'test_kingmaker*.py' | sort | tee /tmp/kmtests
            echo "count=$(wc -l < /tmp/kmtests)"
            echo
            echo '=== REQUIRED FINAL DOCUMENTS ==='
            for f in \
              HANDOFF_KINGMAKER_MECHANICS_COMPLETE.md \
              VALIDACAO_KINGMAKER_MECHANICS_COMPLETE.md \
              KINGMAKER_RULE_COVERAGE_MATRIX.md \
              KINGMAKER_RULE_COVERAGE_MATRIX.json \
              PATHFINDER2E_KINGMAKER_FINAL_MECHANICAL_AUDIT.md \
              PATHFINDER2E_KINGMAKER_MECHANICAL_TEST_REPORT.md; do
              test -s "$f"
              echo "OK $f"
            done
            echo
            echo '=== EXPLICIT INCOMPLETENESS MARKERS IN KINGMAKER RUNTIME ==='
            grep -RniE 'source_specific|TODO|FIXME|PLACEHOLDER|RAG_ONLY|PDF_ONLY' \
              android/app/src/main/java/com/braseiro/pathfinder2e \
              android/app/src/main/assets/pathfinder/kingmaker \
              --include='*.java' --include='*.json' || true
          } | tee audit-results/static-audit.txt

      - name: Run complete PF2 test suite independently
        working-directory: extracted/pf2e_r30_work
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -q pytest
          mkdir -p audit-results
          python -m pytest tests_pf2 -q 2>&1 | tee audit-results/pytest-full.log
          code=${PIPESTATUS[0]}
          echo "pytest_exit_code=$code" | tee audit-results/pytest-exit.txt
          exit $code

      - name: Upload independent audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf2-kingmaker-r30-independent-audit
          path: extracted/pf2e_r30_work/audit-results/
          if-no-files-found: warn
