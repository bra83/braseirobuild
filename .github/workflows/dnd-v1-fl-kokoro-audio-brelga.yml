name: DND V1 - FL Kokoro parity and footer audio status (BRELGA)
on:
  push:
    branches: [fix/dnd-kokoro-fl-parity-audio-status-20261017]
    paths:
      - '.github/workflows/dnd-v1-fl-kokoro-audio-brelga.yml'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/NarrationChunker.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/AudioStatusGate.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/AudioController.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/NarrativeAudioEngine.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/Run245G13NarrationChunkerTest.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/AudioStatusGateTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-v1-fl-audio-${{ github.sha }}
  cancel-in-progress: false
jobs:
  audio-regression:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 110
    steps:
      - name: Require BRELGA; do not compile APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'BRELGA_REQUIRED'}
          Write-Host ('KOKORO_SOURCE_SHA='+$env:GITHUB_SHA)
          Write-Host 'APK_BUILD=NO'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Configure Android + Java
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $java='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if(Test-Path $java){
            Add-Content $env:GITHUB_ENV ('JAVA_HOME='+$java)
            Add-Content $env:GITHUB_PATH (Join-Path $java 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if(!$sdk -or !(Test-Path $sdk)){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if(!(Test-Path $sdk)){throw 'ANDROID_SDK_MISSING'}
          Add-Content $env:GITHUB_ENV ('ANDROID_HOME='+$sdk)
          Add-Content $env:GITHUB_ENV ('ANDROID_SDK_ROOT='+$sdk)
          $shared=Join-Path $env:USERPROFILE '.gradle'
          $isolated=Join-Path $env:RUNNER_TEMP ('dnd-fl-kokoro-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          foreach($item in @('wrapper','caches')){
            $from=Join-Path $shared $item
            $to=Join-Path $isolated $item
            if((Test-Path $from)-and !(Test-Path $to)) {
              New-Item -ItemType Junction -Path $to -Target $from | Out-Null
            }
          }
          Add-Content $env:GITHUB_ENV ('GRADLE_USER_HOME='+$isolated)
      - name: Run chunker and footer tests
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --tests com.braseiro.dnd5e.Run245G13NarrationChunkerTest --tests com.braseiro.dnd5e.AudioStatusGateTest --no-daemon --console=plain
          $exit=$LASTEXITCODE
          $n=0;$f=0;$e=0;$s=0
          foreach($class in @('com.braseiro.dnd5e.Run245G13NarrationChunkerTest','com.braseiro.dnd5e.AudioStatusGateTest')){
            $file=Join-Path $dir ('TEST-'+$class+'.xml')
            if(!(Test-Path $file)){throw ('MISSING_XML='+$class)}
            [xml]$xml=Get-Content -LiteralPath $file -Raw
            $n += [int]$xml.testsuite.tests
            $f += [int]$xml.testsuite.failures
            $e += [int]$xml.testsuite.errors
            $s += [int]$xml.testsuite.skipped
            foreach($node in @($xml.SelectNodes('//testcase/failure | //testcase/error'))){
              Write-Host ('FAIL_CASE='+$node.ParentNode.GetAttribute('name'))
              Write-Host ('FAIL_REASON='+$node.GetAttribute('message'))
            }
          }
          Write-Host ('DND_FL_TTS_TARGET_TESTS='+$n+' FAIL='+$f+' ERR='+$e+' SKIP='+$s)
          if($exit -ne 0 -or $n -lt 9 -or $f -ne 0 -or $e -ne 0 -or $s -ne 0){throw 'FL_KOKORO_TARGETED_FAILED'}
      - name: Full Android unit regression, no APK
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain
          $exit=$LASTEXITCODE
          $files=@()
          if(Test-Path $dir){$files=@(Get-ChildItem -LiteralPath $dir -Filter 'TEST-*.xml' -File)}
          $n=0;$f=0;$e=0;$s=0
          foreach($file in $files){
            [xml]$xml=Get-Content -LiteralPath $file.FullName -Raw
            $n += [int]$xml.testsuite.tests
            $f += [int]$xml.testsuite.failures
            $e += [int]$xml.testsuite.errors
            $s += [int]$xml.testsuite.skipped
            foreach($node in @($xml.SelectNodes('//testcase/failure | //testcase/error'))){
              Write-Host ('FAIL_CASE='+$node.ParentNode.GetAttribute('classname')+'::'+$node.ParentNode.GetAttribute('name'))
              Write-Host ('FAIL_REASON='+$node.GetAttribute('message'))
            }
          }
          Write-Host ('DND_FL_TTS_FULL_TESTS='+$n+' FAIL='+$f+' ERR='+$e+' SKIP='+$s)
          if($exit -ne 0 -or $n -lt 2741 -or $f -ne 0 -or $e -ne 0 -or $s -ne 0){throw 'DND_FL_TTS_FULL_GATE_FAILED'}
          Write-Host 'KOKORO_FOOTER_ANDROID_TESTS=PASS'
          Write-Host 'A57_PHYSICAL_AUDIO_STABILITY=NOT_TESTED'
