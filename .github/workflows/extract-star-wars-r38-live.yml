name: Extract Star Wars R38 live repair snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-star-wars-r38-live.yml"
      - "star-wars/r38/SOURCE.json"
      - "STAR_WARS_R38_LIVE_REPAIR_TRIGGER.txt"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json',encoding='utf-8'))
          print('url='+d['source_share_url']); print('sha='+d['sha256']); print('file='+d['file'])
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact source
        env:
          SHARE_URL: ${{ steps.source.outputs.url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          rm -rf incoming work; mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['SOURCE_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True); page=b.new_page(accept_downloads=True)
            page.goto(os.environ['SHARE_URL'],wait_until='domcontentloaded',timeout=120000); page.wait_for_timeout(3500)
            for label in ['Accept','Aceitar','同意する','OK']:
              try:
                q=page.get_by_text(label,exact=True)
                if q.count() and q.first.is_visible(): q.first.click(timeout=1200)
              except: pass
            done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
              try:
                q=page.locator(sel).first
                if not q.count() or not q.is_visible(): continue
                with page.expect_download(timeout=120000) as info: q.click(timeout=10000)
                info.value.save_as(str(out)); done=True; break
              except: pass
            if not done:
              q=page.get_by_text(os.environ['SOURCE_FILE'],exact=False).first
              parent=q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
              with page.expect_download(timeout=120000) as info: parent.locator('a,button').last.click(timeout=10000)
              info.value.save_as(str(out)); done=True
            b.close()
          if not done: raise SystemExit('download failed')
          PY
          echo "${EXPECTED_SHA}  incoming/${SOURCE_FILE}" | sha256sum -c -
          unzip -q "incoming/${SOURCE_FILE}" -d work
      - name: Extract canonical repair targets and visual inventory
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find work -type f -name gradlew -not -path '*/build/*' | head -n1)"; ROOT="$(dirname "$GRADLEW")"
          OUT=star-wars/r38/live-snapshot
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp "$ROOT/app/src/main/assets/vtt/r46/final-runtime.js" "$OUT/final-runtime.js"
          cp "$ROOT/app/src/main/assets/vtt/r46/final-runtime.css" "$OUT/final-runtime.css" || true
          cp "$ROOT/app/src/main/assets/vtt/r46/globals.css" "$OUT/globals.css" || true
          cp "$ROOT/app/src/main/assets/vtt/r46/r46.css" "$OUT/r46.css"
          cp "$ROOT/app/src/main/assets/vtt/r46-shell.html" "$OUT/r46-shell.html"
          cp "$ROOT/app/src/main/assets/vtt/r46/r46-shell.bundle.js" "$OUT/r46-shell.bundle.js"
          cp "$ROOT/app/src/main/assets/vtt/js/library/sceneLibrary.mjs" "$OUT/sceneLibrary.mjs" || true
          cp "$ROOT/app/src/main/assets/vtt/image-library/manifest.json" "$OUT/image-manifest.json" || true
          cp "$ROOT/app/src/main/java/com/braseiro/starwarsedge/MainActivity.java" "$OUT/MainActivity.java"
          cp "$ROOT/app/src/main/java/com/braseiro/starwarsedge/GeminiBridge.java" "$OUT/GeminiBridge.java"
          cp "$ROOT/app/src/main/java/com/braseiro/starwarsedge/ImageLibraryBridge.java" "$OUT/ImageLibraryBridge.java"
          cp "$ROOT/app/src/main/AndroidManifest.xml" "$OUT/AndroidManifest.xml"
          find "$ROOT/app/src/main/assets/vtt" -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) | sed "s#^$ROOT/##" | sort > "$OUT/IMAGE_FILES.txt"
          python3 - <<'PY'
          import json,pathlib
          out=pathlib.Path('star-wars/r38/live-snapshot')
          data=json.loads((out/'image-manifest.json').read_text(encoding='utf-8')) if (out/'image-manifest.json').exists() else {}
          arr=data.get('assets',[]) if isinstance(data,dict) else []
          scene=[]
          for a in arr:
            if not isinstance(a,dict): continue
            blob=' '.join(str(a.get(k,'') or '') for k in ['assetId','title','category','subtype','usage','tags','localPath']).lower()
            if any(x in blob for x in ['scene','location','tatooine','cantina','hangar','spaceport','desert','street','interior','market','ship interior','dock','ruin']):
              scene.append(a)
          (out/'SCENE_ASSET_CANDIDATES.json').write_text(json.dumps(scene,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name braseiro-audit-bot
          git config user.email actions@users.noreply.github.com
          git add star-wars/r38/live-snapshot
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(star-wars): refresh canonical R38 repair snapshot'
          git push
