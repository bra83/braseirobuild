name: Build Braseiro Fichas Multissistema V4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/FICHAS_V4_TRIGGER"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar fontes web
        shell: bash
        run: |
          set -euo pipefail
          node --check android/fichas-multissistema/app/src/main/assets/www/app.js
          node --check android/fichas-multissistema/app/src/main/assets/www/rules-engine.js
          grep -q "Explorador':'Viajante" android/fichas-multissistema/app/src/main/assets/www/app.js
          grep -q "android:icon=\"@drawable/ic_launcher\"" android/fichas-multissistema/app/src/main/AndroidManifest.xml

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        working-directory: android/fichas-multissistema
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --stacktrace --no-daemon

      - name: Validar e empacotar
        id: out
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/android/fichas-multissistema"
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$GITHUB_WORKSPACE/build-artifacts/fichas-multissistema-v4"
          TMP="$RUNNER_TEMP/fichas-v4"
          mkdir -p "$OUT" "$TMP"
          test -f "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$TMP/aapt.txt"
          grep -q "package: name='com.braseiro.fichas' versionCode='2' versionName='1.0.1'" "$TMP/aapt.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$TMP/apksigner.txt"
          rm -rf "$ROOT/.gradle" "$ROOT/app/build" "$ROOT/build"
          (cd "$GITHUB_WORKSPACE/android" && zip -qr "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO_V4.zip" fichas-multissistema)
          cp "$APK" "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.1-debug.apk"
          sha256sum "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO_V4.zip" > "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO_V4.zip.sha256"
          sha256sum "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.1-debug.apk" > "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.1-debug.apk.sha256"
          {
            echo "BRASEIRO FICHAS MULTISSISTEMA V4"
            echo "applicationId=com.braseiro.fichas"
            echo "versionName=1.0.1"
            echo "versionCode=2"
            echo "UI: seletores Star Wars + ajuda contextual + derivados EotE"
            echo "launcher_icon=drawable/ic_launcher"
            echo
            echo "--- AAPT ---"
            cat "$TMP/aapt.txt"
            echo
            echo "--- APKSIGNER ---"
            cat "$TMP/apksigner.txt"
          } > "$OUT/VALIDACAO_ANDROID_V4.txt"
          echo "apk_sha=$(sha256sum "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.1-debug.apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publicar artefatos no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-artifacts/fichas-multissistema-v4
          if ! git diff --cached --quiet; then
            git commit -m "Build Braseiro Fichas Multissistema V4 Android"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: braseiro-fichas-multissistema-v4
          path: build-artifacts/fichas-multissistema-v4
          if-no-files-found: error
          retention-days: 30

      - name: Resumo
        shell: bash
        run: |
          echo "## Braseiro Fichas Multissistema V4" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK 1.0.1 compilado e assinado em debug" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ícone launcher profissional aplicado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seletores e ajuda contextual de EotE aplicados" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: ${{ steps.out.outputs.apk_sha }}" >> "$GITHUB_STEP_SUMMARY"
