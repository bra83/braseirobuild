name: Build Mausritter R25 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mausritter-r25-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      TAG: mausritter-6.1.0-r25
      SOURCE_NAME: Mausritter_Mestre_Vivo_6.1.0-r25_TTS_KOKORO_ANDROID_STUDIO.zip
      SOURCE_SHA256: eff615ac96ad77449c27e04778d732fc20cd039b767ff92310ebd23d9841e8df
      APK_NAME: Mausritter_Mestre_Vivo_6.1.0-r25_TTS_KOKORO_DEBUG.apk

    steps:
      - name: Confirm BRELGA
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA; got $env:RUNNER_NAME" }
          Write-Host "Runner=$env:RUNNER_NAME"

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $candidates += 'C:\Android\Sdk'
          $sdkRoot = $null
          $sdkmanager = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ([string]::IsNullOrWhiteSpace($candidate) -or -not (Test-Path $candidate)) { continue }
            $found = Get-ChildItem $candidate -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $sdkRoot = $candidate
              $sdkmanager = $found.FullName
              break
            }
          }
          if (-not $sdkmanager) { throw 'Android SDK/sdkmanager not found on BRELGA' }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path $sdkmanager) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $sdkRoot 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $sdkmanager --version
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager validation failed' }
          1..100 | ForEach-Object { 'y' } | & $sdkmanager --licenses | Out-Null
          & $sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package install failed' }

      - name: Download exact R25 source
        id: source
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-brelga'
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG"
          $asset = @($release.assets | Where-Object { $_.name -eq $env:SOURCE_NAME -and $_.state -eq 'uploaded' })
          if ($asset.Count -ne 1) { throw "Expected one source ZIP; found $($asset.Count)" }
          $dir = Join-Path $env:RUNNER_TEMP 'mausritter-r25-source'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip = Join-Path $dir $env:SOURCE_NAME
          & curl.exe -L --fail --retry 5 --retry-delay 3 --retry-all-errors -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" -o $zip $asset[0].url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) { throw 'Source ZIP download failed' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SOURCE_SHA256) { throw "Source SHA256 mismatch: $hash" }
          if ((Get-Item $zip).Length -ne 200751826) { throw "Unexpected source size" }
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "SOURCE_PASS SHA256=$hash"

      - name: Extract Android project
        id: project
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'mausritter-r25-work'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          & tar.exe -xf $env:SOURCE_ZIP -C $work
          if ($LASTEXITCODE -ne 0) { throw 'ZIP extraction failed' }
          $settings = Get-ChildItem $work -Recurse -File -Filter 'settings.gradle.kts' | Where-Object {
            (Test-Path (Join-Path $_.Directory.FullName 'gradlew.bat')) -and
            (Test-Path (Join-Path $_.Directory.FullName 'gradle\wrapper\gradle-wrapper.jar')) -and
            (Test-Path (Join-Path $_.Directory.FullName 'app\src\main\AndroidManifest.xml'))
          } | Select-Object -First 1
          if (-not $settings) { throw 'Complete Android project not found' }
          $root = $settings.Directory.FullName
          if (-not (Test-Path (Join-Path $root '..\version.properties'))) { throw 'version.properties missing' }
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ANDROID_ROOT=$root"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.root }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          $log = Join-Path $env:RUNNER_TEMP 'MAUSRITTER_R25_GRADLE_BUILD.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          & .\gradlew.bat --version --no-daemon 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Gradle wrapper validation failed: $LASTEXITCODE" }
          & .\gradlew.bat clean assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "assembleDebug failed: $LASTEXITCODE" }

      - name: Validate APK
        id: apk
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Get-ChildItem $env:ROOT -Recurse -File -Filter '*.apk' | Where-Object { $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]' } | Sort-Object FullName | Select-Object -First 1
          if (-not $apk) { throw 'Debug APK not found' }
          $out = Join-Path $env:RUNNER_TEMP 'mausritter-r25-apk'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $dest = Join-Path $out $env:APK_NAME
          Copy-Item $apk.FullName $dest -Force

          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object { [version]($_.Name -replace '[^0-9.]','') } -Descending | Select-Object -First 1
          $aapt = Join-Path $buildTools.FullName 'aapt.exe'
          $signer = Join-Path $buildTools.FullName 'apksigner.bat'
          if (-not (Test-Path $aapt) -or -not (Test-Path $signer)) { throw 'Android validation tools missing' }

          $badging = Join-Path $out 'MAUSRITTER_R25_APK_BADGING.txt'
          & $aapt dump badging $dest 2>&1 | Tee-Object -FilePath $badging
          if ($LASTEXITCODE -ne 0) { throw 'aapt validation failed' }
          $badge = Get-Content $badging -Raw
          if ($badge -notmatch "package: name='com\.braseiro\.mausritter\.mestrevivo'") { throw 'Unexpected applicationId' }
          if ($badge -notmatch "versionCode='610025'") { throw 'Unexpected versionCode' }
          if ($badge -notmatch "versionName='6\.1\.0-mausritter\.25-debug'") { throw 'Unexpected versionName' }

          $sig = Join-Path $out 'MAUSRITTER_R25_APK_SIGNATURE.txt'
          & $signer verify --verbose --print-certs $dest 2>&1 | Tee-Object -FilePath $sig
          if ($LASTEXITCODE -ne 0) { throw 'APK signature validation failed' }

          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content -Path "$dest.sha256" -Encoding ascii
          $log = Join-Path $env:RUNNER_TEMP 'MAUSRITTER_R25_GRADLE_BUILD.log'
          if (Test-Path $log) { Copy-Item $log (Join-Path $out 'MAUSRITTER_R25_GRADLE_BUILD.log') -Force }
          Write-Host "APK_PASS BYTES=$((Get-Item $dest).Length) SHA256=$hash"
          "dir=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attach verified APK to release
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.source.outputs.release_id }}
          OUT_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-brelga'
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID"
          foreach ($file in (Get-ChildItem $env:OUT_DIR -File)) {
            $existing = $release.assets | Where-Object { $_.name -eq $file.Name } | Select-Object -First 1
            if ($existing) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" | Out-Null }
            $encoded = [uri]::EscapeDataString($file.Name)
            $upload = "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$encoded"
            & curl.exe -L --fail --retry 5 --retry-delay 3 --retry-all-errors --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$($file.FullName)" $upload
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed: $($file.Name)" }
          }
