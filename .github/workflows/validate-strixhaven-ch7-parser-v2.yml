name: Validate Strixhaven Ch7 Parser V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-strixhaven-ch7-parser-v2.yml']
  workflow_dispatch:
jobs:
  parse:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse 44 canonical statblocks
        shell: powershell
        run: |
          @'
          import re,json,unicodedata,os
          from pathlib import Path
          p=Path(os.environ["GITHUB_WORKSPACE"])/"ci"/"dnd-run184"/"strixhaven_ch7_runtime_source.txt"
          text=p.read_text(encoding="utf-8").replace("\x02","")
          lines=text.splitlines()
          entries=[
          ("Archaic","Celestial","18",["Archaic"]),("Art Elemental Mascot","Elemental","1/4",["Art Elemental Mascot"]),
          ("Beledros Witherbloom","Dragon","24",["Beledros Witherbloom"]),("Brackish Trudge","Plant","3",["Brackish Trudge"]),
          ("Cogwork Archivist","Construct","4",["Cogwork Archivist"]),("Daemogoth","Fiend","10",["Daemogoth"]),("Daemogoth Titan","Fiend","16",["Daemogoth Titan"]),
          ("First-Year Student","Humanoid","1/2",["First-Year Student"]),("Fractal Mascot","Construct","1/4",["Fractal Mascot"]),
          ("Galazeth Prismari","Dragon","23",["Galazeth Prismari"]),("Groff","Plant","4",["Groff"]),("Inkling Mascot","Ooze","1/4",["Inkling Mascot"]),
          ("Lorehold Apprentice","Humanoid","2",["Lorehold Apprentice"]),("Lorehold Pledgemage","Humanoid","4",["Lorehold Pledgemage"]),
          ("Lorehold Professor of Chaos","Humanoid","7",["Lorehold Professor of Chaos","Lorehold Prof. of Chaos","Lorehold Prof, of Chaos"]),
          ("Lorehold Professor of Order","Humanoid","7",["Lorehold Professor of Order","Lorehold Prof. of Order","Lorehold Prof, of Order"]),
          ("Mage Hunter","Monstrosity","5",["Mage Hunter"]),("Oracle of Strixhaven","Humanoid","15",["Oracle of Strixhaven"]),
          ("Oriq Blood Mage","Humanoid","9",["Oriq Blood Mage"]),("Oriq Recruiter","Humanoid","4",["Oriq Recruiter"]),("Pest Mascot","Monstrosity","1/4",["Pest Mascot"]),
          ("Prismari Apprentice","Humanoid","2",["Prismari Apprentice"]),("Prismari Pledgemage","Humanoid","4",["Prismari Pledgemage"]),
          ("Prismari Professor of Expression","Humanoid","7",["Prismari Professor of Expression","Prismari Prof. of Expression","Prismari Prof, of Expression"]),
          ("Prismari Professor of Perfection","Humanoid","7",["Prismari Professor of Perfection","Prismari Prof. of Perfection","Prismari Prof, of Perfection","Prismari Prqfessor of Perfection"]),
          ("Quandrix Apprentice","Humanoid","2",["Quandrix Apprentice"]),("Quandrix Pledgemage","Humanoid","4",["Quandrix Pledgemage"]),
          ("Quandrix Professor of Substance","Humanoid","7",["Quandrix Professor of Substance","Quandrix Prof. of Substance","Quandrix Prof, of Substance"]),
          ("Quandrix Professor of Theory","Humanoid","7",["Quandrix Professor of Theory","Quandrix Prof. of Theory","Quandrix Prof, ofTheory"]),
          ("Relic Sloth","Beast","2",["Relic Sloth"]),("Ruin Grinder","Construct","5",["Ruin Grinder"]),("Shadrix Silverquill","Dragon","22",["Shadrix Silverquill"]),
          ("Silverquill Apprentice","Humanoid","2",["Silverquill Apprentice"]),("Silverquill Pledgemage","Humanoid","4",["Silverquill Pledgemage"]),
          ("Silverquill Professor of Radiance","Humanoid","7",["Silverquill Professor of Radiance","Silverquill Prof. of Radiance","Silverquill Prof, of Radiance"]),
          ("Silverquill Professor of Shadow","Humanoid","7",["Silverquill Professor of Shadow","Silverquill Prof. of Shadow","Silverquill Prof, of Shadow"]),
          ("Spirit Statue Mascot","Construct","1/4",["Spirit Statue Mascot"]),("Strixhaven Campus Guide","Construct","1",["Strixhaven Campus Guide"]),
          ("Tanazir Quandrix","Dragon","24",["Tanazir Quandrix"]),("Velomachus Lorehold","Dragon","25",["Velomachus Lorehold"]),
          ("Witherbloom Apprentice","Humanoid","2",["Witherbloom Apprentice"]),("Witherbloom Pledgemage","Humanoid","4",["Witherbloom Pledgemage"]),
          ("Witherbloom Professor of Decay","Humanoid","7",["Witherbloom Professor of Decay","Witherbloom Prof. of Decay","Witherbloom Prof, of Decay"]),
          ("Witherbloom Professor of Growth","Humanoid","7",["Witherbloom Professor of Growth","Witherbloom Prof. of Growth","Witherbloom Prof, of Growth"])]
          def norm(s):
              return ''.join(c for c in unicodedata.normalize('NFD',s.lower()) if unicodedata.category(c)!='Mn').replace('’',"'").replace('“','"').replace('”','"').strip()
          size=re.compile(r'\b(Tiny|Small|Medium|Large|Huge|Gargantuan)\b',re.I)
          def expected_cr_re(cr):
              return re.compile(r'Challenge\s+'+re.escape(cr)+r'(?=\s|\(|$)',re.I)
          def all_heading_lines(aliases):
              aa={norm(a) for a in aliases};return [i for i,line in enumerate(lines) if norm(line) in aa]
          def parse_one(name,typ,cr,aliases):
              heads=all_heading_lines(aliases); best=None
              for h in heads:
                  lo=max(0,h-140); hi=min(len(lines),h+180)
                  for j in range(lo,hi):
                      if not expected_cr_re(cr).search(lines[j]): continue
                      # Statblock identity must also have size/type nearby.
                      tlo=max(lo,min(h,j)-55);thi=min(hi,max(h,j)+70)
                      local=" ".join(lines[tlo:thi])
                      type_bonus=20 if typ.lower() in local.lower() else 0
                      size_bonus=12 if size.search(local) else 0
                      dist=abs(j-h)
                      score=200-dist+type_bonus+size_bonus
                      if best is None or score>best[0]:best=(score,h,j,tlo,thi)
              if best is None:
                  return {"name":name,"ok":False,"reason":"no expected challenge cluster","heads":heads}
              _,h,ch,lo,hi=best
              # nearest AC/HP around the exact expected CR cluster
              acs=[];hps=[]
              for i in range(max(0,ch-75),min(len(lines),ch+75)):
                  ma=re.search(r'Armor Class\s+(\d+)',lines[i],re.I)
                  mh=re.search(r'Hit Points\s+(\d+)',lines[i],re.I)
                  if ma: acs.append((abs(i-ch),i,ma.group(1)))
                  if mh: hps.append((abs(i-ch),i,mh.group(1)))
              ac=min(acs)[2] if acs else None; hp=min(hps)[2] if hps else None
              # broad source scope around heading+cluster; full original mechanics remain embedded.
              blo=max(0,min(h,ch)-90);bhi=min(len(lines),max(h,ch)+140)
              block="\n".join(lines[blo:bhi])
              acts=re.findall(r"(?m)^([A-Z][^\n.]{1,80}(?:\s*\([^\n]{1,30}\))?)\.\s+(?:(?:Melee|Ranged|Melee or Ranged) (?:Weapon|Spell) Attack:|[^\n]{0,180}\b(?:must make|must succeed|targets? one|casts? one))",block)
              # de-duplicate, preserving order
              seen=set();acts2=[]
              for a in acts:
                  k=norm(a)
                  if k in seen:continue
                  seen.add(k);acts2.append(a)
              return {"name":name,"heading_line":h+1,"challenge_line":ch+1,"ac":ac,"hp":hp,"cr":cr,"actions":acts2[:24],"action_count":len(acts2),"source_lines":bhi-blo,"ok":bool(ac and hp)}
          results=[parse_one(*e) for e in entries]
          print(json.dumps(results,ensure_ascii=False,indent=2))
          bad=[r for r in results if not r["ok"]]
          print("BAD_COUNT",len(bad))
          if bad: print("BAD",json.dumps(bad,ensure_ascii=False))
          '@ | python -
