name: PF2 R31 Integrated Final
# rerun-after-focused-test-fix

on:
  push:
    branches:
      - audit-pf2-kingmaker-r30-20260928
    paths:
      - '.github/workflows/build-pf2-r31-integrated-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pf2-r31-integrated-final
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  BASE_RAR_BYTES: '553809972'
  PROFILE_SHA: '8e63dbdf963abd1bed88e7173de3adc22d1501557647bcf4a9d95ee096f75852'
  RELEASE_TAG: 'PATHFINDER2E-9.0.32-R31-INTEGRATED'

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-pf2-kingmaker-r30-20260928

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact post-Antigravity R30
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Expected BRELGA, got $env:RUNNER_NAME"}
          $root=Join-Path $env:RUNNER_TEMP 'pf2-r31-integrated-final'
          $extract=Join-Path $root 'extracted'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          $rar=Join-Path $root 'pf2e_r30_work.rar'
          & curl.exe -L --fail --retry 5 --retry-delay 3 "https://drive.usercontent.google.com/download?id=1UbJq8m518f1jIQkkXASvEp0j0Uf6qNkR&export=download&confirm=t" -o $rar
          if($LASTEXITCODE -ne 0){throw 'R30 download failed'}
          $size=(Get-Item $rar).Length
          if($size -ne [int64]$env:BASE_RAR_BYTES){throw "R30 size mismatch: $size"}
          $candidates=@(
            'C:\Program Files\7-Zip\7z.exe',
            'C:\Program Files (x86)\7-Zip\7z.exe',
            'C:\Program Files\WinRAR\UnRAR.exe',
            'C:\Program Files\WinRAR\WinRAR.exe'
          )
          $tool=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if(-not $tool){throw 'RAR extractor missing'}
          Write-Host "EXTRACTOR=$tool"
          if($tool.EndsWith('7z.exe')){
            & $tool x -y $rar "-o$extract"
          } elseif($tool.EndsWith('UnRAR.exe')){
            & $tool x -y $rar ($extract + '\')
          } else {
            & $tool x -ibck -y $rar ($extract + '\')
          }
          if($LASTEXITCODE -ne 0){throw "RAR extraction failed: $LASTEXITCODE"}
          $work=Join-Path $extract 'pf2e_r30_work'
          if(-not(Test-Path (Join-Path $work 'version.properties'))){throw 'Extracted R30 root invalid'}
          "WORK_ROOT=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Overlay integrated changes from audited live snapshot
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'ci\pf2-r30-live-src'
          $files=@(
            'android\app\src\main\java\com\braseiro\pathfinder2e\AppDb.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\PartyDirector.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\MasterOrchestrator.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\MainActivity.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerRulesEngine.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\HumanMasterNarrativeProfile.java',
            'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerTurnGuide.java',
            'tests_pf2\test_r30_user_requested_integrated_features.py',
            'tests_pf2\java\KingmakerTurnGuideRulesHarness.java'
          )
          foreach($rel in $files){
            $from=Join-Path $src $rel
            if(-not(Test-Path $from)){throw "Missing overlay: $rel"}
            $to=Join-Path $env:WORK_ROOT $rel
            New-Item -ItemType Directory -Path (Split-Path $to -Parent) -Force | Out-Null
            Copy-Item $from $to -Force
          }

      - name: Install exact narrator profile asset
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $api='https://api.firestorage.ai/dev/file'
          $meta=Invoke-RestMethod -Method Post -Uri ($api + '/shares/IM06JvSMi__O/files/01a0e9c57217770f9cea2b07d72bdf47/download')
          if(-not $meta.downloadUrl){throw 'Narrator profile download URL missing'}
          $tmp=Join-Path $env:RUNNER_TEMP 'PERFIL_TECNICO_MESTRE_HUMANO_IMERSIVO_VTT.md'
          Invoke-WebRequest -Uri $meta.downloadUrl -OutFile $tmp
          $sha=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $env:PROFILE_SHA){throw "Narrator profile SHA mismatch: $sha"}
          $dest=Join-Path $env:WORK_ROOT 'android\app\src\main\assets\narrative'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item $tmp (Join-Path $dest 'PERFIL_TECNICO_MESTRE_HUMANO_IMERSIVO_VTT.md') -Force

      - name: Set version 9.0.32 R31
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $vp=Get-Content 'version.properties' -Raw
          $vp=[regex]::Replace($vp,'VERSION_NAME=\d+\.\d+\.\d+','VERSION_NAME=9.0.32')
          $vp=[regex]::Replace($vp,'VERSION_CODE=\d+','VERSION_CODE=90032')
          Set-Content 'version.properties' $vp -Encoding ascii

      - name: Focused integration tests
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -q pytest
          python -m pytest tests_pf2\test_r30_user_requested_integrated_features.py -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R31_FOCUSED.log"
          if($LASTEXITCODE -ne 0){throw 'Focused tests failed'}

      - name: All Kingmaker suites
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $tests=Get-ChildItem tests_pf2 -File -Filter 'test_kingmaker*.py' | Sort-Object Name | ForEach-Object {$_.FullName}
          python -m pytest @tests -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R31_KINGMAKER.log"
          if($LASTEXITCODE -ne 0){throw 'Kingmaker regression failed'}

      - name: Full PF2 regression
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          python -m pytest tests_pf2 -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R31_FULL.log"
          if($LASTEXITCODE -ne 0){throw 'Full PF2 regression failed'}

      - name: Integration gates
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $main=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\MainActivity.java' -Raw
          $party=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\PartyDirector.java' -Raw
          $orch=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\MasterOrchestrator.java' -Raw
          $guide=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerTurnGuide.java' -Raw
          $rules=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerRulesEngine.java' -Raw
          $profile=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\HumanMasterNarrativeProfile.java' -Raw
          $checks=@{}
          $checks['player-master-ui']=$main.Contains('Jogador — eu controlo') -and $main.Contains('Mestre — Barbara controla')
          $checks['gm-policy-runtime']=$orch.Contains('party.hasGmControlledHeroes()') -and $orch.Contains('party_control_policy')
          $checks['pf2-authority']=$party.Contains('pending_test/combat/transação estruturada')
          $checks['guide-rules']=$guide.Contains('rules.activityGuideCatalog()') -and $guide.Contains('rules.turnProcedureGuide()')
          $checks['guide-state']=$guide.Contains('repository.activeTurn()') -and $guide.Contains('repository.vacantLeadershipRoles()')
          $checks['guide-ui']=$main.Contains('ⓘ GUIA COMPLETO DO TURNO')
          $checks['narrator-runtime']=$orch.Contains('human_master_narrative_direction') -and $profile.Contains('DIRECAO_NARRATIVA')
          $checks['narrator-source']=$profile.Contains('PERFIL_TECNICO_MESTRE_HUMANO_IMERSIVO_VTT.md')
          $checks['guide-authority']=$rules.Contains('KingmakerRepository.resolveKingdomActivity')
          $log=Join-Path $env:RUNNER_TEMP 'PF2_R31_GATES.log'
          foreach($pair in $checks.GetEnumerator()|Sort-Object Name){
            $status=if($pair.Value){'PASS'}else{'FAIL'}
            ($status + ' - ' + $pair.Name) | Tee-Object -FilePath $log -Append
          }
          if(@($checks.GetEnumerator()|Where-Object{-not $_.Value}).Count -gt 0){throw 'Integration gate failed'}
          "GATES_LOG=$log" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME)
          if($env:LOCALAPPDATA){$candidates+=(Join-Path $env:LOCALAPPDATA 'Android\Sdk')}
          $sdk=$null
          $mgr=$null
          foreach($candidate in ($candidates|Where-Object{$_}|Select-Object -Unique)){
            if(Test-Path $candidate){
              $found=Get-ChildItem $candidate -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue|Select-Object -First 1
              if($found){$sdk=$candidate;$mgr=$found.FullName;break}
            }
          }
          if(-not $mgr){throw 'Android SDK not found'}
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          1..100|ForEach-Object{'y'}|& $mgr --licenses|Out-Null
          & $mgr 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          if($LASTEXITCODE -ne 0){throw 'sdkmanager failed'}

      - name: Build APK
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}\android
        run: |
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R31_GRADLE.log"
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($code -ne 0){throw "Gradle failed: $code"}

      - name: Package outputs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'pf2-r31-final-out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apk=Get-ChildItem $env:WORK_ROOT -Recurse -Filter '*.apk' -File | Where-Object {$_.FullName.Contains('\build\outputs\apk\debug\')} | Select-Object -First 1
          if(-not $apk){throw 'APK missing'}
          $apkOut=Join-Path $out 'Braseiro_Pathfinder2e_9.0.32_R31_INTEGRATED_DEBUG.apk'
          Copy-Item $apk.FullName $apkOut -Force
          (Get-FileHash $apkOut -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content ($apkOut + '.sha256') -Encoding ascii
          @(
            '# VALIDAÇÃO R31 INTEGRATED',
            'Baseline: R30 pós-Antigravity exato.',
            'Controle JOGADOR/MESTRE integrado ao character_control_profiles e ao PartyDirector.',
            'Guia completo do Turno lê KingmakerRulesEngine + KingmakerRepository.',
            'Perfil Mestre Humano Imersivo integrado ao MasterOrchestrator como DIREÇÃO NARRATIVA.',
            'Teste focado: PASS.',
            'Kingmaker: PASS.',
            'PF2 completo: PASS.',
            'Gradle assembleDebug: PASS.'
          ) | Set-Content (Join-Path $out 'VALIDACAO_R31_INTEGRATED_FIXES.md') -Encoding utf8
          @(
            'AppDb.java',
            'PartyDirector.java',
            'MasterOrchestrator.java',
            'MainActivity.java',
            'KingmakerRulesEngine.java',
            'HumanMasterNarrativeProfile.java',
            'KingmakerTurnGuide.java',
            'PERFIL_TECNICO_MESTRE_HUMANO_IMERSIVO_VTT.md',
            'test_r30_user_requested_integrated_features.py',
            'KingmakerTurnGuideRulesHarness.java',
            'version.properties'
          ) | Set-Content (Join-Path $out 'CHANGED_FILES_R31_INTEGRATED_FIXES.txt') -Encoding utf8
          Copy-Item "$env:RUNNER_TEMP\PF2_R31_FOCUSED.log" (Join-Path $out 'FOCUSED_TESTS.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R31_KINGMAKER.log" (Join-Path $out 'KINGMAKER_TESTS.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R31_FULL.log" (Join-Path $out 'PF2_FULL_TESTS.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R31_GRADLE.log" (Join-Path $out 'GRADLE_BUILD.log')
          Copy-Item $env:GATES_LOG (Join-Path $out 'INTEGRATION_GATES.log')
          @(
            '# HANDOFF R31 INTEGRATED',
            'Base: R30 pós-Antigravity.',
            'Não reaplicar R29/R30 antigo.',
            'Controle por personagem: player/gm no estado persistente já existente.',
            'Guia do Reino: KingmakerTurnGuide + metadados no KingmakerRulesEngine.',
            'Narrativa: HumanMasterNarrativeProfile inserido no MasterOrchestrator.'
          ) | Set-Content (Join-Path $out 'HANDOFF_R31_INTEGRATED_FIXES.md') -Encoding utf8
          Remove-Item (Join-Path $env:WORK_ROOT 'android\app\build') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:WORK_ROOT 'android\.gradle') -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $env:WORK_ROOT -Directory -Filter 'build_test_classes*' | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $zip=Join-Path $out 'BRASEIRO_PATHFINDER2E_9.0.32_R31_INTEGRATED_ANDROID_STUDIO.zip'
          tar.exe -a -c -f $zip -C $env:WORK_ROOT .
          if($LASTEXITCODE -ne 0){throw 'Source ZIP failed'}
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content ($zip + '.sha256') -Encoding ascii
          "OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish validated release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag=$env:RELEASE_TAG
          $headers=@{}
          $headers['Authorization']='Bearer ' + $env:GITHUB_TOKEN
          $headers['Accept']='application/vnd.github+json'
          $headers['X-GitHub-Api-Version']='2022-11-28'
          $headers['User-Agent']='BRELGA-PF2-INTEGRATED'
          try{
            $release=Invoke-RestMethod -Headers $headers -Uri ('https://api.github.com/repos/' + $repo + '/releases/tags/' + $tag)
          }catch{
            $body=@{}
            $body['tag_name']=$tag
            $body['target_commitish']='audit-pf2-kingmaker-r30-20260928'
            $body['name']='Braseiro Pathfinder 2e 9.0.32 R31 - Controle + Guia + Narrador'
            $body['body']='R31 validado sobre o R30 pós-Antigravity. Controle JOGADOR/MESTRE por personagem, Guia completo do Turno do Reino ligado ao motor e Perfil Mestre Humano Imersivo como Direção Narrativa. Inclui source, APK e logs.'
            $body['draft']=$false
            $body['prerelease']=$false
            $json=$body|ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $json -Uri ('https://api.github.com/repos/' + $repo + '/releases')
          }
          foreach($file in Get-ChildItem $env:OUT_DIR -File){
            $existing=$release.assets|Where-Object{$_.name -eq $file.Name}|Select-Object -First 1
            if($existing){Invoke-RestMethod -Method Delete -Headers $headers -Uri ('https://api.github.com/repos/' + $repo + '/releases/assets/' + $existing.id)|Out-Null}
            $encoded=[uri]::EscapeDataString($file.Name)
            $upload='https://uploads.github.com/repos/' + $repo + '/releases/' + $release.id + '/assets?name=' + $encoded
            & curl.exe -L --fail --retry 5 --retry-delay 2 --request POST --header ("Authorization: Bearer " + $env:GITHUB_TOKEN) --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' --header 'Content-Type: application/octet-stream' --data-binary ("@" + $file.FullName) $upload
            if($LASTEXITCODE -ne 0){throw "Upload failed: $($file.Name)"}
          }
          Write-Host ('RELEASE_URL=' + $release.html_url)
