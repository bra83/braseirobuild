name: O Um Anel 4.9.3 Immersive Layout Hotfix Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oua-4.9.3-release-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: 'OUA-v4.9.3-test'
  APK_NAME: 'BRASEIRO_O_UM_ANEL_4.9.3_IMMERSIVE_LAYOUT_HOTFIX_DEBUG.apk'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve 4.9.2 source URL
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="$(python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('.github/workflows/build-oua-4.9.2-release.yml').read_text(encoding='utf-8')
          m=re.search(r"(?m)^\s*SOURCE_URL:\s*'([^']+)'\s*$", s)
          if not m: raise SystemExit('SOURCE_URL not found')
          print(m.group(1))
          PY
          )"
          echo "SOURCE_URL=$SOURCE_URL" >> "$GITHUB_ENV"

      - name: Download exact 4.9.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work out
          curl -fL --retry 5 --retry-delay 3 "$SOURCE_URL" -o incoming/source.zip
          unzip -t incoming/source.zip >/dev/null
          sha256sum incoming/source.zip | tee out/SOURCE_4.9.2_SHA256.txt

      - name: Extract project
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/incoming/source.zip"
          ANDROID_ROOT=""
          PROJECT_ROOT=""
          for N in 1 2 3; do
            DEST="$GITHUB_WORKSPACE/work/layer$N"
            mkdir -p "$DEST"
            unzip -q "$SRC" -d "$DEST"
            WRAPPER="$(find "$DEST" -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | head -n1 || true)"
            if [ -n "$WRAPPER" ]; then
              ANDROID_ROOT="$(dirname "$WRAPPER")"
              PROJECT_ROOT="$(dirname "$ANDROID_ROOT")"
              break
            fi
            NEXT="$(find "$DEST" -type f -name '*.zip' | head -n1 || true)"
            [ -n "$NEXT" ] || { echo '::error::Android Gradle project not found'; exit 1; }
            SRC="$NEXT"
          done
          test -n "$ANDROID_ROOT"
          test -f "$PROJECT_ROOT/App.tsx"
          test -f "$PROJECT_ROOT/components/immersive/ImmersiveJourneyView.tsx"
          echo "android_root=$ANDROID_ROOT" >> "$GITHUB_OUTPUT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Apply 4.9.3 immersive-layout hotfix
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['PROJECT_ROOT'])

          def replace(path, old, new, count=1):
              p=root/path
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {n}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          replace(Path('lib/version.ts'), "export const APP_VERSION = '4.9.2';\nexport const APP_VERSION_CODE = 49002;", "export const APP_VERSION = '4.9.3';\nexport const APP_VERSION_CODE = 49003;")
          replace(Path('package.json'), '"version": "4.9.2"', '"version": "4.9.3"')
          replace(Path('android/app/build.gradle.kts'), 'versionCode = 49002\n        versionName = "4.9.2"', 'versionCode = 49003\n        versionName = "4.9.3"')
          replace(Path('android/app/src/main/java/com/braseiro/oumanel/MainActivity.kt'), 'index.html?v=49002&immersive=1', 'index.html?v=49003&immersive=1', 2)

          view=Path('components/immersive/ImmersiveJourneyView.tsx')
          replace(view,
            'return <section className="relative h-[100dvh] w-full overflow-hidden bg-transparent font-serif text-[#ead9b7]">\n    <div className="absolute inset-0 z-0 bg-[#100d09]">',
            'return <section className="relative w-full overflow-hidden font-serif" style={{ height: \'100dvh\', minHeight: \'100dvh\', background: \'#100d09\', color: \'#ead9b7\' }} data-braseiro-immersive-root="true">\n    <div className="absolute inset-0 z-0" style={{ background: \'#100d09\' }}>')

          replace(view,
            '<header className="pointer-events-none absolute inset-x-0 top-0 z-[60] px-3 pt-[max(8px,env(safe-area-inset-top))] [text-shadow:0_2px_5px_rgba(0,0,0,.9)]">',
            '<header className="pointer-events-none absolute inset-x-0 top-0 px-3" style={{ zIndex: 60, paddingTop: \'max(8px, env(safe-area-inset-top))\', textShadow: \'0 2px 5px rgba(0,0,0,.9)\' }}>')

          replace(view,
            '<div className="absolute inset-x-[3.5%] bottom-[calc(76px+env(safe-area-inset-bottom,0px))] z-[70] max-h-[56dvh]">\n      <form onSubmit={event => props.onCustomActionSubmit(event, false)} className="relative flex max-h-[56dvh] flex-col px-[7%] pb-5 pt-10 text-[#2d2116]">',
            '<div className="absolute" style={{ left: \'3.5%\', right: \'3.5%\', bottom: \'calc(76px + env(safe-area-inset-bottom, 0px))\', zIndex: 70, maxHeight: \'56dvh\' }}>\n      <form onSubmit={event => props.onCustomActionSubmit(event, false)} className="relative flex flex-col pb-5 pt-10" style={{ maxHeight: \'56dvh\', paddingLeft: \'7%\', paddingRight: \'7%\', color: \'#2d2116\' }}>')

          p=root/view
          s=p.read_text(encoding='utf-8')
          old='{moreOpen&&<div className="absolute bottom-[calc(76px+env(safe-area-inset-bottom,0px))] left-3 right-3 z-[85] rounded-xl border border-[#7b6547]/70 bg-[#16100a]/95 p-2 shadow-2xl backdrop-blur-sm">'
          new='{moreOpen&&<div className="absolute left-3 right-3 rounded-xl p-2 shadow-2xl backdrop-blur-sm" style={{ bottom: \'calc(76px + env(safe-area-inset-bottom, 0px))\', zIndex: 85, border: \'1px solid rgba(123,101,71,.7)\', background: \'rgba(22,16,10,.95)\' }}>'
          if old not in s: raise SystemExit('more panel pattern not found')
          s=s.replace(old,new,1)
          old='<nav className="absolute inset-x-0 bottom-0 z-[90] min-h-[72px] px-2 pb-[max(6px,env(safe-area-inset-bottom))] pt-1">'
          new='<nav className="absolute inset-x-0 bottom-0 px-2 pt-1" style={{ zIndex: 90, minHeight: \'72px\', paddingBottom: \'max(6px, env(safe-area-inset-bottom))\' }}>'
          if old not in s: raise SystemExit('nav pattern not found')
          s=s.replace(old,new,1)
          s=s.replace('<div className="relative z-[1] grid min-h-[64px] grid-cols-5 items-stretch gap-1">','<div className="relative grid grid-cols-5 items-stretch gap-1" style={{ zIndex: 1, minHeight: \'64px\' }}>',1)
          p.write_text(s,encoding='utf-8')

          replace(Path('components/immersive/PartyCluster.tsx'),
            'className="pointer-events-none absolute left-1/2 top-[46%] z-[40] h-[142px] w-[166px] -translate-x-1/2 -translate-y-1/2"',
            'className="pointer-events-none absolute left-1/2 -translate-x-1/2 -translate-y-1/2" style={{ top: \'46%\', zIndex: 40, height: \'142px\', width: \'166px\' }}')

          app=Path('App.tsx')
          marker="""      markBootStage('ui:first-paint');
              window.clearTimeout(bootWatchdog);"""
          guard="""      markBootStage('ui:first-paint');
              const immersiveRoot = document.querySelector<HTMLElement>('[data-braseiro-immersive-root="true"]');
              if (immersiveRoot) {
                const rect = immersiveRoot.getBoundingClientRect();
                const minimumVisibleHeight = Math.min(320, Math.max(180, window.innerHeight * 0.45));
                if (rect.height < minimumVisibleHeight) {
                  console.error(`[BRASEIRO_BOOT_LAYOUT] immersive-root-collapsed height=${rect.height} viewport=${window.innerHeight}`);
                  localStorage.setItem('braseiro.tor2e.immersiveUi', '0');
                  const safeUrl = new URL(window.location.href);
                  safeUrl.searchParams.set('classic', '1');
                  safeUrl.searchParams.set('immersive', '0');
                  window.clearTimeout(bootWatchdog);
                  window.location.replace(safeUrl.toString());
                  return;
                }
              }
              markBootStage('ui:verified');
              window.clearTimeout(bootWatchdog);"""
          replace(app, marker, guard)

          print('PATCH_4.9.3_OK')
          PY

      - name: Rebuild and sync offline runtime
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.project_root }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          npm ci --ignore-scripts
          npm run android:sync:offline
          grep -q 'data-braseiro-immersive-root' android/app/src/main/assets/esm/components/immersive/ImmersiveJourneyView.js
          grep -q 'BRASEIRO_BOOT_LAYOUT' android/app/src/main/assets/esm/App.js
          grep -q 'versionName = "4.9.3"' android/app/build.gradle.kts
          printf '%s\n'             '4.9.3 fixes immersive root collapse caused by missing static Tailwind arbitrary utilities.'             'Critical 100dvh geometry is explicit inline CSS.'             'If immersive root still collapses, runtime falls back to classic UI instead of a blank blue screen.'             > "$GITHUB_WORKSPACE/out/FIX_4.9.3.txt"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble and validate APK
        shell: bash
        env:
          ANDROID_ROOT: ${{ steps.source.outputs.android_root }}
        run: |
          set -euo pipefail
          chmod +x "$ANDROID_ROOT/gradlew"
          cd "$ANDROID_ROOT"
          ./gradlew clean :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" > "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.oumanel'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null

      - name: Publish GitHub Release directly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='O Um Anel 4.9.3 — hotfix da tela azul pós-primeiro-paint. Remove dependência crítica de utilities Tailwind ausentes no CSS estático e adiciona fallback automático para UI clássica se a raiz imersiva colapsar. Inclui também o hotfix 4.9.2 da thread do WebView.'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title 'Braseiro O Um Anel 4.9.3 — Immersive Layout Hotfix' --notes "$NOTES"
          gh release upload "$TAG"             "out/$APK_NAME"             "out/$APK_NAME.sha256"             out/APK_BADGING.txt             out/GRADLE_BUILD.log             out/FIX_4.9.3.txt             --clobber
