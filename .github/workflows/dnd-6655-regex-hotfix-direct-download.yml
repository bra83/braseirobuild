name: Braseiro DnD 6.6.55 - Direct Android Startup Hotfix APK
on:
  push:
    branches:
      - fix/dnd-6654-actions-professional-20261111
    paths:
      - .github/workflows/dnd-6655-regex-hotfix-direct-download.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-verified-android-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: "43381139867"
      SOURCE_SHA: e431af0de0d43477ae8987de967ee45d5266dc58
      TAG: braseiro-dnd-6655-android-startup-hotfix-20261113
    steps:
      - name: Require successful code and version regression build
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            state=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq '.status')
            if [ "$state" = "completed" ]; then break; fi
            sleep 5
          done
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
      - name: Download verified Android hotfix APK
        run: |
          set -euo pipefail
          mkdir -p apk
          gh run download "$SOURCE_RUN" --repo "$GH_REPO" --name DND_6655_ANDROID_REGEX_HOTFIX_PREVIEW_NOT_RELEASE --dir apk
          test -s apk/BRASEIRO_DND_6655_ANDROID_REGEX_HOTFIX.apk
      - name: Verify SHA-256, package and monotonic update code
        run: |
          set -euo pipefail
          (cd apk && sha256sum -c DEVICE_PREVIEW_SHA256.txt)
          grep -q "package: name='com.braseiro.dnd5e'" apk/DEVICE_PREVIEW_PACKAGE.txt
          grep -q "versionCode='203900618'" apk/DEVICE_PREVIEW_PACKAGE.txt
          file apk/BRASEIRO_DND_6655_ANDROID_REGEX_HOTFIX.apk | grep -q 'Android package'
      - name: Publish unzipped APK as public prerelease asset
        run: |
          set -euo pipefail
          apk=apk/BRASEIRO_DND_6655_ANDROID_REGEX_HOTFIX.apk
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" "$apk" \
              --repo "$GH_REPO" \
              --target "$SOURCE_SHA" \
              --title "Braseiro D&D 6.6.55 - Correção de inicialização Android" \
              --notes "Prévia de teste. Corrige a PatternSyntaxException de abertura e remove sinalizadores de regex incompatíveis com Android ICU dos demais módulos. Versão code 203900618; schema do banco 61, formato de backup 21, assinatura de atualização preservada. Build e testes automatizados do run 43381139867. Faça backup dos dados antes de atualizar. Ainda não homologado em Galaxy A57 físico." \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GH_REPO" --json url,assets
