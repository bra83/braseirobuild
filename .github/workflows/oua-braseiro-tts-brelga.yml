name: OUA 4.9.211 Braseiro TTS — BRELGA experimental
on:
  push:
    branches:
      - experiment/oua-49211-braseiro-tts-mestre-unico
    paths:
      - ".github/workflows/oua-braseiro-tts-brelga.yml"
      - "ci/oua-braseiro-tts/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate-and-build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Verify BRELGA
        shell: powershell
        run: |
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA runner" }
      - name: Download untouched OUA 4.9.211 baseline
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'oua-braseiro-tts'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $sourceZip=Join-Path $work 'BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip'
          & curl.exe -fL --retry 5 --retry-delay 4 --output $sourceZip 'https://github.com/bra83/braseirobuild/releases/download/OUA-v4.9.211/BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip'
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $sourceZip)){ throw 'Baseline ZIP download failed' }
          Expand-Archive -LiteralPath (Join-Path $work 'BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip') -DestinationPath (Join-Path $work 'source') -Force
          $pkg=Get-ChildItem (Join-Path $work 'source') -Recurse -File -Filter package.json | Where-Object { Test-Path (Join-Path $_.DirectoryName 'android') } | Select-Object -First 1
          if (-not $pkg) { throw 'Canonical Android Studio project not found' }
          "OUA_ROOT=$($pkg.DirectoryName)" >> $env:GITHUB_ENV
      - name: Diagnose integration and install independent core
        shell: powershell
        run: |
          node ci/oua-braseiro-tts/apply.mjs "$env:OUA_ROOT"
      - name: Report inspection only — build will follow integrated source
        shell: powershell
        run: |
          Write-Host 'Source inspected; next commit integrates the actual OUA TTS before compiling.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oua-tts-diagnostics
          path: ${{ runner.temp }}/oua-braseiro-tts/source/**/BRASEIRO_TTS_INTEGRATION_DIAGNOSTIC.json
          if-no-files-found: ignore
