name: OUA 4.9.211 Braseiro TTS — BRELGA experimental
on:
  push:
    branches:
      - experiment/oua-49211-braseiro-tts-mestre-unico
    paths:
      - ".github/workflows/oua-braseiro-tts-brelga.yml"
      - "ci/oua-braseiro-tts/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate-and-build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Verify BRELGA
        shell: powershell
        run: |
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA runner" }
      - name: Download untouched OUA 4.9.211 baseline
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'oua-braseiro-tts'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $sourceZip=Join-Path $work 'BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip'
          & curl.exe -fL --retry 5 --retry-delay 4 --output $sourceZip 'https://github.com/bra83/braseirobuild/releases/download/OUA-v4.9.211/BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip'
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $sourceZip)){ throw 'Baseline ZIP download failed' }
          Expand-Archive -LiteralPath (Join-Path $work 'BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip') -DestinationPath (Join-Path $work 'source') -Force
          $pkg=Get-ChildItem (Join-Path $work 'source') -Recurse -File -Filter package.json | Where-Object { Test-Path (Join-Path $_.DirectoryName 'android') } | Select-Object -First 1
          if (-not $pkg) { throw 'Canonical Android Studio project not found' }
          "OUA_ROOT=$($pkg.DirectoryName)" >> $env:GITHUB_ENV
      - name: Apply Braseiro TTS Mestre Único to actual OUA source
        shell: powershell
        run: |
          node ci/oua-braseiro-tts/apply.mjs "$env:OUA_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Core patch failed" }
          node ci/oua-braseiro-tts/patch-ui.mjs "$env:OUA_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Voice settings UI patch failed" }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate TypeScript and build UI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:OUA_ROOT
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript errors' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Vite build failed' }
          $js=Get-ChildItem 'dist/assets' -Filter 'index*.js' -File | Select-Object -First 1
          if (-not $js) { throw 'UI bundle missing' }
          $bundle=[System.IO.File]::ReadAllText($js.FullName)
          foreach($expected in @('Braseiro TTS','Perfil vocal','Estilo vocal','Modulação dos NPCs','Voz do Mestre')) {
            if(-not $bundle.Contains($expected)){throw ('TTS UI absent from bundle: '+$expected)}
          }
          Write-Host 'BRASEIRO_TTS_UI_BUNDLE_PASS'
          node scripts/sync-android-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Android assets sync failed' }
      - name: Assemble signed debug APK on BRELGA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $keystoreEncoded=Join-Path $env:GITHUB_WORKSPACE 'build-signing/braseiro-stable-debug.keystore.b64'
          if (-not (Test-Path $keystoreEncoded)) { throw 'Stable signing key missing' }
          $androidDir=Join-Path $env:USERPROFILE '.android'
          New-Item -ItemType Directory -Path $androidDir -Force | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $androidDir 'debug.keystore'),[Convert]::FromBase64String((Get-Content $keystoreEncoded -Raw).Trim()))
          $candidates=@('C:\actions-runner\android-sdk')
          if($env:ANDROID_SDK_ROOT){$candidates+=$env:ANDROID_SDK_ROOT}
          if($env:ANDROID_HOME){$candidates+=$env:ANDROID_HOME}
          if($env:LOCALAPPDATA){$candidates+=(Join-Path $env:LOCALAPPDATA 'Android\Sdk')}
          $sdk=$candidates|Where-Object{$_ -and (Test-Path $_) -and (Test-Path (Join-Path $_ 'platforms'))}|Select-Object -First 1
          if(-not $sdk){throw 'Android SDK not found on BRELGA'}
          $env:ANDROID_HOME=$sdk
          $env:ANDROID_SDK_ROOT=$sdk
          Write-Host ('Using Android SDK: '+$sdk)
          Set-Location (Join-Path $env:OUA_ROOT 'android')
          ('sdk.dir='+$sdk.Replace('\','/')) | Set-Content 'local.properties' -Encoding Ascii
          & .\gradlew.bat :app:assembleDebug --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Gradle assembleDebug failed' }
          $apk=Get-ChildItem 'app/build/outputs/apk/debug' -Filter '*.apk' -File | Select-Object -First 1
          if (-not $apk) { throw 'APK was not produced' }
          $dest=Join-Path $env:RUNNER_TEMP 'BRASEIRO_O_UM_ANEL_4.9.211_TTS_MESTRE_UNICO_BRELGA.apk'
          Copy-Item $apk.FullName $dest -Force
          Add-Type -AssemblyName System.IO.Compression
          $zip=[System.IO.Compression.ZipFile]::OpenRead($dest)
          try {
            $entry=$zip.Entries|Where-Object{$_.FullName -like 'assets/assets/index*.js'}|Select-Object -First 1
            if(-not $entry){throw 'APK does not contain UI JavaScript'}
            $reader=New-Object System.IO.StreamReader($entry.Open(),[Text.Encoding]::UTF8)
            try {$content=$reader.ReadToEnd()} finally {$reader.Dispose()}
            foreach($expected in @('Braseiro TTS','Perfil vocal','Estilo vocal','Modulação dos NPCs','Voz do Mestre')) {
              if(-not $content.Contains($expected)){throw ('APK MISSING TTS SETTING: '+$expected)}
            }
          } finally {$zip.Dispose()}
          Write-Host 'BRASEIRO_TTS_UI_APK_VERIFIED'
          Write-Host ('BRASEIRO_TTS_APK_PASS '+$dest+' '+(Get-Item $dest).Length+' bytes')
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BRASEIRO_O_UM_ANEL_4.9.211_TTS_MESTRE_UNICO_BRELGA
          path: ${{ runner.temp }}/BRASEIRO_O_UM_ANEL_4.9.211_TTS_MESTRE_UNICO_BRELGA.apk
          if-no-files-found: error
      - name: Preserve relevant source files for patch validation
        shell: powershell
        run: |
          $root=$env:OUA_ROOT
          $destination=Join-Path $env:RUNNER_TEMP 'oua-tts-source-review'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          @('package.json','types.ts','App.tsx','services/geminiService.ts','lib/geminiModels.ts','lib/geminiTransport.ts','lib/AudioEngine.ts','lib/narration.ts','android/app/src/main/java/com/braseiro/oumanel/MainActivity.kt') | ForEach-Object {
            $src=Join-Path $root $_
            if(Test-Path $src){
              $dest=Join-Path $destination $_
              New-Item -ItemType Directory -Path (Split-Path $dest -Parent) -Force | Out-Null
              Copy-Item $src $dest -Force
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: oua-tts-source-review
          path: ${{ runner.temp }}/oua-tts-source-review/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oua-tts-diagnostics
          path: ${{ runner.temp }}/oua-braseiro-tts/source/**/BRASEIRO_TTS_INTEGRATION_DIAGNOSTIC.json
          if-no-files-found: ignore
