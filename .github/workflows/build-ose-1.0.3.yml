name: Build BRASEIRO OSE 1.0.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ose-1.0.3.yml"
      - "OSE_1_0_3_TRIGGER.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout braseirobuild
        uses: actions/checkout@v4

      - name: Setup Python downloader
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact 1.0.3 patch
        env:
          PATCH_SHARE: https://firestorage.ai/ja/f/p72A64cBqXGW
          PATCH_SHA: c8e38fbe3d3cac89eb9f05a4d6326069a4bb4f8573e5380ee8043833564c23c8
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os, pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('/tmp/ose-1.0.3.patch')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(accept_downloads=True)
              page.goto(os.environ['PATCH_SHARE'], wait_until='domcontentloaded', timeout=120000)
              page.wait_for_timeout(3500)
              for label in ['Accept','Aceitar','同意する','OK']:
                  try:
                      loc=page.get_by_text(label, exact=True)
                      if loc.count() and loc.first.is_visible(): loc.first.click(timeout=1200)
                  except Exception: pass
              done=False
              for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
                  try:
                      loc=page.locator(sel).first
                      if not loc.count() or not loc.is_visible(): continue
                      with page.expect_download(timeout=120000) as info: loc.click(timeout=10000)
                      info.value.save_as(str(out)); done=True; break
                  except Exception: pass
              if not done:
                  card=page.get_by_text('BRASEIRO_OSE_1_0_3.patch', exact=False).first
                  parent=card.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
                  with page.expect_download(timeout=120000) as info: parent.locator('a,button').last.click(timeout=10000)
                  info.value.save_as(str(out)); done=True
              browser.close()
          if not done or not out.exists(): raise SystemExit('patch download failed')
          PY
          echo "$PATCH_SHA  /tmp/ose-1.0.3.patch" | sha256sum -c -

      - name: Apply and verify 1.0.3 patch
        run: |
          set -euo pipefail
          git apply --check --binary /tmp/ose-1.0.3.patch
          git apply --binary /tmp/ose-1.0.3.patch
          grep -q 'versionName = "1.0.3"' ose/1.0.0/source/app-android/build.gradle.kts
          grep -q 'CharacterSheetUpdate' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt
          grep -q 'CharacterRecreateBeforeStart' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt
          grep -q 'CRIAR OUTRO PERSONAGEM' ose/1.0.0/source/web-ui-p1/p1.js
          grep -q 'hexes-runtime' ose/1.0.0/source/web-ui-p1/p1.js
          node --check ose/1.0.0/source/web-ui-p1/p1.js
          python3 - <<'PY'
          import json, pathlib
          d=pathlib.Path('ose/1.0.0/source/web-ui-p1/equipment-icons')
          m=json.loads((d/'manifest.json').read_text())
          png={p.stem for p in d.glob('*.png')}
          expected=set(m['items'])
          assert m['count']==102, m['count']
          assert len(png)==102, len(png)
          assert expected==png, (sorted(expected-png), sorted(png-expected))
          h=pathlib.Path('ose/1.0.0/source/web-ui-p1/hexes-runtime')
          assert len(list(h.glob('*.png')))==6
          print('equipment_icons=102/102')
          print('runtime_hex_assets=6/6')
          PY

      - name: Visual map geometry smoke 415x915
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse,unquote
          from playwright.sync_api import sync_playwright
          import mimetypes
          here=Path('ose/1.0.0/source/web-ui-p1'); root=here.parent
          html=(here/'index.html').read_text().replace('<link rel="stylesheet" href="p1.css">',f'<style>{(here/"p1.css").read_text()}</style>').replace('<head>','<head><base href="http://braseiro.local/web-ui-p1/">',1)
          js=(here/'p1.js').read_text(); html=html.replace('<script src="p1.js"></script>','<script>window.__P1_CAPTURE_QUERY="?screen=map";window.BraseiroBridge={postMessage:(x)=>{}};</script>'+f'<script>{js}</script>')
          cells=[]
          known={(3,2),(2,2),(4,2),(3,1),(3,3),(2,3),(4,1),(2,1),(4,3),(1,2)}
          ts=['HILLS','FOREST','CLEAR_GRASSLANDS','MOUNTAINS']
          for r in range(5):
              for q in range(6): cells.append({'q':q,'r':r,'known':(q,r) in known,'visible':(q,r) in known,'terrain':ts[(q+r)%4],'hydrology':'NONE'})
          payload={'campaign':{'profile':'OSE_ADVANCED_FANTASY'},'time':{'days':0,'turns':0},'resources':[],'session':{'phase':'READY_TO_START','visibleNarration':''},'position':{'kind':'HEX','q':3,'r':2},'map':{'width':6,'height':5,'cells':cells},'selectedCharacter':{'characterId':'c1','name':'Teste','raceId':'HUMAN','classIds':['THIEF'],'levelByClass':{'THIEF':1},'attributes':{'str':8,'int':14,'wis':11,'dex':6,'con':14,'cha':15},'hpCurrentNumerator':5,'hpMaxNumerator':5,'hpDenominator':1,'armorClassDescending':10},'inventory':[],'party':[],'creation':{'drafts':[]},'presentation':{'characterPortraits':{},'itemThumbnails':{}}}
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True); page=b.new_page(viewport={'width':415,'height':915})
              def route(route,request):
                  fp=root/unquote(urlparse(request.url).path).lstrip('/')
                  route.fulfill(path=str(fp),content_type=mimetypes.guess_type(fp.name)[0] or 'application/octet-stream') if fp.is_file() else route.fulfill(status=404,body='')
              page.route('http://braseiro.local/**',route); page.set_content(html,wait_until='load'); page.evaluate("p=>window.BraseiroReceive(JSON.stringify({type:'ViewState',payload:p}))",payload); page.wait_for_timeout(350)
              vp=page.locator('.map-viewport').bounding_box(); rects=page.locator('.hex-cell.known').evaluate_all("els=>els.map(e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}})")
              assert rects and min(x['x'] for x in rects)>=vp['x']-1 and max(x['right'] for x in rects)<=vp['x']+vp['width']+1
              # Adjacent horizontal cells must overlap/touch by <= 2 px seam.
              same=sorted([x for x in rects if abs(x['y']-rects[0]['y'])<2],key=lambda x:x['x'])
              if len(same)>=2:
                  gaps=[same[i+1]['x']-same[i]['right'] for i in range(len(same)-1)]
                  assert max(gaps)<=1.5, gaps
              failed=page.locator('img').evaluate_all("els=>els.filter(e=>!e.complete||e.naturalWidth===0).map(e=>e.src)")
              assert not failed, failed
              b.close()
          print('map_geometry_415x915=PASS')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and compile APK
        working-directory: ose/1.0.0/source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app-android:testDebugUnitTest :app-android:assembleDebug --stacktrace --no-daemon

      - name: Validate and publish 1.0.3
        run: |
          set -euo pipefail
          APK="$(find ose/1.0.0/source/app-android/build/outputs/apk/debug -type f -name '*.apk' | sort | head -n1)"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p build-artifacts/ose/1.0.3
          cp "$APK" build-artifacts/ose/1.0.3/BRASEIRO_OSE_1_0_3_DEBUG.apk
          sha256sum build-artifacts/ose/1.0.3/BRASEIRO_OSE_1_0_3_DEBUG.apk | tee build-artifacts/ose/1.0.3/BRASEIRO_OSE_1_0_3_DEBUG.sha256
          stat -c 'size_bytes=%s' build-artifacts/ose/1.0.3/BRASEIRO_OSE_1_0_3_DEBUG.apk | tee build-artifacts/ose/1.0.3/BRASEIRO_OSE_1_0_3_DEBUG.info.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ose/1.0.0/source build-artifacts/ose/1.0.3
          if ! git diff --cached --quiet; then
            git commit -m 'BRASEIRO OSE 1.0.3: character editing, seamless map, complete equipment icons'
            git push origin HEAD:main
          fi

      - name: Summary
        run: |
          {
            echo '## BRASEIRO OSE 1.0.3'
            echo '- Ficha: criar, editar nome/foto e recriar antes da primeira cena.'
            echo '- StartAdventure usa transition id seguro após reset.'
            echo '- Mapa 415x915 auto-fit, sem corte lateral e hexes sem costuras.'
            echo '- Equipamentos: 102/102 ícones presentes e carregáveis.'
            cat build-artifacts/ose/1.0.3/BRASEIRO_OSE_1_0_3_DEBUG.sha256
          } >> "$GITHUB_STEP_SUMMARY"
