name: Publish BRASEIRO OSE 1.0.3 to tmpfiles.org

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-ose-1.0.3-tmpfiles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and upload APK to tmpfiles.org
        run: |
          set -euo pipefail
          APK="build-artifacts/ose/1.0.3/BRASEIRO_OSE_1_0_3_DEBUG.apk"
          test -f "$APK"
          echo "fe54280c00aaa6648a54358dd4056e3c88d2fdf5b0b51ee516765556ec039909  $APK" | sha256sum -c -
          curl --fail-with-body -sS -F "file=@${APK}" https://tmpfiles.org/api/v1/upload | tee /tmp/tmpfiles-response.json
          python3 - <<'PY'
          import json, pathlib
          obj=json.loads(pathlib.Path('/tmp/tmpfiles-response.json').read_text())
          url=obj.get('data',{}).get('url')
          if not url: raise SystemExit(f'tmpfiles upload did not return URL: {obj}')
          direct=url.replace('https://tmpfiles.org/','https://tmpfiles.org/dl/',1)
          out=pathlib.Path('build-artifacts/ose/1.0.3')
          (out/'TMPFILES_PAGE_URL.txt').write_text(url+'\n')
          (out/'TMPFILES_DIRECT_URL.txt').write_text(direct+'\n')
          (out/'TMPFILES_RESPONSE.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          print('page_url='+url);print('direct_url='+direct)
          PY

      - name: Save published URL
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-artifacts/ose/1.0.3/TMPFILES_PAGE_URL.txt build-artifacts/ose/1.0.3/TMPFILES_DIRECT_URL.txt build-artifacts/ose/1.0.3/TMPFILES_RESPONSE.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record tmpfiles.org URL for BRASEIRO OSE 1.0.3'
            git push origin HEAD:main
          fi

      - name: Summary
        run: |
          {
            echo '## BRASEIRO OSE 1.0.3 — tmpfiles.org'
            echo "Page: $(cat build-artifacts/ose/1.0.3/TMPFILES_PAGE_URL.txt)"
            echo "Direct: $(cat build-artifacts/ose/1.0.3/TMPFILES_DIRECT_URL.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
