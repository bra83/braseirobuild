name: Audit Star Wars R38 REGISTROS DOM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-star-wars-r38-registros-dom.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prepare source
        env:
          U: https://firestorage.ai/ja/f/qPKfDLdfrlCc
          F: STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R38_BUILD_FIX.zip
          S: e925d7c2885e51b4f03dfe55ec7f477deb23ee0551b7b30f3a457154db9dd872
          SU: https://firestorage.ai/ja/f/PbM3XvdzNMAk
          SF: scene-assets-v1-tiny.tar.gz
          SS: 2ca16b2cd0d3f489fe10f1df718be1243febeef38fb88a52bd50502528f60711
        shell: bash
        run: |
          set -euo pipefail;rm -rf incoming work;mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          def dl(u,n,o):
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);q=b.new_page(accept_downloads=True);q.goto(u,wait_until='domcontentloaded',timeout=120000);q.wait_for_timeout(2200);done=False
              for s in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
                try:
                  x=q.locator(s).first
                  if not x.count() or not x.is_visible():continue
                  with q.expect_download(timeout=120000) as i:x.click(timeout=10000)
                  i.value.save_as(str(o));done=True;break
                except:pass
              if not done:
                x=q.get_by_text(n,exact=False).first
                with q.expect_download(timeout=120000) as i:x.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
                i.value.save_as(str(o));done=True
              b.close()
            if not done:raise SystemExit('download failed '+n)
          dl(os.environ['U'],os.environ['F'],pathlib.Path('incoming')/os.environ['F']);dl(os.environ['SU'],os.environ['SF'],pathlib.Path('incoming')/os.environ['SF'])
          PY
          echo "${S}  incoming/${F}"|sha256sum -c -;echo "${SS}  incoming/${SF}"|sha256sum -c -
          unzip -q "incoming/${F}" -d work
          G="$(find work -type f -name gradlew -not -path '*/build/*'|head -1)";R="$(dirname "$G")";echo "$R">/tmp/root
          base64 -w0 "incoming/${SF}" > star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          python3 star-wars/r38/patches/block01_repair_safe.py "$R"
          python3 star-wars/r38/patches/block02_scene_controls.py "$R"
      - name: Inspect DOM
        shell: bash
        run: |
          export ROOT="$(cat /tmp/root)"
          python3 - <<'PY'
          import os,pathlib,threading,http.server,socketserver,json
          from playwright.sync_api import sync_playwright
          vtt=(pathlib.Path(os.environ['ROOT']).resolve()/'app/src/main/assets/vtt');os.chdir(vtt)
          class H(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          s=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=s.serve_forever,daemon=True).start();port=s.server_address[1]
          result={}
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915})
            pg.add_init_script('''const h={get:(t,p)=>{if(p==='then')return undefined;return(...a)=>JSON.stringify({ok:true,items:[],data:[],state:{}})}};for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroImages','BraseiroFiles','BraseiroTts','BraseiroGemini'])window[n]=new Proxy({},h);''')
            pg.goto(f'http://127.0.0.1:{port}/r46-shell.html',wait_until='networkidle');pg.wait_for_timeout(400)
            st=pg.locator('#sandbox-start-button');
            if st.count() and st.is_visible():st.click();pg.wait_for_timeout(300)
            btn=pg.locator('.bottom-nav-button:visible').filter(has_text='REGISTROS');btn.click();pg.wait_for_timeout(500)
            for txt in ['Contatos conhecidos','Histórico']:
              el=pg.get_by_text(txt,exact=True).first
              result[txt]=el.evaluate('''e=>{const a=[];let n=e;for(let i=0;i<6&&n;i++,n=n.parentElement){const s=getComputedStyle(n);a.push({tag:n.tagName,id:n.id,cls:n.className,role:n.getAttribute('role'),outer:n.outerHTML.slice(0,1200),box:n.getBoundingClientRect().toJSON(),display:s.display,flex:s.flex,grid:s.gridTemplateColumns,overflowX:s.overflowX,whiteSpace:s.whiteSpace})}return a}''')
            b.close()
          s.shutdown();s.server_close()
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit/REGISTROS_DOM.json';out.write_text(json.dumps(result,ensure_ascii=False,indent=2))
          md=['# REGISTROS overflow DOM','']
          for k,v in result.items():
            md += [f'## {k}','```json',json.dumps(v,ensure_ascii=False,indent=2),'```','']
          (out.parent/'REGISTROS_DOM.md').write_text('\n'.join(md))
          PY
      - name: Commit evidence
        run: |
          git checkout -- star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          git config user.name braseiro-audit-bot;git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/REGISTROS_DOM.*
          git commit -m 'audit(star-wars): capture registros overflow DOM' || true
          git push
