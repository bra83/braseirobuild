name: Temporary Forbidden Lands 3.3.2 APK Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-dnd-run104.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-forbidden-lands:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish Forbidden Lands 3.3.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          chmod +x ci/build-fl332.sh
          bash ci/build-fl332.sh
