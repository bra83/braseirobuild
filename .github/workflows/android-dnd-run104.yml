name: Forbidden Lands 3.3.2 Clean Release Build
# clean-github-runner: 2026-09-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-dnd-run104.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-forbidden-lands:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TAG: FORBIDDEN-LANDS-3.3.2-TTS-IMAGE
      APK_NAME: BRASEIRO_FORBIDDEN_LANDS_3.3.2.apk
      SOURCE_NAME: Braseiro_Forbidden_Lands_3.3.2_TTS_IMAGE_PROMPT_PATCH_ANDROID_STUDIO.zip
      SOURCE_SHA256: 83b99e4ced2f635b1c93d79c0dbb9ef5093545ea1c67cf8af2dc88331ce0061c
      FIRE_API: https://api.firestorage.ai/dev/file
      SHARE_ID: sJUeoArUdSIJ
      FILE_ID: 01a0bd4313427307bc87a8337de35d13

    steps:
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Download exact 3.3.2 source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/fl-src" "$GITHUB_WORKSPACE/fl-out"

          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/fl-files.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/fl-files.json', encoding='utf-8'))
          wanted = os.environ['FILE_ID']
          if not any(str(x.get('fileId')) == wanted for x in (data.get('files') or [])):
              raise SystemExit('Forbidden Lands 3.3.2 source not found in temporary share')
          PY

          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/fl-download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/fl-download.json', encoding='utf-8')).get('downloadUrl') or '')
          PY
          )"
          test -n "$DOWNLOAD_URL"

          curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 --max-time 300             "$DOWNLOAD_URL" -o "$GITHUB_WORKSPACE/$SOURCE_NAME"

          echo "$SOURCE_SHA256  $GITHUB_WORKSPACE/$SOURCE_NAME" | sha256sum -c -
          unzip -t "$GITHUB_WORKSPACE/$SOURCE_NAME" >/dev/null
          unzip -q "$GITHUB_WORKSPACE/$SOURCE_NAME" -d "$GITHUB_WORKSPACE/fl-src"

          test -f "$GITHUB_WORKSPACE/fl-src/package.json"
          test -f "$GITHUB_WORKSPACE/fl-src/android/gradlew"
          echo "FL_ROOT=$GITHUB_WORKSPACE/fl-src" >> "$GITHUB_ENV"

      - name: Install web dependencies
        shell: bash
        working-directory: ${{ env.FL_ROOT }}
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 2000
          npm config set fetch-retry-maxtimeout 20000
          npm config set fetch-timeout 120000
          npm ci --no-audit --no-fund

      - name: Set app version 3.3.2 without touching legacy source
        shell: bash
        working-directory: ${{ env.FL_ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8-sig'))
          data['version'] = '3.3.2'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8-sig')
          text = re.sub(r'versionCode\s+\d+', 'versionCode 303002', text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "3.3.2"', text, count=1)
          gradle.write_text(text, encoding='utf-8')
          PY

          grep -q 'versionCode 303002' android/app/build.gradle
          grep -q 'versionName "3.3.2"' android/app/build.gradle

      - name: Run focused Forbidden Lands gates
        shell: bash
        working-directory: ${{ env.FL_ROOT }}
        run: |
          set -euo pipefail
          npm run verify:start-freeze
          npm run verify:rules

      - name: Build web runtime and sync Android
        shell: bash
        working-directory: ${{ env.FL_ROOT }}
        run: |
          set -euo pipefail
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          grep -R -q 'Modelo TTS' android/app/src/main/assets/public/assets
          grep -R -q 'Prompt visual da cena' android/app/src/main/assets/public/assets

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Assemble APK
        shell: bash
        working-directory: ${{ env.FL_ROOT }}/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --console=plain --no-daemon             2>&1 | tee "$GITHUB_WORKSPACE/fl-out/GRADLE_BUILD.log"

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/fl-out/$APK_NAME"

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "fl-out/$APK_NAME" >/dev/null
          sha256sum "fl-out/$APK_NAME" > "fl-out/$APK_NAME.sha256"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "fl-out/$APK_NAME" | tee fl-out/APK_BADGING.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" fl-out/APK_BADGING.txt
          grep -q "versionCode='303002'" fl-out/APK_BADGING.txt
          grep -q "versionName='3.3.2'" fl-out/APK_BADGING.txt

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs             "fl-out/$APK_NAME" | tee fl-out/APK_SIGNATURE.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Braseiro Forbidden Lands 3.3.2. TTS Gemini com modelo, voz e direção configuráveis. Modelo de imagem configurável. Geração manual ou automática de imagem de cena com prompt editável. Runtime web recompilado e sincronizado com Android em runner limpo do GitHub antes da geração do APK.'

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||             gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"               --title 'Braseiro Forbidden Lands 3.3.2 — TTS + Imagem de Cena'               --notes "$NOTES"

          gh release upload "$TAG"             "fl-out/$APK_NAME"             "fl-out/$APK_NAME.sha256"             fl-out/APK_BADGING.txt             fl-out/APK_SIGNATURE.txt             fl-out/GRADLE_BUILD.log             --repo "$GITHUB_REPOSITORY" --clobber
