name: Temporary Forbidden Lands 3.3.2 APK Build
# retry-no-bom: 2026-09-20T02:43-03:00

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-dnd-run104.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-forbidden-lands:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Enable Windows long paths for Git
        shell: powershell
        run: |
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Build and publish Forbidden Lands 3.3.2
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ci/build-fl332.ps1
