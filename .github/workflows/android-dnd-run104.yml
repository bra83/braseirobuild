name: Forbidden Lands 3.3.2 Direct Release Build
# direct-selfhosted-no-checkout: 2026-09-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-dnd-run104.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-forbidden-lands:
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Build 3.3.2 in short clean path and publish Release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $Tag = 'FORBIDDEN-LANDS-3.3.2-TTS-IMAGE'
          $ApkName = 'BRASEIRO_FORBIDDEN_LANDS_3.3.2.apk'
          $SourceName = 'Braseiro_Forbidden_Lands_3.3.2_TTS_IMAGE_PROMPT_PATCH_ANDROID_STUDIO.zip'
          $SourceSha = '83b99e4ced2f635b1c93d79c0dbb9ef5093545ea1c67cf8af2dc88331ce0061c'
          $FireApi = 'https://api.firestorage.ai/dev/file'
          $ShareId = 'sJUeoArUdSIJ'
          $FileId = '01a0bd4313427307bc87a8337de35d13'

          $base = 'C:\FL332'
          $src = Join-Path $base 'src'
          $out = Join-Path $base 'out'
          $zip = Join-Path $base $SourceName

          Set-Location C:\
          Remove-Item $base -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $src,$out | Out-Null

          Write-Host '1/8 Baixando somente a fonte Forbidden Lands 3.3.2...'
          $list = Invoke-RestMethod -Uri "$FireApi/shares/$ShareId/files?maxResults=1000" -Method Get
          if (-not ($list.files | Where-Object { [string]$_.fileId -eq $FileId })) {
            throw 'Fonte 3.3.2 não encontrada no share temporário.'
          }
          $download = Invoke-RestMethod -Uri "$FireApi/shares/$ShareId/files/$FileId/download" -Method Post
          if (-not $download.downloadUrl) { throw 'Firestorage não retornou URL de download.' }
          Invoke-WebRequest -Uri $download.downloadUrl -OutFile $zip

          $actualSha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actualSha -ne $SourceSha) { throw "SHA incorreto da fonte: $actualSha" }
          Expand-Archive -Path $zip -DestinationPath $src -Force

          if (-not (Test-Path (Join-Path $src 'package.json'))) { throw 'package.json ausente.' }
          if (-not (Test-Path (Join-Path $src 'android\gradlew.bat'))) { throw 'Projeto Android ausente.' }

          Write-Host '2/8 Instalando dependências...'
          Set-Location $src
          if (-not (Get-Command npm.cmd -ErrorAction SilentlyContinue)) { throw 'npm.cmd não encontrado no BRELGA.' }
          & npm.cmd config set registry https://registry.npmjs.org/
          & npm.cmd config set fetch-retries 5
          & npm.cmd config set fetch-timeout 120000
          & npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci falhou: $LASTEXITCODE" }

          Write-Host '3/8 Fixando versão 3.3.2 sem BOM...'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $pkgPath = Join-Path $src 'package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = '3.3.2'
          $pkgJson = $pkg | ConvertTo-Json -Depth 50
          [System.IO.File]::WriteAllText($pkgPath, $pkgJson + [Environment]::NewLine, $utf8NoBom)

          $gradlePath = Join-Path $src 'android\app\build.gradle'
          $gradleText = Get-Content $gradlePath -Raw
          $gradleText = [regex]::Replace($gradleText, 'versionCode\s+\d+', 'versionCode 303002', 1)
          $gradleText = [regex]::Replace($gradleText, 'versionName\s+"[^"]+"', 'versionName "3.3.2"', 1)
          [System.IO.File]::WriteAllText($gradlePath, $gradleText, $utf8NoBom)

          Write-Host '4/8 Rodando gates focados...'
          & npm.cmd run verify:start-freeze
          if ($LASTEXITCODE -ne 0) { throw 'verify:start-freeze falhou.' }
          & npm.cmd run verify:rules
          if ($LASTEXITCODE -ne 0) { throw 'verify:rules falhou.' }

          Write-Host '5/8 Recompilando web e sincronizando Android...'
          & npm.cmd run android:sync
          if ($LASTEXITCODE -ne 0) { throw 'android:sync falhou.' }

          $assets = Join-Path $src 'android\app\src\main\assets\public\assets'
          if (-not (Test-Path (Join-Path $src 'android\app\src\main\assets\public\index.html'))) {
            throw 'index.html Android não foi sincronizado.'
          }
          $bundleText = ''
          Get-ChildItem $assets -Filter *.js -File -Recurse | ForEach-Object {
            $bundleText += (Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue)
          }
          if ($bundleText -notmatch 'Modelo TTS') { throw 'Bundle Android não contém Modelo TTS.' }
          if ($bundleText -notmatch 'Prompt visual da cena') { throw 'Bundle Android não contém Prompt visual da cena.' }

          Write-Host '6/8 Preparando Java e Android SDK...'
          if (-not (Get-Command java.exe -ErrorAction SilentlyContinue)) {
            $javaCandidates = @(
              'C:\Program Files\Android\Android Studio\jbr',
              "$env:LOCALAPPDATA\Programs\Android Studio\jbr"
            )
            foreach ($candidate in $javaCandidates) {
              if (Test-Path (Join-Path $candidate 'bin\java.exe')) {
                $env:JAVA_HOME = $candidate
                $env:Path = "$candidate\bin;$env:Path"
                break
              }
            }
          }
          if (-not (Get-Command java.exe -ErrorAction SilentlyContinue)) { throw 'JDK não encontrado.' }
          & java.exe -version

          if (-not $env:ANDROID_HOME) {
            $sdkCandidate = "$env:LOCALAPPDATA\Android\Sdk"
            if (Test-Path $sdkCandidate) { $env:ANDROID_HOME = $sdkCandidate }
          }
          if (-not $env:ANDROID_HOME -or -not (Test-Path $env:ANDROID_HOME)) { throw 'Android SDK não encontrado.' }
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME

          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (Test-Path $sdkManager) {
            & $sdkManager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
            if ($LASTEXITCODE -ne 0) { Write-Host 'sdkmanager retornou erro; continuando com SDK já instalado.' }
          }

          Write-Host '7/8 Gerando e validando APK...'
          Set-Location (Join-Path $src 'android')
          $gradleLog = Join-Path $out 'GRADLE_BUILD.log'
          & .\gradlew.bat :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | Tee-Object -FilePath $gradleLog
          if ($LASTEXITCODE -ne 0) { throw "Gradle falhou: $LASTEXITCODE" }

          $apk = Get-ChildItem (Join-Path $src 'android\app\build\outputs\apk\debug') -Filter *.apk -File | Select-Object -First 1
          if (-not $apk) { throw 'APK não encontrado após assembleDebug.' }

          $finalApk = Join-Path $out $ApkName
          Copy-Item $apk.FullName $finalApk -Force
          $apkSha = (Get-FileHash -Algorithm SHA256 $finalApk).Hash.ToLowerInvariant()
          "$apkSha  $ApkName" | Out-File (Join-Path $out "$ApkName.sha256") -Encoding ascii

          $buildToolsRoot = Join-Path $env:ANDROID_HOME 'build-tools'
          $toolDir = Get-ChildItem $buildToolsRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $toolDir) { throw 'Android build-tools não encontrados.' }

          $aapt = Join-Path $toolDir.FullName 'aapt.exe'
          $apksigner = Join-Path $toolDir.FullName 'apksigner.bat'
          if (-not (Test-Path $aapt)) { throw 'aapt.exe não encontrado.' }
          if (-not (Test-Path $apksigner)) { throw 'apksigner.bat não encontrado.' }

          $badgingPath = Join-Path $out 'APK_BADGING.txt'
          $badging = (& $aapt dump badging $finalApk) -join [Environment]::NewLine
          [System.IO.File]::WriteAllText($badgingPath, $badging, $utf8NoBom)
          if ($badging -notmatch "package: name='com\.braseiro\.forbiddenlands'") { throw 'Package ID incorreto.' }
          if ($badging -notmatch "versionCode='303002'") { throw 'versionCode incorreto.' }
          if ($badging -notmatch "versionName='3\.3\.2'") { throw 'versionName incorreto.' }

          $signaturePath = Join-Path $out 'APK_SIGNATURE.txt'
          & $apksigner verify --verbose --print-certs $finalApk 2>&1 | Tee-Object -FilePath $signaturePath
          if ($LASTEXITCODE -ne 0) { throw 'Assinatura do APK inválida.' }

          Write-Host '8/8 Publicando diretamente na GitHub Release...'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseirobuild-brelga-direct-release'
          }
          $apiBase = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"

          $release = $null
          try {
            $release = Invoke-RestMethod -Headers $headers -Uri "$apiBase/releases/tags/$Tag" -Method Get
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }

          if (-not $release) {
            $body = @{
              tag_name = $Tag
              target_commitish = $env:GITHUB_SHA
              name = 'Braseiro Forbidden Lands 3.3.2 — TTS + Imagem de Cena'
              body = 'APK 3.3.2 compilado diretamente da fonte isolada. TTS Gemini com modelo, voz e direção configuráveis; geração de imagem de cena manual/automática com prompt editável.'
              draft = $false
              prerelease = $false
            } | ConvertTo-Json

            $release = Invoke-RestMethod -Headers $headers -Uri "$apiBase/releases" -Method Post -Body $body -ContentType 'application/json'
          }

          $existingAssets = Invoke-RestMethod -Headers $headers -Uri "$apiBase/releases/$($release.id)/assets" -Method Get
          $assetNames = @($ApkName, "$ApkName.sha256", 'APK_BADGING.txt', 'APK_SIGNATURE.txt', 'GRADLE_BUILD.log')
          foreach ($name in $assetNames) {
            foreach ($asset in ($existingAssets | Where-Object { $_.name -eq $name })) {
              Invoke-RestMethod -Headers $headers -Uri "$apiBase/releases/assets/$($asset.id)" -Method Delete | Out-Null
            }
          }

          $uploadBase = ($release.upload_url -replace '\{\?name,label\}$','')
          function Upload-Asset([string]$Path,[string]$Name,[string]$ContentType) {
            $uri = "$uploadBase?name=$([uri]::EscapeDataString($Name))"
            Invoke-WebRequest -Headers $headers -Uri $uri -Method Post -InFile $Path -ContentType $ContentType | Out-Null
          }

          Upload-Asset $finalApk $ApkName 'application/vnd.android.package-archive'
          Upload-Asset (Join-Path $out "$ApkName.sha256") "$ApkName.sha256" 'text/plain'
          Upload-Asset $badgingPath 'APK_BADGING.txt' 'text/plain'
          Upload-Asset $signaturePath 'APK_SIGNATURE.txt' 'text/plain'
          Upload-Asset $gradleLog 'GRADLE_BUILD.log' 'text/plain'

          Write-Host "RELEASE_URL=$($release.html_url)"
          Write-Host "APK_SHA256=$apkSha"
