name: Braseiro DnD 6.6.2 RUN104

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-dnd-run104.yml'
      - 'ci/dnd-run104/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FROZEN_SHA256: '2acf32fe57437c5d2472f7a65104791828a5305f44fb722ee545af0a01a52937'
  PACKAGE_ID: 'com.braseiro.dnd5e'
  RELEASE_TAG: 'dnd-6.6.2-run104'
  APK_NAME: 'BRASEIRO_DND_6.6.2_RUN104_DEBUG.apk'

jobs:
  diagnostico-e-publicacao:
    if: ${{ !contains(github.event.head_commit.message, 'trigger forbidden lands 3.3.2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 00 - Baixar baseline congelado e validar SHA
        shell: bash
        env:
          SHARE_00: 'https://firestorage.ai/ja/f/QRFGq33xocDC'
          SHARE_01: 'https://firestorage.ai/ja/f/v7WCbOWJt2l0'
          SHARE_02: 'https://firestorage.ai/ja/f/tyVmjxfKwbWS'
          SHARE_03: 'https://firestorage.ai/ja/f/JtFk5UVAOYbD'
          SHARE_04: 'https://firestorage.ai/ja/f/PQpyJskFB702'
        run: |
          set -euo pipefail
          mkdir -p incoming work /tmp/dnd-freeze-download
          cd /tmp/dnd-freeze-download
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium >/dev/null

          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const urls=[
            process.env.SHARE_00,
            process.env.SHARE_01,
            process.env.SHARE_02,
            process.env.SHARE_03,
            process.env.SHARE_04
          ];
          const names=[
            'BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.00',
            'BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.01',
            'BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.02',
            'BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.03',
            'BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.04'
          ];
          const browser=await chromium.launch({headless:true});

          async function direct(ctx,url,out){
            try{
              const r=await ctx.request.get(url,{timeout:60000});
              const h=r.headers();
              const ct=(h['content-type']||'').toLowerCase();
              const cd=(h['content-disposition']||'').toLowerCase();
              const len=Number(h['content-length']||0);
              if(r.ok() && (cd.includes('attachment') || ct.includes('octet-stream') || ct.includes('zip') || len>1000000)){
                const b=await r.body();
                if(b.length>1000000){fs.writeFileSync(out,b);return true;}
              }
            }catch{}
            return false;
          }

          async function clickDownload(page,el,out){
            try{
              if(!(await el.isVisible({timeout:1200}))) return false;
              const wait=page.waitForEvent('download',{timeout:30000});
              await el.click({timeout:5000});
              const d=await wait;
              await d.saveAs(out);
              return true;
            }catch{return false;}
          }

          for(let j=0;j<urls.length;j++){
            const ctx=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
            const page=await ctx.newPage();
            const out=process.env.GITHUB_WORKSPACE+'/incoming/'+names[j];
            await page.goto(urls[j],{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(4000);
            let ok=false;

            for(let pass=0;pass<3 && !ok;pass++){
              const links=await page.locator('a[href]').evaluateAll(as=>as.map(a=>({
                href:a.href,text:(a.innerText||a.textContent||'').trim(),download:a.getAttribute('download')||''
              })));
              for(const a of links){
                if(/download|file|asset|storage|object|blob|zip/i.test(a.href+' '+a.text+' '+a.download)){
                  if(await direct(ctx,a.href,out)){ok=true;break;}
                }
              }
              if(ok) break;

              const candidates=[];
              for(const sel of ['button','a','[role="button"]','input[type="submit"]']){
                const loc=page.locator(sel);
                const n=Math.min(await loc.count(),100);
                for(let i=0;i<n;i++){
                  const el=loc.nth(i);
                  let text='',aria='',title='';
                  try{text=((await el.innerText({timeout:500}))||'').trim();}catch{}
                  try{aria=await el.getAttribute('aria-label')||'';}catch{}
                  try{title=await el.getAttribute('title')||'';}catch{}
                  const desc=(text+' '+aria+' '+title).trim();
                  if(/download|ダウンロード|一括|保存|zip|ファイル/i.test(desc)) candidates.push(el);
                }
              }
              for(const el of candidates){
                if(await clickDownload(page,el,out)){ok=true;break;}
                await page.waitForTimeout(5000);
              }
              if(!ok) await page.waitForTimeout(5000);
            }

            if(!ok || !fs.existsSync(out) || fs.statSync(out).size<1000000){
              console.log((await page.locator('body').innerText().catch(()=>'' )).slice(0,5000));
              await ctx.close();
              throw new Error('baseline chunk download failed '+j);
            }
            console.log('CHUNK_OK',j,fs.statSync(out).size);
            await ctx.close();
          }
          await browser.close();
          NODE

          node download.mjs
          cd "$GITHUB_WORKSPACE"

          printf '%s  %s\n' \
            '7799a6d20fa5b0f362cf4ab386139c31130b5807da44afd4841b9b6bb8fe2ac6' incoming/BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.00 \
            '06864dd74d1c3ef62a2010210cbd63275bd3046476d7c1e1af3b15ed6bdeb61d' incoming/BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.01 \
            '86534362f7892834b7de98e154a6d122bf7e73f95cb2d6a80d8c2884c9434ebc' incoming/BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.02 \
            '8ba61dc700efc75aa1499621cd502ed46bab5e0f59952850aad5c89af3f5d7d5' incoming/BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.03 \
            'c3984239c2db218db020180c71a67069276abe6c0ea8f8085a0c1cee0131e5fc' incoming/BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.04 | sha256sum -c -

          cat incoming/BRASEIRO_DND_6.6.2_COMPILE_FREEZE.part.* > incoming/BRASEIRO_DND_6.6.2_BASELINE_COMPILE_FREEZE.zip
          echo "$FROZEN_SHA256  incoming/BRASEIRO_DND_6.6.2_BASELINE_COMPILE_FREEZE.zip" | sha256sum -c -
          unzip -t incoming/BRASEIRO_DND_6.6.2_BASELINE_COMPILE_FREEZE.zip >/dev/null
          unzip -q incoming/BRASEIRO_DND_6.6.2_BASELINE_COMPILE_FREEZE.zip -d work
          echo "BASELINE_SHA_OK=$FROZEN_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: 01 - Conferir estrutura do projeto
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/BRASEIRO_DND_6.6.2_ANDROID_STUDIO"
          ANDROID="$ROOT/android"
          test -d "$ANDROID/app/src/main"
          test -f "$ANDROID/settings.gradle.kts"
          test -f "$ANDROID/build.gradle.kts"
          test -f "$ANDROID/app/build.gradle.kts"
          test -f "$ANDROID/gradlew"
          test -f "$ANDROID/gradle/wrapper/gradle-wrapper.jar"
          test -f "$ANDROID/gradle/wrapper/gradle-wrapper.properties"
          test -f "$ANDROID/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/version.properties"
          test -f "$ANDROID/app/src/main/java/com/braseiro/dnd5e/MainActivity.java"
          COUNT="$(find "$ANDROID/app/src/main/java/com/braseiro/dnd5e" -type f -name '*.java' | wc -l)"
          test "$COUNT" -eq 234
          if grep -R --include='*.java' -n 'package com\.braseiro\.dnd;' "$ANDROID/app/src/main/java" >/tmp/oldpkg.txt; then
            cat /tmp/oldpkg.txt
            exit 1
          fi
          echo "ANDROID_ROOT=$ANDROID" >> "$GITHUB_ENV"
          echo "JAVA_CLASS_COUNT=$COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "STRUCTURE_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 01b - Aplicar RUN104 e validar contrato funcional
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/work/BRASEIRO_DND_6.6.2_ANDROID_STUDIO"
          python ci/dnd-run104/apply_run104.py "$ROOT"
          MAIN="$ROOT/android/app/src/main/java/com/braseiro/dnd5e/MainActivity.java"
          grep -q 'TENTAR NOVAMENTE NA HISTÓRIA' "$MAIN"
          grep -Fq '("available".equals(status)||"cancelled".equals(status)||status.length()==0)' "$MAIN"
          grep -q 'retry_count' "$MAIN"
          grep -q 'GM_HELP' "$MAIN"
          grep -q 'Trate isto agora como PLAYER_ACTION' "$MAIN"
          grep -q 'resolution_excerpt' "$MAIN"
          grep -q '^VERSION_NAME=6.6.2-r104
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 02b - Validar settings build wrapper JDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          grep -q 'include(":app")' "$ANDROID_ROOT/settings.gradle.kts"
          grep -q 'com.android.application.*8.9.1' "$ANDROID_ROOT/build.gradle.kts"
          grep -q 'distributionUrl=.*gradle-8.11.1-all.zip' "$ANDROID_ROOT/gradle/wrapper/gradle-wrapper.properties"
          grep -q 'namespace = "com.braseiro.dnd5e"' "$ANDROID_ROOT/app/build.gradle.kts"
          grep -q 'applicationId = "com.braseiro.dnd5e"' "$ANDROID_ROOT/app/build.gradle.kts"
          grep -q 'compileSdk = 35' "$ANDROID_ROOT/app/build.gradle.kts"
          chmod +x "$ANDROID_ROOT/gradlew"
          cd "$ANDROID_ROOT"
          ./gradlew --version --no-daemon
          echo "GRADLE_JDK_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 03 - Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          echo "ANDROID_SDK_OK" >> "$GITHUB_STEP_SUMMARY"

      - uses: gradle/actions/setup-gradle@v4

      - name: 04 - Validar Manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$ANDROID_ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'com.braseiro.dnd5e.MainActivity' "$MANIFEST"
          grep -q 'android.intent.action.MAIN' "$MANIFEST"
          grep -q 'android.intent.category.LAUNCHER' "$MANIFEST"
          grep -q 'VERSION_NAME=6.6.2' "$GITHUB_WORKSPACE/work/BRASEIRO_DND_6.6.2_ANDROID_STUDIO/version.properties"
          echo "MANIFEST_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 05 - Compilar resources AAPT
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:processDebugResources --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/aapt.log"
          echo "AAPT_RESOURCES_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 06 - Compilar Java Kotlin
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/javac.log"
          if ./gradlew :app:tasks --all --console=plain | grep -q '^compileDebugKotlin '; then
            ./gradlew :app:compileDebugKotlin --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/kotlin.log"
          fi
          echo "JAVA_KOTLIN_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 07 - Gerar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/assemble.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "$APK" "$GITHUB_WORKSPACE/deliverables/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/deliverables/$APK_NAME" | tee "$GITHUB_WORKSPACE/deliverables/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/deliverables/$APK_NAME" | tee "$GITHUB_WORKSPACE/deliverables/APK_BADGING.txt"
          grep -q "package: name='$PACKAGE_ID'" "$GITHUB_WORKSPACE/deliverables/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/deliverables/$APK_NAME" >/dev/null
          stat -c 'APK_BYTES=%s' "$GITHUB_WORKSPACE/deliverables/$APK_NAME" | tee "$GITHUB_WORKSPACE/deliverables/APK_SIZE.txt"
          echo "APK_VALIDATED_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 08 - Publicar APK final em Release e registrar deliverables
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title 'Braseiro DnD 6.6.2 RUN104 Debug' \
              --notes "Baseline SHA-256: $FROZEN_SHA256
          Package: $PACKAGE_ID
          RUN104: blue Master cancelled-attempt retry fix with stale trace reset. Diagnostic gates: structure, functional contract, Gradle/JDK, Manifest, AAPT/resources, Java/Kotlin, APK validation."

          gh release upload "$RELEASE_TAG" \
            "deliverables/$APK_NAME" \
            "deliverables/$APK_NAME.sha256" \
            "deliverables/APK_BADGING.txt" \
            "deliverables/APK_SIZE.txt" \
            --clobber

          RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url -q .url)"
          printf '%s\n' "$RELEASE_URL" > deliverables/APK_RELEASE_URL.txt
          printf '%s\n' "$FROZEN_SHA256" > deliverables/BASELINE_SHA256.txt
          cat > deliverables/README.md <<EOF
          # Braseiro DnD 6.6.2 deliverables

          APK: $APK_NAME
          Package: $PACKAGE_ID
          Baseline SHA-256: $FROZEN_SHA256
          Release: $RELEASE_URL

          The APK is stored as a GitHub Release asset because the application contains large bundled assets and may exceed GitHub's normal repository-file size limit.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/README.md deliverables/APK_RELEASE_URL.txt deliverables/BASELINE_SHA256.txt deliverables/"$APK_NAME.sha256" deliverables/APK_BADGING.txt deliverables/APK_SIZE.txt
          git commit -m 'deliverables(dnd): publish validated Android APK metadata [skip ci]' || true
          git push origin HEAD:main
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "DELIVERABLE=deliverables/$APK_NAME" >> "$GITHUB_STEP_SUMMARY"
 "$ROOT/version.properties"
          grep -q '^VERSION_CODE=606204
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 02b - Validar settings build wrapper JDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          grep -q 'include(":app")' "$ANDROID_ROOT/settings.gradle.kts"
          grep -q 'com.android.application.*8.9.1' "$ANDROID_ROOT/build.gradle.kts"
          grep -q 'distributionUrl=.*gradle-8.11.1-all.zip' "$ANDROID_ROOT/gradle/wrapper/gradle-wrapper.properties"
          grep -q 'namespace = "com.braseiro.dnd5e"' "$ANDROID_ROOT/app/build.gradle.kts"
          grep -q 'applicationId = "com.braseiro.dnd5e"' "$ANDROID_ROOT/app/build.gradle.kts"
          grep -q 'compileSdk = 35' "$ANDROID_ROOT/app/build.gradle.kts"
          chmod +x "$ANDROID_ROOT/gradlew"
          cd "$ANDROID_ROOT"
          ./gradlew --version --no-daemon
          echo "GRADLE_JDK_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 03 - Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          echo "ANDROID_SDK_OK" >> "$GITHUB_STEP_SUMMARY"

      - uses: gradle/actions/setup-gradle@v4

      - name: 04 - Validar Manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$ANDROID_ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'com.braseiro.dnd5e.MainActivity' "$MANIFEST"
          grep -q 'android.intent.action.MAIN' "$MANIFEST"
          grep -q 'android.intent.category.LAUNCHER' "$MANIFEST"
          grep -q 'VERSION_NAME=6.6.2' "$GITHUB_WORKSPACE/work/BRASEIRO_DND_6.6.2_ANDROID_STUDIO/version.properties"
          echo "MANIFEST_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 05 - Compilar resources AAPT
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:processDebugResources --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/aapt.log"
          echo "AAPT_RESOURCES_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 06 - Compilar Java Kotlin
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/javac.log"
          if ./gradlew :app:tasks --all --console=plain | grep -q '^compileDebugKotlin '; then
            ./gradlew :app:compileDebugKotlin --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/kotlin.log"
          fi
          echo "JAVA_KOTLIN_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 07 - Gerar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/assemble.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "$APK" "$GITHUB_WORKSPACE/deliverables/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/deliverables/$APK_NAME" | tee "$GITHUB_WORKSPACE/deliverables/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/deliverables/$APK_NAME" | tee "$GITHUB_WORKSPACE/deliverables/APK_BADGING.txt"
          grep -q "package: name='$PACKAGE_ID'" "$GITHUB_WORKSPACE/deliverables/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/deliverables/$APK_NAME" >/dev/null
          stat -c 'APK_BYTES=%s' "$GITHUB_WORKSPACE/deliverables/$APK_NAME" | tee "$GITHUB_WORKSPACE/deliverables/APK_SIZE.txt"
          echo "APK_VALIDATED_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 08 - Publicar APK final em Release e registrar deliverables
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title 'Braseiro DnD 6.6.2 Android Debug' \
              --notes "Baseline SHA-256: $FROZEN_SHA256
          Package: $PACKAGE_ID
          Diagnostic gates: structure, Gradle/JDK, Manifest, AAPT/resources, Java/Kotlin, APK validation."

          gh release upload "$RELEASE_TAG" \
            "deliverables/$APK_NAME" \
            "deliverables/$APK_NAME.sha256" \
            "deliverables/APK_BADGING.txt" \
            "deliverables/APK_SIZE.txt" \
            --clobber

          RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url -q .url)"
          printf '%s\n' "$RELEASE_URL" > deliverables/APK_RELEASE_URL.txt
          printf '%s\n' "$FROZEN_SHA256" > deliverables/BASELINE_SHA256.txt
          cat > deliverables/README.md <<EOF
          # Braseiro DnD 6.6.2 deliverables

          APK: $APK_NAME
          Package: $PACKAGE_ID
          Baseline SHA-256: $FROZEN_SHA256
          Release: $RELEASE_URL

          The APK is stored as a GitHub Release asset because the application contains large bundled assets and may exceed GitHub's normal repository-file size limit.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/README.md deliverables/APK_RELEASE_URL.txt deliverables/BASELINE_SHA256.txt deliverables/"$APK_NAME.sha256" deliverables/APK_BADGING.txt deliverables/APK_SIZE.txt
          git commit -m 'deliverables(dnd): publish validated Android APK metadata [skip ci]' || true
          git push origin HEAD:main
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "DELIVERABLE=deliverables/$APK_NAME" >> "$GITHUB_STEP_SUMMARY"
 "$ROOT/version.properties"
          echo "RUN104_FUNCTIONAL_CONTRACT_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 02 - Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 02b - Validar settings build wrapper JDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          grep -q 'include(":app")' "$ANDROID_ROOT/settings.gradle.kts"
          grep -q 'com.android.application.*8.9.1' "$ANDROID_ROOT/build.gradle.kts"
          grep -q 'distributionUrl=.*gradle-8.11.1-all.zip' "$ANDROID_ROOT/gradle/wrapper/gradle-wrapper.properties"
          grep -q 'namespace = "com.braseiro.dnd5e"' "$ANDROID_ROOT/app/build.gradle.kts"
          grep -q 'applicationId = "com.braseiro.dnd5e"' "$ANDROID_ROOT/app/build.gradle.kts"
          grep -q 'compileSdk = 35' "$ANDROID_ROOT/app/build.gradle.kts"
          chmod +x "$ANDROID_ROOT/gradlew"
          cd "$ANDROID_ROOT"
          ./gradlew --version --no-daemon
          echo "GRADLE_JDK_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 03 - Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          echo "ANDROID_SDK_OK" >> "$GITHUB_STEP_SUMMARY"

      - uses: gradle/actions/setup-gradle@v4

      - name: 04 - Validar Manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$ANDROID_ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'com.braseiro.dnd5e.MainActivity' "$MANIFEST"
          grep -q 'android.intent.action.MAIN' "$MANIFEST"
          grep -q 'android.intent.category.LAUNCHER' "$MANIFEST"
          grep -q 'VERSION_NAME=6.6.2' "$GITHUB_WORKSPACE/work/BRASEIRO_DND_6.6.2_ANDROID_STUDIO/version.properties"
          echo "MANIFEST_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 05 - Compilar resources AAPT
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:processDebugResources --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/aapt.log"
          echo "AAPT_RESOURCES_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 06 - Compilar Java Kotlin
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/javac.log"
          if ./gradlew :app:tasks --all --console=plain | grep -q '^compileDebugKotlin '; then
            ./gradlew :app:compileDebugKotlin --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/kotlin.log"
          fi
          echo "JAVA_KOTLIN_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 07 - Gerar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/assemble.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "$APK" "$GITHUB_WORKSPACE/deliverables/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/deliverables/$APK_NAME" | tee "$GITHUB_WORKSPACE/deliverables/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/deliverables/$APK_NAME" | tee "$GITHUB_WORKSPACE/deliverables/APK_BADGING.txt"
          grep -q "package: name='$PACKAGE_ID'" "$GITHUB_WORKSPACE/deliverables/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/deliverables/$APK_NAME" >/dev/null
          stat -c 'APK_BYTES=%s' "$GITHUB_WORKSPACE/deliverables/$APK_NAME" | tee "$GITHUB_WORKSPACE/deliverables/APK_SIZE.txt"
          echo "APK_VALIDATED_OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 08 - Publicar APK final em Release e registrar deliverables
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title 'Braseiro DnD 6.6.2 Android Debug' \
              --notes "Baseline SHA-256: $FROZEN_SHA256
          Package: $PACKAGE_ID
          Diagnostic gates: structure, Gradle/JDK, Manifest, AAPT/resources, Java/Kotlin, APK validation."

          gh release upload "$RELEASE_TAG" \
            "deliverables/$APK_NAME" \
            "deliverables/$APK_NAME.sha256" \
            "deliverables/APK_BADGING.txt" \
            "deliverables/APK_SIZE.txt" \
            --clobber

          RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url -q .url)"
          printf '%s\n' "$RELEASE_URL" > deliverables/APK_RELEASE_URL.txt
          printf '%s\n' "$FROZEN_SHA256" > deliverables/BASELINE_SHA256.txt
          cat > deliverables/README.md <<EOF
          # Braseiro DnD 6.6.2 deliverables

          APK: $APK_NAME
          Package: $PACKAGE_ID
          Baseline SHA-256: $FROZEN_SHA256
          Release: $RELEASE_URL

          The APK is stored as a GitHub Release asset because the application contains large bundled assets and may exceed GitHub's normal repository-file size limit.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/README.md deliverables/APK_RELEASE_URL.txt deliverables/BASELINE_SHA256.txt deliverables/"$APK_NAME.sha256" deliverables/APK_BADGING.txt deliverables/APK_SIZE.txt
          git commit -m 'deliverables(dnd): publish validated Android APK metadata [skip ci]' || true
          git push origin HEAD:main
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "DELIVERABLE=deliverables/$APK_NAME" >> "$GITHUB_STEP_SUMMARY"


  forbidden-lands-3-3-2:
    if: ${{ contains(github.event.head_commit.message, 'trigger forbidden lands 3.3.2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FL_TAG: 'FORBIDDEN-LANDS-3.3.2-TTS-IMAGE'
      FL_APK: 'BRASEIRO_FORBIDDEN_LANDS_3.3.2.apk'
      FL_SOURCE: 'Braseiro_Forbidden_Lands_3.3.2_TTS_IMAGE_PROMPT_PATCH_ANDROID_STUDIO.zip'
      FL_SHA: '83b99e4ced2f635b1c93d79c0dbb9ef5093545ea1c67cf8af2dc88331ce0061c'
      FIRE_API: 'https://api.firestorage.ai/dev/file'
      SHARE_ID: 'sJUeoArUdSIJ'
      FILE_ID: '01a0bd4313427307bc87a8337de35d13'

    steps:
      - name: FL - Checkout
        uses: actions/checkout@v4

      - name: FL - Baixar fonte 3.3.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fl-incoming fl-work fl-out
          curl -fsSL "$FIRE_API/shares/$SHARE_ID/files?maxResults=1000" -o /tmp/fl-files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/fl-files.json', encoding='utf-8'))
          wanted=os.environ['FILE_ID']
          if not any(str(x.get('fileId'))==wanted for x in (data.get('files') or [])):
              raise SystemExit('Fonte Forbidden Lands 3.3.2 não encontrada no share temporário')
          PY
          curl -fsSL -X POST "$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download" -o /tmp/fl-download.json
          URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/fl-download.json', encoding='utf-8')).get('downloadUrl') or '')
          PY
          )"
          test -n "$URL"
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 300 "$URL" -o "fl-incoming/$FL_SOURCE"
          echo "$FL_SHA  fl-incoming/$FL_SOURCE" | sha256sum -c -
          unzip -t "fl-incoming/$FL_SOURCE" >/dev/null
          unzip -q "fl-incoming/$FL_SOURCE" -d fl-work
          test -f fl-work/package.json
          test -f fl-work/android/gradlew
          echo "FL_ROOT=$GITHUB_WORKSPACE/fl-work" >> "$GITHUB_ENV"

      - name: FL - Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: FL - Instalar dependências
        shell: bash
        working-directory: ${{ env.FL_ROOT }}
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-timeout 120000
          npm ci --no-audit --no-fund

      - name: FL - Fixar versão 3.3.2
        shell: bash
        working-directory: ${{ env.FL_ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('package.json')
          d=json.loads(p.read_text(encoding='utf-8')); d['version']='3.3.2'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          g=Path('android/app/build.gradle')
          s=g.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 303002',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "3.3.2"',s,count=1)
          g.write_text(s,encoding='utf-8')
          PY

      - name: FL - Validar TypeScript e regras
        shell: bash
        working-directory: ${{ env.FL_ROOT }}
        run: |
          set -euo pipefail
          npm run lint
          npm run verify:start-freeze
          npm run verify:rules

      - name: FL - Recompilar web e sincronizar Android
        shell: bash
        working-directory: ${{ env.FL_ROOT }}
        run: |
          set -euo pipefail
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          grep -R -q 'Modelo TTS' android/app/src/main/assets/public/assets
          grep -R -q 'Prompt visual da cena' android/app/src/main/assets/public/assets

      - name: FL - Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: FL - Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: FL - Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: FL - Gerar APK
        shell: bash
        working-directory: ${{ env.FL_ROOT }}/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/fl-out/GRADLE_BUILD.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/fl-out/$FL_APK"

      - name: FL - Validar APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "fl-out/$FL_APK" >/dev/null
          sha256sum "fl-out/$FL_APK" > "fl-out/$FL_APK.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "fl-out/$FL_APK" | tee fl-out/APK_BADGING.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" fl-out/APK_BADGING.txt
          grep -q "versionCode='303002'" fl-out/APK_BADGING.txt
          grep -q "versionName='3.3.2'" fl-out/APK_BADGING.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "fl-out/$FL_APK" | tee fl-out/APK_SIGNATURE.txt

      - name: FL - Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Braseiro Forbidden Lands 3.3.2. TTS Gemini com modelo, voz e direção configuráveis. Modelo de imagem configurável. Imagem de cena manual ou automática, com prompt visual editável e retorno persistido no card. Runtime web recompilado e sincronizado com Android antes do APK.'
          gh release view "$FL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$FL_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Braseiro Forbidden Lands 3.3.2 — TTS + Imagem de Cena' --notes "$NOTES"
          gh release upload "$FL_TAG" "fl-out/$FL_APK" "fl-out/$FL_APK.sha256" fl-out/APK_BADGING.txt fl-out/APK_SIGNATURE.txt fl-out/GRADLE_BUILD.log --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$FL_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
