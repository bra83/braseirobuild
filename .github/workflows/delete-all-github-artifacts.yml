name: Delete ALL GitHub Actions Artifacts

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DELETE para confirmar'
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  delete-all-artifacts:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest

    steps:
      - name: Delete all artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Repository: $REPO"
          deleted=0

          while true; do
            ids="$(gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$REPO/actions/artifacts?per_page=100"               --jq '.artifacts[].id')"

            if [ -z "$ids" ]; then
              break
            fi

            count_this_page=0

            while IFS= read -r id; do
              if [ -z "$id" ]; then
                continue
              fi

              echo "Deleting artifact ID: $id"

              gh api                 --method DELETE                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "/repos/$REPO/actions/artifacts/$id"

              deleted=$((deleted + 1))
              count_this_page=$((count_this_page + 1))
            done <<< "$ids"

            if [ "$count_this_page" -eq 0 ]; then
              break
            fi
          done

          echo
          echo "======================================"
          echo "DONE"
          echo "Artifacts deleted: $deleted"
          echo "======================================"
