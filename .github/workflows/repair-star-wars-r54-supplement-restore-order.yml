name: Repair Star Wars R54 Supplement Restore Order
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-star-wars-r54-supplement-restore-order.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  repair-and-close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve supplement runtime across historical visual restore
        run: |
          set -euo pipefail
          P=star-wars/r54/fix_supplement_species_runtime.py
          python3 - "$P" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]);s=p.read_text('utf-8')
          old="""if MARKER not in rt:\n    end=rt.rfind('})();')\n    if end<0: raise SystemExit('runtime IIFE end missing')\n    rt=rt[:end]+js+'\\n'+rt[end:]\n"""
          new="""if MARKER not in rt:\n    # The historical visual restorer appends its own IIFE after the main runtime.\n    # Insert supplement integration into the main runtime IIFE, never inside the\n    # historical block, so a later visual refresh cannot truncate supplements.\n    hist=rt.find('/* R54 HISTORICAL VISUAL RESTORE')\n    prefix=rt[:hist] if hist>=0 else rt\n    end=prefix.rfind('})();')\n    if end<0: raise SystemExit('runtime IIFE end missing')\n    rt=rt[:end]+js+'\\n'+rt[end:]\n"""
          if old in s:
              s=s.replace(old,new,1);p.write_text(s,'utf-8');print('R54_SUPPLEMENT_RESTORE_ORDER_PATCHED')
          elif "hist=rt.find('/* R54 HISTORICAL VISUAL RESTORE')" in s:
              print('R54_SUPPLEMENT_RESTORE_ORDER_ALREADY_PATCHED')
          else:
              raise SystemExit('supplement insertion anchor not found')
          PY
          python3 -m py_compile "$P"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$P"
          git commit -m 'fix(star-wars-r54): preserve supplements across visual restore' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Dispatch integrated closeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/close-star-wars-r54-final.yml/dispatches" \
            -d '{"ref":"main"}'
          echo R54_CLOSEOUT_DISPATCHED_AFTER_SUPPLEMENT_ORDER_REPAIR
