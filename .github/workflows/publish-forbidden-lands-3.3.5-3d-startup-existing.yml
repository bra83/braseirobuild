name: Publish Forbidden Lands 3D Startup Hotfix Existing APK - BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-forbidden-lands-3.3.5-3d-startup-existing.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_ROOT: "D:\\brelga-forbidden-lands-3.3.5"
  PROJECT_ROOT: "D:\\brelga-forbidden-lands-3.3.5\\project"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX.apk"
  TAG: "forbidden-lands-3.3.5-3d-startup-hotfix"
  EXPECTED_SHA1: "9d0f1089b3fb6c225f1f59462750864e897c4d92"
  VERIFIED_RUN_ID: "37256432901"

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Configure Java and Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $javaRoot='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk'
          $javaDir=Get-ChildItem $javaRoot -Directory -Recurse -ErrorAction Stop |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\java.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $javaDir) { throw 'Java tool-cache not found' }
          $sdk='C:\actions-runner\android-sdk'
          if (-not (Test-Path $sdk)) { throw 'Android SDK not found' }
          "JAVA_HOME=$($javaDir.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PATH=$($javaDir.FullName)\bin;$env:PATH" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate exact existing APK
        id: apk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $built=Join-Path $env:PROJECT_ROOT 'android\app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path $built)) { throw "APK missing: $built" }
          $out=Join-Path $env:BUILD_ROOT 'hotfix-publish-out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apk=Join-Path $out $env:APK_NAME
          Copy-Item $built $apk -Force

          $bt=Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $aapt=Join-Path $bt.FullName 'aapt.exe'
          $signer=Join-Path $bt.FullName 'apksigner.bat'

          & $aapt dump badging $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_BADGING.txt')
          if ($LASTEXITCODE -ne 0) { throw 'aapt badging failed' }
          $badging=Get-Content (Join-Path $out 'APK_BADGING.txt') -Raw
          if ($badging -notmatch "package: name='com\.braseiro\.forbiddenlands'") { throw 'Wrong package' }
          if ($badging -notmatch "versionCode='303500'") { throw 'Wrong versionCode' }
          if ($badging -notmatch "versionName='3\.3\.5'") { throw 'Wrong versionName' }

          & $signer verify --verbose --print-certs $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_SIGNATURE.txt')
          if ($LASTEXITCODE -ne 0) { throw 'APK signature invalid' }
          $signature=Get-Content (Join-Path $out 'APK_SIGNATURE.txt') -Raw
          $m=[regex]::Match($signature,'Signer #1 certificate SHA-1 digest:\s*([0-9A-Fa-f:]+)')
          if (-not $m.Success) { throw 'Signer SHA-1 missing' }
          $actual=($m.Groups[1].Value -replace ':','').ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA1) { throw "Signer mismatch: $actual" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead($apk)
          try {
            $sb=New-Object System.Text.StringBuilder
            foreach($entry in $z.Entries) {
              if ($entry.FullName -like 'assets/public/assets/*.js') {
                $reader=New-Object IO.StreamReader($entry.Open(), [Text.Encoding]::UTF8)
                [void]$sb.AppendLine($reader.ReadToEnd())
                $reader.Dispose()
              }
            }
            $payload=$sb.ToString()
            foreach($needle in @(
              'Rolagem de dados em 3D',
              'dice3d-stage',
              'Preparando a abertura e preservando a continuidade',
              'timeout do cofre nativo no cold start',
              'bootDomEnhancements'
            )) {
              if (-not $payload.Contains($needle)) { throw "APK payload missing: $needle" }
            }
            if ($payload.Contains('sem bloquear a aventura')) { throw 'Old refinement loop payload still present' }
          } finally { $z.Dispose() }

          $hash=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content (Join-Path $out "$($env:APK_NAME).sha256") -Encoding ascii
          @(
            'STATUS=PASS',
            "VERIFIED_FULL_SUITE_RUN_ID=$env:VERIFIED_RUN_ID",
            "APK_SHA256=$hash",
            'PACKAGE=com.braseiro.forbiddenlands',
            'VERSION=3.3.5',
            "SIGNER_SHA1=$actual",
            'FULL_VERIFICATION_SUITE=PASS',
            'ANDROID_SYNC=PASS',
            'APK_BUILD=PASS',
            'BUGREPORT_COLD_START_FIX=PASS',
            'INITIAL_SCENE_NONBLOCKING=PASS',
            'DICE_3D=PASS',
            'DOM_EARLY_APPEND_GUARD=PASS',
            'SAFE_AREA_GUARD=PASS'
          ) | Set-Content (Join-Path $out 'FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX_PROOF.txt') -Encoding utf8
          "dir=$out" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$hash" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX
          path: |
            ${{ steps.apk.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX.apk
            ${{ steps.apk.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX.apk.sha256
            ${{ steps.apk.outputs.dir }}/APK_BADGING.txt
            ${{ steps.apk.outputs.dir }}/APK_SIGNATURE.txt
            ${{ steps.apk.outputs.dir }}/FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX_PROOF.txt
          retention-days: 30

      - name: Publish release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $headers=@{ Authorization="Bearer $env:GITHUB_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='BRELGA-FL335-HOTFIX' }
          $release=$null
          try { $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG" } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          if (-not $release) {
            $body='Bugreport-driven hotfix: cold start no longer waits indefinitely for NativeStateVault, opening skips remote planner/arbiter/refinement and has narrator timeout/fallback, early DOM/safe-area null guards, and animated 3D dice.'
            $payload=@{tag_name=$env:TAG;target_commitish='main';name='Braseiro Forbidden Lands 3.3.5 - 3D + Startup Hotfix';body=$body;draft=$false;prerelease=$false}|ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $payload -Uri "https://api.github.com/repos/$repo/releases"
          }
          $assets=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach($name in @($env:APK_NAME,"$($env:APK_NAME).sha256",'APK_BADGING.txt','APK_SIGNATURE.txt','FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX_PROOF.txt')) {
            $path=Join-Path $env:APK_DIR $name
            $old=$assets|Where-Object{$_.name -eq $name}|Select-Object -First 1
            if($old){Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($old.id)"|Out-Null}
            $mime=if($name -like '*.apk'){'application/vnd.android.package-archive'}else{'text/plain'}
            $url="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
            & curl.exe -L --fail -X POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: $mime" --data-binary "@$path" $url
            if($LASTEXITCODE -ne 0){throw "Release upload failed: $name"}
          }
          Write-Host "RELEASE_URL=$($release.html_url)"
