name: Build Tales Flood 1.3.16 ChatGPT Final APK

on:
  push:
    branches:
      - build/tales-1.3.16-apk-final
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tales-1.3.16-chatgpt-final-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Recover cumulative Tales/Flood 1.3.16 source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work dist
          mkdir -p incoming work dist
          gh release download TALES-1.3.8 --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip' --dir incoming
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip -d work
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          test -n "$ROOT"
          chmod +x "$ROOT/gradlew"
          python3 -m pip install --quiet pillow
          python3 tales-1.3.14-transform.py "$ROOT"
          python3 tales-1.3.16-final-transform.py "$ROOT"
          grep -q 'versionName = "1.3.16"' "$ROOT/app/build.gradle.kts"
          grep -q 'versionCode = 20' "$ROOT/app/build.gradle.kts"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Apply exact ChatGPT final overlay and verify asset parity
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          {
            cat tales-final-overlay/part00.txt
            cat tales-final-overlay/fix/part01_0.txt tales-final-overlay/fix/part01_1_0.txt tales-final-overlay/fix/part01_1_1.txt
            cat tales-final-overlay/part02.txt tales-final-overlay/part03.txt
            cat tales-final-overlay/fix/part04_0.txt tales-final-overlay/fix/part04_1.txt
            cat tales-final-overlay/part05.txt tales-final-overlay/part06.txt
            cat tales-final-overlay/fix/part07_0.txt tales-final-overlay/fix/part07_1.txt
            cat tales-final-overlay/part08.txt tales-final-overlay/part09.txt
            cat tales-final-overlay/fix/part10_0.txt tales-final-overlay/fix/part10_1.txt
            cat tales-final-overlay/part11.txt
            cat tales-final-overlay/fix/part12_0.txt tales-final-overlay/fix/part12_1_0.txt tales-final-overlay/fix/part12_1_1.txt
            cat tales-final-overlay/fix/part13_0_0.txt tales-final-overlay/fix/part13_0_1.txt tales-final-overlay/fix/part13_1_0.txt tales-final-overlay/fix/part13_1_1.txt
            cat tales-final-overlay/part14.txt
            cat tales-final-overlay/tail00.txt tales-final-overlay/tail01.txt tales-final-overlay/tail02.txt tales-final-overlay/tail03.txt tales-final-overlay/tail04.txt tales-final-overlay/tail05.txt
          } > /tmp/tales-1.3.16-chatgpt-final-overlay.py
          test "$(wc -c < /tmp/tales-1.3.16-chatgpt-final-overlay.py)" -eq 213510
          grep -q "EXPECTED='b3e7117fd1ec5e3e27a57066dcced281ca9716f42a61d4401cea0c8920fb2614'" /tmp/tales-1.3.16-chatgpt-final-overlay.py
          python3 /tmp/tales-1.3.16-chatgpt-final-overlay.py "$ROOT" | tee /tmp/final-overlay.log
          grep -q 'TALES 1.3.16 ChatGPT final overlay: OK' /tmp/final-overlay.log
          grep -q 'TEXT_FILES_OVERLAID=101' /tmp/final-overlay.log
          grep -q 'BINARY_FILES_VERIFIED=208' /tmp/final-overlay.log
          grep -q 'versionName = "1.3.16"' "$ROOT/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run final unit regression
        working-directory: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=failed=errors=0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root=ET.parse(path).getroot()
              total += int(root.attrib.get('tests',0))
              failed += int(root.attrib.get('failures',0))
              errors += int(root.attrib.get('errors',0))
          print(f'UNIT_TESTS={total} FAILURES={failed} ERRORS={errors}')
          assert total > 0 and failed == 0 and errors == 0
          PY

      - name: Lint and assemble installable debug APK
        working-directory: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew lintDebug assembleDebug --no-daemon
          test -f app/build/reports/lint-results-debug.html
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK structure, signature, alignment and secret hygiene
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -q AndroidManifest.xml /tmp/apk-list.txt
          grep -q classes.dex /tmp/apk-list.txt
          grep -q resources.arsc /tmp/apk-list.txt
          rm -f /tmp/classes*.dex
          unzip -j "$APK" 'classes*.dex' -d /tmp >/dev/null
          if strings /tmp/classes*.dex | grep -Eq 'AIza[0-9A-Za-z_-]{20,}'; then
            echo 'FAIL: possible embedded Google API key detected'
            exit 1
          fi
          cp "$APK" dist/BRASEIRO_TALES_VTT_1.3.16-debug.apk
          sha256sum dist/BRASEIRO_TALES_VTT_1.3.16-debug.apk | tee dist/BRASEIRO_TALES_VTT_1.3.16-debug.apk.sha256
          stat -c 'APK_BYTES=%s' dist/BRASEIRO_TALES_VTT_1.3.16-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_TALES_VTT_1.3.16_APK
          path: |
            dist/BRASEIRO_TALES_VTT_1.3.16-debug.apk
            dist/BRASEIRO_TALES_VTT_1.3.16-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
