name: Extract Tales 1.3.10 Runtime Files

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-tales-1.3.10-runtime-files.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current 1.3.10 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work audit/tales-1.3.10-current
          mkdir -p incoming work audit/tales-1.3.10-current
          gh release download TALES-1.3.8 --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip' --dir incoming
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip -d work
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          python3 -m pip install --quiet pillow
          python3 tales-1.3.10-transform.py "$ROOT"
          for rel in \
            app/src/main/java/com/braseiro/talesvtt/screens/MapScreen.kt \
            app/src/main/java/com/braseiro/talesvtt/game/TalesCore.kt \
            app/src/main/java/com/braseiro/talesvtt/game/GameViewModel.kt \
            app/src/main/java/com/braseiro/talesvtt/game/GameSnapshotCodec.kt \
            app/src/main/java/com/braseiro/talesvtt/components/NarrationTts.kt \
            app/src/main/java/com/braseiro/talesvtt/navigation/AppNavGraph.kt; do
            mkdir -p "audit/tales-1.3.10-current/$(dirname "$rel")"
            cp "$ROOT/$rel" "audit/tales-1.3.10-current/$rel"
          done
      - name: Save current subset
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/tales-1.3.10-current
          git commit -m 'Extract Tales 1.3.10 runtime subset' || exit 0
          git push
