name: DnD Startup Async Catalogs 6.6.30 CI
on:
  push:
    branches:
      - fix/dnd-startup-catalogs-off-main-20261031
    paths:
      - '.github/workflows/dnd-narrative-leak-pr77-check.yml'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/MasterOrchestrator.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/AppExecutors.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/BarbaraStartupLazyTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PROJECT: dnd-normal/run247-mod005
    steps:
      - name: Checkout D&D canonical source
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK 35
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set candidate version for installability
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('dnd-normal/run247-mod005/version.properties')
          s = p.read_text(encoding='utf-8')
          assert 'VERSION_CODE=606548' in s and 'VERSION_NAME=6.6.15-v1-3core-20261016' in s, 'unexpected baseline'
          code = 203100000 + int(os.environ['GITHUB_RUN_NUMBER'])
          s=s.replace('VERSION_CODE=606548',f'VERSION_CODE={code}')
          s=s.replace('VERSION_NAME=6.6.15-v1-3core-20261016','VERSION_NAME=6.6.30-startup-async-catalogs-rc')
          p.write_text(s,encoding='utf-8')
          print('CANDIDATE_VERSION_CODE',code)
          PY
          test -f "$PROJECT/signing/debug.keystore"
      - name: Compile Android Java
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --console=plain
      - name: Startup regression tests
        working-directory: ${{ env.PROJECT }}
        run: ./gradlew :app:testDebugUnitTest --tests com.braseiro.dnd5e.BarbaraStartupLazyTest --no-daemon --console=plain
      - name: All JVM tests
        working-directory: ${{ env.PROJECT }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build full signed debug APK
        working-directory: ${{ env.PROJECT }}
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Verify APK package and signature
        run: |
          set -euo pipefail
          mkdir -p apk-pr77
          APK="$(find "$PROJECT/app/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -s "$APK"
          cp "$APK" "apk-pr77/BRASEIRO_DND_6.6.30_STARTUP_ASYNC_RC.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "apk-pr77/BRASEIRO_DND_6.6.30_STARTUP_ASYNC_RC.apk" > apk-pr77/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "apk-pr77/BRASEIRO_DND_6.6.30_STARTUP_ASYNC_RC.apk" > apk-pr77/BADGING.txt
          grep -q "package: name='com.braseiro.dnd5e'" apk-pr77/BADGING.txt
          (cd apk-pr77 && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload candidate and test proof
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-DND-STARTUP-ASYNC-6-6-30
          path: apk-pr77/*
          retention-days: 7
          if-no-files-found: error
