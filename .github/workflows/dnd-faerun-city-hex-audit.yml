name: DnD Faerun City Hex Audit
on:
  push:
    branches:
      - feature/dnd-wilem-cookbook-20261029
    paths:
      - '.github/workflows/dnd-faerun-city-hex-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-bundled-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect atlas async installation completion branch
        shell: bash
        run: |
          root=dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e
          echo '<<<MAP_ASYNC_METHOD>>>'
          sed -n '10002,10055p' "$root/MainActivity.java"
          echo '<<<STRIX_EXIT_UI_HANDLERS>>>'
          sed -n '1328,1335p' "$root/MainActivity.java"
          sed -n '1667,1675p' "$root/MainActivity.java"
      - name: Locate async atlas install callback and showMap method
        shell: bash
        run: |
          set -euo pipefail
          root=dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e
          echo '<<<ASYNC_ATLAS_INSTALL>>>'
          grep -nE 'void ensureBundledMapForProfileAsync|ensureBundledMapForProfileAsync\(|void showMap\(|void showCampaign\(' "$root/MainActivity.java" | head -45
          echo '<<<MAP_INSTALL_BLOCK>>>'
          grep -nE -C 12 'private void ensureBundledMapForProfileAsync' "$root/MainActivity.java" | head -55 || true
          echo '<<<SHOW_MAP_BLOCK>>>'
          grep -nE -C 6 'private void showMap\(' "$root/MainActivity.java" | head -30 || true
          echo '<<<APPDB_ATLAS_NEIGHBOR>>>'
          sed -n '7252,7274p' "$root/AppDb.java"
      - name: Inspect complete exit method and AppDb atlas mutators
        shell: bash
        run: |
          set -euo pipefail
          root=dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e
          echo '<<<MAINACTIVITY_EXIT>>>'
          sed -n '1228,1290p' "$root/MainActivity.java"
          echo '<<<APPDB_ATLAS_API>>>'
          grep -nE 'void saveAtlasPositionForProfile|void saveMapPackageStateForProfile|void saveSceneState|JSONObject getMapState|void saveMapTravelStateForProfile|boolean isValidMapHex|JSONObject getRawMapHex|void saveAtlasPosition|void saveMapState|JSONObject getMapPackageAny|setActiveMapProfile|String getActiveMapProfile' "$root/AppDb.java" | head -90
          echo '<<<MAPBOARD_CALLERS>>>'
          grep -nE 'saveAtlasPositionForProfile|saveMapPackageStateForProfile|saveMapTravelStateForProfile|saveAtlasPosition|current_hex_id' "$root/MapBoardView.java" "$root/MainActivity.java" | head -95
      - name: Inspect actual Faerun exit call sites and map movement API
        shell: bash
        run: |
          set -euo pipefail
          root=dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e
          echo 'EXIT_PATH_REFERENCES'
          grep -RnE -C 13 'StrixhavenSceneBoundary.returnToFaerun|exitToFaerun\(|\.graduate\(|returnToFaerun\(' "$root" | head -210 || true
          echo 'MAP_MOVEMENT_SIGNATURES'
          grep -nE 'saveAtlasPositionForProfile|saveMapTravelStateForProfile|setCurrentHex|saveMapState|saveAtlasPosition|current_hex_id' "$root/StrixhavenSceneBoundary.java" "$root/MapPackageManager.java" "$root/MapBoardView.java" "$root/StrixhavenAdventureProfile.java" | head -75 || true
      - name: Locate canonical city and hex records without rewriting the atlas
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile,json,os
          p='dnd-normal/run247-mod005/app/src/main/assets/maps/PACOTE_MAPA_FAERUN_2025_PTBR_MAX_V2.zip'
          with zipfile.ZipFile(p) as z:
            names=z.namelist()
            print('ZIP_ENTRIES',len(names),flush=True)
            interest=[n for n in names if any(s in n.lower() for s in ('location','local','profile','map_manifest','canonical_catalog'))]
            print('ATLAS_MEMBERS', json.dumps([(n,z.getinfo(n).file_size) for n in interest[:50]],ensure_ascii=False),flush=True)
            targets=('yartar','triboar','waterdeep','westbridge','red larch','newarre','amphail')
            def scan(value,parent='',depth=0):
              if depth>7:return
              if isinstance(value,dict):
                name=str(value.get('name',value.get('nome',value.get('label',''))))
                if any(t in name.casefold() for t in targets):
                  wanted={k:v for k,v in value.items() if k in ('name','nome','id','type','tipo','region','hexId','hex_id','canonicalPosition','packagePlacement','placement','population','populacao','location')}
                  print('CITY_RECORD',json.dumps(wanted,ensure_ascii=False)[:2400],flush=True)
                for k,v in value.items():
                  if isinstance(v,(dict,list)):scan(v,parent+'/'+k,depth+1)
              elif isinstance(value,list):
                for v in value:scan(v,parent,depth+1)
            for n in interest:
              if not n.lower().endswith('.json') or z.getinfo(n).file_size>45_000_000:continue
              try:
                data=json.loads(z.read(n))
                print('SCAN_JSON',n,z.getinfo(n).file_size,flush=True)
                scan(data)
                if 'profile' in n.lower() and isinstance(data,dict):
                  print('GRID_PROFILE',json.dumps(data.get('grid',{}),ensure_ascii=False)[:1500],flush=True)
              except Exception as exc:
                print('CANNOT_PARSE',n,str(exc)[:200],flush=True)
          PY
