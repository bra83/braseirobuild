name: Braseiro DnD NORMAL RUN245 BRELGA build
on:
  push:
    branches: [dnd/run245-normal-g05-codex]
    paths:
      - '.github/workflows/dnd-run245-normal-brelga.yml'
      - 'ci/dnd-run245/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dnd-run245-normal-brelga
  cancel-in-progress: false
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verify the designated runner and clean isolated scratch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'RUNNER_NOT_BRELGA'}
          $root=Join-Path $env:RUNNER_TEMP 'dnd245-normal'
          if(Test-Path $root){Remove-Item -LiteralPath $root -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $volume=(Get-Item $env:RUNNER_TEMP).PSDrive
          Write-Host ("RUN245_BRELGA_FREE_GB={0:N2}" -f ($volume.Free/1GB))
          if($volume.Free -lt 2GB){throw 'RUN245_INSUFFICIENT_DISK_SPACE'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and verify the exact recovered RUN245 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'dnd245-normal'
          $out=Join-Path $root 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & python -m pip install --disable-pip-version-check gdown==5.2.0
          if($LASTEXITCODE -ne 0){throw 'GDOWN_DEPENDENCY_INSTALL_FAILED'}
          $fetchLog=Join-Path $out 'source-fetch.log'
          $fetchErr=Join-Path $out 'source-fetch.err'
          $proc=Start-Process -FilePath 'python' -ArgumentList @('ci/dnd-run245/fetch_source.py','--output',$root) -WorkingDirectory $env:GITHUB_WORKSPACE -NoNewWindow -Wait -PassThru -RedirectStandardOutput $fetchLog -RedirectStandardError $fetchErr
          Get-Content $fetchLog -ErrorAction SilentlyContinue
          Get-Content $fetchErr -ErrorAction SilentlyContinue
          if($proc.ExitCode -ne 0){throw "RUN245_SOURCE_DOWNLOAD_OR_SHA256_FAILED rc=$($proc.ExitCode)"}
          Copy-Item (Join-Path $root 'SOURCE_VERIFY.txt') $out -Force
      - name: Apply source-pinned verified G05 action patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'dnd245-normal'
          $out=Join-Path $root 'out'
          $project=Join-Path $root 'project'
          $patchEncoded=Join-Path $env:GITHUB_WORKSPACE 'ci/dnd-run245/patches/RUN245_G05_BRAIN_RENDING_BITE.patch.b64'
          $patch=Join-Path $root 'RUN245_G05_BRAIN_RENDING_BITE.patch'
          & python -c "import base64,pathlib,sys; pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(''.join(pathlib.Path(sys.argv[1]).read_text(encoding='ascii').split()),validate=True))" $patchEncoded $patch
          if($LASTEXITCODE -ne 0){throw 'G05_PATCH_BASE64_DECODE_FAILED'}
          $expected='5dec75a1e19c8be9f1f091fc530e5e302d3602540a9c2415da061ba13f8c5f46'
          $actual=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "G05_PATCH_SHA256_MISMATCH expected=$expected actual=$actual"}
          $git=Get-Command git -ErrorAction Stop
          & $git.Source -C $project init --quiet
          if($LASTEXITCODE -ne 0){throw 'G05_PATCH_GIT_INIT_FAILED'}
          & $git.Source -C $project -c core.autocrlf=false apply --check $patch
          if($LASTEXITCODE -ne 0){throw 'G05_PATCH_APPLY_CHECK_FAILED'}
          & $git.Source -C $project -c core.autocrlf=false apply $patch
          if($LASTEXITCODE -ne 0){throw 'G05_PATCH_APPLY_FAILED'}
          $wireLog=Join-Path $out 'G05_STATIC_WIRING.log'
          $save=$ErrorActionPreference;$ErrorActionPreference='Continue'
          & python -X utf8 (Join-Path $project 'G05_EVIDENCE/test_run245_wiring.py') 2>&1 | Tee-Object $wireLog
          $wireRc=$LASTEXITCODE;$ErrorActionPreference=$save
          "G05_STATIC_WIRING_EXIT_CODE=$wireRc" | Add-Content (Join-Path $out 'BRELGA_STATUS.txt')
          if($wireRc -ne 0){throw 'G05_STATIC_WIRING_FAILED'}
          "G05_PATCH_SHA256=$actual" | Add-Content (Join-Path $out 'BRELGA_STATUS.txt')
          'G05_PATCH_APPLY=PASS' | Add-Content (Join-Path $out 'BRELGA_STATUS.txt')
          'G05_STATIC_WIRING=PASS; ROBOLECTRIC=NOT_YET_RUN; PATCH_BYTES_PINNED=YES' | Add-Content (Join-Path $out 'BRELGA_STATUS.txt')
          Remove-Item -LiteralPath (Join-Path $project '.git') -Recurse -Force
      - name: Restore SHA-pinned NORMAL runtime sources from verified RUN220
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'dnd245-normal'
          $out=Join-Path $root 'out'
          $project=Join-Path $root 'project'
          $recovery=Join-Path $env:GITHUB_WORKSPACE 'ci/dnd-run245/recovered'
          $entries=@{
            'UiResponsivenessMonitor.java'='e015cb17f74231b2e25b81b031b9bf6e890c916243b9858de6685b428063d3cf'
            'VoloSubraceHandbookEngine.java'='356bb5ce6616789b54f98d15236e969aa22e7a3ce6ca3cb4a5e89f3d19a90107'
            'VoloRacialFeatRuntimeEngine.java'='650d45596965da740f566531024179affe9dd827a43a17305fdb690f606bc7a3'
            'TwoWeaponFightingRules.java'='bcc7f9bbb7c57b556b3df7f09e1a38d2b9b3e217c4e529de26ef29c1ee692a49'
          }
          foreach($name in $entries.Keys){
            $source=Join-Path $recovery $name
            $canonical=[IO.File]::ReadAllText($source).Replace("`r`n","`n").Replace("`r","`n")
            $normalized=Join-Path $env:RUNNER_TEMP ("normalized-"+$name)
            [IO.File]::WriteAllText($normalized,$canonical,(New-Object System.Text.UTF8Encoding($false)))
            $actual=(Get-FileHash $normalized -Algorithm SHA256).Hash.ToLowerInvariant()
            Remove-Item -LiteralPath $normalized -Force
            if($actual -ne $entries[$name]){throw "RUN220_RECOVERY_SHA256_MISMATCH $name expected=$($entries[$name]) actual=$actual"}
            $target=Join-Path $project "app\src\main\java\com\braseiro\dnd5e\$name"
            Copy-Item -LiteralPath $source -Destination $target -Force
            "RUN220_RECOVERY_FILE=$name SHA256=$actual" | Add-Content (Join-Path $out 'BRELGA_STATUS.txt')
          }
          Copy-Item -LiteralPath (Join-Path $recovery 'RUN220_RECOVERY_SOURCE_MANIFEST.json') -Destination $out -Force
          'RUN220_RECOVERY=SHA256_PINNED_CLASSES_INTEGRATED' | Add-Content (Join-Path $out 'BRELGA_STATUS.txt')
      - name: Compile and run Android unit tests on BRELGA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'dnd245-normal'
          $out=Join-Path $root 'out'
          $project=Join-Path $root 'project'
          if(!$env:ANDROID_HOME){
            $sdk="$env:LOCALAPPDATA\Android\Sdk"
            if(Test-Path $sdk){$env:ANDROID_HOME=$sdk}
          }
          if(!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)){throw 'ANDROID_SDK_NOT_FOUND'}
          $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          if(!(Test-Path (Join-Path $project 'gradlew.bat'))){throw 'RUN245_GRADLE_WRAPPER_NOT_FOUND'}
          Set-Location $project
          foreach($task in @(':app:compileDebugJavaWithJavac',':app:testDebugUnitTest',':app:assembleDebug')){
            $label=$task -replace '[^A-Za-z]','_'
            $save=$ErrorActionPreference;$ErrorActionPreference='Continue'
            & .\gradlew.bat $task --no-daemon --console=plain --stacktrace 2>&1 | Tee-Object (Join-Path $out "$label.log")
            $rc=$LASTEXITCODE;$ErrorActionPreference=$save
            "$task EXIT_CODE=$rc" | Add-Content (Join-Path $out 'BRELGA_STATUS.txt')
          }
          $failed=Get-Content (Join-Path $out 'BRELGA_STATUS.txt') | Where-Object {$_ -match '^:app:.* EXIT_CODE=[1-9]'}
          if($failed){throw ('GRADLE_TASKS_FAILED: '+($failed -join '; '))}
          $apk=Get-ChildItem (Join-Path $project 'app\build\outputs\apk\debug') -Filter '*.apk' -File | Select-Object -First 1
          if(!$apk){throw 'RUN245_DEBUG_APK_NOT_FOUND'}
          $final=Join-Path $out 'BRASEIRO_DND_NORMAL_RUN245_UNCERTIFIED_DEBUG.apk'
          Copy-Item $apk.FullName $final -Force
          $bt=Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
          if(!$bt){throw 'ANDROID_BUILD_TOOLS_MISSING'}
          $badging=(& "$($bt.FullName)\aapt.exe" dump badging $final) -join "`n"
          $badging | Set-Content (Join-Path $out 'APK_BADGING.txt')
          if($badging -notmatch "package: name='com\\.braseiro\\.dnd5e'" -or $badging -notmatch "versionCode='606545'"){throw 'RUN245_APK_IDENTITY_MISMATCH'}
          $save=$ErrorActionPreference;$ErrorActionPreference='Continue'
          & "$($bt.FullName)\apksigner.bat" verify --verbose --print-certs $final 2>&1 | Tee-Object (Join-Path $out 'APK_SIGNATURE.txt')
          $rc=$LASTEXITCODE;$ErrorActionPreference=$save
          if($rc -ne 0){throw 'RUN245_DEBUG_APK_SIGNATURE_INVALID'}
          $sha=(Get-FileHash $final -Algorithm SHA256).Hash.ToLowerInvariant()
          "APK_SHA256=$sha" | Add-Content (Join-Path $out 'BRELGA_STATUS.txt')
          'APK_BUILD=PASS; UPDATE_SIGNING_MATCH=NOT_VERIFIED; G05_COMPLETE=NO' | Add-Content (Join-Path $out 'BRELGA_STATUS.txt')
      - name: Preserve BRELGA build and unit test diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'dnd245-normal'
          $out=Join-Path $root 'out'
          $project=Join-Path $root 'project'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach($relative in @('app\build\reports\tests\testDebugUnitTest','app\build\test-results\testDebugUnitTest','app\build\outputs\apk\debug')){
            $source=Join-Path $project $relative
            if(Test-Path $source){
              $dest=Join-Path $out (Split-Path $relative -Leaf)
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item (Join-Path $source '*') $dest -Recurse -Force
            }
          }
          if(Test-Path (Join-Path $out 'BRELGA_STATUS.txt')){Get-Content (Join-Path $out 'BRELGA_STATUS.txt') | Write-Host}
          Get-ChildItem $out -File -Recurse | ForEach-Object {Write-Host ("PRESERVED_FILE={0} SIZE={1}" -f $_.FullName,$_.Length)}
      - name: Upload BRELGA test reports, APK and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_DND_NORMAL_RUN245_BRELGA_${{ github.run_id }}
          path: ${{ runner.temp }}/dnd245-normal/out/**
          if-no-files-found: error
          retention-days: 14
