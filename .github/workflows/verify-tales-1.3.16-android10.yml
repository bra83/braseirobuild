name: Verify Tales Flood 1.3.16 Android 10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-tales-1.3.16-android10.yml"

permissions:
  contents: write

jobs:
  android10:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Recover exact final source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work
          mkdir -p incoming work
          gh release download TALES-1.3.8 --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip' --dir incoming
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip -d work
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          test -n "$ROOT"
          chmod +x "$ROOT/gradlew"
          python3 -m pip install --quiet pillow
          python3 tales-1.3.14-transform.py "$ROOT"
          python3 tales-1.3.16-final-transform.py "$ROOT" >/tmp/tales-android10-transform.txt
          grep -q 'TALES/FLOOD 1.3.16 final source transform: OK' /tmp/tales-android10-transform.txt
          grep -q 'versionName = "1.3.16"' "$ROOT/app/build.gradle.kts"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK and Android 10 image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-29;google_apis;x86_64"
          test -x "$ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -version | head -n 2
      - uses: gradle/actions/setup-gradle@v4

      - name: Build final internal debug APK
        working-directory: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature and zip alignment
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q 'Verifies' /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK" | tee /tmp/zipalign.txt
          grep -q 'Verification successful' /tmp/zipalign.txt

      - name: Boot clean Android 10 emulator
        run: |
          set -euo pipefail
          EMU="$ANDROID_HOME/emulator/emulator"
          test -x "$EMU"
          echo no | avdmanager create avd --force --name tales_api29 --package "system-images;android-29;google_apis;x86_64" --device "pixel_2"
          adb start-server

          boot_wait() {
            local seconds="$1"
            for i in $(seq 1 "$seconds"); do
              if adb get-state >/dev/null 2>&1 && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                echo "ANDROID10_BOOT_SECONDS=$i"
                return 0
              fi
              if ! pgrep -f 'emulator.*tales_api29' >/dev/null 2>&1; then
                echo 'Android 10 emulator process exited before boot.'
                return 1
              fi
              sleep 1
            done
            return 1
          }

          launch_emulator() {
            local accel="$1"
            rm -f /tmp/emulator29.log
            nohup "$EMU" @tales_api29 \
              -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot \
              -camera-back none -camera-front none -cores 2 -memory 2048 \
              -accel "$accel" >/tmp/emulator29.log 2>&1 &
          }

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            launch_emulator on
            if ! boot_wait 180; then
              tail -200 /tmp/emulator29.log || true
              adb emu kill >/dev/null 2>&1 || true
              pkill -f 'emulator.*tales_api29' >/dev/null 2>&1 || true
              sleep 3
              launch_emulator off
              boot_wait 420 || { tail -300 /tmp/emulator29.log || true; exit 1; }
            fi
          else
            launch_emulator off
            boot_wait 420 || { tail -300 /tmp/emulator29.log || true; exit 1; }
          fi
          adb shell getprop ro.build.version.sdk | grep -qx 29
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install launch and relaunch on Android 10
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          adb install -r "$APK"
          adb logcat -c
          adb shell monkey -p com.braseiro.talesvtt -c android.intent.category.LAUNCHER 1 >/tmp/api29-start.txt
          sleep 5
          PID=$(adb shell pidof com.braseiro.talesvtt | tr -d '\r')
          test -n "$PID"
          adb shell uiautomator dump /sdcard/window29.xml >/dev/null
          adb pull /sdcard/window29.xml /tmp/tales-api29.xml >/dev/null
          grep -q 'TALES' /tmp/tales-api29.xml
          for i in $(seq 1 5); do
            adb shell am force-stop com.braseiro.talesvtt
            adb shell monkey -p com.braseiro.talesvtt -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 2
            PID=$(adb shell pidof com.braseiro.talesvtt | tr -d '\r')
            test -n "$PID"
            echo "ANDROID10_RELAUNCH_$i=PASS PID=$PID"
          done
          adb logcat -d >/tmp/tales-api29-logcat.txt
          if grep -A25 -B5 'FATAL EXCEPTION' /tmp/tales-api29-logcat.txt | grep -q 'com.braseiro.talesvtt'; then
            echo 'FAIL: app fatal exception on Android 10'
            grep -A25 -B5 'FATAL EXCEPTION' /tmp/tales-api29-logcat.txt || true
            exit 1
          fi

      - name: Save Android 10 evidence
        run: |
          set -euo pipefail
          REPORT=audit/tales-1.3.16-dev-current/ANDROID10_COMPATIBILITY.md
          cat > "$REPORT" <<EOF
          # Android 10 compatibility — Tales/Flood 1.3.16

          - Workflow: $GITHUB_RUN_ID
          - Final source versionName 1.3.16: PASS.
          - APK signature verification (apksigner): PASS.
          - ZIP alignment verification (zipalign): PASS.
          - Clean Android 10 / API 29 emulator boot: PASS.
          - Install and launcher start: PASS.
          - Visible Tales UI detected through UIAutomator: PASS.
          - 5 force-stop/relaunch cycles: PASS.
          - Fatal-exception scan: PASS.
          - APK used only for internal verification and NOT delivered.
          EOF
          printf '\n## Evidência Android 10 — compatibility gate\n- assinatura + zipalign + API 29 install/start + 5 relaunches sem fatal exception: PASS no workflow %s.\n' "$GITHUB_RUN_ID" >> TALES_RETOMADA_CURRENT.md
          cp TALES_RETOMADA_CURRENT.md audit/tales-1.3.16-dev-current/TALES_RETOMADA_CURRENT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT" TALES_RETOMADA_CURRENT.md audit/tales-1.3.16-dev-current/TALES_RETOMADA_CURRENT.md
          git commit -m 'Record Tales Flood Android 10 compatibility' || exit 0
          git restore .
          git pull --rebase origin main
          git push
