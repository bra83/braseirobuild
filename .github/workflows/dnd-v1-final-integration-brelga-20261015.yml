name: DND V1 BASE - final Antigravity integration (BRELGA)
on:
  push:
    branches:
      - implementation/dnd-v1-base-final-20261015
    paths:
      - '.github/workflows/dnd-v1-final-integration-brelga-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-v1-final-integration-brelga-20261015
  cancel-in-progress: false
jobs:
  validate:
    name: Final three megablocks - targeted + full Android
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 85
    steps:
      - name: Check exact SHA and runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'WRONG_RUNNER'}
          Write-Host ('V1_ANTIGRAVITY_EXACT_SHA='+$env:GITHUB_SHA)
          Write-Host 'V1_SCOPE=XPHB_2024_XDMG_2024_XMM_2025'
          Write-Host 'V1_NO_APK_NO_MERGE=YES'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Pin Android toolchain without modifying shared caches
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          if(!(Test-Path 'gradlew.bat')){throw 'GRADLE_WRAPPER_MISSING'}
          $java='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if(Test-Path $java){
            Add-Content -Path $env:GITHUB_ENV -Value ('JAVA_HOME='+$java)
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $java 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if(!$sdk -or !(Test-Path $sdk)){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if(!(Test-Path $sdk)){throw 'ANDROID_SDK_MISSING'}
          Add-Content -Path $env:GITHUB_ENV -Value ('ANDROID_HOME='+$sdk)
          Add-Content -Path $env:GITHUB_ENV -Value ('ANDROID_SDK_ROOT='+$sdk)
          $base=Join-Path $env:USERPROFILE '.gradle'
          $gradle=Join-Path $env:RUNNER_TEMP ('dnd-v1-final-gradle-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $gradle | Out-Null
          foreach($item in @('wrapper','caches')){
            $source=Join-Path $base $item
            $target=Join-Path $gradle $item
            if((Test-Path $source)-and !(Test-Path $target)){
              New-Item -ItemType Junction -Path $target -Target $source | Out-Null
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value ('GRADLE_USER_HOME='+$gradle)
          Write-Host 'V1_RUNNER_READY=YES'
      - name: Three new integration suites (Robolectric SQLite)
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          $classes=@(
            'com.braseiro.dnd5e.V1CorePlayableFlowRobolectricTest',
            'com.braseiro.dnd5e.XmmManualArbitrationBridgeRobolectricTest',
            'com.braseiro.dnd5e.V1ManualBackupIsolationRobolectricTest'
          )
          $argsList=@(':app:testDebugUnitTest','--no-daemon','--console=plain','--stacktrace')
          foreach($c in $classes){$argsList+=@('--tests',$c)}
          & .\gradlew.bat @argsList
          $exit=$LASTEXITCODE
          $total=0;$fail=0;$errors=0;$skipped=0
          foreach($c in $classes){
            $xml=Join-Path $dir ('TEST-'+$c+'.xml')
            if(!(Test-Path $xml)){Write-Host ('V1_REQUIRED_XML_MISSING='+$c);$fail++;continue}
            [xml]$r=Get-Content -LiteralPath $xml -Raw
            $total += [int]$r.testsuite.tests
            $fail += [int]$r.testsuite.failures
            $errors += [int]$r.testsuite.errors
            $skipped += [int]$r.testsuite.skipped
            foreach($node in @($r.SelectNodes('//testcase/failure | //testcase/error'))){
              Write-Host ('V1_FAILED_TEST='+$node.ParentNode.GetAttribute('classname')+'::'+$node.ParentNode.GetAttribute('name'))
              Write-Host ('V1_FAILURE_MESSAGE='+$node.GetAttribute('message'))
              $stack=[string]$node.InnerText
              Write-Host ('V1_FAILURE_TRACE='+$stack.Substring(0,[Math]::Min(1600,$stack.Length)))
            }
          }
          Write-Host ('V1_NEW_SUITES_TESTS='+$total+' FAIL='+$fail+' ERR='+$errors+' SKIP='+$skipped)
          if($exit -ne 0 -or $total -lt 3 -or $fail -ne 0 -or $errors -ne 0 -or $skipped -ne 0){throw 'V1_MEGABLOCK_E2E_FAILED'}
          Write-Host 'V1_MEGABLOCK_E2E=PASS'
      - name: Complete Android suite at exact integrated SHA
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
          $exit=$LASTEXITCODE
          $reports=@()
          if(Test-Path $dir){$reports=@(Get-ChildItem -LiteralPath $dir -Filter 'TEST-*.xml' -File)}
          $total=0;$fail=0;$errors=0;$skipped=0
          foreach($file in $reports){
            [xml]$r=Get-Content -LiteralPath $file.FullName -Raw
            $total += [int]$r.testsuite.tests
            $fail += [int]$r.testsuite.failures
            $errors += [int]$r.testsuite.errors
            $skipped += [int]$r.testsuite.skipped
            foreach($node in @($r.SelectNodes('//testcase/failure | //testcase/error'))){
              Write-Host ('V1_FULL_FAILED_TEST='+$node.ParentNode.GetAttribute('classname')+'::'+$node.ParentNode.GetAttribute('name'))
              Write-Host ('V1_FULL_FAILURE_MESSAGE='+$node.GetAttribute('message'))
            }
          }
          Write-Host ('V1_FULL_TESTS='+$total+' V1_FULL_XMLS='+$reports.Count)
          Write-Host ('V1_FULL_FAILURES='+$fail+' ERRORS='+$errors+' SKIPPED='+$skipped)
          if($exit -ne 0 -or $total -lt 2670 -or $fail -ne 0 -or $errors -ne 0 -or $skipped -ne 0){throw 'V1_FULL_ANDROID_GATE_FAILED'}
          Write-Host 'V1_FULL_ANDROID=PASS'
          Write-Host 'V1_SOURCE_TO_BOOK_PARITY=NOT_PROVED_BY_TEST_COUNT'
          Write-Host 'V1_PHYSICAL_GALAXY_A57=NOT_TESTED'
