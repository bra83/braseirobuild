name: Audit Star Wars R38 Block03 post-sandbox runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-star-wars-r38-block03-post-sandbox.yml"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: src
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'))
          print('url='+d['source_share_url']);print('file='+d['file']);print('sha='+d['sha256'])
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prepare patched R38
        env:
          U: ${{ steps.src.outputs.url }}
          F: ${{ steps.src.outputs.file }}
          S: ${{ steps.src.outputs.sha }}
          SU: https://firestorage.ai/ja/f/PbM3XvdzNMAk
          SF: scene-assets-v1-tiny.tar.gz
          SS: 2ca16b2cd0d3f489fe10f1df718be1243febeef38fb88a52bd50502528f60711
        shell: bash
        run: |
          set -euo pipefail;rm -rf incoming work;mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          def dl(u,n,o):
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);q=b.new_page(accept_downloads=True);q.goto(u,wait_until='domcontentloaded',timeout=120000);q.wait_for_timeout(2500);done=False
              for s in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
                try:
                  x=q.locator(s).first
                  if not x.count() or not x.is_visible():continue
                  with q.expect_download(timeout=120000) as i:x.click(timeout=10000)
                  i.value.save_as(str(o));done=True;break
                except:pass
              if not done:
                x=q.get_by_text(n,exact=False).first
                with q.expect_download(timeout=120000) as i:x.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
                i.value.save_as(str(o));done=True
              b.close()
            if not done:raise SystemExit('download failed '+n)
          dl(os.environ['U'],os.environ['F'],pathlib.Path('incoming')/os.environ['F']);dl(os.environ['SU'],os.environ['SF'],pathlib.Path('incoming')/os.environ['SF'])
          PY
          echo "${S}  incoming/${F}"|sha256sum -c -;echo "${SS}  incoming/${SF}"|sha256sum -c -
          unzip -q "incoming/${F}" -d work
          G="$(find work -type f -name gradlew -not -path '*/build/*'|head -1)";R="$(dirname "$G")";echo "$R">/tmp/root
          base64 -w0 "incoming/${SF}" > star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          python3 star-wars/r38/patches/block01_repair_safe.py "$R"
          python3 star-wars/r38/patches/block02_scene_controls.py "$R"
      - name: Deep post-sandbox screen audit
        shell: bash
        run: |
          export ROOT="$(cat /tmp/root)"
          python3 - <<'PY'
          import os,pathlib,threading,http.server,socketserver,json,datetime
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(os.environ['ROOT']);vtt=root/'app/src/main/assets/vtt';os.chdir(vtt)
          class H(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          s=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=s.serve_forever,daemon=True).start();port=s.server_address[1]
          result={'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'viewports':{},'issues':[]}
          def issue(sev,code,msg,ev=None):result['issues'].append({'severity':sev,'code':code,'message':msg,'evidence':ev})
          try:
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              for vw,vh in [(415,915),(360,800)]:
                pg=b.new_page(viewport={'width':vw,'height':vh});errors=[];console=[]
                pg.on('pageerror',lambda e,errors=errors:errors.append(str(e)))
                pg.on('console',lambda m,console=console:console.append(m.text) if m.type=='error' else None)
                pg.add_init_script('''window.__geminiPrompt=null;window.BraseiroGemini={openGeminiWithPrompt:(p)=>{window.__geminiPrompt=String(p||'');return JSON.stringify({ok:true})},pickSceneImage:(k)=>JSON.stringify({ok:true})};const h={get:(t,p)=>{if(p==='then')return undefined;return(...a)=>JSON.stringify({ok:true,items:[],data:[],state:{}})}};for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroImages','BraseiroFiles','BraseiroTts'])window[n]=new Proxy({},h);''')
                pg.goto(f'http://127.0.0.1:{port}/r46-shell.html',wait_until='domcontentloaded',timeout=30000);pg.wait_for_timeout(1000)
                start=pg.locator('#sandbox-start-button');
                if start.count() and start.is_visible():start.click(timeout=3000);pg.wait_for_timeout(800)
                vp={'tabs':{},'errors':errors,'console':console}
                nav=pg.locator('.bottom-nav-button:visible')
                if nav.count()!=5:issue('high','NAV_COUNT',f'{vw}x{vh}: expected 5 visible nav buttons, got {nav.count()}')
                for i in range(nav.count()):
                  btn=nav.nth(i);label=(btn.inner_text() or btn.get_attribute('aria-label') or str(i)).strip();box=btn.bounding_box();
                  imgs=btn.locator('img:visible');icon_ok=imgs.count()>0 and (imgs.first.evaluate('(i)=>i.complete&&i.naturalWidth>0') if imgs.count() else False)
                  if not icon_ok:issue('high','NAV_ICON',f'{vw}x{vh}: missing/broken bottom icon for {label}')
                  if box and box['y']+box['height']>vh+1:issue('high','NAV_BELOW_VIEWPORT',f'{vw}x{vh}: nav {label} extends below viewport',box)
                  try:btn.click(timeout=2500);pg.wait_for_timeout(150)
                  except Exception as e:issue('high','NAV_CLICK',f'{vw}x{vh}: click failed {label}',str(e)[:400]);continue
                  body=pg.locator('body')
                  metrics=body.evaluate('''() => ({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,sh:document.documentElement.scrollHeight,ch:document.documentElement.clientHeight})''')
                  if metrics['sw']>metrics['cw']+2:issue('medium','HORIZONTAL_OVERFLOW',f'{vw}x{vh}: horizontal overflow on {label}',metrics)
                  broken=pg.locator('img:visible').evaluate_all('(xs)=>xs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute("src"))')
                  if broken:issue('high','BROKEN_IMAGE',f'{vw}x{vh}: broken visible image on {label}',broken)
                  visible_buttons=pg.locator('button:visible');small=[]
                  for j in range(min(visible_buttons.count(),80)):
                    x=visible_buttons.nth(j);bb=x.bounding_box();txt=(x.inner_text() or '').strip()[:60]
                    if bb and bb['height']<32 and bb['width']<32:small.append({'text':txt,'box':bb})
                  vp['tabs'][label]={'metrics':metrics,'broken_images':broken,'small_controls':small,'icon_ok':icon_ok}
                # CENA controls/prompt
                cena=pg.get_by_text('CENA',exact=True);cena.click(timeout=2500);pg.wait_for_timeout(100)
                ill=pg.get_by_text('ILUSTRAÇÃO',exact=True);imp=pg.get_by_text('IMPORTAR',exact=True)
                if not(ill.count()==1 and ill.is_visible()):issue('high','ILLUSTRATION_HIDDEN',f'{vw}x{vh}: ILUSTRAÇÃO hidden')
                if not(imp.count()==1 and imp.is_visible()):issue('high','IMPORT_HIDDEN',f'{vw}x{vh}: IMPORTAR hidden')
                if ill.count() and ill.is_visible():
                  ill.click(timeout=2500);prompt=pg.evaluate('window.__geminiPrompt') or ''
                  if len(prompt)<250:issue('high','PROMPT_THIN',f'{vw}x{vh}: Gemini prompt too short',{ 'length':len(prompt)})
                fall=pg.locator('.scene-media-slot img.final-scene-library-image:visible')
                if fall.count()<1:issue('high','SCENE_FALLBACK_MISSING',f'{vw}x{vh}: no visible semantic scene fallback')
                result['viewports'][f'{vw}x{vh}']=vp;pg.close()
              b.close()
          finally:s.shutdown();s.server_close()
          import collections
          counts=collections.Counter(x['severity'] for x in result['issues']);result['counts']=dict(counts)
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit/BLOCK03_POST_SANDBOX.json';out.write_text(json.dumps(result,ensure_ascii=False,indent=2))
          md=['# STAR WARS R38 — BLOCK03 POST-SANDBOX AUDIT','',f'- Critical: **{counts["critical"]}**',f'- High: **{counts["high"]}**',f'- Medium: **{counts["medium"]}**','- Viewports: **415×915 + 360×800**','- Tabs exercised: **CENA / PERSONAGEM / ITENS / NAVE / REGISTROS**','','## Findings']
          md += [f'- **{x["severity"].upper()} · {x["code"]}** — {x["message"]}'+(f' — `{str(x.get("evidence"))[:300]}`' if x.get('evidence') else '') for x in result['issues']]
          if not result['issues']:md.append('- Nenhuma regressão reproduzível encontrada neste escopo.')
          (out.parent/'BLOCK03_POST_SANDBOX.md').write_text('\n'.join(md)+'\n')
          PY
      - name: Commit report
        run: |
          git checkout -- star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          git config user.name braseiro-audit-bot;git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/BLOCK03_POST_SANDBOX.*
          git commit -m 'audit(star-wars): record Block03 post-sandbox runtime findings' || true
          git push
