name: Export OUA 4.9.8 release assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-oua-4.9.8-assets.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download private release assets
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'oua-498-export'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'oua-498-export'
          }
          $repo = $env:GITHUB_REPOSITORY
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/OUA-v4.9.8"
          $wanted = @(
            'BRASEIRO_O_UM_ANEL_4.9.8_DEBUG.apk',
            'BRASEIRO_O_UM_ANEL_4.9.8_DEBUG.apk.sha256',
            'OUA_4.9.8_SCENE_ENTITIES_GEMINI_ANDROID_STUDIO.zip',
            'OUA_4.9.8_SCENE_ENTITIES_GEMINI_ANDROID_STUDIO.zip.sha256',
            'GRADLE_BUILD.log',
            'OFFLINE_BUILD.log',
            'VALIDACAO_OUA_4.9.8.txt'
          )
          foreach ($name in $wanted) {
            $asset = @($release.assets | Where-Object { $_.name -eq $name -and $_.state -eq 'uploaded' }) | Select-Object -First 1
            if (-not $asset) { throw "Missing release asset: $name" }
            $dest = Join-Path $out $name
            & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" -o $dest $asset.url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dest)) { throw "Download failed: $name" }
          }

          $apk = Join-Path $out 'BRASEIRO_O_UM_ANEL_4.9.8_DEBUG.apk'
          $zip = Join-Path $out 'OUA_4.9.8_SCENE_ENTITIES_GEMINI_ANDROID_STUDIO.zip'
          $apkHash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($apkHash -ne '3e15d620fc4555c668abef095b1751288c0c92b04153f1bef63022145784dccb') { throw "APK SHA mismatch: $apkHash" }
          if ($zipHash -ne '72e6e928ca2132761a1b920e49619a74a226dc4da0704b80cdacedde916c2092') { throw "ZIP SHA mismatch: $zipHash" }
          "EXPORT_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: OUA_4_9_8_BRELGA_RELEASE
          compression-level: 0
          retention-days: 7
          path: ${{ env.EXPORT_DIR }}\*
