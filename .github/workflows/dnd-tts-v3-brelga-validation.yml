name: DND TTS v3 BRELGA regression and signed-build gates
on:
  push:
    branches: [feature/tts-universal-v3-dnd-20261020]
    paths:
      - 'dnd-normal/run247-mod005/**'
      - '.github/workflows/dnd-tts-v3-brelga-validation.yml'
permissions:
  contents: write
concurrency:
  group: dnd-tts-v3-brelga
  cancel-in-progress: true
jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - name: Install Java 21 on the BRELGA runner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate and validate Android SDK on BRELGA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'EXPECTED_BRELGA'}
          $candidates=@('C:\actions-runner\android-sdk', 'C:\Android\Sdk', $env:ANDROID_SDK_ROOT, $env:ANDROID_HOME)
          if($env:LOCALAPPDATA){$candidates+=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          $sdk=$null
          foreach($candidate in ($candidates|Where-Object{$_}|Select-Object -Unique)){
            if((Test-Path (Join-Path $candidate 'platforms')) -and
               (Test-Path (Join-Path $candidate 'build-tools')) -and
               (Test-Path (Join-Path $candidate 'platform-tools'))){
              $sdk=(Resolve-Path $candidate).Path;break
            }
          }
          if(!$sdk){throw 'ANDROID_SDK_MISSING_ON_BRELGA'}
          $env:ANDROID_HOME=$sdk
          $env:ANDROID_SDK_ROOT=$sdk
          "ANDROID_HOME=$sdk"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $project=Join-Path $env:GITHUB_WORKSPACE 'dnd-normal/run247-mod005'
          if(!(Test-Path (Join-Path $project 'gradlew.bat'))){throw 'ANDROID_PROJECT_ROOT_MISSING'}
          $escaped=$sdk.Replace('\','/')
          "sdk.dir=$escaped"|Set-Content -LiteralPath (Join-Path $project 'local.properties') -Encoding ASCII
          Write-Host 'BRELGA_SDK_RESOLVED=PASS'
      - name: Validate real source and tests before compiling
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'WRONG_RUNNER'}
          Set-Location 'dnd-normal/run247-mod005'
          $service=Get-Content 'app/src/main/java/com/braseiro/dnd5e/GeminiService.java' -Raw
          foreach($required in @('speech_metadata','gemini-3.8-flash-tts','PortugueseNarrationSanitizer.sanitize','generate_config','v1beta/interactions')){
            if($required -eq 'generate_config'){continue}
            if(!$service.Contains($required)){throw "TTS_V3_MISSING_$required"}
          }
          $env:JAVA_TOOL_OPTIONS='-Dfile.encoding=UTF-8'
          .\gradlew.bat :app:compileDebugJavaWithJavac :app:testDebugUnitTest --no-daemon --console=plain
          if($LASTEXITCODE -ne 0){throw 'DND_ANDROID_REGRESSION_FAILED'}
          Write-Host 'DND_SOURCE_AND_JVM_REGRESSIONS=PASS'
      - name: Compile exact source after successful regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location 'dnd-normal/run247-mod005'
          .\gradlew.bat :app:assembleDebug --no-daemon --console=plain
          if($LASTEXITCODE -ne 0){throw 'DND_ANDROID_ASSEMBLE_FAILED'}
      - name: Validate identity, APK signature and retain verification artifact
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='dnd-normal/run247-mod005'
          $apk=Get-ChildItem "$root/app/build/outputs/apk/debug" -Filter '*.apk' -File | Select-Object -First 1
          if(!$apk){throw 'DND_APK_MISSING'}
          $sdk=$env:ANDROID_HOME;if(!$sdk){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          $tools=Get-ChildItem (Join-Path $sdk 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if(!$tools){throw 'DND_BUILD_TOOLS_MISSING'}
          $badging=(& (Join-Path $tools.FullName 'aapt.exe') dump badging $apk.FullName) -join "`n"
          if($LASTEXITCODE -ne 0 -or $badging -notmatch "package: name='com[.]braseiro[.]dnd5e'"){throw 'DND_APP_ID_CHANGED'}
          $cert=(& (Join-Path $tools.FullName 'apksigner.bat') verify --verbose --print-certs $apk.FullName) -join "`n"
          if($LASTEXITCODE -ne 0){throw 'DND_SIGNING_INVALID'}
          New-Item -ItemType Directory -Path evidence -Force|Out-Null
          $hash=(Get-FileHash $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item $apk.FullName 'evidence/dnd-tts-v3-internal-verification.apk'
          @("HEAD=$env:GITHUB_SHA","SHA256=$hash","SOURCE_REGRESSIONS=PASS","ANDROID_SIGNING_VALID=PASS","INSTALL_OVER=NOT_TESTED","A57_AUDIO=NOT_TESTED","FINAL_RELEASE=BLOCKED")|Set-Content 'evidence/dnd-source-proof.txt'
          Write-Host "DND_INTERNAL_APK_SHA256=$hash"
      - name: Publish signed APK to draft GitHub Release via REST (no gh binary)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 18
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='braseiro-dnd-tts-v3-'+$env:GITHUB_SHA.Substring(0,12)
          $apk='evidence/dnd-tts-v3-internal-verification.apk'
          $proof='evidence/dnd-source-proof.txt'
          if(!(Test-Path -LiteralPath $apk) -or !(Test-Path -LiteralPath $proof)){throw 'APK_OR_PROVENANCE_MISSING'}
          if(!$env:GH_TOKEN){throw 'WORKFLOW_CONTENTS_WRITE_TOKEN_MISSING'}
          $headers=@{'Authorization'="Bearer $env:GH_TOKEN";'Accept'='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Braseiro-BRELGA'}
          $body=@{tag_name=$tag;target_commitish=$env:GITHUB_SHA;name='D&D 5e · TTS v3 · APK assinado (homologação Android pendente)';body='Built on BRELGA. Source and Android signatures PASS. A57 physical playback and install-over-existing NOT TESTED. Not marked final.';draft=$true;prerelease=$false}
          $release=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ($body | ConvertTo-Json -Depth 6) -TimeoutSec 90
          if(!$release.id -or !$release.upload_url){throw 'DRAFT_RELEASE_CREATION_INCOMPLETE'}
          $upload=$release.upload_url.Split('{')[0]
          foreach($file in @($apk,$proof)){
            $name=[Uri]::EscapeDataString([IO.Path]::GetFileName($file))
            $uri=$upload+'?name='+$name
            $uploaded=Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $file -TimeoutSec 900
            if(!$uploaded.id -or $uploaded.size -ne (Get-Item $file).Length){throw 'RELEASE_UPLOAD_SIZE_MISMATCH'}
            Write-Host ("RELEASE_ASSET_STORED="+$uploaded.name+" bytes="+$uploaded.size)
          }
          $assets=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets" -Method Get -Headers $headers -TimeoutSec 90
          $names=@($assets | ForEach-Object {$_.name})
          foreach($file in @($apk,$proof)){
            if($names -notcontains [IO.Path]::GetFileName($file)){throw 'RELEASE_ASSET_MISSING_AFTER_UPLOAD'}
          }
          Write-Host ("DRAFT_RELEASE_APK_DELIVERED="+$release.html_url)
          Write-Host 'A57_HOMOLOGATION=NOT_TESTED'
