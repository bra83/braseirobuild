name: Audit Forbidden Lands Kokoro TTS

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-forbidden-kokoro-tts.yml']
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Inspect exact Forbidden Lands 3.3.5 TTS source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $roots=@(
            'D:\brelga-forbidden-lands-3.3.5\project',
            'D:\brelga-forbidden-lands-3.3.5-r7\project',
            'C:\brelga-forbidden-lands-3.3.5\project'
          ) | Where-Object { Test-Path $_ }
          if(-not $roots){
            throw 'Forbidden Lands cached source not found on BRELGA'
          }
          $root=$roots[0]
          $pkg=Get-ChildItem $root -Recurse -File -Filter package.json | Where-Object {
            (Test-Path (Join-Path $_.Directory.FullName 'android')) -and
            (Test-Path (Join-Path $_.Directory.FullName 'src'))
          } | Sort-Object {$_.FullName.Length} | Select-Object -First 1
          if(-not $pkg){throw 'Project root not found'}
          $proj=$pkg.Directory.FullName
          "PROJECT=$proj"
          $patterns=@(
            'silenceScale','maxNumSentences','numThreads','QUEUE_ADD','QUEUE_FLUSH',
            'UtteranceProgressListener','onDone','playSilentUtterance','prewarm',
            'sentence','frase','pause','pausa','splitNarration','splitForAndroidTts',
            'TextToSpeech','Kokoro','Sherpa'
          )
          $files=Get-ChildItem $proj -Recurse -File -Include *.java,*.kt,*.ts,*.tsx,*.js,*.jsx,*.json |
            Where-Object {$_.FullName -notmatch '\\node_modules\\|\\build\\|\\dist\\'}
          $hits=@()
          foreach($p in $patterns){
            $m=$files | Select-String -Pattern $p -SimpleMatch -ErrorAction SilentlyContinue
            foreach($x in $m){$hits += [pscustomobject]@{Pattern=$p;Path=$x.Path;Line=$x.LineNumber;Text=$x.Line.Trim()}}
          }
          $priority=$hits | Where-Object {$_.Pattern -match 'silenceScale|maxNumSentences|numThreads|QUEUE_ADD|QUEUE_FLUSH|UtteranceProgressListener|onDone|Kokoro|Sherpa'} |
            Select-Object -ExpandProperty Path -Unique
          "=== PRIORITY FILES ==="
          $priority
          foreach($p in $priority){
            "### FILE $p"
            $lines=Get-Content $p
            $nums=($hits | Where-Object {$_.Path -eq $p} | Select-Object -ExpandProperty Line -Unique)
            foreach($n in $nums){
              $a=[Math]::Max(1,$n-8);$b=[Math]::Min($lines.Count,$n+12)
              "--- around $n ---"
              for($i=$a;$i -le $b;$i++){"{0,6}: {1}" -f $i,$lines[$i-1]}
            }
          }
