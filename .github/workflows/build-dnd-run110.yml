name: Braseiro DnD 6.6.2 RUN110 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dnd-run110.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: 'DND-6.6.2-RUN110'
  APK_NAME: 'BRASEIRO_DND_6.6.2_RUN110_DEBUG.apk'
  PACKAGE_ID: 'com.braseiro.dnd5e'
  BASE_TAG: 'Vd01'
  BASE_ASSET: 'Braseiro_DnD_6.6.2_MOTOR_BARBARA_1.1.3_STRIXHAVEN_ASSETS_COMPLETE_ANDROID_STUDIO.zip'
  OVERLAY_API_BASE: 'https://api.firestorage.ai/dev/file'
  OVERLAY_SHARE_ID: '-dBGOlMIO3P9'
  OVERLAY_FILE_ID: '01a0ba7afdd87169b6c412c589269689'
  OVERLAY_SHA256: '7fac0ca04a5a85e598c0e86a998ac5c6cb94e682393a729ef4222819536098a8'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical Android Studio baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work
          gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$BASE_ASSET" --dir incoming
          unzip -t "incoming/$BASE_ASSET" >/dev/null
          unzip -q "incoming/$BASE_ASSET" -d work
          SETTINGS="$(find work -type f -path '*/android/settings.gradle.kts' | head -n1)"
          test -n "$SETTINGS"
          ANDROID_ROOT="$(dirname "$SETTINGS")"
          PROJECT_ROOT="$(dirname "$ANDROID_ROOT")"
          echo "ANDROID_ROOT=$(realpath "$ANDROID_ROOT")" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$(realpath "$PROJECT_ROOT")" >> "$GITHUB_ENV"

      - name: Download and apply RUN110 overlay
        shell: bash
        run: |
          set -euo pipefail
          LIST_URL="$OVERLAY_API_BASE/shares/$OVERLAY_SHARE_ID/files?maxResults=1000"
          DL_API="$OVERLAY_API_BASE/shares/$OVERLAY_SHARE_ID/files/$OVERLAY_FILE_ID/download"
          curl -fsSL "$LIST_URL" -o /tmp/files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/files.json',encoding='utf-8'))
          fid=os.environ['OVERLAY_FILE_ID']
          assert any(str(x.get('fileId'))==fid for x in (data.get('files') or [])), 'overlay file not found'
          PY
          curl -fsSL -X POST "$DL_API" -o /tmp/download.json
          URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/download.json',encoding='utf-8')).get('downloadUrl',''))
          PY
          )"
          test -n "$URL"
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$URL" -o /tmp/run110-overlay.zip
          echo "$OVERLAY_SHA256  /tmp/run110-overlay.zip" | sha256sum -c -
          unzip -t /tmp/run110-overlay.zip >/dev/null
          rm -rf "$PROJECT_ROOT/android/app/src/main/java/com/braseiro/dnd5e"
          rm -rf "$PROJECT_ROOT/android/app/src/main/java/com/braseiro/dnd"
          unzip -oq /tmp/run110-overlay.zip -d "$PROJECT_ROOT"

      - name: Verify RUN110 contracts
        shell: bash
        run: |
          set -euo pipefail
          JAVA_ROOT="$PROJECT_ROOT/android/app/src/main/java/com/braseiro/dnd5e"
          test -d "$JAVA_ROOT"
          COUNT="$(find "$JAVA_ROOT" -type f -name '*.java' | wc -l)"
          test "$COUNT" -eq 234
          grep -q '^VERSION_NAME=6.6.2-r110$' "$PROJECT_ROOT/version.properties"
          grep -q '^VERSION_CODE=606210$' "$PROJECT_ROOT/version.properties"
          grep -q 'presentationDraftIsSubstantial' "$JAVA_ROOT/MainActivity.java"
          grep -q 'isSoftPresentationQualityProblem' "$JAVA_ROOT/MainActivity.java"
          grep -q 'tts_quota_session_mode_v1' "$JAVA_ROOT/AiQuotaGovernor.java"
          grep -q 'index==0&&aiQuotaGovernor!=null' "$JAVA_ROOT/MainActivity.java"
          grep -q 'Software caused connection abort' "$JAVA_ROOT/GeminiService.java"
          grep -q 'postWithRetry(candidate,apiKey,body,2)' "$JAVA_ROOT/GeminiService.java"
          if grep -R --include='*.java' -n 'package com\.braseiro\.dnd;' "$PROJECT_ROOT/android/app/src/main/java" >/tmp/oldpkg.txt; then
            cat /tmp/oldpkg.txt
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Java and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$ANDROID_ROOT/gradlew"
          cd "$ANDROID_ROOT"
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/JAVAC_RUN110.log"
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/GRADLE_BUILD_RUN110.log"

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING_RUN110.txt"
          grep -q "package: name='$PACKAGE_ID'" "$GITHUB_WORKSPACE/out/APK_BADGING_RUN110.txt"
          grep -q "versionCode='606210'" "$GITHUB_WORKSPACE/out/APK_BADGING_RUN110.txt"
          grep -q "versionName='6.6.2-r110-debug'" "$GITHUB_WORKSPACE/out/APK_BADGING_RUN110.txt"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null
          stat -c 'APK_BYTES=%s' "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_SIZE_RUN110.txt"

      - name: Publish RUN110 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='RUN110 corrige três problemas observados no aparelho: (1) cenas de 3–5 mil caracteres não disparam mais expansão remota só por meta editorial de onboarding; (2) falha SSE/Software caused connection abort tenta o endpoint JSON antes do Mestre local; (3) o limite local do Charon passa a contar por narração, não por bloco, evitando troca para Android no meio da cena por causa do contador. Charon também ganhou retry transitório adicional. Package: com.braseiro.dnd5e.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Braseiro DnD 6.6.2 RUN110 — Narrative/TTS reliability' --notes "$NOTES"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY"             "out/$APK_NAME"             "out/$APK_NAME.sha256"             "out/APK_BADGING_RUN110.txt"             "out/APK_SIZE_RUN110.txt"             "GRADLE_BUILD_RUN110.log"             "JAVAC_RUN110.log"             --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,name,tagName,assets
