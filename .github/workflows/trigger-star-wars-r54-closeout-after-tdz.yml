name: Trigger Star Wars R54 Closeout After TDZ
on:
  push:
    branches: [main]
    paths:
      - "star-wars/r54/fix_supplement_species_runtime.py"
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final R54 closeout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run close-star-wars-r54-final.yml --repo "${{ github.repository }}" --ref main
