name: OUA Base 2e - playable core audit
on:
  push:
    branches:
      - oua/base-playable-20261014
    paths:
      - .github/workflows/oua-base-playable-20261014.yml
      - ci/oua-base-20261014/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/oua-base-20261014
            ci/oua-4.9.202/audit-turn-flow.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore exact 4.9.211 published source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oua-base"
          gh release download OUA-v4.9.211 --repo "$GITHUB_REPOSITORY" --pattern BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip --dir "$RUNNER_TEMP/oua-base"
          unzip -q "$RUNNER_TEMP/oua-base/BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip" -d "$RUNNER_TEMP/oua-base/src"
          PKG=""
          while IFS= read -r candidate; do
            if [ -d "$(dirname "$candidate")/android" ]; then PKG="$candidate"; break; fi
          done < <(find "$RUNNER_TEMP/oua-base/src" -name package.json -type f | sort)
          test -n "$PKG"
          echo "OUA_ROOT=$(dirname "$PKG")" >> "$GITHUB_ENV"
      - name: Inspect real gameplay wiring
        shell: bash
        run: |
          set -euo pipefail
          node ci/oua-base-20261014/inventory.mjs "$OUA_ROOT"
      - name: Run existing 62-session gameplay regression on 4.9.211
        shell: bash
        run: |
          set -euo pipefail
          cp ci/oua-4.9.202/audit-turn-flow.ts "$OUA_ROOT/audit-turn-flow.ts"
          cd "$OUA_ROOT"
          npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund
          npx --yes tsx audit-turn-flow.ts
          node -e 'const r=require("./OUA_49202_TURN_FLOW_AUDIT.json");if(r.failed>0||r.passed!==r.assertions)process.exit(2);console.log("BASE_GAMEPLAY_PASS sessions="+r.sessionsSimulated+" assertions="+r.assertions)'
      - name: Type check and web build
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUA_ROOT"
          npm run lint
          npm run build
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OUA-base-20261014-first-audit
          path: |
            ${{ env.OUA_ROOT }}/OUA_49202_TURN_FLOW_AUDIT.json
            ${{ env.OUA_ROOT }}/OUA_49202_TURN_FLOW_AUDIT.md
          if-no-files-found: warn
