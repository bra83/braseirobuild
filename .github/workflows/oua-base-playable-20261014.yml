name: OUA Base 2e - playable core audit BRELGA
on:
  push:
    branches:
      - oua/base-playable-20261014
    paths:
      - .github/workflows/oua-base-playable-20261014.yml
      - ci/oua-base-20261014/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/oua-base-20261014
            ci/oua-4.9.202
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore canonical 4.9.211 project
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'oua-base-20261014-core'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $archive = Join-Path $work 'BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28"}
          $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/OUA-v4.9.211"
          $asset=@($release.assets | Where-Object { $_.name -eq 'BRASEIRO_O_UM_ANEL_4.9.211_ANDROID_STUDIO_COMPLETE.zip' }) | Select-Object -First 1
          if (-not $asset) { throw 'Published checkpoint asset not found' }
          & curl.exe -sS -L --fail --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" -o $archive "$($asset.url)"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical OUA release asset fetch failed' }
          if ((Get-Item $archive).Length -lt 100000000) { throw 'Expected the full 268MB source, got truncated download' }
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) { throw 'Canonical OUA 4.9.211 ZIP not downloadable' }
          $unzip = Join-Path $work 'source'
          New-Item -ItemType Directory -Path $unzip -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $unzip -Force
          $pkg = Get-ChildItem $unzip -Recurse -Filter 'package.json' -File |
            Where-Object { Test-Path (Join-Path $_.Directory.FullName 'android') } |
            Select-Object -First 1
          if (-not $pkg) { throw 'OUA Android Studio source root not found' }
          "OUA_ROOT=$($pkg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OUA_TEMP=$work" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Apply real manual Journey roll/event protection\n        shell: powershell\n        run: |\n          & node.exe ci/oua-base-20261014/apply-manual-roll-once.mjs "$env:OUA_ROOT"\n          if ($LASTEXITCODE -ne 0) { throw 'OUA base gameplay patch failed' }\n      - name: Inventory production source
        shell: powershell
        run: |
          & node.exe ci/oua-base-20261014/inventory.mjs "$env:OUA_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Base production inventory has failures' }
      - name: Execute actual base rules, journeys, time and combat
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item ci/oua-4.9.202/audit-turn-flow.ts (Join-Path $env:OUA_ROOT 'audit-turn-flow.ts') -Force
          Push-Location $env:OUA_ROOT
          try {
            & npm.cmd ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { & npm.cmd install --ignore-scripts --no-audit --no-fund }
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            Copy-Item "$env:GITHUB_WORKSPACE\\ci\\oua-base-20261014\\manual-roll-once.test.ts" 'manual-roll-once.test.ts' -Force\n            & npx.cmd --yes tsx manual-roll-once.test.ts\n            if ($LASTEXITCODE -ne 0) { throw 'Manual player roll one-shot behavior failed' }\n            & npx.cmd --yes tsx audit-turn-flow.ts
            if ($LASTEXITCODE -ne 0) { throw 'Base rules turn-flow regression failed' }
            & node.exe -e 'const r=require("./OUA_49202_TURN_FLOW_AUDIT.json");if(r.failed||r.passed!==r.assertions)process.exit(2);console.log("BASE_GAMEPLAY_PASS sessions="+r.sessionsSimulated+" assertions="+r.assertions)'
            if ($LASTEXITCODE -ne 0) { throw 'Invalid regression summary' }
            & npm.cmd run lint
            if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
            & npm.cmd run build
            if ($LASTEXITCODE -ne 0) { throw 'Vite build failed' }
          } finally { Pop-Location }
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OUA-base-20261014-core-gates
          path: |
            ${{ env.OUA_ROOT }}/OUA_49202_TURN_FLOW_AUDIT.json
            ${{ env.OUA_ROOT }}/OUA_49202_TURN_FLOW_AUDIT.md
          if-no-files-found: warn
      - name: Clean self-hosted runner
        if: always()
        shell: powershell
        run: |
          if ($env:OUA_TEMP -and (Test-Path $env:OUA_TEMP)) { Remove-Item $env:OUA_TEMP -Recurse -Force -ErrorAction SilentlyContinue }
