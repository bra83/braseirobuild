name: Verify DnD scene decisions (Nov 10)

on:
  push:
    branches:
      - fix/dnd-6654-scene-actions-semantic-gate-20261110
    paths:
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/**'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/**'
      - '.github/workflows/verify-dnd-scene-actions-20261110.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-scene-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: dnd-normal/run247-mod005
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run screenshot regressions
        run: |
          bash ./gradlew :app:compileDebugJavaWithJavac \
            :app:testDebugUnitTest \
            -Pbraseiro.qaLiteAssets=true \
            --tests 'com.braseiro.dnd5e.SceneActionsUserScreenshotsRegressionTest' \
            --no-daemon --stacktrace
      - name: Collect JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-decisions-nov10-junit
          path: dnd-normal/run247-mod005/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
