name: Audit DnD RUN180 Character Creation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-dnd-run180-character-creation.yml']
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Audit RUN180 creation pipeline fast
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Runner incorreto: $env:RUNNER_NAME"}
          $root='C:\DND180\extract\dnd_work'
          if(!(Test-Path $root)){throw 'RUN180 source cache ausente'}

          $roots=@(
            (Join-Path $root 'android\app\src\main\java'),
            (Join-Path $root 'src'),
            (Join-Path $root 'public'),
            (Join-Path $root 'data')
          ) | Where-Object {Test-Path $_}

          $files=@()
          foreach($r in $roots){
            $files += Get-ChildItem $r -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Extension -in '.java','.kt','.ts','.tsx','.js','.jsx','.json','.html' -and
                $_.FullName -notmatch '\\node_modules\\|\\build\\|\\dist\\|\\assets\\images\\|\\drawable'
              }
          }

          $regex='Caçador de Sangue|Cacador de Sangue|Blood Hunter|Snatchbeak|Kenku|Mythic|Ficha não passou|Classe não reconhecida|classe não reconhecida|validateForSave|generateRandom|randomCharacter|generateCharacter|subclass|subclasse|background|antecedente|alignment|alinhamento|concept|conceito|species|espécie|classe|class|attribute|atributo|ability'
          $hits=$files | Select-String -Pattern $regex -AllMatches -ErrorAction SilentlyContinue
          "FILES_SCANNED=$($files.Count)"
          "HITS=$($hits.Count)"

          "=== HIGH SIGNAL MATCHES ==="
          $high=$hits | Where-Object {
            $_.Line -match 'Caçador de Sangue|Cacador de Sangue|Blood Hunter|Snatchbeak|Kenku|Mythic|Ficha não passou|não reconhecida|validateForSave|generateRandom|randomCharacter|generateCharacter'
          }
          $high | Sort-Object Path,LineNumber | ForEach-Object {
            "$($_.Path):$($_.LineNumber) :: $($_.Line.Trim())"
          }

          "=== PRIORITY CONTEXT ==="
          $paths=$high | Select-Object -ExpandProperty Path -Unique
          foreach($p in $paths){
            "### FILE: $p"
            $lines=Get-Content $p
            $nums=($high | Where-Object {$_.Path -eq $p} | Select-Object -ExpandProperty LineNumber -Unique)
            foreach($n in $nums){
              $a=[Math]::Max(1,$n-18);$b=[Math]::Min($lines.Count,$n+35)
              "--- around $n ---"
              for($i=$a;$i -le $b;$i++){"{0,6}: {1}" -f $i,$lines[$i-1]}
            }
          }

          "=== DEPENDENCY FILES ==="
          $deps=$hits | Where-Object {
            $_.Line -match 'subclass|subclasse|background|antecedente|alignment|alinhamento|concept|conceito|species|espécie|attribute|atributo|ability'
          } | Select-Object -ExpandProperty Path -Unique
          $deps | Sort-Object
