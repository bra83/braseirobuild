name: DnD 6.6.59 action status stall source investigation
on:
  push:
    branches: [fix/dnd-6659-action-status-stall-20261115]
    paths: [.github/workflows/dnd-6659-action-stall-source-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - name: Inspect actual narrative action-to-status pipeline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("dnd-normal/run247-mod005/app/src/main")
          targets=[
              r"Contexto local pronto",r"montando o estado da campanha",
              r"sem nova busca de regras",r"local pronto",r"estado da campanha",
              r"stale.*status",r"status.*timeout",
              r"action.*pending",r"setStatus",r"setStatusMessage",
              r"handleOption",r"runNarration",r"showSceneActionDropdown",
          ]
          matches=[]
          for file in list((root/"java").rglob("*.java"))+list((root/"assets").rglob("*.json")):
              try:lines=file.read_text(encoding="utf-8").splitlines()
              except Exception:continue
              for i,line in enumerate(lines):
                  if any(re.search(x,line,re.I) for x in targets[:5]):
                      matches.append((file,lines,i))
          for file,lines,i in matches[:65]:
              print("STATUS_HIT",file,len(lines),"LINE",i+1)
              for j in range(max(0,i-13),min(len(lines),i+24)):
                  print("SOURCE",j+1,lines[j][:230])
          main=root/"java/com/braseiro/dnd5e/MainActivity.java"
          lines=main.read_text(encoding="utf-8").splitlines()
          print("MAINACTIVITY_LINES",len(lines))
          p=[i for i,x in enumerate(lines) if re.search(r"handleOption|showSceneActionDropdown|setStatus|footerStatus|statusText|narrationPending|apply.*Option|process.*Action",x,re.I)]
          print("PIPELINE_MATCHES",len(p))
          for i in p[:110]:
              print("PIPE",i+1,lines[i].strip()[:250])
          print("---- NATIVE STATUS / ACTION PIPELINE SOURCE RANGES ----")
          for lo,hi in [(7295,7410),(7515,7605),(7625,7742),(7740,7804),(7800,7908),(7900,7970),(8060,8178),(9060,9100),(9400,9445)]:
              print("RANGE",lo,hi)
              for k in range(lo-1,min(hi,len(lines))):
                  print("CODE_L%d "%(k+1)+lines[k][:510])
          for k in range(len(lines)):
              line=lines[k]
              if any(term in line for term in ("void setStatus(", "private void sendAi(", "aiPipelineGeneration", "aiRequestGeneration", "onDestroy(", "MASTER_PREPAR", "Watchdog", "cancelAi")):
                  if 'setStatus(' in line and not re.search(r"void setStatus\\(",line):continue
                  print("METHOD_LINE",k+1,line[:500])
          PY
