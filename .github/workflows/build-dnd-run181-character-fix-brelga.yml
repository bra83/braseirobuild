name: Braseiro DnD 6.6.3 RUN181 Character Fix BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dnd-run181-character-fix-brelga.yml'
      - 'ci/dnd-run181/patch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dnd-run181-brelga
  cancel-in-progress: true

env:
  TAG: 'DND-6.6.3-RUN181'
  APK_NAME: 'BRASEIRO_DND_6.6.3_RUN181_DEBUG.apk'
  SOURCE_ZIP_NAME: 'BRASEIRO_DND_6.6.3_RUN181_ANDROID_STUDIO.zip'
  PACKAGE_ID: 'com.braseiro.dnd5e'
  SOURCE_SHA256: '2013bccf5e12e006ddbc3e644177613bc405e6bc828b18f52a2cdd5ebc5aa078'

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct RUN180 stable source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Runner incorreto: $env:RUNNER_NAME"}
          $base='C:\DND181';$incoming='C:\DND180\incoming';$extract="$base\extract";$out="$base\out"
          New-Item -ItemType Directory -Force -Path $incoming,$extract,$out | Out-Null
          $ids=@(
            '1XiIBc6zdz6iISvpak_zTKPEljsGzWeup',
            '1P7LwVCYrtidn4pXbdFLa70X3zS1f8GSN',
            '1ptl3x3a6l-t6NUpZdKLhcMfnmnznlk9N',
            '1clnk1KwnJRFTfiHGfkmpS0_XF63a42rR',
            '1hm2KrTnF5JHQO-mM7FWfz2izjbHdxFk0',
            '13XbarUyJ9JuXUIfotc6cc5RHB-H6sxx_',
            '1vx1jkf_zKwbYvuJtKGSSzoqAFfSoPPT2'
          )
          $hashes=@(
            '8dd31da8d9c9805aca05f2b3a19a80d4e35c3dba2d0eaa62bdec8e5ced6be9eb',
            '3b3bc483807b372a193c7e12ef8917254ca7e070775fb570b6f76176090cf687',
            'a50528b062123f767df13e18fb3cda7026a2cf1c93ec1ecb60132f49a62dc2d0',
            '797a1c097cf43526d732caf9eded2993e3dcd82e940001cb742bb0ce3d0bbfe9',
            '2e28a84895d5d3ebdddae5dca4e7edbc0944d02ea128586be8142b28f7b9b506',
            '7640d597596bb49957f06268e37b8c0fb68cd8acf8dbdc3b3f5b916c02fccc17',
            '8469336040fe3dc2d45128c7d2c4d5dce293c26ac57d97021efa5700856ed068'
          )
          for($i=0;$i -lt 7;$i++){
            $p="$incoming\part{0:D2}" -f $i
            $ok=$false
            if(Test-Path $p){$got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();if($got -eq $hashes[$i]){$ok=$true}else{Remove-Item $p -Force}}
            if(-not $ok){
              $url="https://drive.usercontent.google.com/download?id=$($ids[$i])&export=download&confirm=t"
              & curl.exe -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 --max-time 900 -o $p $url
              if($LASTEXITCODE -ne 0){throw "DOWNLOAD_PART_$i"}
              $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant();if($got -ne $hashes[$i]){throw "BAD_PART_$i SHA=$got"}
            }
          }
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $zip="$base\RUN180_BASE.zip";$o=[IO.File]::Create($zip)
          try{for($i=0;$i -lt 7;$i++){$s=[IO.File]::OpenRead(("$incoming\part{0:D2}" -f $i));try{$s.CopyTo($o)}finally{$s.Dispose()}}}finally{$o.Dispose()}
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();if($sha -ne $env:SOURCE_SHA256){throw "SOURCE_SHA_MISMATCH $sha"}
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $gradle=Get-ChildItem $extract -Recurse -Filter gradlew.bat -File | Where-Object {$_.Directory.Name -eq 'android'} | Select-Object -First 1
          if(!$gradle){throw 'android/gradlew.bat ausente'}
          $root=Split-Path $gradle.Directory.FullName -Parent
          "root=$root" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: source

      - name: Apply RUN181 character creation + Kokoro profile patch
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          python "$env:GITHUB_WORKSPACE\ci\dnd-run181\patch.py" "$env:ROOT"

      - name: Version RUN181
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $versionPath="$env:ROOT\version.properties"
          $vp=@(Get-Content $versionPath);$hasName=$false;$hasCode=$false
          $vp=@($vp|ForEach-Object{if($_ -match '^VERSION_NAME='){$hasName=$true;'VERSION_NAME=6.6.3-r181'}elseif($_ -match '^VERSION_CODE='){$hasCode=$true;'VERSION_CODE=606381'}else{$_}})
          if(-not $hasName){$vp=@('VERSION_NAME=6.6.3-r181')+$vp};if(-not $hasCode){$vp=@('VERSION_CODE=606381')+$vp}
          [IO.File]::WriteAllLines($versionPath,$vp,(New-Object Text.UTF8Encoding($false)))

      - name: Source contract tests
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $p="$env:ROOT\android\app\src\main\java\com\braseiro\dnd5e"
          $validator=Get-Content "$p\CharacterRulesValidator.java" -Raw
          $generator=Get-Content "$p\CharacterSheetGenerator.java" -Raw
          $main=Get-Content "$p\MainActivity.java" -Raw
          $local=Get-Content "$p\DndPtBrLocalizer.java" -Raw
          $checks=[ordered]@{
            'blood-hunter-catalog-gate'=$validator.Contains('compiledSupplementClass')
            'subclass-class-gate'=$validator.Contains('CharacterOptionCatalogEngine.validateSubclass')
            'single-class-authority'=$generator.Contains('public String[] selectableClasses(String profile)') -and $main.Contains('characterGenerator.selectableClasses(rulesProfile)')
            'no-fake-subclass-placeholder'=(-not $generator.Contains('Subclasse disponível nos manuais habilitados'))
            'reactive-species-class-background-level'=$main.Contains('bindCharacterDependencyListeners(f,rulesProfile)') -and $main.Contains('reconcileCharacterDependencies')
            'subclass-min-level-ui'=$main.Contains('subclassMinimumLevelForForm')
            'ptbr-volo-source-label'=$local.Contains('Manual de Sub-raças de Volo')
          }
          $checks.GetEnumerator()|ForEach-Object{Write-Host "$(if($_.Value){'PASS'}else{'FAIL'}) $($_.Key)"}
          if($checks.Values -contains $false){throw 'RUN181_SOURCE_CONTRACT_FAILED'}

      - name: Compile and assemble APK
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $android="$env:ROOT\android";$out='C:\DND181\out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Force -Path $out | Out-Null
          if(!(Get-Command java.exe -ErrorAction SilentlyContinue)){$j='C:\Program Files\Android\Android Studio\jbr';if(Test-Path "$j\bin\java.exe"){$env:JAVA_HOME=$j;$env:Path="$j\bin;$env:Path"}}
          if(!$env:ANDROID_HOME){$sdk="$env:LOCALAPPDATA\Android\Sdk";if(Test-Path $sdk){$env:ANDROID_HOME=$sdk}}
          if(!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)){throw 'ANDROID_SDK_NOT_FOUND'};$env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          Set-Location $android
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:compileDebugJavaWithJavac --no-daemon --console=plain --stacktrace 2>&1 | Tee-Object "$out\JAVAC_RUN181.log";$rc=$LASTEXITCODE
          $ErrorActionPreference='Stop';if($rc -ne 0){throw "JAVAC_FAILED_$rc"}
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | Tee-Object "$out\GRADLE_RUN181.log";$rc=$LASTEXITCODE
          $ErrorActionPreference='Stop';if($rc -ne 0){throw "ASSEMBLE_FAILED_$rc"}
          $apk=Get-ChildItem "$android\app\build\outputs\apk\debug" -Filter *.apk -File | Select-Object -First 1;if(!$apk){throw 'APK_MISSING'}
          Copy-Item $apk.FullName "$out\$env:APK_NAME" -Force
          Copy-Item "$env:ROOT\RUN181_TTS_AUDIT.json" "$out\RUN181_TTS_AUDIT.json" -Force
          $bt=Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
          $badging=(& "$($bt.FullName)\aapt.exe" dump badging "$out\$env:APK_NAME")-join "`n"
          [IO.File]::WriteAllText("$out\APK_BADGING_RUN181.txt",$badging,(New-Object Text.UTF8Encoding($false)))
          if($badging -notmatch "package: name='com\.braseiro\.dnd5e'"){throw 'BAD_PACKAGE'}
          if($badging -notmatch "versionCode='606381'"){throw 'BAD_VERSION_CODE'}
          if($badging -notmatch "versionName='6\.6\.3-r181-debug'"){throw "BAD_VERSION_NAME: $badging"}
          $ErrorActionPreference='Continue'; & "$($bt.FullName)\apksigner.bat" verify --verbose --print-certs "$out\$env:APK_NAME" 2>&1 | Tee-Object "$out\APK_SIGNATURE_RUN181.txt";$rc=$LASTEXITCODE;$ErrorActionPreference='Stop';if($rc -ne 0){throw 'SIGNATURE_FAILED'}
          $sha=(Get-FileHash "$out\$env:APK_NAME" -Algorithm SHA256).Hash.ToLowerInvariant();"$sha  $env:APK_NAME" | Set-Content "$out\$env:APK_NAME.sha256" -Encoding ascii
          @("RUNNER=$env:RUNNER_NAME","PACKAGE=com.braseiro.dnd5e","VERSION=6.6.3-r181-debug","APK_SHA256=$sha","CHARACTER_CREATION_AUTHORITY=UNIFIED","REACTIVE_DEPENDENCIES=YES","KOKORO_AUDIT=RUN181_TTS_AUDIT.json")|Set-Content "$out\RUN181_BUILD_PROOF.txt" -Encoding utf8

      - name: Package patched Android Studio source
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $dst="C:\DND181\out\$env:SOURCE_ZIP_NAME"
          if(Test-Path $dst){Remove-Item $dst -Force}
          Compress-Archive -Path "$env:ROOT\*" -DestinationPath $dst -CompressionLevel Optimal
          $sha=(Get-FileHash $dst -Algorithm SHA256).Hash.ToLowerInvariant();"$sha  $env:SOURCE_ZIP_NAME" | Set-Content "$dst.sha256" -Encoding ascii

      - name: Upload RUN181 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_DND_6.6.3_RUN181
          path: C:\DND181\out\*
          if-no-files-found: error
          retention-days: 14
