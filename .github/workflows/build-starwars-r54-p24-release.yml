name: Braseiro Star Wars R54 P24 APK Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-starwars-r54-p24-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHARE_URL: 'https://firestorage.ai/ja/f/PpO4v-y3UHQ0'
  SOURCE_SHA256: '909df10ae58c45891508629ec54f1ce54a9f9ebdc42e0832582b3d0f46f0ad4e'
  SOURCE_NAME: 'STAR_WARS_EDGE_OF_THE_GALAXY_R54_P24_ITEM_WEAPON_IMAGES_FIXED.zip'
  APK_NAME: 'BRASEIRO_STAR_WARS_EDGE_R54_P24_DEBUG.apk'
  TAG: 'STAR-WARS-EDGE-R54-P24'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact P24 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming work out /tmp/sw-p24-download
          mkdir -p incoming work out /tmp/sw-p24-download
          cd /tmp/sw-p24-download
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url=process.env.SOURCE_SHARE_URL;
          const out=process.env.GITHUB_WORKSPACE+'/incoming/'+process.env.SOURCE_NAME;
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
          const page=await ctx.newPage();

          async function openShare(){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(3000);
          }
          async function attempt(){
            const candidates=page.locator('a,button,[role="button"],input[type="submit"]');
            const n=Math.min(await candidates.count(),150);
            for(let i=0;i<n;i++){
              const el=candidates.nth(i);
              let text='',href='',aria='',title='';
              try{text=((await el.innerText({timeout:500}))||'').trim()}catch{}
              try{href=(await el.getAttribute('href'))||''}catch{}
              try{aria=(await el.getAttribute('aria-label'))||''}catch{}
              try{title=(await el.getAttribute('title'))||''}catch{}
              const desc=(text+' '+href+' '+aria+' '+title);
              if(!/download|ダウンロード|一括|保存|zip|ファイル/i.test(desc)) continue;
              try{
                const pending=page.waitForEvent('download',{timeout:10000});
                await el.click({timeout:5000});
                const d=await pending;
                await d.saveAs(out);
                console.log('DOWNLOAD_OK',await d.suggestedFilename(),fs.statSync(out).size);
                return true;
              }catch{}
            }
            return false;
          }

          await openShare();
          let ok=false;
          for(let attemptNo=1;attemptNo<=30;attemptNo++){
            if(await attempt()){ok=true;break}
            let body='';
            try{body=(await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,1600)}catch{}
            console.log('WAIT',attemptNo,body);
            await page.waitForTimeout(5000);
            if(attemptNo%5===0) await openShare();
          }
          await browser.close();
          if(!ok || !fs.existsSync(out) || fs.statSync(out).size<1000000){
            throw new Error('P24 source download failed');
          }
          NODE
          node download.mjs
          cd "$GITHUB_WORKSPACE"
          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -t "incoming/$SOURCE_NAME" >/dev/null

      - name: Extract Android Studio source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "incoming/$SOURCE_NAME" -d work
          test -f work/android/gradlew
          test -f work/android/app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build P24 debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd work/android
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" > "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.starwarsedge'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-STAR-WARS-R54-P24
          path: |
            out/BRASEIRO_STAR_WARS_EDGE_R54_P24_DEBUG.apk
            out/BRASEIRO_STAR_WARS_EDGE_R54_P24_DEBUG.apk.sha256
            out/APK_BADGING.txt
            out/GRADLE_BUILD.log
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Star Wars Edge of the Galaxy R54 P24 — debug APK para teste físico. Inclui o runtime autoritativo de imagens de itens/armas no React, preservando as correções P23/P22/P21. applicationId: com.braseiro.starwarsedge. Source SHA-256: 909df10ae58c45891508629ec54f1ce54a9f9ebdc42e0832582b3d0f46f0ad4e.'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title 'Braseiro Star Wars Edge R54 P24 — Debug APK' --notes "$NOTES"
          gh release upload "$TAG"             "out/$APK_NAME"             "out/$APK_NAME.sha256"             out/APK_BADGING.txt             out/GRADLE_BUILD.log --clobber
          gh release view "$TAG" --json url --jq .url | tee out/RELEASE_URL.txt

      - name: Record build status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          mkdir -p ci
          {
            echo "STAR_WARS_R54_P24_RELEASE_STATUS=$JOB_STATUS"
            echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "SOURCE_SHA256=$SOURCE_SHA256"
            if [ -f "out/$APK_NAME.sha256" ]; then cat "out/$APK_NAME.sha256"; fi
            if [ -f out/RELEASE_URL.txt ]; then echo -n "RELEASE_URL="; cat out/RELEASE_URL.txt; fi
            if [ -f out/APK_BADGING.txt ]; then grep "^package:" out/APK_BADGING.txt | head -n1; fi
            if [ -f out/GRADLE_BUILD.log ]; then echo "--- GRADLE TAIL ---"; tail -n 40 out/GRADLE_BUILD.log; fi
          } > ci/starwars-r54-p24-release-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/starwars-r54-p24-release-status.txt
          git commit -m "ci: record Star Wars R54 P24 release status" || exit 0
          git push origin HEAD:main
