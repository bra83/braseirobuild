name: WWN post-1.0.6 consolidation

on:
  push:
    branches: [wwn-source-105-bridge]
    paths:
      - ".github/workflows/wwn-post-106-consolidation.yml"

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge
          fetch-depth: 0

      - name: Apply canonical source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{label}: pattern not found')
              p.write_text(s.replace(old,new,1), encoding='utf-8')

          j='app/src/main/assets/www/jornada.js'
          s=Path(j).read_text(encoding='utf-8')
          if "./core/journey-discovery.js" not in s:
              s=s.replace("import { PlayerMechanicsFacade } from './core/player-mechanics-facade.js';", "import { PlayerMechanicsFacade } from './core/player-mechanics-facade.js';\nimport { selectJourneyFeed, knownJourneyLocations } from './core/journey-discovery.js';\nimport { skillLabelPtBr } from './core/ptbr-labels.js';", 1)
          s=s.replace("label:`${k}${known.has(k)?` ${c.skills[k]>=0?`+${c.skills[k]}`:c.skills[k]}`:' (não treinado)'}`", "label:`${skillLabelPtBr(k)}${known.has(k)?` ${c.skills[k]>=0?`+${c.skills[k]}`:c.skills[k]}`:' (não treinado)'}`", 1)
          old="const starterHooks=content?.startingHooks??[],campaignRevision=Number(currentCanonicalState()?.revision??0),hookHost=$('hooks');if(starterHooks.length){const visible=Math.min(2,starterHooks.length),start=((campaignRevision%starterHooks.length)+starterHooks.length)%starterHooks.length;for(let i=0;i<visible;i++)hookHost.appendChild(card(starterHooks[(start+i)%starterHooks.length],'startingHook'));}const rumorPool=Array.isArray(pack?.rumors)?pack.rumors:[];if(rumorPool.length)hookHost.appendChild(rumorCard(rumorPool[((campaignRevision*3+1)%rumorPool.length+rumorPool.length)%rumorPool.length]));for(const s of content?.majorSites??[])$('sites').appendChild(card(s,'majorSite'));"
          new="const journeyState=currentCanonicalState(),hookHost=$('hooks'),feed=selectJourneyFeed(journeyState,pack,{hookCount:2,rumorCount:1});for(const h of feed.hooks)hookHost.appendChild(card(h,'startingHook'));for(const rumor of feed.rumors)hookHost.appendChild(rumorCard(rumor));const known=knownJourneyLocations(journeyState,pack);for(const site of known.majorSites)$('sites').appendChild(card(site,'majorSite'));"
          if old in s: s=s.replace(old,new,1)

          marker="function attachSceneImageResult(result,{generated=false,interactionId=null,model=null}={})"
          if "function stagePendingSceneImage" not in s:
              idx=s.index(marker)
              helper="function stagePendingSceneImage(result){const l=persistence.loadCampaign(campaignId);if(l.status!=='OK')return {status:'CAMPAIGN_UNAVAILABLE'};const st=JSON.parse(l.stateJson),next=structuredClone(st),newRevision=l.revision+1;next.revision=newRevision;next.uiState={...(next.uiState??{}),pendingSceneImage:{url:result.url,sha256:result.sha256,width:result.width,height:result.height,receivedAtRevision:newRevision}};const eventId=`scene-image-staged:${campaignId}:r${newRevision}`;const receipt=persistence.commit({campaignId,expectedRevision:l.revision,eventId,eventKind:'SCENE_IMAGE_STAGED',eventPayloadJson:canonicalJson({eventId,revision:newRevision,url:result.url,sha256:result.sha256,mechanicalMutation:false}),newStateJson:canonicalJson(next),rngCountersJson:canonicalJson(next.rngState?.counters??{})});return {status:receipt.status,receipt}}\nfunction persistedPendingSceneImage(){const l=persistence.loadCampaign(campaignId);if(l.status!=='OK')return null;try{return JSON.parse(l.stateJson)?.uiState?.pendingSceneImage??null}catch{return null}}\nfunction clearSceneImage(){const l=persistence.loadCampaign(campaignId);if(l.status!=='OK')return {status:'CAMPAIGN_UNAVAILABLE'};const st=JSON.parse(l.stateJson),next=structuredClone(st),newRevision=l.revision+1;next.revision=newRevision;next.encounterState={...(next.encounterState??{}),currentScene:{...(next.encounterState?.currentScene??{})}};delete next.encounterState.currentScene.imageRef;delete next.encounterState.currentScene.imageUrl;delete next.encounterState.currentScene.imageSha256;const eventId=`scene-image-removed:${campaignId}:r${newRevision}`;const receipt=persistence.commit({campaignId,expectedRevision:l.revision,eventId,eventKind:'SCENE_IMAGE_REMOVED',eventPayloadJson:canonicalJson({eventId,revision:newRevision,mechanicalMutation:false}),newStateJson:canonicalJson(next),rngCountersJson:canonicalJson(next.rngState?.counters??{})});if(receipt.status==='OK'){loaded=scenes.load({campaignId});projection=loaded.projection;renderScene(loaded.narrative)}return {status:receipt.status,receipt}}\n"
              s=s[:idx]+helper+s[idx:]
          s=s.replace("next.encounterState={...(next.encounterState??{}),currentScene:{...(next.encounterState?.currentScene??{}),imageRef:result.url,imageSha256:result.sha256}};", "next.encounterState={...(next.encounterState??{}),currentScene:{...(next.encounterState?.currentScene??{}),imageRef:result.url,imageSha256:result.sha256}};next.uiState={...(next.uiState??{})};delete next.uiState.pendingSceneImage;", 1)
          s=s.replace("const deferred=globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT??null;if(deferred){const attached=attachSceneImageResult(deferred,{generated:false});if(attached.status==='OK'){globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT=null;$('sceneImageStatus').textContent='Imagem recebida anteriormente e vinculada a esta cena.';}}", "const deferred=persistedPendingSceneImage()??globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT??null;if(deferred){const attached=attachSceneImageResult(deferred,{generated:false});if(attached.status==='OK'){globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT=null;$('sceneImageStatus').textContent='Imagem recebida anteriormente e vinculada a esta cena.';}}", 1)
          s=s.replace("if(!projection.scene||projection.scene.status!=='OK'){globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT=result;$('sceneImageStatus').textContent='Imagem recebida. Abra uma oportunidade ou local; ela será vinculada à próxima cena.';return;}", "if(!projection.scene||projection.scene.status!=='OK'){const staged=stagePendingSceneImage(result);globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT=result;$('sceneImageStatus').textContent=staged.status==='OK'?'Imagem recebida e preservada nesta campanha. Abra uma oportunidade ou local; ela será vinculada à próxima cena.':`Imagem recebida, mas não foi possível preservá-la: ${staged.status}`;return;}", 1)
          s=s.replace("if(imageRef){imported.src=imageRef;imported.classList.remove('hidden')}else{imported.removeAttribute('src');imported.classList.add('hidden')}", "if(imageRef){imported.src=imageRef;imported.classList.remove('hidden')}else{imported.removeAttribute('src');imported.classList.add('hidden')}const removeImage=$('sceneRemoveImageButton');if(removeImage)removeImage.classList.toggle('hidden',!imageRef)", 1)
          if "sceneRemoveImageButton').onclick" not in s:
              s=s.replace("$('sceneImageButton').onclick=()=>{const r=sceneImages.requestImport();$('sceneImageStatus').textContent=r.status==='PENDING'?'Escolha uma imagem local para esta cena.':`Importação indisponível: ${r.reason??r.status}`};", "$('sceneImageButton').onclick=()=>{const r=sceneImages.requestImport();$('sceneImageStatus').textContent=r.status==='PENDING'?'Escolha uma imagem local para esta cena.':`Importação indisponível: ${r.reason??r.status}`};const removeImageButton=$('sceneRemoveImageButton');if(removeImageButton)removeImageButton.onclick=()=>{const r=clearSceneImage();$('sceneImageStatus').textContent=r.status==='OK'?'Imagem removida desta cena.':`Não foi possível remover: ${r.status}`};", 1)
          Path(j).write_text(s,encoding='utf-8')

          h='app/src/main/assets/www/jornada.html'; s=Path(h).read_text(encoding='utf-8')
          if 'sceneRemoveImageButton' not in s:
              s=s.replace('<button id="sceneImageButton">IMPORTAR IMAGEM</button>', '<button id="sceneImageButton">IMPORTAR IMAGEM</button><button id="sceneRemoveImageButton" class="hidden">REMOVER IMAGEM</button>', 1)
          Path(h).write_text(s,encoding='utf-8')

          a='app/src/main/assets/www/scr014.js'; s=Path(a).read_text(encoding='utf-8')
          s=s.replace("label.textContent=String(rec.poiName??'POI').slice(0,18);", "label.textContent=String(rec.poiName??'POI');", 1)
          Path(a).write_text(s,encoding='utf-8')

          c='app/src/main/assets/www/scr014.css'; s=Path(c).read_text(encoding='utf-8')
          s=s.replace(".poi-symbol>i{font-style:normal;font:700 9px Arial,sans-serif;color:#e0c795;text-shadow:0 1px 2px #000;transform:rotate(-90deg);white-space:nowrap;max-width:48px;overflow:hidden;text-overflow:ellipsis}", ".poi-symbol>i{font-style:normal;font:700 7px/1.05 Arial,sans-serif;color:#e0c795;text-shadow:0 1px 2px #000;transform:none;white-space:normal;width:52px;max-width:52px;text-align:center;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}", 1)
          Path(c).write_text(s,encoding='utf-8')

          gate=Path('tools/wwn_post_106_gate.mjs')
          gate.write_text(r'''import fs from 'node:fs';import assert from 'node:assert/strict';const read=p=>fs.readFileSync(p,'utf8');const j=read('app/src/main/assets/www/jornada.js'),h=read('app/src/main/assets/www/jornada.html'),a=read('app/src/main/assets/www/scr014.js'),c=read('app/src/main/assets/www/scr014.css'),g=read('app/build.gradle.kts');assert.match(j,/skillLabelPtBr\(k\)/);assert.match(j,/selectJourneyFeed/);assert.match(j,/knownJourneyLocations/);assert.match(j,/stagePendingSceneImage/);assert.match(j,/pendingSceneImage/);assert.match(j,/SCENE_IMAGE_REMOVED/);assert.match(h,/sceneRemoveImageButton/);assert.doesNotMatch(a,/poiName\?\?'POI'\)\.slice\(0,18\)/);assert.match(c,/transform:none/);assert.match(g,/versionName = "1\.0\.10"/);console.log('WWN_POST_106_GATE_PASS=10');''',encoding='utf-8')
          PY

      - name: Validate source and regression gates
        run: |
          node tools/wwn_device_audit_gate.mjs
          node tools/wwn_post_106_gate.mjs

      - name: Commit consolidated source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/www/jornada.js app/src/main/assets/www/jornada.html app/src/main/assets/www/scr014.js app/src/main/assets/www/scr014.css tools/wwn_post_106_gate.mjs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(wwn): consolidate post-1.0.6 player flow regressions"
          git push origin HEAD:wwn-source-105-bridge
