name: Continue Star Wars R38 Block01 repairs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/continue-star-wars-r38-block01.yml"
      - "star-wars/r38/SOURCE.json"
      - "star-wars/r38/patches/**"
      - "STAR_WARS_R38_BLOCK01_TRIGGER.txt"

permissions:
  contents: write

jobs:
  block01:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned R38 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json',encoding='utf-8'))
          print('url='+d['source_share_url'])
          print('sha='+d['sha256'])
          print('file='+d['file'])
          print('app_id='+d['application_id'])
          print('compile_sdk='+str(d['compile_sdk']))
          PY

      - name: Setup Python downloader
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium downloader
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Download exact SHA-pinned R38 source
        env:
          SHARE_URL: ${{ steps.source.outputs.url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming work
          mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['SOURCE_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            page=b.new_page(accept_downloads=True)
            page.goto(os.environ['SHARE_URL'],wait_until='domcontentloaded',timeout=120000)
            page.wait_for_timeout(3500)
            for label in ['Accept','Aceitar','同意する','OK']:
              try:
                q=page.get_by_text(label,exact=True)
                if q.count() and q.first.is_visible(): q.first.click(timeout=1200)
              except Exception: pass
            done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
              try:
                q=page.locator(sel).first
                if not q.count() or not q.is_visible(): continue
                with page.expect_download(timeout=120000) as info: q.click(timeout=10000)
                info.value.save_as(str(out)); done=True; break
              except Exception: pass
            if not done:
              q=page.get_by_text(os.environ['SOURCE_FILE'],exact=False).first
              parent=q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
              with page.expect_download(timeout=120000) as info: parent.locator('a,button').last.click(timeout=10000)
              info.value.save_as(str(out)); done=True
            b.close()
          if not done or not out.exists(): raise SystemExit('Could not download pinned R38 source')
          PY
          echo "${EXPECTED_SHA}  incoming/${SOURCE_FILE}" | sha256sum -c -
          unzip -t "incoming/${SOURCE_FILE}" >/dev/null
          unzip -q "incoming/${SOURCE_FILE}" -d work

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find work -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | head -n1)"
          [ -n "$GRADLEW" ] || { echo '::error::gradlew not found'; exit 1; }
          ROOT="$(dirname "$GRADLEW")"
          [ -f "$ROOT/settings.gradle.kts" ] || [ -f "$ROOT/settings.gradle" ] || { echo '::error::settings.gradle not found'; exit 1; }
          chmod +x "$ROOT/gradlew"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "ROOT=$ROOT"

      - name: Apply Block01 patch only
        env:
          ROOT: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          python3 star-wars/r38/patches/block01_repair.py "$ROOT" | tee /tmp/block01-patch.txt
          grep -q '^BLOCK01_PATCH_OK$' /tmp/block01-patch.txt

      - name: Verify identity and Block01 contracts
        env:
          ROOT: ${{ steps.project.outputs.root }}
          EXPECTED_APP_ID: ${{ steps.source.outputs.app_id }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId = \"${EXPECTED_APP_ID}\"" "$ROOT/app/build.gradle.kts"
          grep -Fq 'targetSdk = 36' "$ROOT/app/build.gradle.kts"
          grep -Fq 'compileSdk = 36' "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/app/src/main/assets/vtt/image-library/local/scenes/recovered/scene_outer_rim_space_combat.webp"
          test -f "$ROOT/app/src/main/assets/vtt/image-library/local/scenes/recovered/scene_blaster_shootout.webp"
          test -f "$ROOT/app/src/main/assets/vtt/image-library/local/scenes/recovered/scene_imperial_infiltration.webp"
          test -f "$ROOT/app/src/main/assets/vtt/image-library/local/scenes/recovered/scene_ship_travel.webp"
          test -f "$ROOT/app/src/main/assets/vtt/image-library/local/scenes/recovered/scene_exploration.webp"
          test -f "$ROOT/app/src/main/assets/vtt/image-library/local/scenes/recovered/scene_briefing_social.webp"
          grep -Fq 'openGeminiWithPrompt' "$ROOT/app/src/main/java/com/braseiro/starwarsedge/GeminiBridge.java"
          grep -Fq 'pickSceneImage(currentSceneKey())' "$ROOT/app/src/main/assets/vtt/r46/final-runtime.js"
          grep -Fq 'RECOVERED_SCENE_VISUALS' "$ROOT/app/src/main/assets/vtt/r46/final-runtime.js"
          if grep -Fq 'g.generateSceneImage(prompt,currentSceneKey())' "$ROOT/app/src/main/assets/vtt/r46/final-runtime.js"; then
            echo '::error::Old direct scene API generation is still bound to CENA'; exit 1
          fi
          grep -Fq -- '--android-safe-bottom' "$ROOT/app/src/main/assets/vtt/r46/globals.css"
          grep -Fq 'applySystemInsetsToWeb' "$ROOT/app/src/main/java/com/braseiro/starwarsedge/MainActivity.java"
          grep -Fq 'Android WebView icon fallback' "$ROOT/app/src/main/assets/vtt/r46/r46.css"
          grep -Fq "inventory.png" "$ROOT/app/src/main/assets/vtt/r46/r46.css"
          grep -Fq "journal.png" "$ROOT/app/src/main/assets/vtt/r46/r46.css"
          grep -Fq 'viewport-fit=cover' "$ROOT/app/src/main/assets/vtt/r46-shell.html"

      - name: JS syntax gate for patched runtime
        env:
          ROOT: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          node --check "$ROOT/app/src/main/assets/vtt/r46/final-runtime.js"
          node --check "$ROOT/app/src/main/assets/vtt/r46/r46-shell.bundle.js"

      - name: Run focused R38 regression tests
        env:
          ROOT: ${{ steps.project.outputs.root }}
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/r38-mobile-ux-fixes.test.mjs \
            tests/gemini-host-r25.test.mjs \
            tests/native-bridge-contract.test.mjs \
            tests/android-json-file-chooser-contract-r16.test.mjs \
            tests/random-character-r24.test.mjs \
            tests/library-ui.test.mjs \
            tests/r46-bridge-contract.test.mjs \
            | tee /tmp/block01-node-tests.txt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-${{ steps.source.outputs.compile_sdk }}'

      - name: Java syntax/declaration gate
        env:
          ROOT: ${{ steps.project.outputs.root }}
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/java-syntax-gate.mjs | tee /tmp/block01-java-gate.txt

      - name: Build patched Android debug APK
        env:
          ROOT: ${{ steps.project.outputs.root }}
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon | tee /tmp/block01-gradle.txt

      - name: Validate patched APK without publishing it
        id: apk
        env:
          ROOT: ${{ steps.project.outputs.root }}
          EXPECTED_APP_ID: ${{ steps.source.outputs.app_id }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | sort | head -n1)"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' | tee /tmp/block01-badging.txt
          grep -q "package: name='${EXPECTED_APP_ID}'" /tmp/block01-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/block01-badging.txt
          sha256sum "$APK" | tee /tmp/block01-apk.sha256
          stat -c '%s' "$APK" | tee /tmp/block01-apk.size
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Write cumulative Block01 validation report
        env:
          ROOT: ${{ steps.project.outputs.root }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p star-wars/r38/audit
          TEST_SUMMARY="$(tail -n 20 /tmp/block01-node-tests.txt | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          APK_SHA="$(cut -d' ' -f1 /tmp/block01-apk.sha256)"
          APK_SIZE="$(cat /tmp/block01-apk.size)"
          cat > star-wars/r38/audit/BLOCK01_REPAIR_VALIDATION.md <<EOF
          # STAR WARS — EDGE OF THE GALAXY — R38 BLOCK01 REPAIR VALIDATION

          - Baseline source SHA-256: \`${SOURCE_SHA}\` — verified before patch.
          - R46 layout: preserved; no redesign.
          - New images generated: **0**.
          - Existing scene visuals recovered into runtime: **6**.
          - CENA illustration flow: **external Gemini handoff + manual import**.
          - Android system insets: **native insets bridged into CSS safe-area variables**.
          - Bottom navigation icons: **existing audited icon PNGs retained, Android mask rendering hardened**.
          - Patched runtime JS syntax: **PASS**.
          - Focused R38 regression suite: **PASS**.
          - Java gate: **PASS**.
          - Gradle \`:app:assembleDebug\`: **PASS**.
          - APK package / targetSdk validation: **PASS**.
          - Patched APK SHA-256 (validation only, not published): \`${APK_SHA}\`.
          - Patched APK size: \`${APK_SIZE}\` bytes.

          ## Scope

          This block changes only proven gaps: scene illustration handoff/import, scene fallback visuals, Android system insets, and bottom-navigation icon rendering. Rules, Motor Barbara contracts, campaign mechanics, and the approved R46 information architecture remain unchanged.

          ## Regression test tail

          \`${TEST_SUMMARY}\`
          EOF

      - name: Commit validation report only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name braseiro-audit-bot
          git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/BLOCK01_REPAIR_VALIDATION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(star-wars): record R38 Block01 repair validation'
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo '## Star Wars R38 Block01'
            echo '- Exact R38 baseline downloaded and SHA checked.'
            echo '- Block01 applied incrementally.'
            echo '- No APK published by this workflow.'
            if [ -f /tmp/block01-apk.sha256 ]; then echo "- Validation APK SHA: $(cut -d' ' -f1 /tmp/block01-apk.sha256)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
