name: Cancel Slow DnD Deep Gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-slow-dnd-deep-gate.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel slow gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/bra83/braseirobuild/actions/runs/37471214331/cancel
