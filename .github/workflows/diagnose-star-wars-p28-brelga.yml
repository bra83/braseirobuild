name: Diagnose Star Wars P28 on BRELGA
on:
  push:
    branches: [star-wars-r54-p28-adventure-engine]
    paths: ['.github/workflows/diagnose-star-wars-p28-brelga.yml']
permissions:
  contents: read
concurrency:
  group: star-wars-r54-p28-diagnostic
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce P28 syntax from exact P27 APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP 'p28-syntax-repro'
          Remove-Item $base -Recurse -Force -ErrorAction SilentlyContinue
          $extract=Join-Path $base 'extract'
          $root=Join-Path $base 'root'
          New-Item -ItemType Directory -Path $extract,(Join-Path $root 'app\src\main\assets') -Force | Out-Null
          $apk=Join-Path $base 'p27.apk'
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/octet-stream';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='BRELGA-P28-DIAG'}
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/579226597" -OutFile $apk
          $sha=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "P27_SHA=$sha"
          if($sha -ne '45683d734e91974663262da8f62abb7d92d6a04ec76f4b7df5dca14440bdd6a8'){throw 'P27 APK SHA mismatch'}
          & tar.exe -xf $apk -C $extract
          if($LASTEXITCODE -ne 0){throw 'P27 APK extraction failed'}
          Copy-Item (Join-Path $extract 'assets\vtt') (Join-Path $root 'app\src\main\assets\vtt') -Recurse -Force
          python -m py_compile star-wars/r54/p28/apply_p28_mixed_creation.py star-wars/r54/p28/apply_p28_adventure_engine.py star-wars/r54/p28/apply_p28_bonds_ui.py star-wars/r54/p28/apply_p28_random_creation.py
          python star-wars/r54/p28/apply_p28_mixed_creation.py $root
          python star-wars/r54/p28/apply_p28_adventure_engine.py $root
          python star-wars/r54/p28/apply_p28_bonds_ui.py $root
          python star-wars/r54/p28/apply_p28_random_creation.py $root
          $u=Join-Path $root 'app\src\main\assets\vtt\js\core\uiBridge.bundle.js'
          $lines=Get-Content $u
          Write-Host "UI_LINES=$($lines.Count)"
          $old=$ErrorActionPreference
          $ErrorActionPreference='Continue'
          $out = node --check $u 2>&1
          $code=$LASTEXITCODE
          $ErrorActionPreference=$old
          $out | ForEach-Object {Write-Host "NODE_CHECK $_"}
          Write-Host "NODE_EXIT=$code"
          for($n=535;$n -le [Math]::Min(620,$lines.Count);$n++){Write-Host ("LINE {0}: {1}" -f $n,$lines[$n-1])}
          $hit=Select-String -Path $u -Pattern 'R54_P28_PUBLISHED_SESSION' -Context 15,50
          if($hit){
            Write-Host '=== PUBLISHED SESSION CONTEXT ==='
            $hit.Context.PreContext | ForEach-Object {Write-Host "CTX $_"}
            Write-Host "CTX $($hit.Line)"
            $hit.Context.PostContext | ForEach-Object {Write-Host "CTX $_"}
          }
          if($code -ne 0){exit $code}
