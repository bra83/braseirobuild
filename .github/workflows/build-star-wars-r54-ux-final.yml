name: Build Star Wars R54 UX Final
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-star-wars-r54-ux-final.yml"
      - "star-wars/r54/fix_r54_ux.py"
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PACK_URL: https://firestorage.ai/ja/f/fpHIoZHL9wUf
      PACK_FILE: STAR_WARS_R54_VISUAL_DATA_PACK.zip
      PACK_SHA: f18bf92117bf00dfe6641c7ca31c8037904e79ef9816694c4e844099a4307f60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover baseline and visual pack
        run: |
          set -euo pipefail
          rm -rf work pack incoming && mkdir -p work pack incoming
          unzip -q star-wars/final-1.0.0/output-r53/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R53_REAL_DEVICE_HOTFIX.zip -d work
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['PACK_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);page=b.new_page(accept_downloads=True)
            page.goto(os.environ['PACK_URL'],wait_until='domcontentloaded',timeout=120000);page.wait_for_timeout(1500)
            done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
              try:
                loc=page.locator(sel).first
                if not loc.count() or not loc.is_visible():continue
                with page.expect_download(timeout=120000) as info:loc.click(timeout=10000)
                info.value.save_as(str(out));done=True;break
              except Exception:pass
            if not done:
              card=page.get_by_text(os.environ['PACK_FILE'],exact=False).first
              ctrl=card.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last
              with page.expect_download(timeout=120000) as info:ctrl.click(timeout=10000)
              info.value.save_as(str(out));done=True
            b.close()
          if not done or not out.exists():raise SystemExit('R54 pack download failed')
          PY
          echo "$PACK_SHA  incoming/$PACK_FILE" | sha256sum -c -
          unzip -q "incoming/$PACK_FILE" -d pack
      - id: root
        name: Apply current R54 repair stack
        run: |
          set -euo pipefail
          SET="$(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"
          test -n "$SET"; ROOT="$(dirname "$SET")"
          python3 -m py_compile star-wars/r54/hotfix_r54.py star-wars/r54/fix_map_anchor_state.py star-wars/r54/fix_item_binding_idempotence.py star-wars/r54/fix_aor_talent_runtime.py star-wars/r54/fix_r54_ux.py
          python3 star-wars/r54/hotfix_r54.py "$ROOT" "$(pwd)/pack"
          python3 star-wars/r54/fix_map_anchor_state.py "$ROOT"
          python3 star-wars/r54/fix_item_binding_idempotence.py "$ROOT"
          python3 star-wars/r54/fix_aor_talent_runtime.py "$ROOT"
          python3 star-wars/r54/fix_r54_ux.py "$ROOT"
          printf '\n.final-start-list button[hidden]{display:none!important}\n' >> "$ROOT/app/src/main/assets/vtt/r46/final-runtime.css"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Static UX and rules gates
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          V="$ROOT/app/src/main/assets/vtt"
          node --check "$V/r46/r46-shell.bundle.js"
          node --check "$V/r46/final-runtime.js"
          node --check "$V/js/core/uiBridge.bundle.js"
          grep -Fq 'R54 UX — FICHA JSON EM DADOS / DIAGNÓSTICO' "$V/r46/r46-shell.bundle.js"
          grep -Fq 'Exportar ficha JSON' "$V/r46/r46-shell.bundle.js"
          grep -Fq 'Importar ficha JSON' "$V/r46/r46-shell.bundle.js"
          ! grep -Fq 'no active Age of Rebellion tree data' "$V/js/core/uiBridge.bundle.js"
          grep -Fq 'dataset.r54VisualBound=key' "$V/r46/final-runtime.js"
          python3 - "$V" <<'PY'
          import json,sys
          from pathlib import Path
          v=Path(sys.argv[1]);s=(v/'js/rules/talentTreesData.mjs').read_text('utf-8');m='export const TALENT_TREES = Object.freeze(';i=s.index(m);j=s.index('{',i+len(m));trees=json.JSONDecoder().raw_decode(s[j:])[0]
          counts=(len(trees),sum(len(x) for x in trees.values()),sum(len(t['nodes']) for x in trees.values() for t in x.values()))
          assert counts==(12,36,720),counts
          print('STATIC_R54_UX_PASS',counts)
          PY
      - name: Browser UX smoke 415x915 and 360x800
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/r54-ux-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          sleep 1
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          init="window.confirm=()=>false;window.BraseiroGemini={getStatus:()=>JSON.stringify({configured:true}),openGeminiWithPrompt:()=>JSON.stringify({ok:true})};"
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for width,height in [(415,915),(360,800)]:
              pg=b.new_page(viewport={'width':width,'height':height});errs=[];pg.on('pageerror',lambda e:errs.append(str(e)));pg.add_init_script(init)
              pg.route('**/*',lambda route,req: route.continue_() if req.url.startswith('http://127.0.0.1:8765/') else route.abort())
              pg.goto('http://127.0.0.1:8765/r46-shell.html?screen=00',wait_until='domcontentloaded',timeout=30000);pg.wait_for_timeout(100)
              if pg.locator('#braseiro-sandbox-setup').count():
                pg.locator('#sandbox-list button[data-point]').first.click()
                pg.locator('#sandbox-start-button').click()
                pg.wait_for_selector('#braseiro-sandbox-setup',state='detached',timeout=10000)
              for n in range(31):
                r=f'{n:02d}';pg.goto('http://127.0.0.1:8765/r46-shell.html?screen='+r,wait_until='domcontentloaded',timeout=30000);pg.wait_for_timeout(60)
                assert pg.evaluate('document.documentElement.scrollWidth-window.innerWidth')<=2,(width,r)
              pg.goto('http://127.0.0.1:8765/r46-shell.html?screen=30',wait_until='domcontentloaded',timeout=30000);pg.wait_for_timeout(100)
              body=pg.locator('body').inner_text().upper()
              assert 'FICHA JSON' in body and 'IMPORTAR FICHA JSON' in body,body[-1200:]
              assert not errs,errs;pg.close()
            b.close()
          print('BROWSER_R54_UX_PASS 31/31 x2 + JSON settings')
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', validate-wrappers: false}
      - name: Configure Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build Android
        working-directory: ${{ steps.root.outputs.path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Persist validated R54 Android Studio ZIP and APK
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          OUT=star-wars/final-1.0.0/output-r54
          rm -rf "$OUT";mkdir -p "$OUT"
          APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n1)";test -f "$APK"
          DEST="$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk"
          cp "$APK" "$DEST";unzip -t "$DEST" >/dev/null
          sha256sum "$DEST" > "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk.sha256"
          (cd "$ROOT" && zip -qr "$GITHUB_WORKSPACE/$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip" . -x '*/build/*' '.gradle/*')
          sha256sum "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip" > "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip.sha256"
          printf 'R54 UX validated: 31 screens; character JSON exposed in Dados/diagnóstico; AoR 12/36/720.\n' > "$OUT/R54_UX_STATUS.txt"
          git config user.name github-actions;git config user.email github-actions@github.com
          git add -f "$OUT"
          git commit -m 'build: persist Star Wars R54 UX validated output' || true
          git reset --hard HEAD
          git clean -fd -- work pack incoming || true
          git pull --rebase origin main
          git push origin HEAD:main
