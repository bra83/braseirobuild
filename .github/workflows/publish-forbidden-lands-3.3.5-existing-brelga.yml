name: Publish Forbidden Lands 3.3.5 Existing APK - BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-forbidden-lands-3.3.5-existing-brelga.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-forbidden-lands-3.3.5-existing-brelga
  cancel-in-progress: true

env:
  BUILD_ROOT: "D:\\brelga-forbidden-lands-3.3.5"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5_DEBUG.apk"
  TAG: "forbidden-lands-3.3.5-brelga"
  EXPECTED_SHA1: "9d0f1089b3fb6c225f1f59462750864e897c4d92"
  VERIFIED_SOURCE_SHA256: "541ac9c12a8cbf77ebe5288959880b4fd8291f923b94819012dd37d873903c33"
  VERIFIED_FULL_SUITE_RUN_ID: "37252661827"

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Locate existing validated build
        id: locate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }

          $root=Join-Path $env:BUILD_ROOT 'project'
          $apk=Join-Path $root 'android\app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path $apk)) { throw "Existing APK not found: $apk" }

          $out=Join-Path $env:BUILD_ROOT 'publish-out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          "root=$root" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "apk=$apk" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "out=$out" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate package version signature and web marker
        id: validate
        shell: powershell
        env:
          ROOT: ${{ steps.locate.outputs.root }}
          APK: ${{ steps.locate.outputs.apk }}
          OUT: ${{ steps.locate.outputs.out }}
        run: |
          $ErrorActionPreference='Stop'

          $javaRoot='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk'
          $javaDir=Get-ChildItem $javaRoot -Directory -Recurse -ErrorAction Stop |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\java.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $javaDir) { throw 'Java tool-cache not found' }
          $env:JAVA_HOME=$javaDir.FullName
          $env:PATH="$($javaDir.FullName)\bin;$env:PATH"

          $sdkCandidates=@('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $sdkCandidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $sdkCandidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $sdkCandidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $sdk=$sdkCandidates | Where-Object { $_ -and (Test-Path $_) -and (Test-Path (Join-Path $_ 'build-tools')) } | Select-Object -First 1
          if (-not $sdk) { throw 'Android SDK not found' }

          $bt=Get-ChildItem (Join-Path $sdk 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $bt) { throw 'Android build-tools unavailable' }
          $aapt=Join-Path $bt.FullName 'aapt.exe'
          $signer=Join-Path $bt.FullName 'apksigner.bat'

          $badgingPath=Join-Path $env:OUT 'APK_BADGING.txt'
          & $aapt dump badging $env:APK 2>&1 | Tee-Object -FilePath $badgingPath
          if ($LASTEXITCODE -ne 0) { throw 'aapt badging failed' }
          $badging=Get-Content $badgingPath -Raw
          if ($badging -notmatch "package: name='com\.braseiro\.forbiddenlands'") { throw 'Wrong APK package' }
          if ($badging -notmatch "versionCode='303500'") { throw 'Wrong APK versionCode' }
          if ($badging -notmatch "versionName='3\.3\.5'") { throw 'Wrong APK versionName' }

          $sigPath=Join-Path $env:OUT 'APK_SIGNATURE.txt'
          & $signer verify --verbose --print-certs $env:APK 2>&1 | Tee-Object -FilePath $sigPath
          if ($LASTEXITCODE -ne 0) { throw 'APK signature invalid' }

          $signature=Get-Content $sigPath -Raw
          $match=[regex]::Match($signature,'Signer #1 certificate SHA-1 digest:\s*([0-9A-Fa-f:]+)')
          if (-not $match.Success) { throw 'Signer SHA-1 not found' }
          $actual=($match.Groups[1].Value -replace ':','').ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA1) { throw "Historical Google Drive OAuth SHA-1 mismatch: $actual" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead($env:APK)
          try {
            foreach ($required in @('AndroidManifest.xml','classes.dex','assets/public/index.html','assets/public/braseiro-release-marker.json')) {
              if (-not $z.GetEntry($required)) { throw "APK entry missing: $required" }
            }
            $entry=$z.GetEntry('assets/public/braseiro-release-marker.json')
            $reader=New-Object IO.StreamReader($entry.Open())
            $marker=($reader.ReadToEnd() | ConvertFrom-Json)
            $reader.Dispose()
            if ($marker.version -ne '3.3.5') { throw "Web marker mismatch: $($marker.version)" }
          } finally { $z.Dispose() }

          $published=Join-Path $env:OUT $env:APK_NAME
          Copy-Item $env:APK $published -Force
          $hash=(Get-FileHash $published -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content (Join-Path $env:OUT "$($env:APK_NAME).sha256") -Encoding ascii

          @(
            'STATUS=PASS',
            "RUNNER_NAME=$env:RUNNER_NAME",
            "SOURCE_SHA256=$env:VERIFIED_SOURCE_SHA256",
            "FULL_SUITE_RUN_ID=$env:VERIFIED_FULL_SUITE_RUN_ID",
            "APK_NAME=$env:APK_NAME",
            "APK_SHA256=$hash",
            'PACKAGE=com.braseiro.forbiddenlands',
            'VERSION_CODE=303500',
            'VERSION_NAME=3.3.5',
            "SIGNER_SHA1=$actual",
            'FULL_VERIFICATION_SUITE=PASS',
            'FINAL_ANDROID_SYNC_AND_RELEASE_GATES=PASS',
            'BUILD_APK=PASS',
            'RUNTIME_HOTFIX_3_3_5=PASS',
            'KOKORO=PASS',
            'COMBAT_INSPECTOR=PASS',
            'GOOGLE_DRIVE_HISTORICAL_SHA1=PASS'
          ) | Set-Content (Join-Path $env:OUT 'FORBIDDEN_LANDS_3.3.5_FINAL_BUILD_PROOF.txt') -Encoding utf8

          "dir=$env:OUT" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$hash" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_FORBIDDEN_LANDS_3.3.5_FINAL
          path: |
            ${{ steps.validate.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_DEBUG.apk
            ${{ steps.validate.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_DEBUG.apk.sha256
            ${{ steps.validate.outputs.dir }}/APK_BADGING.txt
            ${{ steps.validate.outputs.dir }}/APK_SIGNATURE.txt
            ${{ steps.validate.outputs.dir }}/FORBIDDEN_LANDS_3.3.5_FINAL_BUILD_PROOF.txt
          retention-days: 30

      - name: Publish final release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.validate.outputs.dir }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $headers=@{ Authorization="Bearer $env:GITHUB_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='BRELGA-FL335-Final' }
          $release=$null
          try { $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG" } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }

          if (-not $release) {
            $payload=@{
              tag_name=$env:TAG
              target_commitish='main'
              name='Braseiro Forbidden Lands 3.3.5 - FINAL'
              body='APK 3.3.5: suíte completa aprovada no BRELGA; runtime hotfix, Kokoro, ficha de combate, Android sync/release gates e assinatura histórica do Google Drive validados.'
              draft=$false
              prerelease=$false
            } | ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $payload -Uri "https://api.github.com/repos/$repo/releases"
          }

          $assets=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach ($name in @('BRASEIRO_FORBIDDEN_LANDS_3.3.5_DEBUG.apk','BRASEIRO_FORBIDDEN_LANDS_3.3.5_DEBUG.apk.sha256','APK_BADGING.txt','APK_SIGNATURE.txt','FORBIDDEN_LANDS_3.3.5_FINAL_BUILD_PROOF.txt')) {
            $path=Join-Path $env:APK_DIR $name
            if (-not (Test-Path $path)) { throw "Missing publish asset: $name" }
            $old=$assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($old) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($old.id)" | Out-Null }
            $mime=if ($name -like '*.apk') { 'application/vnd.android.package-archive' } else { 'text/plain' }
            $url="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
            & curl.exe -L --fail -X POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: $mime" --data-binary "@$path" $url
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed: $name" }
          }
          Write-Host "RELEASE_URL=$($release.html_url)"
