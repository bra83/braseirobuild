name: Purge all GitHub Actions artifacts

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every Actions artifact in this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -u

          deleted=0
          failed=0
          listed=0
          errors=""

          while true; do
            ids="$(gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$REPO/actions/artifacts?per_page=100"               --jq '.artifacts[].id' 2>/tmp/list_err)"
            rc=$?

            if [ $rc -ne 0 ]; then
              msg="$(cat /tmp/list_err)"
              errors="$errors
LIST ERROR: $msg"
              failed=$((failed + 1))
              break
            fi

            if [ -z "$ids" ]; then
              break
            fi

            page_deleted=0
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              listed=$((listed + 1))

              if out="$(gh api                 --method DELETE                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "/repos/$REPO/actions/artifacts/$id" 2>&1)"; then
                deleted=$((deleted + 1))
                page_deleted=$((page_deleted + 1))
              else
                failed=$((failed + 1))
                errors="$errors
DELETE $id ERROR: $out"
              fi
            done <<< "$ids"

            if [ $page_deleted -eq 0 ]; then
              break
            fi
          done

          body="Artifact purge diagnostic

Repository: $REPO
Listed attempts: $listed
Deleted: $deleted
Failed: $failed

Errors:
${errors:-none}
"

          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body" || true
          fi

          echo "$body"

          if [ $failed -gt 0 ]; then
            exit 1
          fi
