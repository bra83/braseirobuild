name: Purge all GitHub Actions artifacts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/purge-all-actions-artifacts.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every Actions artifact in this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          deleted=0
          echo "Repository: $REPO"

          while true; do
            ids="$(gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$REPO/actions/artifacts?per_page=100"               --jq '.artifacts[].id')"

            if [ -z "$ids" ]; then
              break
            fi

            while IFS= read -r id; do
              [ -z "$id" ] && continue
              gh api                 --method DELETE                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "/repos/$REPO/actions/artifacts/$id"
              deleted=$((deleted + 1))
              echo "Deleted artifact $id — total $deleted"
            done <<< "$ids"
          done

          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          result="run_id=$GITHUB_RUN_ID
repository=$REPO
deleted=$deleted
completed_at=$completed_at
"

          encoded="$(printf '%s' "$result" | base64 -w0)"
          path=".github/purge-artifacts-result.txt"
          sha="$(gh api "/repos/$REPO/contents/$path?ref=$GITHUB_REF_NAME" --jq '.sha' 2>/dev/null || true)"

          if [ -n "$sha" ]; then
            gh api               --method PUT               "/repos/$REPO/contents/$path"               -f message="chore: record artifact purge result"               -f content="$encoded"               -f sha="$sha"               -f branch="$GITHUB_REF_NAME" >/dev/null
          else
            gh api               --method PUT               "/repos/$REPO/contents/$path"               -f message="chore: record artifact purge result"               -f content="$encoded"               -f branch="$GITHUB_REF_NAME" >/dev/null
          fi

          echo "PURGE COMPLETE: $deleted artifact(s) deleted."
