name: Purge all GitHub Actions artifacts

on:
  pull_request:
    types:
      - opened
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every Actions artifact in this repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deleted=0

          while true; do
            ids="$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id')"

            if [ -z "$ids" ]; then
              break
            fi

            page_deleted=0

            while IFS= read -r id; do
              if [ -z "$id" ]; then
                continue
              fi

              gh api --method DELETE -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/repos/$REPO/actions/artifacts/$id"
              deleted=$((deleted + 1))
              page_deleted=$((page_deleted + 1))
            done <<< "$ids"

            if [ "$page_deleted" -eq 0 ]; then
              break
            fi
          done

          echo "PURGE_COMPLETE deleted=$deleted"
