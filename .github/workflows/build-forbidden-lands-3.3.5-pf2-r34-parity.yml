      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_FORBIDDEN_LANDS_3.3.5_FINAL_R7
          path: |
            ${{ steps.apk.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_FINAL_R7.apk
            ${{ steps.apk.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_FINAL_R7.apk.sha256
            ${{ steps.apk.outputs.dir }}/APK_BADGING.txt
            ${{ steps.apk.outputs.dir }}/APK_SIGNATURE.txt
            ${{ steps.apk.outputs.dir }}/PF2_R34_PARITY_PROOF.txt
            ${{ env.BUILD_ROOT }}/${{ env.FINAL_SOURCE_NAME }}
            ${{ env.BUILD_ROOT }}/${{ env.FINAL_SOURCE_NAME }}.sha256
          retention-days: 30

      - name: Publish validated release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='BRELGA-FL-PF2-PARITY'}
          $release=$null
          try{$release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG"}catch{if($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          if(-not $release){
            $payload=@{tag_name=$env:TAG;target_commitish='main';name='Braseiro Forbidden Lands 3.3.5 - Final R7';body='Final R7: preserva as correções dos bugreports Android de 2026-10-05 e corrige o último gate obsoleto sem reverter o runtime anti-freeze. Ações sugeridas permanecem IN_FICTION_ACTION; audioCues patológicos são neutralizados; commit mínimo não depende de serviços secundários; RAG é mecânico; SystemBars sem Illegal return; máximo de 2 modelos e budgets limitados. Inclui APK validado e source checkpoint R7.';draft=$false;prerelease=$false}|ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $payload -Uri "https://api.github.com/repos/$repo/releases"
          }
          $assets=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach($name in @($env:APK_NAME,"$($env:APK_NAME).sha256",'APK_BADGING.txt','APK_SIGNATURE.txt','PF2_R34_PARITY_PROOF.txt',$env:FINAL_SOURCE_NAME,"$($env:FINAL_SOURCE_NAME).sha256")){
            $path=if($name -eq $env:FINAL_SOURCE_NAME -or $name -eq "$($env:FINAL_SOURCE_NAME).sha256"){Join-Path $env:BUILD_ROOT $name}else{Join-Path $env:APK_DIR $name}
            $old=$assets|Where-Object{$_.name -eq $name}|Select-Object -First 1
            if($old){Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($old.id)"|Out-Null}
            $mime=if($name -like '*.apk'){'application/vnd.android.package-archive'}else{'text/plain'}
            $url="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
            & curl.exe -L --fail -X POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: $mime" --data-binary "@$path" $url
            if($LASTEXITCODE -ne 0){throw "Upload failed: $name"}
          }
