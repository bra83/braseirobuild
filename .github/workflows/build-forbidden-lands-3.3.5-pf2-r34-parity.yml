name: Forbidden Lands 3.3.5 Final Freeze Fix R7 - BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-forbidden-lands-3.3.5-pf2-r34-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forbidden-lands-3.3.5-final-r7
  cancel-in-progress: true

env:
  SOURCE_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5_BUGREPORT_FREEZE_FIX_R6_1_SOURCE.zip"
  SOURCE_BYTES: "26727762"
  SOURCE_SHA256: "f37e2729516c83fc3fc38b4726947f0cdf322afc7289f14a3b0cad1a9c6ab746"
  FIRESTORAGE_API: "https://api.firestorage.ai/dev/file/shares/9U2Qwn54TgjB"
  BUILD_ROOT: "D:\\brelga-fl-final-r7"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5_FINAL_R7.apk"
  TAG: "forbidden-lands-3.3.5-final-r7"
  EXPECTED_SHA1: "9d0f1089b3fb6c225f1f59462750864e897c4d92"
  FINAL_SOURCE_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5_FINAL_R7_SOURCE.zip"

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - name: Configure BRELGA toolchain
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          Remove-Item $env:BUILD_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $env:BUILD_ROOT -Force | Out-Null
          $nodeRoot='C:\actions-runner\_work\_tool\node'
          $nodeDir=Get-ChildItem $nodeRoot -Directory | ForEach-Object { Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue } |
            Where-Object { Test-Path (Join-Path $_.FullName 'node.exe') } | Sort-Object FullName -Descending | Select-Object -First 1
          $javaRoot='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk'
          $javaDir=Get-ChildItem $javaRoot -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName 'bin\java.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          $sdk='C:\actions-runner\android-sdk'
          if (-not $nodeDir -or -not $javaDir -or -not (Test-Path $sdk)) { throw 'BRELGA toolchain incomplete' }
          $temp=Join-Path $env:BUILD_ROOT 'temp'; $gradle=Join-Path $env:BUILD_ROOT 'gradle-home'; $npm=Join-Path $env:BUILD_ROOT 'npm-cache'
          New-Item -ItemType Directory -Path $temp,$gradle,$npm -Force | Out-Null
          $newPath="$($nodeDir.FullName);$($javaDir.FullName)\bin;$env:PATH"
          "PATH=$newPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JAVA_HOME=$($javaDir.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GRADLE_USER_HOME=$gradle" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NPM_CONFIG_CACHE=$npm" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download exact source
        id: src
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $meta=Invoke-RestMethod -Method Get -Uri ($env:FIRESTORAGE_API + '/files?maxResults=100')
          $file=$meta.files | Where-Object { $_.fileName -eq $env:SOURCE_NAME } | Select-Object -First 1
          if (-not $file) { throw "Source not found: $env:SOURCE_NAME" }
          $ticket=Invoke-RestMethod -Method Post -Uri ($env:FIRESTORAGE_API + '/files/' + $file.fileId + '/download')
          $zip=Join-Path $env:BUILD_ROOT $env:SOURCE_NAME
          & curl.exe -L --fail --connect-timeout 15 --max-time 90 --retry 3 --retry-delay 2 --retry-all-errors -o $zip $ticket.downloadUrl
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-Item $zip).Length -ne [int64]$env:SOURCE_BYTES) { throw 'Source size mismatch' }
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SOURCE_SHA256) { throw "Source SHA mismatch: $hash" }
          $root=Join-Path $env:BUILD_ROOT 'project'; New-Item -ItemType Directory -Path $root -Force | Out-Null
          & tar.exe -xf $zip -C $root
          if ($LASTEXITCODE -ne 0) { throw 'Extraction failed' }
          "root=$root" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Align stale Human Master gate with R7 runtime contract
        shell: powershell
        env:
          ROOT: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $gate=Join-Path $env:ROOT 'scripts\verify-human-master-runtime.mjs'
          if (-not (Test-Path $gate)) { throw "Human Master gate not found: $gate" }
          $env:GATE_PATH=$gate
          & node.exe -e "const fs=require('fs'); const p=process.env.GATE_PATH; let s=fs.readFileSync(p,'utf8'); const old='assert.match(narrative, /5\\.000 a 6\\.500 caracteres/);'; const next='assert.match(narrative, /CanonicalNarratorProfileService/);'; if(!s.includes(old)) throw new Error('obsolete opening-depth assertion not found'); s=s.replace(old,next); fs.writeFileSync(p,s,'utf8');"
          if ($LASTEXITCODE -ne 0) { throw 'Human Master gate UTF-8 patch failed' }

          # Preserve the tested runtime; only the stale literal assertion is updated.
          $director=(Get-ChildItem $env:ROOT -Recurse -File -Filter 'NarrativeDirectorService.ts' | Select-Object -First 1).FullName
          if (-not $director) { throw 'NarrativeDirectorService missing' }
          Write-Host "R7 director: $director"
          $directorText=Get-Content $director -Raw
          foreach($needle in @('CanonicalNarratorProfileService','normalizeAudioCues','isNarrationSufficient')){
            if (-not $directorText.Contains($needle)) { throw "R7 runtime invariant missing: $needle" }
          }

          # Compatibilidade R7: o assessment interno usa "presentation", enquanto Scene/UI e
          # o contrato de regressao usam "presentationKind". Expor ambos evita perda de rota
          # no clique de escolha sugerida sem alterar a classificacao.
          $intent=Join-Path $env:ROOT 'src\services\NarrativeIntentService.ts'
          if (-not (Test-Path $intent)) { throw 'NarrativeIntentService missing' }
          $env:INTENT_PATH=$intent
          & node.exe -e "const fs=require('fs'); const p=process.env.INTENT_PATH; let s=fs.readFileSync(p,'utf8'); const typeOld='  presentation: ScenePresentationKind;\n  preservesCheckpoint:'; const typeNew='  presentation: ScenePresentationKind;\n  presentationKind?: ScenePresentationKind;\n  preservesCheckpoint:'; if(!s.includes(typeOld)) throw new Error('intent type marker missing'); s=s.replace(typeOld,typeNew); const retOld='      presentation,\n      preservesCheckpoint,'; const retNew='      presentation,\n      presentationKind: presentation,\n      preservesCheckpoint,'; if(!s.includes(retOld)) throw new Error('intent return marker missing'); s=s.replace(retOld,retNew); fs.writeFileSync(p,s,'utf8');"
          if ($LASTEXITCODE -ne 0) { throw 'NarrativeIntent presentationKind compatibility patch failed' }

          # O runtime já emite [MASTER_FLOW] via masterTrace(stage). Atualiza o gate
          # para reconhecer a chamada dinâmica em vez de exigir o literal expandido no fonte.
          $bugGate=Join-Path $env:ROOT 'scripts\verify-bugreport-freeze-2026-10-05.mjs'
          if (-not (Test-Path $bugGate)) { throw 'Bugreport freeze gate missing' }
          $env:BUG_GATE_PATH=$bugGate
          & node.exe -e "eval(Buffer.from('','base64').toString('utf8'))"
          if ($LASTEXITCODE -ne 0) { throw 'Bugreport scene-commit gate patch failed' }

          # Corrige erro real TS2448: initial precisa existir antes do cálculo de tokens.
          $api=Join-Path $env:ROOT 'src\services\api.ts'
          if (-not (Test-Path $api)) { throw 'api.ts missing' }
          $env:API_PATH=$api
          & node.exe -e "eval(Buffer.from('','base64').toString('utf8'))"
          if ($LASTEXITCODE -ne 0) { throw 'api.ts initial ordering patch failed' }

          # Atualiza somente os marcadores literais do gate canônico para o perfil v1.0 atual.
          $canonGate=Join-Path $env:ROOT 'scripts\verify-canonical-narrator-profile.mjs'
          if (-not (Test-Path $canonGate)) { throw 'Canonical narrator gate missing' }
          $env:CANON_GATE_PATH=$canonGate
          & node.exe -e "eval(Buffer.from('','base64').toString('utf8'))"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical narrator marker gate patch failed' }

          # O gateway já desconecta no finally; o gate antigo usava janela de 100 chars.
          $audit=Join-Path $env:ROOT 'scripts\audit-deep.ts'
          if (-not (Test-Path $audit)) { throw 'audit-deep.ts missing' }
          $env:AUDIT_PATH=$audit
          & node.exe -e "eval(Buffer.from('','base64').toString('utf8'))"
          if ($LASTEXITCODE -ne 0) { throw 'Deep audit cleanup window patch failed' }

          # P0: escolhas sugeridas precisam entrar explicitamente como source='suggested'.
          $adventure=Join-Path $env:ROOT 'src\screens\AdventureScreenV3.tsx'
          if (-not (Test-Path $adventure)) { throw 'AdventureScreenV3.tsx missing' }
          $env:ADVENTURE_PATH=$adventure
          & node.exe -e "eval(Buffer.from('','base64').toString('utf8'))"
          if ($LASTEXITCODE -ne 0) { throw 'Suggested choice routing patch failed' }

          # Canonical patched source checkpoint, before npm/node_modules alter the tree.
          $finalZip=Join-Path $env:BUILD_ROOT $env:FINAL_SOURCE_NAME
          if (Test-Path $finalZip) { Remove-Item $finalZip -Force }
          Compress-Archive -Path (Join-Path $env:ROOT '*') -DestinationPath $finalZip -CompressionLevel Optimal
          $finalHash=(Get-FileHash $finalZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$finalHash  $env:FINAL_SOURCE_NAME" | Set-Content (Join-Path $env:BUILD_ROOT "$($env:FINAL_SOURCE_NAME).sha256") -Encoding ascii

      - name: Install dependencies
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          & node.exe -e "try{require.resolve('@rollup/rollup-win32-x64-msvc');process.exit(0)}catch{process.exit(1)}"
          if ($LASTEXITCODE -ne 0) {
            $v=(& node.exe -p "require('./node_modules/rollup/package.json').version").Trim()
            & npm.cmd install --no-save --no-package-lock --no-audit --no-fund "@rollup/rollup-win32-x64-msvc@$v"
          }
          & node.exe -e "try{require.resolve('@esbuild/win32-x64');process.exit(0)}catch{process.exit(1)}"
          if ($LASTEXITCODE -ne 0) {
            $v=(& node.exe -p "require('./node_modules/esbuild/package.json').version").Trim()
            & npm.cmd install --no-save --no-package-lock --no-audit --no-fund "@esbuild/win32-x64@$v"
          }

      - name: Executable suggested-choice regression
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $testPath=Join-Path (Get-Location) 'scripts\verify-choice-flow-runtime.mjs'
          @'
          import 'fake-indexeddb/auto';
          import assert from 'node:assert/strict';
          
          if (!globalThis.localStorage) {
            const data = new Map();
            globalThis.localStorage = {
              getItem: key => data.has(String(key)) ? data.get(String(key)) : null,
              setItem: (key, value) => data.set(String(key), String(value)),
              removeItem: key => data.delete(String(key)),
              clear: () => data.clear(),
              key: index => [...data.keys()][index] ?? null,
              get length() { return data.size; },
            };
          }
          if (!globalThis.window) globalThis.window = globalThis;
          if (!globalThis.CustomEvent) {
            globalThis.CustomEvent = class CustomEvent extends Event {
              constructor(type, init={}) { super(type); this.detail = init.detail; }
            };
          }
          if (!globalThis.window.dispatchEvent) globalThis.window.dispatchEvent = () => true;
          
          const { GeminiClientService } = await import('../src/services/GeminiClientService.ts');
          const { MasterOrchestratorService } = await import('../src/services/MasterOrchestratorService.ts');
          const { NarrativeIntentService } = await import('../src/services/NarrativeIntentService.ts');
          
          const settings = {
            narrativeProfile: 'Expert',
            narrativeStyle: 'Dinâmico',
            generateImages: false,
            ttsAutoplay: false,
          };
          
          const remoteScene = action => ({
            sceneTitle: 'Resposta à escolha',
            narration: 'A escolha "' + action + '" produz uma consequência imediata e concreta no espaço. O ambiente reage sem tomar decisões pelo personagem.\\n\\n' +
              'O grupo percebe uma mudança pequena, mas suficiente para confirmar que a ação aconteceu. Nada é resolvido fora do que foi estabelecido.\\n\\n' +
              'Uma nova possibilidade surge a partir da consequência observável, preservando continuidade, posição e agência.\\n\\n' +
              'A cena permanece aberta para outra decisão real.',
            npcDialogue: [],
            suggestedActions: ['Observar a mudança', 'Interagir com o elemento revelado', 'Mudar de abordagem'],
            checks: [],
            statePatches: [],
            worldOperations: [],
            audioCues: [],
            imagePrompt: '',
            timelineSummary: 'A escolha foi processada e a cena avançou.',
            requiresPlayerDecision: true,
            advancesFiction: true,
            presentationKind: 'scene',
          });
          
          const originalCall = GeminiClientService.call;
          const choices = [
            'Observar os rastros perto da trilha',
            'Aproximar-se da porta sem fazer barulho',
            'Conversar com a figura à margem da estrada',
          ];
          
          let calls = 0;
          GeminiClientService.call = async (_model, payload) => {
            calls += 1;
            return remoteScene(String(payload?.userInput || choices[(calls - 1) % choices.length]));
          };
          
          const runChoice = async action => {
            const intent = NarrativeIntentService.classify(action, { trustedFictionAction: true });
            assert.equal(intent.kind, 'action');
            assert.equal(intent.advancesFiction, true);
            assert.equal(intent.presentation, 'scene');
          
            const started = performance.now();
            const result = await MasterOrchestratorService.run({
              payload: {
                userInput: action,
                systemInstruction: 'Teste de regressão do Mestre. Preserve agência e continuidade.',
                history: '',
                rulesPreloaded: true,
                ruleAuthority: { mechanical: false, authorized: true, reason: 'ação ficcional', domain: 'none' },
                ruleCitations: [],
              },
              settings,
              characters: [],
              actingCharacter: null,
              initial: false,
              firstVisit: false,
              rollResolution: false,
              cinematic: false,
              intent,
            });
            assert.ok(result);
            assert.equal(result.masterDecision?.generationSource, 'gemini');
            assert.ok(String(result.narration || '').length > 100);
            assert.equal(Array.isArray(result.suggestedActions), true);
            assert.equal(result.suggestedActions.length, 3);
            assert.ok(performance.now() - started < 1500, 'choice pipeline with mocked Gemini should not stall');
            return result;
          };
          
          // 12 turnos consecutivos: prova que uma escolha não envenena o próximo clique.
          for (let i = 0; i < 12; i += 1) await runChoice(choices[i % choices.length]);
          assert.equal(calls, 12, 'cada escolha deve produzir exatamente uma chamada remota bem-sucedida');
          
          // Primeiro modelo falha, segundo responde: o roteador deve avançar e concluir.
          let retryCalls = 0;
          GeminiClientService.call = async (_model, payload) => {
            retryCalls += 1;
            if (retryCalls === 1) throw new Error('HTTP 503: temporariamente indisponível');
            return remoteScene(String(payload?.userInput || choices[0]));
          };
          const retryResult = await runChoice(choices[0]);
          assert.ok(retryResult);
          assert.equal(retryCalls, 2, 'fallback de modelo deve usar no máximo duas tentativas nesta ação');
          
          // Todos os modelos falham: MasterOrchestrator precisa devolver fallback local, não travar.
          let failureCalls = 0;
          GeminiClientService.call = async () => {
            failureCalls += 1;
            throw new Error('TIMEOUT: chamada simulada');
          };
          const fallbackIntent = NarrativeIntentService.classify(choices[1], { trustedFictionAction: true });
          const fallbackStarted = performance.now();
          const fallback = await MasterOrchestratorService.run({
            payload: {
              userInput: choices[1],
              systemInstruction: 'Teste de fallback local.',
              history: '',
              rulesPreloaded: true,
              ruleAuthority: { mechanical: false, authorized: true, reason: 'ação ficcional', domain: 'none' },
              ruleCitations: [],
            },
            settings,
            characters: [],
            actingCharacter: null,
            initial: false,
            firstVisit: false,
            rollResolution: false,
            cinematic: false,
            intent: fallbackIntent,
          });
          assert.equal(fallback.masterDecision?.generationSource, 'local-fallback');
          assert.ok(String(fallback.narration || '').length > 100);
          assert.equal(fallback.suggestedActions.length, 3);
          assert.ok(performance.now() - fallbackStarted < 1500, 'fallback local deve liberar a ação imediatamente após falha');
          assert.equal(failureCalls, 2, 'ação não pode percorrer mais de dois modelos');
          
          // Browser/client timeout: Promise que nunca responde precisa ser abortada e rejeitada.
          const originalFetch = globalThis.fetch;
          globalThis.fetch = (_url, options={}) => new Promise((resolve, reject) => {
            const signal = options.signal;
            if (signal?.aborted) {
              const error = new Error('aborted'); error.name = 'AbortError'; reject(error); return;
            }
            signal?.addEventListener('abort', () => {
              const error = new Error('aborted'); error.name = 'AbortError'; reject(error);
            }, { once: true });
          });
          const timeoutStarted = performance.now();
          let timeoutError = '';
          try {
            await GeminiClientService.requestRaw?.('gemini-test', { contents: [] }, 1800, 'fake-key', false);
          } catch (error) {
            timeoutError = String(error?.message || error);
          }
          const timeoutElapsed = performance.now() - timeoutStarted;
          assert.match(timeoutError, /TIMEOUT/i);
          assert.ok(timeoutElapsed >= 1400 && timeoutElapsed < 2800, `timeout executável fora da janela: ${timeoutElapsed}ms`);
          globalThis.fetch = originalFetch;
          
          GeminiClientService.call = originalCall;
          
          console.log('PASS choice-flow runtime: 12 escolhas sequenciais, retry 503, fallback local e timeout abortável.');
          '@ | Set-Content $testPath -Encoding utf8
          & node.exe -r .\work\tsx-userinfo-shim.cjs --import tsx scripts\verify-choice-flow-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'EXECUTABLE CHOICE FLOW FAILED - APK BLOCKED' }
          $adventure=Get-Content 'src\screens\AdventureScreenV3.tsx' -Raw
          if (-not $adventure.Contains("send(action, undefined, false, undefined, 'suggested')")) {
            throw 'Suggested-choice UI binding missing - APK BLOCKED'
          }

      - name: PF2 R34 parity invariants
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & node.exe scripts/verify-pf2-r34-parity.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PF2 R34 parity gate failed' }
          & npm.cmd run verify:human-master-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Human Master runtime gate failed' }
          & npm.cmd run verify:master-no-freeze-r5
          if ($LASTEXITCODE -ne 0) { throw 'Master no-freeze R5 gate failed' }
          & npm.cmd run verify:bugreport-freeze-2026-10-05
          if ($LASTEXITCODE -ne 0) { throw 'Bugreport freeze R6 gate failed' }
          & npm.cmd run lint
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }

      - name: Targeted regression battery
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $tests=@(
            'verify-rag-not-required',
            'verify:rag-off-kokoro-startup',
            'verify:runtime-hotfix-3.3.5',
            'verify:runtime-integration-v3',
            'verify:runtime-playthroughs-v3',
            'verify:dice-full',
            'verify:adventure-sites-v2',
            'verify:canonical-narrator-profile',
            'verify:human-master-runtime',
            'verify:bugreport-freeze-2026-10-05',
            'verify:google-drive-signing'
          )
          foreach($test in $tests){
            Write-Host "=== $test ==="
            & npm.cmd run $test
            if($LASTEXITCODE -ne 0){throw "Targeted regression failed: $test"}
          }

      - name: Pre-sync Android assets for full regression
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd run android:sync
          if ($LASTEXITCODE -ne 0) { throw 'Pre-sync Android assets failed' }

      - name: Full regression suite
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd run verify
          if ($LASTEXITCODE -ne 0) { throw 'Full regression suite failed' }

      - name: Final Android sync and parity recheck
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd run android:sync
          if ($LASTEXITCODE -ne 0) { throw 'Android sync failed' }
          & npm.cmd run verify:android
          if ($LASTEXITCODE -ne 0) { throw 'Android verify failed' }
          & npm.cmd run lint
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript regressed after Android sync' }
          & node.exe scripts/verify-pf2-r34-parity.mjs
          if ($LASTEXITCODE -ne 0) { throw 'PF2 parity regressed after sync' }
          & npm.cmd run verify:bugreport-freeze-2026-10-05
          if ($LASTEXITCODE -ne 0) { throw 'Bugreport freeze fix regressed after Android sync' }

      - name: Build APK
        shell: powershell
        working-directory: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          & node.exe scripts/run-gradle-task.mjs assembleDebug
          if ($LASTEXITCODE -ne 0) { throw 'assembleDebug failed' }

      - name: Validate APK
        id: apk
        shell: powershell
        env:
          ROOT: ${{ steps.src.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $built=Join-Path $env:ROOT 'android\app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path $built)) { throw 'APK not produced' }
          $out=Join-Path $env:BUILD_ROOT 'out'; New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apk=Join-Path $out $env:APK_NAME; Copy-Item $built $apk -Force
          $bt=Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $aapt=Join-Path $bt.FullName 'aapt.exe'; $signer=Join-Path $bt.FullName 'apksigner.bat'
          & $aapt dump badging $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_BADGING.txt')
          if ($LASTEXITCODE -ne 0) { throw 'aapt failed' }
          $badging=Get-Content (Join-Path $out 'APK_BADGING.txt') -Raw
          if ($badging -notmatch "package: name='com\.braseiro\.forbiddenlands'") { throw 'Wrong package' }
          & $signer verify --verbose --print-certs $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_SIGNATURE.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Signature invalid' }
          $sig=Get-Content (Join-Path $out 'APK_SIGNATURE.txt') -Raw
          $m=[regex]::Match($sig,'Signer #1 certificate SHA-1 digest:\s*([0-9A-Fa-f:]+)')
          if (-not $m.Success) { throw 'Signer SHA-1 absent' }
          $actual=($m.Groups[1].Value -replace ':','').ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA1) { throw "Signer mismatch: $actual" }
          $hash=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content (Join-Path $out "$($env:APK_NAME).sha256") -Encoding ascii
          @(
            'STATUS=PASS',
            "SOURCE_SHA256=$env:SOURCE_SHA256",
            "APK_SHA256=$hash",
            'PF2_R34_SINGLE_REMOTE_NARRATOR=PASS',
