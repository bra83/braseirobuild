name: Build Star Wars R54 P5 Device Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-star-wars-r54-p5.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Recover P4 and apply P5
        id: root
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P4_FINAL_CANDIDATE.zip
          test -f "$ZIP"; rm -rf /tmp/r54-p5; mkdir /tmp/r54-p5; unzip -q "$ZIP" -d /tmp/r54-p5
          SET=$(find /tmp/r54-p5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -1)
          ROOT=$(dirname "$SET"); echo "path=$ROOT" >> "$GITHUB_OUTPUT"
          python3 star-wars/r54/fix_device_p5.py "$ROOT" | tee /tmp/P5_AUDIT.txt
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', validate-wrappers: false}
      - name: Compile APK
        working-directory: ${{ steps.root.outputs.path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Persist P5
        env: {ROOT: '${{ steps.root.outputs.path }}'}
        run: |
          set -euo pipefail; OUT=star-wars/final-1.0.0/output-r54
          APK=$(find "$ROOT/app/build/outputs/apk/debug" -name '*.apk' | head -1); test -f "$APK"
          cp "$APK" /tmp/P5.apk; (cd "$ROOT" && zip -qr /tmp/P5.zip . -x '*/build/*' '.gradle/*')
          sha256sum /tmp/P5.apk >/tmp/P5.apk.sha256; sha256sum /tmp/P5.zip >/tmp/P5.zip.sha256
          git config user.name github-actions; git config user.email github-actions@github.com
          git reset --hard HEAD; git clean -fd; git fetch origin main; git reset --hard origin/main
          mkdir -p "$OUT" star-wars/r54/audit
          cp /tmp/P5.apk "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P5_DEBUG.apk"
          cp /tmp/P5.zip "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P5.zip"
          cp /tmp/P5.apk.sha256 "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P5_DEBUG.apk.sha256"
          cp /tmp/P5.zip.sha256 "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P5.zip.sha256"
          cp /tmp/P5_AUDIT.txt star-wars/r54/audit/DEVICE_P5_2026-09-17.txt
          git add -f "$OUT" star-wars/r54/audit
          git commit -m 'build(star-wars): persist R54 device P5 repair' || exit 0
          git push origin HEAD:main
