name: BRASEIRO Cyberpunk RED R4.64.1 APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-cyberpunk-r464.yml"
      - "CYBERPUNK_RED_BUILD_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write

env:
  CPRED_SOURCE_SHARE_URL: "https://firestorage.ai/ja/f/PcuAwqsFLYmN"
  CPRED_SOURCE_SHA256: "38ab66a15c2a27dff2fb4bf28870ba7561435f4779b0a0f84081b35f002dec15"
  CPRED_SOURCE_NAME: "CYBERPUNK_RED_R4_64_1_ANDROID_BUILD_FIX_ANDROID_STUDIO.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        name: Checkout braseirobuild

      - name: Download exact Cyberpunk RED R4.64.1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming /tmp/cpred-browser
          ZIP="$GITHUB_WORKSPACE/incoming/$CPRED_SOURCE_NAME"
          cd /tmp/cpred-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({acceptDownloads:true, locale:'ja-JP'});
          const page = await context.newPage();
          const url = process.env.CPRED_SOURCE_SHARE_URL;
          const output = process.env.GITHUB_WORKSPACE + '/incoming/' + process.env.CPRED_SOURCE_NAME;

          async function openShare() {
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2500);
          }

          async function attemptDownload() {
            const candidates = page.locator('a,button,[role="button"]');
            const count = Math.min(await candidates.count(), 120);
            for (let i=0;i<count;i++) {
              const el = candidates.nth(i);
              let text=''; let href='';
              try { text=(await el.innerText({timeout:700})).trim(); } catch {}
              try { href=(await el.getAttribute('href')) || ''; } catch {}
              if (!/download|ダウンロード|一括|保存|ZIP|ファイル/i.test(text+' '+href)) continue;
              try {
                const pending = page.waitForEvent('download',{timeout:8000});
                await el.click({timeout:4000});
                const d = await pending;
                await d.saveAs(output);
                return true;
              } catch {
                try { if (!page.url().includes('/f/')) await openShare(); } catch {}
              }
            }
            return false;
          }

          await openShare();
          for (let attempt=1; attempt<=24; attempt++) {
            if (await attemptDownload()) {
              console.log(`DOWNLOAD_OK attempt=${attempt}`);
              await browser.close();
              process.exit(0);
            }
            let body='';
            try { body=(await page.locator('body').innerText()).slice(0,1200).replace(/\s+/g,' '); } catch {}
            console.log(`WAIT_ATTEMPT=${attempt} BODY=${body}`);
            await page.waitForTimeout(5000);
            if (attempt % 4 === 0) await openShare();
          }
          console.log((await page.locator('body').innerText()).slice(0,8000));
          await browser.close();
          process.exit(2);
          NODE
          node download.mjs
          cd "$GITHUB_WORKSPACE"
          unzip -t "$ZIP" >/dev/null
          echo "$CPRED_SOURCE_SHA256  $ZIP" | sha256sum -c -
          ls -lh "$ZIP"

      - name: Extract project and detect Android root
        id: android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q "incoming/$CPRED_SOURCE_NAME" -d work
          ROOT=""
          while IFS= read -r -d '' W; do
            D="$(dirname "$W")"
            if [ -f "$D/settings.gradle.kts" ] || [ -f "$D/settings.gradle" ]; then ROOT="$D"; break; fi
          done < <(find work -type f -name gradlew -print0)
          [ -n "$ROOT" ] || { echo "::error::Android root not found"; exit 1; }
          chmod +x "$ROOT/gradlew"
          SDK="$(grep -hoE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' "$ROOT/app/build.gradle.kts" | grep -oE '[0-9]+' | head -n1)"
          [ -n "$SDK" ] || SDK=36
          KOTLIN="$ROOT/app/src/main/java/com/braseiro/cyberpunkred/BarbaraRuntime.kt"
          grep -F 'Regex("""\d+,\d+""")' "$KOTLIN" >/dev/null || { echo "::error::R4.64.1 Kotlin build fix missing"; exit 1; }
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "ROOT=$ROOT SDK=$SDK"
          grep -E 'applicationId|versionCode|versionName|minSdk|targetSdk|compileSdk' "$ROOT/app/build.gradle.kts" || true

      - uses: actions/setup-java@v4
        name: Configure Java 17
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        name: Configure Android SDK

      - name: Install Android SDK platform and build tools
        shell: bash
        env:
          SDK: ${{ steps.android.outputs.sdk }}
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${SDK}" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        name: Configure Gradle cache

      - name: Build Cyberpunk RED debug APK
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Collect and validate APK
        id: apk
        shell: bash
        env:
          ROOT: ${{ steps.android.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find "$ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -n1)"
          [ -n "${APK:-}" ] && [ -f "$APK" ] || { echo "::error::Debug APK not found"; exit 1; }
          NAME="BRASEIRO-CYBERPUNK-RED-R4.64.1-DEBUG.apk"
          FINAL="out/$NAME"
          cp "$APK" "$FINAL"
          unzip -t "$FINAL" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' | tee out/APK_BADGING.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL" | tee out/APK_SIGNATURE.txt
          grep -q "package: name='com.braseiro.cyberpunkred'" out/APK_BADGING.txt || { echo "::error::Unexpected package id"; exit 1; }
          sha256sum "$FINAL" | tee "out/$NAME.sha256"
          stat -c 'APK_SIZE_BYTES=%s' "$FINAL" | tee out/APK_SIZE.txt
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK in GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          TAG="cyberpunk-red-r4.64.1"
          TITLE="BRASEIRO Cyberpunk RED R4.64.1 DEBUG APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "Cyberpunk RED R4.64.1 debug APK. Source SHA-256: $CPRED_SOURCE_SHA256. Built with Gradle 8.11.1 / compileSdk 36."
          fi
          gh release upload "$TAG" out/* --clobber
          RELEASE_URL="$(gh release view "$TAG" --json url --jq .url)"
          ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$APK_NAME\") | .id")"
          [ -n "$ASSET_ID" ] || { echo "::error::Release APK asset ID not found"; exit 1; }
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
          HDR="$(mktemp)"
          curl -sS -D "$HDR" -o /dev/null -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL"
          SIGNED_URL="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$HDR")"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "asset_id=$ASSET_ID" >> "$GITHUB_OUTPUT"
          echo "signed_url=$SIGNED_URL" >> "$GITHUB_OUTPUT"
          echo "RELEASE_URL=$RELEASE_URL"
          echo "APK_ASSET_ID=$ASSET_ID"
          echo "SIGNED_APK_URL=$SIGNED_URL"

      - name: Summary
        shell: bash
        run: |
          echo "## BRASEIRO Cyberpunk RED R4.64.1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA-256: $CPRED_SOURCE_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: assembleDebug" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: com.braseiro.cyberpunkred" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: ${{ steps.apk.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: ${{ steps.release.outputs.release_url }}" >> "$GITHUB_STEP_SUMMARY"
