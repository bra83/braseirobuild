name: BRASEIRO WWN Source Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wwn-source-bridge.yml"

permissions:
  contents: write

env:
  WWN_SOURCE_SHARE_URL: "https://firestorage.ai/ja/f/bgLdDFFX-y7t"
  WWN_SOURCE_SHA256: "b3f45afed85ac93bad26fee1117788de69178b5e5c84f1d46c602d6fc8e1c1ad"

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact cumulative WWN source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming /tmp/wwn-download
          cd /tmp/wwn-download
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
          const page=await ctx.newPage();
          await page.goto(process.env.WWN_SOURCE_SHARE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3000);
          const out=process.env.GITHUB_WORKSPACE+'/incoming/wwn.zip';
          for(const sel of ['text=/一括ダウンロード/i','text=/ダウンロード/i','text=/Download/i','button','a']){
            const loc=page.locator(sel), n=Math.min(await loc.count(),50);
            for(let i=0;i<n;i++){
              const el=loc.nth(i); let text=''; try{text=(await el.innerText({timeout:1000})).trim()}catch{}
              if((sel==='button'||sel==='a')&&!/download|ダウンロード|一括|保存|ZIP|ファイル/i.test(text)) continue;
              try{const p=page.waitForEvent('download',{timeout:10000}); await el.click({timeout:5000}); const d=await p; await d.saveAs(out); await browser.close(); process.exit(0)}catch{}
            }
          }
          await browser.close(); process.exit(2);
          NODE
          node download.mjs
          cd "$GITHUB_WORKSPACE"
          unzip -t incoming/wwn.zip >/dev/null
          echo "$WWN_SOURCE_SHA256  incoming/wwn.zip" | sha256sum -c -
          rm -rf /tmp/wwn-source && mkdir -p /tmp/wwn-source
          unzip -q incoming/wwn.zip -d /tmp/wwn-source
      - name: Publish exact source to temporary bridge branch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/wwn-source
          count=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)
          files=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$count" -eq 1 ] && [ "$files" -eq 0 ]; then ROOT=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | head -1); fi
          git config user.name "BRASEIRO WWN Bridge"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan wwn-source-105-bridge
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$ROOT"/. .
          printf '%s\n' "$WWN_SOURCE_SHA256  source checkpoint sha256" > .wwn-source-checkpoint
          git add -A
          git commit -m "checkpoint: exact WWN Performance 1.0.5 source"
          git push --force origin HEAD:refs/heads/wwn-source-105-bridge
