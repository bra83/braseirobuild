name: PF2 Kingmaker R36 BRELGA Android Runtime Acceptance
on:
  push:
    branches: [pf2-kingmaker-r36-official-rule-fixes-20261011]
    paths: ['.github/workflows/pf2-r36-brelga-emulator-acceptance.yml', 'ci/pf2-kingmaker-certification/android_ui_endurance.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pf2-r36-brelga-android-runtime
  cancel-in-progress: true
jobs:
  android:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 95
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/pf2-kingmaker-certification
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision Android Emulator and API 30 AVD on BRELGA
        shell: powershell
        timeout-minutes: 48
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'WRONG_RUNNER'}
          $candidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'))|Where-Object{$_ -and (Test-Path $_)}
          $sdk=$candidates|Where-Object{Test-Path (Join-Path $_ 'platform-tools\adb.exe')}|Select-Object -First 1
          if(!$sdk){throw 'ANDROID_SDK_WITH_ADB_NOT_FOUND'}
          $env:ANDROID_SDK_ROOT=$sdk
          $env:ANDROID_HOME=$sdk
          Write-Host "R36_ANDROID_SDK=$sdk"
          $bin=Join-Path $sdk 'emulator\emulator.exe'
          $sdkcmd=@(Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Filter sdkmanager.bat -Recurse -File -ErrorAction SilentlyContinue)
          $avdcmd=@(Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Filter avdmanager.bat -Recurse -File -ErrorAction SilentlyContinue)
          $manager=$sdkcmd|Select-Object -First 1 -ExpandProperty FullName
          $avdmanager=$avdcmd|Select-Object -First 1 -ExpandProperty FullName
          if(!$manager){
            $legacy=Join-Path $sdk 'tools\bin\sdkmanager.bat'
            if(Test-Path $legacy){$manager=$legacy}
          }
          if(!$avdmanager){
            $legacy=Join-Path $sdk 'tools\bin\avdmanager.bat'
            if(Test-Path $legacy){$avdmanager=$legacy}
          }
          Write-Host "R36_SDKMANAGER_AVAILABLE=$([bool]$manager)"
          Write-Host "R36_AVDMANAGER_AVAILABLE=$([bool]$avdmanager)"
          Write-Host "R36_EMULATOR_PREINSTALLED=$(Test-Path $bin)"
          if(!(Test-Path $bin) -or !(Test-Path (Join-Path $sdk 'system-images\android-30\google_apis\x86_64'))){
            if(!$manager){throw 'ANDROID_CMDLINE_TOOLS_MISSING_ON_BRELGA: sdkmanager required for emulator provisioning'}
            & $manager "--sdk_root=$sdk" --install 'emulator' 'platform-tools' 'system-images;android-30;google_apis;x86_64'
            if($LASTEXITCODE -ne 0){throw "ANDROID_EMULATOR_SDK_PACKAGE_INSTALL_FAILED=$LASTEXITCODE"}
          }
          if(!(Test-Path $bin)){throw 'ANDROID_EMULATOR_STILL_NOT_INSTALLED'}
          $avds=@(& $bin -list-avds 2>$null | Where-Object{$_ -and $_.Trim() -and $_ -notmatch '^INFO|^WARNING|^ERROR'})
          if($LASTEXITCODE -ne 0){throw 'ANDROID_AVD_ENUMERATION_FAILED'}
          # Never hijack a user's existing AVD (e.g. Pixel_7_Pro).
          # Use a dedicated, deterministic API-30 image with an isolated CI name.
          if('PF2_R36_CI' -notin $avds){
            if(!$avdmanager){throw 'ANDROID_AVDMANAGER_MISSING_ON_BRELGA'}
            # Supply a concrete Pixel device profile: this avoids the native
            # stdin encoding bug in Windows PowerShell ('?no is not a valid reply').
            & $avdmanager create avd -n 'PF2_R36_CI' -k 'system-images;android-30;google_apis;x86_64' -d 'pixel_6' --force
            if($LASTEXITCODE -ne 0){throw 'ANDROID_AVD_CREATION_FAILED'}
            $avds=@(& $bin -list-avds 2>$null | Where-Object{$_ -and $_.Trim() -and $_ -notmatch '^INFO|^WARNING|^ERROR'})
          }
          if('PF2_R36_CI' -notin $avds){throw 'ANDROID_CI_AVD_NOT_VISIBLE'}
          Write-Host 'R36_AVD_READY=PF2_R36_CI'
      - name: Download the immutable R36 TEST APK and verify SHA256
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='PATHFINDER2E-9.0.37-R36-TEST-50c74938'
          $sourceSha='50c74938e3898872510c91b2061495c78364adb7'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $rel=Invoke-RestMethod -Uri "https://api.github.com/repos/bra83/braseirobuild/releases/tags/$tag" -Headers $headers -Method Get
          if(!$rel.prerelease -or $rel.target_commitish -ne $sourceSha){throw 'RELEASE_NOT_THE_CERTIFIED_TEST_SOURCE'}
          $out=Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          foreach($name in @('Braseiro-Kingmaker-R36-test.apk','SHA256.txt')){
            $asset=@($rel.assets|Where-Object{$_.name -eq $name})
            if($asset.Count -ne 1){throw "RELEASE_ASSET_MISSING $name"}
            $url="https://api.github.com/repos/bra83/braseirobuild/releases/assets/"+$asset[0].id
            & curl.exe -L --fail --retry 4 --retry-delay 3 --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' -o (Join-Path $out $name) $url
            if($LASTEXITCODE -ne 0){throw "RELEASE_ASSET_DOWNLOAD_FAILED $name"}
            if((Get-Item (Join-Path $out $name)).Length -ne $asset[0].size){throw "RELEASE_ASSET_SIZE_MISMATCH $name"}
          }
          $apk=Join-Path $out 'Braseiro-Kingmaker-R36-test.apk'
          $known=((Get-Content (Join-Path $out 'SHA256.txt') -Raw).Trim() -split '\s+')[0]
          $actual=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $known){throw 'R36_RELEASE_APK_HASH_MISMATCH'}
          Write-Host "R36_VERIFIED_TEST_APK_SHA256=$actual"
      - name: Boot Android emulator and verify production SQLite AppDb / three restarts
        shell: powershell
        timeout-minutes: 35
        run: |
          $ErrorActionPreference='Stop'
          $sdk=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'))|Where-Object{$_ -and (Test-Path (Join-Path $_ 'platform-tools\adb.exe'))}|Select-Object -First 1
          if(!$sdk){throw 'ANDROID_SDK_MISSING_AFTER_PROVISIONING'}
          $adb=Join-Path $sdk 'platform-tools\adb.exe'
          $emulator=Join-Path $sdk 'emulator\emulator.exe'
          if(!(Test-Path $emulator)){throw 'EMULATOR_BINARY_MISSING_AFTER_PROVISIONING'}
          $avdNames=@(& $emulator -list-avds 2>$null|Where-Object{$_ -and $_.Trim()})
          if('PF2_R36_CI' -notin $avdNames){throw 'DEDICATED_API30_AVD_MISSING'}
          $logs=Join-Path $env:GITHUB_WORKSPACE 'r36-runtime-logs'
          New-Item -ItemType Directory -Path $logs -Force|Out-Null
          $stdout=Join-Path $logs 'emulator.stdout.txt'
          $stderr=Join-Path $logs 'emulator.stderr.txt'
          $proc=$null
          try{
            # adb.exe can print "* daemon not running" on stderr the first time.
            # On Windows PowerShell this is a NativeCommandError with
            # ErrorActionPreference=Stop, even though adb itself is healthy.
            # Initialize adb safely before the boot poll.
            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName=$adb
            $psi.Arguments='start-server'
            $psi.UseShellExecute=$false
            $psi.CreateNoWindow=$true
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $adbInit=New-Object System.Diagnostics.Process
            $adbInit.StartInfo=$psi
            try{
              [void]$adbInit.Start()
              $adbOut=$adbInit.StandardOutput.ReadToEndAsync()
              $adbErr=$adbInit.StandardError.ReadToEndAsync()
              if(!$adbInit.WaitForExit(12000)){
                $adbInit.Kill()
                throw 'ADB_START_SERVER_HUNG_ON_BRELGA_12S'
              }
              $adbInit.WaitForExit()
              $adbInit.Refresh()
              $adbCode=$adbInit.ExitCode
              # A spawned daemon can inherit pipe handles: bound log draining too.
              if($adbOut.Wait(2000)){$adbOut.Result|Set-Content (Join-Path $logs 'adb-start.stdout.txt')}
              if($adbErr.Wait(2000)){$adbErr.Result|Set-Content (Join-Path $logs 'adb-start.stderr.txt')}
              Write-Host "R36_ADB_START_EXIT_CODE=$adbCode"
              if($null -eq $adbCode){throw 'ADB_START_SERVER_EXIT_CODE_UNAVAILABLE'}
              if($adbCode -ne 0){throw "ADB_START_SERVER_FAILED=$adbCode"}
            }finally{$adbInit.Dispose()}
            # The emulator startup log below records accelerator failures.
            # Avoid invoking -accel-check via PowerShell native stderr under Stop.
            Write-Host 'R36_ANDROID_EMULATOR_STARTING=true'
            $proc=Start-Process -FilePath $emulator -ArgumentList @('-avd','PF2_R36_CI','-no-window','-no-audio','-no-snapshot-load','-no-boot-anim','-gpu','swiftshader_indirect','-no-metrics') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Write-Host "R36_EMULATOR_PID=$($proc.Id)"
            $ready=$false
            $deadline=(Get-Date).AddMinutes(8)
            $i=0
            while((Get-Date) -lt $deadline){
              $psi=New-Object System.Diagnostics.ProcessStartInfo
              $psi.FileName=$adb
              $psi.Arguments='-e shell getprop sys.boot_completed'
              $psi.UseShellExecute=$false
              $psi.CreateNoWindow=$true
              $psi.RedirectStandardOutput=$true
              $psi.RedirectStandardError=$true
              $poll=New-Object System.Diagnostics.Process
              $poll.StartInfo=$psi
              $boot='NOT_READY'
              try{
                [void]$poll.Start()
                if(!$poll.WaitForExit(6000)){
                  $poll.Kill()
                  $boot='ADB_GETPROP_TIMEOUT'
                }elseif($poll.ExitCode -eq 0){
                  $boot=$poll.StandardOutput.ReadToEnd().Trim()
                }else{
                  $boot='ADB_EXIT_'+$poll.ExitCode
                }
              }finally{$poll.Dispose()}
              if($boot -eq '1'){$ready=$true;break}
              if($proc.HasExited){throw "ANDROID_EMULATOR_PROCESS_EXIT=$($proc.ExitCode)"}
              if($i%4 -eq 0){Write-Host "R36_ANDROID_BOOT_POLL=$i result=$boot"}
              Start-Sleep -Seconds 3
              $i++
            }
            if(!$ready){throw 'ANDROID_EMULATOR_BOOT_TIMEOUT_8MIN_WITH_BOUNDED_ADB_POLL'}
            $apk=Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk\Braseiro-Kingmaker-R36-test.apk'
            & $adb -e install -r $apk
            if($LASTEXITCODE -ne 0){throw 'R36_TEST_APK_INSTALL_FAILED'}
            Write-Host 'R36_ANDROID_APK_INSTALLED=true'
            & python ci/pf2-kingmaker-certification/android_ui_endurance.py --adb $adb
            if($LASTEXITCODE -ne 0){throw 'REAL_ANDROID_APPDB_THREE_RESTART_GATE_FAILED'}
            Write-Host 'R36_REAL_ANDROID_UI_APPDB_3_RESTARTS=PASS'
          }catch{
            Write-Host "R36_REAL_ANDROID_FAILURE=$($_.Exception.Message)"
            foreach($name in @('adb-start.stdout.txt','adb-start.stderr.txt')){
              $path=Join-Path $logs $name
              if(Test-Path $path){Write-Host "R36_ADB_LOG=$name";Get-Content $path -Tail 80|ForEach-Object{Write-Host $_}}
            }
            if(Test-Path $stderr){Write-Host 'R36_EMULATOR_STDERR_TAIL';Get-Content $stderr -Tail 110|ForEach-Object{Write-Host $_}}
            if(Test-Path $stdout){Write-Host 'R36_EMULATOR_STDOUT_TAIL';Get-Content $stdout -Tail 35|ForEach-Object{Write-Host $_}}
            throw
          }finally{
            $oldAction=$ErrorActionPreference
            $ErrorActionPreference='SilentlyContinue'
            try{
              # Cleanup failures MUST NOT mask the real boot/Android result.
              if($proc -and !$proc.HasExited){
                & $adb -e emu kill 2>$null|Out-Null
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
            }catch{Write-Host 'R36_EMULATOR_CLEANUP_NONFATAL'}finally{$ErrorActionPreference=$oldAction}
          }
      - name: Record runtime evidence location without Actions artifact quota
        if: always()
        shell: powershell
        run: |
          $text="Android runtime diagnostics and production AppDb hashes are preserved in this job's logs. APK under test: 50c74938 / SHA256 8efe05a429f1b95d7ccd1a5413cffd6789a1028452ceb719ef7644bff35219e9. No semantic certification is implied."
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY,$text+[Environment]::NewLine,[System.Text.Encoding]::UTF8)
