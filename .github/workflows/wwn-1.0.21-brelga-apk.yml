name: WWN 1.0.21 BRELGA APK

concurrency:
  group: wwn-1.0.21-brelga-apk
  cancel-in-progress: true

on:
  push:
    branches: [wwn-1.0.21-brelga-apk]
    paths:
      - '.github/workflows/wwn-1.0.21-brelga-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_SHARE_ID: 'sDYtoRZFo9s9'
  SOURCE_FILE_ID: '01a0c1d964207459abc6ddd8c4bd37ca'
  SOURCE_NAME: 'BRASEIRO_WWN_1.0.21_ANDROID_STUDIO_DEVICE_CANDIDATE.zip'
  SOURCE_SHA256: 'd0ce8e27231a35981a6750c80583dfb2acb2acd1c3e0612583b8a93d8c19d482'
  APK_NAME: 'BRASEIRO_WWN_1.0.21_DEBUG.apk'
  RELEASE_TAG: 'WWN-1.0.21-BRELGA'
  FIRE_API: 'https://api.firestorage.ai/dev/file'

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Verify BRELGA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          Write-Host "RUNNER=$env:RUNNER_NAME OS=$env:RUNNER_OS ARCH=$env:RUNNER_ARCH"

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact WWN 1.0.21 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $incoming = Join-Path $env:RUNNER_TEMP 'wwn-1021-incoming'
          Remove-Item $incoming -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $incoming -Force | Out-Null

          $listUrl = "$env:FIRE_API/shares/$env:SOURCE_SHARE_ID/files?maxResults=1000"
          $downloadApi = "$env:FIRE_API/shares/$env:SOURCE_SHARE_ID/files/$env:SOURCE_FILE_ID/download"
          $files = Invoke-RestMethod -Uri $listUrl -Method Get
          $match = @($files.files | Where-Object { [string]$_.fileId -eq $env:SOURCE_FILE_ID })
          if ($match.Count -ne 1) { throw "Source file id not present in Firestorage share" }

          $dl = Invoke-RestMethod -Uri $downloadApi -Method Post
          if ([string]::IsNullOrWhiteSpace($dl.downloadUrl)) { throw 'Firestorage did not return downloadUrl' }

          $zip = Join-Path $incoming $env:SOURCE_NAME
          & curl.exe -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 300 -o $zip $dl.downloadUrl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) { throw 'Source ZIP download failed' }

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SOURCE_SHA256) { throw "Source SHA mismatch: $hash" }
          Write-Host "SOURCE_SHA256_OK=$hash"
          "SOURCE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Extract and locate Android project
        id: project
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $work = Join-Path $env:RUNNER_TEMP 'wwn-1021-work'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          & tar.exe -xf $env:SOURCE_ZIP -C $work
          if ($LASTEXITCODE -ne 0) { throw 'ZIP extraction failed' }

          $settings = Get-ChildItem $work -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('settings.gradle','settings.gradle.kts') -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradlew.bat')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradle\wrapper\gradle-wrapper.jar')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'app\src\main\AndroidManifest.xml'))
            } |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1

          if (-not $settings) { throw 'Complete Android Studio project not found' }
          $root = $settings.Directory.FullName
          Write-Host "ANDROID_ROOT=$root"
          "ANDROID_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $versionProps = Join-Path $root 'version.properties'
          if (-not (Test-Path $versionProps)) { throw 'version.properties missing' }
          $vp = Get-Content $versionProps -Raw
          if ($vp -notmatch 'VERSION_NAME=1\.0\.21') { throw 'Unexpected VERSION_NAME' }
          if ($vp -notmatch 'VERSION_CODE=10021') { throw 'Unexpected VERSION_CODE' }

      - name: Configure Android SDK 35
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates = @()
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          $candidates += 'C:\actions-runner\android-sdk'
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $candidates += 'C:\Android\Sdk'

          $sdkRoot=$null; $sdkmanager=$null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ([string]::IsNullOrWhiteSpace($candidate) -or -not (Test-Path $candidate)) { continue }
            $found = Get-ChildItem $candidate -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $sdkRoot=$candidate; $sdkmanager=$found.FullName; break }
          }
          if (-not $sdkmanager) { throw 'sdkmanager.bat not found on BRELGA' }

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path $sdkmanager) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $sdkRoot 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $licenseInput = Join-Path $env:RUNNER_TEMP 'wwn-sdk-license.txt'
          1..100 | ForEach-Object { 'y' } | Set-Content -Path $licenseInput -Encoding ascii
          & cmd.exe /d /s /c "`"$sdkmanager`" --licenses < `"$licenseInput`""
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK licenses failed' }

          & $sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK 35 install failed' }

      - name: Build WWN debug APK
        shell: powershell
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          $ErrorActionPreference='Continue'
          $log = Join-Path $env:RUNNER_TEMP 'WWN_1.0.21_GRADLE_BUILD.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference=$false }

          & .\gradlew.bat --version --no-daemon 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw "Gradle wrapper failed: $LASTEXITCODE" }

          & .\gradlew.bat clean assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { throw "assembleDebug failed: $LASTEXITCODE" }
          "GRADLE_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate and collect APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $apk = Get-ChildItem $env:ANDROID_ROOT -Recurse -File -Filter '*.apk' |
            Where-Object { $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]' } |
            Sort-Object FullName | Select-Object -First 1
          if (-not $apk) { throw 'Debug APK not found' }

          $out = Join-Path $env:RUNNER_TEMP 'wwn-1021-out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $dest = Join-Path $out $env:APK_NAME
          Copy-Item $apk.FullName $dest -Force
          if (Test-Path $env:GRADLE_LOG) { Copy-Item $env:GRADLE_LOG (Join-Path $out 'GRADLE_BUILD.log') -Force }

          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content -Path "$dest.sha256" -Encoding ascii

          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools\35.0.0'
          $aapt = Join-Path $buildTools 'aapt.exe'
          $apksigner = Join-Path $buildTools 'apksigner.bat'
          if (-not (Test-Path $aapt)) { throw 'aapt.exe missing' }
          if (-not (Test-Path $apksigner)) { throw 'apksigner.bat missing' }

          $badging = Join-Path $out 'APK_BADGING.txt'
          & $aapt dump badging $dest 2>&1 | Tee-Object -FilePath $badging
          if ($LASTEXITCODE -ne 0) { throw 'aapt validation failed' }
          $badge = Get-Content $badging -Raw
          if ($badge -notmatch "package: name='com\.braseiro\.wwn'") { throw 'Wrong applicationId' }
          if ($badge -notmatch "versionCode='10021'") { throw 'Wrong versionCode' }
          if ($badge -notmatch "versionName='1\.0\.21-debug'") { throw 'Wrong versionName' }

          $sig = Join-Path $out 'APK_SIGNATURE.txt'
          & $apksigner verify --verbose --print-certs $dest 2>&1 | Tee-Object -FilePath $sig
          if ($LASTEXITCODE -ne 0) { throw 'APK signature validation failed' }

          "OUT_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "APK_PATH=$dest"
          Write-Host "APK_BYTES=$((Get-Item $dest).Length)"
          Write-Host "APK_SHA256=$hash"

      - name: Upload APK workflow artifact
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_WWN_1.0.21_APK
          path: |
            ${{ env.OUT_DIR }}/BRASEIRO_WWN_1.0.21_DEBUG.apk
            ${{ env.OUT_DIR }}/BRASEIRO_WWN_1.0.21_DEBUG.apk.sha256
            ${{ env.OUT_DIR }}/APK_BADGING.txt
            ${{ env.OUT_DIR }}/APK_SIGNATURE.txt
            ${{ env.OUT_DIR }}/GRADLE_BUILD.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GitHub pre-release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag=$env:RELEASE_TAG
          $headers=@{
            'Authorization'="Bearer $env:GITHUB_TOKEN"
            'Accept'='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='braseiro-wwn-brelga'
          }

          try {
            $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
          } catch {
            $body=@{
              tag_name=$tag
              target_commitish=$env:GITHUB_REF_NAME
              name='BRASEIRO WWN 1.0.21 BRELGA'
              body='WWN 1.0.21 Device Candidate compiled on self-hosted BRELGA. Debug APK, SHA-256, badging, signature and Gradle log.'
              draft=$false
              prerelease=$true
            } | ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$repo/releases"
          }

          $files=Get-ChildItem $env:OUT_DIR -File
          foreach($file in $files) {
            $existing=@($release.assets | Where-Object { $_.name -eq $file.Name } | Select-Object -First 1)
            if($existing.Count -gt 0) {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing[0].id)" | Out-Null
            }
            $encoded=[uri]::EscapeDataString($file.Name)
            $upload="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encoded"
            & curl.exe -L --fail --retry 4 --retry-delay 2 --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$($file.FullName)" $upload
            if($LASTEXITCODE -ne 0) { throw "Release upload failed for $($file.Name)" }
          }
          Write-Host "RELEASE_URL=$($release.html_url)"
