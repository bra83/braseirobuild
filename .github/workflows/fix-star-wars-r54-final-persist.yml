name: Fix Star Wars R54 Final Persist
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-star-wars-r54-final-persist.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make final persistence conflict-safe
        run: |
          set -euo pipefail
          P=.github/workflows/close-star-wars-r54-final.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/close-star-wars-r54-final.yml')
          s=p.read_text('utf-8')
          old='          git fetch origin main;git rebase origin/main\n          mkdir -p "$OUT" star-wars/r54/audit\n'
          new='          # All validated outputs/evidence are already copied to /tmp before syncing.\n          # Discard transient patch/test working-tree changes, sync to current main, then persist only final artifacts.\n          git reset --hard HEAD\n          git clean -fd\n          git fetch origin main\n          git reset --hard origin/main\n          mkdir -p "$OUT" star-wars/r54/audit\n'
          if old not in s:
              raise SystemExit('final persistence anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -Fq 'git reset --hard origin/main' "$P"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$P"
          git commit -m 'fix(star-wars): make R54 final persistence conflict-safe'
          git push origin HEAD:main
