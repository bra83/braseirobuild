name: WWN Final Real Flow Build

on:
  push:
    branches: [wwn-source-105-bridge]
    paths:
      - ".github/workflows/wwn-final-real-flow-build.yml"
      - "tools/wwn_finish_real_flow.py"
      - "tools/wwn_finish_real_flow_gate.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout current WWN source
        uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply final real-flow corrections
        run: python3 tools/wwn_finish_real_flow.py

      - name: Validate every production JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
            count=$((count+1))
          done < <(find app/src/main/assets/www -type f -name '*.js' -print0)
          echo "WWN_JS_SYNTAX_PASS=$count"

      - name: Run final real-flow state gate
        run: node tools/wwn_finish_real_flow_gate.mjs

      - name: Run existing real-flow regression gates
        shell: bash
        run: |
          set -euo pipefail
          node tools/wwn_real_flow_runtime_gate.mjs
          node tools/wwn_device_audit_gate.mjs
          if [ -f tools/wwn_post_106_gate.mjs ]; then node tools/wwn_post_106_gate.mjs; fi

      - name: Validate JSON and version continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('app/src/main/assets/www').rglob('*.json'))
          for p in files:
              json.loads(p.read_text(encoding='utf-8'))
          print(f'WWN_JSON_PARSE_PASS={len(files)}')
          PY
          grep -q 'versionCode = 110' app/build.gradle.kts
          grep -q 'versionName = "1.0.10"' app/build.gradle.kts

      - name: Commit validated source corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add app/src/main/assets/www/jornada.js app/src/main/assets/www/core/starter-bootstrap.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(wwn): finish empty-campaign and jornada real flow"
            git push origin HEAD:wwn-source-105-bridge
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android /opt /home/runner -type f -name sdkmanager -perm -111 2>/dev/null | head -n1 || true)"
          fi
          test -n "$SDKMANAGER"
          SDK_ROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run Android tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test assembleDebug --stacktrace --no-daemon

      - name: Package APK and Android Studio source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" out/BRASEIRO_WWN_v1.0.10.apk
          unzip -t out/BRASEIRO_WWN_v1.0.10.apk >/dev/null
          git archive --format=zip --output=out/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_1.0.10.zip HEAD app build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat
          unzip -t out/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_1.0.10.zip >/dev/null
          sha256sum out/BRASEIRO_WWN_v1.0.10.apk > out/BRASEIRO_WWN_v1.0.10.apk.sha256
          sha256sum out/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_1.0.10.zip > out/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_1.0.10.zip.sha256
          {
            echo "BRASEIRO WWN 1.0.10 — FINAL REAL-FLOW BUILD"
            echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
            echo "WORKFLOW_RUN=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat out/BRASEIRO_WWN_v1.0.10.apk.sha256
            cat out/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_1.0.10.zip.sha256
          } | tee out/BRASEIRO_WWN_v1.0.10_RELEASE_MANIFEST.txt

      - name: Upload final workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_WWN_v1.0.10_FINAL
          path: |
            out/BRASEIRO_WWN_v1.0.10.apk
            out/BRASEIRO_WWN_v1.0.10.apk.sha256
            out/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_1.0.10.zip
            out/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_1.0.10.zip.sha256
            out/BRASEIRO_WWN_v1.0.10_RELEASE_MANIFEST.txt
          retention-days: 30

      - name: Publish final GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="wwn-v1.0.10-real-flow-final"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target wwn-source-105-bridge --title "BRASEIRO WWN v1.0.10 — Final Real Flow" --notes-file out/BRASEIRO_WWN_v1.0.10_RELEASE_MANIFEST.txt
          else
            gh release create "$TAG" --target wwn-source-105-bridge --title "BRASEIRO WWN v1.0.10 — Final Real Flow" --notes-file out/BRASEIRO_WWN_v1.0.10_RELEASE_MANIFEST.txt
          fi
          gh release upload "$TAG" \
            out/BRASEIRO_WWN_v1.0.10.apk \
            out/BRASEIRO_WWN_v1.0.10.apk.sha256 \
            out/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_1.0.10.zip \
            out/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_1.0.10.zip.sha256 \
            out/BRASEIRO_WWN_v1.0.10_RELEASE_MANIFEST.txt \
            --clobber
