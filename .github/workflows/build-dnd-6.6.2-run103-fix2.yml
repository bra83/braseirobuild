name: Braseiro DnD 6.6.2 RUN103 APK FIX8
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dnd-6.6.2-run103-fix2.yml'
      - 'ci/dnd-run103/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build validated APK
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p out
          bash ci/dnd-run103/build_fix2.sh > out/FULL_BUILD_LOG.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "===== META ====="
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "EXIT_CODE=$code"
            echo "WORKFLOW=RUN103_FIX8"
          } >> out/FULL_BUILD_LOG.txt
          exit 0

      - name: Publish APK release
        if: steps.build.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG=DND-6.6.2-RUN103-FIX8
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title 'Braseiro DnD 6.6.2 RUN103 FIX8' --notes 'Validated debug APK. Package com.braseiro.dnd5e. Compile-only repair; maps/assets/gameplay unchanged.'
          gh release upload "$TAG" out/* --clobber
          gh release view "$TAG" --json url,tagName,name

      - name: Fail workflow when build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          tail -n 200 out/FULL_BUILD_LOG.txt
          exit 1
