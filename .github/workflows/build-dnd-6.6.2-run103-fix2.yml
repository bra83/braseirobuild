name: Braseiro DnD 6.6.2 RUN103 APK FIX3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dnd-6.6.2-run103-fix2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build validated APK
        run: bash ci/dnd-run103/build_fix2.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-DND-6.6.2-RUN103-FIX3-APK
          path: out/*
          retention-days: 30
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view DND-6.6.2-RUN103-FIX3 >/dev/null 2>&1 || gh release create DND-6.6.2-RUN103-FIX3 --target main --title 'Braseiro DnD 6.6.2 RUN103 FIX3' --notes 'Package com.braseiro.dnd5e; compile-only fixes; maps/assets/gameplay unchanged.'
          gh release upload DND-6.6.2-RUN103-FIX3 out/* --clobber
