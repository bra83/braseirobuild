name: Braseiro DnD 6.6.2 RUN103 APK FIX7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dnd-6.6.2-run103-fix2.yml'
      - 'ci/dnd-run103/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build validated APK
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p out
          bash ci/dnd-run103/build_fix2.sh > out/FULL_BUILD_LOG.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "===== META ====="
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "EXIT_CODE=$code"
            echo "WORKFLOW=RUN103_FIX7"
          } >> out/FULL_BUILD_LOG.txt
          exit 0

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: DND-RUN103-FIX7-DIAGNOSTICS-${{ github.run_id }}
          path: out/FULL_BUILD_LOG.txt
          retention-days: 30

      - name: Upload APK artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-DND-6.6.2-RUN103-FIX7-APK
          path: out/*
          retention-days: 30

      - name: Publish release
        if: steps.build.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view DND-6.6.2-RUN103-FIX7 >/dev/null 2>&1 || gh release create DND-6.6.2-RUN103-FIX7 --target main --title 'Braseiro DnD 6.6.2 RUN103 FIX7' --notes 'Package com.braseiro.dnd5e; compile-only fixes; maps/assets/gameplay unchanged.'
          gh release upload DND-6.6.2-RUN103-FIX7 out/* --clobber

      - name: Fail workflow when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
