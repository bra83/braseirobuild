name: Braseiro D&D - Adventure transactional regression (BRELGA)
on:
  push:
    branches:
      - antigravity/dnd-normal-fechamento-gates
    paths:
      - 'dnd-normal/run247-mod005/app/src/**'
      - 'dnd-normal/run247-mod005/app/build.gradle*'
      - 'dnd-normal/run247-mod005/build.gradle*'
      - 'dnd-normal/run247-mod005/gradle/**'
      - 'dnd-normal/run247-mod005/tools/**'
      - 'dnd-normal/run247-mod005/docs/**'
      - '.github/workflows/dnd-adventure-atomicity-brelga.yml'
  pull_request:
    branches:
      - antigravity/dnd-normal-fechamento-gates
    paths:
      - 'dnd-normal/run247-mod005/app/src/**'
      - 'dnd-normal/run247-mod005/app/build.gradle*'
      - 'dnd-normal/run247-mod005/build.gradle*'
      - 'dnd-normal/run247-mod005/gradle/**'
      - 'dnd-normal/run247-mod005/tools/**'
      - 'dnd-normal/run247-mod005/docs/**'
      - '.github/workflows/dnd-adventure-atomicity-brelga.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-adventure-tx-brelga
  cancel-in-progress: false
jobs:
  editorial-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact D&D sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - name: Validate editorial inventory and false-certification regressions
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_validate_editorial_coverage.py' -v
          python3 tools/validate_editorial_coverage.py --json
          echo "EDITORIAL_INVENTORY_VALID=TRUE; EDITORIAL_483_CERTIFIED=FALSE"
  focused:
    permissions:
      contents: write  # Store QA evidence on an isolated branch; no Actions artifacts quota.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - name: Reclaim D&D-only build outputs and check runner disk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE 'dnd-normal/run247-mod005'
          if (!(Test-Path -LiteralPath $project)) { throw 'DND_PROJECT_WORKSPACE_MISSING' }
          $driveRoot = [System.IO.Path]::GetPathRoot($project)
          $drive = New-Object System.IO.DriveInfo($driveRoot)
          Write-Host ('DND_DISK_FREE_BEFORE_BYTES=' + $drive.AvailableFreeSpace)
          # ONLY compiled/transient outputs belonging to this D&D project.
          # Never delete canonical source assets, maps, other VTTs or global SDK caches.
          foreach ($relative in @('app\build', 'build', 'app\.cxx')) {
            $dir = Join-Path $project $relative
            if (Test-Path -LiteralPath $dir) {
              Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction Stop
              Write-Host ('REMOVED_DND_TRANSIENT=' + $relative)
            }
          }
          $drive = New-Object System.IO.DriveInfo($driveRoot)
          Write-Host ('DND_DISK_FREE_AFTER_BYTES=' + $drive.AvailableFreeSpace)
          if ($drive.AvailableFreeSpace -lt 1073741824) {
            throw ('BRELGA_INSUFFICIENT_FREE_SPACE_DND_ONLY_CLEANUP=' + $drive.AvailableFreeSpace)
          }
      - name: Execute AdventureTransactionSafetyRobolectricTest and full regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw 'EXPECTED_RUNNER_BRELGA' }
          $java17='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if (Test-Path $java17) {
            $env:JAVA_HOME=$java17
            $env:PATH=(Join-Path $java17 'bin')+';'+$env:PATH
          }
          if (!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)) {
            $sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'
            if (Test-Path $sdk) { $env:ANDROID_HOME=$sdk }
          }
          if (!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)) { throw 'ANDROID_SDK_NOT_FOUND' }
          $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          Set-Location 'dnd-normal/run247-mod005'
          & .\gradlew.bat :app:testDebugUnitTest --tests com.braseiro.dnd5e.adventure.AdventureTransactionSafetyRobolectricTest --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_REGRESSION_FAILED' }
          $xml='app/build/test-results/testDebugUnitTest/TEST-com.braseiro.dnd5e.adventure.AdventureTransactionSafetyRobolectricTest.xml'
          if (!(Test-Path $xml)) { throw 'FOCUSED_XML_MISSING' }
          [xml]$result=Get-Content -LiteralPath $xml -Raw
          if ([int]$result.testsuite.tests -ne 6 -or [int]$result.testsuite.failures -ne 0 -or [int]$result.testsuite.errors -ne 0 -or [int]$result.testsuite.skipped -ne 0) { throw 'SIX_REQUIRED_TESTS_NOT_GREEN' }
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'FULL_SUITE_FAILED' }
          # Inspecionar XMLs de TODAS as suites. Resultado do Gradle isolado não é prova suficiente.
          $reports=Get-ChildItem 'app/build/test-results/testDebugUnitTest' -Filter 'TEST-*.xml' -File
          if (!$reports -or $reports.Count -lt 1) { throw 'FULL_SUITE_XML_MISSING' }
          $nTests=0; $nFailures=0; $nErrors=0; $nSkipped=0
          foreach ($report in $reports) {
            [xml]$suite=Get-Content -LiteralPath $report.FullName -Raw
            if (!$suite.testsuite) { throw ('INVALID_TEST_XML: '+$report.Name) }
            $nTests += [int]$suite.testsuite.tests
            $nFailures += [int]$suite.testsuite.failures
            $nErrors += [int]$suite.testsuite.errors
            $nSkipped += [int]$suite.testsuite.skipped
          }
          if ($nTests -le 0 -or $nFailures -ne 0 -or $nErrors -ne 0 -or $nSkipped -ne 0) {
            throw ("FULL_SUITE_XML_NOT_GREEN: tests=$nTests failures=$nFailures errors=$nErrors skipped=$nSkipped")
          }
          Write-Host ("FULL_SUITE_XML=PASS; SUITES=$($reports.Count); TESTS=$nTests; FAILURES=$nFailures; ERRORS=$nErrors; SKIPPED=$nSkipped")
          Write-Host ('SOURCE_SHA='+$env:GITHUB_SHA)
          Write-Host 'ADVENTURE_TRANSACTION_TESTS=6/6; FULL_SUITE=PASS; APK_NOT_BUILT=TRUE'
      # This repository is private. Store the complete Gradle XML results on a
      # dedicated QA branch rather than GitHub Actions artifact storage.
      # This is intentionally a hard gate: failed evidence publication is visible.
      # On pull_request never grant untrusted PR code a write token.
      - name: Publish XML evidence to isolated Git branch (no artifacts quota)
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const folder = path.join(
              process.env.GITHUB_WORKSPACE, 'dnd-normal', 'run247-mod005',
              'app', 'build', 'test-results', 'testDebugUnitTest'
            );
            if (!fs.existsSync(folder)) {
              core.warning('NO_TEST_RESULTS_DIR: tests may have failed before XML was generated');
              return;
            }
            const names = fs.readdirSync(folder)
              .filter(n => n.startsWith('TEST-') && n.endsWith('.xml'))
              .sort();
            if (names.length === 0) {
              core.warning('NO_TEST_RESULTS_XML: cannot persist evidence');
              return;
            }
            let totals = {tests:0, failures:0, errors:0, skipped:0};
            const files = {};
            const sha256 = {};
            for (const name of names) {
              const xml = fs.readFileSync(path.join(folder, name), 'utf8');
              const tag = xml.match(/<testsuite\b[^>]*>/);
              if (!tag) throw Error('INVALID_TEST_SUITE_XML: ' + name);
              const attr = key => {
                const m = tag[0].match(new RegExp('\\b' + key + '="(\\d+)"'));
                if (!m) throw Error('MISSING_SUITE_METRIC_' + key + ': ' + name);
                return Number(m[1]);
              };
              for (const key of Object.keys(totals)) totals[key] += attr(key);
              files[name] = xml;
              sha256[name] = crypto.createHash('sha256').update(xml).digest('hex');
            }
            const {owner, repo} = context.repo;
            const evidenceBranch = 'dnd-normal-qa-evidence';
            const target = 'runs/' + context.runId + '/attempt-' +
              process.env.GITHUB_RUN_ATTEMPT + '.json';
            const payload = JSON.stringify({
              format: 'BRASEIRO_DND_GRADLE_XML_EVIDENCE_V1',
              source_sha: context.sha,
              workflow_run: context.runId,
              workflow_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              run_url: 'https://github.com/' + owner + '/' + repo +
                '/actions/runs/' + context.runId,
              suite_count: names.length,
              totals: totals,
              all_tests_passed: totals.tests > 0 &&
                totals.failures === 0 && totals.errors === 0 && totals.skipped === 0,
              xml_sha256: sha256,
              xml_files: files,
              note: 'Automated Robolectric/Gradle tests; not a certification of all editorial sections or of a physical Android device.'
            }, null, 2);
            const blob = await github.rest.git.createBlob({
              owner, repo, content: payload, encoding: 'utf-8'
            });
            let previous = null, baseTree = null;
            try {
              const reference = await github.rest.git.getRef({
                owner, repo, ref: 'heads/' + evidenceBranch
              });
              previous = reference.data.object.sha;
              const previousCommit = await github.rest.git.getCommit({
                owner, repo, commit_sha: previous
              });
              baseTree = previousCommit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const treeArgs = {
              owner, repo,
              tree: [{path: target, mode: '100644', type: 'blob', sha: blob.data.sha}]
            };
            if (baseTree) treeArgs.base_tree = baseTree;
            const tree = await github.rest.git.createTree(treeArgs);
            const commit = await github.rest.git.createCommit({
              owner, repo, tree: tree.data.sha,
              parents: previous ? [previous] : [],
              message: 'qa(dnd): archive run ' + context.runId + ' XML evidence'
            });
            if (previous) {
              await github.rest.git.updateRef({
                owner, repo, ref: 'heads/' + evidenceBranch,
                sha: commit.data.sha, force: false
              });
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/heads/' + evidenceBranch,
                sha: commit.data.sha
              });
            }
            core.info('QA_EVIDENCE_STORED=' + evidenceBranch + '/' + target);
            core.info('QA_EVIDENCE_SHA=' + context.sha);
            core.info('QA_EVIDENCE_SUITES=' + names.length);
            core.info('QA_EVIDENCE_TESTS=' + totals.tests);
            core.info('QA_EVIDENCE_FAILURES=' + totals.failures);
