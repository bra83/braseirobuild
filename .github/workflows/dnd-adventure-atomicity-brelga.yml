name: Braseiro D&D - Adventure transactional regression (BRELGA)
on:
  push:
    branches:
      - antigravity/dnd-normal-fechamento-gates
    paths:
      - 'dnd-normal/run247-mod005/app/src/**'
      - 'dnd-normal/run247-mod005/app/build.gradle*'
      - 'dnd-normal/run247-mod005/build.gradle*'
      - 'dnd-normal/run247-mod005/gradle/**'
      - 'dnd-normal/run247-mod005/tools/**'
      - 'dnd-normal/run247-mod005/docs/**'
      - '.github/workflows/dnd-adventure-atomicity-brelga.yml'
  pull_request:
    branches:
      - antigravity/dnd-normal-fechamento-gates
    paths:
      - 'dnd-normal/run247-mod005/app/src/**'
      - 'dnd-normal/run247-mod005/app/build.gradle*'
      - 'dnd-normal/run247-mod005/build.gradle*'
      - 'dnd-normal/run247-mod005/gradle/**'
      - 'dnd-normal/run247-mod005/tools/**'
      - 'dnd-normal/run247-mod005/docs/**'
      - '.github/workflows/dnd-adventure-atomicity-brelga.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-adventure-tx-brelga
  cancel-in-progress: false
jobs:
  # Sem actions/checkout: o runner pode estar tão cheio que falha ANTES dos steps.
  disk-recovery:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Free only D&D transient files before action downloads
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw 'EXPECTED_RUNNER_BRELGA' }
          $project = Join-Path $env:GITHUB_WORKSPACE 'dnd-normal/run247-mod005'
          $driveRoot = [System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          $disk = New-Object System.IO.DriveInfo($driveRoot)
          Write-Host ('DISK_RECOVERY_BEFORE_BYTES=' + $disk.AvailableFreeSpace)
          foreach ($relative in @('app\build', 'build', 'app\.cxx', '.gradle')) {
            $folder = Join-Path $project $relative
            if (Test-Path -LiteralPath $folder) {
              Remove-Item -LiteralPath $folder -Recurse -Force -ErrorAction Stop
              Write-Host ('DND_ONLY_DELETED=' + $relative)
            }
          }
          $disk = New-Object System.IO.DriveInfo($driveRoot)
          Write-Host ('DND_TRANSIENT_FREE_BYTES=' + $disk.AvailableFreeSpace)
          if ($disk.AvailableFreeSpace -lt 1073741824) {
            # Safe shared tool cache: regenerated by Gradle. Do not touch
            # dependency downloads, Android SDK, source assets or other VTT builds.
            $gradle = Join-Path $env:USERPROFILE '.gradle\caches'
            foreach ($relative in @('transforms-3', 'transforms-4', '8.11.1\transforms')) {
              $folder = Join-Path $gradle $relative
              if (Test-Path -LiteralPath $folder) {
                try {
                  Remove-Item -LiteralPath $folder -Recurse -Force -ErrorAction Stop
                  Write-Host ('GRADLE_REGENERABLE_TRANSFORM_CLEAN=' + $relative)
                } catch {
                  Write-Warning ('TRANSFORM_CACHE_LOCKED=' + $relative + ': ' + $_.Exception.Message)
                }
              }
            }
          }
          $disk = New-Object System.IO.DriveInfo($driveRoot)
          Write-Host ('DISK_RECOVERY_AFTER_BYTES=' + $disk.AvailableFreeSpace)
          if ($disk.AvailableFreeSpace -lt 805306368) {
            throw ('BRELGA_DISK_INSUFFICIENT_AFTER_DND_SAFE_CLEAN=' + $disk.AvailableFreeSpace)
          }
  focused:
    needs: disk-recovery
    permissions:
      contents: write  # Store QA evidence on an isolated branch; no Actions artifacts quota.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - name: Reclaim D&D-only build outputs and check runner disk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE 'dnd-normal/run247-mod005'
          if (!(Test-Path -LiteralPath $project)) { throw 'DND_PROJECT_WORKSPACE_MISSING' }
          $driveRoot = [System.IO.Path]::GetPathRoot($project)
          $drive = New-Object System.IO.DriveInfo($driveRoot)
          Write-Host ('DND_DISK_FREE_BEFORE_BYTES=' + $drive.AvailableFreeSpace)
          # ONLY compiled/transient outputs belonging to this D&D project.
          # Never delete canonical source assets, maps, other VTTs or global SDK caches.
          foreach ($relative in @('app\build', 'build', 'app\.cxx')) {
            $dir = Join-Path $project $relative
            if (Test-Path -LiteralPath $dir) {
              Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction Stop
              Write-Host ('REMOVED_DND_TRANSIENT=' + $relative)
            }
          }
          $drive = New-Object System.IO.DriveInfo($driveRoot)
          Write-Host ('DND_DISK_FREE_AFTER_BYTES=' + $drive.AvailableFreeSpace)
          if ($drive.AvailableFreeSpace -lt 805306368) {
            throw ('BRELGA_INSUFFICIENT_FREE_SPACE_DND_ONLY_CLEANUP=' + $drive.AvailableFreeSpace)
          }
      - name: Editorial proof consistency and anti-false-certification regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location 'dnd-normal/run247-mod005'
          $python=Get-Command python.exe -ErrorAction SilentlyContinue
          if (!$python) { throw 'BRELGA_PYTHON_NOT_FOUND_FOR_EDITORIAL_GATE' }
          & $python.Source -m unittest discover -s tools -p 'test_validate_editorial_coverage.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'EDITORIAL_ANTI_FALSE_CERTIFICATION_TEST_FAILED' }
          & $python.Source tools/check_483_runtime_links.py --out docs/editorial-483-runtime-links.json
          if ($LASTEXITCODE -ne 0) { throw 'EDITORIAL_483_RUNTIME_LINKS_BROKEN' }
          & $python.Source tools/validate_editorial_coverage.py --json
          if ($LASTEXITCODE -ne 0) { throw 'EDITORIAL_INVENTORY_INCONSISTENT' }
          & $python.Source -m unittest discover -s tools -p 'test_editorial_483_runtime_assessment.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'EDITORIAL_483_STRUCTURAL_TESTS_FAILED' }
          & $python.Source tools/editorial_483_runtime_assessment.py --json --output build/editorial-483/report.json
          if ($LASTEXITCODE -ne 0) { throw 'EDITORIAL_483_RUNTIME_LINKS_MISSING' }
          # XSAC source Q/A gate is strictly a 163-entry pinned locator check.
          & $python.Source -m unittest discover -s tools -p 'test_verify_xsac_163_source_qa.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'XSAC_SOURCE_VERIFIER_UNIT_TESTS_FAILED' }
          & $python.Source tools/verify_xsac_163_source_qa.py --json-out build/xsac-163/source-report.json
          if ($LASTEXITCODE -ne 0) { throw 'XSAC_SOURCE_163_QA_GATE_FAILED' }
          $xsac=Get-Content build/xsac-163/source-report.json -Raw | ConvertFrom-Json
          if ($xsac.official_qa_count -ne 163 -or !$xsac.source_index_gate_pass -or $xsac.gameplay_semantics_certified) {
            throw 'XSAC_SOURCE_REPORT_INVALID'
          }
          Write-Host 'XSAC_163_QA_SOURCE_INDEX=PASS; SEMANTIC_CERTIFICATION_NOT_CLAIMED=TRUE'
          Write-Host 'EDITORIAL_483_SECTION_BINDINGS=PASS; SEMANTIC_CERTIFICATION_NOT_CLAIMED=TRUE'
      - name: Execute AdventureTransactionSafetyRobolectricTest and full regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw 'EXPECTED_RUNNER_BRELGA' }
          $java17='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if (Test-Path $java17) {
            $env:JAVA_HOME=$java17
            $env:PATH=(Join-Path $java17 'bin')+';'+$env:PATH
          }
          if (!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)) {
            $sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'
            if (Test-Path $sdk) { $env:ANDROID_HOME=$sdk }
          }
          if (!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)) { throw 'ANDROID_SDK_NOT_FOUND' }
          $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          Set-Location 'dnd-normal/run247-mod005'
          # P0: inspect the shared Gradle init script without editing it.
          # An isolated user home excludes broken global init.d scripts while
          # junctions reuse dependency caches / wrapper downloads across builds.
          $sharedGradleHome = Join-Path $env:USERPROFILE '.gradle'
          $sharedInit = Join-Path $sharedGradleHome 'init.d\braseiro-cache.init.gradle'
          if (Test-Path -LiteralPath $sharedInit) {
            $initBytes = [System.IO.File]::ReadAllBytes($sharedInit)
            $initHash = (Get-FileHash -LiteralPath $sharedInit -Algorithm SHA256).Hash
            $prefixCount = [Math]::Min(16, $initBytes.Length)
            $prefix = if ($prefixCount -gt 0) { [BitConverter]::ToString($initBytes, 0, $prefixCount) } else { '(empty)' }
            Write-Host ('P0_SHARED_GRADLE_INIT_SHA256=' + $initHash)
            Write-Host ('P0_SHARED_GRADLE_INIT_FIRST_BYTES=' + $prefix)
          } else {
            Write-Host 'P0_SHARED_GRADLE_INIT=ABSENT'
          }
          $isolatedGradleHome = Join-Path $env:RUNNER_TEMP ('dnd-gradle-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $isolatedGradleHome | Out-Null
          foreach ($cacheDir in @('caches', 'wrapper')) {
            $sourceDir = Join-Path $sharedGradleHome $cacheDir
            $linkDir = Join-Path $isolatedGradleHome $cacheDir
            if (Test-Path -LiteralPath $sourceDir) {
              if (-not (Test-Path -LiteralPath $linkDir)) {
                New-Item -ItemType Junction -Path $linkDir -Target $sourceDir -ErrorAction Stop | Out-Null
              }
              Write-Host ('P0_SHARED_GRADLE_REUSE=' + $cacheDir)
            }
          }
          $env:GRADLE_USER_HOME = $isolatedGradleHome
          Write-Host 'P0_BRELGA_INIT_SCRIPT=ISOLATED; SHARED_FILE_UNMODIFIED=TRUE'
          # Run against real map assets: Issue27MapAndOAuthIntegrationTest validates
          # the 102 MB Faerun ZIP and its actual manifest. Lite assets must never
          # be used for the full suite because they cause two false test failures.
          # BRELGA safe cleanup measured >2 GB free before this run.
          $gradleArgs = @(':app:testDebugUnitTest', '--no-daemon', '--console=plain')
          & .\gradlew.bat @gradleArgs
          if ($LASTEXITCODE -ne 0) { throw 'FULL_SUITE_FAILED' }
          $xml='app/build/test-results/testDebugUnitTest/TEST-com.braseiro.dnd5e.adventure.AdventureTransactionSafetyRobolectricTest.xml'
          if (!(Test-Path $xml)) { throw 'FOCUSED_XML_MISSING' }
          [xml]$result=Get-Content -LiteralPath $xml -Raw
          if ([int]$result.testsuite.tests -ne 7 -or [int]$result.testsuite.failures -ne 0 -or [int]$result.testsuite.errors -ne 0 -or [int]$result.testsuite.skipped -ne 0) { throw 'SEVEN_REQUIRED_TESTS_NOT_GREEN' }
          # Inspecionar XMLs de TODAS as suites. Resultado do Gradle isolado não é prova suficiente.
          $reports=Get-ChildItem 'app/build/test-results/testDebugUnitTest' -Filter 'TEST-*.xml' -File
          if (!$reports -or $reports.Count -lt 1) { throw 'FULL_SUITE_XML_MISSING' }
          $nTests=0; $nFailures=0; $nErrors=0; $nSkipped=0
          foreach ($report in $reports) {
            [xml]$suite=Get-Content -LiteralPath $report.FullName -Raw
            if (!$suite.testsuite) { throw ('INVALID_TEST_XML: '+$report.Name) }
            $nTests += [int]$suite.testsuite.tests
            $nFailures += [int]$suite.testsuite.failures
            $nErrors += [int]$suite.testsuite.errors
            $nSkipped += [int]$suite.testsuite.skipped
          }
          if ($nTests -le 0 -or $nFailures -ne 0 -or $nErrors -ne 0 -or $nSkipped -ne 0) {
            throw ("FULL_SUITE_XML_NOT_GREEN: tests=$nTests failures=$nFailures errors=$nErrors skipped=$nSkipped")
          }
          Write-Host ("FULL_SUITE_XML=PASS; SUITES=$($reports.Count); TESTS=$nTests; FAILURES=$nFailures; ERRORS=$nErrors; SKIPPED=$nSkipped")
          Write-Host ('SOURCE_SHA='+$env:GITHUB_SHA)
          Write-Host 'ADVENTURE_TRANSACTION_TESTS=7/7; FULL_SUITE=PASS; APK_NOT_BUILT=TRUE'
      # This repository is private. Store the complete Gradle XML results on a
      # dedicated QA branch rather than GitHub Actions artifact storage.
      # This is intentionally a hard gate: failed evidence publication is visible.
      # On pull_request never grant untrusted PR code a write token.
      - name: Publish XML evidence to isolated Git branch (no artifacts quota)
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const folder = path.join(
              process.env.GITHUB_WORKSPACE, 'dnd-normal', 'run247-mod005',
              'app', 'build', 'test-results', 'testDebugUnitTest'
            );
            const present = fs.existsSync(folder);
            const names = present
              ? fs.readdirSync(folder)
                  .filter(n => n.startsWith('TEST-') && n.endsWith('.xml'))
                  .sort()
              : [];
            // Even a disk/compile failure must leave an auditable run record.
            // Never turn missing XMLs into a false success.
            if (!present) core.warning('NO_TEST_RESULTS_DIR: archived failure manifest only');
            else if (!names.length) core.warning('NO_TEST_RESULTS_XML: archived failure manifest only');
            let totals = {tests:0, failures:0, errors:0, skipped:0};
            const files = {};
            const sha256 = {};
            for (const name of names) {
              const xml = fs.readFileSync(path.join(folder, name), 'utf8');
              const tag = xml.match(/<testsuite\b[^>]*>/);
              if (!tag) throw Error('INVALID_TEST_SUITE_XML: ' + name);
              const attr = key => {
                const m = tag[0].match(new RegExp('\\b' + key + '="(\\d+)"'));
                if (!m) throw Error('MISSING_SUITE_METRIC_' + key + ': ' + name);
                return Number(m[1]);
              };
              for (const key of Object.keys(totals)) totals[key] += attr(key);
              files[name] = xml;
              sha256[name] = crypto.createHash('sha256').update(xml).digest('hex');
            }
            const {owner, repo} = context.repo;
            const evidenceBranch = 'dnd-normal-qa-evidence';
            const target = 'runs/' + context.runId + '/attempt-' +
              process.env.GITHUB_RUN_ATTEMPT + '.json';
            const editorialPath = path.join(
              process.env.GITHUB_WORKSPACE, 'dnd-normal', 'run247-mod005',
              'build', 'editorial-483', 'report.json'
            );
            const editorial483 = fs.existsSync(editorialPath)
              ? JSON.parse(fs.readFileSync(editorialPath, 'utf8'))
              : null;
            if (!editorial483) core.warning('EDITORIAL_483_REPORT_MISSING');
            const payload = JSON.stringify({
              format: 'BRASEIRO_DND_GRADLE_XML_EVIDENCE_V1',
              source_sha: context.sha,
              workflow_run: context.runId,
              workflow_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              run_url: 'https://github.com/' + owner + '/' + repo +
                '/actions/runs/' + context.runId,
              suite_count: names.length,
              xml_directory_present: present,
              evidence_complete: names.length > 0,
              totals: totals,
              all_tests_passed: names.length > 0 && totals.tests > 0 &&
                totals.failures === 0 && totals.errors === 0 && totals.skipped === 0,
              xml_sha256: sha256,
              xml_files: files,
              editorial_483: editorial483,
              note: 'Automated Robolectric/Gradle tests and individual structural editorial audit; no claim of semantic certification or physical Android testing.'
            }, null, 2);
            const blob = await github.rest.git.createBlob({
              owner, repo, content: payload, encoding: 'utf-8'
            });
            let previous = null, baseTree = null;
            try {
              const reference = await github.rest.git.getRef({
                owner, repo, ref: 'heads/' + evidenceBranch
              });
              previous = reference.data.object.sha;
              const previousCommit = await github.rest.git.getCommit({
                owner, repo, commit_sha: previous
              });
              baseTree = previousCommit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const treeArgs = {
              owner, repo,
              tree: [{path: target, mode: '100644', type: 'blob', sha: blob.data.sha}]
            };
            if (baseTree) treeArgs.base_tree = baseTree;
            const tree = await github.rest.git.createTree(treeArgs);
            const commit = await github.rest.git.createCommit({
              owner, repo, tree: tree.data.sha,
              parents: previous ? [previous] : [],
              message: 'qa(dnd): archive run ' + context.runId + ' XML evidence'
            });
            if (previous) {
              await github.rest.git.updateRef({
                owner, repo, ref: 'heads/' + evidenceBranch,
                sha: commit.data.sha, force: false
              });
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/heads/' + evidenceBranch,
                sha: commit.data.sha
              });
            }
            core.info('QA_EVIDENCE_STORED=' + evidenceBranch + '/' + target);
            core.info('QA_EVIDENCE_SHA=' + context.sha);
            core.info('QA_EVIDENCE_SUITES=' + names.length);
            core.info('QA_EVIDENCE_TESTS=' + totals.tests);
            core.info('QA_EVIDENCE_FAILURES=' + totals.failures);
