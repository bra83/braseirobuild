name: Cancel obsolete Star Wars P28 runs
on:
  push:
    branches: [star-wars-r54-p28-adventure-engine]
    paths:
      - '.github/workflows/cancel-obsolete-star-wars-p28.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete queued/in-progress runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for id in 35616700257 35616910905 35616940888 35616946547 35616600095 35616606176 35616910847 35616940963; do
            code=$(curl -sS -o /tmp/cancel.out -w '%{http_code}' -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$repo/actions/runs/$id/cancel" || true)
            echo "run=$id http=$code"
          done
