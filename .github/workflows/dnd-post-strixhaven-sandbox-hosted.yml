name: DnD post-Strixhaven sandbox acceptance (hosted)
on:
  pull_request:
    branches:
      - antigravity/dnd-normal-fechamento-gates
    paths:
      - 'dnd-normal/run247-mod005/app/src/**'
      - '.github/workflows/dnd-post-strixhaven-sandbox-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnd-post-strixhaven-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        uses: android-actions/setup-android@v3
      - name: Install Android build platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Test real SQLite world lifecycle and existing adventure integration
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain -Pbraseiro.qaLiteAssets=true \
            --tests com.braseiro.dnd5e.SandboxActionDurationTest \
            --tests com.braseiro.dnd5e.SandboxRestPolicyTest \
            --tests com.braseiro.dnd5e.PostStrixhavenWorldLifecycleRobolectricTest \
            --tests com.braseiro.dnd5e.LivingWorldCatchUpRulesTest \
            --tests com.braseiro.dnd5e.SimulatedGameSessionNarrativeTest
      - name: Count actual JUnit XML results
        if: always()
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths=glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          print('XML_SUITE_COUNT=',len(paths))
          total={'tests':0,'failures':0,'errors':0,'skipped':0}
          for p in paths:
              root=ET.parse(p).getroot()
              for k in total: total[k]+=int(root.attrib.get(k,'0'))
          print('XML_RESULT_TOTALS=',total)
          print('SOURCE_SHA=', __import__('os').environ.get('GITHUB_SHA','UNKNOWN'))
          if not paths or not total['tests'] or any(total[k] for k in ('failures','errors','skipped')):
              raise SystemExit('POST_STRIXHAVEN_EVIDENCE_NOT_GREEN')
          print('POST_STRIXHAVEN_TEST_CLASSES_PASS=TRUE')
          print('ANDROID_DEVICE_HOMOLOGATED=FALSE')
          PY
