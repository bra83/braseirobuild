name: Publish Mausritter R25 source release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mausritter-r25.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      TAG: mausritter-6.1.0-r25
      ZIP_NAME: Mausritter_Mestre_Vivo_6.1.0-r25_TTS_KOKORO_ANDROID_STUDIO.zip
      WHOLE_SHA256: eff615ac96ad77449c27e04778d732fc20cd039b767ff92310ebd23d9841e8df
      P00_ID: 6RbL702IjPe8ve27
      P01_ID: TOSIaw3WrrnXMRjU
      P02_ID: uZk8oYd9CIWylmgY
      P03_ID: vn91zBFqpOkU6qx3
      P04_ID: MxjUv7gQ2AB9LM04
      P05_ID: trCKg1f1PTEadqZo
      P06_ID: k1a2LOmhbfCLds7C
      P00_SHA: b134eb810199167d2ef938d7d51b4ce2ae6e4a0c94a12d2e617dcd13e23b728d
      P01_SHA: 074e2973201d78fc5361e3787464e032e5e7f1b7ac404d64f3db203c5d663ca5
      P02_SHA: 6ad64dc9d608f6ff840af41c38fec24d3a7756b195b51fd000cb32be8a0beb4b
      P03_SHA: c63257b79988554921d1b3eed8301a515e53374b9467945a97feec5927c1090f
      P04_SHA: 395d7d431bcedd526e3f42fd64a6fd190f2f550fad0e011460db3f8f913a5d95
      P05_SHA: 7a5af8765876bf1812cce9acf728b43a89931d8a8d424e2b9a40dfd31653f40e
      P06_SHA: 390694eb940882f4b8e8eef429b898495f24b4b89da548e8b93c181102d1c216

    steps:
      - name: Confirm BRELGA
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA; got $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"

      - name: Download stable firestorage parts
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-FirePart([string]$PublicId, [string]$OutFile) {
            $api = "https://api.firestorage.ai/dev/file/shares/$PublicId"
            $meta = Invoke-RestMethod -Uri "$api/files?maxResults=100"
            $files = @($meta.files)
            if ($files.Count -ne 1) { throw "Expected exactly one file for $PublicId; found $($files.Count)" }
            $fileId = $files[0].fileId
            if ([string]::IsNullOrWhiteSpace($fileId)) { throw "Missing fileId for $PublicId" }
            $ticket = Invoke-RestMethod -Method Post -Uri "$api/files/$fileId/download"
            $url = $ticket.downloadUrl
            if ([string]::IsNullOrWhiteSpace($url)) { throw "Missing downloadUrl for $PublicId" }
            & curl.exe -L --fail --retry 5 --retry-delay 2 -o $OutFile $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $OutFile)) { throw "Download failed for $PublicId" }
          }

          Get-FirePart $env:P00_ID 'part.00'
          Get-FirePart $env:P01_ID 'part.01'
          Get-FirePart $env:P02_ID 'part.02'
          Get-FirePart $env:P03_ID 'part.03'
          Get-FirePart $env:P04_ID 'part.04'
          Get-FirePart $env:P05_ID 'part.05'
          Get-FirePart $env:P06_ID 'part.06'

          $parts = @(
            @{ Path='part.00'; Hash=$env:P00_SHA },
            @{ Path='part.01'; Hash=$env:P01_SHA },
            @{ Path='part.02'; Hash=$env:P02_SHA },
            @{ Path='part.03'; Hash=$env:P03_SHA },
            @{ Path='part.04'; Hash=$env:P04_SHA },
            @{ Path='part.05'; Hash=$env:P05_SHA },
            @{ Path='part.06'; Hash=$env:P06_SHA }
          )
          foreach ($p in $parts) {
            $h = (Get-FileHash $p.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($h -ne $p.Hash) { throw "Hash mismatch for $($p.Path): $h" }
            Write-Host "$($p.Path) OK $h"
          }

      - name: Reconstruct and verify exact ZIP
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          cmd.exe /c "copy /b part.00+part.01+part.02+part.03+part.04+part.05+part.06 $env:ZIP_NAME >nul"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $env:ZIP_NAME)) { throw "ZIP reconstruction failed" }

          $hash = (Get-FileHash $env:ZIP_NAME -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:WHOLE_SHA256) { throw "Final ZIP hash mismatch: $hash" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:ZIP_NAME))
          $entries = $z.Entries.Count
          $z.Dispose()
          if ($entries -le 0) { throw "ZIP has no entries" }

          "$hash  $env:ZIP_NAME" | Set-Content -Path "$env:ZIP_NAME.sha256" -Encoding ascii
          Write-Host "ZIP OK SHA256=$hash ENTRIES=$entries BYTES=$((Get-Item $env:ZIP_NAME).Length)"

      - name: Create draft release
        id: release
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-brelga'
          }

          $body = @{
            tag_name = $env:TAG
            target_commitish = 'main'
            name = 'Mausritter Mestre Vivo 6.1.0 R25 - TTS Kokoro'
            body = 'Android Studio source baseline R25. Braseiro Kokoro PT-BR / Android TextToSpeech integration. Exact source ZIP SHA-256: eff615ac96ad77449c27e04778d732fc20cd039b767ff92310ebd23d9841e8df'
            draft = $true
            prerelease = $false
          } | ConvertTo-Json

          $release = Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/releases" -Body $body -ContentType 'application/json'
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_url=$($release.html_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Draft release: $($release.html_url)"

      - name: Attach source ZIP and checksum
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $files = @($env:ZIP_NAME, "$env:ZIP_NAME.sha256")

          foreach ($file in $files) {
            $encoded = [uri]::EscapeDataString([IO.Path]::GetFileName($file))
            $upload = "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$encoded"
            & curl.exe -L --fail --retry 5 --retry-delay 2 --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$file" $upload
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed: $file" }
            Write-Host "Uploaded: $file"
          }

      - name: Publish only after verified asset exists
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-brelga'
          }

          $check = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID"
          $zipAsset = @($check.assets | Where-Object { $_.name -eq $env:ZIP_NAME })
          $shaAsset = @($check.assets | Where-Object { $_.name -eq "$env:ZIP_NAME.sha256" })
          if ($zipAsset.Count -ne 1 -or $shaAsset.Count -ne 1) { throw "Release assets missing before publish" }

          $body = @{ draft = $false } | ConvertTo-Json
          $published = Invoke-RestMethod -Method Patch -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID" -Body $body -ContentType 'application/json'
          Write-Host "PUBLISHED=$($published.html_url)"
          Write-Host "ASSETS=$($published.assets.Count)"
