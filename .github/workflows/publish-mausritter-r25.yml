name: Publish Mausritter R25 source release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mausritter-r25.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      TAG: mausritter-6.1.0-r25
      ZIP_NAME: Mausritter_Mestre_Vivo_6.1.0-r25_TTS_KOKORO_ANDROID_STUDIO.zip
      WHOLE_SHA256: eff615ac96ad77449c27e04778d732fc20cd039b767ff92310ebd23d9841e8df
      PART0_SHA256: 59988d5de3559a9fb5759d10b284906da7dbdd4cde28302c5ac3dd2971bc575d
      PART1_SHA256: 14320a664a6aea255467441ed7ae3463fbfd71cc21d40bbc9a1c63e5a2168389
      PART2_SHA256: 390694eb940882f4b8e8eef429b898495f24b4b89da548e8b93c181102d1c216
      PART0_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b76c-820e-b757-8254eea81301/raw?se=2026-09-25T02%3A35%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=2f49d32a-7785-5454-bba0-96505c60287b&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T00%3A53%3A26Z&ske=2026-09-26T00%3A53%3A26Z&sks=b&skv=2026-02-06&sig=HhHPLDUCsuNXGVYa%2Bug2/RoYnW95NyGUn%2BTWGg/uIhg%3D'
      PART1_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1dd0-820e-ad77-82a1e324bc2d/raw?se=2026-09-25T02%3A36%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=ee5e311f-37e8-57de-967b-360fb0e748ec&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T01%3A35%3A28Z&ske=2026-09-26T01%3A35%3A28Z&sks=b&skv=2026-02-06&sig=097zJjRGyX%2BiUT5ol7yZ9UK0E%2BDM6xl7fu2aybx92lQ%3D'
      PART2_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-e1d8-820e-96b0-8f183440d012/raw?se=2026-09-25T02%3A36%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=9a79a034-31e8-5e30-92ee-2c78a9b5f18e&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T02%3A07%3A47Z&ske=2026-09-26T02%3A07%3A47Z&sks=b&skv=2026-02-06&sig=0%2B8oAg5%2BlUtGjivCJ/o%2BK9nidVit3qWba9C1P54KidQ%3D'

    steps:
      - name: Confirm BRELGA
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA; got $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"

      - name: Download exact source parts
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          & curl.exe -L --fail --retry 5 --retry-delay 2 -o part.00 $env:PART0_URL
          if ($LASTEXITCODE -ne 0) { throw "part.00 download failed" }
          & curl.exe -L --fail --retry 5 --retry-delay 2 -o part.01 $env:PART1_URL
          if ($LASTEXITCODE -ne 0) { throw "part.01 download failed" }
          & curl.exe -L --fail --retry 5 --retry-delay 2 -o part.02 $env:PART2_URL
          if ($LASTEXITCODE -ne 0) { throw "part.02 download failed" }
          $parts = @(
            @{ Path='part.00'; Hash=$env:PART0_SHA256 },
            @{ Path='part.01'; Hash=$env:PART1_SHA256 },
            @{ Path='part.02'; Hash=$env:PART2_SHA256 }
          )
          foreach ($p in $parts) {
            $h = (Get-FileHash $p.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($h -ne $p.Hash) { throw "Hash mismatch for $($p.Path): $h" }
            Write-Host "$($p.Path) OK $h"
          }

      - name: Reconstruct and verify exact ZIP
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          cmd.exe /c "copy /b part.00+part.01+part.02 $env:ZIP_NAME >nul"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $env:ZIP_NAME)) { throw "ZIP reconstruction failed" }
          $hash = (Get-FileHash $env:ZIP_NAME -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:WHOLE_SHA256) { throw "Final ZIP hash mismatch: $hash" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:ZIP_NAME))
          $entries = $z.Entries.Count
          $z.Dispose()
          if ($entries -le 0) { throw "ZIP has no entries" }
          "$hash  $env:ZIP_NAME" | Set-Content -Path "$env:ZIP_NAME.sha256" -Encoding ascii
          Write-Host "ZIP OK SHA256=$hash ENTRIES=$entries BYTES=$((Get-Item $env:ZIP_NAME).Length)"

      - name: Create draft release
        id: release
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-brelga'
          }
          try {
            $old = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG"
            if ($old) { throw "Release tag already exists: $env:TAG" }
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          $body = @{
            tag_name = $env:TAG
            target_commitish = 'main'
            name = 'Mausritter Mestre Vivo 6.1.0 R25 - TTS Kokoro'
            body = 'Android Studio source baseline R25. Braseiro Kokoro PT-BR / Android TextToSpeech integration. Exact source ZIP SHA-256: eff615ac96ad77449c27e04778d732fc20cd039b767ff92310ebd23d9841e8df'
            draft = $true
            prerelease = $false
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Headers $headers -Uri "https://api.github.com/repos/$repo/releases" -Body $body -ContentType 'application/json'
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_url=$($release.html_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Draft release: $($release.html_url)"

      - name: Attach ZIP and checksum
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $files = @($env:ZIP_NAME, "$env:ZIP_NAME.sha256")
          foreach ($file in $files) {
            $encoded = [uri]::EscapeDataString([IO.Path]::GetFileName($file))
            $upload = "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$encoded"
            & curl.exe -L --fail --retry 5 --retry-delay 2 --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$file" $upload
            if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed: $file" }
            Write-Host "Uploaded: $file"
          }

      - name: Publish release only after assets exist
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-brelga'
          }
          $check = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID"
          $zipAsset = @($check.assets | Where-Object { $_.name -eq $env:ZIP_NAME })
          if ($zipAsset.Count -ne 1) { throw "ZIP asset missing before publish" }
          $body = @{ draft = $false } | ConvertTo-Json
          $published = Invoke-RestMethod -Method Patch -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID" -Body $body -ContentType 'application/json'
          Write-Host "PUBLISHED=$($published.html_url)"
          Write-Host "ASSETS=$($published.assets.Count)"
