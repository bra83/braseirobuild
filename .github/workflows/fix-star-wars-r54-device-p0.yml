name: Fix Star Wars R54 Real Device P0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-star-wars-r54-device-p0.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover current canonical R54
        id: root
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip
          rm -rf /tmp/r54-p0 && mkdir -p /tmp/r54-p0
          unzip -q "$ZIP" -d /tmp/r54-p0
          SET="$(find /tmp/r54-p0 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"; test -n "$SET"
          ROOT="$(dirname "$SET")"; echo "path=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Recover exact approved blue-white galaxy map
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          DEST="$ROOT/app/src/main/assets/vtt/assets/maps/9752360iy2h61.png"
          curl -L --fail --retry 3 --connect-timeout 20 -A 'Mozilla/5.0' 'https://i.redd.it/9752360iy2h61.png' -o "$DEST"
          python3 - "$DEST" <<'PY'
          import struct,sys
          p=sys.argv[1];d=open(p,'rb').read(32)
          assert d[:8]==b'\x89PNG\r\n\x1a\n',d[:16]
          w,h=struct.unpack('>II',d[16:24]); assert w>=2000 and h>=1800,(w,h)
          print('APPROVED_MAP_OK',w,h)
          PY
      - name: Apply real-device P0 repair
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          python3 star-wars/r54/fix_device_p0.py "$ROOT" | tee /tmp/R54_DEVICE_P0_PATCH.txt
          V="$ROOT/app/src/main/assets/vtt"
          node --check "$V/r46/final-runtime.js"
          node --check "$V/r54-device-p0.js"
          grep -Fq 'setAllowFileAccessFromFileURLs(true)' "$ROOT/app/src/main/java/com/braseiro/starwarsedge/MainActivity.java"
          grep -Fq 'R54_DEVICE_P0_START' "$V/r46/final-runtime.js"
          grep -Fq '9752360iy2h61.png' "$V/r54-device-p0.js"
      - name: Browser P0 visual/startup regression 415x915
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8777 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/r54-p0-http.log 2>&1 & PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          python3 - <<'PY' | tee /tmp/R54_DEVICE_P0_BROWSER.txt
          from playwright.sync_api import sync_playwright
          base='http://127.0.0.1:8777/r46-shell.html'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              pg=b.new_page(viewport={'width':415,'height':915}); dialogs=[]; errors=[]
              pg.on('dialog',lambda d:(dialogs.append(d.message),d.dismiss()))
              pg.on('pageerror',lambda e:errors.append(str(e)))
              pg.route('**/*',lambda route,req: route.continue_() if req.url.startswith('http://127.0.0.1:8777/') else route.abort())
              pg.goto(base+'?screen=00',wait_until='domcontentloaded',timeout=30000)
              pg.wait_for_timeout(600)
              # Startup map must use the repeatedly-approved blue/white map and compact points.
              if pg.locator('#sandbox-map').count():
                  img=pg.locator('#sandbox-map>img').first
                  assert '9752360iy2h61.png' in (img.get_attribute('src') or ''), img.get_attribute('src')
                  pts=pg.locator('#sandbox-map button[data-point]')
                  assert pts.count()>=70,pts.count()
                  box=pts.first.bounding_box(); assert box and box['width']<=16 and box['height']<=16,box
              # Make a character in the real bridge, then verify the Ficha gets an actual loaded image.
              pg.wait_for_function("()=>window.BraseiroGameBridge&&typeof window.BraseiroGameBridge.generateRandomCharacter==='function'",timeout=15000)
              pg.evaluate("()=>{try{window.BraseiroGameBridge.generateRandomCharacter()}catch(e){}}")
              pg.goto(base+'?screen=06',wait_until='domcontentloaded',timeout=30000);pg.wait_for_timeout(600)
              portrait=pg.locator('.r54-character-portrait img')
              assert portrait.count()==1,portrait.count(); assert portrait.first.evaluate('(i)=>i.complete&&i.naturalWidth>0')
              # Acquisition/inventory: any bound weapon shown must be a real image, not an empty placeholder.
              weapon_loaded=False
              for screen in ('09','08'):
                  pg.goto(base+f'?screen={screen}',wait_until='domcontentloaded',timeout=30000);pg.wait_for_timeout(900)
                  imgs=pg.locator('.r54-item-visual img')
                  for i in range(imgs.count()):
                      if imgs.nth(i).evaluate('(x)=>x.complete&&x.naturalWidth>0'):
                          weapon_loaded=True;break
                  if weapon_loaded:break
              assert weapon_loaded,'no loaded weapon/equipment image on screens 08/09'
              assert not [e for e in errors if 'favicon' not in e.lower()],errors
              print('R54_DEVICE_P0_BROWSER_PASS',{'portrait':True,'weapon_asset':True,'dialogs':dialogs,'errors':errors})
              b.close()
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', validate-wrappers: false}
      - name: Configure Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"; SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"; yes | "$SDKMANAGER" --licenses >/dev/null || true; "$SDKMANAGER" 'platform-tools' 'platforms;android-36'; echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build repaired APK
        working-directory: ${{ steps.root.outputs.path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Persist repaired R54 APK ZIP map and evidence only to GitHub
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          P=/tmp/r54-p0-persist; rm -rf "$P"; mkdir -p "$P/out" "$P/audit" "$P/assets"
          APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n1)"; test -f "$APK"
          cp "$APK" "$P/out/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P0_DEBUG.apk"
          unzip -t "$P/out/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P0_DEBUG.apk" >/dev/null
          (cd "$ROOT" && zip -qr "$P/out/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P0.zip" . -x '*/build/*' '.gradle/*')
          sha256sum "$P/out/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P0_DEBUG.apk" > "$P/out/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P0_DEBUG.apk.sha256"
          sha256sum "$P/out/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P0.zip" > "$P/out/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P0.zip.sha256"
          cp "$ROOT/app/src/main/assets/vtt/assets/maps/9752360iy2h61.png" "$P/assets/9752360iy2h61.png"
          cp /tmp/R54_DEVICE_P0_PATCH.txt "$P/audit/DEVICE_P0_PATCH_2026-09-17.txt"
          cp /tmp/R54_DEVICE_P0_BROWSER.txt "$P/audit/DEVICE_P0_BROWSER_2026-09-17.txt"
          cat > "$P/out/DEVICE_P0_STATUS_2026-09-17.txt" <<'EOF'
          R54 DEVICE P0 REPAIR BUILT: local file:// fetch enabled; game start no longer waits for Barbara/network; approved 9752360iy2h61 blue/white galaxy map installed with compact points; character portrait visible; weapon/equipment binding visible; PDF document URI permission hardened; Android build PASS.
          EOF
          git config user.name github-actions; git config user.email github-actions@github.com
          git reset --hard HEAD; git clean -fd; git fetch origin main; git reset --hard origin/main
          OUT=star-wars/final-1.0.0/output-r54; mkdir -p "$OUT" star-wars/r54/audit star-wars/r54/device-p0-assets
          cp "$P/out"/* "$OUT/"; cp "$P/audit"/* star-wars/r54/audit/; cp "$P/assets"/* star-wars/r54/device-p0-assets/
          git add -f "$OUT" star-wars/r54/audit star-wars/r54/device-p0-assets
          git commit -m 'build(star-wars): persist R54 real-device P0 repair'
          git push origin HEAD:main
