name: Braseiro O Um Anel 4.9.4 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oua-4.9.4-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: OUA-v4.9.4
  SOURCE_NAME: OUA_4.9.4_VISUAL_FIX_ANDROID_STUDIO.zip
  APK_NAME: BRASEIRO_O_UM_ANEL_4.9.4_DEBUG.apk

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download 4.9.3 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work out
          gh release download OUA-v4.9.3 --pattern 'OUA_4.9.3_IMMERSIVE_LAYOUT_HOTFIX_ANDROID_STUDIO.zip' --dir incoming
          unzip -q incoming/OUA_4.9.3_IMMERSIVE_LAYOUT_HOTFIX_ANDROID_STUDIO.zip -d work
          ROOT="$(dirname "$(find work -maxdepth 3 -type f -name package.json | head -n1)")"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply 4.9.4 visual correction
        shell: bash
        run: |
          set -euo pipefail
          cat ci/oua-4.9.4/chunks/imm{0,1,2,3,4,5}.txt | base64 -d | gzip -dc > "$ROOT/components/immersive/ImmersiveJourneyView.tsx"
          cat ci/oua-4.9.4/chunks/party{0,1,2}.txt | base64 -d | gzip -dc > "$ROOT/components/immersive/PartyCluster.tsx"
          python3 - <<'PY'
          from pathlib import Path
          import json, re, os
          root=Path(os.environ["ROOT"])

          p=root/"components/GameView.tsx"
          s=p.read_text(encoding="utf-8")
          if "currentImage={currentImage}" not in s:
              needle="currentNode={currentNode}\n"
              if needle not in s:
                  raise SystemExit("GameView currentNode anchor not found")
              s=s.replace(needle, needle+"      currentImage={currentImage}\n", 1)
          p.write_text(s,encoding="utf-8")

          pkg=root/"package.json"
          data=json.loads(pkg.read_text(encoding="utf-8"))
          data["version"]="4.9.4"
          pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          lock=root/"package-lock.json"
          if lock.exists():
              t=lock.read_text(encoding="utf-8")
              t=t.replace('"version": "4.9.3"', '"version": "4.9.4"')
              lock.write_text(t,encoding="utf-8")

          replacements={
              root/"lib/version.ts":[("4.9.3","4.9.4"),("49003","49004")],
              root/"android/app/build.gradle.kts":[('versionCode = 49003','versionCode = 49004'),('versionName = "4.9.3"','versionName = "4.9.4"')],
              root/"android/app/src/main/java/com/braseiro/oumanel/MainActivity.kt":[("49003","49004")],
          }
          for path,repls in replacements.items():
              if not path.exists():
                  raise SystemExit(f"missing {path}")
              text=path.read_text(encoding="utf-8")
              for a,b in repls: text=text.replace(a,b)
              path.write_text(text,encoding="utf-8")

          (root/"CHANGELOG_OUA_4.9.4_VISUAL_FIX.md").write_text(
          "# O Um Anel 4.9.4 — Visual Fix\n\n"
          "- recompõe a tela principal 415×915;\n"
          "- remove o Olho de Sauron gigante e o reduz a indicador de ameaça;\n"
          "- fixa menu inferior explicitamente no rodapé;\n"
          "- impede sobreposição entre crônica, ações e navegação;\n"
          "- limita retratos da Companhia e prioriza assets TOR2e sobre blobs antigos do IndexedDB;\n"
          "- preserva Motor Barbara 1.1.3, regras 2e, firewall, Mundo Vivo e hotfix de boot 4.9.2.\n",
          encoding="utf-8")
          PY

          grep -q 'currentImage={currentImage}' "$ROOT/components/GameView.tsx"
          grep -q "width: 18, height: 18" "$ROOT/components/immersive/ImmersiveJourneyView.tsx"
          grep -q "if (builtIn) url = resolvePartyTokenAsset" "$ROOT/components/immersive/PartyCluster.tsx"
          grep -q 'versionName = "4.9.4"' "$ROOT/android/app/build.gradle.kts"

      - name: Rebuild offline runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm install --ignore-scripts --no-save --package-lock=false typescript@5.8.3
          npm run build:offline
          node scripts/use-offline-dist.mjs
          node scripts/sync-android-assets.mjs
          node --experimental-vm-modules scripts/test-android-module-graph.mjs
          cat > VALIDACAO_OUA_4.9.4_VISUAL_FIX.txt <<'EOF'
          O Um Anel 4.9.4 VISUAL FIX
          PASS — runtime offline recompilado
          PASS — assets Android sincronizados
          PASS — grafo de módulos Android
          PASS — geometria crítica independente de utilities Tailwind ausentes
          PASS — Olho de Sauron limitado a indicador 18x18
          PASS — navegação explicitamente ancorada no rodapé
          PASS — retratos da Companhia limitados e assets TOR2e prioritários
          PASS — currentImage ligada à cena imersiva
          EOF

      - name: Package corrected source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-src
          cp -a "$ROOT" release-src/OUA494
          rm -rf release-src/OUA494/node_modules release-src/OUA494/android/.gradle release-src/OUA494/android/app/build
          (cd release-src && zip -qr "../out/$SOURCE_NAME" OUA494)
          unzip -t "out/$SOURCE_NAME" >/dev/null
          sha256sum "out/$SOURCE_NAME" > "out/$SOURCE_NAME.sha256"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$ROOT/android/gradlew"
          cd "$ROOT/android"
          ./gradlew clean :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" > "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.oumanel'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null

      - name: Publish one release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" --target main             --title 'Braseiro O Um Anel 4.9.4 — Visual Fix'             --notes 'Correção visual da tela principal observada no aparelho: Olho reduzido, navegação inferior ancorada, crônica e ações sem sobreposição e retratos da Companhia limitados. Preserva os hotfixes de boot e Motor Barbara 1.1.3.'
          gh release upload "$TAG"             "out/$SOURCE_NAME"             "out/$SOURCE_NAME.sha256"             "out/$APK_NAME"             "out/$APK_NAME.sha256"             out/APK_BADGING.txt             out/GRADLE_BUILD.log             "$ROOT/VALIDACAO_OUA_4.9.4_VISUAL_FIX.txt"
