name: Braseiro Self-Hosted Release Android Builder

concurrency:
  group: braseiro-self-hosted-release-builder
  cancel-in-progress: true

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag containing the Android Studio source ZIP'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Allow runner PowerShell scripts
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force -ErrorAction Continue
          } catch {
            Write-Warning $_
          }
          "PSExecutionPolicyPreference=Bypass" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Execution policies:"
          Get-ExecutionPolicy -List | Format-Table -AutoSize
          exit 0

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK on Windows
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "This workflow must run on BRELGA; current runner is $env:RUNNER_NAME" }
          $candidates = @('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          if ($env:RUNNER_TOOL_CACHE) { $candidates += (Join-Path $env:RUNNER_TOOL_CACHE 'AndroidSdk') }
          $candidates += 'C:\Android\Sdk'

          $sdkRoot = $null
          $sdkmanager = $null

          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ([string]::IsNullOrWhiteSpace($candidate) -or -not (Test-Path $candidate)) { continue }
            $found = Get-ChildItem $candidate -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $sdkRoot = $candidate
              $sdkmanager = $found.FullName
              Write-Host "Reusing Android SDK: $sdkRoot"
              break
            }
          }

          if (-not $sdkmanager) {
            if ($env:RUNNER_TOOL_CACHE) {
              $sdkRoot = Join-Path $env:RUNNER_TOOL_CACHE 'AndroidSdk'
            } else {
              $sdkRoot = 'C:\actions-runner\android-sdk'
            }

            $cmdline = Join-Path $sdkRoot 'cmdline-tools\latest\bin\sdkmanager.bat'

            if (-not (Test-Path $cmdline)) {
              Remove-Item $sdkRoot -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $sdkRoot -Force | Out-Null

              $zip = Join-Path $env:RUNNER_TEMP 'android-commandlinetools.zip'
              $extract = Join-Path $env:RUNNER_TEMP 'android-commandlinetools-extract'
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $extract -Force | Out-Null

              $url = 'https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip'
              & curl.exe -L --fail --retry 3 --retry-delay 2 -o $zip $url
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) { throw 'Android command-line tools download failed' }

              $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne '90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a') {
                throw "Android command-line tools checksum mismatch: $hash"
              }

              Expand-Archive -Path $zip -DestinationPath $extract -Force
              $latest = Join-Path $sdkRoot 'cmdline-tools\latest'
              New-Item -ItemType Directory -Path (Split-Path $latest) -Force | Out-Null
              Move-Item (Join-Path $extract 'cmdline-tools') $latest -Force
            }

            $sdkmanager = $cmdline
          }

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path $sdkmanager) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $sdkRoot 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          Write-Host "ANDROID_SDK_ROOT=$sdkRoot"
          & $sdkmanager --version
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager validation failed' }

      - name: Select release and download source ZIP
        id: source
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:MANUAL_TAG }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'A release tag is required' }

          $repo = $env:GITHUB_REPOSITORY
          $encodedTag = [uri]::EscapeDataString($tag)
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-self-hosted-runner'
          }

          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$encodedTag"
          $zipAssets = @($release.assets | Where-Object { $_.name -match '\.zip$' -and $_.state -eq 'uploaded' })
          if ($zipAssets.Count -ne 1) { throw "Release $tag must contain exactly one uploaded ZIP; found $($zipAssets.Count)" }
          $asset = $zipAssets[0]

          $incoming = Join-Path $env:RUNNER_TEMP 'braseiro-release-source'
          Remove-Item $incoming -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $incoming -Force | Out-Null

          $zipPath = Join-Path $incoming $asset.name
          $binaryHeaders = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-self-hosted-runner'
          }
          & curl.exe -L --fail --retry 3 --retry-delay 2 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" -o $zipPath $asset.url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zipPath)) { throw 'Release ZIP download failed' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $test = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $entries = $test.Entries.Count
          $test.Dispose()

          $file = Get-Item $zipPath
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()

          Write-Host "TAG=$tag"
          Write-Host "ZIP=$zipPath"
          Write-Host "ZIP_BYTES=$($file.Length)"
          Write-Host "ZIP_ENTRIES=$entries"
          Write-Host "ZIP_SHA256=$hash"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_url=$($release.html_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract and detect Android Studio project
        id: project
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'braseiro-android-work'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          & tar.exe -xf $env:SOURCE_ZIP -C $work
          if ($LASTEXITCODE -ne 0) { throw 'ZIP extraction failed' }

          $settings = Get-ChildItem $work -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('settings.gradle','settings.gradle.kts') -and
              $_.FullName -notmatch '[\\/](build|\.gradle)[\\/]' -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradlew.bat')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradle\wrapper\gradle-wrapper.jar')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'app\src\main\AndroidManifest.xml'))
            } |
            Sort-Object { $_.FullName.Split([char[]]'\/', [System.StringSplitOptions]::RemoveEmptyEntries).Count } |
            Select-Object -First 1

          if (-not $settings) {
            Write-Host 'Top-level extracted files:'
            Get-ChildItem $work -Force | Select-Object Name,Length,Mode | Format-Table -AutoSize
            Write-Host 'Candidate Gradle / Android files:'
            Get-ChildItem $work -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'gradle|AndroidManifest' } |
              Select-Object -First 100 FullName |
              Format-Table -AutoSize
            throw 'Release ZIP does not contain a complete Android Studio project. It may be a patch-only ZIP.'
          }

          $root = $settings.Directory.FullName
          $wrapperBat = Join-Path $root 'gradlew.bat'
          if (-not (Test-Path $wrapperBat)) { throw "Android root found at $root, but gradlew.bat is missing" }

          $sdk = 35
          $values = New-Object System.Collections.Generic.List[int]
          $gradleFiles = Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '\.gradle(\.kts)?$' -and $_.FullName -notmatch '[\\/](build|\.gradle)[\\/]' }

          foreach ($gf in $gradleFiles) {
            $text = Get-Content $gf.FullName -Raw -ErrorAction SilentlyContinue
            if ($null -eq $text) { continue }
            foreach ($m in [regex]::Matches($text, 'compileSdk(?:Version)?\s*(?:=|\s)\s*(\d+)')) {
              [void]$values.Add([int]$m.Groups[1].Value)
            }
          }

          if ($values.Count -gt 0) { $sdk = ($values | Measure-Object -Maximum).Maximum }

          Write-Host "ANDROID_ROOT=$root"
          Write-Host "COMPILE_SDK=$sdk"
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sdk=$sdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install required Android platform
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          REQUESTED_SDK: ${{ steps.project.outputs.sdk }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkmanager = Get-Command sdkmanager.bat -ErrorAction Stop
          1..100 | ForEach-Object { 'y' } | & $sdkmanager.Source --licenses | Out-Null
          & $sdkmanager.Source 'platform-tools' "platforms;android-$env:REQUESTED_SDK" 'build-tools;35.0.0' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager failed' }
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"

      - name: Build debug APK
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'GRADLE_BUILD.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          & .\gradlew.bat --version --no-daemon 2>&1 | Tee-Object -FilePath $log
          $versionExit = $LASTEXITCODE
          if ($versionExit -ne 0) { throw "Gradle wrapper validation failed with exit code $versionExit" }
          & .\gradlew.bat clean assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath $log -Append
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { throw "assembleDebug failed with exit code $buildExit" }

      - name: Validate and collect APK
        id: apk
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          ROOT: ${{ steps.project.outputs.root }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Get-ChildItem $env:ROOT -Recurse -File -Filter '*.apk' |
            Where-Object { $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]' } |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $apk) { throw 'Debug APK not found after build' }

          $out = Join-Path $env:RUNNER_TEMP 'braseiro-apk-out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $safeTag = ($env:TAG -replace '[^A-Za-z0-9._-]','_')
          $name = "$safeTag-SELFHOSTED-DEBUG.apk"
          $dest = Join-Path $out $name
          Copy-Item $apk.FullName $dest -Force
          $gradleLog = Join-Path $env:RUNNER_TEMP 'GRADLE_BUILD.log'
          if (Test-Path $gradleLog) { Copy-Item $gradleLog (Join-Path $out 'GRADLE_BUILD.log') -Force }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $test = [System.IO.Compression.ZipFile]::OpenRead($dest)
          $test.Dispose()

          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Path "$dest.sha256" -Encoding ascii

          $badging = Join-Path $out 'APK_BADGING.txt'
          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object { [version]($_.Name -replace '[^0-9.]','') } -Descending | Select-Object -First 1
          if (-not $buildTools) { throw 'Android build-tools not found' }
          $aapt = Join-Path $buildTools.FullName 'aapt.exe'
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          if (-not (Test-Path $aapt)) { throw 'aapt.exe not found' }
          if (-not (Test-Path $apksigner)) { throw 'apksigner.bat not found' }
          & $aapt dump badging $dest 2>&1 | Tee-Object -FilePath $badging
          if ($LASTEXITCODE -ne 0) { throw 'APK badging validation failed' }
          if ((Get-Content $badging -Raw) -notmatch "package:\s+name='[^']+'") { throw 'APK applicationId not found' }
          $signature = Join-Path $out 'APK_SIGNATURE.txt'
          & $apksigner verify --verbose --print-certs $dest 2>&1 | Tee-Object -FilePath $signature
          if ($LASTEXITCODE -ne 0) { throw 'APK signature validation failed' }

          Write-Host "APK=$dest"
          Write-Host "APK_BYTES=$((Get-Item $dest).Length)"
          Write-Host "APK_SHA256=$hash"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dir=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attach APK to the same GitHub Release
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          RELEASE_ID: ${{ steps.source.outputs.release_id }}
          RELEASE_URL: ${{ steps.source.outputs.release_url }}
          OUT_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-self-hosted-runner'
          }

          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$env:RELEASE_ID"
          $files = Get-ChildItem $env:OUT_DIR -File
          if (-not $files) { throw 'No output files to upload' }

          foreach ($file in $files) {
            $existing = $release.assets | Where-Object { $_.name -eq $file.Name } | Select-Object -First 1
            if ($existing) {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" | Out-Null
              Write-Host "Deleted previous release asset: $($file.Name)"
            }

            $encodedName = [uri]::EscapeDataString($file.Name)
            $upload = "https://uploads.github.com/repos/$repo/releases/$env:RELEASE_ID/assets?name=$encodedName"
            & curl.exe -L --fail --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$($file.FullName)" $upload
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed for $($file.Name) with exit code $LASTEXITCODE" }
            Write-Host "Uploaded release asset: $($file.Name)"
          }

          "## Self-hosted Android build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Runner: $env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Release: $env:TAG" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- APK: ${{ steps.apk.outputs.name }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- URL: $env:RELEASE_URL" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
