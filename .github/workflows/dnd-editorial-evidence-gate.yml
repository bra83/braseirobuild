name: Braseiro D&D — editorial evidence gate
on:
  push:
    branches:
      - "fix/dnd-editorial-evidence-gate-20261012"
    paths:
      - "dnd-normal/run247-mod005/tools/**"
      - "dnd-normal/run247-mod005/docs/EDITORIAL_SECTION_ACCEPTANCE.csv"
      - "dnd-normal/run247-mod005/docs/PLANO_MESTRE_MATRIZ_10_LIVROS_SECOES.csv"
      - ".github/workflows/dnd-editorial-evidence-gate.yml"
  pull_request:
    paths:
      - "dnd-normal/run247-mod005/tools/**"
      - "dnd-normal/run247-mod005/docs/EDITORIAL_SECTION_ACCEPTANCE.csv"
      - "dnd-normal/run247-mod005/docs/PLANO_MESTRE_MATRIZ_10_LIVROS_SECOES.csv"
      - ".github/workflows/dnd-editorial-evidence-gate.yml"
permissions:
  contents: read
jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dnd-normal/run247-mod005
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression tests against false positive approvals
        run: python -m unittest discover -s tools -p 'test_validate_editorial_coverage.py' -v
      - name: Check inventory consistency without certifying content
        run: python tools/validate_editorial_coverage.py --json
      - name: Real completion gate (MUST reject incomplete source/semantic proof)
        run: python tools/validate_editorial_coverage.py --require-complete
