name: DND V1 - DMG 2024 Bastions complete event family (BRELGA)
on:
  push:
    branches:
      - implementation/dnd-v1-core-bastions-event-megablock-20261016
    paths:
      - '.github/workflows/dnd-v1-3core-bastion-megablock-brelga.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-v1-3core-bastion-megablock-brelga
  cancel-in-progress: false
jobs:
  verify-bastion:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 100
    steps:
      - name: Gate exact source and BRELGA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA') {throw 'WRONG_RUNNER'}
          Write-Host ('BASTION_2024_SHA='+$env:GITHUB_SHA)
          Write-Host 'SCOPE=PHB_2024_DMG_2024_MM_2025_NO_SUPPLEMENTS'
          Write-Host 'APK_BUILD=NO'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Configure Java 17 and Android SDK
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $java='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if(Test-Path $java) {
            Add-Content $env:GITHUB_ENV ('JAVA_HOME='+$java)
            Add-Content $env:GITHUB_PATH (Join-Path $java 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if(!$sdk -or !(Test-Path $sdk)){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if(!(Test-Path $sdk)){throw 'ANDROID_SDK_MISSING'}
          Add-Content $env:GITHUB_ENV ('ANDROID_HOME='+$sdk)
          Add-Content $env:GITHUB_ENV ('ANDROID_SDK_ROOT='+$sdk)
          $shared=Join-Path $env:USERPROFILE '.gradle'
          $isolated=Join-Path $env:RUNNER_TEMP ('dnd-v1-bastion-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          foreach($item in @('wrapper','caches')){
            $from=Join-Path $shared $item
            $to=Join-Path $isolated $item
            if((Test-Path $from)-and !(Test-Path $to)){
              New-Item -ItemType Junction -Path $to -Target $from | Out-Null
            }
          }
          Add-Content $env:GITHUB_ENV ('GRADLE_USER_HOME='+$isolated)
      - name: Verify 11 event families and persistent campaign / Backup21 flows
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --tests com.braseiro.dnd5e.Bastion2024AllEventsRobolectricTest --tests com.braseiro.dnd5e.Bastion2024PersistentFlowRobolectricTest --no-daemon --console=plain --stacktrace
          $code=$LASTEXITCODE
          $tests=0;$fail=0;$err=0;$skip=0
          foreach($class in @('com.braseiro.dnd5e.Bastion2024AllEventsRobolectricTest','com.braseiro.dnd5e.Bastion2024PersistentFlowRobolectricTest')){
            $path=Join-Path $dir ('TEST-'+$class+'.xml')
            if(!(Test-Path $path)){Write-Host ('BASTION_MISSING_XML='+$class);$fail++;continue}
            [xml]$d=Get-Content -LiteralPath $path -Raw
            $tests += [int]$d.testsuite.tests
            $fail += [int]$d.testsuite.failures
            $err += [int]$d.testsuite.errors
            $skip += [int]$d.testsuite.skipped
            foreach($node in @($d.SelectNodes('//testcase/failure | //testcase/error'))){
              Write-Host ('BASTION_FAIL_CASE='+$node.ParentNode.GetAttribute('name'))
              Write-Host ('BASTION_FAIL_REASON='+$node.GetAttribute('message'))
              $stack=[string]$node.InnerText
              Write-Host ('BASTION_FAIL_STACK='+$stack.Substring(0,[Math]::Min(1800,$stack.Length)))
            }
          }
          Write-Host ('BASTION_TARGETED_TESTS='+$tests+' FAIL='+$fail+' ERR='+$err+' SKIP='+$skip)
          if($code -ne 0 -or $tests -lt 13 -or $fail -ne 0 -or $err -ne 0 -or $skip -ne 0){throw 'BASTION_MEGABLOCK_TARGETED_FAILED'}
          Write-Host 'BASTION_TARGETED=PASS'
      - name: Full Android suite at same SHA
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
          $code=$LASTEXITCODE
          $docs=@()
          if(Test-Path $dir){$docs=@(Get-ChildItem -LiteralPath $dir -Filter 'TEST-*.xml' -File)}
          $tests=0;$fail=0;$err=0;$skip=0
          foreach($file in $docs){
            [xml]$d=Get-Content -LiteralPath $file.FullName -Raw
            $tests += [int]$d.testsuite.tests
            $fail += [int]$d.testsuite.failures
            $err += [int]$d.testsuite.errors
            $skip += [int]$d.testsuite.skipped
            foreach($node in @($d.SelectNodes('//testcase/failure | //testcase/error'))){
              Write-Host ('BASTION_FULL_FAILED='+$node.ParentNode.GetAttribute('classname')+'::'+$node.ParentNode.GetAttribute('name'))
              Write-Host ('BASTION_FULL_REASON='+$node.GetAttribute('message'))
            }
          }
          Write-Host ('BASTION_FULL_TESTS='+$tests+' FAIL='+$fail+' ERR='+$err+' SKIP='+$skip+' XML='+$docs.Count)
          if($code -ne 0 -or $tests -lt 2690 -or $fail -ne 0 -or $err -ne 0 -or $skip -ne 0){throw 'BASTION_FULL_ANDROID_GATE_FAILED'}
          Write-Host 'BASTION_FULL_ANDROID=PASS'
          Write-Host 'THREE_BOOKS_ENTIRE_SOURCE_PARITY=NOT_CERTIFIED'
