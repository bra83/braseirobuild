name: Build Star Wars R54 Final Visual Closure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-star-wars-r54-final-visual.yml"
      - "star-wars/r54/restore_historical_visuals.py"
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FINAL_URL: https://firestorage.ai/ja/f/qvNlG1k2Qu3e
      FINAL_FILE: STAR_WARS_EDGE_OF_THE_GALAXY_VISUAL_COMPLETION_PACK.zip
      FINAL_SHA: 4114abdfa909ea7877a655f4d929cf2b64c92681c3925e5bfd565e17221966f6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover validated R54 Android Studio output and approved visual pack
        run: |
          set -euo pipefail
          BASE=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip
          test -f "$BASE"
          rm -rf work incoming final-pack && mkdir -p work incoming final-pack
          unzip -q "$BASE" -d work
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['FINAL_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);pg=b.new_page(accept_downloads=True)
            pg.goto(os.environ['FINAL_URL'],wait_until='domcontentloaded',timeout=120000);pg.wait_for_timeout(1200);done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
              try:
                q=pg.locator(sel).first
                if not q.count() or not q.is_visible():continue
                with pg.expect_download(timeout=120000) as info:q.click(timeout=10000)
                info.value.save_as(str(out));done=True;break
              except Exception:pass
            if not done:
              q=pg.get_by_text(os.environ['FINAL_FILE'],exact=False).first
              parent=q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
              with pg.expect_download(timeout=120000) as info:parent.locator('a,button').last.click(timeout=10000)
              info.value.save_as(str(out));done=True
            b.close()
          if not done or not out.exists():raise SystemExit('historical visual pack download failed')
          PY
          echo "$FINAL_SHA  incoming/$FINAL_FILE" | sha256sum -c -
          unzip -q "incoming/$FINAL_FILE" -d final-pack
      - id: root
        name: Restore approved 42-asset visual completion
        run: |
          set -euo pipefail
          SET="$(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)";test -n "$SET";ROOT="$(dirname "$SET")"
          python3 -m py_compile star-wars/r54/restore_historical_visuals.py
          python3 star-wars/r54/restore_historical_visuals.py "$ROOT" "$(pwd)/final-pack"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Static final closure gate
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          V="$ROOT/app/src/main/assets/vtt"
          node --check "$V/r46/final-runtime.js"
          node --check "$V/r46/r46-shell.bundle.js"
          node --check "$V/js/core/uiBridge.bundle.js"
          grep -Fq 'R54 UX — FICHA JSON EM DADOS / DIAGNÓSTICO' "$V/r46/r46-shell.bundle.js"
          ! grep -Fq 'no active Age of Rebellion tree data' "$V/js/core/uiBridge.bundle.js"
          python3 - "$V" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          v=Path(sys.argv[1]);m=json.loads((v/'image-library/manifest.json').read_text('utf-8'))
          final=[a for a in m['assets'] if str(a.get('assetId','')).startswith('local.final.')]
          assert len(final)==42,len(final)
          counts={k:sum(a.get('category')==k for a in final) for k in ['scene','vehicle','creature','portrait','equipment']}
          assert counts=={'scene':26,'vehicle':9,'creature':3,'portrait':2,'equipment':2},counts
          for a in final:
            p=v/a['localPath'];assert p.is_file(),p;assert hashlib.sha256(p.read_bytes()).hexdigest()==a['sha256'],p;assert a.get('mechanicalBinding') is None,a['assetId']
          s=(v/'js/rules/talentTreesData.mjs').read_text('utf-8');mark='export const TALENT_TREES = Object.freeze(';i=s.index(mark);j=s.index('{',i+len(mark));trees=json.JSONDecoder().raw_decode(s[j:])[0]
          tc=(len(trees),sum(len(x) for x in trees.values()),sum(len(t['nodes']) for x in trees.values() for t in x.values()));assert tc==(12,36,720),tc
          print('R54_FINAL_STATIC_PASS',counts,tc)
          PY
      - name: Browser final closure 31 screens x 2
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/final-http.log 2>&1 & PID=$!;trap 'kill $PID || true' EXIT;sleep 1
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          init="window.confirm=()=>false;window.BraseiroGemini={getStatus:()=>JSON.stringify({configured:true}),openGeminiWithPrompt:()=>JSON.stringify({ok:true})};"
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for width,height in [(415,915),(360,800)]:
              pg=b.new_page(viewport={'width':width,'height':height});errs=[];pg.on('pageerror',lambda e:errs.append(str(e)));pg.add_init_script(init)
              pg.route('**/*',lambda route,req:route.continue_() if req.url.startswith('http://127.0.0.1:8765/') else route.abort())
              pg.goto('http://127.0.0.1:8765/r46-shell.html?screen=00',wait_until='domcontentloaded',timeout=30000);pg.wait_for_timeout(100)
              if pg.locator('#braseiro-sandbox-setup').count():
                pg.locator('#sandbox-list button[data-point]').first.click();pg.locator('#sandbox-start-button').click();pg.wait_for_selector('#braseiro-sandbox-setup',state='detached',timeout=10000)
              pg.wait_for_timeout(250)
              completion=pg.evaluate('window.BraseiroFinalVisualCompletion||null');assert completion and completion['scenes']==26,completion
              scene=pg.locator('.scene-media-slot img.final-scene-library-image:visible');assert scene.count()>=1,(width,height);assert 'image-library/local/final/scenes/' in (scene.first.get_attribute('src') or '');assert scene.first.evaluate('(i)=>i.complete&&i.naturalWidth>0')
              for n in range(31):
                r=f'{n:02d}';pg.goto('http://127.0.0.1:8765/r46-shell.html?screen='+r,wait_until='domcontentloaded',timeout=30000);pg.wait_for_timeout(60);assert pg.evaluate('document.documentElement.scrollWidth-window.innerWidth')<=2,(width,r)
              pg.goto('http://127.0.0.1:8765/r46-shell.html?screen=30',wait_until='domcontentloaded',timeout=30000);body=pg.locator('body').inner_text().upper();assert 'FICHA JSON' in body and 'IMPORTAR FICHA JSON' in body
              assert not errs,errs;pg.close()
            b.close()
          print('R54_FINAL_BROWSER_PASS 31/31 x2 + historical visuals + JSON')
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', validate-wrappers: false}
      - name: Configure Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}";SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)";yes | "$SDKMANAGER" --licenses >/dev/null || true;"$SDKMANAGER" 'platform-tools' 'platforms;android-36';echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build final Android
        working-directory: ${{ steps.root.outputs.path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Persist final R54 closure
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          OUT=star-wars/final-1.0.0/output-r54;TMP="$GITHUB_WORKSPACE/final-output";rm -rf "$TMP";mkdir -p "$TMP"
          APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n1)";test -f "$APK"
          DEST="$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk";cp "$APK" "$DEST";unzip -t "$DEST" >/dev/null;sha256sum "$DEST" > "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk.sha256"
          (cd "$ROOT" && zip -qr "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip" . -x '*/build/*' '.gradle/*');sha256sum "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip" > "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip.sha256"
          printf 'R54 FINAL PASS: 31 screens x2; AoR 12/36/720; character JSON; 42 approved historical visual assets (26 scenes, 9 vehicles, 3 creatures, 2 Son Barab, 2 equipment); Android build PASS.\n' > "$TMP/R54_UX_STATUS.txt"
          rm -rf "$OUT";mkdir -p "$OUT";cp -a "$TMP/." "$OUT/"
          git config user.name github-actions;git config user.email github-actions@github.com;git add -f "$OUT";git commit -m 'build: persist Star Wars R54 final visual closure' || true;git reset --hard HEAD;git clean -fd -- work incoming final-pack final-output || true;git pull --rebase origin main;git push origin HEAD:main
