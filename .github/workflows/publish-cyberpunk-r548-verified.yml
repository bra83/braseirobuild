name: Publish Cyberpunk RED R5.48 verified release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-cyberpunk-r548-verified.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download verified R5.48 outputs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/bra83/hello-world/releases/download/cyberpunk-red-r5.48-complete-fix-worker"
          files=(
            "BRASEIRO-CYBERPUNK-RED-R5.48-DEBUG.apk"
            "BRASEIRO-CYBERPUNK-RED-R5.48-DEBUG.apk.sha256"
            "APK_BADGING.txt"
            "APK_SIGNATURE.txt"
            "CYBERPUNK_RED_R5_48_COMPLETE_FIX_CHECKPOINT.zip"
            "CYBERPUNK_RED_R5_48_COMPLETE_FIX_CHECKPOINT.zip.sha256"
            "R5_48_ZIP_INTEGRITY.txt"
            "R5_48_SESSION_ANDROID_S23_PROFILE.png"
            "R5_48_INVENTORY_ANDROID_S23_PROFILE.png"
            "R5_48_INVENTORY_SCROLL_ANDROID_S23_PROFILE.png"
            "R5_48_SCREENSHOTS.sha256"
            "R5_48_LOGCAT.txt"
          )
          for f in "${files[@]}"; do
            curl -fL --retry 4 --retry-delay 2 -o "$f" "$BASE/$f"
            test -s "$f"
          done
          echo "b380d5a3eb767a16bea2fc485486db8f64db81662c801d8f534b526b6f9bb8c0  BRASEIRO-CYBERPUNK-RED-R5.48-DEBUG.apk" | sha256sum -c -
          echo "d929a71a050a03cd812eead22dbe76b023f0bad4f248c89ca2fab1292e99b6f2  CYBERPUNK_RED_R5_48_COMPLETE_FIX_CHECKPOINT.zip" | sha256sum -c -

      - name: Publish braseirobuild release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="cyberpunk-red-r5.48-complete-fix"
          gh release delete "$TAG" -y --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" --target "$GITHUB_SHA"             --title "BRASEIRO Cyberpunk RED R5.48 Complete Fix"             --notes "R5.48 verified build. 155/155 runtime weapon entries pass the non-placeholder asset gate. Motor Barbara wheel metadata was repaired for clean Chaquopy builds. Gradle resources, Kotlin/Java compile, assembleDebug, APK signature/badging, install, launch, inventory navigation and scroll all passed. Android emulator used a 1440x3088@560dpi S23-Ultra-like display profile; this is not falsely represented as a physical S23 Ultra. Live production Gemini-key and audible hardware TTS still require the user's physical device."
          gh release upload "$TAG"             BRASEIRO-CYBERPUNK-RED-R5.48-DEBUG.apk             BRASEIRO-CYBERPUNK-RED-R5.48-DEBUG.apk.sha256             APK_BADGING.txt APK_SIGNATURE.txt             CYBERPUNK_RED_R5_48_COMPLETE_FIX_CHECKPOINT.zip             CYBERPUNK_RED_R5_48_COMPLETE_FIX_CHECKPOINT.zip.sha256             R5_48_ZIP_INTEGRITY.txt             R5_48_SESSION_ANDROID_S23_PROFILE.png             R5_48_INVENTORY_ANDROID_S23_PROFILE.png             R5_48_INVENTORY_SCROLL_ANDROID_S23_PROFILE.png             R5_48_SCREENSHOTS.sha256 R5_48_LOGCAT.txt
