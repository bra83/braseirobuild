name: PF2 R30 Android Kokoro + Mechanical Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pf2-r30-android-kokoro-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  R28_SHA: '3a635ae10d9e37a3ed75068c27539a36485470848112784717ed9ef2d3768e11'
  MECH_SHA: '5e0d25547afe3fc1e56c4c3758f4cbb099efa48519e194256663bba0bb5ce392'
  AUDIO_SHA: '657f5e3157c95032cc6bc2b307f0f14144137071ecac899ba7b04d71d8091775'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact R28, mechanical patch and audio patch
        shell: powershell
        env:
          SRC_SHARE: 'Q9EaqosxeXXK'
          SRC_FILE: '01a0c81d60a375449668e568a4163539'
          MECH_SHARE: 'uVfisfPLsxkc'
          MECH_FILE: '01a0d0d336f87594a1e775ddda91b3d4'
          AUDIO_SHARE: 'ugufpP3bcFtM'
          AUDIO_FILE: '01a0d2035962772f91d414dcdc274ca2'
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Expected BRELGA, got $env:RUNNER_NAME"}
          $api='https://api.firestorage.ai/dev/file'
          $root=Join-Path $env:RUNNER_TEMP 'pf2-r30'
          $work=Join-Path $root 'work'
          $mech=Join-Path $root 'mech'
          $audio=Join-Path $root 'audio'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work,$mech,$audio -Force | Out-Null

          function Grab($share,$file,$dest){
            $d=Invoke-RestMethod -Method Post -Uri "$api/shares/$share/files/$file/download"
            if(-not $d.downloadUrl){throw "downloadUrl missing for $share/$file"}
            Invoke-WebRequest -Uri $d.downloadUrl -OutFile $dest
          }

          $srcZip=Join-Path $root 'source.zip'
          $mechZip=Join-Path $root 'mechanical.zip'
          $audioZip=Join-Path $root 'audio.zip'
          Grab $env:SRC_SHARE $env:SRC_FILE $srcZip
          Grab $env:MECH_SHARE $env:MECH_FILE $mechZip
          Grab $env:AUDIO_SHARE $env:AUDIO_FILE $audioZip

          if((Get-FileHash $srcZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:R28_SHA){throw 'R28 source SHA mismatch'}
          if((Get-FileHash $mechZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MECH_SHA){throw 'Mechanical patch SHA mismatch'}
          if((Get-FileHash $audioZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:AUDIO_SHA){throw 'Audio patch SHA mismatch'}

          tar.exe -xf $srcZip -C $work
          if($LASTEXITCODE -ne 0){throw 'source extract failed'}
          tar.exe -xf $mechZip -C $mech
          if($LASTEXITCODE -ne 0){throw 'mechanical extract failed'}
          tar.exe -xf $audioZip -C $audio
          if($LASTEXITCODE -ne 0){throw 'audio extract failed'}

          $vp=Get-Content (Join-Path $work 'version.properties') -Raw
          if($vp -notmatch 'VERSION_NAME=9\.0\.29' -or $vp -notmatch 'VERSION_CODE=90029'){throw 'Not exact R28 source'}

          Push-Location $work
          git apply --check --whitespace=nowarn (Join-Path $mech 'PATHFINDER2E_R28_MECHANICAL_AUDIT_PATCH.patch')
          if($LASTEXITCODE -ne 0){throw 'Mechanical patch check failed'}
          git apply --whitespace=nowarn (Join-Path $mech 'PATHFINDER2E_R28_MECHANICAL_AUDIT_PATCH.patch')
          if($LASTEXITCODE -ne 0){throw 'Mechanical patch apply failed'}
          Pop-Location

          Copy-Item (Join-Path $mech 'tests_pf2\test_mechanical_audit_r29.py') (Join-Path $work 'tests_pf2\test_mechanical_audit_r29.py') -Force

          python (Join-Path $audio 'patch.py') $work
          if($LASTEXITCODE -ne 0){throw 'Audio patch failed'}

          "WORK_ROOT=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AUDIO_ROOT=$audio" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Mechanical suite - exact rules gate
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -q pytest
          python -m pytest tests_pf2 -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R30_MECHANICAL_TESTS.log"
          if($LASTEXITCODE -ne 0){throw 'Mechanical suite failed'}
          $t=Get-Content "$env:RUNNER_TEMP\PF2_R30_MECHANICAL_TESTS.log" -Raw
          if($t -notmatch '201 passed'){throw "Expected 201 passed; got: $t"}

      - name: Android Kokoro source gates
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          python "$env:AUDIO_ROOT\test_audio.py" .
          if($LASTEXITCODE -ne 0){throw 'Audio source gates failed'}

      - name: Compile and test Kokoro chunker continuity
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $tmp=Join-Path $env:RUNNER_TEMP 'pf2-kokoro-java-test'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          $chunk='android\app\src\main\java\com\braseiro\pathfinder2e\NarrationChunker.java'
          $san='android\app\src\main\java\com\braseiro\pathfinder2e\PortugueseNarrationSanitizer.java'
          Copy-Item $chunk $tmp
          Copy-Item $san $tmp

          @'
          package com.braseiro.pathfinder2e;
          import java.util.*;
          public final class KokoroChunkTest {
            static void req(boolean v,String m){if(!v)throw new RuntimeException(m);}
            public static void main(String[] a){
              String shortText="A porta range. Há marcas no chão. Algo se move no corredor.";
              List<String> one=NarrationChunker.kokoro(shortText);
              req(one.size()==1,"short continuity must be one block: "+one.size());
              req(one.get(0).equals(shortText),"short text changed");

              String sentence="A porta range lentamente. Há marcas recentes no chão, e alguma coisa se move além do corredor enquanto a chama vacila junto à parede. ";
              StringBuilder b=new StringBuilder();
              for(int i=0;i<18;i++)b.append(sentence);
              String longText=b.toString().trim();
              List<String> parts=NarrationChunker.kokoro(longText);
              req(parts.size()>=3,"expected 3+ blocks");
              for(int i=0;i<parts.size()-1;i++){
                int n=parts.get(i).length();
                req(n>=250 && n<=650,"block out of range "+i+": "+n);
                req(!Character.isWhitespace(parts.get(i).charAt(0)),"leading whitespace");
              }
              String joined=String.join(" ",parts).replaceAll("\\s+"," ").trim();
              req(joined.equals(longText.replaceAll("\\s+"," ").trim()),"text content changed across chunks");
              System.out.println("KOKORO_CHUNK_TEST_OK blocks="+parts.size());
            }
          }
          '@ | ForEach-Object { [System.IO.File]::WriteAllText((Join-Path $tmp 'KokoroChunkTest.java'), $_, (New-Object System.Text.UTF8Encoding($false))) }

          New-Item -ItemType Directory -Path (Join-Path $tmp 'com\braseiro\pathfinder2e') -Force | Out-Null
          Move-Item (Join-Path $tmp 'NarrationChunker.java') (Join-Path $tmp 'com\braseiro\pathfinder2e\NarrationChunker.java')
          Move-Item (Join-Path $tmp 'PortugueseNarrationSanitizer.java') (Join-Path $tmp 'com\braseiro\pathfinder2e\PortugueseNarrationSanitizer.java')
          Move-Item (Join-Path $tmp 'KokoroChunkTest.java') (Join-Path $tmp 'com\braseiro\pathfinder2e\KokoroChunkTest.java')

          Push-Location $tmp
          javac -encoding UTF-8 com\braseiro\pathfinder2e\PortugueseNarrationSanitizer.java com\braseiro\pathfinder2e\NarrationChunker.java com\braseiro\pathfinder2e\KokoroChunkTest.java
          if($LASTEXITCODE -ne 0){throw 'Kokoro chunker javac failed'}
          java com.braseiro.pathfinder2e.KokoroChunkTest | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R30_KOKORO_CHUNK_TEST.log"
          if($LASTEXITCODE -ne 0){throw 'Kokoro chunker test failed'}
          Pop-Location

      - name: Set R30 release version
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $vp=Get-Content 'version.properties' -Raw
          $vp=$vp -replace 'VERSION_NAME=9\.0\.29','VERSION_NAME=9.0.31' -replace 'VERSION_CODE=90029','VERSION_CODE=90031'
          Set-Content 'version.properties' $vp -Encoding ascii

      - name: Configure Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME)
          if($env:LOCALAPPDATA){$candidates+=(Join-Path $env:LOCALAPPDATA 'Android\Sdk')}
          $candidates+='C:\Android\Sdk'
          $sdk=$null;$mgr=$null
          foreach($c in ($candidates|Where-Object {$_}|Select-Object -Unique)){
            if(Test-Path $c){
              $f=Get-ChildItem $c -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue|Select-Object -First 1
              if($f){$sdk=$c;$mgr=$f.FullName;break}
            }
          }
          if(-not $mgr){throw 'Android SDK not found'}
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          1..100|%{'y'}|& $mgr --licenses|Out-Null
          & $mgr 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          if($LASTEXITCODE -ne 0){throw 'sdkmanager failed'}

      - name: Gradle build and package R30
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R30_GRADLE.log"
          $gradleCode=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($gradleCode -ne 0){throw "Gradle build failed: $gradleCode"}

          $out=Join-Path $env:RUNNER_TEMP 'pf2-r30-out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $apk=Get-ChildItem . -Recurse -Filter '*.apk' -File | Where-Object {$_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]'} | Select-Object -First 1
          if(-not $apk){throw 'APK missing'}
          $apkOut=Join-Path $out 'Braseiro_Pathfinder2e_9.0.31_R30_ANDROID_KOKORO_DEBUG.apk'
          Copy-Item $apk.FullName $apkOut -Force
          (Get-FileHash $apkOut -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$apkOut.sha256" -Encoding ascii

          Copy-Item "$env:RUNNER_TEMP\PF2_R30_MECHANICAL_TESTS.log" (Join-Path $out 'MECHANICAL_TESTS.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R30_KOKORO_CHUNK_TEST.log" (Join-Path $out 'KOKORO_CHUNK_TEST.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R30_GRADLE.log" (Join-Path $out 'GRADLE_BUILD.log')

          $srcOut=Join-Path $out 'Braseiro_Pathfinder2e_9.0.31_R30_ANDROID_KOKORO_ANDROID_STUDIO.zip'
          tar.exe -a -cf $srcOut *
          if($LASTEXITCODE -ne 0){throw 'source zip failed'}
          (Get-FileHash $srcOut -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$srcOut.sha256" -Encoding ascii
          "OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish R30 release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='PATHFINDER2E-9.0.31-R30'
          $headers=@{
            'Authorization'="Bearer $env:GITHUB_TOKEN"
            'Accept'='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='BRELGA-PF2-R30'
          }

          try {
            $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
          } catch {
            $body=@{
              tag_name=$tag
              target_commitish='main'
              name='Braseiro Pathfinder 2e 9.0.31 R30'
              body='R30 Android/Kokoro sobre a R29 mecânica. Descoberta dinâmica de engines e vozes reais expostas pelo Android; Google/Samsung preservados; Sherpa/Kokoro com blocos 250-650 alvo 450, fronteiras naturais, primeiro bloco limpa sessão e blocos seguintes usam QUEUE_ADD, avanço somente por onDone, sem watchdog neural, velocidade neural própria 1.0x neutra e parâmetros maxNumSentences=2, silenceScale=0.06 e numThreads=4. O VTT não fabrica nomes/speakerId e mantém a instância TextToSpeech viva. Mantém as correções mecânicas da R29 e passa a suíte PF2.'
              draft=$false
              prerelease=$false
            } | ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$repo/releases"
          }

          foreach($file in Get-ChildItem $env:OUT_DIR -File){
            $existing=$release.assets | Where-Object {$_.name -eq $file.Name} | Select-Object -First 1
            if($existing){
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" | Out-Null
            }
            $encoded=[uri]::EscapeDataString($file.Name)
            $upload="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encoded"
            & curl.exe -L --fail --retry 5 --retry-delay 2 --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$($file.FullName)" $upload
            if($LASTEXITCODE -ne 0){throw "release upload failed for $($file.Name)"}
          }
          Write-Host "RELEASE_URL=$($release.html_url)"
