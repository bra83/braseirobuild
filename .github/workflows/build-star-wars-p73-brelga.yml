name: Build Star Wars R54 P73 APK on BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-star-wars-p73-brelga.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    steps:
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          $candidates = @('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $candidates += 'C:\Android\Sdk'
          $sdk = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ($candidate -and (Test-Path $candidate) -and (Test-Path (Join-Path $candidate 'platform-tools'))) {
              $sdk = $candidate
              break
            }
          }
          if (-not $sdk) { throw 'Android SDK not found on BRELGA' }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ANDROID_SDK_ROOT=$sdk"

      - name: Download exact P73
        id: src
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.firestorage.ai/dev/file/shares/PkmlkTV9YN6t'
          $work = Join-Path $env:RUNNER_TEMP 'sw-p73-transfer'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null

          $meta = Invoke-RestMethod -Method Get -Uri ($api + '/files?maxResults=100')
          if (-not $meta.files -or $meta.files.Count -ne 1) {
            throw "Expected 1 transfer file, got $($meta.files.Count)"
          }
          $file = $meta.files[0]
          if ($file.fileName -ne 'BRASEIRO_STAR_WARS_EDGE_R54_P73_SOURCE_CHECKPOINT.zip') {
            throw "Unexpected transfer file $($file.fileName)"
          }
          $ticket = Invoke-RestMethod -Method Post -Uri ($api + '/files/' + $file.fileId + '/download')
          if (-not $ticket.downloadUrl) { throw 'No download URL for P73' }

          $zip = Join-Path $work 'BRASEIRO_STAR_WARS_EDGE_R54_P73_SOURCE_CHECKPOINT.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $zip $ticket.downloadUrl
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $LASTEXITCODE" }

          $bytes = (Get-Item $zip).Length
          if ($bytes -ne 78949002) { throw "P73 byte count mismatch: $bytes" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '462e6a54efbc6b5e8528ceb74991504f43398a8d0590389502ae78c3128a4677') {
            throw "P73 SHA mismatch: $hash"
          }
          Write-Host "P73_BYTES=$bytes"
          Write-Host "P73_SHA256=$hash"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract and detect Android Studio project
        id: project
        shell: powershell
        env:
          SOURCE_ZIP: ${{ steps.src.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'sw-p73-project'
          Remove-Item $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          & tar.exe -xf $env:SOURCE_ZIP -C $extractRoot
          if ($LASTEXITCODE -ne 0) { throw 'P73 extraction failed' }

          $settings = Get-ChildItem $extractRoot -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -in @('settings.gradle', 'settings.gradle.kts') -and
              $_.FullName -notmatch '[\\/](build|[.]gradle)[\\/]' -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradlew.bat')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradle\wrapper\gradle-wrapper.jar')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'app\src\main\AndroidManifest.xml'))
            } |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $settings) { throw 'Complete Android Studio project not found in P73' }
          $root = $settings.Directory.FullName
          Write-Host "ANDROID_ROOT=$root"
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build debug APK
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          & .\gradlew.bat --version --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Gradle wrapper failed: $LASTEXITCODE" }
          & .\gradlew.bat clean assembleDebug --stacktrace --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "assembleDebug failed: $LASTEXITCODE" }

      - name: Validate and stage APK
        id: apk
        shell: powershell
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Get-ChildItem $env:ROOT -Recurse -File -Filter '*.apk' |
            Where-Object { $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]' } |
            Sort-Object FullName | Select-Object -First 1
          if (-not $apk) { throw 'Debug APK not found' }

          $outDir = Join-Path $env:RUNNER_TEMP 'sw-p73-apk-out'
          Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $dest = Join-Path $outDir 'BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk'
          Copy-Item $apk.FullName $dest -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipTest = [IO.Compression.ZipFile]::OpenRead($dest)
          $zipTest.Dispose()

          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk" |
            Set-Content -Path (Join-Path $outDir 'BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk.sha256') -Encoding ascii

          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $buildTools) { throw 'Android build-tools not found' }
          $aapt = Join-Path $buildTools.FullName 'aapt.exe'
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          if (-not (Test-Path $aapt)) { throw 'aapt.exe not found' }

          & $aapt dump badging $dest 2>&1 | Tee-Object -FilePath (Join-Path $outDir 'APK_BADGING.txt')
          if ($LASTEXITCODE -ne 0) { throw 'aapt validation failed' }
          $badging = Get-Content (Join-Path $outDir 'APK_BADGING.txt') -Raw
          if ($badging -notmatch "package: name='com[.]braseiro[.]starwarsedge'") { throw 'Wrong applicationId in APK' }

          if (Test-Path $apksigner) {
            & $apksigner verify --verbose --print-certs $dest 2>&1 |
              Tee-Object -FilePath (Join-Path $outDir 'APK_SIGNATURE.txt')
            if ($LASTEXITCODE -ne 0) { throw 'APK signature validation failed' }
          }

          Write-Host "APK_BYTES=$((Get-Item $dest).Length)"
          Write-Host "APK_SHA256=$hash"
          "dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish APK release asset via GitHub API
        id: publish
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'bra83/braseirobuild'
          $tag = 'star-wars-r54-p73-apk'
          $apk = Join-Path $env:APK_DIR 'BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk'
          $shaFile = Join-Path $env:APK_DIR 'BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk.sha256'
          if (-not (Test-Path $apk)) { throw 'Validated APK missing before release upload' }
          if (-not (Test-Path $shaFile)) { throw 'SHA file missing before release upload' }
          $actual = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "P73_APK_SHA256=$actual"

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'BRELGA-Star-Wars-P73'
          }

          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }

          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = 'main'
              name = 'Braseiro Star Wars R54 P73 APK'
              body = 'APK debug compilado no BRELGA a partir do checkpoint P73 verificado por SHA-256.'
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
            $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $payloadBytes -Uri "https://api.github.com/repos/$repo/releases"
          }
          if (-not $release.id) { throw 'Release create/read failed' }

          $assets = Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach ($name in @('BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk','BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk.sha256')) {
            $existing = $assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($existing) {
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" | Out-Null
            }
          }

          $uploadBase = ($release.upload_url -replace '\{.*$','')
          $apkName = [uri]::EscapeDataString('BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk')
          $shaName = [uri]::EscapeDataString('BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk.sha256')

          $apkAsset = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/vnd.android.package-archive' -InFile $apk -Uri ($uploadBase + '?name=' + $apkName)
          if (-not $apkAsset.id) { throw 'APK release upload failed' }
          $shaAsset = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'text/plain' -InFile $shaFile -Uri ($uploadBase + '?name=' + $shaName)
          if (-not $shaAsset.id) { throw 'SHA release upload failed' }

          Write-Host "RELEASE_URL=$($release.html_url)"
          Write-Host "APK_ASSET_URL=$($apkAsset.browser_download_url)"
          Write-Host "APK_ASSET_ID=$($apkAsset.id)"
          "release_url=$($release.html_url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_id=$($apkAsset.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload verified APK as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG
          path: ${{ steps.apk.outputs.dir }}/BRASEIRO_STAR_WARS_EDGE_R54_P73_DEBUG.apk
          if-no-files-found: error
          retention-days: 7
