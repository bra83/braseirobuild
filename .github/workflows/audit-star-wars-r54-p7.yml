name: Audit Star Wars R54 P7 Semantic Corrections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'star-wars/r54/fix_device_p7.py'
      - 'star-wars/r54/audit_device_p7.py'
      - '.github/workflows/audit-star-wars-r54-p7.yml'
permissions: {contents: write}
concurrency: {group: star-wars-r54-p7, cancel-in-progress: true}
jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install real-map crop dependency
        run: python3 -m pip install --quiet Pillow
      - name: Apply P7 over persisted P6
        id: root
        shell: bash
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P6.zip
          test -f "$ZIP"
          rm -rf /tmp/r54-p7 && mkdir -p /tmp/r54-p7
          unzip -q "$ZIP" -d /tmp/r54-p7
          SET=$(find /tmp/r54-p7 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -1)
          test -n "$SET"; ROOT=$(dirname "$SET"); echo "path=$ROOT" >> "$GITHUB_OUTPUT"
          python3 star-wars/r54/fix_device_p7.py "$ROOT" | tee /tmp/P7_PATCH.txt
          python3 star-wars/r54/audit_device_p7.py "$ROOT" | tee /tmp/P7_AUDIT.txt
      - name: Persist semantic reports without claiming device PASS
        env: {ROOT: '${{ steps.root.outputs.path }}'}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main && git reset --hard origin/main
          mkdir -p star-wars/r54/audit ci-results
          cp "$ROOT/app/src/main/assets/vtt/image-library/local/r54/ITEM_VISUAL_BINDING_AUDIT.json" star-wars/r54/audit/ITEM_VISUAL_BINDING_AUDIT.json
          cp "$ROOT/app/src/main/assets/vtt/image-library/local/r54/LOCATION_MAP_AUDIT.json" star-wars/r54/audit/LOCATION_MAP_AUDIT.json
          cp /tmp/P7_PATCH.txt star-wars/r54/audit/DEVICE_P7_PATCH_2026-09-18.txt
          cp /tmp/P7_AUDIT.txt star-wars/r54/audit/DEVICE_P7_SEMANTIC_2026-09-18.json
          printf 'R54_P7_STATUS=CODE_PASS_DEVICE_PENDING\nPHYSICAL_DEVICE=NOT_RUN\nARTIFACTS=NOT_PUBLISHED_UNTIL_DEVICE_EVIDENCE\n' > ci-results/STAR_WARS_R54_P7_STATUS.txt
          git add star-wars/r54/audit ci-results/STAR_WARS_R54_P7_STATUS.txt
          git commit -m 'audit(star-wars): persist R54 P7 semantic results' || exit 0
          git push origin HEAD:main
      - name: Persist failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main && git reset --hard origin/main
          mkdir -p ci-results star-wars/r54/audit
          printf 'R54_P7_STATUS=FAIL\nPHYSICAL_DEVICE=NOT_RUN\n' > ci-results/STAR_WARS_R54_P7_STATUS.txt
          cp /tmp/P7_PATCH.txt star-wars/r54/audit/DEVICE_P7_PATCH_FAILED_2026-09-18.txt 2>/dev/null || true
          cp /tmp/P7_AUDIT.txt star-wars/r54/audit/DEVICE_P7_SEMANTIC_FAILED_2026-09-18.txt 2>/dev/null || true
          git add ci-results/STAR_WARS_R54_P7_STATUS.txt star-wars/r54/audit
          git commit -m 'ci(star-wars): persist R54 P7 failure diagnostics' || exit 0
          git push origin HEAD:main
