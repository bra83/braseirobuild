name: Kingmaker R36 - JSON V2.2 real source APK on BRELGA
on:
  push:
    branches: [integration/kingmaker-voice-life-20261021]
    paths:
      - '.github/workflows/vida-v22-import-json-kingmaker-brelga.yml'
      - 'ci/pf2-r36-importer-v22/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kingmaker-r36-canonical-import-v22-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-corrected-source:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify runner and canonical patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'BRELGA_REQUIRED'}
          $patch='ci/pf2-r36-importer-v22/KINGMAKER_R36_CORRECOES_JSON_V22_20261023.patch'
          if(!(Test-Path $patch)){throw 'KINGMAKER_PATCH_MISSING'}
          $got=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if($got -ne '347e9bd975277bdf31752d3d2053ba4a471335d592c0aa7b99e929ac39c988c6'){throw 'KINGMAKER_PATCH_SHA256_MISMATCH '+$got}
      - name: Download full R36 Android Studio source from canonical Drive file
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('km-r36-v22-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force $dir | Out-Null
          $archive=Join-Path $dir 'KINGMAKER_R36_CANONICAL_SOURCE.zip'
          & python -m pip install --disable-pip-version-check --quiet gdown
          if($LASTEXITCODE -ne 0){throw 'GDOWN_INSTALL_FAILED'}
          & curl.exe --fail --location --retry 3 --retry-delay 2 --silent --show-error --output $archive 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-f924-820e-bb01-30475d1c799a/raw?se=2026-10-23T09%3A06%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=e0c3bc65-0574-5097-abea-b89280b84efd&skoid=4a431cd2-eafd-49c7-90be-bbb4d45e696d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-23T06%3A05%3A40Z&ske=2026-10-24T06%3A05%3A40Z&sks=b&skv=2026-02-06&sig=rNeBULYbZqh%2BLIyV/ajAuDfyhF9%2B0TyofMGUQBIhxvY%3D'
          if($LASTEXITCODE -ne 0 -or !(Test-Path $archive)){throw 'CANONICAL_SOURCE_DOWNLOAD_BLOCKED_PERMISSION_OR_QUOTA'}
          $size=(Get-Item $archive).Length
          $sha=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SOURCE_BYTES=$size SOURCE_SHA256=$sha"
          if($size -ne 110266871 -or $sha -ne '8dc976ed79578fc35e3004e9532240f0ff0a475f41d50df43c20a9eecf78b7f1'){throw 'SOURCE_PIN_MISMATCH'}
          $root=Join-Path $dir 'source'
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          if(!(Test-Path (Join-Path $root 'app/src/main/java/com/braseiro/pathfinder2e/MainActivity.java'))){throw 'ZIP_MISSING_REAL_MAIN_ACTIVITY'}
          if(!(Test-Path (Join-Path $root 'gradlew.bat'))){throw 'GRADLE_WRAPPER_MISSING'}
          "KINGMAKER_SOURCE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Apply and assert corrected adventure importer source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $patch=Join-Path $env:GITHUB_WORKSPACE 'ci/pf2-r36-importer-v22/KINGMAKER_R36_CORRECOES_JSON_V22_20261023.patch'
          Set-Location $env:KINGMAKER_SOURCE_ROOT
          & git apply --check --ignore-space-change --ignore-whitespace $patch
          if($LASTEXITCODE -ne 0){throw 'PINNED_R36_SOURCE_PATCH_CONFLICT'}
          & git apply --ignore-space-change --ignore-whitespace $patch
          if($LASTEXITCODE -ne 0){throw 'PATCH_APPLY_FAILED'}
          $store='app/src/main/java/com/braseiro/pathfinder2e/BraseiroAdventureStore.java'
          $main='app/src/main/java/com/braseiro/pathfinder2e/MainActivity.java'
          if(!(Test-Path $store) -or !(Select-String -Path $store -Pattern 'validatePackage' -Quiet)){throw 'SCHEMA_VALIDATOR_MISSING'}
          if(!(Select-String -Path $main -Pattern 'CONFIRMAR AVENTURA JSON' -Quiet)){throw 'IMPORT_CONFIRMATION_MISSING'}
          if(!(Select-String -Path $main -Pattern 'masterContext' -Quiet)){throw 'MASTER_CONTEXT_MISSING'}
          'VERSION_NAME=9.0.38-R36-VIDA-V22' | Set-Content 'version.properties' -Encoding ascii
          'VERSION_CODE=90038' | Add-Content 'version.properties' -Encoding ascii
          Write-Host 'KINGMAKER_R36_REAL_ANDROID_SOURCE_PATCHED_AND_VALIDATED'
      - name: Bind existing BRELGA Android SDK 35 without broken Windows setup action
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@('C:\actions-runner\android-sdk','C:\Android\Sdk',$env:ANDROID_HOME,$env:ANDROID_SDK_ROOT)
          if($env:LOCALAPPDATA){$candidates+=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          $sdk=$candidates | Where-Object {$_ -and (Test-Path (Join-Path $_ 'platforms'))} | Select-Object -First 1
          if(-not $sdk){throw 'BRELGA_ANDROID_SDK_MISSING'}
          $sdk=(Resolve-Path $sdk).Path
          if(!(Test-Path (Join-Path $sdk 'platforms/android-35')) -or !(Test-Path (Join-Path $sdk 'build-tools/35.0.0'))){
            $manager=Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Filter sdkmanager.bat -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if(-not $manager){throw 'SDK_35_MISSING_AND_SDKMANAGER_NOT_INSTALLED'}
            & $manager.FullName --sdk_root=$sdk 'platforms;android-35' 'build-tools;35.0.0'
            if($LASTEXITCODE -ne 0){throw 'INSTALL_SDK_35_FAILED'}
          }
          "ANDROID_HOME=$sdk"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BRELGA_EXISTING_SDK_35_PASS"
      - name: Compile full Android APK, not inspection stub
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sdk=if($env:ANDROID_HOME){$env:ANDROID_HOME}else{$env:ANDROID_SDK_ROOT}
          if(-not $sdk -or !(Test-Path (Join-Path $sdk 'platforms/android-35'))){throw 'ANDROID_SDK_35_NOT_INSTALLED'}
          Set-Location $env:KINGMAKER_SOURCE_ROOT
          ('sdk.dir='+$sdk.Replace('\','/'))|Set-Content local.properties -Encoding ascii
          & .\gradlew.bat :app:compileDebugJavaWithJavac :app:assembleDebug --no-daemon --stacktrace --console=plain
          if($LASTEXITCODE -ne 0){throw 'KINGMAKER_R36_REAL_APK_BUILD_FAILED'}
          $apk=Get-ChildItem 'app/build/outputs/apk/debug' -Filter '*.apk' | Select-Object -First 1
          if(-not $apk -or $apk.Length -lt 100000000){throw 'APK_MISSING_OR_TOO_SMALL'}
          $dest=Join-Path $env:RUNNER_TEMP 'BRASEIRO_KINGMAKER_R36_JSON_V22_CORRIGIDO_CANDIDATO.apk'
          Copy-Item $apk.FullName $dest
          $bt=Join-Path $sdk 'build-tools/35.0.0'
          & (Join-Path $bt 'apksigner.bat') verify --verbose --print-certs $dest
          if($LASTEXITCODE -ne 0){throw 'APK_SIGNATURE_INVALID'}
          $sha=(Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "KINGMAKER_APK_SOURCE_SHA=$env:GITHUB_SHA"
          Write-Host "KINGMAKER_APK_SHA256=$sha"
          "KINGMAKER_APK_PATH=$dest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish new candidate release preserving prior builds
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='kingmaker-r36-json-v22-'+$env:GITHUB_SHA.Substring(0,12)
          $ErrorActionPreference='Stop'
          $assetName='BRASEIRO_KINGMAKER_R36_JSON_V22_CORRIGIDO_CANDIDATO.apk'
          $path=$env:KINGMAKER_APK_PATH
          if(!(Test-Path $path)){throw 'APK_NOT_FOUND_FOR_PUBLICATION'}
          $apk=Get-Item $path
          $sha=(Get-FileHash $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $headers=@{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Braseiro-Kingmaker-R36'}
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $notes="Source $env:GITHUB_SHA; canonical ZIP SHA256 8dc976ed79578fc35e3004e9532240f0ff0a475f41d50df43c20a9eecf78b7f1; APK SHA256 $sha; compileDebugJavaWithJavac/assembleDebug PASS; APK certificate verify PASS. Candidate only: in-place installation and A57 physical acceptance not certified."
          $body=@{tag_name=$tag;target_commitish=$env:GITHUB_SHA;name='Kingmaker R36 JSON Vida V2.2 corrigido - candidato Android';body=$notes;draft=$false;prerelease=$true}|ConvertTo-Json -Depth 5
          $release=Invoke-RestMethod -Uri $api -Method Post -Headers $headers -ContentType 'application/json' -Body ([Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 90
          if(!$release.id -or !$release.upload_url){throw 'GITHUB_RELEASE_CREATE_FAILED'}
          $upUri=$release.upload_url.Split('{')[0]+'?name='+$assetName
          $up=Invoke-RestMethod -Uri $upUri -Method Post -Headers $headers -InFile $apk.FullName -ContentType 'application/vnd.android.package-archive' -TimeoutSec 1200
          if(!$up.id -or $up.size -ne $apk.Length){throw 'GITHUB_ASSET_SIZE_OR_UPLOAD_MISMATCH'}
          Write-Host "KINGMAKER_CORRECTED_RELEASE=$($release.html_url)"
          Write-Host "KINGMAKER_APK_ASSET=$($up.browser_download_url)"
          Write-Host "KINGMAKER_APK_SHA256=$sha"
