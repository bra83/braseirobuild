name: OUA 4.9.195 Homologated APK — BRELGA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-oua-4.9.195-brelga.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oua-4.9.195-brelga
  cancel-in-progress: true

env:
  BASE_TAG: "OUA-v4.9.29"
  BASE_APK: "BRASEIRO_O_UM_ANEL_4.9.29_UPDATE.apk"
  BASE_SOURCE: "OUA_4.9.29_UPGRADE_SAFE_ANDROID_STUDIO.zip"
  TAG: "OUA-v4.9.195"
  APK_NAME: "BRASEIRO_O_UM_ANEL_4.9.195_UPDATE.apk"
  OVERLAY_OUTER_NAME: "OUA_4.9.195_OVERLAY_OUTER.zip"
  OVERLAY_INNER_NAME: "OUA_4.9.195_CODE_OVERLAY.zip"
  OVERLAY_URL: "https://eu-central.storage.cloudconvert.com/tasks/1c4b00a8-bae2-49b6-a1de-ea0c217c6c3c/OUA_4.9.195_CODE_OVERLAY.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260930%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260930T042003Z&X-Amz-Expires=86400&X-Amz-Signature=326945ca24f0c16fd9597456b953fd4025c4c56aa9e6b1aae04785e5441bc6a9&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22OUA_4.9.195_CODE_OVERLAY.zip%22&response-content-type=application%2Fzip&x-amz-checksum-mode=ENABLED&x-id=GetObject"

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare 4.9.195 source on BRELGA
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){ throw "Expected BRELGA; got $env:RUNNER_NAME" }

          $work=Join-Path $env:RUNNER_TEMP 'oua-49195-brelga'
          $incoming=Join-Path $work 'incoming'
          $extract=Join-Path $work 'extract'
          $overlay=Join-Path $work 'overlay'
          $out=Join-Path $work 'out'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $incoming,$extract,$overlay,$out -Force | Out-Null

          $headers=@{
            'Authorization'="Bearer $env:GITHUB_TOKEN"
            'Accept'='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='oua-49195-brelga'
          }

          $repo=$env:GITHUB_REPOSITORY
          $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:BASE_TAG"

          foreach($name in @($env:BASE_APK,$env:BASE_SOURCE)){
            $asset=@($release.assets|Where-Object{$_.name -eq $name -and $_.state -eq 'uploaded'})|Select-Object -First 1
            if(-not $asset){ throw "Missing baseline asset: $name" }
            $dest=Join-Path $incoming $name
            & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" -o $dest $asset.url
            if($LASTEXITCODE -ne 0 -or -not (Test-Path $dest)){ throw "Baseline download failed: $name" }
          }

          & tar.exe -xf (Join-Path $incoming $env:BASE_SOURCE) -C $extract
          if($LASTEXITCODE -ne 0){ throw 'Could not extract baseline source' }

          $pkg=Get-ChildItem $extract -Recurse -File -Filter package.json |
            Where-Object{Test-Path (Join-Path $_.Directory.FullName 'android')} |
            Sort-Object{$_.FullName.Length} |
            Select-Object -First 1
          if(-not $pkg){ throw 'Android Studio root not found in baseline' }
          $root=$pkg.Directory.FullName

          $outer=Join-Path $incoming $env:OVERLAY_OUTER_NAME
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $outer "$env:OVERLAY_URL"
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $outer)){ throw 'Could not download 4.9.195 overlay package' }

          & tar.exe -xf $outer -C $overlay
          if($LASTEXITCODE -ne 0){ throw 'Could not extract outer overlay archive' }

          $inner=Get-ChildItem $overlay -Recurse -File -Filter $env:OVERLAY_INNER_NAME | Select-Object -First 1
          if(-not $inner){ throw "Inner overlay not found: $env:OVERLAY_INNER_NAME" }

          $overlayFiles=Join-Path $overlay 'files'
          New-Item -ItemType Directory -Path $overlayFiles -Force | Out-Null
          & tar.exe -xf $inner.FullName -C $overlayFiles
          if($LASTEXITCODE -ne 0){ throw 'Could not extract inner 4.9.195 overlay' }

          $overlayRoot=$overlayFiles
          $overlayPkg=Get-ChildItem $overlayFiles -Recurse -File -Filter package.json | Sort-Object{$_.FullName.Length} | Select-Object -First 1
          if($overlayPkg){ $overlayRoot=$overlayPkg.Directory.FullName }

          Write-Host "BASE_ROOT=$root"
          Write-Host "OVERLAY_ROOT=$overlayRoot"

          & robocopy.exe $overlayRoot $root /E /NFL /NDL /NJH /NJS /NP
          $robo=$LASTEXITCODE
          if($robo -gt 7){ throw "Overlay merge failed with robocopy exit code $robo" }
          $global:LASTEXITCODE=0

          $pkgJson=Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if($pkgJson.version -ne '4.9.195'){ throw "package.json version mismatch: $($pkgJson.version)" }

          $gradle=Get-Content (Join-Path $root 'android\app\build.gradle.kts') -Raw
          if($gradle -notmatch 'versionName\s*=\s*"4\.9\.195"'){ throw 'Android versionName is not 4.9.195' }
          if($gradle -notmatch 'versionCode\s*=\s*49195'){ throw 'Android versionCode is not 49195' }

          $db=Get-Content (Join-Path $root 'lib\db.ts') -Raw
          if($db -notmatch "const DB_NAME\s*=\s*'braseiro-db'"){ throw 'DB_NAME changed unexpectedly' }
          if($db -notmatch 'const DB_VERSION\s*=\s*19'){ throw 'DB_VERSION changed unexpectedly' }

          $whole=(Get-ChildItem $root -Recurse -File -Include *.ts,*.tsx,*.kt,*.java | ForEach-Object{Get-Content $_.FullName -Raw}) -join "`n"
          if($whole.Contains('indexedDB.deleteDatabase')){ throw 'Forbidden indexedDB.deleteDatabase found' }
          if($whole.Contains('clearApplicationUserData')){ throw 'Forbidden clearApplicationUserData found' }
          if($whole.Contains('pm clear')){ throw 'Forbidden pm clear found' }

          "OUA_ROOT=$root"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OUA_OUT=$out"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BASE_APK_PATH=$(Join-Path $incoming $env:BASE_APK)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run homologation gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:OUA_ROOT
          try {
            & npm.cmd run validate:final:4.9.195
            if($LASTEXITCODE -ne 0){ throw 'validate:final:4.9.195 failed' }
          } finally { Pop-Location }

      - name: Build web runtime and sync Android assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:OUA_ROOT
          try {
            $lock=Join-Path $env:OUA_ROOT 'package-lock.json'
            if(Test-Path $lock){
              $t=Get-Content $lock -Raw
              $t=[regex]::Replace($t,'https://[^"]*/artifactory/api/npm/npm-public/','https://registry.npmjs.org/')
              [IO.File]::WriteAllText($lock,$t,(New-Object Text.UTF8Encoding($false)))
            }

            $env:npm_config_registry='https://registry.npmjs.org/'
            $npmOk=$false
            for($attempt=1;$attempt -le 3;$attempt++){
              & npm.cmd ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
              if($LASTEXITCODE -eq 0){ $npmOk=$true; break }
              Start-Sleep -Seconds (3*$attempt)
            }
            if(-not $npmOk){ throw 'npm ci failed after 3 attempts' }

            & npm.cmd run lint
            if($LASTEXITCODE -ne 0){ throw 'lint/typecheck failed' }

            & npm.cmd run build:offline
            if($LASTEXITCODE -ne 0){ throw 'build:offline failed' }

            & node.exe scripts/use-offline-dist.mjs
            if($LASTEXITCODE -ne 0){ throw 'use-offline-dist failed' }

            & node.exe scripts/sync-android-assets.mjs
            if($LASTEXITCODE -ne 0){ throw 'sync-android-assets failed' }
          } finally { Pop-Location }

      - name: Configure Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@('C:\actions-runner\android-sdk')
          if($env:ANDROID_SDK_ROOT){$candidates+=$env:ANDROID_SDK_ROOT}
          if($env:ANDROID_HOME){$candidates+=$env:ANDROID_HOME}
          if($env:LOCALAPPDATA){$candidates+=(Join-Path $env:LOCALAPPDATA 'Android\Sdk')}
          $sdk=$candidates|Where-Object{$_ -and (Test-Path $_)}|Select-Object -First 1
          if(-not $sdk){throw 'Android SDK not found on BRELGA'}
          "ANDROID_HOME=$sdk"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build APK and verify update compatibility
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $android=Join-Path $env:OUA_ROOT 'android'
          $gradleLog=Join-Path $env:OUA_OUT 'GRADLE_BUILD.log'

          Push-Location $android
          try {
            $previous=$ErrorActionPreference
            $ErrorActionPreference='Continue'
            if(Test-Path variable:PSNativeCommandUseErrorActionPreference){$PSNativeCommandUseErrorActionPreference=$false}
            & .\gradlew.bat clean :app:assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath $gradleLog
            $exit=$LASTEXITCODE
            $ErrorActionPreference=$previous
            if($exit -ne 0){throw "Gradle failed: $exit"}
          } finally {Pop-Location}

          $apk=Get-ChildItem (Join-Path $android 'app\build\outputs\apk\debug') -File -Filter '*.apk'|Select-Object -First 1
          if(-not $apk){throw 'APK not found'}
          $newApk=Join-Path $env:OUA_OUT $env:APK_NAME
          Copy-Item $apk.FullName $newApk -Force

          $buildTools=Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory |
            Sort-Object{[version]($_.Name -replace '[^0-9.]','')} -Descending |
            Select-Object -First 1
          if(-not $buildTools){throw 'Android build-tools not found'}
          $aapt=Join-Path $buildTools.FullName 'aapt.exe'
          $apksigner=Join-Path $buildTools.FullName 'apksigner.bat'

          & $aapt dump badging $newApk | Set-Content (Join-Path $env:OUA_OUT 'NEW_BADGING.txt')
          $badging=Get-Content (Join-Path $env:OUA_OUT 'NEW_BADGING.txt') -Raw
          if($badging -notmatch "package: name='com\.braseiro\.oumanel'"){throw 'Package mismatch'}
          if($badging -notmatch "versionCode='49195'"){throw 'versionCode mismatch'}
          if($badging -notmatch "versionName='4\.9\.195'"){throw 'versionName mismatch'}

          & $apksigner verify --verbose --print-certs $env:BASE_APK_PATH 2>&1 | Set-Content (Join-Path $env:OUA_OUT 'BASE_SIG.txt')
          if($LASTEXITCODE -ne 0){throw 'Base APK signature invalid'}
          & $apksigner verify --verbose --print-certs $newApk 2>&1 | Set-Content (Join-Path $env:OUA_OUT 'NEW_SIG.txt')
          if($LASTEXITCODE -ne 0){throw 'New APK signature invalid'}

          $baseDigest=((Get-Content (Join-Path $env:OUA_OUT 'BASE_SIG.txt')|Where-Object{$_ -match 'certificate SHA-256 digest:'}|Select-Object -First 1)-replace '.*digest:\s*','').Trim().ToLowerInvariant()
          $newDigest=((Get-Content (Join-Path $env:OUA_OUT 'NEW_SIG.txt')|Where-Object{$_ -match 'certificate SHA-256 digest:'}|Select-Object -First 1)-replace '.*digest:\s*','').Trim().ToLowerInvariant()
          if(-not $baseDigest -or $baseDigest -ne $newDigest){throw "Signing certificate mismatch. base=$baseDigest new=$newDigest"}

          $hash=(Get-FileHash $newApk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME"|Set-Content "$newApk.sha256" -Encoding ascii

          @(
            'PASS - package com.braseiro.oumanel',
            'PASS - versionName 4.9.195',
            'PASS - versionCode 49195',
            'PASS - signing certificate unchanged',
            'PASS - braseiro-db preserved',
            'PASS - DB_VERSION 19 preserved',
            'RESULT - APK eligible for install-over update.'
          ) | Set-Content (Join-Path $env:OUA_OUT 'INSTALL_OVER_EXISTING_APP.txt') -Encoding utf8

      - name: Publish 4.9.195 release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $headers=@{
            'Authorization'="Bearer $env:GITHUB_TOKEN"
            'Accept'='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='oua-49195-publisher'
          }

          $encodedTag=[uri]::EscapeDataString($env:TAG)
          $existing=$null
          try{$existing=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$encodedTag"}catch{}

          if($existing){
            $release=$existing
          }else{
            $body=@{
              tag_name=$env:TAG
              target_commitish=$env:GITHUB_SHA
              name='Braseiro O Um Anel 4.9.195 — Homologated'
              body='Build homologada 4.9.195 gerada no runner self-hosted BRELGA. Mecânicas auditadas; APK install-over verificado contra a assinatura da 4.9.29.'
              draft=$false
              prerelease=$false
            }|ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$repo/releases"
          }

          foreach($name in @($env:APK_NAME,"$env:APK_NAME.sha256",'NEW_BADGING.txt','INSTALL_OVER_EXISTING_APP.txt','GRADLE_BUILD.log')){
            $file=Join-Path $env:OUA_OUT $name
            if(-not (Test-Path $file)){continue}
            $old=@($release.assets|Where-Object{$_.name -eq $name})|Select-Object -First 1
            if($old){Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($old.id)"|Out-Null}
            $url="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
            & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors --request POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/octet-stream" --data-binary "@$file" $url
            if($LASTEXITCODE -ne 0){throw "Upload failed: $name"}
          }

          Write-Host "APK_URL=https://github.com/$repo/releases/download/$env:TAG/$env:APK_NAME"


      - name: Publish CI result
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $status='${{ job.status }}'
          $path="$env:GITHUB_WORKSPACE\ci-results\OUA_49195_BUILD_RESULT.md"
          @(
            '# OUA 4.9.195 — BRELGA build result',
            '',
            "- status: **$status**",
            "- workflow: $env:GITHUB_WORKFLOW",
            "- run: $env:GITHUB_RUN_ID",
            "- commit: $env:GITHUB_SHA",
            "- runner: $env:RUNNER_NAME",
            "- apk: $env:APK_NAME",
            "- release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"
          )|Set-Content $path -Encoding utf8
          git config user.name "braseiro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci-results/OUA_49195_BUILD_RESULT.md
          if((git status --porcelain).Length -gt 0){
            git commit -m "OUA 4.9.195 publish BRELGA build result [skip ci]"
            git push origin HEAD:main
          }
