name: Audit Star Wars R38 scene runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-star-wars-r38-scene-runtime.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: src
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'));print('url='+d['source_share_url']);print('sha='+d['sha256']);print('file='+d['file'])
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prepare exact Block01 state
        env:
          U: ${{ steps.src.outputs.url }}
          F: ${{ steps.src.outputs.file }}
          S: ${{ steps.src.outputs.sha }}
          SU: https://firestorage.ai/ja/f/PbM3XvdzNMAk
          SF: scene-assets-v1-tiny.tar.gz
          SS: 2ca16b2cd0d3f489fe10f1df718be1243febeef38fb88a52bd50502528f60711
        run: |
          set -euo pipefail;rm -rf incoming work;mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          def dl(u,n,o):
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);q=b.new_page(accept_downloads=True);q.goto(u,wait_until='domcontentloaded',timeout=120000);q.wait_for_timeout(3000);done=False
              for s in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
                try:
                  x=q.locator(s).first
                  if not x.count() or not x.is_visible():continue
                  with q.expect_download(timeout=120000) as i:x.click(timeout=10000)
                  i.value.save_as(str(o));done=True;break
                except:pass
              if not done:
                x=q.get_by_text(n,exact=False).first
                with q.expect_download(timeout=120000) as i:x.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
                i.value.save_as(str(o));done=True
              b.close()
            if not done:raise SystemExit('download failed')
          dl(os.environ['U'],os.environ['F'],pathlib.Path('incoming')/os.environ['F']);dl(os.environ['SU'],os.environ['SF'],pathlib.Path('incoming')/os.environ['SF'])
          PY
          echo "${S}  incoming/${F}"|sha256sum -c -;echo "${SS}  incoming/${SF}"|sha256sum -c -
          unzip -q "incoming/${F}" -d work;G="$(find work -name gradlew -type f -not -path '*/build/*'|head -1)";R="$(dirname "$G")";echo "$R">/tmp/root
          base64 -w0 "incoming/${SF}" > star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64;python3 star-wars/r38/patches/block01_repair_safe.py "$R"
      - name: Validate CENA live behavior
        run: |
          export ROOT="$(cat /tmp/root)"
          python3 - <<'PY'
          import os,json,pathlib,threading,http.server,socketserver
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(os.environ['ROOT']);vtt=root/'app/src/main/assets/vtt';os.chdir(vtt)
          class H(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          s=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=s.serve_forever,daemon=True).start();port=s.server_address[1]
          r={'start':False,'scene':{},'gemini':{},'page_errors':[],'console_errors':[]}
          try:
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915})
              pg.on('pageerror',lambda e:r['page_errors'].append(str(e)));pg.on('console',lambda m:r['console_errors'].append(m.text) if m.type=='error' else None)
              pg.add_init_script('''
                window.__geminiPrompt=null;
                window.BraseiroGemini={openGeminiWithPrompt:(p)=>{window.__geminiPrompt=String(p||'');return JSON.stringify({ok:true,message:'ok'})}};
                const h={get:(t,p)=>{if(p==='then')return undefined;return(...a)=>JSON.stringify({ok:true,items:[],data:[],state:{}})}};
                for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroImages','BraseiroFiles','BraseiroTts'])window[n]=new Proxy({},h);
              ''')
              pg.goto(f'http://127.0.0.1:{port}/r46-shell.html',wait_until='domcontentloaded');pg.wait_for_timeout(1600)
              st=pg.locator('#sandbox-start-button');
              if st.count(): st.click(timeout=3000);r['start']=True;pg.wait_for_timeout(1000)
              # CENA is first tab and should be current
              images=pg.locator('.scene-media-slot img:visible')
              imgs=[]
              for i in range(images.count()):
                e=images.nth(i);imgs.append({'src':e.get_attribute('src'),'w':e.evaluate('(e)=>e.naturalWidth'),'h':e.evaluate('(e)=>e.naturalHeight'),'recovered':e.get_attribute('data-recovered-scene')})
              r['scene']['images']=imgs
              r['scene']['has_recovered']=any(x.get('recovered') for x in imgs)
              # locate illustration/import by text or injected block attributes
              ill=pg.get_by_text('ILUSTRAÇÃO',exact=True)
              imp=pg.get_by_text('IMPORTAR',exact=True)
              r['scene']['illustration_visible']=ill.count()>0 and ill.first.is_visible()
              r['scene']['import_visible']=imp.count()>0 and imp.first.is_visible()
              if r['scene']['illustration_visible']:
                box=ill.first.bounding_box();r['scene']['illustration_box']=box
                try:ill.first.click(timeout=2500);pg.wait_for_timeout(250);r['gemini']['clicked']=True
                except Exception as e:r['gemini']['clicked']=False;r['gemini']['error']=str(e)[:1000]
              prompt=pg.evaluate('window.__geminiPrompt') or ''
              r['gemini']['prompt']=prompt;r['gemini']['length']=len(prompt)
              required=['STAR WARS','Cena','Local','Situação','Narração']
              r['gemini']['required_tokens']={x:(x.lower() in prompt.lower()) for x in required}
              r['gemini']['rich']=len(prompt)>=250 and sum(r['gemini']['required_tokens'].values())>=3
              b.close()
          finally:s.shutdown();s.server_close()
          dest=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit/SCENE_RUNTIME_AUDIT.json';dest.write_text(json.dumps(r,ensure_ascii=False,indent=2))
          md=['# R38 SCENE RUNTIME AUDIT','',f"- Sandbox started: **{r['start']}**",f"- Visible scene images: **{len(r['scene'].get('images',[]))}**",f"- Recovered semantic fallback present: **{r['scene'].get('has_recovered')}**",f"- ILUSTRAÇÃO visible: **{r['scene'].get('illustration_visible')}**",f"- IMPORTAR visible: **{r['scene'].get('import_visible')}**",f"- ILUSTRAÇÃO click reached Gemini bridge: **{r['gemini'].get('clicked')}**",f"- Prompt length: **{r['gemini'].get('length',0)}**",f"- Prompt rich: **{r['gemini'].get('rich')}**",f"- Page errors: **{len(r['page_errors'])}**",f"- Console errors: **{len(r['console_errors'])}**",'','## Scene images']+[f"- `{x}`" for x in r['scene'].get('images',[])]+['','## Prompt markers',f"- `{r['gemini'].get('required_tokens')}`"]
          (dest.parent/'SCENE_RUNTIME_AUDIT.md').write_text('\n'.join(md)+'\n')
          PY
      - name: Commit evidence
        run: |
          git checkout -- star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          git config user.name braseiro-audit-bot;git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/SCENE_RUNTIME_AUDIT.*;git commit -m 'audit(star-wars): validate scene fallback and Gemini handoff runtime' || true;git push
