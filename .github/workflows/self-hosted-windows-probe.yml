name: Self-hosted Windows probe

concurrency:
  group: self-hosted-windows-probe
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-hosted-windows-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Allow runner PowerShell scripts
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force -ErrorAction Continue
          } catch {
            Write-Warning $_
          }
          "PSExecutionPolicyPreference=Bypass" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Execution policies:"
          Get-ExecutionPolicy -List | Format-Table -AutoSize
          exit 0

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Windows Android environment
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "WORKSPACE=$env:GITHUB_WORKSPACE"

          foreach ($tool in @('git.exe','java.exe','node.exe','npm.cmd','adb.exe','sdkmanager.bat')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "$tool not found" }
            Write-Host "$tool => $($cmd.Source)"
          }

          java -version
          sdkmanager.bat --version
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"

          "SELF_HOSTED_WINDOWS_ANDROID_ENV_OK" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "SELF_HOSTED_WINDOWS_ANDROID_ENV_OK"
