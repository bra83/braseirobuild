name: BRELGA self-hosted Android healthcheck

concurrency:
  group: brelga-self-hosted-healthcheck
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-hosted-windows-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Verify the selected runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') {
            throw "Wrong runner selected: $env:RUNNER_NAME (expected BRELGA)"
          }
          if ($env:RUNNER_OS -ne 'Windows') {
            throw "Wrong runner OS: $env:RUNNER_OS (expected Windows)"
          }
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "Machine=$env:COMPUTERNAME"

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: Locate and configure Android SDK 36
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $candidates = @()
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          if ($env:USERPROFILE) { $candidates += (Join-Path $env:USERPROFILE '.android\sdk') }
          $candidates += 'C:\Android\Sdk'
          $candidates += 'C:\actions-runner\android-sdk'

          $sdkRoot = $null
          $sdkManager = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ([string]::IsNullOrWhiteSpace($candidate) -or -not (Test-Path $candidate)) { continue }
            $found = Get-ChildItem $candidate -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($found) {
              $sdkRoot = $candidate
              $sdkManager = $found.FullName
              break
            }
          }

          if (-not $sdkManager) {
            $sdkRoot = 'C:\\actions-runner\\android-sdk'
            $latest = Join-Path $sdkRoot 'cmdline-tools\\latest'
            $sdkManager = Join-Path $latest 'bin\\sdkmanager.bat'
            $zip = Join-Path $env:RUNNER_TEMP 'android-commandlinetools-15859902.zip'
            $extract = Join-Path $env:RUNNER_TEMP 'android-commandlinetools-15859902'

            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item $latest -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $sdkRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            New-Item -ItemType Directory -Path (Split-Path $latest) -Force | Out-Null

            $url = 'https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip'
            & curl.exe -L --fail --retry 3 --retry-delay 2 -o $zip $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) {
              throw 'Android command-line tools download failed'
            }

            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne '90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a') {
              throw "Android command-line tools checksum mismatch: $hash"
            }

            Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
            Move-Item (Join-Path $extract 'cmdline-tools') $latest -Force
            if (-not (Test-Path $sdkManager)) {
              throw 'sdkmanager was not installed in the expected BRELGA path'
            }
          }

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path $sdkManager) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $sdkRoot 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          1..200 | ForEach-Object { 'y' } | & $sdkManager --licenses | Out-Null
          & $sdkManager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          $sdkExit = $LASTEXITCODE
          $ErrorActionPreference = $previousPreference
          if ($sdkExit -ne 0) { throw "sdkmanager failed with exit code $sdkExit" }

          foreach ($required in @(
            (Join-Path $sdkRoot 'platforms\android-36'),
            (Join-Path $sdkRoot 'build-tools\36.0.0'),
            (Join-Path $sdkRoot 'platform-tools\adb.exe'),
            (Join-Path $sdkRoot 'build-tools\36.0.0\aapt.exe'),
            (Join-Path $sdkRoot 'build-tools\36.0.0\apksigner.bat')
          )) {
            if (-not (Test-Path $required)) { throw "Required Android component missing: $required" }
          }

          Write-Host "ANDROID_SDK_ROOT=$sdkRoot"
          & $sdkManager --version

      - name: Validate BRELGA toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredCommands = @('git.exe', 'java.exe', 'node.exe', 'npm.cmd', 'adb.exe')
          foreach ($tool in $requiredCommands) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $command) { throw "$tool not found for the BRELGA runner service account" }
            Write-Host "$tool => $($command.Source)"
          }

          $javaText = (& java.exe -version 2>&1) -join [Environment]::NewLine
          if ($javaText -notmatch 'version "21\.') { throw "Java 21 is not active: $javaText" }

          $nodeMajor = [int]((& node.exe --version).TrimStart('v').Split('.')[0])
          if ($nodeMajor -ne 22) { throw "Node 22 is not active: $(& node.exe --version)" }

          $npmMajor = [int]((& npm.cmd --version).Split('.')[0])
          if ($npmMajor -lt 10) { throw "npm 10+ is required: $(& npm.cmd --version)" }

          $service = Get-Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'actions.runner*' -and $_.Status -eq 'Running' } |
            Select-Object -First 1

          if ($service) {
            Write-Host "Runner Windows service is active: $($service.Name)"
            $serviceStatus = "running ($($service.Name))"
          } else {
            Write-Warning 'BRELGA is online, but no running actions.runner Windows service was visible to this account.'
            $serviceStatus = 'not visible; runner may be interactive'
          }

          @"
          ## BRELGA self-hosted healthcheck

          - Runner: **$env:RUNNER_NAME**
          - OS/architecture: **$env:RUNNER_OS / $env:RUNNER_ARCH**
          - Java: **$(& java.exe -version 2>&1 | Select-Object -First 1)**
          - Node: **$(& node.exe --version)**
          - npm: **$(& npm.cmd --version)**
          - Android SDK: **$env:ANDROID_SDK_ROOT**
          - Android platform/build-tools: **36 / 36.0.0**
          - Runner service: **$serviceStatus**
          - Result: **HEALTHY**
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host 'BRELGA_SELF_HOSTED_ANDROID_HEALTHY'
