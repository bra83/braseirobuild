name: Diagnose firestorage RUN109 transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-firestorage-dnd-run109.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect share page and client chunks
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          PAGE='https://firestorage.ai/ja/f/-ixtpPOskWLY'
          curl -fsSL "$PAGE" -o /tmp/page.html
          echo '=== PAGE MATCHES ==='
          python3 - <<'PY'
          import re, html
          s=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          for needle in ['download','api','file','share','LnDd9nglgCDjt8Vq','01a0b8da565674c698bc9d2144257d92','-ixtpPOskWLY']:
              print('\n---',needle,'---')
              for m in list(re.finditer(needle,s,re.I))[:20]:
                  print(html.unescape(s[max(0,m.start()-250):min(len(s),m.end()+500)]))
          PY
          echo '=== SCRIPT SOURCES ==='
          python3 - <<'PY' > /tmp/scripts.txt
          import re, html
          s=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          seen=set()
          for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s):
              x=html.unescape(x)
              if x.startswith('/'): x='https://firestorage.ai'+x
              if x not in seen:
                  seen.add(x); print(x)
          PY
          cat /tmp/scripts.txt
          i=0
          while IFS= read -r u; do
            i=$((i+1))
            curl -fsSL "$u" -o "/tmp/s$i.js" || continue
          done < /tmp/scripts.txt
          echo '=== JS API/URL CANDIDATES ==='
          python3 - <<'PY'
          import glob,re
          hits=set()
          for p in glob.glob('/tmp/s*.js'):
              s=open(p,encoding='utf-8',errors='ignore').read()
              for pat in [
                  r'https?://[^"\'\\ ]{5,220}',
                  r'/api/[A-Za-z0-9_./?=&%{}:$-]{2,220}',
                  r'[^"\']{0,140}download[^"\']{0,220}',
                  r'[^"\']{0,140}presign[^"\']{0,220}',
                  r'[^"\']{0,140}signed[^"\']{0,220}',
              ]:
                  for m in re.finditer(pat,s,re.I):
                      v=m.group(0)
                      if len(v)<500: hits.add(v)
          for v in sorted(hits):
              print(v)
          PY
