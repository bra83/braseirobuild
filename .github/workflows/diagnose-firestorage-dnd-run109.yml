name: Diagnose firestorage RUN109 transfer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-firestorage-dnd-run109.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect exact download implementation
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://firestorage.ai/ja/f/-ixtpPOskWLY'
          curl -fsSL "$PAGE" -o /tmp/page.html
          python3 - <<'PY' > /tmp/scripts.txt
          import re, html
          s=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          seen=set()
          for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s):
              x=html.unescape(x)
              if x.startswith('/'): x='https://firestorage.ai'+x
              if x not in seen:
                  seen.add(x); print(x)
          PY
          i=0
          while IFS= read -r u; do
            i=$((i+1))
            curl -fsSL "$u" -o "/tmp/s$i.js" || continue
          done < /tmp/scripts.txt

          python3 - <<'PY'
          import glob
          needles=[
            'let f=',
            'async function ez',
            '/files/${e.fileId}/download',
            'window.location.assign',
            'FileDownloadPreparing',
            'shareId',
            'publicId',
            'apiBase',
            'NEXT_PUBLIC',
          ]
          for p in glob.glob('/tmp/s*.js'):
              s=open(p,encoding='utf-8',errors='ignore').read()
              found=False
              for needle in needles:
                  pos=0
                  while True:
                      i=s.find(needle,pos)
                      if i<0: break
                      found=True
                      print(f'\n=== {p} :: {needle} @ {i} ===')
                      print(s[max(0,i-1800):min(len(s),i+4200)])
                      pos=i+len(needle)
              if found:
                  print(f'\n=== END {p} ===')
          PY
