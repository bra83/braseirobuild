name: Audit Star Wars R38 Block03 v2 real render
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-star-wars-r38-block03-v2.yml"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: src
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'));print('url='+d['source_share_url']);print('file='+d['file']);print('sha='+d['sha256'])
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prepare exact patched source
        env:
          U: ${{ steps.src.outputs.url }}
          F: ${{ steps.src.outputs.file }}
          S: ${{ steps.src.outputs.sha }}
          SU: https://firestorage.ai/ja/f/PbM3XvdzNMAk
          SF: scene-assets-v1-tiny.tar.gz
          SS: 2ca16b2cd0d3f489fe10f1df718be1243febeef38fb88a52bd50502528f60711
        shell: bash
        run: |
          set -euo pipefail;rm -rf incoming work;mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          def dl(u,n,o):
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);q=b.new_page(accept_downloads=True);q.goto(u,wait_until='domcontentloaded',timeout=120000);q.wait_for_timeout(2500);done=False
              for s in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
                try:
                  x=q.locator(s).first
                  if not x.count() or not x.is_visible():continue
                  with q.expect_download(timeout=120000) as i:x.click(timeout=10000)
                  i.value.save_as(str(o));done=True;break
                except:pass
              if not done:
                x=q.get_by_text(n,exact=False).first
                with q.expect_download(timeout=120000) as i:x.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
                i.value.save_as(str(o));done=True
              b.close()
            if not done:raise SystemExit('download failed '+n)
          dl(os.environ['U'],os.environ['F'],pathlib.Path('incoming')/os.environ['F']);dl(os.environ['SU'],os.environ['SF'],pathlib.Path('incoming')/os.environ['SF'])
          PY
          echo "${S}  incoming/${F}"|sha256sum -c -;echo "${SS}  incoming/${SF}"|sha256sum -c -
          unzip -q "incoming/${F}" -d work
          G="$(find work -type f -name gradlew -not -path '*/build/*'|head -1)";R="$(dirname "$G")";echo "$R">/tmp/root
          base64 -w0 "incoming/${SF}" > star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          python3 star-wars/r38/patches/block01_repair_safe.py "$R"
          python3 star-wars/r38/patches/block02_scene_controls.py "$R"
      - name: Verify actual render mechanism
        shell: bash
        run: |
          export ROOT="$(cat /tmp/root)"
          python3 - <<'PY'
          import os,pathlib,threading,http.server,socketserver,json,re,urllib.parse,datetime
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(os.environ['ROOT']);vtt=root/'app/src/main/assets/vtt';os.chdir(vtt)
          class H(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          s=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=s.serve_forever,daemon=True).start();port=s.server_address[1]
          r={'viewports':{},'issues':[],'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          def add(code,msg,ev=None):r['issues'].append({'severity':'high','code':code,'message':msg,'evidence':ev})
          try:
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              for vw,vh in [(415,915),(360,800)]:
                pg=b.new_page(viewport={'width':vw,'height':vh});errs=[];pg.on('pageerror',lambda e,errs=errs:errs.append(str(e)))
                pg.add_init_script('''window.__geminiPrompt=null;window.BraseiroGemini={openGeminiWithPrompt:(p)=>{window.__geminiPrompt=String(p||'');return JSON.stringify({ok:true})},pickSceneImage:(k)=>JSON.stringify({ok:true})};const h={get:(t,p)=>{if(p==='then')return undefined;return(...a)=>JSON.stringify({ok:true,items:[],data:[],state:{}})}};for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroImages','BraseiroFiles','BraseiroTts'])window[n]=new Proxy({},h);''')
                pg.goto(f'http://127.0.0.1:{port}/r46-shell.html',wait_until='domcontentloaded');pg.wait_for_timeout(1000)
                st=pg.locator('#sandbox-start-button');
                if st.count() and st.is_visible():st.click(timeout=3000);pg.wait_for_timeout(800)
                data={'nav':[]}
                nav=pg.locator('.bottom-nav-button:visible')
                for i in range(nav.count()):
                  btn=nav.nth(i);label=(btn.inner_text() or '').strip();mask=btn.locator('.reference-icon-mask').first
                  item={'label':label,'mask_count':mask.count()}
                  if mask.count():
                    cs=mask.evaluate('e=>{const s=getComputedStyle(e);return {bg:s.backgroundImage,mask:s.maskImage,wmask:s.webkitMaskImage,w:s.width,h:s.height,display:s.display,visibility:s.visibility,opacity:s.opacity}}')
                    item['computed']=cs
                    bg=cs.get('bg') or ''
                    ok=bg not in ('','none') and 'url(' in bg and cs.get('display')!='none' and cs.get('visibility')!='hidden' and float(cs.get('opacity') or '1')>0
                    item['ok']=ok
                    if not ok:add('NAV_ICON_RENDER',f'{vw}x{vh} {label}: icon background not rendered',cs)
                  else:add('NAV_ICON_NODE',f'{vw}x{vh} {label}: icon node missing')
                  data['nav'].append(item)
                ill=pg.locator('button[data-action="gemini"]');imp=pg.locator('button[data-action="import"]')
                data['illustration']={'count':ill.count(),'visible':ill.first.is_visible() if ill.count() else False,'box':ill.first.bounding_box() if ill.count() else None}
                data['import']={'count':imp.count(),'visible':imp.first.is_visible() if imp.count() else False,'box':imp.first.bounding_box() if imp.count() else None}
                if not(data['illustration']['count']==1 and data['illustration']['visible']):add('ILLUSTRATION_RENDER',f'{vw}x{vh}: ILUSTRAÇÃO not rendered',data['illustration'])
                if not(data['import']['count']==1 and data['import']['visible']):add('IMPORT_RENDER',f'{vw}x{vh}: IMPORTAR not rendered',data['import'])
                if data['illustration']['visible']:
                  ill.first.click(timeout=2500);pg.wait_for_timeout(100);prompt=pg.evaluate('window.__geminiPrompt') or '';data['prompt_len']=len(prompt)
                  if len(prompt)<250:add('PROMPT_CONTENT',f'{vw}x{vh}: prompt too short',len(prompt))
                fall=pg.locator('.scene-media-slot img.final-scene-library-image:visible');data['fallback_count']=fall.count();data['fallback_id']=fall.first.get_attribute('data-recovered-scene') if fall.count() else None
                if not fall.count():add('SCENE_FALLBACK',f'{vw}x{vh}: semantic fallback missing')
                if errs:add('PAGE_ERROR',f'{vw}x{vh}: page errors',errs)
                r['viewports'][f'{vw}x{vh}']=data;pg.close()
              b.close()
          finally:s.shutdown();s.server_close()
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit/BLOCK03_REAL_RENDER.json';out.write_text(json.dumps(r,ensure_ascii=False,indent=2))
          md=['# STAR WARS R38 — BLOCK03 REAL RENDER AUDIT','',f'- High findings: **{len(r["issues"])}**','- Viewports: **415×915 + 360×800**','','## Findings']
          md += [f'- **{x["code"]}** — {x["message"]}'+(f' — `{str(x.get("evidence"))[:300]}`' if x.get('evidence') is not None else '') for x in r['issues']]
          if not r['issues']:md.append('- Nenhuma falha reproduzível nos ícones, controles de CENA, prompt ou fallback semântico.')
          for vp,d in r['viewports'].items():
            md += ['',f'## {vp}',f'- ILUSTRAÇÃO: `{d.get("illustration")}`',f'- IMPORTAR: `{d.get("import")}`',f'- Prompt chars: **{d.get("prompt_len",0)}**',f'- Fallback: **{d.get("fallback_id")}**']+[f'- {x["label"]}: icon_ok=**{x.get("ok")}** `{x.get("computed")}`' for x in d['nav']]
          (out.parent/'BLOCK03_REAL_RENDER.md').write_text('\n'.join(md)+'\n')
          PY
      - name: Commit evidence
        run: |
          git checkout -- star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          git config user.name braseiro-audit-bot;git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/BLOCK03_REAL_RENDER.*
          git commit -m 'audit(star-wars): record real icon and scene-control rendering' || true
          git push
