name: Forbidden Lands 3.3.5 3D Startup Hotfix - BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-forbidden-lands-3.3.5-3d-startup-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forbidden-lands-3.3.5-3d-startup-hotfix
  cancel-in-progress: true

env:
  BUILD_ROOT: "D:\\brelga-forbidden-lands-3.3.5"
  PROJECT_ROOT: "D:\\brelga-forbidden-lands-3.3.5\\project"
  PATCH_API: "https://api.firestorage.ai/dev/file/shares/2MKaZHELXlMS"
  PATCH_NAME: "forbidden-lands-3.3.5-3d-startup-patch.zip"
  PATCH_BYTES: "48987"
  PATCH_SHA256: "4847137cb50115f7cf84310d47632342db41d94686a1857000aa750dd5c26fe7"
  APK_NAME: "BRASEIRO_FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX.apk"
  TAG: "forbidden-lands-3.3.5-3d-startup-hotfix"
  EXPECTED_SHA1: "9d0f1089b3fb6c225f1f59462750864e897c4d92"

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240

    steps:
      - name: Configure BRELGA toolchain
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          if (-not (Test-Path $env:PROJECT_ROOT)) { throw "Existing FL project missing: $env:PROJECT_ROOT" }

          $temp=Join-Path $env:BUILD_ROOT 'hotfix-temp'
          $npmCache=Join-Path $env:BUILD_ROOT 'npm-cache'
          $gradleHome=Join-Path $env:BUILD_ROOT 'gradle-home'
          New-Item -ItemType Directory -Path $temp,$npmCache,$gradleHome -Force | Out-Null

          $nodeRoot='C:\actions-runner\_work\_tool\node'
          $nodeDir=Get-ChildItem $nodeRoot -Directory -ErrorAction Stop |
            ForEach-Object { Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue } |
            Where-Object { Test-Path (Join-Path $_.FullName 'node.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $nodeDir) { throw 'Node tool-cache not found' }

          $javaRoot='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk'
          $javaDir=Get-ChildItem $javaRoot -Directory -Recurse -ErrorAction Stop |
            Where-Object { Test-Path (Join-Path $_.FullName 'bin\java.exe') } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $javaDir) { throw 'Java tool-cache not found' }

          $sdk='C:\actions-runner\android-sdk'
          if (-not (Test-Path $sdk)) { throw 'Android SDK not found' }

          $newPath="$($nodeDir.FullName);$($javaDir.FullName)\bin;$env:PATH"
          "PATH=$newPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JAVA_HOME=$($javaDir.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GRADLE_USER_HOME=$gradleHome" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NPM_CONFIG_CACHE=$npmCache" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $env:PATH=$newPath
          node --version
          npm --version
          java -version

      - name: Download exact patch
        id: patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $incoming=Join-Path $env:BUILD_ROOT 'hotfix-patch'
          Remove-Item $incoming -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $incoming -Force | Out-Null
          $meta=Invoke-RestMethod -Method Get -Uri ($env:PATCH_API + '/files?maxResults=100')
          $file=$meta.files | Where-Object { $_.fileName -eq $env:PATCH_NAME } | Select-Object -First 1
          if (-not $file) { throw "Patch not found: $env:PATCH_NAME" }
          $ticket=Invoke-RestMethod -Method Post -Uri ($env:PATCH_API + '/files/' + $file.fileId + '/download')
          if (-not $ticket.downloadUrl) { throw 'No patch download URL' }
          $zip=Join-Path $incoming $env:PATCH_NAME
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $zip $ticket.downloadUrl
          if ($LASTEXITCODE -ne 0) { throw 'Patch download failed' }
          if ((Get-Item $zip).Length -ne [int64]$env:PATCH_BYTES) { throw "Patch size mismatch: $((Get-Item $zip).Length)" }
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:PATCH_SHA256) { throw "Patch SHA mismatch: $hash" }
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Apply hotfix over validated source
        shell: powershell
        env:
          PATCH_ZIP: ${{ steps.patch.outputs.zip }}
        run: |
          $ErrorActionPreference='Stop'
          & tar.exe -xf $env:PATCH_ZIP -C $env:PROJECT_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Patch extraction failed' }

          $pkg=Get-Content (Join-Path $env:PROJECT_ROOT 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '3.3.5') { throw "Unexpected source version: $($pkg.version)" }
          $gradle=Get-Content (Join-Path $env:PROJECT_ROOT 'android\app\build.gradle') -Raw
          if ($gradle -notmatch 'applicationId\s+"com\.braseiro\.forbiddenlands"') { throw 'Wrong source package' }
          if ($gradle -notmatch 'versionCode\s+303500') { throw 'Wrong source versionCode' }

      - name: Focused regression gate
        shell: powershell
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd run lint
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript lint failed' }
          & node.exe scripts/verify-runtime-hotfix-3d-startup.mjs
          if ($LASTEXITCODE -ne 0) { throw '3D/startup hotfix gate failed' }
          & npm.cmd run verify:runtime-hotfix-3.3.5
          if ($LASTEXITCODE -ne 0) { throw '3.3.5 runtime gate failed' }

      - name: Full verification suite
        shell: powershell
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd run verify
          if ($LASTEXITCODE -ne 0) { throw 'Full verify failed' }

      - name: Final Android sync and focused gate again
        shell: powershell
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd run android:sync
          if ($LASTEXITCODE -ne 0) { throw 'Android sync failed' }
          & npm.cmd run verify:android
          if ($LASTEXITCODE -ne 0) { throw 'Android verify failed' }
          & node.exe scripts/verify-runtime-hotfix-3d-startup.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Hotfix regressed after Android sync' }

      - name: Build APK
        shell: powershell
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          & node.exe scripts/run-gradle-task.mjs assembleDebug
          if ($LASTEXITCODE -ne 0) { throw 'assembleDebug failed' }

      - name: Validate APK runtime payload and signature
        id: apk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $built=Join-Path $env:PROJECT_ROOT 'android\app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path $built)) { throw "APK missing: $built" }

          $out=Join-Path $env:BUILD_ROOT 'hotfix-out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apk=Join-Path $out $env:APK_NAME
          Copy-Item $built $apk -Force

          $bt=Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $aapt=Join-Path $bt.FullName 'aapt.exe'
          $signer=Join-Path $bt.FullName 'apksigner.bat'

          & $aapt dump badging $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_BADGING.txt')
          if ($LASTEXITCODE -ne 0) { throw 'aapt badging failed' }
          $badging=Get-Content (Join-Path $out 'APK_BADGING.txt') -Raw
          if ($badging -notmatch "package: name='com\.braseiro\.forbiddenlands'") { throw 'Wrong APK package' }
          if ($badging -notmatch "versionCode='303500'") { throw 'Wrong APK versionCode' }
          if ($badging -notmatch "versionName='3\.3\.5'") { throw 'Wrong APK versionName' }

          & $signer verify --verbose --print-certs $apk 2>&1 | Tee-Object -FilePath (Join-Path $out 'APK_SIGNATURE.txt')
          if ($LASTEXITCODE -ne 0) { throw 'APK signature invalid' }
          $signature=Get-Content (Join-Path $out 'APK_SIGNATURE.txt') -Raw
          $match=[regex]::Match($signature,'Signer #1 certificate SHA-1 digest:\s*([0-9A-Fa-f:]+)')
          if (-not $match.Success) { throw 'Signer SHA-1 missing' }
          $actual=($match.Groups[1].Value -replace ':','').ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA1) { throw "Historical signer mismatch: $actual" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead($apk)
          try {
            $js = New-Object System.Text.StringBuilder
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -like 'assets/public/assets/*.js' -or $entry.FullName -eq 'assets/public/assets/braseiro-final-enhancements.js') {
                $reader=New-Object IO.StreamReader($entry.Open())
                [void]$js.AppendLine($reader.ReadToEnd())
                $reader.Dispose()
              }
            }
            $payload=$js.ToString()
            foreach ($needle in @(
              'Rolagem de dados em 3D',
              'dice3d-stage',
              'Preparando a abertura e preservando a continuidade',
              'Criação da cena inicial',
              'timeout do cofre nativo no cold start',
              'bootDomEnhancements'
            )) {
              if (-not $payload.Contains($needle)) { throw "APK payload missing hotfix marker: $needle" }
            }
            if ($payload.Contains('O Mestre está refinando a qualidade da cena sem bloquear a aventura...')) {
              throw 'Old blocking-refinement payload still present'
            }
          } finally { $zip.Dispose() }

          $hash=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content (Join-Path $out "$($env:APK_NAME).sha256") -Encoding ascii
          @(
            'STATUS=PASS',
            "APK_SHA256=$hash",
            'PACKAGE=com.braseiro.forbiddenlands',
            'VERSION=3.3.5',
            "SIGNER_SHA1=$actual",
            'BUGREPORT_COLD_START_ROOT_CAUSE=NativeStateVault bridge could wait until app resume',
            'COLD_START_NATIVE_VAULT_BUDGET_MS=900',
            'INITIAL_REMOTE_PLANNER=DISABLED',
            'INITIAL_REMOTE_ARBITER=DISABLED',
            'INITIAL_NARRATOR_TIMEOUT_MS=24000',
            'INITIAL_REFINEMENT=DISABLED',
            'DICE_3D_STAGE=PASS',
            'DICE_3D_ANIMATION=PASS',
            'DOM_EARLY_APPEND_GUARD=PASS',
            'SAFE_AREA_NULL_GUARD=PASS',
            'FULL_VERIFY=PASS'
          ) | Set-Content (Join-Path $out 'FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX_PROOF.txt') -Encoding utf8
          "dir=$out" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload final hotfix artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX
          path: |
            ${{ steps.apk.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX.apk
            ${{ steps.apk.outputs.dir }}/BRASEIRO_FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX.apk.sha256
            ${{ steps.apk.outputs.dir }}/APK_BADGING.txt
            ${{ steps.apk.outputs.dir }}/APK_SIGNATURE.txt
            ${{ steps.apk.outputs.dir }}/FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX_PROOF.txt
          retention-days: 30

      - name: Publish hotfix release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $headers=@{ Authorization="Bearer $env:GITHUB_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='BRELGA-FL335-3D-STARTUP' }
          $release=$null
          try { $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG" } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          if (-not $release) {
            $payload=@{
              tag_name=$env:TAG
              target_commitish='main'
              name='Braseiro Forbidden Lands 3.3.5 - 3D + Startup Hotfix'
              body='Bugreport-driven hotfix: cold start bounded, initial scene cannot enter planner/arbiter/refinement loops, 24s narrator fallback, DOM/safe-area null guards, and visible animated 3D dice.'
              draft=$false
              prerelease=$false
            } | ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $payload -Uri "https://api.github.com/repos/$repo/releases"
          }
          $assets=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach ($name in @($env:APK_NAME,"$($env:APK_NAME).sha256",'APK_BADGING.txt','APK_SIGNATURE.txt','FORBIDDEN_LANDS_3.3.5_3D_STARTUP_HOTFIX_PROOF.txt')) {
            $path=Join-Path $env:APK_DIR $name
            if (-not (Test-Path $path)) { throw "Missing asset: $name" }
            $old=$assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($old) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($old.id)" | Out-Null }
            $mime=if ($name -like '*.apk') { 'application/vnd.android.package-archive' } else { 'text/plain' }
            $url="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
            & curl.exe -L --fail -X POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: $mime" --data-binary "@$path" $url
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed: $name" }
          }
          Write-Host "RELEASE_URL=$($release.html_url)"
