name: Audit Star Wars R38 Block04 visual linkage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-star-wars-r38-block04-linkage.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: source
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'))
          print('url='+d['source_share_url']); print('sha='+d['sha256']); print('file='+d['file'])
          PY
      - name: Download pinned R38 source
        env:
          SHARE_URL: ${{ steps.source.outputs.url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          rm -rf incoming work; mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['SOURCE_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True); pg=b.new_page(accept_downloads=True)
            pg.goto(os.environ['SHARE_URL'],wait_until='domcontentloaded',timeout=120000); pg.wait_for_timeout(3000)
            for label in ['Accept','Aceitar','同意する','OK']:
              try:
                q=pg.get_by_text(label,exact=True)
                if q.count() and q.first.is_visible(): q.first.click(timeout=1000)
              except: pass
            done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
              try:
                q=pg.locator(sel).first
                if q.count() and q.is_visible():
                  with pg.expect_download(timeout=120000) as info: q.click(timeout=10000)
                  info.value.save_as(str(out)); done=True; break
              except: pass
            if not done:
              q=pg.get_by_text(os.environ['SOURCE_FILE'],exact=False).first
              par=q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
              with pg.expect_download(timeout=120000) as info: par.locator('a,button').last.click(timeout=10000)
              info.value.save_as(str(out))
            b.close()
          PY
          echo "${EXPECTED_SHA}  incoming/${SOURCE_FILE}" | sha256sum -c -
          unzip -q "incoming/${SOURCE_FILE}" -d work
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Inspect actual R46 linkage surfaces
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,json,pathlib,collections,unicodedata
          root=pathlib.Path(os.environ['ROOT']); vtt=root/'app/src/main/assets/vtt'; out=pathlib.Path('star-wars/r38/audit'); out.mkdir(parents=True,exist_ok=True)
          paths=[vtt/'r46/r46-shell.bundle.js',vtt/'r46/final-runtime.js',vtt/'js/core/uiBridge.mjs',vtt/'js/core/uiBridge.bundle.js',vtt/'js/library/imageLibrary.mjs',vtt/'js/rules/equipmentCatalog.mjs',vtt/'js/rules/vehicles.mjs']
          pats=[r'imageVisualEntityCatalog',r'imageMapCatalog',r'searchImageLibrary',r'getImageAsset',r'imageAssetRuntime',r'visualEntit',r'equipment',r'inventory',r'vehicle',r'npc',r'droid',r'beast',r'creature',r'assetId',r'mechanicalBinding']
          snippets={}
          for p in paths:
            t=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
            ls=t.splitlines(); hits=[]
            for i,l in enumerate(ls,1):
              if any(re.search(x,l,re.I) for x in pats):
                a=max(1,i-3); b=min(len(ls),i+5)
                hits.append({'line':i,'context':'\n'.join(f'{j}:{ls[j-1]}' for j in range(a,b+1))[:6000]})
                if len(hits)>=120: break
            snippets[str(p.relative_to(root))]=hits
          mf=json.loads((vtt/'image-library/manifest.json').read_text(encoding='utf-8')); arr=mf.get('assets',[])
          bound=[a for a in arr if isinstance(a,dict) and a.get('mechanicalBinding')]
          categories=collections.Counter(str(a.get('category')) for a in arr if isinstance(a,dict))
          def norm(s):
            s=unicodedata.normalize('NFKD',str(s)).encode('ascii','ignore').decode().lower(); return re.sub(r'[^a-z0-9]+',' ',s).strip()
          visual_titles={norm(a.get('title')):a for a in arr if isinstance(a,dict) and a.get('title')}
          rule_strings=[]
          for rp in [vtt/'js/rules/equipmentCatalog.mjs',vtt/'js/rules/vehicles.mjs']:
            t=rp.read_text(encoding='utf-8',errors='replace') if rp.exists() else ''
            for m in re.finditer(r"(?:name|title|label)\s*:\s*['\"]([^'\"]{2,120})['\"]",t): rule_strings.append({'source':str(rp.relative_to(root)),'value':m.group(1)})
          exact=[]
          for r in rule_strings:
            a=visual_titles.get(norm(r['value']))
            if a: exact.append({'rule':r,'assetId':a.get('assetId'),'assetTitle':a.get('title'),'category':a.get('category'),'localPath':a.get('localPath'),'remoteReady':a.get('remoteReady'),'remoteUrl':a.get('remoteUrl')})
          report={'manifest_assets':len(arr),'categories':dict(categories),'explicit_mechanical_bindings':len(bound),'binding_examples':bound[:50],'exact_rule_title_matches':exact,'snippets':snippets}
          (out/'BLOCK04_LINKAGE_INSPECTION.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          md=['# STAR WARS R38 — BLOCK04 LINKAGE INSPECTION','',f'- Manifest assets: **{len(arr)}**',f'- Explicit mechanical bindings: **{len(bound)}**',f'- Exact rule-title ↔ visual-title matches: **{len(exact)}**','','## Exact matches']
          md += [f"- `{x['rule']['value']}` → `{x['assetId']}` ({x['category']})" for x in exact[:120]] or ['- none']
          md += ['','## Interpretation','- Exact normalized-title equality is treated as identity evidence only; no mechanics are inferred from image content.','- No R46 layout mutation is performed by this audit.']
          (out/'BLOCK04_LINKAGE_INSPECTION.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          PY
      - name: Commit audit
        run: |
          git config user.name braseiro-audit-bot
          git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/BLOCK04_LINKAGE_INSPECTION.*
          git commit -m 'audit(star-wars): inspect exact R46 visual linkage identities' || exit 0
          git push
