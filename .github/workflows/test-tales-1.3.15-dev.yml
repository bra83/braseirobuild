name: Test Tales 1.3.15 Dev Closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-tales-1.3.15-dev.yml"
      - "tales-1.3.15-transform.py"
      - "tales-1.3.15c-transform.py"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Recover base and apply cumulative source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work audit/tales-1.3.15-dev-current
          mkdir -p incoming work audit/tales-1.3.15-dev-current
          gh release download TALES-1.3.8 --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip' --dir incoming
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip -d work
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          chmod +x "$ROOT/gradlew"
          python3 -m pip install --quiet pillow
          python3 tales-1.3.15c-transform.py "$ROOT" | tee audit/tales-1.3.15-dev-current/transform.txt
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          grep -q 'versionName = "1.3.15-dev"' "$ROOT/app/build.gradle.kts"
          grep -q 'class SkillEffectsAndItemsV1315Test' "$ROOT/app/src/test/java/com/braseiro/talesvtt/game/SkillEffectsAndItemsV1315Test.kt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and run local-rule tests
        working-directory: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew compileDebugKotlin testDebugUnitTest --stacktrace --no-daemon
          ! grep -R 'failures="[1-9]' app/build/test-results/testDebugUnitTest/*.xml
          ! grep -R 'errors="[1-9]' app/build/test-results/testDebugUnitTest/*.xml
          grep -q 'tests="11"' app/build/test-results/testDebugUnitTest/TEST-com.braseiro.talesvtt.game.SkillEffectsAndItemsV1315Test.xml

      - name: Save source checkpoint and resume
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/game
          mkdir -p audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/screens
          mkdir -p audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/navigation
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/CanonicalTalesRules.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/game/
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/TalesCore.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/game/
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/GameSnapshotCodec.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/game/
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/GameViewModel.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/game/
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/MotorBarbaraContract.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/game/
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/MotorBarbaraTransport.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/game/
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/MotorBarbaraWireAdapter.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/game/
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/screens/TroubleScreen.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/screens/
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/screens/EndingScreen.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/screens/
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/navigation/AppNavGraph.kt" audit/tales-1.3.15-dev-current/java/com/braseiro/talesvtt/navigation/
          cp "$ROOT/TALES_RETOMADA_CURRENT.md" audit/tales-1.3.15-dev-current/TALES_RETOMADA_CURRENT.md
          printf '\n## Evidência executada — 1.3.15-dev\n- compileDebugKotlin: PASS no workflow %s.\n- testes de efeitos de Perícia/Itens: 11/11 PASS.\n- nenhum APK publicado neste bloco.\n' "$GITHUB_RUN_ID" >> audit/tales-1.3.15-dev-current/TALES_RETOMADA_CURRENT.md
          cp audit/tales-1.3.15-dev-current/TALES_RETOMADA_CURRENT.md TALES_RETOMADA_CURRENT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/tales-1.3.15-dev-current TALES_RETOMADA_CURRENT.md
          git commit -m 'Checkpoint Tales 1.3.15 dev skill effects and item lifecycle' || exit 0
          git push
