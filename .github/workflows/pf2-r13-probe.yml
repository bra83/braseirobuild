name: PF2 R13 Firestorage Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pf2-r13-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch firestorage client chunk
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ci/pf2-r13
          curl -L --fail --retry 3 -A 'Mozilla/5.0'             'https://firestorage.ai/_next/static/chunks/app/%28files%29/ja/f/page-4d19ae0a4ce39d79.js'             -o ci/pf2-r13/firestorage-page.js
          wc -c ci/pf2-r13/firestorage-page.js
          grep -Eo 'https?://[^" ]+|/[A-Za-z0-9_?=&./:-]*(api|download|share|file)[A-Za-z0-9_?=&./:-]*' ci/pf2-r13/firestorage-page.js             | sort -u > ci/pf2-r13/firestorage-endpoints.txt || true
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/pf2-r13/firestorage-page.js ci/pf2-r13/firestorage-endpoints.txt
          git commit -m 'ci: capture firestorage client endpoint' || exit 0
          git push origin HEAD:main
