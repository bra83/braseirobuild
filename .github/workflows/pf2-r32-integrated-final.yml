name: PF2 R32 Integrated Final

on:
  push:
    branches: [audit-pf2-kingmaker-r30-20260928]
    paths:
      - '.github/workflows/pf2-r32-integrated-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pf2-r32-integrated-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-pf2-kingmaker-r30-20260928

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact post-Antigravity R30
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Expected BRELGA, got $env:RUNNER_NAME"}
          $root=Join-Path $env:RUNNER_TEMP 'pf2-r32-integrated-final'
          $work=Join-Path $root 'work'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root,$work -Force | Out-Null
          $rar=Join-Path $root 'pf2e_r30_work.rar'
          & curl.exe -L --fail --retry 5 --retry-delay 3 "https://drive.usercontent.google.com/download?id=1UbJq8m518f1jIQkkXASvEp0j0Uf6qNkR&export=download&confirm=t" -o $rar
          if($LASTEXITCODE -ne 0){throw 'Download failed'}
          $size=(Get-Item $rar).Length
          if($size -ne 553809972){throw "Unexpected archive size: $size"}

          $candidates=@(
            'C:\Program Files\7-Zip\7z.exe',
            'C:\Program Files (x86)\7-Zip\7z.exe',
            'C:\Program Files\WinRAR\UnRAR.exe',
            'C:\Program Files\WinRAR\WinRAR.exe'
          )
          $tool=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if(-not $tool){
            $cmd=Get-Command 7z.exe -ErrorAction SilentlyContinue
            if($cmd){$tool=$cmd.Source}
          }
          if(-not $tool){throw 'No RAR extraction tool found'}
          if($tool -match '7z\.exe$'){
            & $tool x -y $rar "-o$work"
          } elseif($tool -match 'UnRAR\.exe$'){
            & $tool x -y $rar "$work\"
          } else {
            & $tool x -ibck -y $rar "$work\"
          }
          if($LASTEXITCODE -ne 0){throw "Archive extraction failed: $LASTEXITCODE"}
          $project=Join-Path $work 'pf2e_r30_work'
          if(-not(Test-Path (Join-Path $project 'version.properties'))){throw 'Project root missing'}
          "WORK_ROOT=$project" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply integrated character-control patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python ci\pf2-r32-integrated\patch.py $env:WORK_ROOT
          if($LASTEXITCODE -ne 0){throw 'Patch failed'}
          Copy-Item ci\pf2-r32-integrated\test_r32_integrated.py (Join-Path $env:WORK_ROOT 'tests_pf2\test_r32_integrated.py') -Force

      - name: Requested feature gates
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $main=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\MainActivity.java' -Raw
          $party=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\PartyDirector.java' -Raw
          $guide=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerTurnGuide.java' -Raw
          $director=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\BraseiroNarrativeDirector.java' -Raw
          $profile=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\HumanGmNarrativeProfile.java' -Raw
          $checks=@{
            'controle-na-criacao'=$main.Contains('QUEM CONTROLA ESTE PERSONAGEM?') -and $main.Contains('Mestre — Barbara controla')
            'solo-multipersonagem'=$party.Contains('"mode","solo_multi_character"') -and $party.Contains('"human_players",1')
            'mecanica-unica-pf2'=$party.Contains('"mechanics_rule"')
            'guia-icone'=$main.Contains('ⓘ GUIA COMPLETO DO TURNO')
            'guia-motor-real'=$guide.Contains('rules.turnProcedureGuide()') -and $guide.Contains('rules.activityGuideCatalog()') -and $guide.Contains('repository.activeTurn()')
            'guia-sequencia'=$guide.Contains('SEQUÊNCIA COMPLETA') -and $guide.Contains('OPÇÕES VÁLIDAS NESTE MOMENTO') -and $guide.Contains('CONFIGURAÇÃO QUE EXIGE SUA ATENÇÃO')
            'perfil-narrador'=$profile.Contains('PERFIL TÉCNICO CANÔNICO') -and $director.Contains('HumanGmNarrativeProfile.prompt()')
            'perfil-nao-mexe-regra'=$director.Contains('regras PF2e/Kingmaker e decisões do jogador sempre têm precedência')
          }
          $log=Join-Path $env:RUNNER_TEMP 'PF2_R32_FEATURE_GATES.log'
          foreach($x in $checks.GetEnumerator()|Sort-Object Name){
            $status=if($x.Value){'PASS'}else{'FAIL'}
            "$status - $($x.Name)" | Tee-Object -FilePath $log -Append
          }
          if(@($checks.GetEnumerator()|Where-Object{-not $_.Value}).Count -gt 0){throw 'Feature gate failed'}
          "FEATURE_GATES=$log" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run all PF2 and Kingmaker tests
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Continue'
          python -m pip install -q pytest
          if($LASTEXITCODE -ne 0){throw 'pytest install failed'}
          python -m pytest tests_pf2 -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R32_TESTS.log"
          $code=$LASTEXITCODE
          if($code -ne 0){throw "PF2 tests failed: $code"}

      - name: Configure Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME)
          if($env:LOCALAPPDATA){$candidates+=(Join-Path $env:LOCALAPPDATA 'Android\Sdk')}
          $sdk=$null;$mgr=$null
          foreach($c in ($candidates|Where-Object{$_}|Select-Object -Unique)){
            if(Test-Path $c){
              $f=Get-ChildItem $c -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue|Select-Object -First 1
              if($f){$sdk=$c;$mgr=$f.FullName;break}
            }
          }
          if(-not $mgr){throw 'Android SDK not found'}
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          1..100|%{'y'}|& $mgr --licenses|Out-Null
          & $mgr 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          if($LASTEXITCODE -ne 0){throw 'sdkmanager failed'}

      - name: Build APK
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R32_GRADLE.log"
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($code -ne 0){throw "Gradle failed: $code"}
          $apk=Get-ChildItem . -Recurse -Filter '*.apk' -File | Where-Object {$_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]'} | Select-Object -First 1
          if(-not $apk){throw 'APK missing'}
          "APK_PATH=$($apk.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare release files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'pf2-r32-release'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apkOut=Join-Path $out 'Braseiro_Pathfinder2e_9.0.33_R32_POST_ANTIGRAVITY_DEBUG.apk'
          Copy-Item $env:APK_PATH $apkOut -Force
          (Get-FileHash $apkOut -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$apkOut.sha256" -Encoding ascii
          Copy-Item $env:FEATURE_GATES (Join-Path $out 'FEATURE_GATES.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R32_TESTS.log" (Join-Path $out 'PF2_TESTS.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R32_GRADLE.log" (Join-Path $out 'GRADLE_BUILD.log')
          Copy-Item ci\pf2-r32-integrated\patch.py (Join-Path $out 'R32_POST_ANTIGRAVITY_PATCH.py')
          Copy-Item ci\pf2-r32-integrated\test_r32_integrated.py (Join-Path $out 'R32_INTEGRATED_TEST.py')
          @(
            '# R32 — CONTROLE MULTIPERSONAGEM + GUIA DO REINO + PERFIL NARRATIVO',
            '',
            'Baseline: R30 pós-Antigravity.',
            'TTS não foi alterado.',
            'Controle Jogador/Mestre é persistente e usa o mesmo motor PF2e.',
            'Guia do Turno lê KingmakerRulesEngine e KingmakerRepository.',
            'Perfil Técnico Canônico é carregado pelo BraseiroNarrativeDirector.',
            'A regressão PF2 completa e o Gradle são gates obrigatórios.'
          ) | Set-Content (Join-Path $out 'VALIDACAO_R32.md') -Encoding utf8
          "OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish R32
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='PATHFINDER2E-9.0.33-R32'
          $headers=@{
            'Authorization'="Bearer $env:GITHUB_TOKEN"
            'Accept'='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='BRELGA-PF2-R32'
          }
          try{
            $release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
          } catch {
            $body=@{
              tag_name=$tag
              target_commitish='audit-pf2-kingmaker-r30-20260928'
              name='Braseiro Pathfinder 2e 9.0.33 R32'
              body='Pós-Antigravity R30. Controle Jogador/Mestre por personagem já na criação/edição; Solo com múltiplos personagens e um jogador humano; Guia Completo do Turno do Reino ligado ao motor real; Perfil Técnico Canônico do Mestre Humano ligado ao BraseiroNarrativeDirector. TTS não alterado. Testes PF2/Kingmaker e Gradle obrigatórios.'
              draft=$false
              prerelease=$false
            } | ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$repo/releases"
          }
          foreach($file in Get-ChildItem $env:OUT_DIR -File){
            $existing=$release.assets | Where-Object {$_.name -eq $file.Name} | Select-Object -First 1
            if($existing){
              Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" | Out-Null
            }
            $encoded=[uri]::EscapeDataString($file.Name)
            $upload="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encoded"
            & curl.exe -L --fail --retry 5 --retry-delay 2 --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$($file.FullName)" $upload
            if($LASTEXITCODE -ne 0){throw "upload failed: $($file.Name)"}
          }
          Write-Host "RELEASE_URL=$($release.html_url)"
