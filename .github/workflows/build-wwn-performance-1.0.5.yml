name: BRASEIRO WWN Performance 1.0.5 Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-wwn-performance-1.0.5.yml"

permissions:
  contents: read

env:
  WWN_SOURCE_SHARE_URL: "https://firestorage.ai/ja/f/bgLdDFFX-y7t"
  WWN_SOURCE_SHA256: "b3f45afed85ac93bad26fee1117788de69178b5e5c84f1d46c602d6fc8e1c1ad"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download exact WWN source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming /tmp/wwn-download
          cd /tmp/wwn-download
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
          const page=await ctx.newPage();
          await page.goto(process.env.WWN_SOURCE_SHARE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3000);
          const out=process.env.GITHUB_WORKSPACE+'/incoming/wwn.zip';
          for(const sel of ['text=/一括ダウンロード/i','text=/ダウンロード/i','text=/Download/i','button','a']){
            const loc=page.locator(sel), n=Math.min(await loc.count(),50);
            for(let i=0;i<n;i++){
              const el=loc.nth(i); let text=''; try{text=(await el.innerText({timeout:1000})).trim()}catch{}
              if((sel==='button'||sel==='a')&&!/download|ダウンロード|一括|保存|ZIP|ファイル/i.test(text)) continue;
              try{const p=page.waitForEvent('download',{timeout:10000}); await el.click({timeout:5000}); const d=await p; await d.saveAs(out); await browser.close(); process.exit(0)}catch{}
            }
          }
          await browser.close(); process.exit(2);
          NODE
          node download.mjs
          cd "$GITHUB_WORKSPACE"
          unzip -t incoming/wwn.zip >/dev/null
          echo "$WWN_SOURCE_SHA256  incoming/wwn.zip" | sha256sum -c -
      - name: Extract and validate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q incoming/wwn.zip -d work
          chmod +x work/gradlew
          grep -q 'versionCode = 105' work/app/build.gradle.kts
          grep -q 'loopSynthesisExecutor' work/app/src/main/java/com/braseiro/wwn/bridge/NativeAudioRuntime.kt
          grep -q 'verifiedLoadCache' work/app/src/main/java/com/braseiro/wwn/data/CampaignRepository.kt
          grep -q 'MAX_STORED_DIMENSION = 2048' work/app/src/main/java/com/braseiro/wwn/bridge/SceneImageRuntime.kt
      - name: Run performance/local gates
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; count=$((count+1)); done < <(find app/src/main/assets/www -type f -name '*.js' -print0)
          echo "JS_SYNTAX_PASS=$count"
          node --test web-tests/post071-performance-hotfix.test.mjs
          node --test web-tests/post071-gameflow-closure.test.mjs
          python3 tools/static_guard.py
          python3 tools/static_guard_release.py
          python3 tools/closure065_native_contract.py
          python3 tools/closure069_native_audio_contract.py
          node tools/stress_wave10.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean test assembleDebug --stacktrace --no-daemon
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find work -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -n1)"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
