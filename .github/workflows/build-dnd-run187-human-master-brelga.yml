name: Braseiro DnD RUN187 Human Master BRELGA
on:
  push:
    branches: [main]
    paths:
      - 'ci/dnd-run187/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dnd-run187-human-master-brelga
  cancel-in-progress: false

env:
  TAG: DND-6.6.4-RUN187
  APK_NAME: BRASEIRO_DND_6.6.4_RUN187_DEBUG.apk
  VERSION_NAME: 6.6.4-r187
  VERSION_CODE: '606487'
  EXPECTED_RUN186_PACKAGE: com.braseiro.dnd5e

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Validate BRELGA and preserve canonical baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "RUNNER_NOT_BRELGA=$env:RUNNER_NAME"}
          $src='C:\DND181\extract\dnd_work'
          if(!(Test-Path "$src\android\gradlew.bat")){throw 'CANONICAL_RUN181_SOURCE_MISSING'}
          if(!(Test-Path "$src\android\app\src\main\java\com\braseiro\dnd5e\MainActivity.java")){throw 'CANONICAL_SOURCE_INVALID'}
          Write-Host 'Canonically preserved: C:\DND181\extract\dnd_work'
          Get-PSDrive C | Format-List Free,Used

      - name: Clone source without resetting RUN181
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\DND181\extract\dnd_work'
          $dst='C:\DND187\work'
          $out='C:\DND187\out'
          if(Test-Path 'C:\DND187'){Remove-Item 'C:\DND187' -Recurse -Force}
          New-Item -ItemType Directory -Force -Path 'C:\DND187',$out | Out-Null
          & robocopy $src $dst /MIR /R:2 /W:1 /XD '.gradle' 'build' '.idea' | Out-Host
          $code=$LASTEXITCODE
          if($code -gt 7){throw "ROBOCOPY_FAILED_$code"}
          $global:LASTEXITCODE=0
          if(!(Test-Path "$dst\android\gradlew.bat")){throw 'COPIED_SOURCE_MISSING_GRADLE'}
          "root=$dst" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Reconstruct canonical RUN186 before RUN187
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $scripts=@(
            "$env:GITHUB_WORKSPACE\ci\dnd-run185\patch.py",
            "$env:GITHUB_WORKSPACE\ci\dnd-run186\patch.py"
          )
          foreach($script in $scripts){
            python $script $env:ROOT
            if($LASTEXITCODE -ne 0){throw "CANONICAL_PATCH_FAILED_$script"}
          }
          $src="$env:ROOT\android\app\src\main\java\com\braseiro\dnd5e"
          foreach($file in @('MainActivity.java','StrixhavenPtBrAcademicCatalog.java','StrixhavenOfficialCampaignRuntime.java','HumanMasterNarrativeProfile.java')){
            if(!(Test-Path "$src\$file")){throw "RUN186_MISSING_$file"}
          }
          $main=Get-Content "$src\MainActivity.java" -Raw
          if(!$main.Contains('ROLAR TESTE 1') -or !$main.Contains('ROLAR TESTE 2') -or !$main.Contains('CONSULTAR MESTRE')){throw 'RUN186_ACADEMIC_REGRESSION'}

      - name: Snapshot mechanical authority and apply RUN187
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $pkg="$env:ROOT\android\app\src\main\java\com\braseiro\dnd5e"
          $protected=@('AppDb.java','MasterOrchestrator.java','CharacterRulesValidator.java','CharacterSheetGenerator.java','StrixhavenOfficialCampaignRuntime.java','StrixhavenCompiledCampaignEngine.java','StrixhavenBestiaryRuntimeEngine.java','WorldStateEngine.java')
          $prior=@{}
          foreach($n in $protected){
            if(!(Test-Path "$pkg\$n")){throw "MECHANICAL_SOURCE_MISSING_$n"}
            $prior[$n]=(Get-FileHash "$pkg\$n" -Algorithm SHA256).Hash
          }
          python "$env:GITHUB_WORKSPACE\ci\dnd-run187\patch.py" "$env:ROOT"
          if($LASTEXITCODE -ne 0){throw "RUN187_PATCH_FAILED_$LASTEXITCODE"}
          foreach($n in $protected){
            if((Get-FileHash "$pkg\$n" -Algorithm SHA256).Hash -ne $prior[$n]){throw "RUN187_REGRESSED_MECHANICS_$n"}
          }
          foreach($n in @('DynamicMasterState.java','SpontaneousEventEngine.java','HumanMasterDynamicDirector.java')){
            if(!(Test-Path "$pkg\$n")){throw "RUN187_NEW_CLASS_MISSING_$n"}
          }
          $main=Get-Content "$pkg\MainActivity.java" -Raw
          foreach($required in @('HumanMasterDynamicDirector.instruction(','HumanMasterDynamicDirector.accepted(','HumanMasterDynamicDirector.confirmed(','run187CommittedEnvelope[0]=prepared;')){
            if(!$main.Contains($required)){throw "RUN187_WIRING_MISSING_$required"}
          }
          Write-Host 'RUN187 preserving all sampled mechanical sources byte-for-byte: PASS'

      - name: Version RUN187 and static contracts
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $p="$env:ROOT\version.properties"
          $rows=Get-Content $p
          $hasName=$false;$hasCode=$false
          $rows=@($rows|ForEach-Object{
            if($_ -match '^VERSION_NAME='){$hasName=$true;"VERSION_NAME=$env:VERSION_NAME"}
            elseif($_ -match '^VERSION_CODE='){$hasCode=$true;"VERSION_CODE=$env:VERSION_CODE"}
            else{$_}
          })
          if(!$hasName){$rows+="VERSION_NAME=$env:VERSION_NAME"}
          if(!$hasCode){$rows+="VERSION_CODE=$env:VERSION_CODE"}
          [IO.File]::WriteAllLines($p,$rows,(New-Object Text.UTF8Encoding($false)))
          python "$env:GITHUB_WORKSPACE\ci\dnd-run187\tests\test_contract.py"
          if($LASTEXITCODE -ne 0){throw 'RUN187_STATIC_TESTS_FAILED'}
          $pkg="$env:ROOT\android\app\src\main\java\com\braseiro\dnd5e"
          $official=Get-Content "$pkg\StrixhavenOfficialCampaignRuntime.java" -Raw
          $bestiary=Get-Content "$pkg\StrixhavenBestiaryRuntimeEngine.java" -Raw
          if(([regex]::Matches($official,'e\("y')).Count -ne 44){throw 'STRIXHAVEN_EVENTS_REGRESSED'}
          if(([regex]::Matches($bestiary,'e\("')).Count -ne 44){throw 'STRIXHAVEN_BESTIARY_REGRESSED'}
          $assets="$env:ROOT\android\app\src\main\assets\strixhaven_runtime"
          foreach($chapter in 3..7){if(!(Test-Path "$assets\ch$chapter.txt")){throw "STRIXHAVEN_SOURCE_CH${chapter}_MISSING"}}

      - name: Compile, unit test and assemble on BRELGA
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          if(!(Get-Command java.exe -ErrorAction SilentlyContinue)){
            $j='C:\Program Files\Android\Android Studio\jbr'
            if(Test-Path "$j\bin\java.exe"){$env:JAVA_HOME=$j;$env:Path="$j\bin;$env:Path"}
          }
          if(!$env:ANDROID_HOME){$sdk="$env:LOCALAPPDATA\Android\Sdk";if(Test-Path $sdk){$env:ANDROID_HOME=$sdk}}
          if(!$env:ANDROID_HOME){throw 'ANDROID_SDK_NOT_FOUND'}
          $env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          Set-Location "$env:ROOT\android"
          foreach($task in @(':app:compileDebugJavaWithJavac',':app:testDebugUnitTest',':app:assembleDebug')){
            & .\gradlew.bat $task --no-daemon --console=plain --stacktrace
            if($LASTEXITCODE -ne 0){throw "GRADLE_TASK_FAILED_${task}_$LASTEXITCODE"}
          }

      - name: Validate APK version, signer and package
        shell: powershell
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $out='C:\DND187\out'
          $src=Get-ChildItem "$env:ROOT\android\app\build\outputs\apk\debug" -File -Filter '*.apk' | Select-Object -First 1
          if(!$src){throw 'RUN187_APK_NOT_CREATED'}
          $dst=Join-Path $out $env:APK_NAME
          Copy-Item $src.FullName $dst -Force
          if(!$env:ANDROID_HOME){$sdk="$env:LOCALAPPDATA\Android\Sdk";if(Test-Path $sdk){$env:ANDROID_HOME=$sdk}}
          if(!$env:ANDROID_HOME){throw 'ANDROID_SDK_NOT_FOUND_IN_VALIDATION'}
          if(!(Get-Command java.exe -ErrorAction SilentlyContinue)){
            $j='C:\Program Files\Android\Android Studio\jbr'
            if(Test-Path "$j\bin\java.exe"){$env:JAVA_HOME=$j;$env:Path="$j\bin;$env:Path"}
          }
          if(!(Get-Command java.exe -ErrorAction SilentlyContinue)){throw 'JAVA_NOT_FOUND_IN_VALIDATION'}
          $bt=Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
          if(!$bt){throw 'ANDROID_BUILD_TOOLS_MISSING'}
          $badging=(& "$($bt.FullName)\aapt.exe" dump badging $dst) -join "`n"
          $badging | Set-Content "$out\RUN187_BADGING.txt" -Encoding utf8
          if($badging -notmatch "package: name='com\.braseiro\.dnd5e'"){throw 'BAD_PACKAGE'}
          if($badging -notmatch "versionCode='606487'"){throw 'BAD_VERSION_CODE'}
          if($badging -notmatch "versionName='6\.6\.4-r187-debug'"){throw 'BAD_VERSION_NAME'}
          $sig=(& "$($bt.FullName)\apksigner.bat" verify --verbose --print-certs $dst) -join "`n"
          if($LASTEXITCODE -ne 0){throw 'APK_SIGNATURE_INVALID'}
          $sig | Set-Content "$out\RUN187_SIGNER.txt" -Encoding utf8
          $run186Signer='6AA87A24A2EB4762C3F493C9D5FDDBF10B60CC8659A90423AED7CDE8AE582BD3'
          if($sig -notmatch $run186Signer){throw 'RUN187_SIGNER_DIFFERS_FROM_RUN186_UPDATE_WOULD_FAIL'}
          $sha=(Get-FileHash $dst -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $env:APK_NAME" | Set-Content "$dst.sha256" -Encoding ascii
          @(
            'RUNNER=BRELGA', 'BASELINE=RUN186', 'PROFILE=human_master_dynamic_profile_v2',
            'PACKAGE=com.braseiro.dnd5e',"VERSION_NAME=$env:VERSION_NAME-debug", "VERSION_CODE=$env:VERSION_CODE",
            "APK_SHA256=$sha",'RUN187_JAVAC=PASS','RUN187_GRADLE_UNIT_TASK=PASS_NO_SOURCE','RUN187_ANDROID_ASSEMBLE=PASS',
            'RUN186_PROTECTED_MECHANICAL_SOURCES=PASS','STRIXHAVEN_EVENT_COUNT=44',
            'STRIXHAVEN_BESTIARY_COUNT=44','AUTO_ROLLS=false','RUN187_STATIC_GATE=PASS','DEVICE_TEST=NOT_RUN','RUN186_SIGNER_MATCH=PASS'
          ) | Set-Content "$out\RUN187_BUILD_PROOF.txt" -Encoding utf8
          Get-Item $dst | Format-List Name,Length

      - name: Upload RUN187 APK, checksums and build proof
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_DND_6.6.4_RUN187_BRELGA
          path: |
            C:\DND187\out\BRASEIRO_DND_6.6.4_RUN187_DEBUG.apk
            C:\DND187\out\BRASEIRO_DND_6.6.4_RUN187_DEBUG.apk.sha256
            C:\DND187\out\RUN187_BADGING.txt
            C:\DND187\out\RUN187_SIGNER.txt
            C:\DND187\out\RUN187_BUILD_PROOF.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish RUN187 APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: DND-6.6.4-RUN187
          name: Braseiro DnD 6.6.4 RUN187 — Mestre Humano Dinâmico
          body: >-
            RUN187 adiciona direção narrativa dinâmica, humor contextual, acontecimentos espontâneos
            validados, vozes distintas de NPC e memória narrativa com confirmação transacional.
            Construído no BRELGA sobre a baseline RUN186, preservando regras compiladas,
            Strixhaven, personagens, mundos, relógio, combate e dados em português brasileiro.
          files: |
            C:\DND187\out\BRASEIRO_DND_6.6.4_RUN187_DEBUG.apk
            C:\DND187\out\BRASEIRO_DND_6.6.4_RUN187_DEBUG.apk.sha256
            C:\DND187\out\RUN187_BUILD_PROOF.txt
          fail_on_unmatched_files: true
