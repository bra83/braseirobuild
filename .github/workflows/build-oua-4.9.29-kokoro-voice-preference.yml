name: OUA 4.9.29 Kokoro Voice + Preference

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-oua-4.9.29-kokoro-voice-preference.yml"
      - "ci/oua-4.9.29/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oua-4.9.29-kokoro-voice-preference
  cancel-in-progress: true

env:
  BASE_TAG: "OUA-v4.9.28"
  BASE_APK: "BRASEIRO_O_UM_ANEL_4.9.28_UPDATE.apk"
  BASE_SOURCE: "OUA_4.9.28_UPGRADE_SAFE_ANDROID_STUDIO.zip"
  TAG: "OUA-v4.9.29"
  APK_NAME: "BRASEIRO_O_UM_ANEL_4.9.29_UPDATE.apk"
  SOURCE_NAME: "OUA_4.9.29_UPGRADE_SAFE_ANDROID_STUDIO.zip"

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare 4.9.28 installed-compatible baseline
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA; got $env:RUNNER_NAME" }

          $python = Get-Command python.exe -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command python -ErrorAction Stop }

          $work = Join-Path $env:RUNNER_TEMP 'oua-4929-upgrade'
          $incoming = Join-Path $work 'incoming'
          $extract = Join-Path $work 'extract'
          $out = Join-Path $work 'out'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $incoming,$extract,$out -Force | Out-Null

          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'oua-4929-upgrade-safe'
          }
          $repo = $env:GITHUB_REPOSITORY
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:BASE_TAG"

          foreach ($name in @($env:BASE_APK, $env:BASE_SOURCE)) {
            $asset = @($release.assets | Where-Object { $_.name -eq $name -and $_.state -eq 'uploaded' }) | Select-Object -First 1
            if (-not $asset) { throw "Missing baseline asset: $name" }
            $dest = Join-Path $incoming $name
            & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" -o $dest $asset.url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dest)) { throw "Baseline download failed: $name" }
          }

          & tar.exe -xf (Join-Path $incoming $env:BASE_SOURCE) -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract 4.9.28 source' }

          $pkg = Get-ChildItem $extract -Recurse -File -Filter package.json |
            Where-Object { Test-Path (Join-Path $_.Directory.FullName 'android') } |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1
          if (-not $pkg) { throw '4.9.28 Android Studio root not found' }
          $root = $pkg.Directory.FullName

          $patch = "$env:GITHUB_WORKSPACE\ci\oua-4.9.29\patch.py"
          & $python.Source $patch $root
          if ($LASTEXITCODE -ne 0) { throw '4.9.29 patch failed' }

          $db = Get-Content (Join-Path $root 'lib\db.ts') -Raw
          $gradle = Get-Content (Join-Path $root 'android\app\build.gradle.kts') -Raw
          $manifest = Get-Content (Join-Path $root 'android\app\src\main\AndroidManifest.xml') -Raw
          $whole = (Get-ChildItem $root -Recurse -File -Include *.ts,*.tsx,*.kt,*.java | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"

          $gates = @{
            'same-db-name' = $db.Contains("const DB_NAME = 'braseiro-db';")
            'same-db-version' = $db.Contains('const DB_VERSION = 19;')
            'no-indexeddb-delete' = -not $whole.Contains('indexedDB.deleteDatabase')
            'no-app-data-clear' = (-not $whole.Contains('clearApplicationUserData')) -and (-not $whole.Contains('pm clear'))
            'version-4.9.29' = $gradle.Contains('versionName = "4.9.29"')
            'version-code-49029' = $gradle.Contains('versionCode = 49029')
            'gemini-flow-kept' = $whole.Contains('com.google.android.apps.bard')
            'map-first-shell-kept' = $whole.Contains('data-braseiro-chronicle-sheet')
            'single-master-model-ui' = $whole.Contains('Modelo do Mestre — texto — ID manual') -and (-not $whole.Contains('Texto econômico — ID manual'))
            'manual-tts-model' = $whole.Contains('TTS — ID manual')
            'tts-runtime-override' = $whole.Contains('getGeminiTtsModel') -and $whole.Contains('getTtsModels()')
            'tts-cache-v9' = $whole.Contains('tts-v9-')
            'tts-chunked-prefetch' = $whole.Contains('splitRange(text, 0, text.length, 680)')
            'tts-completeness-guard' = $whole.Contains('minimumCompleteDurationMs')
            'gemini-text-test-control' = $whole.Contains('Testar modelo de texto principal')
            'gemini-tts-test-control' = $whole.Contains('Testar modelo TTS com Charon') -and $whole.Contains('playGeneratedVoice(artifact.token, 1)')
            'single-text-model-runtime' = $whole.Contains('const models = [getGeminiTextModel()];') -and (-not $whole.Contains("getGeminiTextModel('economy')")) -and (-not $whole.Contains("getGeminiTextModel('cinematic')"))
            'opening-no-silent-fallback' = $whole.Contains('Nenhum texto local curto foi usado')
            'opening-rag-safe' = $whole.Contains('abertura narrativa sem regra aplicável')
            'long-master-narration' = $whole.Contains('temperature: 0.78, maxOutputTokens: 6800') -and $whole.Contains('280 a 520 palavras') -and $whole.Contains('Fale como um Mestre sentado à mesa')
            'generation-provenance' = $whole.Contains('generationModel') -and $whole.Contains('generationSource')
            'auto-open-after-start' = $whole.Contains('await props.onStartAdventure();') -and $whole.Contains('startAdventureFromMap')
            'party-always-real-not-footprints' = $whole.Contains('partyMarkerMode="none"') -and -not $whole.Contains('partyMarkerMode={node && props.characters.length ? "none" : "footprints"}')
            'party-current-hex-canonical' = $whole.Contains('const activeHexId = currentHexId || discovery?.currentHexId || null;')
            'party-marker-evidence-hook' = $whole.Contains('data-party-map-marker="true"') -and $whole.Contains('data-party-cluster="true"')
            'current-hex-excludes-route-footprints' = $whole.Contains('if (immersive && activePartyHexId && hex.id === activePartyHexId) return;')
            'party-fallback-visible' = $whole.Contains('FALLBACK_TRAVELER') -and $whole.Contains('visiblePortraits')
            'party-does-not-wait-for-token-hydration' = $whole.Contains('if (!immersive || !activeHexId) return null;')
            'map-redraw-marker-dependencies' = $whole.Contains('currentHexId, discovery') -and $whole.Contains('partyMarkerMode, selected')
            'party-world-coordinates' = $whole.Contains('mapX: hex.centerX, mapY: hex.centerY')
            'party-world-layer-transform' = $whole.Contains('data-party-world-anchored="true"') -and $whole.Contains('translate3d(') -and $whole.Contains('scale(')
            'party-no-screen-space-left-top' = (-not $whole.Contains('currentPartyPresentation.left')) -and (-not $whole.Contains('currentPartyPresentation.top'))
            'party-soft-shadow-no-hard-wings' = $whole.Contains('data-party-soft-shadow="true"')
            'party-base-breathing-room' = $whole.Contains('data-party-base="true"') -and $whole.Contains("width: '98%'") -and $whole.Contains("left: '1%'")
            'story-error-visible' = $whole.Contains('Falha ao iniciar/continuar')
            'map-toast-above-nav' = $whole.Contains('bottom: 92, zIndex: 115')
            'narration-audio-kept' = $whole.Contains('🔊 Ouvir narração') -and $whole.Contains('■ Parar narração')
            'scene-latch-clears-with-existing-node' = $whole.Contains('if (startRequested) setStartRequested(false);') -and $whole.Contains('[props.currentNode, startRequested]')
            'creating-overlay-only-without-node' = $whole.Contains('((startRequested || props.isStoryLoading) && !node)')
            'audio-default-not-number-null' = $whole.Contains("raw == null || raw.trim() === ''") -and $whole.Contains('return DEFAULT_VOLUMES[channel]')
            'voice-default-audible' = $whole.Contains('voice: 1')
            'sensory-master-contract' = $whole.Contains('SENSORIALIDADE')
            'short-narration-repair' = $whole.Contains('softWordMin')
            'fixed-actions-kept' = $whole.Contains('Ações rápidas')
            'npc-entities-kept' = $whole.Contains('NPCs presentes')
            'gemini-network-retry' = $whole.Contains('isTransientGeminiNetworkError') -and $whole.Contains('callGeminiOnce') -and $whole.Contains('repeat(3)')
            'shared-target-native' = $whole.Contains('setSharedImageTarget') -and $whole.Contains('getSharedImageTarget') -and $whole.Contains('KEY_TARGET_JSON')
            'npc-import-verified' = $whole.Contains('verifiedToken') -and $whole.Contains('verifiedNpc')
            'npc-portrait-refresh-event' = $whole.Contains('braseiro-npc-portrait-updated') -and $whole.Contains('npcTokenOverrides')
            'npc-import-fresh-db' = $whole.Contains("const latestNpcs = await getStoreData<Npc>('npcs');")
            'master-repeat-hard-abort-removed' = (-not $whole.Contains('O Mestre devolveu a cena anterior')) -and (-not $whole.Contains('O Gemini devolveu praticamente a mesma narração'))
            'master-repeat-ordered-shingles' = $whole.Contains('function sceneShingleSet') -and $whole.Contains('sceneLooksRepeated')
            'route-execution-button' = $whole.Contains('Avançar 1 hex pela rota') -and $whole.Contains('advancePlannedRoute')
            'route-movement-guidance' = $whole.Contains('Destino distante: Planejar rota')
            'hope-success-die' = $whole.Contains('bonusSuccessDice: 1') -and $whole.Contains('setOneRingSuccessCount(current => current + bonusDice)')
            'hope-inspired-two-dice' = $whole.Contains('inspiredForRoll ? 2 : 1')
            'miserable-roll-enforced' = $whole.Contains('effectiveRollMode, weary, miserable') -and $whole.Contains('miserable')
            'journey-four-roles' = $whole.Contains("['guide','scout','hunter','lookout']")
            'journey-terrain-time' = $whole.Contains('journeyTravelDaysForTerrain') -and $whole.Contains('durationAdjustmentDays')
            'journey-world-clock' = $whole.Contains('advanceWorldClock(state.worldClock') -and $whole.Contains('dayAdjustment*1440')
            'journey-living-world' = $whole.Contains('simulateLivingWorldDetailed(nextState, nextCampaign, nextNpcs, elapsed)')
            'journey-route-estimate' = $whole.Contains('estimatedDays = route.reduce')
            'journey-march-sequence' = $whole.Contains('resolveJourneyMarch') -and $whole.Contains('marchHexesRemaining')
            'journey-event-table' = $whole.Contains('terrible-misfortune') -and $whole.Contains('joyful-sight') -and $whole.Contains('successDiceModifier')
            'journey-dangerous-areas' = $whole.Contains('setDangerousArea') -and $whole.Contains('dangerEventsRemaining')
            'journey-stage-20' = $whole.Contains('slice(0,20)') -and $whole.Contains('stageComplete')
            'journey-mounted-forced' = $whole.Contains('mounted') -and $whole.Contains('forcedMarch') -and $whole.Contains('Math.ceil(hexes/2)')
            'journey-end-fatigue-roll' = $whole.Contains('mountVigour') -and $whole.Contains('successIcons')
            'council-resistance-time-limit' = $whole.Contains('council.timeLimit = resistance + (success ? icons : 0)')
            'council-no-failure-tolerance' = (-not $whole.Contains('council.failures >= council.tolerance'))
            'fellowship-hope-heart' = $whole.Contains('next.attributes.hopeCurrent = Math.min(next.attributes.hopeMax, next.attributes.hopeCurrent + Math.max(0, Number(next.attributes.heart)')
            'fellowship-yule' = $whole.Contains('isYule') -and $whole.Contains('next.resources.skillPoints') -and $whole.Contains('next.attributes.wits')
            'progression-costs' = $whole.Contains('1:4,2:8,3:12,4:20,5:26,6:30')
            'progression-phase-limits' = $whole.Contains('skillAdvances') -and $whole.Contains('combatAdvances') -and $whole.Contains('valorWisdomAdvance')
            'shadow-full-cycle' = $whole.Contains('resolveShadowGain') -and $whole.Contains('firmWill') -and $whole.Contains('resolveBoutOfMadness') -and $whole.Contains('shadowScars')
            'equipment-derived' = $whole.Contains('normalizeEquipmentMechanics') -and $whole.Contains('protectionBonus') -and $whole.Contains('Math.ceil(load/2)')
            'equipment-rewards' = $whole.Contains('Afiada') -and $whole.Contains('Ajustado') -and $whole.Contains('Fabricação Habilidosa') -and $whole.Contains('Cruel') -and $whole.Contains('Atroz') -and $whole.Contains('Reforçado')
            'combat-canonical-attack' = $whole.Contains('rollHeroAttack') -and $whole.Contains('heroAttackDamage') -and $whole.Contains('rollHeroProtection')
            'combat-wound-dying' = $whole.Contains('second-wound') -and $whole.Contains('woundSeverity') -and $whole.Contains('dying')
            'combat-first-aid' = $whole.Contains('resolveFirstAid') -and $whole.Contains('lastFirstAidSuccessDay')
            'combat-rearward' = $whole.Contains('rearwardAllowed') -and $whole.Contains('povo pequeno')
            'council-real-roll-linked' = $whole.Contains('resultado mecânico do Conselho') -and $whole.Contains("type: 'record_council_result'")
            'mechanics-hub' = $whole.Contains('MechanicsHub') -and $whole.Contains('CombatRulesPanel')
            'safe-refuge-fatigue' = $whole.Contains('command.safeRefuge') -and $whole.Contains('next.attributes.fatigue = Math.max(0, next.attributes.fatigue - 1)')
            'rest-command' = $whole.Contains("type: 'resolve_rest'") -and $whole.Contains("case 'resolve_rest'")
            'short-rest-strength' = $whole.Contains("if (!next.attributes.wounded)") -and $whole.Contains("enduranceCurrent + strength + cramWisdom")
            'short-rest-hour' = $whole.Contains("const restMinutes = command.kind === 'short' ? 60 : 480;") -and $whole.Contains('advanceWorldClock(nextState.worldClock, restMinutes)')
            'long-rest-full' = $whole.Contains("next.attributes.enduranceCurrent = next.attributes.enduranceMax")
            'long-rest-zero-hope' = $whole.Contains("next.attributes.hopeCurrent <= 0") -and $whole.Contains("hopeCurrent = Math.min(next.attributes.hopeMax, 1)")
            'rest-daily-limit' = $whole.Contains("lastShortRestDayKey") -and $whole.Contains("lastLongRestDayKey")
            'rest-wired-app' = $whole.Contains("onPartyRested={handlePartyRested}")
            'rest-handler-defined' = $whole.Contains("const handlePartyRested = async (kind: 'short' | 'long') => {")
            'rest-explicit-ui' = $whole.Contains("Descanso Curto") -and $whole.Contains("Descanso Prolongado")
            'rest-no-visual-fatigue-clear' = (-not $whole.Contains("sincronização visual após descanso"))
            'atlas-auto-start-journey' = $whole.Contains('Rota planejada no Atlas: Jornada iniciada automaticamente.')
            'atlas-auto-first-march' = $whole.Contains('Primeira Jogada de Marcha automática do Guia')
            'atlas-auto-event' = $whole.Contains('Evento de Jornada disparado no hex') -and $whole.Contains('resolve_journey_event')
            'atlas-auto-next-march' = $whole.Contains('Nova Jogada de Marcha automática após Evento/etapa.')
            'atlas-auto-end-journey' = $whole.Contains('Destino alcançado: encerrar Jornada')
            'atlas-new-master-scene' = $whole.Contains('TRECHO DE JORNADA JÁ RESOLVIDO PELO MOTOR')
            'atlas-clears-stale-npcs' = $whole.Contains('presentNpcIds: []') -and $whole.Contains('presentInScene: false')
            'hud-day-number' = $whole.Contains('Dia ${props.masterState.worldClock.day}')
            'calendar-hard-contract' = $whole.Contains('Calendário canônico: ano') -and $whole.Contains('nunca mencione outra estação')
            'journey-day-event' = $whole.Contains('journey_day_completed')
            'journey-residual-fatigue-warning' = $whole.Contains('Fadiga residual') -and $whole.Contains('refúgio protegido e seguro')
            'tts-installed-engines-dynamic' = $whole.Contains('getTtsCatalog') -and $whole.Contains('engines.orEmpty()') -and $whole.Contains('selectTtsEngine')
            'tts-package-visibility-query' = $manifest.Contains('android.intent.action.TTS_SERVICE')
            'tts-sherpa-package-visible' = $manifest.Contains('com.k2fsa.sherpa.onnx.tts.engine')
            'tts-merged-engine-discovery' = $whole.Contains('discoverTtsEngines') -and $whole.Contains('queryIntentServices') -and $whole.Contains('isInstalledTtsEnginePackage')
            'tts-installed-voices-dynamic' = $whole.Contains('selectTtsVoice') -and $whole.Contains('Voz do motor selecionado')
            'tts-voice-bridge-qualified' = $whole.Contains('this@MainActivity.selectTtsVoice(voiceName)')
            'tts-rate-bridge-qualified' = $whole.Contains('this@MainActivity.setNeuralTtsRate(rate.toFloat())')
            'tts-neural-first-block-flush-only' = $whole.Contains('if(neural&&p.index>0)TextToSpeech.QUEUE_ADD else TextToSpeech.QUEUE_FLUSH')
            'tts-narration-backend-preference' = $whole.Contains('braseiro.narrationVoiceBackend') -and $whole.Contains('Kokoro · TTS local selecionado') -and $whole.Contains('Charon · Gemini TTS')
            'tts-kokoro-profile' = $whole.Contains('com.k2fsa.sherpa.onnx.tts.engine') -and $whole.Contains('TTS local neural / Kokoro')
            'tts-kokoro-chunk-range' = $whole.Contains('neuralMinChars = 250') -and $whole.Contains('neuralTargetChars = 450') -and $whole.Contains('neuralMaxChars = 650')
            'tts-kokoro-punctuation-first' = $whole.Contains("setOf('.','!','?')") -and $whole.Contains("setOf(';',',')")
            'tts-kokoro-queue-add' = $whole.Contains('if(neural&&p.index>0)TextToSpeech.QUEUE_ADD else TextToSpeech.QUEUE_FLUSH')
            'tts-kokoro-on-done-chain' = $whole.Contains('override fun onDone') -and $whole.Contains('advanceSpeechQueue(p.rootId)')
            'tts-kokoro-no-watchdog' = $whole.Contains('if(isNeuralTtsProfile())return')
            'tts-kokoro-profile-values' = $whole.Contains('putInt("maxNumSentences",2)') -and $whole.Contains('putFloat("silenceScale",.06f)') -and $whole.Contains('putInt("numThreads",4)')
            'tts-kokoro-prewarm' = $whole.Contains('prewarmNeuralTts') -and $whole.Contains('prewarmTts')
            'tts-kokoro-prime-silence-removed' = (-not $whole.Contains('playSilentUtterance(50L,TextToSpeech.QUEUE_ADD'))
            'tts-kokoro-neutral-rate' = $whole.Contains('speechRate=if(neural)neuralTtsRate else rate.coerceIn') -and $whole.Contains('1.00× = velocidade neutra')
            'tts-normal-android-preserved' = $whole.Contains('NarrationSegmenter.splitForAndroidTts(chapter,180.coerceAtMost(max))')
            'long-rest-advances-eight-hours' = $whole.Contains("const restMinutes = command.kind === 'short' ? 60 : 480;")
            'long-rest-advances-world-clock' = $whole.Contains('advanceWorldClock(nextState.worldClock, restMinutes)')
            'long-rest-advances-living-world' = $whole.Contains('simulateLivingWorldDetailed(nextState, nextCampaign, nextNpcs, restMinutes)')
            'long-rest-legacy-stamp-heal' = $whole.Contains('legacyLongRestStamp') -and $whole.Contains('lastLongRestWorldMinute')
            'long-rest-stamps-end-day' = $whole.Contains("command.kind === 'long' ? endDayKey : startDayKey")
          }

          $validation = Join-Path $out 'UPGRADE_COMPATIBILITY_SOURCE.txt'
          foreach ($entry in $gates.GetEnumerator() | Sort-Object Name) {
            $status = if ($entry.Value) { 'PASS' } else { 'FAIL' }
            ($status + ' - ' + $entry.Name) | Tee-Object -FilePath $validation -Append
          }
          if (@($gates.GetEnumerator() | Where-Object { -not $_.Value }).Count -gt 0) { throw 'Upgrade-safety source gate failed' }

          $lockPath = Join-Path $root 'package-lock.json'
          if (Test-Path $lockPath) {
            $lockText = Get-Content $lockPath -Raw
            $lockText = [regex]::Replace($lockText, 'https://[^"]*/artifactory/api/npm/npm-public/', 'https://registry.npmjs.org/')
            [System.IO.File]::WriteAllText($lockPath, $lockText, (New-Object System.Text.UTF8Encoding($false)))
          }

          "OUA_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OUA_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BASE_APK_PATH=$(Join-Path $incoming $env:BASE_APK)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build web runtime
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:OUA_ROOT
          try {
            $env:npm_config_registry = 'https://registry.npmjs.org/'
            $env:npm_config_replace_registry_host = 'always'
            $env:npm_config_fetch_retries = '5'
            $ok = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              & npm.cmd ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds (3 * $attempt)
            }
            if (-not $ok) { throw 'npm ci failed' }

            $previousErrorAction = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
            & npm.cmd run build:offline 2>&1 | Tee-Object -FilePath (Join-Path $env:OUA_OUT 'OFFLINE_BUILD.log')
            $offlineExit = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorAction
            if ($offlineExit -ne 0) { throw "build:offline failed with exit code $offlineExit" }

            & node.exe scripts/use-offline-dist.mjs
            if ($LASTEXITCODE -ne 0) { throw 'use-offline-dist failed' }
            & node.exe scripts/sync-android-assets.mjs
            if ($LASTEXITCODE -ne 0) { throw 'sync-android-assets failed' }
          } finally { Pop-Location }

      - name: Configure Android SDK
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $sdkRoot = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sdkRoot) { throw 'Android SDK not found' }
          $sdkmanager = Get-ChildItem $sdkRoot -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdkmanager) { throw 'sdkmanager.bat not found' }
          $env:ANDROID_HOME = $sdkRoot
          $env:ANDROID_SDK_ROOT = $sdkRoot
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          1..100 | ForEach-Object { 'y' } | & $sdkmanager.FullName --licenses | Out-Null
          & $sdkmanager.FullName 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed' }

      - name: Build update APK and verify install-over compatibility
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $android = Join-Path $env:OUA_ROOT 'android'
          Push-Location $android
          try {
            $previous = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
            & .\gradlew.bat clean :app:assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath (Join-Path $env:OUA_OUT 'GRADLE_BUILD.log')
            $exit = $LASTEXITCODE
            $ErrorActionPreference = $previous
            if ($exit -ne 0) { throw "Gradle failed: $exit" }
          } finally { Pop-Location }

          $apk = Get-ChildItem (Join-Path $android 'app\build\outputs\apk\debug') -File -Filter '*.apk' | Select-Object -First 1
          if (-not $apk) { throw '4.9.29 APK not found' }
          $newApk = Join-Path $env:OUA_OUT $env:APK_NAME
          Copy-Item $apk.FullName $newApk -Force

          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory |
            Sort-Object { [version]($_.Name -replace '[^0-9.]','') } -Descending |
            Select-Object -First 1
          if (-not $buildTools) { throw 'build-tools missing' }
          $aapt = Join-Path $buildTools.FullName 'aapt.exe'
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'

          & $aapt dump badging $env:BASE_APK_PATH | Tee-Object -FilePath (Join-Path $env:OUA_OUT 'BASE_APK_BADGING.txt')
          & $aapt dump badging $newApk | Tee-Object -FilePath (Join-Path $env:OUA_OUT 'NEW_APK_BADGING.txt')
          $baseBadging = Get-Content (Join-Path $env:OUA_OUT 'BASE_APK_BADGING.txt') -Raw
          $newBadging = Get-Content (Join-Path $env:OUA_OUT 'NEW_APK_BADGING.txt') -Raw

          if ($baseBadging -notmatch "package: name='com\.braseiro\.oumanel'") { throw 'Baseline package differs' }
          if ($newBadging -notmatch "package: name='com\.braseiro\.oumanel'") { throw 'New package differs' }
          if ($baseBadging -notmatch "versionCode='49028'") { throw 'Baseline versionCode is not 49028' }
          if ($newBadging -notmatch "versionCode='49029'") { throw 'New versionCode is not 49029' }

          & $apksigner verify --verbose --print-certs $env:BASE_APK_PATH 2>&1 | Tee-Object -FilePath (Join-Path $env:OUA_OUT 'BASE_APK_SIGNATURE.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Baseline APK signature invalid' }
          & $apksigner verify --verbose --print-certs $newApk 2>&1 | Tee-Object -FilePath (Join-Path $env:OUA_OUT 'NEW_APK_SIGNATURE.txt')
          if ($LASTEXITCODE -ne 0) { throw 'New APK signature invalid' }

          $baseSig = (Get-Content (Join-Path $env:OUA_OUT 'BASE_APK_SIGNATURE.txt') | Where-Object { $_ -match 'certificate SHA-256 digest:' } | Select-Object -First 1)
          $newSig = (Get-Content (Join-Path $env:OUA_OUT 'NEW_APK_SIGNATURE.txt') | Where-Object { $_ -match 'certificate SHA-256 digest:' } | Select-Object -First 1)
          if (-not $baseSig -or -not $newSig) { throw 'Could not read signer SHA-256' }
          $baseDigest = ($baseSig -replace '.*digest:\s*','').Trim().ToLowerInvariant()
          $newDigest = ($newSig -replace '.*digest:\s*','').Trim().ToLowerInvariant()
          if ($baseDigest -ne $newDigest) { throw "SIGNATURE MISMATCH: installed update would fail. base=$baseDigest new=$newDigest" }

          @(
            'PASS - same applicationId com.braseiro.oumanel',
            'PASS - versionCode increased 49028 -> 49029',
            'PASS - signing certificate SHA-256 unchanged',
            'PASS - IndexedDB name unchanged: braseiro-db',
            'PASS - IndexedDB schema version unchanged: 19',
            'PASS - no automatic app-data clearing code detected',
            'RESULT - APK is eligible for Android install-over update without uninstalling the existing app.'
          ) | Set-Content (Join-Path $env:OUA_OUT 'INSTALL_OVER_EXISTING_APP.txt') -Encoding utf8

          $hash = (Get-FileHash $newApk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:APK_NAME" | Set-Content "$newApk.sha256" -Encoding ascii

      - name: Package upgrade-safe source
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item (Join-Path $env:OUA_ROOT 'node_modules') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:OUA_ROOT 'android\.gradle') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:OUA_ROOT 'android\build') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:OUA_ROOT 'android\app\build') -Recurse -Force -ErrorAction SilentlyContinue
          $zip = Join-Path $env:OUA_OUT $env:SOURCE_NAME
          $parent = Split-Path $env:OUA_ROOT -Parent
          $leaf = Split-Path $env:OUA_ROOT -Leaf
          & tar.exe -a -c -f $zip -C $parent $leaf
          if ($LASTEXITCODE -ne 0) { throw 'Source ZIP failed' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:SOURCE_NAME" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Publish upgrade-safe release
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'oua-499-upgrade-safe'
          }

          try {
            $old = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$env:TAG"
            if ($old.id) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($old.id)" | Out-Null }
          } catch {}

          $payload = @{
            tag_name = $env:TAG
            target_commitish = $env:GITHUB_SHA
            name = 'Braseiro O Um Anel 4.9.29 - KOKORO VOZ + PREFERENCIA'
            body = 'Upgrade-safe update over validated 4.9.28. Fixes the Android bridge recursion that prevented selecting a Kokoro voice, clears stale/prewarm queue only before neural block 0 while preserving QUEUE_ADD between later blocks and real onDone chaining, and adds a persistent user choice between Charon/Gemini TTS and Kokoro/local TTS for the main narration button. Engine discovery, mechanics, package, signer and database identity are preserved.'
            draft = $false
            prerelease = $false
          } | ConvertTo-Json
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
          $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $payloadBytes -Uri "https://api.github.com/repos/$repo/releases"
          if (-not $release.id) { throw 'Release creation failed' }

          foreach ($file in Get-ChildItem $env:OUA_OUT -File) {
            $encoded = [uri]::EscapeDataString($file.Name)
            $url = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encoded"
            & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors --request POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/octet-stream" --data-binary "@$($file.FullName)" $url
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $($file.Name)" }
          }
          Write-Host "RELEASE_URL=$($release.html_url)"

