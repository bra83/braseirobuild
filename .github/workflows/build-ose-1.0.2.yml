name: Build BRASEIRO OSE 1.0.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ose-1.0.2.yml"
      - "OSE_1_0_2_TRIGGER.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout braseirobuild
        uses: actions/checkout@v4

      - name: Setup Python downloader
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact 1.0.2 patch
        env:
          PATCH_SHARE: https://firestorage.ai/ja/f/GaQ9ovFx_0SU
          PATCH_SHA: 3b928926498595e4a9f13771dc7c8cf314f68d16c48b0d68b0f4957cf2aef8ca
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os, pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('/tmp/ose-1.0.2.patch')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(accept_downloads=True)
              page.goto(os.environ['PATCH_SHARE'], wait_until='domcontentloaded', timeout=120000)
              page.wait_for_timeout(3500)
              for label in ['Accept','Aceitar','同意する','OK']:
                  try:
                      loc=page.get_by_text(label, exact=True)
                      if loc.count() and loc.first.is_visible(): loc.first.click(timeout=1200)
                  except Exception: pass
              done=False
              for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
                  try:
                      loc=page.locator(sel).first
                      if not loc.count() or not loc.is_visible(): continue
                      with page.expect_download(timeout=120000) as info: loc.click(timeout=10000)
                      info.value.save_as(str(out)); done=True; break
                  except Exception: pass
              if not done:
                  card=page.get_by_text('BRASEIRO_OSE_1_0_2.patch', exact=False).first
                  parent=card.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
                  with page.expect_download(timeout=120000) as info: parent.locator('a,button').last.click(timeout=10000)
                  info.value.save_as(str(out)); done=True
              browser.close()
          if not done or not out.exists(): raise SystemExit('patch download failed')
          PY
          echo "$PATCH_SHA  /tmp/ose-1.0.2.patch" | sha256sum -c -

      - name: Apply 1.0.2 patch
        run: |
          set -euo pipefail
          if git apply --check /tmp/ose-1.0.2.patch; then
            git apply /tmp/ose-1.0.2.patch
          elif git apply --reverse --check /tmp/ose-1.0.2.patch; then
            echo 'Patch already applied; continuing.'
          else
            echo '::error::OSE 1.0.2 patch does not apply cleanly'
            exit 1
          fi
          grep -q 'versionName = "1.0.2"' ose/1.0.0/source/app-android/build.gradle.kts
          grep -q 'RECOMEÇAR A AVENTURA' ose/1.0.0/source/web-ui-p1/index.html
          grep -q 'CRIAR PERSONAGEM ALEATÓRIO' ose/1.0.0/source/web-ui-p1/p1.js
          grep -q 'Regras consultadas nesta ação' ose/1.0.0/source/web-ui-p1/p1.js
          grep -q 'android:icon="@mipmap/ic_launcher"' ose/1.0.0/source/app-android/src/main/AndroidManifest.xml
          node --check ose/1.0.0/source/web-ui-p1/p1.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and compile APK
        working-directory: ose/1.0.0/source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app-android:testDebugUnitTest :app-android:assembleDebug --stacktrace --no-daemon

      - name: Validate and publish 1.0.2
        run: |
          set -euo pipefail
          APK="$(find ose/1.0.0/source/app-android/build/outputs/apk/debug -type f -name '*.apk' | sort | head -n1)"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p build-artifacts/ose/1.0.2
          cp "$APK" build-artifacts/ose/1.0.2/BRASEIRO_OSE_1_0_2_DEBUG.apk
          sha256sum build-artifacts/ose/1.0.2/BRASEIRO_OSE_1_0_2_DEBUG.apk | tee build-artifacts/ose/1.0.2/BRASEIRO_OSE_1_0_2_DEBUG.sha256
          stat -c 'size_bytes=%s' build-artifacts/ose/1.0.2/BRASEIRO_OSE_1_0_2_DEBUG.apk | tee build-artifacts/ose/1.0.2/BRASEIRO_OSE_1_0_2_DEBUG.info.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ose/1.0.0/source build-artifacts/ose/1.0.2
          if ! git diff --cached --quiet; then
            git commit -m 'BRASEIRO OSE 1.0.2: reset, rule audit, tabs, map and Android insets'
            git push origin HEAD:main
          fi

      - name: Summary
        run: |
          {
            echo '## BRASEIRO OSE 1.0.2'
            echo '- Recomeçar aventura com confirmação e checkpoint.'
            echo '- Regras consultadas com fonte/página por ação.'
            echo '- Personagem aleatório + importar/exportar ficha.json.'
            echo '- Abas Dados, Biblioteca e Mundo Vivo.'
            echo '- Fog-of-war de mapa sem placeholders de interrogação.'
            echo '- Insets Android e ícone de launcher.'
            cat build-artifacts/ose/1.0.2/BRASEIRO_OSE_1_0_2_DEBUG.sha256
          } >> "$GITHUB_STEP_SUMMARY"
