name: Fix Star Wars R54 Supplement Species Runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "star-wars/r54/fix_supplement_species_runtime.py"
      - ".github/workflows/fix-star-wars-r54-supplement-species.yml"
permissions: {contents: write}
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: root
        name: Recover canonical R54 and apply supplement species fix
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip
          test -f "$ZIP"
          rm -rf supplement-work && mkdir supplement-work
          unzip -q "$ZIP" -d supplement-work
          SET="$(find supplement-work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"
          test -n "$SET"; ROOT="$(dirname "$SET")"
          python3 -m py_compile star-wars/r54/fix_supplement_species_runtime.py
          python3 star-wars/r54/fix_supplement_species_runtime.py "$ROOT" | tee /tmp/SUPPLEMENT_SPECIES_FIX.txt
          grep -q 'R54_SUPPLEMENTS_SPECIES_PASS species=51 EOTE=32 AOR=25 books=16' /tmp/SUPPLEMENT_SPECIES_FIX.txt
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Static and module gates
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          V="$ROOT/app/src/main/assets/vtt"
          node --check "$V/r46/final-runtime.js"
          node --check "$V/js/reference/speciesCreationReferenceIntegration.mjs"
          grep -Fq 'R54_SUPPLEMENT_SPECIES_REFERENCE' "$V/r46/final-runtime.js"
          grep -Fq 'BraseiroSupplementReference' "$V/r46/final-runtime.js"
          python3 - "$V" <<'PY'
          import json,sys
          from pathlib import Path
          v=Path(sys.argv[1]); d=json.loads((v/'js/reference/speciesCreationReferenceCatalog.json').read_text('utf-8'))
          assert len(d)==51
          assert sum('EOTE' in x.get('activeLines',[]) for x in d)==32
          assert sum('AOR' in x.get('activeLines',[]) for x in d)==25
          books={r['citation'].split(' p.')[0].strip().rstrip(',') for x in d for r in x.get('references',[]) if r.get('line') in ('EOTE','AOR')}
          assert len(books)==16,books
          def find(mode,q):
            q=q.casefold();return [x for x in d if (mode=='MIXED' or mode in x.get('activeLines',[])) and q in (' '.join([x.get('name','')]+[r.get('citation','') for r in x.get('references',[]) if r.get('line') in ('EOTE','AOR')])).casefold()]
          assert len(find('AOR','Forged in Battle'))>=3
          assert len(find('EOTE','Lords of Nal Hutta'))>=3
          assert not any(x.get('key')=='rodian' for x in find('AOR','Rodian'))
          print('R54_SUPPLEMENT_STATIC_PASS')
          PY
      - name: Browser runtime gate 415x915
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8765 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/r54-supp-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915})
            pg.goto('http://127.0.0.1:8765/r46-shell.html?screen=06',wait_until='networkidle',timeout=120000);pg.wait_for_timeout(1000)
            cov=pg.evaluate('window.BraseiroSupplementReference.coverage()')
            assert cov['uniqueSpecies']==51,cov
            assert cov['byLine']=={'EOTE':32,'AOR':25},cov
            assert len(cov['books'])==16,cov
            assert pg.evaluate("window.BraseiroSupplementReference.speciesForMode('AOR','Forged in Battle').then(x=>x.length)")>=3
            assert pg.evaluate("window.BraseiroSupplementReference.speciesForMode('EOTE','Lords of Nal Hutta').then(x=>x.length)")>=3
            assert pg.evaluate("window.BraseiroSupplementReference.speciesForMode('AOR','Rodian').then(x=>x.some(v=>v.key==='rodian'))") is False
            assert pg.locator('[data-r54-supplement-species]').count()==1
            b.close()
          print('R54_SUPPLEMENT_BROWSER_PASS')
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', validate-wrappers: false}
      - name: Configure Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build patched R54 APK
        working-directory: ${{ steps.root.outputs.path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Persist patched canonical R54
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          OUT=star-wars/final-1.0.0/output-r54
          TMP="$(mktemp -d)"
          APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n1)"; test -f "$APK"
          cp "$APK" "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk"
          unzip -t "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk" >/dev/null
          (cd "$ROOT" && zip -qr "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip" . -x '*/build/*' '.gradle/*')
          sha256sum "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk" > "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk.sha256"
          sha256sum "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip" > "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip.sha256"
          git config user.name github-actions; git config user.email github-actions@github.com
          git pull --rebase origin main
          mkdir -p "$OUT"
          cp "$TMP"/* "$OUT"/
          printf '%s\n' 'R54_SUPPLEMENTS_SPECIES_PASS species=51 EOTE=32 AOR=25 books=16' > "$OUT/SUPPLEMENT_SPECIES_2026-09-16.txt"
          git add -f "$OUT"
          git commit -m 'build: persist R54 supplement species runtime' || true
          git push origin HEAD:main
