name: Publish GURPS Marrone import-fix APK to private Google Drive
on:
  push:
    paths:
      - '.github/workflows/publish-gurps-marrone-import-fix-drive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy-apk:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Verify BRELGA compiled APK and copy to private Drive
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'RUNNER_NOT_BRELGA'}
          $apk=Join-Path $env:GITHUB_WORKSPACE 'gurps-apk-output\BRASEIRO_GURPS_10.8.0_MOTOR_VIDA_V2_TTS_V3_DEBUG.apk'
          if(!(Test-Path -LiteralPath $apk)){throw 'VERIFIED_APK_MISSING'}
          $sha=(Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '1a560072d3e62e7fbd8722ec0e1ab98f2694592b3f4c7428537afedb0d339bf6'){throw 'APK_SHA_MISMATCH'}
          $destinations=@('G:\My Drive\BRASEIRO_GURPS_CHECKPOINTS','G:\Meu Drive\BRASEIRO_GURPS_CHECKPOINTS','G:\Google Drive\My Drive\BRASEIRO_GURPS_CHECKPOINTS')
          $folder=$destinations | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1
          if(!$folder){throw 'GURPS_PRIVATE_DRIVE_FOLDER_NOT_MOUNTED'}
          $out=Join-Path $folder 'BRASEIRO_GURPS_10.8.0_KOKORO_SELETOR_VISIVEL_V8_20261022.apk'
          Copy-Item -LiteralPath $apk -Destination $out -Force
          $copied=(Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash.ToLowerInvariant()
          if($copied -ne $sha){throw 'PRIVATE_DRIVE_APK_SHA_MISMATCH'}
          Write-Output "PRIVATE_DRIVE_APK_COPIED=$out"
          Write-Output "APK_SHA256=$sha"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "APK publicado no Google Drive privado: BRASEIRO_GURPS_10.8.0_KOKORO_SELETOR_VISIVEL_V8_20261022.apk. SHA256 $sha."
