name: Braseiro O Um Anel 4.9.6 Gemini Start POI Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oua-4.9.6-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_TAG: 'OUA-v4.9.5'
  BASE_SOURCE: 'OUA_4.9.5_ATLAS_RECOVERY_ANDROID_STUDIO.zip'
  PATCH_SHARE: 'https://firestorage.ai/ja/f/quxaqjksLmgT'
  TAG: 'OUA-v4.9.6'
  SOURCE_NAME: 'OUA_4.9.6_GEMINI_START_POI_FIX_ANDROID_STUDIO.zip'
  APK_NAME: 'BRASEIRO_O_UM_ANEL_4.9.6_DEBUG.apk'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Download exact 4.9.5 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming work out release-src /tmp/oua496-patch
          mkdir -p incoming work out /tmp/oua496-patch
          gh release download "$BASE_TAG" --pattern "$BASE_SOURCE" --dir incoming
          unzip -t "incoming/$BASE_SOURCE" >/dev/null
          unzip -q "incoming/$BASE_SOURCE" -d work
          ROOT="$(dirname "$(find work -maxdepth 5 -type f -name package.json | head -n1)")"
          test -n "$ROOT"
          test -f "$ROOT/package.json"
          test -d "$ROOT/android"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Download 4.9.6 patch
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/oua496-patch
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const [url,out] = process.argv.slice(2);
          const browser = await chromium.launch({headless:true});
          const ctx = await browser.newContext({acceptDownloads:true, locale:'ja-JP'});
          const page = await ctx.newPage();
          async function openShare() {
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2000);
          }
          async function attempt() {
            const candidates = page.locator('a,button,[role="button"],input[type="submit"]');
            const n = Math.min(await candidates.count(),160);
            for (let i=0;i<n;i++) {
              const el = candidates.nth(i);
              let text='',href='',aria='',title='';
              try{text=((await el.innerText({timeout:300}))||'').trim()}catch{}
              try{href=(await el.getAttribute('href'))||''}catch{}
              try{aria=(await el.getAttribute('aria-label'))||''}catch{}
              try{title=(await el.getAttribute('title'))||''}catch{}
              if(!/download|ダウンロード|保存|python|\.py|ファイル/i.test(text+' '+href+' '+aria+' '+title)) continue;
              try {
                const pending = page.waitForEvent('download',{timeout:10000});
                await el.click({timeout:5000});
                const d = await pending;
                await d.saveAs(out);
                return true;
              } catch {}
            }
            return false;
          }
          await openShare();
          let done=false;
          for(let i=0;i<20;i++) {
            if(await attempt()){done=true;break}
            await page.waitForTimeout(2500);
            if(i%5===4) await openShare();
          }
          await browser.close();
          if(!done || !fs.existsSync(out) || fs.statSync(out).size<5000) throw new Error('patch download failed');
          console.log('PATCH_OK',fs.statSync(out).size);
          NODE
          node download.mjs "$PATCH_SHARE" "$GITHUB_WORKSPACE/incoming/patch-oua-4.9.6.py"
          python3 -m py_compile "$GITHUB_WORKSPACE/incoming/patch-oua-4.9.6.py"
          sha256sum "$GITHUB_WORKSPACE/incoming/patch-oua-4.9.6.py" | tee "$GITHUB_WORKSPACE/out/PATCH_SHA256.txt"

      - name: Apply 4.9.6 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 incoming/patch-oua-4.9.6.py "$ROOT" | tee out/PATCH_GATE.txt
          grep -q 'PATCH_OUA_4.9.6_OK' out/PATCH_GATE.txt
          grep -q '"version": "4.9.6"' "$ROOT/package.json"
          grep -q 'versionName = "4.9.6"' "$ROOT/android/app/build.gradle.kts"
          grep -q 'Modelo de texto do Mestre' "$ROOT/components/SettingsView.tsx"
          grep -q 'A crônica não iniciou' "$ROOT/components/immersive/ImmersiveJourneyView.tsx"
          grep -q 'reconciliação automática antes de iniciar a crônica' "$ROOT/App.tsx"
          grep -q 'Ilustração do local atual' "$ROOT/components/EriadorMap.tsx"

      - name: Validate POI illustration catalog
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          node <<'NODE' | tee "$GITHUB_WORKSPACE/out/POI_ILLUSTRATION_GATE.txt"
          const fs=require('fs');
          const p='public/tor2e-ui/asset-manifest.json';
          if(!fs.existsSync(p)) throw new Error('asset-manifest ausente');
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          const poi=Object.keys(m.poi||{});
          const byHex=Object.keys(m.poiByHex||{});
          if(poi.length<100) throw new Error('catálogo POI insuficiente: '+poi.length);
          if(byHex.length<1) throw new Error('poiByHex vazio');
          console.log('PASS poi entries='+poi.length+' poiByHex='+byHex.length);
          NODE

      - name: Rebuild offline runtime and regression gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm install --ignore-scripts --no-save --package-lock=false typescript@5.8.3
          npm run build:offline 2>&1 | tee "$GITHUB_WORKSPACE/out/OFFLINE_BUILD.log"
          node scripts/use-offline-dist.mjs
          node scripts/sync-android-assets.mjs
          node --experimental-vm-modules scripts/test-android-module-graph.mjs | tee "$GITHUB_WORKSPACE/out/ANDROID_MODULE_GRAPH.txt"
          if [ -f scripts/test-atlas-campaign-recovery-4.9.5.mjs ]; then
            node scripts/test-atlas-campaign-recovery-4.9.5.mjs | tee "$GITHUB_WORKSPACE/out/ATLAS_RECOVERY_495_REGRESSION.txt"
          fi
          if [ -f scripts/test-poi-atlas-4.6.1.mjs ]; then
            node scripts/test-poi-atlas-4.6.1.mjs | tee "$GITHUB_WORKSPACE/out/POI_ATLAS_REGRESSION.txt"
          fi
          if [ -f scripts/test-party-assets-4.7.0.mjs ]; then
            node scripts/test-party-assets-4.7.0.mjs | tee "$GITHUB_WORKSPACE/out/PARTY_ASSETS_REGRESSION.txt"
          fi

      - name: Package 4.9.6 Android Studio source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-src
          cp -a "$ROOT" release-src/OUA496
          rm -rf release-src/OUA496/node_modules release-src/OUA496/android/.gradle release-src/OUA496/android/app/build
          (cd release-src && zip -qr "../out/$SOURCE_NAME" OUA496)
          unzip -t "out/$SOURCE_NAME" >/dev/null
          sha256sum "out/$SOURCE_NAME" > "out/$SOURCE_NAME.sha256"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build 4.9.6 debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$ROOT/android/gradlew"
          cd "$ROOT/android"
          ./gradlew clean :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" > "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.oumanel'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "versionName='4.9.6'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null

      - name: Write validation summary
        shell: bash
        run: |
          cat > out/VALIDACAO_OUA_4.9.6.txt <<'EOF'
          Braseiro O Um Anel 4.9.6
          PASS — baseline 4.9.5 preservada
          PASS — divergência masterState.position.currentHexId x MapDiscovery reconciliada no início
          PASS — erro de início visível na UI imersiva
          PASS — painel de crônica só abre após existir a primeira cena
          PASS — configuração persistente de modelo Gemini adicionada
          PASS — fallback de modelos de texto preservado
          PASS — nova crônica preserva Companhia e posição inicial do Atlas
          PASS — ilustração própria de POI importante restaurada com opacidade sem bloquear gestos
          PASS — catálogo de POIs/poiByHex validado
          PASS — runtime offline recompilado e assets Android sincronizados
          PASS — package com.braseiro.oumanel
          NOTA — validação em aparelho real ainda depende de instalação/teste do APK.
          EOF

      - name: Publish single 4.9.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y --cleanup-tag || true
          fi
          gh release create "$TAG" --target main             --title 'Braseiro O Um Anel 4.9.6 — Gemini / Start / POI Fix'             --notes 'Corrige o início silenciosamente bloqueado por divergência entre posição canônica e MapDiscovery, exibe erros no modo imersivo, adiciona configuração persistente do modelo Gemini e restaura a leitura das ilustrações próprias dos POIs importantes sobre o mapa escuro. Preserva o Atlas 4.9.5 e Motor Barbara 1.1.3.'
          gh release upload "$TAG"             "out/$SOURCE_NAME"             "out/$SOURCE_NAME.sha256"             "out/$APK_NAME"             "out/$APK_NAME.sha256"             out/APK_BADGING.txt             out/GRADLE_BUILD.log             out/OFFLINE_BUILD.log             out/ANDROID_MODULE_GRAPH.txt             out/PATCH_GATE.txt             out/PATCH_SHA256.txt             out/POI_ILLUSTRATION_GATE.txt             out/VALIDACAO_OUA_4.9.6.txt             out/*REGRESSION.txt
