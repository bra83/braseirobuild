name: Fix Star Wars R54 Barbara Opening C01
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "star-wars/r54/fix_barbara_opening_c01.py"
      - ".github/workflows/fix-star-wars-r54-barbara-opening-c01.yml"
permissions: {contents: write}
jobs:
  fix-validate-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: root
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip
          rm -rf c01-work && mkdir c01-work && unzip -q "$ZIP" -d c01-work
          SET="$(find c01-work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"; test -n "$SET"
          ROOT="$(dirname "$SET")"; python3 -m py_compile star-wars/r54/fix_barbara_opening_c01.py
          python3 star-wars/r54/fix_barbara_opening_c01.py "$ROOT" | tee /tmp/c01.txt
          grep -q R54_BARBARA_OPENING_C01_PASS /tmp/c01.txt
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
      - name: C01 static gate
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          C="$ROOT/app/src/main/assets/vtt/js/core/controller.mjs"
          ! grep -Fq 'const parts = [`A campanha começa em ${locationName}.`]' "$C"
          ! grep -Fq "narration: parts.join(' ')" "$C"
          grep -Fq 'const openingFacts = [' "$C"
          grep -Fq 'A partir deste ponto, Barbara assume a condução narrativa' "$C"
          python3 star-wars/r54/audit_complete.py "$ROOT" > /tmp/audit.txt || true
          grep -E '^C01.*PASS|C01.*PASS' /tmp/audit.txt
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', validate-wrappers: false}
      - name: Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"; SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true; "$SDKMANAGER" 'platform-tools' 'platforms;android-36'; echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ steps.root.outputs.path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Persist canonical R54
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          OUT=star-wars/final-1.0.0/output-r54; TMP="$(mktemp -d)"
          APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n1)"; test -f "$APK"
          cp "$APK" "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk"
          (cd "$ROOT" && zip -qr "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip" . -x '*/build/*' '.gradle/*')
          sha256sum "$TMP"/*.apk > "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk.sha256"
          sha256sum "$TMP"/*.zip > "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip.sha256"
          git config user.name github-actions; git config user.email github-actions@github.com; git pull --rebase origin main
          cp "$TMP"/* "$OUT"/; printf '%s\n' 'R54_BARBARA_OPENING_C01_PASS template_removed=1 paragraphs=5' > "$OUT/BARBARA_OPENING_C01_2026-09-16.txt"
          git add -f "$OUT"; git commit -m 'build: persist R54 Barbara opening C01' || true; git push origin HEAD:main
