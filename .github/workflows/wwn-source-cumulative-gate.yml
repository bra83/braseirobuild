name: WWN Gameplay Cumulative Gate

on:
  push:
    branches:
      - wwn-source-105-bridge
    paths:
      - "app/**"
      - "tools/**"
      - ".github/workflows/wwn-source-cumulative-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wwn-gameplay-cumulative-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout WWN source branch
        uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Physical-device complaint regression gate
        run: node tools/wwn_device_audit_gate.mjs

      - name: Validate every production JavaScript module
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file" >/dev/null
            count=$((count+1))
          done < <(find app/src/main/assets/www -type f -name '*.js' -print0)
          echo "WWN_JS_SYNTAX_PASS=$count"

      - name: Validate JSON data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('app/src/main/assets/www').rglob('*.json'))
          for p in files:
              json.loads(p.read_text(encoding='utf-8'))
          print(f'WWN_JSON_PARSE_PASS={len(files)}')
          PY

      - name: Forbidden delivery debris guard
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find app -type f \( -name '*.apk' -o -name '*.aab' -o -name 'local.properties' -o -name '.env' \) -print -quit)"
          echo WWN_SOURCE_DEBRIS_GUARD=PASS
