name: Audit Star Wars R38 catalog-to-UI visual linkage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-star-wars-r38-linkage.yml"
      - "star-wars/r38/SOURCE.json"
      - "STAR_WARS_R38_LINKAGE_AUDIT_TRIGGER.txt"

permissions:
  contents: write

jobs:
  audit-linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: source
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json',encoding='utf-8'))
          print('url='+d['source_share_url']); print('sha='+d['sha256']); print('file='+d['file'])
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pinned R38 source
        env:
          SHARE_URL: ${{ steps.source.outputs.url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          rm -rf incoming work; mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['SOURCE_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True); page=b.new_page(accept_downloads=True)
            page.goto(os.environ['SHARE_URL'],wait_until='domcontentloaded',timeout=120000); page.wait_for_timeout(3500)
            for label in ['Accept','Aceitar','同意する','OK']:
              try:
                q=page.get_by_text(label,exact=True)
                if q.count() and q.first.is_visible(): q.first.click(timeout=1200)
              except: pass
            done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
              try:
                q=page.locator(sel).first
                if not q.count() or not q.is_visible(): continue
                with page.expect_download(timeout=120000) as info: q.click(timeout=10000)
                info.value.save_as(str(out)); done=True; break
              except: pass
            if not done:
              q=page.get_by_text(os.environ['SOURCE_FILE'],exact=False).first
              parent=q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
              with page.expect_download(timeout=120000) as info: parent.locator('a,button').last.click(timeout=10000)
              info.value.save_as(str(out)); done=True
            b.close()
          if not done: raise SystemExit('download failed')
          PY
          echo "${EXPECTED_SHA}  incoming/${SOURCE_FILE}" | sha256sum -c -
          unzip -q "incoming/${SOURCE_FILE}" -d work

      - name: Build focused linkage report
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find work -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | head -n1)"
          ROOT="$(dirname "$GRADLEW")"; export ROOT
          mkdir -p star-wars/r38/audit
          python3 - <<'PY'
          import os,re,json,pathlib,collections,datetime
          root=pathlib.Path(os.environ['ROOT'])
          assets=root/'app/src/main/assets/vtt'
          manifest=json.loads((assets/'image-library/manifest.json').read_text(encoding='utf-8'))
          arr=manifest.get('assets') if isinstance(manifest,dict) else manifest
          if not isinstance(arr,list): arr=[]

          def compact(o):
            if not isinstance(o,dict): return o
            keys=['id','assetId','key','kind','category','type','label','name','title','displayName','localPath','path','url','imageUrl','sourceUrl','usage','mechanicalBinding','tags','visual']
            return {k:o.get(k) for k in keys if k in o}
          kinds=collections.Counter(str((a.get('kind') if isinstance(a,dict) else None) or 'null') for a in arr)
          cats=collections.Counter(str((a.get('category') if isinstance(a,dict) else None) or 'null') for a in arr)

          def text(p):
            try:return p.read_text(encoding='utf-8',errors='replace')
            except:return ''
          files={str(p.relative_to(root)).replace('\\','/'):text(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.mjs','.js','.json','.html','.css','.md','.txt','.tsx','.ts','.java','.kt'}}

          interesting_paths=[
            'app/src/main/assets/vtt/js/rules/equipmentCatalog.mjs',
            'app/src/main/assets/vtt/js/rules/vehicles.mjs',
            'app/src/main/assets/vtt/js/library/imageLibrary.mjs',
            'app/src/main/assets/vtt/js/library/imageLibraryData.mjs',
            'app/src/main/assets/vtt/js/library/sceneLibrary.mjs',
            'app/src/main/assets/vtt/js/core/uiBridge.mjs',
            'app/src/main/assets/vtt/js/core/uiBridge.bundle.js',
            'app/src/main/assets/vtt/r46/final-runtime.js',
            'app/src/main/assets/vtt/r46/r46-shell.bundle.js',
            'app/src/main/assets/vtt/js/ui/app.mjs'
          ]
          snippets={}
          patterns=[r'visual',r'image',r'asset',r'cache',r'preview',r'search',r'equipment',r'item',r'vehicle',r'npc',r'droid',r'beast',r'creature',r'scene',r'gemini']
          for path in interesting_paths:
            t=files.get(path,'')
            hs=[]
            for i,line in enumerate(t.splitlines(),1):
              if any(re.search(p,line,re.I) for p in patterns):
                hs.append({'line':i,'text':line[:900]})
                if len(hs)>=220: break
            snippets[path]=hs

          # Discover bridge-ish method names and exact R46 call sites.
          bridge=files.get('app/src/main/assets/vtt/js/core/uiBridge.mjs','')+'\n'+files.get('app/src/main/assets/vtt/js/core/uiBridge.bundle.js','')
          candidate_methods=set(re.findall(r'\b([A-Za-z_$][A-Za-z0-9_$]*(?:Image|Asset|Visual|Map|Scene)[A-Za-z0-9_$]*)\s*\(',bridge))
          candidate_methods |= set(re.findall(r'\b((?:get|search|list|resolve|cache|clear|fetch)[A-Z][A-Za-z0-9_$]*(?:Image|Asset|Visual|Map|Scene)[A-Za-z0-9_$]*)\b',bridge))
          r46texts={p:t for p,t in files.items() if '/r46/' in ('/'+p)}
          method_usage={}
          for m in sorted(candidate_methods):
            uses=[]
            for p,t in r46texts.items():
              if m in t:
                lines=[i for i,l in enumerate(t.splitlines(),1) if m in l][:20]
                uses.append({'path':p,'lines':lines})
            if uses: method_usage[m]=uses

          # Exact keyword occurrences for known native/web image bridges.
          bridge_tokens=['BraseiroImages','BraseiroGemini','imageLibrary','ImageLibrary','searchVisual','visualEntity','visualEntities','searchImages','searchImage','getImage','resolveImage','cacheAsset','fetchAndCache','assetId','localPath']
          token_usage={}
          for tok in bridge_tokens:
            hits=[]
            for p,t in files.items():
              if tok in t:
                lines=[{'line':i,'text':l[:800]} for i,l in enumerate(t.splitlines(),1) if tok in l][:30]
                hits.append({'path':p,'lines':lines})
            token_usage[tok]=hits[:50]

          # Inspect provenance freeze and relevant audit metadata verbatim as structured JSON.
          prov_path=assets/'image-library/R46_KAINRATH_PROVENANCE_FREEZE.json'
          provenance=json.loads(prov_path.read_text(encoding='utf-8')) if prov_path.exists() else None

          # Heuristic catalog bindings: explicit visual/image/asset fields inside rules catalog source.
          def explicit_binding_lines(path):
            t=files.get(path,'')
            out=[]
            for i,l in enumerate(t.splitlines(),1):
              if re.search(r'\b(visual|image|asset)(Id|Key|Ref|Url)?\s*[:=]',l,re.I): out.append({'line':i,'text':l[:900]})
            return out[:200]
          catalog_bindings={
            'equipment':explicit_binding_lines('app/src/main/assets/vtt/js/rules/equipmentCatalog.mjs'),
            'vehicles':explicit_binding_lines('app/src/main/assets/vtt/js/rules/vehicles.mjs')
          }

          # Pull named UI client files if they exist anywhere in source.
          named_clients={}
          for needle in ['imageLibraryBridgeClient','gameBridgeClient','VTTApp','Templates']:
            named_clients[needle]=[]
            for p,t in files.items():
              if needle.lower() in p.lower() or needle in t:
                named_clients[needle].append(p)

          # Manifest entries relevant to requested categories.
          def select(pred): return [compact(a) for a in arr if isinstance(a,dict) and pred(a)]
          manifest_groups={
            'equipment':select(lambda a: str(a.get('kind','')).lower()=='equipment' or 'equipment' in str(a.get('category','')).lower()),
            'vehicles':select(lambda a:'vehicle' in str(a.get('kind','')).lower() or 'ship' in str(a.get('category','')).lower() or 'vehicle' in str(a.get('category','')).lower()),
            'npc_droid_beast':select(lambda a:any(k in (str(a.get('id',''))+' '+str(a.get('kind',''))+' '+str(a.get('category',''))).lower() for k in ['npc','droid','beast','creature'])),
            'maps_locations':select(lambda a:any(k in (str(a.get('id',''))+' '+str(a.get('kind',''))+' '+str(a.get('category',''))).lower() for k in ['map','location','planet'])),
            'scenes':select(lambda a:'scene' in (str(a.get('id',''))+' '+str(a.get('kind',''))+' '+str(a.get('category',''))).lower())
          }

          report={
            'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'manifest_asset_count':len(arr),
            'manifest_kind_counts':dict(kinds),
            'manifest_category_counts':dict(cats),
            'manifest_groups':manifest_groups,
            'catalog_explicit_visual_bindings':catalog_bindings,
            'bridge_candidate_methods_used_by_r46':method_usage,
            'bridge_token_usage':token_usage,
            'named_client_paths':named_clients,
            'provenance_freeze':provenance,
            'focused_source_snippets':snippets
          }
          out=pathlib.Path('star-wars/r38/audit/ASSET_LINKAGE_R38.json')
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')

          # Conservative human summary based only on exact static evidence.
          r46all='\n'.join(r46texts.values())
          visual_methods=list(method_usage)
          equipment_bind=bool(catalog_bindings['equipment'])
          vehicle_bind=bool(catalog_bindings['vehicles'])
          img_bridge_in_r46=any(tok in r46all for tok in ['BraseiroImages','imageLibrary','ImageLibrary','searchVisual','visualEntity','searchImages','cacheAsset','fetchAndCache'])
          scene_gemini=('BraseiroGemini' in r46all and 'generateSceneImage' in r46all)
          md=['# R38 — CATALOG → UI VISUAL LINKAGE AUDIT','',f'- Manifest assets: **{len(arr)}**',f'- Explicit equipment catalog visual/image/asset binding lines: **{len(catalog_bindings["equipment"])}**',f'- Explicit vehicle catalog visual/image/asset binding lines: **{len(catalog_bindings["vehicles"])}**',f'- Image-library/native-image bridge tokens found in R46 runtime/bundle: **{img_bridge_in_r46}**',f'- Candidate visual/image bridge methods actually referenced by R46: **{len(visual_methods)}**',f'- Scene Gemini image path present in R46: **{scene_gemini}**','', '## Requested category matrix','', '| Category | Created/cataloged | Explicit mechanical-ID→visual binding | R46 image-library linkage proven | Status |','|---|---|---|---|---|']
          for label,key,bind in [('ITENS','equipment',equipment_bind),('VEÍCULOS/NAVES','vehicles',vehicle_bind),('NPC/DROIDS/BEASTS','npc_droid_beast',False),('LOCAIS/MAPAS','maps_locations',False),('CENAS','scenes',False)]:
            created=bool(manifest_groups[key]) or (key=='scenes' and scene_gemini)
            linkage=img_bridge_in_r46 if key!='scenes' else scene_gemini
            status='PROVADO' if created and linkage and (bind or key in ['scenes','maps_locations']) else 'LACUNA/SEM PROVA'
            md.append(f'| {label} | {"SIM" if created else "NÃO"} | {"SIM" if bind else "NÃO/SEM PROVA"} | {"SIM" if linkage else "NÃO"} | **{status}** |')
          md += ['','## Bridge methods referenced by R46','']+[f'- `{m}` → '+', '.join(u['path'] for u in uses) for m,uses in sorted(method_usage.items())]
          md += ['','## Provenance freeze','', '```json', json.dumps(provenance,ensure_ascii=False,indent=2)[:12000], '```','', '## Rule-catalog explicit visual binding excerpts','', '### Equipment']
          md += [f'- L{h["line"]}: `{h["text"]}`' for h in catalog_bindings['equipment'][:80]] or ['- none']
          md += ['','### Vehicles']+[f'- L{h["line"]}: `{h["text"]}`' for h in catalog_bindings['vehicles'][:80]] or ['- none']
          pathlib.Path('star-wars/r38/audit/ASSET_LINKAGE_R38.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          PY

      - name: Commit focused audit only
        run: |
          set -euo pipefail
          git config user.name 'braseiro-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add star-wars/r38/audit/ASSET_LINKAGE_R38.json star-wars/r38/audit/ASSET_LINKAGE_R38.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(star-wars): record R38 catalog-to-UI visual linkage'
          git push
