name: BRASEIRO WWN 1.0.5 Parity Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wwn-patch-105.yml"

permissions:
  contents: write

jobs:
  parity-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge
      - name: Integrate faction special resolution phase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/www/core/faction-turn-service.js')
          s=p.read_text()
          start=s.index('  resolveSpecials({campaignId,resolutions=null}){')
          end=s.index('  takeAction({campaignId,action}){', start)
          replacement='''  resolveSpecials({campaignId,resolutions=null}){\n    const {loaded,state}=loadState(this.persistence,campaignId);if(!state)return Object.freeze({status:loaded.status});\n    const ctx=currentContext(state);if(ctx.status!=='OK')return Object.freeze({status:`${ctx.status}_NO_MUTATION`,revision:loaded.revision});\n    if(ctx.turn.phase!=='SPECIALS_REQUIRED')return Object.freeze({status:'SPECIALS_NOT_CURRENT_PHASE_NO_MUTATION',phase:ctx.turn.phase,revision:loaded.revision});\n    const required=factionSpecialResolutionRequirements(ctx.faction);\n    if(required.length===0){const next=structuredClone(state);next.worldState.factionTurn.phase='ACTION_REQUIRED';const {receipt}=commit({persistence:this.persistence,loaded,state:next,campaignId,eventKind:'FACTION_SPECIALS_NONE',eventSuffix:'faction-specials-none',payload:{factionId:ctx.turn.currentFactionId}});return Object.freeze({status:receipt.status==='OK'?'ACTION_REQUIRED':receipt.status,receipt});}\n    if(!Array.isArray(resolutions))return Object.freeze({status:'ASSET_SPECIAL_CONTRACT_REQUIRED_NO_MUTATION',revision:loaded.revision,required,missing:required});\n    const key=x=>`${String(x?.assetId??'')}::${String(x?.specialId??'')}`;\n    const accepted=new Map();for(const r of resolutions){if(!r||typeof r!=='object')continue;const source=String(r.source??'').toUpperCase();if(!['FACTION_ASSET_EFFECT_SERVICE','GM_CONTEXT'].includes(source))continue;if(r.status!=='OK'&&r.resolved!==true)continue;accepted.set(key(r),r);}\n    const missing=required.filter(req=>!accepted.has(key(req)));if(missing.length)return Object.freeze({status:'ASSET_SPECIAL_CONTRACT_REQUIRED_NO_MUTATION',revision:loaded.revision,required,missing,resolutionsReceived:resolutions.length});\n    const next=structuredClone(state),turn=next.worldState.factionTurn;turn.phase='ACTION_REQUIRED';turn.specialResolutions=required.map(req=>structuredClone(accepted.get(key(req))));\n    const {receipt}=commit({persistence:this.persistence,loaded,state:next,campaignId,eventKind:'FACTION_SPECIALS_RESOLVED',eventSuffix:'faction-specials-resolved',payload:{factionId:turn.currentFactionId,required,resolutions:turn.specialResolutions,nextPhase:'ACTION_REQUIRED'}});\n    return Object.freeze({status:receipt.status==='OK'?'ACTION_REQUIRED':receipt.status,receipt,resolved:turn.specialResolutions});\n  }\n\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
          git config user.name "BRASEIRO WWN Parity"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/www/core/faction-turn-service.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: integrate faction special resolution phase"
            git push origin HEAD:wwn-source-105-bridge
          fi
      - name: Check WWN JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/www/core/wwn-mundane-equipment-core.js
          node --check app/src/main/assets/www/core/mundane-equipment-service.js
          node --check app/src/main/assets/www/core/wwn-inventory-core.js
          node --check app/src/main/assets/www/core/wwn-expedition-services-core.js
          node --check app/src/main/assets/www/core/wwn-advanced-magic-core.js
          node --check app/src/main/assets/www/core/crafting-service.js
          node --check app/src/main/assets/www/core/wwn-attribute-generation-core.js
          node --check app/src/main/assets/www/core/character-creation-service.js
          node --check app/src/main/assets/www/core/advancement-spending-service.js
          node --check app/src/main/assets/www/core/faction-turn-service.js
          node --check app/src/main/assets/www/core/wwn-foe-catalog.js
      - name: Smoke test deterministic parity rules
        shell: bash
        run: |
          set -euo pipefail
          printf '{"type":"module"}\n' > package.json
          node <<'NODE'
          import { mundaneEquipmentItem, mundanePurchasePlan, moneyToCopper } from './app/src/main/assets/www/core/wwn-mundane-equipment-core.js';
          import { spellResearchPlan, spellResearchCheckPlan, workingEffectDifficulty, workingConstructionPlan, scrollCreationPlan, magicItemCreationPlan } from './app/src/main/assets/www/core/wwn-advanced-magic-core.js';
          import { validateAttributeGeneration } from './app/src/main/assets/www/core/wwn-attribute-generation-core.js';
          import { inventoryLoad, breakBundledInventoryItem } from './app/src/main/assets/www/core/wwn-inventory-core.js';
          import { foeProfile } from './app/src/main/assets/www/core/wwn-foe-catalog.js';
          import { seaTravelPlan, hirelingCost, packLoadPlan, supplyEncumbrance, privationDailyPlan } from './app/src/main/assets/www/core/wwn-expedition-services-core.js';
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          assert(moneyToCopper({copper:1})===1,'1 cp exact');
          assert(mundaneEquipmentItem('CANDLE').costCp===1,'candle price');
          assert(mundaneEquipmentItem('CHICKEN').costCp===5,'chicken price');
          assert(mundaneEquipmentItem('MERCHANT_SHIP').costCp===50000,'merchant ship price');
          const buy=mundanePurchasePlan({catalogId:'TORCH',quantity:3,walletCopper:100});assert(buy.status==='OK'&&buy.costCopper===6&&buy.walletCopperAfter===94,'torch purchase exact');
          const research=spellResearchPlan({spellLevel:1,gmApproved:true,gmAssignedLevel:true});assert(research.labCostSp===50000&&research.materialsCostSp===25000,'spell research level 1 costs');assert(spellResearchCheckPlan({spellLevel:5}).difficulty===15,'spell research check');
          const working=workingEffectDifficulty({effectPoints:[10,3,8],area:'BUILDING'});assert(working.baseDifficulty===16&&working.finalDifficulty===64,'SRD Working example');const wc=workingConstructionPlan({difficulty:64});assert(wc.costSp===64000&&wc.baseTime.months===1&&wc.baseTime.weeks===13,'Working build cost/time');
          assert(scrollCreationPlan({spellLevel:3}).costSp===3000,'scroll creation');assert(magicItemCreationPlan({band:'LOW_POWER_PERMANENT',difficulty:10,costSp:12500,gmApproved:true,requiredAdventureComplete:true}).status==='OK','magic item creation');
          const arrayAttrs={Strength:14,Dexterity:12,Constitution:11,Intelligence:10,Wisdom:9,Charisma:7};assert(validateAttributeGeneration({attributes:arrayAttrs,generation:{mode:'STANDARD_ARRAY'}}).ok,'standard array legal');
          const rolled={Strength:[1,2,3],Dexterity:[2,2,2],Constitution:[3,3,3],Intelligence:[4,4,4],Wisdom:[5,5,5],Charisma:[6,6,6]};const final={Strength:6,Dexterity:14,Constitution:9,Intelligence:12,Wisdom:15,Charisma:18};assert(validateAttributeGeneration({attributes:final,generation:{mode:'ROLL_3D6_ORDER',rolls:rolled,substitutedAttribute:'Dexterity'}}).ok,'ordered rolls plus one 14');
          const wearer={characterId:'pc',attributes:{Strength:10},inventory:[{itemId:'boots',encumbrance:1,carryState:'WORN',weightRule:'NO_ENCUMBRANCE_WHILE_WORN'}]};assert(inventoryLoad(wearer).stowedPoints===0&&inventoryLoad(wearer).readiedPoints===0,'worn gear zero encumbrance');
          const bundled={characterId:'pc',attributes:{Strength:10},inventory:[{itemId:'torches',name:'Torches, 3 bundled',kind:'GEAR',quantity:3,encumbrance:1,carryState:'STOWED',weightRule:'BUNDLED_THREE',sourceRefs:[]}]};const opened=breakBundledInventoryItem(bundled,{itemId:'torches'});assert(opened.status==='OK'&&opened.createdItemIds.length===3&&opened.load.stowedPoints===3,'bundle open main-action materialization');
          assert(packLoadPlan({carrier:'MULE_OR_DONKEY',loadEncumbrance:15}).overloaded===false,'mule load');assert(supplyEncumbrance({kind:'DAY_WATER_LARGE_BEAST',units:2}).totalEncumbrance===16,'beast water encumbrance');assert(privationDailyPlan({consecutiveWaterDays:2}).strainGained===3,'privation water');
          assert(foeProfile('LEGENDARY_GOD_TITAN')?.hitDice===20,'foe catalog');assert(seaTravelPlan({propulsion:'OAR',hours:24}).distanceMiles===48,'oar travel daily cap');assert(hirelingCost({kind:'WILDERNESS_GUIDE',days:3}).silverCost===30,'hireling cost');
          console.log('WWN parity smoke tests: OK');
          NODE
          rm package.json
      - name: Compile Kotlin only
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
