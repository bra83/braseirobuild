name: BRASEIRO WWN 1.0.5 Parity Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wwn-patch-105.yml"

permissions:
  contents: write

jobs:
  parity-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge

      - name: Apply final parity integrations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/wwn_patch_live_mods.py
          python3 tools/wwn_patch_crafting_lifecycle.py
          python3 tools/wwn_patch_major_projects.py
          python3 tools/wwn_patch_mod_runtime_links.py
          git config user.name "BRASEIRO WWN Parity"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/www/core/combat-service.js app/src/main/assets/www/core/crafting-service.js app/src/main/assets/www/core/major-project-service.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize WWN equipment mod runtime links"
            git push origin HEAD:wwn-source-105-bridge
          fi

      - name: Check WWN JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/www/core/wwn-mundane-equipment-core.js
          node --check app/src/main/assets/www/core/mundane-equipment-service.js
          node --check app/src/main/assets/www/core/wwn-inventory-core.js
          node --check app/src/main/assets/www/core/wwn-expedition-services-core.js
          node --check app/src/main/assets/www/core/wwn-advanced-magic-core.js
          node --check app/src/main/assets/www/core/advanced-magic-service.js
          node --check app/src/main/assets/www/core/advanced-magic-resolution-service.js
          node --check app/src/main/assets/www/core/crafting-service.js
          node --check app/src/main/assets/www/core/wwn-item-mechanics-core.js
          node --check app/src/main/assets/www/core/equipment-mod-runtime-service.js
          node --check app/src/main/assets/www/core/wwn-armor-core.js
          node --check app/src/main/assets/www/core/combat-service.js
          node --check app/src/main/assets/www/core/wwn-attribute-generation-core.js
          node --check app/src/main/assets/www/core/character-creation-service.js
          node --check app/src/main/assets/www/core/advancement-spending-service.js
          node --check app/src/main/assets/www/core/faction-turn-service.js
          node --check app/src/main/assets/www/core/major-project-service.js
          node --check app/src/main/assets/www/core/wwn-foe-catalog.js

      - name: Run deterministic and stateful parity smoke tests
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f package.json' EXIT
          printf '{"type":"module"}\n' > package.json
          node tools/wwn_parity_smoke.mjs
          node tools/wwn_stateful_smoke.mjs
          node tools/wwn_mod_runtime_stateful_smoke.mjs

      - name: Compile Kotlin only
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
