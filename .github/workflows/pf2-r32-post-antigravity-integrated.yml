      - name: Verify requested features before tests
        shell: powershell
        working-directory: \${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $main=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\MainActivity.java' -Raw
          $party=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\PartyDirector.java' -Raw
          $guide=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerTurnGuide.java' -Raw
          $director=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\BraseiroNarrativeDirector.java' -Raw
          $profile=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\HumanGmNarrativeProfile.java' -Raw
          $checks=@{
            'control-at-creation'=$main.Contains('QUEM CONTROLA ESTE PERSONAGEM?') -and $main.Contains('Mestre — Barbara controla')
            'control-runtime'=$party.Contains('"mode","solo_multi_character"') -and $party.Contains('"human_players",1') -and $party.Contains('"mechanics_rule"')
            'kingdom-guide-icon'=$main.Contains('ⓘ GUIA COMPLETO DO TURNO')
            'kingdom-guide-real-engine'=$guide.Contains('rules.turnProcedureGuide()') -and $guide.Contains('rules.activityGuideCatalog()') -and $guide.Contains('repository.activeTurn()')
            'kingdom-guide-full-sequence'=$guide.Contains('SEQUÊNCIA COMPLETA') -and $guide.Contains('OPÇÕES VÁLIDAS NESTE MOMENTO') -and $guide.Contains('CONFIGURAÇÃO QUE EXIGE SUA ATENÇÃO')
            'narrator-profile'=$profile.Contains('PERFIL TÉCNICO CANÔNICO') -and $director.Contains('HumanGmNarrativeProfile.prompt()')
            'narrator-rules-priority'=$director.Contains('regras PF2e/Kingmaker e decisões do jogador sempre têm precedência')
          }
          $log=Join-Path $env:RUNNER_TEMP 'PF2_R32_FEATURE_GATES.log'
          foreach($x in $checks.GetEnumerator()|Sort-Object Name){$status=if($x.Value){'PASS'}else{'FAIL'};"$status - $($x.Name)"|Tee-Object -FilePath $log -Append}
          if(@($checks.GetEnumerator()|Where-Object{-not $_.Value}).Count -gt 0){throw 'Requested feature gate failed'}
          "FEATURE_GATES=$log" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

