name: PF2 R32 Post-Antigravity Integrated

on:
  push:
    branches: [audit-pf2-kingmaker-r30-20260928]
    paths:
      - '.github/workflows/pf2-r32-post-antigravity-integrated.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pf2-r32-post-antigravity-integrated
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-pf2-kingmaker-r30-20260928

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact post-Antigravity R30
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Expected BRELGA, got $env:RUNNER_NAME"}
          $root=Join-Path $env:RUNNER_TEMP 'pf2-r32-post-antigravity'
          $work=Join-Path $root 'work'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root,$work -Force | Out-Null
          $rar=Join-Path $root 'pf2e_r30_work.rar'
          & curl.exe -L --fail --retry 5 --retry-delay 3 "https://drive.usercontent.google.com/download?id=1UbJq8m518f1jIQkkXASvEp0j0Uf6qNkR&export=download&confirm=t" -o $rar
          if($LASTEXITCODE -ne 0){throw 'R30 archive download failed'}
          $size=(Get-Item $rar).Length
          if($size -ne 553809972){throw "Unexpected R30 archive size: $size"}
          $candidates=@(
            'C:\Program Files\7-Zip\7z.exe',
            'C:\Program Files (x86)\7-Zip\7z.exe',
            'C:\Program Files\WinRAR\UnRAR.exe',
            'C:\Program Files\WinRAR\WinRAR.exe'
          )
          $extractor=$candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if(-not $extractor){
            $cmd=Get-Command 7z.exe -ErrorAction SilentlyContinue
            if($cmd){$extractor=$cmd.Source}
          }
          if(-not $extractor){throw 'No RAR extractor found'}
          if($extractor -match '7z\.exe$'){
            & $extractor x -y $rar "-o$work"
          } elseif($extractor -match 'UnRAR\.exe$'){
            & $extractor x -y $rar "$work\"
          } else {
            & $extractor x -ibck -y $rar "$work\"
          }
          if($LASTEXITCODE -ne 0){throw 'R30 extract failed'}
          $project=Join-Path $work 'pf2e_r30_work'
          if(-not(Test-Path (Join-Path $project 'version.properties'))){throw 'R30 project root missing'}
          "WORK_ROOT=$project" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ARCHIVE_TOOL=$extractor" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply integrated player/GM creation patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python ci\pf2-r32-integrated\patch.py $env:WORK_ROOT
          if($LASTEXITCODE -ne 0){throw 'Integrated patch failed'}
          Copy-Item ci\pf2-r32-integrated\test_r32_integrated.py (Join-Path $env:WORK_ROOT 'tests_pf2\test_r32_integrated.py') -Force

      - name: Verify requested features before tests
        shell: powershell
        working-directory: \${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $main=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\MainActivity.java' -Raw
          $party=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\PartyDirector.java' -Raw
          $guide=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\KingmakerTurnGuide.java' -Raw
          $director=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\BraseiroNarrativeDirector.java' -Raw
          $profile=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\HumanGmNarrativeProfile.java' -Raw
          $checks=@{
            'control-at-creation'=$main.Contains('QUEM CONTROLA ESTE PERSONAGEM?') -and $main.Contains('Mestre — Barbara controla')
            'control-runtime'=$party.Contains('"mode","solo_multi_character"') -and $party.Contains('"human_players",1') -and $party.Contains('"mechanics_rule"')
            'kingdom-guide-icon'=$main.Contains('ⓘ GUIA COMPLETO DO TURNO')
            'kingdom-guide-real-engine'=$guide.Contains('rules.turnProcedureGuide()') -and $guide.Contains('rules.activityGuideCatalog()') -and $guide.Contains('repository.activeTurn()')
            'kingdom-guide-full-sequence'=$guide.Contains('SEQUÊNCIA COMPLETA') -and $guide.Contains('OPÇÕES VÁLIDAS NESTE MOMENTO') -and $guide.Contains('CONFIGURAÇÃO QUE EXIGE SUA ATENÇÃO')
            'narrator-profile'=$profile.Contains('PERFIL TÉCNICO CANÔNICO') -and $director.Contains('HumanGmNarrativeProfile.prompt()')
            'narrator-rules-priority'=$director.Contains('regras PF2e/Kingmaker e decisões do jogador sempre têm precedência')
          }
          $log=Join-Path $env:RUNNER_TEMP 'PF2_R32_FEATURE_GATES.log'
          foreach($x in $checks.GetEnumerator()|Sort-Object Name){$status=if($x.Value){'PASS'}else{'FAIL'};"$status - $($x.Name)"|Tee-Object -FilePath $log -Append}
          if(@($checks.GetEnumerator()|Where-Object{-not $_.Value}).Count -gt 0){throw 'Requested feature gate failed'}
          "FEATURE_GATES=$log" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Kingmaker suites
        shell: powershell
        working-directory: \${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Continue'
          python -m pip install -q pytest
          if($LASTEXITCODE -ne 0){throw 'pytest install failed'}
          $tests=Get-ChildItem tests_pf2 -File -Filter 'test_kingmaker*.py' | Sort-Object Name | ForEach-Object {$_.FullName}
          python -m pytest @tests -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R32_KINGMAKER_TESTS.log"
          $code=$LASTEXITCODE
          if($code -ne 0){throw "Kingmaker tests failed: $code"}

      - name: Run full PF2 regression
        shell: powershell
        working-directory: \${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Continue'
          python -m pytest tests_pf2 -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R32_FULL_TESTS.log"
          $code=$LASTEXITCODE
          if($code -ne 0){throw "Full PF2 tests failed: $code"}

      - name: Configure Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME)
          if($env:LOCALAPPDATA){$candidates+=(Join-Path $env:LOCALAPPDATA 'Android\Sdk')}
          $sdk=$null;$mgr=$null
          foreach($c in ($candidates|Where-Object{$_}|Select-Object -Unique)){
            if(Test-Path $c){
              $f=Get-ChildItem $c -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue|Select-Object -First 1
              if($f){$sdk=$c;$mgr=$f.FullName;break}
            }
          }
          if(-not $mgr){throw 'Android SDK not found'}
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          1..100|%{'y'}|& $mgr --licenses|Out-Null
          & $mgr 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          if($LASTEXITCODE -ne 0){throw 'sdkmanager failed'}

      - name: Build APK
        shell: powershell
        working-directory: \${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R32_GRADLE.log"
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($code -ne 0){throw "Gradle failed: $code"}
          $apk=Get-ChildItem . -Recurse -Filter '*.apk' -File|Where-Object{$_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]'}|Select-Object -First 1
          if(-not $apk){throw 'APK missing'}
          "APK_PATH=$($apk.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package outputs
        shell: powershell
        working-directory: \${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'pf2-r32-output'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apkOut=Join-Path $out 'Braseiro_Pathfinder2e_9.0.33_R32_POST_ANTIGRAVITY_DEBUG.apk'
          Copy-Item $env:APK_PATH $apkOut -Force
          (Get-FileHash $apkOut -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$apkOut.sha256" -Encoding ascii

          $validation=@(
            '# VALIDAÇÃO R32 — POST-ANTIGRAVITY',
            '',
            'Baseline: pf2e_r30_work.rar (553809972 bytes)',
            'Versão: 9.0.33 / R32',
            'Package preservado: com.braseiro.pathfinder2e',
            '',
            '## Entregas',
            '- Controle JOGADOR/MESTRE por personagem visível na criação/edição.',
            '- Solo continua significando 1 jogador humano com múltiplos personagens.',
            '- Barbara só decide intenção/fala/ação voluntária dos personagens marcados MESTRE.',
            '- Toda consequência mecânica continua no mesmo motor PF2e.',
            '- Guia completo do Turno do Reino preservado e ligado ao KingmakerRulesEngine/KingmakerRepository.',
            '- Perfil técnico canônico do Mestre Humano preservado e ligado ao BraseiroNarrativeDirector.',
            '- TTS/Kokoro não alterado nesta rodada.',
            '',
            '## Testes',
            'Ver KINGMAKER_TESTS.log, FULL_PF2_TESTS.log, FEATURE_GATES.log e GRADLE_BUILD.log.'
          )
          $validation | Set-Content (Join-Path $out 'VALIDACAO_R32_POST_ANTIGRAVITY.md') -Encoding utf8
          Copy-Item $env:FEATURE_GATES (Join-Path $out 'FEATURE_GATES.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R32_KINGMAKER_TESTS.log" (Join-Path $out 'KINGMAKER_TESTS.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R32_FULL_TESTS.log" (Join-Path $out 'FULL_PF2_TESTS.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R32_GRADLE.log" (Join-Path $out 'GRADLE_BUILD.log')

          $changed=@(
            'android/app/src/main/java/com/braseiro/pathfinder2e/MainActivity.java',
            'version.properties',
            'tests_pf2/test_r32_integrated.py'
          )
          $changed | Set-Content (Join-Path $out 'CHANGED_FILES_R32.txt') -Encoding utf8

          $zip=Join-Path $out 'BRASEIRO_PATHFINDER2E_9.0.33_R32_POST_ANTIGRAVITY_ANDROID_STUDIO.zip'
          $seven=$null
          if($env:ARCHIVE_TOOL -match '7z\.exe$'){$seven=$env:ARCHIVE_TOOL}
          if($seven){
            & $seven a -tzip -mx=5 $zip . '-xr!**\build\*' '-xr!**\.gradle\*' '-xr!local.properties'
          } else {
            & tar.exe -a -c -f $zip --exclude='*/build/*' --exclude='*/.gradle/*' --exclude='local.properties' .
          }
          if($LASTEXITCODE -ne 0){throw 'Source zip failed'}
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content "$zip.sha256" -Encoding ascii
          "OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish R32 release
        shell: powershell
        env:
          GITHUB_TOKEN: \${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='PATHFINDER2E-9.0.33-R32'
          $headers=@{
            'Authorization'="Bearer $env:GITHUB_TOKEN"
            'Accept'='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='BRELGA-PF2-R32'
          }
          try{$release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"}
          catch{
            $body=@{
              tag_name=$tag
              target_commitish='audit-pf2-kingmaker-r30-20260928'
              name='Braseiro Pathfinder 2e 9.0.33 R32 — Pós-Antigravity'
              body='Baseline pós-Antigravity R30 preservada. Expõe controle Jogador/Mestre já na criação/edição de personagens; mantém controle multi-personagem Solo integrado ao mesmo motor PF2e; mantém Guia Completo do Turno do Reino ligado ao KingmakerRulesEngine/Repository; mantém o Perfil Técnico Canônico do Mestre Humano no BraseiroNarrativeDirector. TTS/Kokoro não foi alterado. Testes Kingmaker, regressão PF2 completa e Gradle são gates obrigatórios.'
              draft=$false
              prerelease=$false
            }|ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$repo/releases"
          }
          foreach($file in Get-ChildItem $env:OUT_DIR -File){
            $existing=$release.assets|Where-Object{$_.name -eq $file.Name}|Select-Object -First 1
            if($existing){Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)"|Out-Null}
            $encoded=[uri]::EscapeDataString($file.Name)
            $upload="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encoded"
            & curl.exe -L --fail --retry 5 --retry-delay 2 --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$($file.FullName)" $upload
            if($LASTEXITCODE -ne 0){throw "upload failed: $($file.Name)"}
          }
          Write-Host "RELEASE_URL=$($release.html_url)"
){
            & $extractor x -y $rar "-o$work"
          } elseif($extractor -match 'UnRAR\.exe          $project=Join-Path $work 'pf2e_r30_work'
          if(-not(Test-Path (Join-Path $project 'version.properties'))){throw 'R30 project root missing'}
          "WORK_ROOT=$project" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SEVEN_ZIP=$seven" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

