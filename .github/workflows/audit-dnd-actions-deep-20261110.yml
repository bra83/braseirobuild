name: DnD suggested actions - deep audit (expected RED)
on:
  push:
    branches:
      - audit/dnd-6654-acoes-pente-fino-20261110
    paths:
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/AuditSceneSuggestedActions20261110Test.java'
      - '.github/workflows/audit-dnd-actions-deep-20261110.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dnd-normal/run247-mod005
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run negative acceptance suite
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            -Pbraseiro.qaLiteAssets=true \
            --tests 'com.braseiro.dnd5e.AuditSceneSuggestedActions20261110Test' \
            --no-daemon --stacktrace
      - name: Preserve JUnit failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DND_AUDIT_SUGGESTED_ACTIONS_JUNIT
          path: dnd-normal/run247-mod005/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
