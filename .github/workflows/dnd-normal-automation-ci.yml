name: Braseiro D&D Normal - canonical automation
on:
  push:
    branches:
      - antigravity/dnd-normal-fechamento-gates
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dnd-normal-automation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    # Reuse existing 503-source, XSAC, rules, SQLite and 2500+ Robolectric
    # tests. One regression per push; no second competing BRELGA workflow.
    uses: ./.github/workflows/dnd-adventure-atomicity-brelga.yml
    permissions:
      contents: write

  language-scope:
    needs: validation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - name: TypeScript gate only when a D&D package declares it
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw 'WRONG_RUNNER' }
          Set-Location 'dnd-normal/run247-mod005'
          if (Test-Path 'package.json') {
            if (!(Get-Command npm -ErrorAction SilentlyContinue)) { throw 'INFRA_NPM_MISSING' }
            npm ci
            if ($LASTEXITCODE -ne 0) { throw 'DND_NPM_CI_FAILED' }
            npx tsc --noEmit
            if ($LASTEXITCODE -ne 0) { throw 'DND_TYPESCRIPT_FAILED' }
            Write-Host 'DND_TYPESCRIPT=PASS'
          } else {
            Write-Host 'DND_TYPESCRIPT=NOT_APPLICABLE_NO_PACKAGE_JSON'
          }

  handoff:
    if: always() && github.event_name != 'pull_request'
    needs: [validation, language-scope]
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Record result on the verified HEAD only
        uses: actions/github-script@v7
        env:
          REGRESSION_RESULT: ${{ needs.validation.result }}
          TYPESCRIPT_RESULT: ${{ needs.language-scope.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = 'antigravity/dnd-normal-fechamento-gates';
            const path = 'docs/HANDOFF_DND_ATUAL.md';
            const ref = await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});
            if (ref.data.object.sha !== context.sha) {
              core.notice('STALE_SHA_NO_HANDOFF_MUTATION='+context.sha);
              return;
            }
            const file = await github.rest.repos.getContent({owner,repo,path,ref:branch});
            const body = Buffer.from(file.data.content,'base64').toString('utf8');
            const start='<!-- DND_AUTO_BEGIN -->';
            const end='<!-- DND_AUTO_END -->';
            if (!body.includes(start)||!body.includes(end)) throw Error('HANDOFF_MARKERS_MISSING');
            const regression=process.env.REGRESSION_RESULT;
            const typescript=process.env.TYPESCRIPT_RESULT;
            const block = [
              start,
              '## Último pacote verificado automaticamente',
              '',
              '- Fonte: '+branch+' @ `'+context.sha+'`.',
              '- GitHub CI: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
              '- Regressão BRELGA: **'+regression+'** (XMLs na branch de evidências QA quando publicados).',
              '- TypeScript: **'+typescript+'**; NOT_APPLICABLE se não existe package.json no D&D.',
              '- APK deste workflow: **não compilado**.',
              '- Etapa 03 XMM: **aberta**. Não converter testes PASS em certificação integral.',
              '- Próxima ação: se FAIL, corrigir o teste/causa exata no SHA; se PASS, implementar próximo efeito XMM source-bound.',
              '',
              end
            ].join('\n');
            const updated=body.replace(new RegExp(start+'[\\s\\S]*?'+end),block);
            if(updated===body) {core.info('HANDOFF_NO_CHANGE');return;}
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch,sha:file.data.sha,
              message:'docs(dnd): update automatic handoff for '+context.sha.slice(0,10)+' [skip ci]',
              content:Buffer.from(updated).toString('base64')
            });
            core.info('HANDOFF_UPDATED_FOR_SHA='+context.sha);
