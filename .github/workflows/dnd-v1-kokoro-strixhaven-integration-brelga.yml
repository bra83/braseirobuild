name: DnD V1 Kokoro Strixhaven Integration BRELGA

on:
  push:
    branches:
      - integration/dnd-v1-kokoro-strixhaven-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Verify Runner and Environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Runner incorreto: $env:RUNNER_NAME" }
          Write-Host "Runner BRELGA verificado."

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Android + Java
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $java='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if(!(Test-Path $java)){$java='C:\Program Files\Android\Android Studio\jbr'}
          if(Test-Path $java){
            Add-Content $env:GITHUB_ENV ('JAVA_HOME='+$java)
            Add-Content $env:GITHUB_PATH (Join-Path $java 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if(!$sdk -or !(Test-Path $sdk)){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if(!(Test-Path $sdk)){throw 'ANDROID_SDK_MISSING'}
          Add-Content $env:GITHUB_ENV ('ANDROID_HOME='+$sdk)
          Add-Content $env:GITHUB_ENV ('ANDROID_SDK_ROOT='+$sdk)

      - name: Run Integration Verification Gate
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'app/build/test-results/testDebugUnitTest'

          # Focal — XML limpo, 3 classes, mínimo 16 testes.
          if (Test-Path $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          & .\gradlew.bat :app:testDebugUnitTest `
            --tests com.braseiro.dnd5e.Run245G13NarrationChunkerTest `
            --tests com.braseiro.dnd5e.AudioStatusGateTest `
            --tests com.braseiro.dnd5e.StrixhavenSceneBoundaryRobolectricTest `
            --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATION_TARGETED_GRADLE_FAILED' }

          $names = @(
            'com.braseiro.dnd5e.Run245G13NarrationChunkerTest',
            'com.braseiro.dnd5e.AudioStatusGateTest',
            'com.braseiro.dnd5e.StrixhavenSceneBoundaryRobolectricTest'
          )
          $n=0; $f=0; $e=0; $s=0
          foreach ($name in $names) {
            $file = Join-Path $dir ('TEST-' + $name + '.xml')
            if (!(Test-Path $file)) { throw ('MISSING_XML=' + $file) }
            [xml]$xml = Get-Content -LiteralPath $file -Raw
            $n += [int]$xml.testsuite.tests
            $f += [int]$xml.testsuite.failures
            $e += [int]$xml.testsuite.errors
            $s += [int]$xml.testsuite.skipped
          }
          Write-Host "INTEGRATION_TARGET_TESTS=$n FAIL=$f ERR=$e SKIP=$s"
          if ($n -lt 16 -or $f -ne 0 -or $e -ne 0 -or $s -ne 0) {
            throw 'INTEGRATION_TARGETED_GATE_FAILED'
          }

          # Regressão completa — gera um conjunto NOVO de XMLs neste mesmo run/SHA.
          if (Test-Path $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATION_FULL_GRADLE_FAILED' }

          $docs = @(Get-ChildItem -LiteralPath $dir -Filter 'TEST-*.xml' -File)
          if ($docs.Count -eq 0) { throw 'FULL_XML_MISSING' }
          $n=0; $f=0; $e=0; $s=0
          foreach ($file in $docs) {
            [xml]$xml = Get-Content -LiteralPath $file.FullName -Raw
            $n += [int]$xml.testsuite.tests
            $f += [int]$xml.testsuite.failures
            $e += [int]$xml.testsuite.errors
            $s += [int]$xml.testsuite.skipped
            foreach ($node in @($xml.SelectNodes('//testcase/failure | //testcase/error'))) {
              Write-Host ('FAIL_CASE=' + $node.ParentNode.GetAttribute('classname') + '::' + $node.ParentNode.GetAttribute('name'))
              Write-Host ('FAIL_MSG=' + $node.GetAttribute('message'))
            }
          }
          Write-Host "INTEGRATION_FULL_TESTS=$n FAIL=$f ERR=$e SKIP=$s"
          if ($n -lt 2802 -or $f -ne 0 -or $e -ne 0 -or $s -ne 0) {
            throw 'INTEGRATION_FULL_GATE_FAILED'
          }
          Write-Host 'INTEGRATION_COMBINED_GATE=PASS'
          Write-Host 'APK_BUILT=NO'
          Write-Host 'PHYSICAL_A57=NOT_TESTED'
