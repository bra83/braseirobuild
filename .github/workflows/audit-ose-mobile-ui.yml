name: OSE Mobile UI and Physics Audit

on:
  push:
    branches:
      - ose/final-integration-20261024
    paths:
      - "ose/1.0.0/source/web-ui-p1/**"
      - "tools/**"
      - ".github/workflows/audit-ose-mobile-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test OSE JS and canonical physics
        shell: bash
        run: |
          set -euo pipefail
          UI=ose/1.0.0/source/web-ui-p1
          node --check "$UI/dice3d_core.js"
          node --check "$UI/dice3d_app.js"
          node --check "$UI/dice3d_physics_view.js"
          node --check "$UI/equipment-icon-cleaner.js"
          node --check "$UI/p1.js"
          node "$UI/ose_image_nav_regression.cjs"
          node "$UI/dice3d_physics.test.cjs"
      - name: Run mobile UI audit and capture evidence
        shell: bash
        run: |
          python tools/run_mobile_ui_audit.py
      - name: Upload mobile QA screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ose-mobile-ui-physics-qa
          path: qa/ose/
          retention-days: 14
          if-no-files-found: warn
