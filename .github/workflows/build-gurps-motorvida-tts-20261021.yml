name: GURPS 10.8.0 Motor Vida V2 + TTS V3 - BRELGA
on:
  push:
    paths:
      - '.github/workflows/build-gurps-motorvida-tts-20261021.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 150
    steps:
      - name: Fetch exact source from private Drive and compile on BRELGA
        shell: powershell
        env:
          GURPS_DRIVE_TOKEN_SECRET: ${{ secrets.GURPS_DRIVE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "RUNNER_MUST_BE_BRELGA: $env:RUNNER_NAME" }
          $sourceName = 'BRASEIRO_GURPS_10.8.0_MOTOR_VIDA_V2_TTS_V3_FONTE_INTEGRADA_20261021.zip'
          $expectedSha = '836fbfcb265e4074289f4988655f763af1d93bebe817de96f1bf347bd507ef6e'
          $driveId = '12s-ZrvbkIEdVl_vb6QxqdDT2zUP4bfZO'
          $work = Join-Path $env:RUNNER_TEMP 'gurps-motorvida-tts-20261021'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $zip = Join-Path $work $sourceName
          $candidates = @(
            "G:\My Drive\BRASEIRO_GURPS_CHECKPOINTS\$sourceName",
            "G:\Meu Drive\BRASEIRO_GURPS_CHECKPOINTS\$sourceName",
            "G:\Google Drive\My Drive\BRASEIRO_GURPS_CHECKPOINTS\$sourceName",
            "C:\BRELGA\incoming\$sourceName",
            (Join-Path $env:USERPROFILE "My Drive\BRASEIRO_GURPS_CHECKPOINTS\$sourceName")
          )
          $found = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ($found) {
            Copy-Item -LiteralPath $found -Destination $zip -Force
            Write-Output 'SOURCE_FROM_PRIVATE_DRIVE_MOUNT'
          } else {
            $token = if ($env:GURPS_DRIVE_TOKEN_SECRET) { $env:GURPS_DRIVE_TOKEN_SECRET } else { $env:GURPS_DRIVE_TOKEN }
            if (-not $token) { throw 'PRIVATE_SOURCE_UNAVAILABLE: no Drive mount and no GURPS_DRIVE_TOKEN' }
            $uri = [uri]"https://www.googleapis.com/drive/v3/files/$driveId?alt=media&supportsAllDrives=true"
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            try {
              for ($i = 0; $i -lt 5; $i++) {
                $request = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Get, $uri)
                if ($uri.Host -eq 'www.googleapis.com') {
                  $request.Headers.Authorization = [System.Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $token)
                }
                $response = $client.SendAsync($request, [System.Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()
                if ([int]$response.StatusCode -ge 300 -and [int]$response.StatusCode -lt 400) {
                  $next = $response.Headers.Location
                  if (-not $next.IsAbsoluteUri) { $next = [uri]::new($uri, $next) }
                  $hostName = $next.Host.ToLowerInvariant()
                  if (-not ($hostName -eq 'www.googleapis.com' -or $hostName.EndsWith('.googleapis.com') -or $hostName -eq 'googleusercontent.com' -or $hostName.EndsWith('.googleusercontent.com'))) { throw 'DRIVE_REDIRECT_UNTRUSTED' }
                  $response.Dispose()
                  $uri = $next
                  continue
                }
                if (-not $response.IsSuccessStatusCode) { throw "DRIVE_HTTP_$([int]$response.StatusCode)" }
                $inputStream = $response.Content.ReadAsStreamAsync().GetAwaiter().GetResult()
                $outputStream = [System.IO.File]::Create($zip)
                try { $inputStream.CopyTo($outputStream) } finally { $outputStream.Dispose(); $inputStream.Dispose() }
                $response.Dispose()
                break
              }
            } finally { $client.Dispose(); $handler.Dispose() }
            if (-not (Test-Path -LiteralPath $zip)) { throw 'DRIVE_DOWNLOAD_MISSING' }
            Write-Output 'SOURCE_FROM_PRIVATE_DRIVE_OAUTH'
          }
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne $expectedSha) { throw "SOURCE_SHA256_MISMATCH actual=$sha" }
          Write-Output "SOURCE_SHA256_VERIFIED=$sha"
          $dest = Join-Path $work 'extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $root = Join-Path $dest 'Braseiro_GURPS_10.8.0_ISOLAMENTO_CAMPANHA_BARBARA_1.1.2_ANDROID_STUDIO'
          $android = Join-Path $root 'android'
          if (-not (Test-Path -LiteralPath (Join-Path $android 'settings.gradle.kts'))) { throw 'ANDROID_GRADLE_ROOT_MISSING' }
          if (-not (Test-Path -LiteralPath (Join-Path $android 'gradlew.bat'))) { throw 'GRADLE_WRAPPER_MISSING' }
          if (-not $env:ANDROID_HOME -and -not $env:ANDROID_SDK_ROOT) { throw 'ANDROID_SDK_MISSING' }
          Push-Location $android
          try {
            & .\gradlew.bat --no-daemon --stacktrace :app:compileDebugJavaWithJavac :app:assembleDebug
            if ($LASTEXITCODE -ne 0) { throw "ANDROID_BUILD_FAILED=$LASTEXITCODE" }
          } finally { Pop-Location }
          $apk = Get-ChildItem -LiteralPath (Join-Path $android 'app\build\outputs\apk\debug') -Filter '*.apk' -File | Select-Object -First 1
          if (-not $apk) { throw 'APK_MISSING_AFTER_BUILD' }
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'gurps-apk-output'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $output = Join-Path $outDir 'BRASEIRO_GURPS_10.8.0_MOTOR_VIDA_V2_TTS_V3_DEBUG.apk'
          Copy-Item -LiteralPath $apk.FullName -Destination $output
          $apkSha = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "APK_CREATED=$output"
          Write-Output "APK_SHA256=$apkSha"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "GURPS 10.8.0 Motor Vida V2 + TTS V3: debug APK built on BRELGA; SHA256 $apkSha. Android device test not executed."
      - name: Publish APK as private Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_GURPS_10.8.0_MOTOR_VIDA_V2_TTS_V3_DEBUG
          path: gurps-apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to private repository release
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'GURPS-10.8.0-MOTORVIDA-V2-TTSV3-20261021'
          $apk = Join-Path $env:GITHUB_WORKSPACE 'gurps-apk-output\BRASEIRO_GURPS_10.8.0_MOTOR_VIDA_V2_TTS_V3_DEBUG.apk'
          if (-not (Test-Path -LiteralPath $apk)) { throw 'APK_NOT_FOUND_FOR_RELEASE' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $apk --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $apk --repo $env:GITHUB_REPOSITORY --title 'GURPS 10.8.0 Motor Vida V2 + TTS V3 (APK debug)' --notes 'APK de teste compilado no BRELGA. Nao homologado no Galaxy A57.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_UPLOAD_FAILED' }
