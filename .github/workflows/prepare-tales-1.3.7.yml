name: Prepare Tales 1.3.7 Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/TALES_137_PREPARE_TRIGGER"
      - ".github/workflows/prepare-tales-1.3.7.yml"
      - "tales-1.3.7-overlay/**"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Download proven 1.3.6 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work out
          mkdir -p incoming work out
          gh release download TALES-1.3.6 --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.6.zip' --dir incoming
          unzip -t incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.6.zip >/dev/null
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.6.zip -d work

      - name: Detect Android project
        id: project
        run: |
          set -euo pipefail
          WRAPPER="$(find work -type f -name gradlew -not -path '*/build/*' | head -n1)"
          test -n "$WRAPPER"
          ROOT="$(dirname "$WRAPPER")"
          test -f "$ROOT/app/build.gradle.kts"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Apply TTS and action-choice repair
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/app/src/main/java/com/braseiro/talesvtt/audio"
          cp tales-1.3.7-overlay/GeminiNarrationTts.kt "$ROOT/app/src/main/java/com/braseiro/talesvtt/audio/GeminiNarrationTts.kt"
          cp tales-1.3.7-overlay/NarrationTts.kt "$ROOT/app/src/main/java/com/braseiro/talesvtt/components/NarrationTts.kt"
          cp tales-1.3.7-overlay/SceneChoiceDefaults.kt "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/SceneChoiceDefaults.kt"
          python3 tales-1.3.7-overlay/apply_137.py "$ROOT"
          grep -q 'versionName = "1.3.7"' "$ROOT/app/build.gradle.kts"
          grep -q 'gemini-3.1-flash-tts-preview' "$ROOT/app/src/main/java/com/braseiro/talesvtt/audio/GeminiNarrationTts.kt"
          grep -q 'Voz Gemini indisponível; usando TTS do Android' "$ROOT/app/src/main/java/com/braseiro/talesvtt/components/NarrationTts.kt"
          grep -q 'SceneChoiceDefaults.standard()' "$ROOT/app/src/main/java/com/braseiro/talesvtt/screens/SceneScreen.kt"
          grep -q 'is JSONObject' "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/MotorBarbaraWireAdapter.kt"

      - name: Package corrected Android Studio source
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          PARENT="$(dirname "$ROOT")"
          NEW="$PARENT/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.7"
          rm -rf "$NEW"
          mv "$ROOT" "$NEW"
          cd "$PARENT"
          zip -qr "$GITHUB_WORKSPACE/out/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.7.zip" BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.7
          cd "$GITHUB_WORKSPACE"
          unzip -t out/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.7.zip >/dev/null
          sha256sum out/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.7.zip | tee out/SHA256SUMS_SOURCE_1.3.7.txt

      - name: Publish 1.3.7 source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view TALES-1.3.7 >/dev/null 2>&1; then
            gh release delete TALES-1.3.7 -y --cleanup-tag || true
          fi
          gh release create TALES-1.3.7 --draft --title 'BRASEIRO TALES VTT 1.3.7' --notes 'Correção de TTS e opções prévias de ação. Gemini TTS com modelo atual e fallback automático para TTS Android. CENA e LOCAL sempre exibem três sugestões seguras quando o Mestre omite escolhas; parser aceita escolhas em arrays ou objetos.'
          gh release upload TALES-1.3.7 out/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.7.zip out/SHA256SUMS_SOURCE_1.3.7.txt
          gh release edit TALES-1.3.7 --draft=false

      - name: Summary
        run: |
          echo '## TALES 1.3.7 source prepared' >> "$GITHUB_STEP_SUMMARY"
          echo '- TTS Gemini with Android fallback repaired.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Three player action suggestions guaranteed in CENA and LOCAL.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Publishing the release triggers the universal APK builder.' >> "$GITHUB_STEP_SUMMARY"
