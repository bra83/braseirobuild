name: Build Star Wars P77 hosted v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-star-wars-p77-hosted-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download source
        id: src
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.firestorage.ai/dev/file/shares/tc9KTTZ6oSai'
          mkdir -p "$RUNNER_TEMP/p77"
          meta="$(curl -fsSL "$api/files?maxResults=100")"
          file_id="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["files"][0]["fileId"])' <<<"$meta")"
          ticket="$(curl -fsSL -X POST "$api/files/$file_id/download")"
          url="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["downloadUrl"])' <<<"$ticket")"
          zip="$RUNNER_TEMP/p77/source.zip"
          curl -fL --retry 5 --retry-delay 2 -o "$zip" "$url"
          test "$(stat -c%s "$zip")" = "79377122"
          echo "3703dff112a097a2fa4a71d46639ba3a7a2515139121dd8c737a6d6ada08d46c  $zip" | sha256sum -c -
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Extract
        id: project
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p77/project"
          mkdir -p "$root"
          unzip -q "${{ steps.src.outputs.zip }}" -d "$root"
          project="$root/sw_p74"
          chmod +x "$project/gradlew"
          echo "root=$project" >> "$GITHUB_OUTPUT"

      - name: Source gates
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/vtt/r46/final-runtime.js
          node --check app/src/main/assets/vtt/js/core/uiBridge.bundle.js
          node --test tests/r54-p76-tts-kokoro-pipeline.test.mjs tests/r54-p77-android-build-fix.test.mjs

      - name: Build
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Validate
        id: apk
        shell: bash
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          src="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -1)"
          test -n "$src"
          out="$RUNNER_TEMP/p77/out"
          mkdir -p "$out"
          apk="$out/BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk"
          cp "$src" "$apk"
          unzip -p "$apk" assets/vtt/r46-shell.html | grep -q 'data-version="1.0.77"'
          unzip -p "$apk" assets/vtt/r46/final-runtime.js | grep -q 'R54 P77'
          unzip -p "$apk" assets/vtt/r46/final-runtime.js | grep -q 'CAMPANHA'
          unzip -p "$apk" assets/vtt/r46/final-runtime.js | grep -q 'final-tts-engine'
          unzip -p "$apk" assets/vtt/r46/final-runtime.js | grep -q 'Velocidade Kokoro'
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/aapt" dump badging "$apk" | tee "$out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.starwarsedge'" "$out/APK_BADGING.txt"
          grep -q "versionCode='10077'" "$out/APK_BADGING.txt"
          grep -q "versionName='1.0.77'" "$out/APK_BADGING.txt"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$out/APK_SIGNATURE.txt"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          bytes="$(stat -c%s "$apk")"
          printf '%s  %s\n' "$sha" 'BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk' > "$out/BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk.sha256"
          printf 'STATUS=PASS\nRUNNER=ubuntu-latest\nAPK_BYTES=%s\nAPK_SHA256=%s\nPACKAGE=com.braseiro.starwarsedge\nVERSION_CODE=10077\nVERSION_NAME=1.0.77\nPACKAGED_CAMPAIGN_HUB=PASS\nPACKAGED_TTS_P77=PASS\nSIGNATURE=verified\n' "$bytes" "$sha" > "$out/P77_BUILD_PROOF.txt"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          set -euo pipefail
          repo='bra83/braseirobuild'
          tag='star-wars-r54-p77-apk'
          api='https://api.github.com'
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          code="$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' "${auth[@]}" "$api/repos/$repo/releases/tags/$tag")"
          if [ "$code" = 404 ]; then
            curl -fsSL -X POST "${auth[@]}" -H 'Content-Type: application/json'               -d '{"tag_name":"star-wars-r54-p77-apk","target_commitish":"main","name":"Braseiro Star Wars R54 P77 APK","body":"APK compilado e validado a partir do checkpoint P77 do Google Drive.","draft":false,"prerelease":false}'               "$api/repos/$repo/releases" > "$RUNNER_TEMP/release.json"
          elif [ "$code" != 200 ]; then
            cat "$RUNNER_TEMP/release.json"
            exit 1
          fi
          rid="$(python3 -c 'import json; print(json.load(open("'"$RUNNER_TEMP/release.json"'"))["id"])')"
          curl -fsSL "${auth[@]}" "$api/repos/$repo/releases/$rid/assets?per_page=100" > "$RUNNER_TEMP/assets.json"
          for path in "$APK_DIR"/*; do
            [ -f "$path" ] || continue
            name="$(basename "$path")"
            old="$(python3 -c 'import json,sys; n=sys.argv[1]; xs=json.load(open(sys.argv[2])); print(next((str(x["id"]) for x in xs if x["name"]==n),""))' "$name" "$RUNNER_TEMP/assets.json")"
            if [ -n "$old" ]; then curl -fsSL -X DELETE "${auth[@]}" "$api/repos/$repo/releases/assets/$old" >/dev/null; fi
            case "$name" in *.apk) ct='application/vnd.android.package-archive';; *) ct='text/plain';; esac
            curl -fsSL -X POST "${auth[@]}" -H "Content-Type: $ct" --data-binary "@$path" "https://uploads.github.com/repos/$repo/releases/$rid/assets?name=$name" >/dev/null
          done
