name: Export unchanged Star Wars P6 source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-star-wars-p6-source.yml'
permissions:
  contents: read
jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: star-wars/final-1.0.0/output-r54
      - uses: actions/upload-artifact@v4
        with:
          name: star-wars-p6-source-unchanged
          path: star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P6.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
