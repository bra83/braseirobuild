name: DND V1 - isolated manual XMM Backup21 E2E (BRELGA)
on:
  push:
    branches:
      - audit/dnd-v1-manual-backup-e2e-20261015
    paths:
      - .github/workflows/dnd-v1-independent-e2e-brelga.yml
      - dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/V1ManualBackupIsolationRobolectricTest.java
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnd-v1-independent-e2e-brelga
  cancel-in-progress: false

jobs:
  verify-independent-e2e:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Verify runner and source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw 'V1_E2E_EXPECTED_BRELGA' }
          Write-Host ('V1_E2E_SOURCE_SHA='+$env:GITHUB_SHA)
          Write-Host 'V1_E2E_SCOPE=XPHB_2024_XDMG_2024_XMM_2025'
          Write-Host 'V1_E2E_RELEASE_AUTHORIZATION=NO'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Verify Java and Android SDK
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          if (!(Test-Path '.\gradlew.bat')) { throw 'V1_E2E_WRAPPER_MISSING' }
          $java17='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if (Test-Path $java17) {
            Add-Content -Path $env:GITHUB_ENV -Value ('JAVA_HOME='+$java17)
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $java17 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if (!$sdk -or !(Test-Path $sdk)) { $sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk' }
          if (!(Test-Path $sdk)) { throw 'V1_E2E_ANDROID_SDK_MISSING' }
          Add-Content -Path $env:GITHUB_ENV -Value ('ANDROID_HOME='+$sdk)
          Add-Content -Path $env:GITHUB_ENV -Value ('ANDROID_SDK_ROOT='+$sdk)
          Write-Host 'V1_E2E_ENVIRONMENT=PASS'
      - name: Compile and run independent SQLite Backup21 Robolectric scenarios
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $xml='app/build/test-results/testDebugUnitTest'
          if (Test-Path $xml) { Remove-Item -LiteralPath $xml -Recurse -Force }
          & .\gradlew.bat :app:testDebugUnitTest --tests 'com.braseiro.dnd5e.V1ManualBackupIsolationRobolectricTest' --no-daemon --console=plain --stacktrace
          $exitCode=$LASTEXITCODE
          $report=Join-Path $xml 'TEST-com.braseiro.dnd5e.V1ManualBackupIsolationRobolectricTest.xml'
          if (!(Test-Path $report)) { throw 'V1_E2E_XML_MISSING' }
          [xml]$doc=Get-Content -LiteralPath $report -Raw
          $count=[int]$doc.testsuite.tests
          $fail=[int]$doc.testsuite.failures
          $errors=[int]$doc.testsuite.errors
          $skipped=[int]$doc.testsuite.skipped
          Write-Host ('V1_E2E_TESTS='+$count)
          Write-Host ('V1_E2E_FAILURES='+$fail+' V1_E2E_ERRORS='+$errors+' V1_E2E_SKIPPED='+$skipped)
          foreach($node in @($doc.SelectNodes('//testcase/failure | //testcase/error'))) {
            Write-Host ('V1_E2E_FAIL_CASE='+$node.ParentNode.GetAttribute('name'))
            Write-Host ('V1_E2E_FAIL_REASON='+$node.GetAttribute('message'))
          }
          if($exitCode -ne 0 -or $count -lt 2 -or $fail -gt 0 -or $errors -gt 0 -or $skipped -gt 0) {
            throw 'V1_E2E_INDEPENDENT_GATE_FAILED'
          }
          Write-Host 'V1_E2E_SQLITE_BACKUP21_MANUAL_XMM=PASS'
          Write-Host 'V1_E2E_GALAXY_A57=NOT_TESTED'
