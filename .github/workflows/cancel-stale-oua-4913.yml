name: Cancel stale OUA 4.9.13 builds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-oua-4913.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded OUA runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for id in 35626384652 35626510265; do
            echo "Cancelling stale OUA run $id"
            code=$(curl -sS -o /tmp/cancel-$id.txt -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$id/cancel")
            cat /tmp/cancel-$id.txt || true
            echo "HTTP $code"
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then
              exit 1
            fi
          done
