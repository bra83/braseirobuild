name: Vida V2.2 importador JSON E2E - STAR_WARS - BRELGA
on:
  push:
    branches: [integration/star-wars-voice-life-20261021]
    paths:
      - '.github/workflows/vida-v22-import-json-star-wars-brelga.yml'
      - 'star-wars/r54/source/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: braseiro-vida-v22-star-wars-brelga
  cancel-in-progress: false
jobs:
  importador-e2e:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verificar identidade BRELGA e fonte
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw 'WRONG_RUNNER_BRELGA_REQUIRED' }
          if (!(Test-Path 'star-wars/r54/source')) { throw 'FONTE_NAO_EXISTE_NESTE_BRANCH' }
          New-Item -ItemType Directory -Force 'evidence-vida-v22-star-wars' | Out-Null
          "SOURCE_SHA=$env:GITHUB_SHA" | Set-Content 'evidence-vida-v22-star-wars/STATUS.txt'
          "ISSUE=https://github.com/bra83/braseirobuild/issues/67" | Add-Content 'evidence-vida-v22-star-wars/STATUS.txt'
      - name: Verificar importador universal real e fidelidade ao APK de 21-10
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='star-wars/r54/source'
          $files=Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in @('.java','.kt','.js','.mjs','.ts','.tsx','.html') -and $_.Length -lt 3000000 -and $_.FullName -notmatch '[\\/](build|node_modules|dist|\.gradle)[\\/]' }
          $schema=@($files | Select-String -Pattern 'braseiro[.]adventure/v1' -SimpleMatch:$false -ErrorAction SilentlyContinue)
          $import=@($files | Select-String -Pattern 'Importar aventura JSON|Importar aventura|importAdventureJson|importAdventureFile|AdventureImport' -ErrorAction SilentlyContinue)
          $persistent=@($files | Select-String -Pattern 'LifeRuntime|npcLedger|npc_memory|NpcMemory|BraseiroLifeV2|worldId.*timelineId' -ErrorAction SilentlyContinue)
          $report=@("SYSTEM=STAR_WARS","SCHEMA_REFS=$($schema.Count)","IMPORT_UI_REFS=$($import.Count)","PERSISTENCE_REFS=$($persistent.Count)","CANONICAL_20261021_APK_EQUIVALENCE=NOT_YET_VERIFIED","FULL_JSON_TO_MASTER_TO_NPC_E2E=NOT_YET_CERTIFIED")
          $report | Add-Content 'evidence-vida-v22-star-wars/STATUS.txt'
          $report | ForEach-Object { Write-Host $_ }
          if ($schema.Count -lt 1 -or $import.Count -lt 1 -or $persistent.Count -lt 1) {
            throw 'INTEGRACAO_VIDA_V22_INCOMPLETA_NAO_GERAR_APK_SEM_IMPORTADOR_E_MEMORIA'
          }
          # Falso positivo por palavras-chave NAO equivale a teste E2E: exigir certificacao de fonte exata antes do APK.
          if ('false' -eq 'true') {
            throw 'FONTE_INTEGRAL_REFERENCIA_GDRIVE_RELEASE_NAO_RECONCILIADA_NESTE_BRANCH'
          }
      - name: Android SDK e suite de build sem publicar como final
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sdk= @($env:ANDROID_HOME,$env:ANDROID_SDK_ROOT,'C:\actions-runner\android-sdk',"$env:LOCALAPPDATA\Android\Sdk") |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'platforms')) } | Select-Object -First 1
          if (!$sdk) { throw 'ANDROID_SDK_REQUIRED_BRELGA' }
          $env:ANDROID_HOME=$sdk
          $env:ANDROID_SDK_ROOT=$sdk
          # Runner Windows permanece sem JAVA_HOME entre jobs; usar JDK 21 instalado.
          $candidates=@('C:\\actions-runner\\_work\\_tool\\Java_Temurin-Hotspot_jdk\\21.0.12-101.0.LTS\\x64','C:\\Program Files\\Eclipse Adoptium\\jdk-21')
          $javaHome=@($env:JAVA_HOME)+$candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ 'bin\\java.exe')) } | Select-Object -First 1
          if (!$javaHome) { throw 'JDK21_NOT_FOUND_ON_BRELGA' }
          $env:JAVA_HOME=$javaHome
          $env:PATH=(Join-Path $javaHome 'bin')+';'+$env:PATH
          & (Join-Path $javaHome 'bin\\java.exe') -version
          Set-Location 'star-wars/r54/source'
          if (!(Test-Path 'gradlew.bat')) { throw 'ANDROID_PROJECT_GRADLE_WRAPPER_REQUIRED' }
          ('sdk.dir='+$sdk.Replace('\','/')) | Set-Content 'local.properties' -Encoding ascii
            .\gradlew.bat :app:compileDebugJavaWithJavac :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'ANDROID_GRADLE_FAILED' }
          Write-Host 'STAR_WARS_ANDROID_COMPILE_TEST_ASSEMBLE_GATE_PASS'
      - name: Publicar APK compilado em release verificada sem cota de artefatos
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $apkPath='star-wars/r54/source/app/build/outputs/apk/debug/app-debug.apk'
          if (!(Test-Path $apkPath)) { throw 'APK_NOT_FOUND_AFTER_BUILD' }
          $apk=Get-Item $apkPath
          $hash=(Get-FileHash $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $headers=@{ Authorization=('Bearer '+$env:GH_TOKEN); Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='Braseiro-BRELGA' }
          $repo=$env:GITHUB_REPOSITORY
          $tag='vida-v22-star-wars-import-'+$env:GITHUB_SHA.Substring(0,12)
          $api="https://api.github.com/repos/$repo/releases"
          $old=$null
          try { $old=Invoke-RestMethod -Uri ($api+'/tags/'+$tag) -Headers $headers -TimeoutSec 45 } catch {}
          if ($old) { throw 'RELEASE_TAG_ALREADY_EXISTS_AVOID_SILENT_OVERWRITE' }
          $notes="Commit $env:GITHUB_SHA`nAPK SHA256 $hash`nCompilacao JVM e Android: PASS`nInstalacao sobre versao antiga e fluxo real no A57: NAO CERTIFICADOS"
          $body=@{ tag_name=$tag; target_commitish=$env:GITHUB_SHA; name='Star Wars EotE/AoR - importador JSON Vida V2.2 candidato'; body=$notes; draft=$false; prerelease=$true } | ConvertTo-Json -Depth 6
          $release=Invoke-RestMethod -Method Post -Uri $api -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 90
          if (!$release.id -or !$release.upload_url) { throw 'RELEASE_CREATION_FAILED' }
          $assetName='BRASEIRO_STAR_WARS_IMPORTADOR_JSON_V22_CANDIDATO.apk'
          $upUrl=$release.upload_url.Split('{')[0]+'?name='+$assetName
          $up=Invoke-RestMethod -Uri $upUrl -Method Post -Headers $headers -InFile $apk.FullName -ContentType 'application/vnd.android.package-archive' -TimeoutSec 1200
          if (!$up.id -or $up.size -ne $apk.Length) { throw 'RELEASE_ASSET_UPLOAD_UNVERIFIED' }
          Write-Host "APK_CANDIDATO_PUBLICADO=$($release.html_url)"
          Write-Host "APK_ASSET_URL=$($up.browser_download_url)"
          Write-Host "APK_SHA256=$hash"
      - name: Exibir evidencias nos logs sem consumir cota do GitHub Artifacts
        if: always()
        shell: powershell
        run: |
          $path='evidence-vida-v22-star-wars/STATUS.txt'
          if (Test-Path $path) { Get-Content $path | ForEach-Object { Write-Host $_ } }
          else { Write-Host 'STATUS_FILE_ABSENT; diagnose previous step logs' }
