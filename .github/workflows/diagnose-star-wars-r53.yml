name: Diagnose Star Wars R53 regressions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-star-wars-r53.yml", "STAR_WARS_R53_DIAG_TRIGGER.txt"]
permissions: {contents: write}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://firestorage.ai/ja/f/qPKfDLdfrlCc
      BASE_FILE: STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R38_BUILD_FIX.zip
      BASE_SHA: e925d7c2885e51b4f03dfe55ec7f477deb23ee0551b7b30f3a457154db9dd872
      OVERLAY_URL: https://firestorage.ai/ja/f/jX7837AeIyT-
      OVERLAY_FILE: STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_FINAL_1.0.0_BUILD_FIX2.zip
      OVERLAY_SHA: b017bbd3abfebad17011f9df29fcaa5c3d1fef66750add762a55f3b46d7349c4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download baseline and overlay
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          mkdir -p incoming
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          pairs=[('BASE_URL','BASE_FILE'),('OVERLAY_URL','OVERLAY_FILE')]
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for uk,fk in pairs:
              url=os.environ[uk]; fn=os.environ[fk]; out=pathlib.Path('incoming')/fn
              page=b.new_page(accept_downloads=True)
              page.goto(url,wait_until='domcontentloaded',timeout=120000); page.wait_for_timeout(3000)
              done=False
              for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
                try:
                  loc=page.locator(sel).first
                  if not loc.count() or not loc.is_visible(): continue
                  with page.expect_download(timeout=120000) as info: loc.click(timeout=10000)
                  info.value.save_as(str(out)); done=True; break
                except Exception: pass
              if not done:
                card=page.get_by_text(fn,exact=False).first
                ctrl=card.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last
                with page.expect_download(timeout=120000) as info: ctrl.click(timeout=10000)
                info.value.save_as(str(out)); done=True
              page.close()
              if not done or not out.exists(): raise SystemExit(f'download failed: {fn}')
            b.close()
          PY
          echo "$BASE_SHA  incoming/$BASE_FILE" | sha256sum -c -
          echo "$OVERLAY_SHA  incoming/$OVERLAY_FILE" | sha256sum -c -
      - name: Inspect regressions and replacement assets
        run: |
          set -euo pipefail
          rm -rf base overlay; mkdir base overlay
          unzip -q "incoming/$BASE_FILE" -d base
          unzip -q "incoming/$OVERLAY_FILE" -d overlay
          BSET="$(find base -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/build/*' | head -n1)"
          OSET="$(find overlay -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/build/*' | head -n1)"
          BROOT="$(dirname "$BSET")"; OROOT="$(dirname "$OSET")"
          mkdir -p star-wars/r53/diagnostics
          python3 - "$BROOT" "$OROOT" <<'PY' > star-wars/r53/diagnostics/discovery.txt
          import json,re,sys
          from pathlib import Path
          broot,oroot=map(Path,sys.argv[1:3])
          def rels(root, sub):
            p=root/sub
            return [str(x.relative_to(root)) for x in sorted(p.rglob('*')) if x.is_file()] if p.exists() else []
          print('=== OVERLAY MAP FILES ===')
          for x in rels(oroot,Path('app/src/main/assets/vtt/assets/maps')): print(x)
          print('\n=== BASE MAP FILES ===')
          for x in rels(broot,Path('app/src/main/assets/vtt/assets/maps')): print(x)
          for label,root in [('OVERLAY',oroot),('BASE',broot)]:
            mp=root/'app/src/main/assets/vtt/image-library/manifest.json'
            print(f'\n=== {label} MANIFEST MAPS ===')
            if mp.exists():
              try:
                data=json.loads(mp.read_text('utf-8'))
                for a in data.get('assets',[]):
                  if a.get('category')=='map':
                    print(json.dumps({k:a.get(k) for k in ('assetId','title','subtype','mapKind','sourceType','localPath','sourceRef','tags')},ensure_ascii=False))
              except Exception as e: print('manifest parse error',repr(e))
            else: print('NO MANIFEST')
          print('\n=== OVERLAY LIKELY MAP IMAGE FILES ===')
          for x in rels(oroot,Path('app/src/main/assets/vtt/image-library')):
            low=x.lower()
            if any(t in low for t in ('map','galax','sector','planet','tatooine','mos_','mos-')) and low.endswith(('.png','.jpg','.jpeg','.webp')): print(x)
          print('\n=== BRIDGE / DICE METHODS BASE ===')
          for candidate in [
            broot/'app/src/main/assets/vtt/js/core/uiBridge.bundle.js',
            broot/'app/src/main/assets/vtt/js/core/controller.mjs',
            oroot/'app/src/main/assets/vtt/js/core/uiBridge.bundle.js',
            oroot/'app/src/main/assets/vtt/js/core/controller.mjs']:
            print('\nFILE',candidate)
            if not candidate.exists(): print('MISSING'); continue
            s=candidate.read_text('utf-8',errors='ignore')
            methods=sorted(set(re.findall(r'\n\s{0,8}([A-Za-z_$][\w$]{2,})\s*\([^\n]{0,140}\)\s*\{',s)))
            hits=[m for m in methods if re.search(r'(dice|roll|check|test|resolve|pool|adventure|sandbox|reset|restart|campaign|state)',m,re.I)]
            print('METHODS',', '.join(hits))
            for pat in ('resolveSuggestedMasterCheck','roll','dice','reset','restart','startLivingAdventure','initializeLivingSandbox'):
              if pat.lower() in s.lower():
                print('HIT',pat)
                for m in re.finditer(re.escape(pat),s,re.I):
                  print(s[max(0,m.start()-180):m.start()+420].replace('\n',' ')[:650]); break
          print('\n=== OVERLAY EQUIPMENT IMAGE SAMPLE ===')
          eq=[]
          for x in rels(oroot,Path('app/src/main/assets/vtt/image-library')):
            if x.lower().endswith(('.png','.jpg','.jpeg','.webp')) and any(t in x.lower() for t in ('weapon','weapons','equipment','arma','blaster','pistol','rifle','carabina')): eq.append(x)
          for x in eq[:160]: print(x)
          print('COUNT',len(eq))
          PY
          cat star-wars/r53/diagnostics/discovery.txt
      - name: Persist diagnostics
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add star-wars/r53/diagnostics/discovery.txt
          git commit -m 'diag: Star Wars R53 map and dice discovery' || true
          git push origin HEAD:main
