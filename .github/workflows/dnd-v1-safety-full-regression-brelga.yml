name: DND V1 - complete Android regression after undo safety fix
on:
  push:
    branches: [audit/dnd-v1-manual-revert-safety-20261016]
    paths:
      - '.github/workflows/dnd-v1-safety-full-regression-brelga.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: dnd-v1-manual-revert-full-brelga
  cancel-in-progress: false
jobs:
  full:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - name: Pin tested SHA and BRELGA
        shell: powershell
        run: |
          if ($env:RUNNER_NAME -ne 'BRELGA') {throw 'BRELGA_REQUIRED'}
          Write-Host ('DND_V1_FULL_SHA='+$env:GITHUB_SHA)
          Write-Host 'DND_APK_BUILD=NO'
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Configure Android and isolated Gradle
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $java='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if(Test-Path $java){
            Add-Content $env:GITHUB_ENV ('JAVA_HOME='+$java)
            Add-Content $env:GITHUB_PATH (Join-Path $java 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if(!$sdk -or !(Test-Path $sdk)){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if(!(Test-Path $sdk)){throw 'ANDROID_SDK_MISSING'}
          Add-Content $env:GITHUB_ENV ('ANDROID_HOME='+$sdk)
          Add-Content $env:GITHUB_ENV ('ANDROID_SDK_ROOT='+$sdk)
          $base=Join-Path $env:USERPROFILE '.gradle'
          $gradle=Join-Path $env:RUNNER_TEMP ('v1-full-safety-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $gradle | Out-Null
          foreach($entry in @('wrapper','caches')){
            $source=Join-Path $base $entry;$target=Join-Path $gradle $entry
            if((Test-Path $source)-and !(Test-Path $target)){
              New-Item -ItemType Junction -Path $target -Target $source | Out-Null
            }
          }
          Add-Content $env:GITHUB_ENV ('GRADLE_USER_HOME='+$gradle)
      - name: Full real Android unit suite, including stale undo test
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
          $code=$LASTEXITCODE
          $reports=@()
          if(Test-Path $dir){$reports=@(Get-ChildItem -LiteralPath $dir -Filter 'TEST-*.xml' -File)}
          $total=0;$fail=0;$errors=0;$skipped=0
          foreach($file in $reports){
            [xml]$doc=Get-Content -LiteralPath $file.FullName -Raw
            $total += [int]$doc.testsuite.tests
            $fail += [int]$doc.testsuite.failures
            $errors += [int]$doc.testsuite.errors
            $skipped += [int]$doc.testsuite.skipped
            foreach($n in @($doc.SelectNodes('//testcase/failure | //testcase/error'))){
              Write-Host ('V1_FAIL_CASE='+$n.ParentNode.GetAttribute('classname')+'::'+$n.ParentNode.GetAttribute('name'))
              Write-Host ('V1_FAIL_MESSAGE='+$n.GetAttribute('message'))
            }
          }
          Write-Host ('V1_SAFETY_FULL_TESTS='+$total)
          Write-Host ('V1_SAFETY_FULL_XMLS='+$reports.Count)
          Write-Host ('V1_SAFETY_FULL_FAIL='+$fail+' ERR='+$errors+' SKIP='+$skipped)
          $must=Join-Path $dir 'TEST-com.braseiro.dnd5e.V1ManualRevertSafetyRobolectricTest.xml'
          if(!(Test-Path $must)){throw 'V1_STALE_REVERT_XML_MISSING'}
          if($code -ne 0 -or $fail -ne 0 -or $errors -ne 0 -or $skipped -ne 0 -or $total -lt 2677){throw 'V1_FULL_AFTER_SAFETY_NOT_GREEN'}
          Write-Host 'V1_SAFETY_FULL_ANDROID=PASS'
          Write-Host 'V1_NO_PHYSICAL_ANDROID_APPROVAL_BY_THIS_GATE=YES'
