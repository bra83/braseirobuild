          const known0=knownJourneyLocations(state,state.contentState.public);assert.deepEqual(known0.majorSites.map(x=>x.name),['Ruínas da Vigília']);assert.equal(known0.minorPois.length,0);
          const discovered=structuredClone(state);discovered.worldState.atlas.hexes['18,22']={q:18,r:22,discovered:true,poiRevealed:true,poiName:'Torre do Corvo Mudo'};const known1=knownJourneyLocations(discovered,discovered.contentState.public);assert.equal(known1.minorPois.some(x=>x.name==='Torre do Corvo Mudo'),true);
          const p2=new MemoryPersistenceAdapter();const boot=ensureStarterCampaign({persistence:p2,character,pack,campaignId:'starter-test'});assert.equal(boot.status,'OK_CREATED');assert.equal(boot.openingStatus,'OK');assert.equal(p2.loadCampaign('starter-test').revision,1);
          let calls=0;const native={geminiStatus:()=>JSON.stringify({status:'OK',configured:true,textModel:'test-model',visionEnabled:true}),geminiGenerateText:(payload)=>{calls++;return JSON.stringify({status:'OK',model:'test-model',text:calls===1?'Cena curta demais.':'presença '.repeat(920)});}};const provider=new RuntimeBarbaraProvider({native,ragSearch:null,ragSearchAsync:null});const narrated=await provider.generateAsync({mechanicalEvent:event,state});assert.equal(calls,2);assert.equal(narrated.majorExpanded,true);assert.ok(narrated.wordCount>=700);
          console.log('WWN_1_0_10_FUNCTIONAL_AUDIT_PASS');
