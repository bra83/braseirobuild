name: WWN 1.0.10 World Opening and Discovery Closure

on:
  push:
    branches: [wwn-source-105-bridge]
    paths:
      - ".github/workflows/wwn-1.0.10-world-opening-discovery.yml"

permissions:
  contents: write

jobs:
  patch-test-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge
          fetch-depth: 0

      - name: Apply world-opening discovery and narrative fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'{label}: pattern not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          rep('app/build.gradle.kts','versionCode = 109; versionName = "1.0.9"','versionCode = 110; versionName = "1.0.10"','version')

