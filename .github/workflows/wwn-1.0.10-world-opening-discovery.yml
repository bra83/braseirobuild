      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find /usr/local/lib/android /opt /home/runner -type f -name sdkmanager -perm -111 2>/dev/null | head -n1 || true)"; fi
          test -n "$SDKMANAGER"
          SDK_ROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Collect validate and publish source-branch APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out delivery
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" out/BRASEIRO_WWN_v1.0.10.apk
          unzip -t out/BRASEIRO_WWN_v1.0.10.apk >/dev/null
          sha256sum out/BRASEIRO_WWN_v1.0.10.apk | tee out/BRASEIRO_WWN_v1.0.10.apk.sha256
          cp out/BRASEIRO_WWN_v1.0.10.apk delivery/BRASEIRO_WWN_v1.0.10.apk
          cp out/BRASEIRO_WWN_v1.0.10.apk.sha256 delivery/BRASEIRO_WWN_v1.0.10.apk.sha256
          git add delivery/BRASEIRO_WWN_v1.0.10.apk delivery/BRASEIRO_WWN_v1.0.10.apk.sha256
          git commit -m "build: publish WWN 1.0.10 APK"
          git push origin HEAD:wwn-source-105-bridge

      - name: Publish visible APK on main with retry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/wwn-main
          git worktree add --detach /tmp/wwn-main origin/main
          cd /tmp/wwn-main
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          mkdir -p delivery
          cp "$GITHUB_WORKSPACE/out/BRASEIRO_WWN_v1.0.10.apk" BRASEIRO_WWN_v1.0.10.apk
          cp "$GITHUB_WORKSPACE/out/BRASEIRO_WWN_v1.0.10.apk" delivery/BRASEIRO_WWN_v1.0.10.apk
          cp "$GITHUB_WORKSPACE/out/BRASEIRO_WWN_v1.0.10.apk.sha256" delivery/BRASEIRO_WWN_v1.0.10.apk.sha256
          git add BRASEIRO_WWN_v1.0.10.apk delivery/BRASEIRO_WWN_v1.0.10.apk delivery/BRASEIRO_WWN_v1.0.10.apk.sha256
          git commit -m "release: publish BRASEIRO WWN v1.0.10 APK"
          for attempt in 1 2 3; do git fetch origin main;git rebase origin/main;if git push origin HEAD:main;then exit 0;fi;sleep 2;done
          exit 1
