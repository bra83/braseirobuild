          new="  async generateAsync({mechanicalEvent,state,ragSnippets=[]}){const {snippets,context}=await this._contextAsync({mechanicalEvent,state,ragSnippets});const status=this.status();if(status.status!=='OK'||status.configured!==true||(!this.native?.geminiGenerateTextAsync&&!this.native?.geminiGenerateText))return this.localFallback({mechanicalEvent,state,ragSnippets:snippets});try{const imageUrl=this._image(status,state,mechanicalEvent);let result=await awaitNativeGemini(this.native,requestPayload(status,context,imageUrl));if(result.status!=='OK'||!String(result.text??'').trim())return Object.freeze({...this.localFallback({mechanicalEvent,state,ragSnippets:snippets}),geminiFallbackReason:result.reason??result.status??'EMPTY'});let majorExpanded=false;if(isMajorNarration(context)&&wordCount(result.text)<MIN_MAJOR_WORDS){const expanded=await awaitNativeGemini(this.native,expansionPayload(status,context,imageUrl,result.text));if(expanded.status==='OK'&&wordCount(expanded.text)>wordCount(result.text)){result=expanded;majorExpanded=true;}}return Object.freeze({status:'OK',provider:'GEMINI_NATIVE',model:result.model,imageAttached:result.imageAttached===true,parentMechanicalEventId:mechanicalEvent.eventId,mechanicalRevision:mechanicalEvent.revision,text:String(result.text).trim(),majorExpanded,wordCount:wordCount(result.text)})}catch(error){return Object.freeze({...this.localFallback({mechanicalEvent,state,ragSnippets:snippets}),geminiFallbackReason:String(error?.message??error)})}}"
          if old not in s: raise SystemExit('narrative generateAsync expansion pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

