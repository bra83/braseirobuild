      - name: Commit 1.0.10 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add app/build.gradle.kts app/src/main/assets/www/core/campaign-opening.js app/src/main/assets/www/core/journey-discovery.js app/src/main/assets/www/core/campaign-manager-service.js app/src/main/assets/www/core/starter-bootstrap.js app/src/main/assets/www/jornada.js app/src/main/assets/www/core/runtime-narrative-provider.js app/src/main/assets/www/mochila.js app/src/main/assets/www/ux-hotfix.js
