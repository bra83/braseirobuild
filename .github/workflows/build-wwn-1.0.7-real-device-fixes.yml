name: Build WWN 1.0.7 Real Device Fixes

on:
  push:
    branches: [wwn-source-105-bridge]
    paths:
      - ".github/workflows/build-wwn-1.0.7-real-device-fixes.yml"

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout corrected WWN source
        uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge
          fetch-depth: 0

      - name: Validate 1.0.7 source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 107' app/build.gradle.kts
          grep -q 'versionName = "1.0.7"' app/build.gradle.kts
          node --check app/src/main/assets/www/ux-hotfix.js
          node --check app/src/main/assets/www/configuracoes.js
          node --check app/src/main/assets/www/jornada.js
          node --check app/src/main/assets/www/scr014.js
          python3 - <<'PY'
          from pathlib import Path
          ux=Path('app/src/main/assets/www/ux-hotfix.js').read_text(encoding='utf-8')
          cfg=Path('app/src/main/assets/www/configuracoes.js').read_text(encoding='utf-8')
          journey=Path('app/src/main/assets/www/jornada.html').read_text(encoding='utf-8')
          for x in ["return'torch'","return'lantern'","return'liquid'","return'rope'","return'food'","return'tool'","PENDING_SCENE_IMAGE_KEY","lockWorldFlow"]:
              assert x in ux, x
          flow=cfg.split("$('createCampaign').onclick",1)[1].split('refreshCampaignManager()',1)[0]
          assert "location.href='criacao.html'" not in flow
          assert "location.href='jornada.html'" in flow
          assert 'OPERAÇÕES DO MESTRE' not in journey
          assert '>GESTÃO<' not in journey
          assert 'opcionais • sandbox livre' in journey
          print('WWN_1_0_7_REAL_DEVICE_CONTRACTS_PASS')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android /opt /home/runner -type f -name sdkmanager -perm -111 2>/dev/null | head -n1 || true)"
          fi
          test -n "$SDKMANAGER"
          SDK_ROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Collect and hash APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" out/BRASEIRO_WWN_v1.0.7.apk
          unzip -t out/BRASEIRO_WWN_v1.0.7.apk >/dev/null
          sha256sum out/BRASEIRO_WWN_v1.0.7.apk | tee out/BRASEIRO_WWN_v1.0.7.apk.sha256
          stat -c 'APK_SIZE_BYTES=%s' out/BRASEIRO_WWN_v1.0.7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-WWN-1.0.7-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to source branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp out/BRASEIRO_WWN_v1.0.7.apk delivery/BRASEIRO_WWN_v1.0.7.apk
          cp out/BRASEIRO_WWN_v1.0.7.apk.sha256 delivery/BRASEIRO_WWN_v1.0.7.apk.sha256
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add delivery/BRASEIRO_WWN_v1.0.7.apk delivery/BRASEIRO_WWN_v1.0.7.apk.sha256
          git commit -m "build: publish WWN 1.0.7 APK"
          git push origin HEAD:wwn-source-105-bridge

      - name: Publish visible APK on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/wwn-main
          git worktree add /tmp/wwn-main origin/main
          cd /tmp/wwn-main
          git switch -c publish-wwn-107
          mkdir -p delivery
          cp "$GITHUB_WORKSPACE/out/BRASEIRO_WWN_v1.0.7.apk" BRASEIRO_WWN_v1.0.7.apk
          cp "$GITHUB_WORKSPACE/out/BRASEIRO_WWN_v1.0.7.apk" delivery/BRASEIRO_WWN_v1.0.7.apk
          cp "$GITHUB_WORKSPACE/out/BRASEIRO_WWN_v1.0.7.apk.sha256" delivery/BRASEIRO_WWN_v1.0.7.apk.sha256
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add BRASEIRO_WWN_v1.0.7.apk delivery/BRASEIRO_WWN_v1.0.7.apk delivery/BRASEIRO_WWN_v1.0.7.apk.sha256
          git commit -m "release: publish BRASEIRO WWN v1.0.7 APK"
          git push origin HEAD:main
