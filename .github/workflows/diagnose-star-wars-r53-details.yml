name: Diagnose Star Wars R53 details
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-star-wars-r53-details.yml"]
permissions: {contents: write}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://firestorage.ai/ja/f/qPKfDLdfrlCc
      BASE_FILE: STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R38_BUILD_FIX.zip
      BASE_SHA: e925d7c2885e51b4f03dfe55ec7f477deb23ee0551b7b30f3a457154db9dd872
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download baseline
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          mkdir -p incoming
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['BASE_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);page=b.new_page(accept_downloads=True)
            page.goto(os.environ['BASE_URL'],wait_until='domcontentloaded',timeout=120000);page.wait_for_timeout(3000)
            done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
              try:
                loc=page.locator(sel).first
                if not loc.count() or not loc.is_visible(): continue
                with page.expect_download(timeout=120000) as info: loc.click(timeout=10000)
                info.value.save_as(str(out));done=True;break
              except Exception: pass
            if not done:
              card=page.get_by_text(os.environ['BASE_FILE'],exact=False).first
              ctrl=card.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last
              with page.expect_download(timeout=120000) as info: ctrl.click(timeout=10000)
              info.value.save_as(str(out));done=True
            b.close()
          if not done or not out.exists(): raise SystemExit('download failed')
          PY
          echo "$BASE_SHA  incoming/$BASE_FILE" | sha256sum -c -
      - name: Extract exact APIs
        run: |
          set -euo pipefail
          rm -rf base;mkdir base;unzip -q "incoming/$BASE_FILE" -d base
          SET="$(find base -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/build/*' | head -n1)";ROOT="$(dirname "$SET")"
          mkdir -p star-wars/r53/diagnostics
          python3 - "$ROOT" <<'PY' > star-wars/r53/diagnostics/details.txt
          import json,re,sys
          from pathlib import Path
          root=Path(sys.argv[1]);vtt=root/'app/src/main/assets/vtt'
          def body(text,name):
            for pat in [rf'\n\s*{re.escape(name)}\s*\(([^\n]*)\)\s*\{{',rf'\n\s*{re.escape(name)}\s*=\s*\(([^\n]*)\)\s*=>\s*\{{']:
              m=re.search(pat,text)
              if not m: continue
              start=m.start();brace=text.find('{',m.end()-1);depth=0;ins=False;esc=False;q=''
              for i in range(brace,len(text)):
                c=text[i]
                if ins:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==q: ins=False
                  continue
                if c in ('\"',"'"):ins=True;q=c;continue
                if c=='{':depth+=1
                elif c=='}':
                  depth-=1
                  if depth==0:return text[start:i+1]
            return 'NOT FOUND'
          for p in [vtt/'js/core/uiBridge.bundle.js',vtt/'js/core/controller.mjs',vtt/'js/rules/narrativeDice.mjs']:
            print('\n===',p.name,'===')
            if not p.exists():print('MISSING');continue
            s=p.read_text('utf-8',errors='ignore')
            if p.name=='narrativeDice.mjs': print(s[:24000])
            else:
              for n in ['resolveCheck','resolveSkillCheck','newCampaign','initializeCampaign','startLivingAdventure']:
                print('\n---',n,'---\n',body(s,n)[:12000])
          mp=vtt/'image-library/manifest.json';data=json.loads(mp.read_text('utf-8'))
          print('\n=== MAP REMOTE DETAILS ===')
          for a in data.get('assets',[]):
            if a.get('assetId') in {'external.kainrath.map.galaxy-v24','external.kainrath.map.mos-eisley-city','external.kainrath.map.mos-eisley-central-sector','local.map.galaxy'}:
              print(json.dumps(a,ensure_ascii=False))
          print('\n=== LOCAL EQUIPMENT ASSETS ===')
          for a in data.get('assets',[]):
            if a.get('category')=='equipment' and a.get('localPath'):
              print(json.dumps(a,ensure_ascii=False))
          PY
          cat star-wars/r53/diagnostics/details.txt
      - name: Persist details
        run: |
          git config user.name github-actions;git config user.email actions@users.noreply.github.com
          git add star-wars/r53/diagnostics/details.txt
          git commit -m 'diag: Star Wars R53 exact dice and map APIs' || true
          git push origin HEAD:main
