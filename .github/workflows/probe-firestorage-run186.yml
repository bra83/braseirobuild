name: Probe firestorage RUN186 patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-firestorage-run186.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch share page
        shell: bash
        run: |
          set -euxo pipefail
          base='https://firestorage.ai'
          page='/tmp/page'
          curl -L -sS 'https://firestorage.ai/ja/f/I7FvCHLdbGB6' -o "$page"
          chunk=$(grep -Eo '/_next/static/chunks/app/\(files\)/ja/f/page-[^"]+\.js' "$page" | head -1)
          echo "CHUNK=$chunk"
          curl -L -sS "$base$chunk" -o /tmp/chunk.js
          wc -c /tmp/chunk.js
          grep -Eo '["'\''\x60][^"'\''\x60]{0,160}(download|share|file|folder|api)[^"'\''\x60]{0,240}["'\''\x60]' /tmp/chunk.js | head -250 || true
          echo '--- API-like paths ---'
          grep -Eo '/api/[A-Za-z0-9_?&=./:$(){}-]+' /tmp/chunk.js | sort -u | head -200 || true
          echo '--- endpoints around fetch ---'
          grep -o '.\{0,180\}fetch(.\{0,360\}' /tmp/chunk.js | head -100 || true
