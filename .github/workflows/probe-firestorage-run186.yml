name: Probe firestorage RUN186 patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-firestorage-run186.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch share page
        shell: bash
        run: |
          set -euxo pipefail
          base='https://firestorage.ai'
          page='/tmp/page'
          curl -L -sS 'https://firestorage.ai/ja/f/I7FvCHLdbGB6' -o "$page"
          mkdir -p /tmp/chunks
          grep -Eo 'src="[^"]+\.js"' "$page" | sed 's/^src="//;s/"$//' | sort -u > /tmp/scripts
          cat /tmp/scripts
          n=0
          while read -r src; do
            n=$((n+1))
            out="/tmp/chunks/$n.js"
            curl -L -sS "$base$src" -o "$out"
            echo "=== $src $(wc -c < "$out") bytes ==="
            grep -Eo '/api/[A-Za-z0-9_?&=./:$(){}-]+' "$out" | sort -u | head -200 || true
            grep -Eo '.{0,180}(download|shareId|publicId|signed|presign|fileName|files/).{0,280}' "$out" | head -100 || true
          done < /tmp/scripts
