name: Probe firestorage RUN186 patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-firestorage-run186.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch share page
        shell: bash
        run: |
          set -euxo pipefail
          u='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          curl -L -sS "$u" -o /tmp/x.js
          wc -c /tmp/x.js
          echo '--- URLs ---'
          grep -Eo 'https?[^"'\''` ]+' /tmp/x.js | sort -u | head -100 || true
          echo '--- f assignments/context ---'
          grep -Eo '.{0,300}(apiBase|API|let f=|const f=|f=.{0,120}shares/).{0,500}' /tmp/x.js | head -100 || true
          echo '--- shares context ---'
          grep -Eo '.{0,500}/shares/.{0,700}' /tmp/x.js | head -60 || true
