name: Probe firestorage RUN186 patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-firestorage-run186.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect API base
        shell: bash
        run: |
          set -euo pipefail
          curl -L -sS 'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js' -o /tmp/x.js
          python - <<'PY'
          import re
          s=open('/tmp/x.js',encoding='utf-8').read()
          print('LEN',len(s))
          for needle in ['https://','http://','/shares/','/objects/','download','files?maxResults','File API returned']:
              print('\nNEEDLE',needle)
              start=0
              for _ in range(20):
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-900):min(len(s),i+1800)])
                  print('\n---\n')
                  start=i+len(needle)
          PY
