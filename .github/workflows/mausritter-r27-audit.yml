name: Mausritter R27 - inspecao fonte R26
on:
  push:
    branches:
      - work/mausritter-r27-integridade-20261105
    paths:
      - .github/workflows/mausritter-r27-audit.yml
      - mausritter-r27/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact canonical R26 source
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/bra83/braseirobuild/releases/download/mausritter-6.1.0-r26/Mausritter_Mestre_Vivo_6.1.0-r26_SCREEN_SESSION_ANDROID_STUDIO.zip"
          curl --fail --location --retry 4 --retry-delay 3 --silent --show-error -o /tmp/r26.zip "$url"
          echo '972e10a3d98f8ef07b7cdfe762866ab4ea02aa9bfcf9bc032fc8dd3173ebaa9c  /tmp/r26.zip' | sha256sum -c -
          mkdir -p /tmp/r26
          unzip -q /tmp/r26.zip -d /tmp/r26
          find /tmp/r26 -name 'MausritterRules.java' -o -name 'MausritterGameMasterEngine.java' -o -name 'AppDb.java' -o -name 'atlas_vivo.js' | head -25
      - name: Inspect P0/P1 methods without modifying sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/r26')
          hints={
          'MausritterRules.java':[(162,183),(570,610),(630,675)],
          'MausritterGameMasterEngine.java':[(90,152)],
          'AppDb.java':[(930,1010)],
          'MainActivity.java':[(2025,2075),(2680,2745),(3780,3810)],
          'atlas_vivo.js':[(350,395),(495,545),(580,630)],
          }
          for name, spans in hints.items():
              paths=list(root.rglob(name))
              print('\n=======FILE',name,'COUNT',len(paths),'=======')
              for p in paths[:2]:
                  print('PATH',p.relative_to(root))
                  a=p.read_text(encoding='utf-8',errors='replace').splitlines()
                  print('TOTAL_LINES',len(a))
                  for lo,hi in spans:
                      if lo>len(a):continue
                      print('-----',lo,hi,'-----')
                      print('\n'.join(f'{i+1:05d}: {a[i]}' for i in range(max(lo-1,0),min(hi,len(a)))))
          PY

      - name: Inspect canonical call sites and state shapes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=next(Path('/tmp/r26').glob('*/android'))
          specs={
           'app/src/main/java/com/braseiro/dnd/MausritterGameMasterEngine.java':['int die(', 'String seed', 'new Random'],
           'app/src/main/java/com/braseiro/dnd/MausritterRules.java':['List<JSONObject> itemsIn','int usedIn(', 'syncHeavy(', 'JSONObject move','int load(', 'boolean save('],
           'app/src/main/java/com/braseiro/dnd/AppDb.java':['nextTurn(', 'getCombatant(', 'getCombatState(', 'active_turn', 'resources_json'],
           'app/src/main/java/com/braseiro/dnd/MainActivity.java':['livingMausritterCombatants(','advanceMausritterTurn(', 'mausritterCombatResources(', 'scheduleMausritterEnemyTurn('],
           'app/src/main/assets/mausritter_atlas/runtime/atlas_vivo.js':['localTurns','advanceWatches','campCurrent','activeLight','consumeLight'],
          }
          for name,terms in specs.items():
              p=root/name
              a=p.read_text(encoding='utf-8',errors='replace').splitlines()
              print('\n#### CANONICAL',name, 'lines', len(a))
              included=set()
              for term in terms:
                  matches=[i for i,x in enumerate(a) if term in x]
                  print('SEARCH',repr(term),'MATCHES',matches[:12])
                  for mid in matches[:3]:
                      for i in range(max(0,mid-7),min(len(a),mid+17)):
                          if i not in included: print(f'{i+1:05d}: {a[i]}'); included.add(i)
          PY

      - name: Apply exact-source R27 patches with drift guards
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/bra83/braseirobuild/$GITHUB_SHA/mausritter-r27/patch_r26.py"
          curl --fail --location --retry 3 --silent --show-error -o /tmp/patch_r26.py "$url"
          root="$(find /tmp/r26 -name version.properties -type f | head -1 | xargs dirname)"
          echo "R27_ROOT=$root" >> "$GITHUB_ENV"
          python3 /tmp/patch_r26.py "$root"
          node --check "$root/android/app/src/main/assets/mausritter_atlas/runtime/atlas_vivo.js"
          grep -F 'VERSION_CODE=610027' "$root/version.properties"

      - name: Apply locally-authoritative Mausritter rest procedures
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/patch_r27_rest.py "https://raw.githubusercontent.com/bra83/braseirobuild/$GITHUB_SHA/mausritter-r27/patch_r27_rest.py"
          python3 /tmp/patch_r27_rest.py "$R27_ROOT"
          node --check "$R27_ROOT/android/app/src/main/assets/mausritter_atlas/runtime/atlas_vivo.js"
      - name: Install Mausritter-only suggested action dropdown with commit firewall
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/patch_r27_suggestions.py "https://raw.githubusercontent.com/bra83/braseirobuild/$GITHUB_SHA/mausritter-r27/patch_r27_suggestions.py"
          python3 /tmp/patch_r27_suggestions.py "$R27_ROOT"
      - name: Execute R27 JVM and Atlas behavioral probes
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/bra83/braseirobuild/$GITHUB_SHA/mausritter-r27/verify_r27.py"
          curl --fail --location --retry 3 --silent --show-error -o /tmp/verify_r27.py "$url"
          python3 /tmp/verify_r27.py "$R27_ROOT"
      - name: Use supported Java 21 for Gradle 8.11.1 Kotlin DSL
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prove short, long and full rests with real Java procedures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$R27_ROOT/mausritter-r27"
          curl -fL --retry 3 -o "$R27_ROOT/mausritter-r27/test_rest_r27.sh" "https://raw.githubusercontent.com/bra83/braseirobuild/$GITHUB_SHA/mausritter-r27/test_rest_r27.sh"
          chmod +x "$R27_ROOT/mausritter-r27/test_rest_r27.sh"
          "$R27_ROOT/mausritter-r27/test_rest_r27.sh"
      - name: Compile patched Android project
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd "$R27_ROOT/android"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "R27_APK=$(pwd)/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
      - name: Validate technical candidate APK identity
        shell: bash
        run: |
          set -euo pipefail
          echo "SHA256 $(sha256sum "$R27_APK")"
          APK_DIR="$ANDROID_HOME/build-tools"
          AAPT="$(find "$APK_DIR" -name aapt | sort -V | tail -1)"
          SIGN="$(find "$APK_DIR" -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$R27_APK" | grep '^package:'
          "$AAPT" dump badging "$R27_APK" | grep -q "versionCode='610027'"
          "$AAPT" dump badging "$R27_APK" | grep -q "name='com.braseiro.mausritter.mestrevivo'"
          "$SIGN" verify --verbose --print-certs "$R27_APK"
          mkdir -p /tmp/r27_candidate
          cp "$R27_APK" /tmp/r27_candidate/Mausritter_R27_technical_candidate_debug.apk
          sha256sum /tmp/r27_candidate/*.apk > /tmp/r27_candidate/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mausritter-r27-technical-candidate-NOT-HOMOLOGATED
          path: /tmp/r27_candidate/*
          if-no-files-found: error

  upgrade_signed_candidate:
    name: Build upgrade-compatible APK on BRELGA
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 70
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recover exact source and apply patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Unexpected signing runner $env:RUNNER_NAME"}
          $url='https://github.com/bra83/braseirobuild/releases/download/mausritter-6.1.0-r26/Mausritter_Mestre_Vivo_6.1.0-r26_SCREEN_SESSION_ANDROID_STUDIO.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'mausritter-r27-rebuild'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip=Join-Path $dir 'source_r26.zip'
          & curl.exe -L --fail --retry 4 --retry-delay 3 -o $zip $url
          if($LASTEXITCODE -ne 0){throw 'R26 ZIP download failed'}
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '972e10a3d98f8ef07b7cdfe762866ab4ea02aa9bfcf9bc032fc8dd3173ebaa9c'){throw 'R26 SHA mismatch'}
          & tar.exe -xf $zip -C $dir
          if($LASTEXITCODE -ne 0){throw 'R26 extraction failed'}
          $root=Get-ChildItem $dir -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'version.properties')} | Select-Object -First 1
          if(-not $root){throw 'Canonical project root not found'}
          $patch=Join-Path $dir 'patch_r26.py'
          & curl.exe -L --fail --retry 3 -o $patch "https://raw.githubusercontent.com/bra83/braseirobuild/$env:GITHUB_SHA/mausritter-r27/patch_r26.py"
          if($LASTEXITCODE -ne 0){throw 'Patch download failed'}
          & python $patch $root.FullName
          if($LASTEXITCODE -ne 0){throw 'Guarded patch failed'}
          "R27_ROOT=$($root.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build with historical Windows signing identity
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sdk='C:\actions-runner\android-sdk'
          if(-not(Test-Path $sdk)){if($env:ANDROID_SDK_ROOT){$sdk=$env:ANDROID_SDK_ROOT}else{throw 'BRELGA Android SDK not found'}}
          $env:ANDROID_HOME=$sdk
          $env:ANDROID_SDK_ROOT=$sdk
          $root=Join-Path $env:R27_ROOT 'android'
          Push-Location $root
          try{
            & .\gradlew.bat :app:assembleDebug --no-daemon --stacktrace --console=plain
            if($LASTEXITCODE -ne 0){throw 'R27 Android build failed'}
          }finally{Pop-Location}
          $apk=Join-Path $root 'app\build\outputs\apk\debug\app-debug.apk'
          if(-not(Test-Path $apk)){throw 'R27 APK missing'}
          $r26=Join-Path $env:RUNNER_TEMP 'mausritter-r26-original.apk'
          & curl.exe -L --fail --retry 4 -o $r26 'https://github.com/bra83/braseirobuild/releases/download/mausritter-6.1.0-r26/Mausritter_Mestre_Vivo_6.1.0-r26_SCREEN_SESSION_DEBUG.apk'
          if($LASTEXITCODE -ne 0){throw 'R26 APK download failed'}
          $tool=Get-ChildItem (Join-Path $sdk 'build-tools') -Recurse -Filter apksigner.bat -File | Sort-Object FullName -Descending | Select-Object -First 1
          $aapt=Get-ChildItem (Join-Path $sdk 'build-tools') -Recurse -Filter aapt.exe -File | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $tool -or -not $aapt){throw 'Android signing/aapt tools missing'}
          $old=& $tool.FullName verify --verbose --print-certs $r26
          if($LASTEXITCODE -ne 0){throw 'R26 signature verification failed'}
          $new=& $tool.FullName verify --verbose --print-certs $apk
          if($LASTEXITCODE -ne 0){throw 'R27 signature verification failed'}
          $before=($old|Where-Object {$_ -match 'Signer #1 certificate SHA-256 digest:'}|Select-Object -First 1)
          $after=($new|Where-Object {$_ -match 'Signer #1 certificate SHA-256 digest:'}|Select-Object -First 1)
          if(-not $before -or -not $after -or $before.Split(':')[-1].Trim() -ne $after.Split(':')[-1].Trim()){throw "Upgrade cert mismatch: original=$before; candidate=$after"}
          $badge=(& $aapt.FullName dump badging $apk) -join "`n"
          if($badge -notmatch "package: name='com\.braseiro\.mausritter\.mestrevivo'" -or $badge -notmatch "versionCode='610027'"){throw 'Unexpected candidate identity'}
          $output=Join-Path $env:RUNNER_TEMP 'mausritter-r27-signed'
          New-Item -ItemType Directory -Force -Path $output|Out-Null
          $dest=Join-Path $output 'Mausritter_R27_upgrade_candidate.apk'
          Copy-Item $apk $dest
          (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content (Join-Path $output 'apk_sha256.txt')
          @("SIGNATURE_SAME_AS_R26=PASS","PACKAGE=com.braseiro.mausritter.mestrevivo","VERSION_CODE=610027","A57_PHYSICAL=NOT_TESTED")|Set-Content (Join-Path $output 'candidate_status.txt')
          Write-Host "R27_UPGRADE_CANDIDATE_PASS original cert=$before"
      - uses: actions/upload-artifact@v4
        with:
          name: mausritter-r27-BRELGA-upgrade-candidate-NOT-HOMOLOGATED
          path: ${{ runner.temp }}/mausritter-r27-signed/*
          if-no-files-found: error
