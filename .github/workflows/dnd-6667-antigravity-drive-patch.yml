name: DnD 6.6.67 Antigravity Drive Overlay QA
on:
  push:
    branches:
      - fix/dnd-6667-antigravity-drive-patch-20261117
    paths:
      - dnd-normal/run247-mod005/version.properties
      - dnd-normal/run247-mod005/ci/antigravity-drive-6666-source.zip
      - .github/workflows/dnd-6667-antigravity-drive-patch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integrated 6.6.62 candidate only
        uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - name: Verify and apply the exact Antigravity ZIP revision
        working-directory: dnd-normal/run247-mod005
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,zipfile,pathlib
          archive=pathlib.Path('ci/antigravity-drive-6666-source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='1cbbc495b4be394f5c710545abecb5c9f9a25ac87214bfac6005e64351085b55'
          prefix='dnd-normal/run247-mod005/'
          with zipfile.ZipFile(archive) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              assert len(names)==12, names
              for name in names:
                  assert name.startswith(prefix+'app/src/') and name.endswith('.java')
                  rel=pathlib.Path(name[len(prefix):])
                  assert '..' not in rel.parts and rel.parts[0]=='app'
                  data=z.read(name)
                  assert len(data)<2500000
                  out=pathlib.Path(rel)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(data)
          print('ANTIGRAVITY_ZIP_EXACT_SHA256_12_FILES=PASS')
          PY
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK for build and signer check
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build 6.6.67 from exact Antigravity Drive files and full Faerun assets
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          ./gradlew :app:testDebugUnitTest --tests com.braseiro.dnd5e.IndependentOfflineRecoveryRobolectricTest --tests com.braseiro.dnd5e.GeminiVoiceAndNarrativeQualityTest --tests com.braseiro.dnd5e.BraseiroSideQuestStoreRobolectricTest --tests com.braseiro.dnd5e.AdventureContinuityPersistenceTest --tests com.braseiro.dnd5e.CampaignSafetyStartupNoSilentRestoreRobolectricTest --tests com.braseiro.dnd5e.AtlasLegacySceneLocationPersistenceRobolectricTest --tests com.braseiro.dnd5e.MasterPreparationExecutorRecoveryRobolectricTest --tests com.braseiro.dnd5e.MasterPreparationCoordinatorRobolectricTest --tests com.braseiro.dnd5e.MasterPreparationFailureUiRobolectricTest --tests com.braseiro.dnd5e.SceneChoiceCommitGateTest --tests com.braseiro.dnd5e.SceneThreeChoiceScreenshotRegression20261117Test --tests com.braseiro.dnd5e.GroundedSceneActionSlots6654Test --tests com.braseiro.dnd5e.SceneOptionQualityRegressionTest --tests com.braseiro.dnd5e.StoryMomentumActionRegressionTest --no-daemon --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -q '^VERSION_CODE=203900630$' version.properties
          grep -q '^DB_SCHEMA=61$' version.properties
          grep -q '^BACKUP_FORMAT=21$' version.properties
      - name: Download verified 6.6.66 APK for no-data-loss upgrade
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14312898974
          run-id: 44049152920
          repository: bra83/braseirobuild
          github-token: ${{ github.token }}
          path: qa-old-6666
      - name: Verify Android in-place compatibility, signer and incremental version
        shell: bash
        run: |
          set -euo pipefail
          old='qa-old-6666/BRASEIRO_DND_6.6.66_INDEPENDENT_OFFLINE_RECOVERY_3OF3/app-debug.apk'
          new='dnd-normal/run247-mod005/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$old"
          test -s "$new"
          for prefix in old new; do
            apk="$old"
            if [ "$prefix" = new ]; then apk="$new"; fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep 'Signer #1 certificate SHA-256 digest:' > "qa-$prefix-cert.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep '^package:' > "qa-$prefix-package.txt"
          done
          diff -u qa-old-cert.txt qa-new-cert.txt
          python3 - <<'PY'
          import re
          def extract(path):
              line=open(path,encoding='utf8').read()
              return (re.search("name='([^']+)'",line).group(1),
                      int(re.search("versionCode='([^']+)'",line).group(1)))
          old,new=extract('qa-old-package.txt'),extract('qa-new-package.txt')
          assert old==('com.braseiro.dnd5e',203900629),old
          assert new==('com.braseiro.dnd5e',203900630),new
          print('REAL_6666_TO_6667_PACKAGE_SIGNER_VERSION_GATE=PASS')
          print('PHYSICAL_GALAXY_A57_NOT_TESTED=TRUE')
          PY
          sha256sum "$old" "$new" > qa-apk-sha256.txt
      - name: Enable hardware acceleration where supported
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo 'KVM_NOT_FOUND'; fi
      - name: Three isolated Android 35 in-place upgrades -- DB, character, inventory, diary canaries
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: python3 dnd-normal/run247-mod005/tools/qa_android_upgrade_emulator.py --previous qa-old-6666/BRASEIRO_DND_6.6.66_INDEPENDENT_OFFLINE_RECOVERY_3OF3/app-debug.apk --current dnd-normal/run247-mod005/app/build/outputs/apk/debug/app-debug.apk --evidence qa-6666-to-6667 --cycles 3
      - name: Publish verified in-place upgrade APK candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_DND_6.6.67_ANTIGRAVITY_DRIVE_PATCH_3OF3
          path: dnd-normal/run247-mod005/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish Android emulator upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-6666-to-6667-antigravity-drive-evidence
          path: |
            qa-6666-to-6667/**/result.json
            qa-6666-to-6667/summary.json
            qa-6666-to-6667/**/startup-sqlite-log.txt
            qa-old-cert.txt
            qa-new-cert.txt
            qa-old-package.txt
            qa-new-package.txt
            qa-apk-sha256.txt
          retention-days: 14
          if-no-files-found: warn
