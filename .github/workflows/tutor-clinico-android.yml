name: Tutor Clinico Android - APK Debug

on:
  push:
    branches:
      - codex/eco-023-takeover-20261125
      - feature/tutor-clinico-android-20261122
      - antigravity/eco-integral-20261124
      - antigravity/eco-corretivo-20261124
    paths:
      - 'tutor-clinico/android/**'
      - '.github/workflows/tutor-clinico-android.yml'
  workflow_dispatch:

concurrency:
  group: eco-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Testar e gerar APK
    runs-on: ubuntu-24.04 # Playwright 1.51.1 supports Noble; avoid ubuntu-latest drift
    defaults:
      run:
        working-directory: tutor-clinico/android
    steps:
      - name: Obter fonte (sparse checkout)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tutor-clinico/android
            .github/workflows/tutor-clinico-android.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes de logica
        run: |
          python3 qa/eco_security_policy.py
          mkdir -p /tmp/eco-gguf-import-tests
          javac -d /tmp/eco-gguf-import-tests app/src/main/java/br/com/tutorclinico/EcoGgufImport.java qa/EcoGgufImportTest.java
          java -cp /tmp/eco-gguf-import-tests br.com.tutorclinico.EcoGgufImportTest
          javac -d /tmp/eco-gguf-import-tests app/src/main/java/br/com/tutorclinico/EcoBackupStream.java app/src/main/java/br/com/tutorclinico/EcoBackupImportFormat.java qa/EcoBackupImportFormatTest.java
          java -cp /tmp/eco-gguf-import-tests br.com.tutorclinico.EcoBackupImportFormatTest
          mkdir -p /tmp/eco-backup-stream-tests
          javac -d /tmp/eco-backup-stream-tests app/src/main/java/br/com/tutorclinico/EcoBackupStream.java qa/EcoBackupStreamTest.java
          java -Xmx32m -cp /tmp/eco-backup-stream-tests br.com.tutorclinico.EcoBackupStreamTest
          node qa/test.mjs
          node qa/audit_clinical_generation.mjs --self-test
          mkdir -p /tmp/eco-spool-tests
          javac -d /tmp/eco-spool-tests app/src/main/java/br/com/tutorclinico/LiveSpoolInput.java app/src/main/java/br/com/tutorclinico/AuthenticatedSpoolReader.java qa/AuthenticatedSpoolReaderTest.java
          java -cp /tmp/eco-spool-tests br.com.tutorclinico.AuthenticatedSpoolReaderTest
          node qa/run_audit_probe.js
          mkdir -p /tmp/eco-speaker-tests
          javac -d /tmp/eco-speaker-tests app/src/main/java/br/com/tutorclinico/SpeakerTimeline.java app/src/main/java/br/com/tutorclinico/SpeakerClusters.java qa/SpeakerTimelineTest.java
          java -cp /tmp/eco-speaker-tests br.com.tutorclinico.SpeakerTimelineTest
          javac -d /tmp/eco-speaker-tests app/src/main/java/br/com/tutorclinico/SemanticRanking.java qa/SemanticRankingTest.java
          java -cp /tmp/eco-speaker-tests br.com.tutorclinico.SemanticRankingTest
          javac -d /tmp/eco-speaker-tests app/src/main/java/br/com/tutorclinico/EcoEmbeddingCache.java qa/EcoEmbeddingCacheTest.java
          java -cp /tmp/eco-speaker-tests br.com.tutorclinico.EcoEmbeddingCacheTest
      - name: Validar interface real em Chromium
        run: |
          set -euo pipefail
          export ECO_UI_DEPS="$RUNNER_TEMP/eco-ui-deps"
          mkdir -p "$ECO_UI_DEPS"
          npm install --prefix "$ECO_UI_DEPS" --no-audit --no-fund playwright-core@1.51.1
          "$ECO_UI_DEPS/node_modules/.bin/playwright-core" install chromium
          export ECO_CHROME="$(node -e "console.log(require(process.env.ECO_UI_DEPS+'/node_modules/playwright-core').chromium.executablePath())")"
          test -x "$ECO_CHROME"
          node qa/ui_browser.mjs
      - name: Publicar evidências visuais de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ECO-ui-fixtures
          path: |
            tutor-clinico/android/build/eco-ui/*.png
            tutor-clinico/android/build/eco-ui/*.pdf
          if-no-files-found: ignore
          retention-days: 14
      - name: Validar runtime ARM64 TAGARELA
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 --max-time 600 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-static-link-onnxruntime-1.13.3.aar -o app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar
          echo '9f065fe6f2cab09fd48eaa580097293e077637ad53a5e89c5c58a36509386ac7  app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar' | sha256sum -c -
          python qa/prepare_sherpa_aar.py app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar
      - name: Instalar modelo de voz Vosk PT-BR offline (Apache-2.0)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 240 https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip --output /tmp/model-pt.zip
          mkdir -p app/src/main/assets
          unzip -q /tmp/model-pt.zip -d app/src/main/assets
          mv app/src/main/assets/vosk-model-small-pt-0.3 app/src/main/assets/model-pt
          echo 'vosk-pt-0.3-model-v1' > app/src/main/assets/model-pt/uuid
          find app/src/main/assets/model-pt -maxdepth 3 -type f | head -45
          test -s app/src/main/assets/model-pt/final.mdl
          test -s app/src/main/assets/model-pt/mfcc.conf
          test -s app/src/main/assets/model-pt/uuid
          du -sh app/src/main/assets/model-pt
      - name: Baixar modelo neural de falantes Vosk
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 240 https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip -o /tmp/model-spk.zip
          unzip -q /tmp/model-spk.zip -d app/src/main/assets
          mv app/src/main/assets/vosk-model-spk-0.4 app/src/main/assets/model-spk
          test -s app/src/main/assets/model-spk/final.ext.raw
      - name: Baixar modelo Whisper Base multilíngue (fonte oficial)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/whisper
          curl --fail --location --retry 3 --max-time 900 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin?download=true' \
            -o app/src/main/assets/whisper/ggml-base.bin
          test "$(stat -c%s app/src/main/assets/whisper/ggml-base.bin)" -gt 100000000
          sha256sum app/src/main/assets/whisper/ggml-base.bin
      - name: Baixar Whisper Small q5_1 multilíngue (qualidade superior)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 900 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true' \
            -o app/src/main/assets/whisper/ggml-small-q5_1.bin
          test "$(stat -c%s app/src/main/assets/whisper/ggml-small-q5_1.bin)" -gt 170000000
          sha256sum app/src/main/assets/whisper/ggml-small-q5_1.bin
      - name: Configurar Python 3.11 para inferência ONNX
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar e testar modelo semântico neural
        run: |
          python --version
          python -m pip install --only-binary=:all: --disable-pip-version-check numpy==1.26.4 onnxruntime==1.22.0 onnx==1.17.0 safetensors==0.5.3 tokenizers==0.21.1
          python qa/provision_semantic.py
      - name: Preparar e testar NLI PT-BR experimental
        run: python qa/provision_nli.py
      - name: Preparar e testar reranker mMARCO
        run: python qa/provision_rerank.py
      - name: Validar inferência TAGARELA em português
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          python -m pip install --only-binary=:all: sherpa-onnx==1.13.3
          python qa/provision_tagarela.py
      - name: Validar detector neural de sobreposição de falas
        run: python qa/provision_overlap.py
      - name: Validar separação neural real de duas vozes
        run: |
          python -m pip install vosk==0.3.45
          python qa/provision_separation.py

      - name: Configurar Android SDK existente do runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          ls -l "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools"
      - name: Instalar plataforma Android 35
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Preparar e testar geração local Qwen e compilar ARM64
        run: bash qa/provision_llm.sh
      - name: Publicar avaliação neural dos 21 autores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ECO-neural-author-benchmark
          path: tutor-clinico/android/build/eco-neural-audit/author-benchmark.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publicar pacote offline de IA avançada
        uses: actions/upload-artifact@v4
        with:
          name: ECO-Qwen-1.5B-Q4-offline
          path: tutor-clinico/android/build/eco-advanced-model/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        run: |
          python qa/eco23_migration_regression.py
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar saida
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          python qa/verify_arm64_apk.py app/build/outputs/apk/debug/app-debug.apk
          mkdir -p build/eco-security-evidence
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > build/eco-security-evidence/apk-badging.txt
          python qa/eco_security_policy.py build/eco-security-evidence/apk-badging.txt
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon > build/eco-security-evidence/runtime-dependencies.txt
          test -s build/eco-security-evidence/runtime-dependencies.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar inventário de dependências e permissões do APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ECO-security-evidence
          path: tutor-clinico/android/build/eco-security-evidence/
          if-no-files-found: ignore
      - name: Assinar APK com chave permanente se configurada
        id: signing
        env:
          ECO_KEYSTORE_B64: ${{ secrets.ECO_KEYSTORE_B64 }}
          ECO_KEYSTORE_PASSWORD: ${{ secrets.ECO_KEYSTORE_PASSWORD }}
          ECO_KEY_PASSWORD: ${{ secrets.ECO_KEY_PASSWORD }}
          ECO_CERT_SHA256: ${{ vars.ECO_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$ECO_KEYSTORE_B64" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem chave permanente: APK de teste pode exigir reinstalação."
            exit 0
          fi
          test -n "$ECO_KEYSTORE_PASSWORD" && test -n "$ECO_KEY_PASSWORD"
          test -n "$ECO_CERT_SHA256" || { echo "::error::Defina ECO_CERT_SHA256 com o certificado permanente autorizado."; exit 1; }
          gradle :app:assembleRelease --no-daemon --stacktrace
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          ks=$(mktemp)
          trap 'rm -f "$ks"' EXIT
          chmod 600 "$ks"
          printf '%s' "$ECO_KEYSTORE_B64" | base64 --decode > "$ks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$ks" --ks-key-alias eco --ks-pass env:ECO_KEYSTORE_PASSWORD --key-pass env:ECO_KEY_PASSWORD --out app/build/outputs/apk/release/eco-stable.apk "$unsigned"
          apk=app/build/outputs/apk/release/eco-stable.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > build/eco-security-evidence/release-certificate.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/eco-security-evidence/release-certificate.txt)
          test "${actual,,}" = "${ECO_CERT_SHA256,,}" || { echo "::error::Certificado divergente; não publicar APK."; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > build/eco-security-evidence/release-badging.txt
          if grep -q '^application-debuggable' build/eco-security-evidence/release-badging.txt; then echo "::error::APK depurável."; exit 1; fi
          python qa/eco_security_policy.py build/eco-security-evidence/release-badging.txt
          python qa/verify_arm64_apk.py "$apk"
          echo "stable=true" >> "$GITHUB_OUTPUT"
      - name: Publicar APK atualizável
        if: steps.signing.outputs.stable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ECO-v0.24.0-arm64-stable
          path: tutor-clinico/android/app/build/outputs/apk/release/eco-stable.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK de teste
        if: steps.signing.outputs.stable == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ECO-v0.24.0-arm64-beta-debug
          path: tutor-clinico/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
