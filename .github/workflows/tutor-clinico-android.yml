name: Tutor Clinico Android - APK Debug

on:
  push:
    branches:
      - feature/tutor-clinico-android-20261122
    paths:
      - 'tutor-clinico/android/**'
      - '.github/workflows/tutor-clinico-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Testar e gerar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tutor-clinico/android
    steps:
      - name: Obter fonte (sparse checkout)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tutor-clinico/android
            .github/workflows/tutor-clinico-android.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes de logica
        run: node qa/test.mjs
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar saida
        run: test -s app/build/outputs/apk/debug/app-debug.apk && sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: TutorClinico-v0.1-debug
          path: tutor-clinico/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
