name: DND - Strixhaven scene and NPC presence regression (BRELGA)
on:
  push:
    branches:
      - fix/dnd-strixhaven-scene-npc-boundary-20261017
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-strixhaven-scene-npc-${{ github.sha }}
  cancel-in-progress: false
jobs:
  strixhaven-scene-regression:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Confirm runner and forbid APK generation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'WRONG_RUNNER'}
          Write-Host ('STRIX_SCENE_SHA='+$env:GITHUB_SHA)
          Write-Host 'APK_BUILD=FORBIDDEN'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Setup Java 17, Android SDK, and isolated Gradle cache
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $java='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if(Test-Path $java){
            Add-Content $env:GITHUB_ENV ('JAVA_HOME='+$java)
            Add-Content $env:GITHUB_PATH (Join-Path $java 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if(!$sdk -or !(Test-Path $sdk)){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if(!(Test-Path $sdk)){throw 'ANDROID_SDK_MISSING'}
          Add-Content $env:GITHUB_ENV ('ANDROID_HOME='+$sdk)
          Add-Content $env:GITHUB_ENV ('ANDROID_SDK_ROOT='+$sdk)
          $shared=Join-Path $env:USERPROFILE '.gradle'
          $isolated=Join-Path $env:RUNNER_TEMP ('dnd-strix-scene-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          foreach($item in @('wrapper','caches')){
            $from=Join-Path $shared $item
            $to=Join-Path $isolated $item
            if((Test-Path $from)-and !(Test-Path $to)){
              New-Item -ItemType Junction -Path $to -Target $from | Out-Null
            }
          }
          Add-Content $env:GITHUB_ENV ('GRADLE_USER_HOME='+$isolated)
      - name: Scene scope and 3x SQLite reopening (targeted)
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --tests com.braseiro.dnd5e.StrixhavenSceneBoundaryRobolectricTest --no-daemon --console=plain
          $result=$LASTEXITCODE
          $xml=Join-Path $dir 'TEST-com.braseiro.dnd5e.StrixhavenSceneBoundaryRobolectricTest.xml'
          if(!(Test-Path $xml)){throw 'STRIX_SCENE_MISSING_TEST_XML'}
          [xml]$d=Get-Content -LiteralPath $xml -Raw
          $tests=[int]$d.testsuite.tests;$fails=[int]$d.testsuite.failures
          $errs=[int]$d.testsuite.errors;$skips=[int]$d.testsuite.skipped
          foreach($node in @($d.SelectNodes('//testcase/failure | //testcase/error'))){
            Write-Host ('STRIX_FAIL_CASE='+$node.ParentNode.GetAttribute('name'))
            Write-Host ('STRIX_FAIL_REASON='+$node.GetAttribute('message'))
          }
          Write-Host ('STRIX_SCENE_TARGET_TESTS='+$tests+' FAIL='+$fails+' ERR='+$errs+' SKIP='+$skips)
          if($result -ne 0 -or $tests -lt 6 -or $fails -ne 0 -or $errs -ne 0 -or $skips -ne 0){throw 'STRIX_SCENE_TARGETED_FAILED'}
      - name: Full Android JVM/Robolectric regression same SHA
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain
          $code=$LASTEXITCODE
          $docs=@()
          if(Test-Path $dir){$docs=@(Get-ChildItem -LiteralPath $dir -Filter 'TEST-*.xml' -File)}
          $tests=0;$fails=0;$errs=0;$skips=0
          foreach($file in $docs){
            [xml]$d=Get-Content -LiteralPath $file.FullName -Raw
            $tests += [int]$d.testsuite.tests
            $fails += [int]$d.testsuite.failures
            $errs += [int]$d.testsuite.errors
            $skips += [int]$d.testsuite.skipped
            foreach($node in @($d.SelectNodes('//testcase/failure | //testcase/error'))){
              Write-Host ('STRIX_FULL_FAIL_CASE='+$node.ParentNode.GetAttribute('classname')+'::'+$node.ParentNode.GetAttribute('name'))
              Write-Host ('STRIX_FULL_FAIL_MSG='+$node.GetAttribute('message'))
            }
          }
          Write-Host ('STRIX_SCENE_FULL_TESTS='+$tests+' FAIL='+$fails+' ERR='+$errs+' SKIP='+$skips)
          if($code -ne 0 -or $tests -lt 2741 -or $fails -ne 0 -or $errs -ne 0 -or $skips -ne 0){throw 'STRIX_SCENE_FULL_FAILED'}
          Write-Host 'STRIX_SCENE_FULL_REGRESSION=PASS'
          Write-Host 'PHB_DMG_XMM_FULL_PARITY=NOT_CERTIFIED'
          Write-Host 'GALAXY_A57_PHYSICAL=NOT_TESTED'
