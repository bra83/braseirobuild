name: Diagnostic Forbidden Lands Suggested Route

on:
  push:
    paths:
      - '.github/workflows/diag-fl-route.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact source and inspect routing
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file/shares/9U2Qwn54TgjB'
          NAME='BRASEIRO_FORBIDDEN_LANDS_3.3.5_BUGREPORT_FREEZE_FIX_R6_1_SOURCE.zip'
          FILE_ID=$(curl -fsSL "$API/files?maxResults=100" | jq -r --arg n "$NAME" '.files[] | select(.fileName==$n) | .fileId' | head -n 1)
          test -n "$FILE_ID"
          URL=$(curl -fsSL -X POST "$API/files/$FILE_ID/download" | jq -r '.downloadUrl')
          test -n "$URL"
          curl -fL "$URL" -o source.zip
          mkdir src && unzip -q source.zip -d src

          echo '===== ROUTING MATCHES ====='
          grep -RInE --include='*.ts' --include='*.tsx' --include='*.mjs'             'IN_FICTION_ACTION|OUT_OF_FICTION_GM_HELP|suggestedAction|suggestedActions|handleSuggested|kind.*scene|route.*scene' src | head -n 400 || true

          echo '===== NARRATIVE INTENT SERVICE ====='
          nl -ba src/src/services/NarrativeIntentService.ts | sed -n '1,280p'

          echo '===== PRESENTATION FIELD USAGE ====='
          grep -RInE --include='*.ts' --include='*.tsx' --include='*.mjs' 'presentationKind|\.presentation\b|presentation:' src/src src/scripts | head -n 300 || true

          echo '===== ADVENTURE SEND ROUTE ====='
          nl -ba src/src/screens/AdventureScreenV3.tsx | sed -n '560,790p'
          echo '===== ADVENTURE SUGGESTED BUTTON ====='
          nl -ba src/src/screens/AdventureScreenV3.tsx | sed -n '1200,1275p'

          echo '===== ADVENTURE SEND FUNCTION ====='
          grep -n "const send" src/src/screens/AdventureScreenV3.tsx || true
          nl -ba src/src/screens/AdventureScreenV3.tsx | sed -n '790,1120p'

          echo '===== BUGREPORT TEST ====='
          TEST=$(grep -RIl --include='*.mjs' 'botão sugerido precisa produzir cena' src | head -n 1 || true)
          if [ -n "$TEST" ]; then
            echo "TEST=$TEST"
            nl -ba "$TEST" | sed -n '1,220p'
          fi
