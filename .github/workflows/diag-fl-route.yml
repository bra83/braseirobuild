name: Export Forbidden Lands R9 Patched Source

on:
  push:
    paths:
      - '.github/workflows/diag-fl-route.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file/shares/9U2Qwn54TgjB'
          NAME='BRASEIRO_FORBIDDEN_LANDS_3.3.5_BUGREPORT_FREEZE_FIX_R6_1_SOURCE.zip'
          FILE_ID=$(curl -fsSL "$API/files?maxResults=100" | jq -r --arg n "$NAME" '.files[] | select(.fileName==$n) | .fileId' | head -n1)
          URL=$(curl -fsSL -X POST "$API/files/$FILE_ID/download" | jq -r '.downloadUrl')
          curl -fL "$URL" -o source.zip
          mkdir src
          unzip -q source.zip -d src

      - name: Apply current R9 patches
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const intent='src/src/services/NarrativeIntentService.ts';
          let s=fs.readFileSync(intent,'utf8');
          s=s.replace('  presentation: ScenePresentationKind;\n  preservesCheckpoint:','  presentation: ScenePresentationKind;\n  presentationKind?: ScenePresentationKind;\n  preservesCheckpoint:');
          s=s.replace('      presentation,\n      preservesCheckpoint,','      presentation,\n      presentationKind: presentation,\n      preservesCheckpoint,');
          fs.writeFileSync(intent,s,'utf8');

          const api='src/src/services/api.ts';
          let a=fs.readFileSync(api,'utf8');
          a=a.replace("  const maxOutputTokens = profile === 'Casual' ? 1100 : profile === 'Expert' ? (initial ? 2600 : 1800) : (initial ? 2200 : 1500);\n  const cinematic = Boolean(modelPolicy?.cinematic);\n  const initial = Boolean(modelPolicy?.initial);","  const cinematic = Boolean(modelPolicy?.cinematic);\n  const initial = Boolean(modelPolicy?.initial);\n  const maxOutputTokens = profile === 'Casual' ? 1100 : profile === 'Expert' ? (initial ? 2600 : 1800) : (initial ? 2200 : 1500);");
          fs.writeFileSync(api,a,'utf8');

          const adventure='src/src/screens/AdventureScreenV3.tsx';
          let v=fs.readFileSync(adventure,'utf8');
          v=v.replace('onClick={() => void send(action)}',"onClick={() => void send(action, undefined, false, undefined, 'suggested')");
          v=v.replace('className="fixed inset-x-0 top-0 z-[240] bg-black/80 backdrop-blur-sm flex items-end sm:items-center sm:justify-center"','className="fixed inset-0 z-[240] bg-black/80 backdrop-blur-sm flex items-end sm:items-center sm:justify-center"');
          v=v.replace('className="bg-bg-surface border border-accent rounded-xl p-5 max-w-md w-full"','className="bg-bg-surface border border-accent rounded-xl p-5 max-w-md w-full max-h-[calc(100dvh-2rem)] overflow-y-auto"');
          fs.writeFileSync(adventure,v,'utf8');

          const layout='src/src/components/Layout.tsx';
          let l=fs.readFileSync(layout,'utf8');
          l=l.replace('className="bg-bg-surface border-t border-border p-4 rounded-t-2xl mb-16 animate-in slide-in-from-bottom-4"','className="more-menu-sheet bg-bg-surface border-t border-border p-4 rounded-t-2xl animate-in slide-in-from-bottom-4"');
          fs.writeFileSync(layout,l,'utf8');
          NODE

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: FL_R9_PATCHED_SOURCE
          path: src
          retention-days: 3
