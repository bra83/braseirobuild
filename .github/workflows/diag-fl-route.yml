name: Fast Forbidden Lands R7 Gates

on:
  push:
    paths:
      - '.github/workflows/diag-fl-route.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact source
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.firestorage.ai/dev/file/shares/9U2Qwn54TgjB'
          NAME='BRASEIRO_FORBIDDEN_LANDS_3.3.5_BUGREPORT_FREEZE_FIX_R6_1_SOURCE.zip'
          FILE_ID=$(curl -fsSL "$API/files?maxResults=100" | jq -r --arg n "$NAME" '.files[] | select(.fileName==$n) | .fileId' | head -n 1)
          URL=$(curl -fsSL -X POST "$API/files/$FILE_ID/download" | jq -r '.downloadUrl')
          curl -fL "$URL" -o source.zip
          mkdir src && unzip -q source.zip -d src

      - name: Apply R7 compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');

          const gate='src/scripts/verify-human-master-runtime.mjs';
          let g=fs.readFileSync(gate,'utf8');
          const old="assert.match(narrative, /5\\.000 a 6\\.500 caracteres/);";
          const next="assert.match(narrative, /CanonicalNarratorProfileService/);";
          if(!g.includes(old)) throw new Error('obsolete opening-depth assertion not found');
          g=g.replace(old,next);
          fs.writeFileSync(gate,g,'utf8');

          const intent='src/src/services/NarrativeIntentService.ts';
          let s=fs.readFileSync(intent,'utf8');
          const typeOld='  presentation: ScenePresentationKind;\n  preservesCheckpoint:';
          const typeNew='  presentation: ScenePresentationKind;\n  presentationKind?: ScenePresentationKind;\n  preservesCheckpoint:';
          if(!s.includes(typeOld)) throw new Error('intent type marker missing');
          s=s.replace(typeOld,typeNew);
          const retOld='      presentation,\n      preservesCheckpoint,';
          const retNew='      presentation,\n      presentationKind: presentation,\n      preservesCheckpoint,';
          if(!s.includes(retOld)) throw new Error('intent return marker missing');
          s=s.replace(retOld,retNew);
          fs.writeFileSync(intent,s,'utf8');

          const bugGate='src/scripts/verify-bugreport-freeze-2026-10-05.mjs';
          let b=fs.readFileSync(bugGate,'utf8');
          const traceOld='assert.match(adventure, /\\[MASTER_FLOW\\] scene-commit:start/);';
          const traceNew="assert.match(adventure, /masterTrace\\('scene-commit:start'/);";
          if(!b.includes(traceOld)) throw new Error('stale scene-commit trace assertion not found');
          b=b.replace(traceOld,traceNew);
          fs.writeFileSync(bugGate,b,'utf8');
          NODE

      - name: Inspect scene commit trace location
        shell: bash
        run: |
          echo '===== PERSIST SCENE ====='
          grep -n "persistScene\|scene-commit" src/src/screens/AdventureScreenV3.tsx || true
          nl -ba src/src/screens/AdventureScreenV3.tsx | sed -n '400,560p'

      - name: Inspect api initial ordering
        shell: bash
        run: |
          echo '===== API SERVICE ====='
          nl -ba src/src/services/api.ts | sed -n '1,140p'

      - name: Install and run critical gates
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/verify-pf2-r34-parity.mjs
          npm run verify:human-master-runtime
          npm run verify:master-no-freeze-r5
          npm run verify:bugreport-freeze-2026-10-05
          npm run lint
