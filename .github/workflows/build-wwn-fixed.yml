name: BRASEIRO WWN Corrected Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-wwn-fixed.yml"

permissions:
  contents: read

env:
  WWN_SOURCE_SHARE_URL: "https://firestorage.ai/ja/f/zMStC53yvoQ4"
  WWN_SOURCE_SHA256: "656fa6ad39d8df697a47974c46163bf9a41c623de328be76f34bd8fd1a340921"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download exact WWN source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming /tmp/wwn-download
          cd /tmp/wwn-download
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
          const page=await ctx.newPage();
          await page.goto(process.env.WWN_SOURCE_SHARE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3000);
          const out=process.env.GITHUB_WORKSPACE+'/incoming/wwn.zip';
          for(const sel of ['text=/一括ダウンロード/i','text=/ダウンロード/i','text=/Download/i','button','a']){
            const loc=page.locator(sel), n=Math.min(await loc.count(),50);
            for(let i=0;i<n;i++){
              const el=loc.nth(i); let text=''; try{text=(await el.innerText({timeout:1000})).trim()}catch{}
              if((sel==='button'||sel==='a')&&!/download|ダウンロード|一括|保存|ZIP|ファイル/i.test(text)) continue;
              try{const p=page.waitForEvent('download',{timeout:10000}); await el.click({timeout:5000}); const d=await p; await d.saveAs(out); await browser.close(); process.exit(0)}catch{}
            }
          }
          await browser.close(); process.exit(2);
          NODE
          node download.mjs
          cd "$GITHUB_WORKSPACE"
          unzip -t incoming/wwn.zip >/dev/null
          echo "$WWN_SOURCE_SHA256  incoming/wwn.zip" | sha256sum -c -

      - name: Extract and apply proven Android build fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q incoming/wwn.zip -d work
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('work')
          main=root/'app/src/main/java/com/braseiro/wwn/MainActivity.kt'
          s=main.read_text(encoding='utf-8')
          old='if (::webView.isInitialized) webView.post { if (!webView.isDestroyed) webView.evaluateJavascript(js, null) }'
          new='if (::webView.isInitialized) webView.post { if (!isDestroyed && !isFinishing) webView.evaluateJavascript(js, null) }'
          if s.count(old) != 2:
              raise SystemExit(f'Unexpected isDestroyed occurrence count: {s.count(old)}')
          main.write_text(s.replace(old,new),encoding='utf-8')
          gradle=root/'app/build.gradle.kts'
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'compileSdk\s*=\s*37','compileSdk = 36',g,count=1)
          g=re.sub(r'targetSdk\s*=\s*37','targetSdk = 36',g,count=1)
          gradle.write_text(g,encoding='utf-8')
          props=root/'gradle/wrapper/gradle-wrapper.properties'
          p=props.read_text(encoding='utf-8')
          p=re.sub(r'^distributionSha256Sum=.*$','distributionSha256Sum=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01',p,count=1,flags=re.M)
          props.write_text(p,encoding='utf-8')
          PY
          chmod +x work/gradlew
          grep -n 'evaluateJavascript(js' work/app/src/main/java/com/braseiro/wwn/MainActivity.kt
          grep -E 'compileSdk|targetSdk' work/app/build.gradle.kts
          grep distributionSha256Sum work/gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew clean test assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find work -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -n1)"
          test -f "$APK"
          cp "$APK" out/BRASEIRO-WWN-POST071-DEBUG.apk
          unzip -t out/BRASEIRO-WWN-POST071-DEBUG.apk >/dev/null
          sha256sum out/BRASEIRO-WWN-POST071-DEBUG.apk | tee out/BRASEIRO-WWN-POST071-DEBUG.apk.sha256
          stat -c 'APK_SIZE_BYTES=%s' out/BRASEIRO-WWN-POST071-DEBUG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-WWN-POST071-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
