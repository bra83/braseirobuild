name: Publish existing Star Wars P77 APK from BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-existing-star-wars-p77.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Locate and revalidate P77 APK
        id: apk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA" }
          $dir = Join-Path $env:RUNNER_TEMP 'sw-p77-apk-out'
          $apk = Join-Path $dir 'BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk'
          if (-not (Test-Path $apk)) { throw "Previously validated P77 APK not found at $apk" }
          $sdkCandidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'),'C:\Android\Sdk') | Where-Object { $_ -and (Test-Path $_) }
          $sdk=$sdkCandidates | Where-Object { Test-Path (Join-Path $_ 'build-tools') } | Select-Object -First 1
          if (-not $sdk) { throw 'Android SDK not found' }
          $bt=Get-ChildItem (Join-Path $sdk 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $aapt=Join-Path $bt.FullName 'aapt.exe'
          $signer=Join-Path $bt.FullName 'apksigner.bat'
          $badging=& $aapt dump badging $apk 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'aapt failed' }
          if (($badging -join "`n") -notmatch "package: name='com[.]braseiro[.]starwarsedge'.*versionCode='10077'.*versionName='1[.]0[.]77'") { throw 'P77 package/version mismatch' }
          & $signer verify --verbose --print-certs $apk | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'signature verify failed' }
          $hash=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "APK_SHA256=$hash"
          "dir=$dir" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish release assets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='bra83/braseirobuild'; $tag='star-wars-r54-p77-apk'
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='BRELGA-P77'}
          $release=$null
          try {$release=Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"} catch {if ($_.Exception.Response.StatusCode.value__ -ne 404){throw}}
          if(-not $release){
            $body=@{tag_name=$tag;target_commitish='main';name='Braseiro Star Wars R54 P77 APK';body='APK compilado e validado no BRELGA a partir do checkpoint P77 do Google Drive.';draft=$false;prerelease=$false}|ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $h -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$repo/releases"
          }
          $base=($release.upload_url -replace '\{.*
          $assets=Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach($name in @('BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk','BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk.sha256','APK_BADGING.txt','APK_SIGNATURE.txt','P77_BUILD_PROOF.txt')){
            $p=Join-Path $env:APK_DIR $name
            if(-not (Test-Path $p)){continue}
            $old=$assets|Where-Object {$_.name -eq $name}|Select-Object -First 1
            if($old){Invoke-RestMethod -Method Delete -Headers $h -Uri "https://api.github.com/repos/$repo/releases/assets/$($old.id)"|Out-Null}
            $ct=if($name -like '*.apk'){'application/vnd.android.package-archive'}else{'text/plain'}
            Invoke-RestMethod -Method Post -Headers $h -ContentType $ct -InFile $p -Uri ($base+'?name='+[uri]::EscapeDataString($name))|Out-Null
          }
          Write-Host $release.html_url
,'')
          $assets=Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach($name in @('BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk','BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk.sha256','APK_BADGING.txt','APK_SIGNATURE.txt','P77_BUILD_PROOF.txt')){
            $p=Join-Path $env:APK_DIR $name
            if(-not (Test-Path $p)){continue}
            $old=$assets|Where-Object {$_.name -eq $name}|Select-Object -First 1
            if($old){Invoke-RestMethod -Method Delete -Headers $h -Uri "https://api.github.com/repos/$repo/releases/assets/$($old.id)"|Out-Null}
            $ct=if($name -like '*.apk'){'application/vnd.android.package-archive'}else{'text/plain'}
            Invoke-RestMethod -Method Post -Headers $h -ContentType $ct -InFile $p -Uri ($base+'?name='+[uri]::EscapeDataString($name))|Out-Null
          }
          Write-Host $release.html_url
