name: PF2 R31 Integrated Persona Control Guide Fixes
# rerun after regex assertion correction

on:
  push:
    branches: [audit-pf2-kingmaker-r30-20260928]
    paths:
      - '.github/workflows/pf2-r31-integrated-persona-control-guide.yml'

permissions:
  contents: write

concurrency:
  group: pf2-r31-integrated
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-pf2-kingmaker-r30-20260928

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact post-Antigravity R30
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Expected BRELGA, got $env:RUNNER_NAME"}
          $root=Join-Path $env:RUNNER_TEMP 'pf2-r31-integrated'
          $work=Join-Path $root 'work'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $rar=Join-Path $root 'pf2e_r30_work.rar'
          & curl.exe -L --fail --retry 5 --retry-delay 3 "https://drive.usercontent.google.com/download?id=1UbJq8m518f1jIQkkXASvEp0j0Uf6qNkR&export=download&confirm=t" -o $rar
          if($LASTEXITCODE -ne 0){throw 'R30 archive download failed'}
          $bytes=(Get-Item $rar).Length
          if($bytes -ne 553809972){throw "Unexpected R30 archive size: $bytes"}
          $unrar='C:\Program Files\WinRAR\UnRAR.exe'
          if(-not (Test-Path $unrar)){throw 'UnRAR missing on BRELGA'}
          & $unrar x -y $rar "$root\extracted\"
          if($LASTEXITCODE -ne 0){throw 'R30 archive extraction failed'}
          $src=Join-Path $root 'extracted\pf2e_r30_work'
          if(-not (Test-Path (Join-Path $src 'version.properties'))){throw 'R30 source root missing'}
          Copy-Item "$src\*" $work -Recurse -Force
          "WORK_ROOT=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OUT_ROOT=$(Join-Path $root 'out')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Apply integrated patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $patch=Join-Path $env:GITHUB_WORKSPACE 'pf2-r30-patch'
          python (Join-Path $patch 'patch.py') $env:WORK_ROOT
          if($LASTEXITCODE -ne 0){throw 'Integrated patch failed'}
          Copy-Item (Join-Path $patch 'test_r30_integrated_fixes.py') (Join-Path $env:WORK_ROOT 'tests_pf2\test_r30_integrated_fixes.py') -Force

      - name: Run new integrated regression gates first
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -q pytest
          python -m pytest tests_pf2\test_r30_integrated_fixes.py -q
          if($LASTEXITCODE -ne 0){throw 'Integrated regression gates failed'}

      - name: Run all Kingmaker suites
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $tests=Get-ChildItem tests_pf2 -File -Filter 'test_kingmaker*.py' | Sort-Object Name | ForEach-Object {$_.FullName}
          python -m pytest @tests -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R31_KINGMAKER_TESTS.log"
          if($LASTEXITCODE -ne 0){throw 'Kingmaker regression failed'}

      - name: Run complete PF2 suite
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          python -m pytest tests_pf2 -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R31_ALL_TESTS.log"
          if($LASTEXITCODE -ne 0){throw 'Full PF2 regression failed'}

      - name: Additional semantic gates
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $main=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\MainActivity.java' -Raw
          $narr=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\BraseiroNarrativeDirector.java' -Raw
          $play=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\NarrationPlaybackPolicy.java' -Raw
          $cog=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\MasterCognitiveEngine.java' -Raw
          $guide=Get-Content 'android\app\src\main\java\com\braseiro\pathfinder2e\KingdomTurnGuideEngine.java' -Raw
          $checks=[ordered]@{
            'persona-runtime'=$narr.Contains('HumanGmNarrativeProfile.prompt()')
            'persona-full-asset'=(Test-Path 'android\app\src\main\assets\pathfinder\master\PERFIL_TECNICO_MESTRE_HUMANO_IMERSIVO_VTT.md')
            'character-image-target'=$main.Contains('applyReceivedCharacterImage') -and $main.Contains('sharePromptToGeminiForCharacter')
            'tts-regex-fixed'=$play.Contains('replaceAll("\\p{M}+","")')
            'player-gm-ui'=$main.Contains('new String[]{"Jogador","Mestre"}') -and $main.Contains('showCharacterControlChoice')
            'player-gm-guard'=$cog.Contains('Controle PLAYER/Jogador')
            'kingdom-guide-engine'=$guide.Contains('rules.activityCatalog()') -and $guide.Contains('repository.activeTurn()')
            'kingdom-guide-ui'=$main.Contains('?  GUIA COMPLETO DO TURNO')
            'kokoro-engine'=$main.Contains('com.k2fsa.sherpa.onnx.tts.engine') -and $main.Contains('Braseiro Kokoro PT-BR · neural')
            'kokoro-real-voices'=$main.Contains('nativeTts.getVoices()') -and $main.Contains('nativeTts.setVoice(chosen)')
            'kokoro-queue'=$main.Contains('TextToSpeech.QUEUE_ADD') -and $main.Contains('TextToSpeech.QUEUE_FLUSH')
          }
          $log=Join-Path $env:RUNNER_TEMP 'PF2_R31_INTEGRATED_GATES.log'
          foreach($x in $checks.GetEnumerator()){$status=if($x.Value){'PASS'}else{'FAIL'};"$status - $($x.Key)" | Tee-Object -FilePath $log -Append}
          if(@($checks.GetEnumerator()|Where-Object{-not $_.Value}).Count -gt 0){throw 'Integrated semantic gates failed'}
          "GATES_LOG=$log" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set version 9.0.32
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $vp=Get-Content version.properties -Raw
          $vp=[regex]::Replace($vp,'VERSION_NAME=\d+\.\d+\.\d+','VERSION_NAME=9.0.32')
          $vp=[regex]::Replace($vp,'VERSION_CODE=\d+','VERSION_CODE=90032')
          Set-Content version.properties $vp -Encoding ascii

      - name: Configure Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME)
          if($env:LOCALAPPDATA){$candidates+=(Join-Path $env:LOCALAPPDATA 'Android\Sdk')}
          $sdk=$null;$mgr=$null
          foreach($c in ($candidates|Where-Object{$_}|Select-Object -Unique)){
            if(Test-Path $c){$f=Get-ChildItem $c -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue|Select-Object -First 1;if($f){$sdk=$c;$mgr=$f.FullName;break}}
          }
          if(-not $mgr){throw 'Android SDK not found'}
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          1..100|%{'y'}|& $mgr --licenses|Out-Null
          & $mgr 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          if($LASTEXITCODE -ne 0){throw 'sdkmanager failed'}

      - name: Build Android
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R31_GRADLE.log"
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($code -ne 0){throw "Gradle failed: $code"}

      - name: Package validated outputs
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          $out=$env:OUT_ROOT
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apk=Get-ChildItem . -Recurse -Filter '*.apk' -File|Where-Object{$_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]'}|Select-Object -First 1
          if(-not $apk){throw 'APK missing'}
          $apkOut=Join-Path $out 'Braseiro_Pathfinder2e_9.0.32_R31_INTEGRATED_DEBUG.apk'
          Copy-Item $apk.FullName $apkOut -Force
          (Get-FileHash $apkOut -Algorithm SHA256).Hash.ToLowerInvariant()|Set-Content "$apkOut.sha256" -Encoding ascii

          @"
          # VALIDAÇÃO — PF2 9.0.32 R31 INTEGRATED

          Baseline: R30 pós-Antigravity exato (553809972 bytes).
          Alterações: persona Mestre Humano Imersivo integrada ao BraseiroNarrativeDirector; controle Jogador/Mestre por herói; guia dinâmico do Turno do Reino; retorno Gemini para token de personagem; correção TTS Tom+Tags; Braseiro Kokoro preservado.

          Testes Kingmaker: PASS.
          Regressão PF2 completa: PASS.
          Gates integrados: PASS.
          Gradle assembleDebug: PASS.
          "@ | Set-Content (Join-Path $out 'VALIDACAO_R31_INTEGRATED.md') -Encoding utf8
          Copy-Item "$env:RUNNER_TEMP\PF2_R31_KINGMAKER_TESTS.log" (Join-Path $out 'KINGMAKER_TESTS.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R31_ALL_TESTS.log" (Join-Path $out 'PF2_ALL_TESTS.log')
          Copy-Item "$env:RUNNER_TEMP\PF2_R31_GRADLE.log" (Join-Path $out 'GRADLE_BUILD.log')
          Copy-Item $env:GATES_LOG (Join-Path $out 'INTEGRATED_GATES.log')

          # Clean transient build caches but preserve complete Android Studio source.
          Get-ChildItem . -Directory -Recurse -Force | Where-Object {$_.Name -in @('.gradle','build')} | Sort-Object FullName -Descending | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $zip=Join-Path $out 'BRASEIRO_PATHFINDER2E_9.0.32_R31_INTEGRATED_ANDROID_STUDIO.zip'
          Compress-Archive -Path (Join-Path $env:WORK_ROOT '*') -DestinationPath $zip -CompressionLevel Fastest -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()|Set-Content "$zip.sha256" -Encoding ascii
          "OUT_DIR=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish validated R31 release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='PATHFINDER2E-9.0.32-R31-INTEGRATED'
          $headers=@{'Authorization'="Bearer $env:GITHUB_TOKEN";'Accept'='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='BRELGA-PF2-R31-INTEGRATED'}
          try{$release=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"}
          catch{
            $body=@{tag_name=$tag;target_commitish='audit-pf2-kingmaker-r30-20260928';name='Braseiro Pathfinder 2e 9.0.32 R31 Integrated';body='R30 pós-Antigravity preservado. Integra perfil Mestre Humano Imersivo ao runtime, controle Jogador/Mestre por herói, Guia do Turno do Reino derivado do motor, retorno Gemini para token, correção do TTS Tom+Tags e preservação do Braseiro Kokoro. Publicado somente após regressões Kingmaker/PF2 e Gradle completos.';draft=$false;prerelease=$false}|ConvertTo-Json
            $release=Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$repo/releases"
          }
          foreach($file in Get-ChildItem $env:OUT_DIR -File){
            $existing=$release.assets|Where-Object{$_.name -eq $file.Name}|Select-Object -First 1
            if($existing){Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)"|Out-Null}
            $encoded=[uri]::EscapeDataString($file.Name)
            $upload="https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$encoded"
            & curl.exe -L --fail --retry 5 --retry-delay 2 --request POST --header "Authorization: Bearer $env:GITHUB_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" --header "Content-Type: application/octet-stream" --data-binary "@$($file.FullName)" $upload
            if($LASTEXITCODE -ne 0){throw "upload failed: $($file.Name)"}
          }
          Write-Host "RELEASE_URL=$($release.html_url)"
