name: DnD 6.6.67 Independent Faerun Sidequest Import QA
on:
  push:
    branches:
      - fix/dnd-6667-independent-faerun-sidequest-import-20261126
    paths:
      - dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/BraseiroSideQuestStore.java
      - dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/BraseiroSideQuestStoreRobolectricTest.java
      - dnd-normal/run247-mod005/version.properties
      - .github/workflows/dnd-6667-independent-faerun-sidequest-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK check
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Run real SQLite sidequest and continuity regression tests
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests com.braseiro.dnd5e.BraseiroSideQuestStoreRobolectricTest \
            --tests com.braseiro.dnd5e.AdventureContinuityPersistenceTest \
            --tests com.braseiro.dnd5e.IndependentOfflineRecoveryRobolectricTest \
            --no-daemon --console=plain
      - name: Build 6.6.67 candidate (not published as a release)
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -q '^VERSION_CODE=203900630$' version.properties
          grep -q '^DB_SCHEMA=61$' version.properties
          grep -q '^BACKUP_FORMAT=21$' version.properties
      - name: Retain diagnostic APK if tests pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_DND_6.6.67_INDEPENDENT_FAERUN_SIDEQUEST_QA
          path: dnd-normal/run247-mod005/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
