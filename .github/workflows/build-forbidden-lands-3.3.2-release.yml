name: Forbidden Lands 3.3.2 APK Release
# trigger-build: 2026-09-20T02:22-03:00

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-forbidden-lands-3.3.2-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: 'FORBIDDEN-LANDS-3.3.2-TTS-IMAGE'
  APK_NAME: 'BRASEIRO_FORBIDDEN_LANDS_3.3.2.apk'
  SOURCE_NAME: 'Braseiro_Forbidden_Lands_3.3.2_TTS_IMAGE_PROMPT_PATCH_ANDROID_STUDIO.zip'
  SOURCE_SHA256: '83b99e4ced2f635b1c93d79c0dbb9ef5093545ea1c67cf8af2dc88331ce0061c'
  FIRE_API: 'https://api.firestorage.ai/dev/file'
  SHARE_ID: 'sJUeoArUdSIJ'
  FILE_ID: '01a0bd4313427307bc87a8337de35d13'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact Forbidden Lands 3.3.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming unpacked out
          LIST_URL="$FIRE_API/shares/$SHARE_ID/files?maxResults=1000"
          DOWNLOAD_API="$FIRE_API/shares/$SHARE_ID/files/$FILE_ID/download"

          curl -fsSL "$LIST_URL" -o /tmp/files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/files.json', encoding='utf-8'))
          wanted=os.environ['FILE_ID']
          files=data.get('files') or []
          if not any(str(x.get('fileId'))==wanted for x in files):
              raise SystemExit(f'Forbidden Lands source file id {wanted} not present in temporary share')
          PY

          curl -fsSL -X POST "$DOWNLOAD_API" -o /tmp/download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/download.json', encoding='utf-8'))
          print(data.get('downloadUrl') or '')
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 300 "$DOWNLOAD_URL" -o "incoming/$SOURCE_NAME"

          echo "$SOURCE_SHA256  incoming/$SOURCE_NAME" | sha256sum -c -
          unzip -t "incoming/$SOURCE_NAME" >/dev/null
          unzip -q "incoming/$SOURCE_NAME" -d unpacked

          if [ -f unpacked/package.json ]; then
            PROJECT_ROOT="$GITHUB_WORKSPACE/unpacked"
          else
            FIRST_DIR="$(find unpacked -mindepth 1 -maxdepth 1 -type d | head -n1)"
            test -n "$FIRST_DIR"
            PROJECT_ROOT="$GITHUB_WORKSPACE/$FIRST_DIR"
          fi
          test -f "$PROJECT_ROOT/package.json"
          test -f "$PROJECT_ROOT/android/gradlew"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies from public npm
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 2000
          npm config set fetch-retry-maxtimeout 20000
          npm config set fetch-timeout 120000
          npm ci --no-audit --no-fund

      - name: Set Android release version 3.3.2
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          pkg = Path('package.json')
          data = json.loads(pkg.read_text(encoding='utf-8'))
          data['version'] = '3.3.2'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = re.sub(r'versionCode\s+\d+', 'versionCode 303002', text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "3.3.2"', text, count=1)
          gradle.write_text(text, encoding='utf-8')
          PY
          grep -q 'versionCode 303002' android/app/build.gradle
          grep -q 'versionName "3.3.2"' android/app/build.gradle

      - name: TypeScript and Forbidden Lands gates
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          npm run lint
          npm run verify:start-freeze
          npm run verify:rules

      - name: Build web runtime and synchronize Android assets
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          npm run android:sync
          test -f android/app/src/main/assets/public/index.html
          grep -R -q 'Modelo TTS' android/app/src/main/assets/public/assets
          grep -R -q 'Prompt visual da cena' android/app/src/main/assets/public/assets

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble installable APK
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"

      - name: Validate APK package, version and signature
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "out/$APK_NAME" >/dev/null
          sha256sum "out/$APK_NAME" > "out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "out/$APK_NAME" | tee out/APK_BADGING.txt
          grep -q "package: name='com.braseiro.forbiddenlands'" out/APK_BADGING.txt
          grep -q "versionCode='303002'" out/APK_BADGING.txt
          grep -q "versionName='3.3.2'" out/APK_BADGING.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "out/$APK_NAME" | tee out/APK_SIGNATURE.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Braseiro Forbidden Lands 3.3.2 — TTS e imagens de cena. TTS Gemini com modelo, voz e direção configuráveis; teste usando a configuração escolhida; modelo de imagem configurável; geração manual ou automática; prompt visual editável por cena; imagem retornada e persistida no card da cena. Web runtime recompilado e sincronizado com Android antes da geração do APK.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Braseiro Forbidden Lands 3.3.2 — TTS + Imagem de Cena' --notes "$NOTES"
          gh release upload "$TAG" "out/$APK_NAME" "out/$APK_NAME.sha256" out/APK_BADGING.txt out/APK_SIGNATURE.txt out/GRADLE_BUILD.log --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
