name: Audit Star Wars R38 Block02 v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-star-wars-r38-block02-v2.yml"
      - "star-wars/r38/patches/block01_repair.py"
      - "star-wars/r38/patches/block01_repair_safe.py"
      - "star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: source
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'))
          print('url='+d['source_share_url']); print('sha='+d['sha256']); print('file='+d['file'])
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prepare exact patched source
        env:
          SHARE_URL: ${{ steps.source.outputs.url }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming work; mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['SOURCE_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True); page=b.new_page(accept_downloads=True)
            page.goto(os.environ['SHARE_URL'],wait_until='domcontentloaded',timeout=120000); page.wait_for_timeout(3000)
            done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
              try:
                q=page.locator(sel).first
                if not q.count() or not q.is_visible(): continue
                with page.expect_download(timeout=120000) as info:q.click(timeout=10000)
                info.value.save_as(str(out)); done=True; break
              except: pass
            if not done:
              q=page.get_by_text(os.environ['SOURCE_FILE'],exact=False).first
              with page.expect_download(timeout=120000) as info:q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
              info.value.save_as(str(out)); done=True
            b.close()
          if not done: raise SystemExit('download failed')
          PY
          echo "${EXPECTED_SHA}  incoming/${SOURCE_FILE}" | sha256sum -c -
          unzip -q "incoming/${SOURCE_FILE}" -d work
          G="$(find work -type f -name gradlew -not -path '*/build/*'|head -n1)"; R="$(dirname "$G")"; echo "$R" >/tmp/root
          python3 star-wars/r38/patches/block01_repair_safe.py "$R"
      - name: Correct broad audit
        shell: bash
        run: |
          set -euo pipefail
          export ROOT="$(cat /tmp/root)"
          python3 - <<'PY'
          import os,re,json,pathlib,collections,datetime,subprocess,threading,http.server,socketserver
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(os.environ['ROOT']); vtt=root/'app/src/main/assets/vtt'; r46=vtt/'r46'; shell=vtt/'r46-shell.html'
          issues=[]; stats={}
          def add(sev,code,msg,path=None,evidence=None):issues.append(dict(severity=sev,code=code,message=msg,path=path,evidence=evidence))
          def read(p):return p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          # syntax
          js=list(r46.rglob('*.js')); stats['r46_js_files']=len(js)
          for p in js:
            cp=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if cp.returncode:add('critical','JS_SYNTAX','R46 JavaScript syntax failure',str(p.relative_to(root)),cp.stderr[-800:])
          # exact shell and DOM
          st=read(shell)
          if not st:add('critical','SHELL_MISSING','vtt/r46-shell.html is missing')
          ids=re.findall(r'\bid=["\']([^"\']+)',st)
          for k,n in collections.Counter(ids).items():
            if n>1:add('high','DUPLICATE_ID',f'Duplicate shell id {k}',str(shell.relative_to(root)))
          for target in re.findall(r'\bfor=["\']([^"\']+)',st):
            if target not in ids:add('medium','BROKEN_LABEL_TARGET',f'label target {target} missing',str(shell.relative_to(root)))
          if 'viewport-fit=cover' not in st:add('medium','VIEWPORT_FIT','viewport-fit=cover missing from actual shell')
          # true static refs only HTML src/href + CSS url()
          refs=[]
          for p in [shell]+list(r46.rglob('*.html')):
            t=read(p)
            for ref in re.findall(r'(?:src|href)\s*=\s*["\']([^"\'#?]+)',t,re.I):refs.append((p,ref))
          for p in r46.rglob('*.css'):
            for ref in re.findall(r'url\(\s*["\']?([^"\')?#]+)',read(p),re.I):refs.append((p,ref))
          missing=[]
          for p,ref in refs:
            if ref.startswith(('http:','https:','data:','blob:','javascript:','#')):continue
            a=(p.parent/ref).resolve(); b=(vtt/ref.lstrip('/')).resolve()
            if not a.exists() and not b.exists():missing.append((p,ref));add('high','MISSING_LOCAL_ASSET',f'Static local asset missing: {ref}',str(p.relative_to(root)))
          stats['static_refs']=len(refs);stats['missing_static_refs']=len(missing)
          # Block01 requirements and icons
          alltext='\n'.join(read(p) for p in [shell]+list(r46.rglob('*')) if p.is_file() and p.suffix.lower() in {'.js','.css','.html'})
          required={'SAFE_BOTTOM':'--android-safe-bottom','CSS_SAFE':'safe-area-inset-bottom','SCENE_FALLBACK':'RECOVERED_SCENE_VISUALS','SCENE_IMPORT':'IMPORTAR','ILLUSTRATION':'ILUSTRAÇÃO'}
          for code,token in required.items():
            if token not in alltext:add('high',code,f'Required Block01 marker missing: {token}')
          pngs=sorted(set(re.findall(r'[^"\'\s()]+\.png',alltext,re.I)));stats['png_refs']=pngs
          if len(pngs)<5:add('high','BOTTOM_NAV_ICONS',f'Expected at least five PNG UI refs, found {len(pngs)}',evidence=pngs)
          # Android host exact markers
          java='\n'.join(read(p) for p in root.glob('app/src/main/java/**/*.java'))
          manifest=read(root/'app/src/main/AndroidManifest.xml')
          if 'applySystemInsetsToWeb' not in java:add('high','ANDROID_INSETS','applySystemInsetsToWeb missing from host')
          if 'adjustResize' not in manifest:add('medium','IME_RESIZE','adjustResize missing from manifest')
          if 'com.google.android.apps.bard' not in java or 'Intent.ACTION_SEND' not in java or 'Intent.EXTRA_TEXT' not in java:add('high','GEMINI_HANDOFF','External Gemini ACTION_SEND/EXTRA_TEXT/package contract missing')
          # Runtime web smoke at actual URL
          os.chdir(vtt)
          class H(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          srv=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=srv.serve_forever,daemon=True).start();port=srv.server_address[1]
          rt={'url':None,'page_errors':[],'console_errors':[],'failed_requests':[],'images':[],'nav':[]}
          try:
            with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True);page=b.new_page(viewport={'width':415,'height':915})
              page.on('pageerror',lambda e:rt['page_errors'].append(str(e)))
              page.on('console',lambda m:rt['console_errors'].append(m.text) if m.type=='error' else None)
              page.on('requestfailed',lambda req:rt['failed_requests'].append(req.url))
              page.add_init_script('''const h={get:(t,p)=>{if(p==='then')return undefined;return(...a)=>JSON.stringify({ok:true,items:[],data:[],state:{}})}};for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroGemini','BraseiroImages','BraseiroFiles','BraseiroTts'])window[n]=new Proxy({},h);''')
              url=f'http://127.0.0.1:{port}/r46-shell.html';resp=page.goto(url,wait_until='domcontentloaded',timeout=30000)
              if not resp or resp.status>=400:add('critical','R46_BOOT',f'Actual shell HTTP status {resp.status if resp else None}')
              else:
                rt['url']=url;page.wait_for_timeout(2000)
                rt['images']=page.evaluate('() => [...document.images].map(i=>({src:i.getAttribute("src"),w:i.naturalWidth,complete:i.complete})).filter(x=>x.complete&&x.w===0)')
                for x in rt['images']:add('high','BROKEN_IMAGE_RUNTIME','Rendered image failed',evidence=x)
                # bottom nav controls using actual likely selectors, record only visible controls
                loc=page.locator('nav button:visible, .bottom-nav button:visible, [data-tab]:visible')
                for i in range(min(loc.count(),10)):
                  el=loc.nth(i); label=(el.get_attribute('aria-label') or el.get_attribute('data-tab') or el.inner_text() or f'#{i}')[:80]
                  try:el.click(timeout=1500);page.wait_for_timeout(100);rt['nav'].append({'label':label,'ok':True})
                  except Exception as e:rt['nav'].append({'label':label,'ok':False,'error':str(e)[:200]});add('high','NAV_CLICK',f'Visible nav control failed click: {label}')
              b.close()
          finally:srv.shutdown();srv.server_close()
          for e in rt['page_errors']:add('high','PAGE_ERROR','Runtime pageerror',evidence=e)
          # 404 console errors count only if non-favicon and shell loaded
          for e in rt['console_errors']:
            if 'favicon' not in e.lower():add('medium','CONSOLE_ERROR','Runtime console error',evidence=e)
          counts=collections.Counter(x['severity'] for x in issues)
          report={'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'stats':stats,'issue_counts':dict(counts),'issues':issues,'runtime':rt}
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit/BLOCK02_BROAD_AUDIT_V2.json';out.write_text(json.dumps(report,ensure_ascii=False,indent=2))
          md=['# BLOCK02 BROAD AUDIT V2','',f'- Critical: **{counts["critical"]}**',f'- High: **{counts["high"]}**',f'- Medium: **{counts["medium"]}**',f'- JS checked: **{len(js)}**',f'- Static local refs: **{len(refs)}**, missing **{len(missing)}**',f'- PNG refs detected: **{len(pngs)}**',f'- Runtime shell loaded: **{bool(rt["url"])}**',f'- Broken runtime images: **{len(rt["images"])}**',f'- Visible nav controls exercised: **{len(rt["nav"])}**','','## Findings']
          md += [f'- **{x["severity"].upper()} · {x["code"]}** — {x["message"]}'+(f' — `{str(x["evidence"])[:400]}`' if x.get('evidence') else '') for x in issues] or ['- No reproducible issue found in this scope.']
          (out.parent/'BLOCK02_BROAD_AUDIT_V2.md').write_text('\n'.join(md)+'\n')
          PY
      - name: Commit corrected audit
        run: |
          git config user.name braseiro-audit-bot; git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/BLOCK02_BROAD_AUDIT_V2.*
          git commit -m 'audit(star-wars): record corrected Block02 audit' || true
          git push
