name: DND V1 - independent manual XMM and Backup21 E2E (BRELGA)
on:
  push:
    branches:
      - audit/dnd-v1-manual-backup-e2e-20261015
    paths:
      - '.github/workflows/dnd-v1-manual-backup-audit-brelga.yml'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/V1ManualBackupIsolationRobolectricTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dnd-v1-manual-backup-audit-brelga
  cancel-in-progress: false
jobs:
  check:
    name: XMM manual fail-closed + Backup21 three SQLite reopens
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Verify runner and immutable source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'AUDIT_EXPECTED_BRELGA'}
          Write-Host ('AUDIT_TEST_SHA='+$env:GITHUB_SHA)
          Write-Host 'AUDIT_IMPLEMENTATION_FILES_CHANGED=NO'
          Write-Host 'AUDIT_APK_BUILD=NO'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Java, Android and isolated Gradle
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          if(!(Test-Path 'gradlew.bat')) {throw 'AUDIT_GRADLE_WRAPPER_MISSING'}
          $java17='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if (Test-Path $java17) {
            Add-Content $env:GITHUB_ENV ('JAVA_HOME='+$java17)
            Add-Content $env:GITHUB_PATH (Join-Path $java17 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if(!$sdk -or !(Test-Path $sdk)){$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if(!(Test-Path $sdk)){throw 'AUDIT_ANDROID_SDK_MISSING'}
          Add-Content $env:GITHUB_ENV ('ANDROID_HOME='+$sdk)
          Add-Content $env:GITHUB_ENV ('ANDROID_SDK_ROOT='+$sdk)
          $shared=Join-Path $env:USERPROFILE '.gradle'
          $isolated=Join-Path $env:RUNNER_TEMP ('dnd-v1-audit-gradle-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          foreach($entry in @('wrapper','caches')){
            $from=Join-Path $shared $entry
            $to=Join-Path $isolated $entry
            if((Test-Path $from)-and !(Test-Path $to)){New-Item -ItemType Junction -Path $to -Target $from | Out-Null}
          }
          Add-Content $env:GITHUB_ENV ('GRADLE_USER_HOME='+$isolated)
          Write-Host 'AUDIT_ENVIRONMENT_READY=YES'
      - name: Execute independent real SQLite E2E tests
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $dir='app/build/test-results/testDebugUnitTest'
          if(Test-Path $dir){Remove-Item -LiteralPath $dir -Recurse -Force}
          & .\gradlew.bat :app:testDebugUnitTest --tests com.braseiro.dnd5e.V1ManualBackupIsolationRobolectricTest --no-daemon --console=plain --stacktrace
          $code=$LASTEXITCODE
          $file=Join-Path $dir 'TEST-com.braseiro.dnd5e.V1ManualBackupIsolationRobolectricTest.xml'
          if(!(Test-Path $file)){throw 'AUDIT_MISSING_JUNIT_XML'}
          [xml]$report=Get-Content -LiteralPath $file -Raw
          foreach($node in @($report.SelectNodes('//testcase/failure | //testcase/error'))){
            Write-Host ('AUDIT_FAILED_CASE='+$node.ParentNode.GetAttribute('classname')+'::'+$node.ParentNode.GetAttribute('name'))
            Write-Host ('AUDIT_REASON='+$node.GetAttribute('message'))
            Write-Host ('AUDIT_STACK='+([string]$node.InnerText).Substring(0,[Math]::Min(2000,([string]$node.InnerText).Length)))
          }
          $suite=$report.testsuite
          Write-Host ('AUDIT_TOTAL='+$suite.tests)
          Write-Host ('AUDIT_FAILURES='+$suite.failures)
          Write-Host ('AUDIT_ERRORS='+$suite.errors)
          Write-Host ('AUDIT_SKIPPED='+$suite.skipped)
          if($code -ne 0 -or [int]$suite.tests -ne 2 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0 -or [int]$suite.skipped -ne 0){throw 'AUDIT_E2E_GATE_FAILED'}
          Write-Host 'AUDIT_MANUAL_BACKUP21_E2E=PASS'
          Write-Host 'AUDIT_FULL_XMM_PARITY=NOT_CERTIFIED'
