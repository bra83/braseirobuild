name: Forbidden Lands R27 deep audit 111 gates
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/audit-forbidden-lands-r27-full.yml']
permissions:
  contents: read
jobs:
  independent-audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download immutable R27 audit target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work audit-results
          curl -fsSL --retry 4 -X POST 'https://api.firestorage.ai/dev/file/shares/NjL1D7plKSAG/files/01a119a4b29c770b85fee6b5c73ea254/download' -o incoming/response.json
          python3 - <<'PY' >incoming/url.txt
          import json
          data=json.load(open('incoming/response.json'))
          print(data['downloadUrl'])
          PY
          curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 30 -o incoming/source.zip "$(cat incoming/url.txt)"
          echo 'e5e778c2a90ab8787d6296bf3dccd86c2d774f78155718f4916811ec7fee7076  incoming/source.zip' | sha256sum -c -
          unzip -q incoming/source.zip -d work
      - name: Install clean production/test dependencies
        working-directory: work/fl_r27_source
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock=false --no-audit --no-fund --legacy-peer-deps
      - name: Execute independent audit shard
        working-directory: work/fl_r27_source
        shell: bash
        env:
          AUDIT_SHARD: ${{ matrix.shard }}
          NODE_OPTIONS: --import=fake-indexeddb/auto
        run: |
          set +e
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          root=pathlib.Path.cwd()
          out=(root/'../../audit-results').resolve()
          out.mkdir(parents=True,exist_ok=True)
          p=json.loads((root/'package.json').read_text())
          keys=sorted(k for k in p['scripts'] if k.startswith('verify:') or k in ['test','audit','audit:deep','audit:layout','audit:kotlin'])
          shard=int(os.getenv('AUDIT_SHARD',0))
          selected=[k for i,k in enumerate(keys) if i%4==shard]
          results=[]
          for i,k in enumerate(selected,1):
            t=time.monotonic()
            try:
              proc=subprocess.run(['npm','run',k],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=50)
              status='PASS' if proc.returncode==0 else 'FAIL'
              exitcode=proc.returncode
              output=proc.stdout
            except subprocess.TimeoutExpired as e:
              status='TIMEOUT'
              exitcode=124
              output=(e.stdout or b'').decode('utf-8','replace') if isinstance(e.stdout,bytes) else str(e.stdout or '')
            sec=round(time.monotonic()-t,2)
            (out/(k.replace(':','_')+'.log')).write_text(output[-25000:],errors='replace')
            results.append(dict(name=k,status=status,exit=exitcode,seconds=sec,log=k.replace(':','_')+'.log',last_lines=output.splitlines()[-10:]))
            print(f'[{i}/{len(selected)}] {status} {k} ({sec}s)',flush=True)
          (out/(f'shard-{shard}.json')).write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print('SHARD_RESULT',json.dumps({s:sum(x['status']==s for x in results) for s in ['PASS','FAIL','TIMEOUT']}))
          PY
          exit 0
      - name: Upload full audit evidence (even if tests fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fl-r27-deep-audit-shard-${{ matrix.shard }}
          path: audit-results/*
          if-no-files-found: warn
          retention-days: 5
