name: DnD 6.6.20 Apply Safe Import + Random Gates (mixed endings)
on:
  push:
    branches:
      - fix/dnd-6620-species-monk-audit-20261027
    paths:
      - '.github/workflows/dnd-6620-apply-import-fix.yml'
permissions:
  contents: write
jobs:
  patch-existing-dnd-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch (only existing D&D project)
        uses: actions/checkout@v4
        with:
          ref: fix/dnd-6620-species-monk-audit-20261027
          filter: blob:none
          sparse-checkout: dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Apply exact-anchor checked patch
        run: |
          set -euo pipefail
          python3 dnd-normal/run247-mod005/scripts/patch_6620_import.py
          git -c core.whitespace=cr-at-eol diff --check
          git diff --stat
          git diff -- dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/MainActivity.java | grep -E '^[+-].*(remove\("id"|AlertDialog.Builder|characterDialog|beforeDestructiveChange)' || true
      - name: Commit only existing MainActivity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/MainActivity.java
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(dnd): preserve imported identity hint, confirm overwrite, protect existing hero"
          git push origin HEAD:fix/dnd-6620-species-monk-audit-20261027
