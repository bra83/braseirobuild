name: Audit Star Wars R38 Block07 subtabs
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-star-wars-r38-block07-subtabs.yml"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: src
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'));print('u='+d['source_share_url']);print('f='+d['file']);print('s='+d['sha256'])
          PY
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prepare source
        env:
          U: ${{ steps.src.outputs.u }}
          F: ${{ steps.src.outputs.f }}
          S: ${{ steps.src.outputs.s }}
        run: |
          set -euo pipefail;rm -rf incoming work;mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['F']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);q=b.new_page(accept_downloads=True);q.goto(os.environ['U'],wait_until='domcontentloaded',timeout=120000);q.wait_for_timeout(2500);done=False
            for s in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
              try:
                x=q.locator(s).first
                if x.count() and x.is_visible():
                  with q.expect_download(timeout=120000) as i:x.click(timeout=10000)
                  i.value.save_as(str(out));done=True;break
              except:pass
            if not done:
              x=q.get_by_text(os.environ['F'],exact=False).first
              with q.expect_download(timeout=120000) as i:x.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
              i.value.save_as(str(out))
            b.close()
          PY
          echo "${S}  incoming/${F}"|sha256sum -c -;unzip -q "incoming/${F}" -d work
          R="$(dirname "$(find work -type f -name gradlew -not -path '*/build/*'|head -1)")";echo "ROOT=$R">>/tmp/env
      - name: Inspect subtab semantics from R46 baseline
        run: |
          source /tmp/env;export ROOT
          python3 - <<'PY'
          import os,pathlib,threading,http.server,socketserver,json,datetime
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(os.environ['ROOT']);vtt=root/'app/src/main/assets/vtt';os.chdir(vtt)
          class H(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          s=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=s.serve_forever,daemon=True).start();port=s.server_address[1]
          r={'tabs':{},'issues':[]}
          init='''const mk=()=>new Proxy({}, {get:(t,p)=>{if(p==='then')return undefined;return()=>JSON.stringify({ok:true,items:[],data:[],state:{}})}});for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroImages','BraseiroFiles','BraseiroTts','BraseiroGemini'])window[n]=mk();'''
          try:
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915});pg.add_init_script(init);pg.goto(f'http://127.0.0.1:{port}/r46-shell.html',wait_until='domcontentloaded');pg.wait_for_timeout(900)
              st=pg.locator('#sandbox-start-button');
              if st.count() and st.is_visible():st.click();pg.wait_for_timeout(500)
              for tab in ['PERSONAGEM','ITENS','NAVE','REGISTROS']:
                n=pg.locator('.bottom-nav-button:visible').filter(has_text=tab)
                if n.count():n.first.click();pg.wait_for_timeout(250)
                # capture visible non-bottom navigation buttons near top/content
                arr=pg.locator('button:visible').evaluate_all('''els=>els.filter(e=>!e.closest('.bottom-nav')).map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {text:(e.innerText||'').trim(),class:e.className,ariaCurrent:e.getAttribute('aria-current'),ariaSelected:e.getAttribute('aria-selected'),disabled:e.disabled,pressed:e.getAttribute('aria-pressed'),w:r.width,h:r.height,top:r.top,left:r.left}})''')
                r['tabs'][tab]=arr
                # first obvious current section title button is the first visible short control matching known active names
                active={'PERSONAGEM':'Ficha','ITENS':'Inventário','NAVE':'Resumo','REGISTROS':'Missão'}[tab]
                cand=[x for x in arr if x['text']==active]
                if cand:
                  x=cand[0]
                  if not(x['ariaCurrent'] or x['ariaSelected']=='true' or x['pressed']=='true' or x['disabled']):r['issues'].append({'tab':tab,'control':active,'code':'ACTIVE_SUBTAB_UNANNOUNCED','evidence':x})
                  if x['h']<44:r['issues'].append({'tab':tab,'control':active,'code':'TAP_TARGET_LT_44','evidence':x})
              b.close()
          finally:s.shutdown();s.server_close()
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit';out.mkdir(parents=True,exist_ok=True);(out/'BLOCK07_SUBTAB_AUDIT.json').write_text(json.dumps(r,ensure_ascii=False,indent=2))
          md=['# STAR WARS R38 — BLOCK07 SUBTAB AUDIT','',f'- Issues: **{len(r["issues"])}**','','## Issues']+[f"- {x['tab']} / `{x['control']}` — **{x['code']}** `{x['evidence']}`" for x in r['issues']]
          if not r['issues']:md.append('- none')
          (out/'BLOCK07_SUBTAB_AUDIT.md').write_text('\n'.join(md)+'\n')
          PY
      - name: Commit evidence
        run: |
          git config user.name braseiro-audit-bot;git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/BLOCK07_SUBTAB_AUDIT.*
          git commit -m 'audit(star-wars): inspect active subtab semantics' || true
          git push
