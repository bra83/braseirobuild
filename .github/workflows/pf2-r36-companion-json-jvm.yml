name: PF2 Kingmaker R36 Companion JSON JVM Fidelity
on:
  push:
    branches: [pf2-kingmaker-r36-official-rule-fixes-20261011]
    paths:
      - '.github/workflows/pf2-r36-companion-json-jvm.yml'
      - 'ci/pf2-kingmaker-r36/semantic/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-seven-adventures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/pf2-kingmaker-r36/semantic
            ci/pf2-r36-source-inspection/tools/runtime_json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check all 7 published adventure JSON branches through actual JVM semantics
        shell: bash
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/r36-companion-classes"
          project="$RUNNER_TEMP/r36-companion-snapshot"
          assets="$project/android/app/src/main/assets/pathfinder/kingmaker/chapters"
          mkdir -p "$classes" "$assets"
          cp ci/pf2-kingmaker-r36/semantic/companion_adventures.json "$assets/chapter_12_companion_stories.json"
          javac -encoding UTF-8 -d "$classes" \
            ci/pf2-kingmaker-r36/semantic/*.java \
            ci/pf2-r36-source-inspection/tools/runtime_json/org/json/*.java
          PF2_R36_PROJECT="$project" java -Dfile.encoding=UTF-8 -cp "$classes" com.braseiro.pathfinder2e.R36BookSemanticsHarness
