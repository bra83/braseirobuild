name: Validate Star Wars R54 NAVE E2E
on:
  push:
    branches: [main]
    paths:
      - "star-wars/r54/audit_nave_e2e.py"
      - ".github/workflows/validate-star-wars-r54-nave-e2e.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recover canonical R54 source
        id: root
        run: |
          set -euo pipefail
          rm -rf nave-work && mkdir nave-work
          unzip -q star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip -d nave-work
          SET="$(find nave-work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"
          test -n "$SET"; ROOT="$(dirname "$SET")"; echo "path=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Discover exact vehicle controller API
        env:
          ROOT: "${{ steps.root.outputs.path }}"
        run: |
          set -euo pipefail
          V="$ROOT/app/src/main/assets/vtt"
          echo '=== CONTROLLER 1320-1360 ==='
          sed -n '1320,1360p' "$V/js/core/controller.mjs"
          echo '=== BUNDLE 2400-2445 ==='
          sed -n '2400,2445p' "$V/js/core/uiBridge.bundle.js"
          echo '=== UIBRIDGE VEHICLE EXPOSURE ==='
          grep -n -E 'vehicleProfiles|activeVehicle|addVehicle|setActiveVehicle|registerVehicle|createVehicle|selectVehicle|vehicleCatalog' "$V/js/core/uiBridge.mjs" "$V/js/core/uiBridge.bundle.js" | head -120 || true
