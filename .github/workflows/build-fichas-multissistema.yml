name: Build Braseiro Fichas Multissistema Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/FICHAS_MULTISSISTEMA_BUILD_TRIGGER"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir e validar ZIP do Android Studio
        id: source
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/braseiro-fichas"
          mkdir -p "$WORK"
          cat incoming/fichas-multissistema/chunk_*.b64 > "$WORK/project.b64"
          base64 -d "$WORK/project.b64" > "$WORK/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip"
          echo "b62e238fcc9fdee27e20dcdc34a758cfd5dab92d8110766818d6f121119d8bd9  $WORK/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip" | sha256sum -c -
          unzip -t "$WORK/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip"
          mkdir -p "$WORK/extracted"
          unzip -q "$WORK/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip" -d "$WORK/extracted"
          PROJECT_ROOT="$WORK/extracted/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO"
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/gradlew"
          test -f "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.jar"
          echo "work=$WORK" >> "$GITHUB_OUTPUT"
          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --stacktrace --no-daemon

      - name: Validar APK
        id: apk
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.root }}
          WORK: ${{ steps.source.outputs.work }}
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee "$WORK/aapt.txt"
          grep -q "package: name='com.braseiro.fichas'" "$WORK/aapt.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$WORK/apksigner.txt"
          sha256sum "$APK" | tee "$WORK/apk.sha256"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Preparar entrega e fonte no repositório
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.source.outputs.root }}
          WORK: ${{ steps.source.outputs.work }}
          APK: ${{ steps.apk.outputs.apk }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        run: |
          set -euo pipefail
          SRC_DEST="$GITHUB_WORKSPACE/android/fichas-multissistema"
          OUT="$GITHUB_WORKSPACE/build-artifacts/fichas-multissistema"
          rm -rf "$SRC_DEST" "$OUT"
          mkdir -p "$SRC_DEST" "$OUT"
          cp -a "$PROJECT_ROOT/." "$SRC_DEST/"
          rm -rf "$SRC_DEST/.gradle" "$SRC_DEST/app/build" "$SRC_DEST/build"
          cp "$WORK/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip" "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip"
          cp "$APK" "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.0-debug.apk"
          sha256sum "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip" > "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip.sha256"
          sha256sum "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.0-debug.apk" > "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.0-debug.apk.sha256"
          {
            echo "BRASEIRO FICHAS MULTISSISTEMA — ANDROID BUILD"
            echo "applicationId=com.braseiro.fichas"
            echo "versionName=1.0.0"
            echo "versionCode=1"
            echo "compileSdk=35"
            echo "targetSdk=35"
            echo "minSdk=23"
            echo "source_zip_sha256=b62e238fcc9fdee27e20dcdc34a758cfd5dab92d8110766818d6f121119d8bd9"
            echo "apk_sha256=$APK_SHA"
            echo
            echo "--- AAPT ---"
            cat "$WORK/aapt.txt"
            echo
            echo "--- APKSIGNER ---"
            cat "$WORK/apksigner.txt"
          } > "$OUT/VALIDACAO_ANDROID.txt"

      - name: Publicar no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/fichas-multissistema build-artifacts/fichas-multissistema
          if ! git diff --cached --quiet; then
            git commit -m "Build Braseiro Fichas Multissistema Android"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: braseiro-fichas-multissistema-android
          path: |
            build-artifacts/fichas-multissistema/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip
            build-artifacts/fichas-multissistema/BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO.zip.sha256
            build-artifacts/fichas-multissistema/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.0-debug.apk
            build-artifacts/fichas-multissistema/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.0-debug.apk.sha256
            build-artifacts/fichas-multissistema/VALIDACAO_ANDROID.txt
          if-no-files-found: error
          retention-days: 30

      - name: Resumo
        shell: bash
        run: |
          {
            echo "## Braseiro Fichas Multissistema Android"
            echo ""
            echo "- Projeto Android Studio reconstruído e validado"
            echo "- APK debug compilado e validado"
            echo "- applicationId: \`com.braseiro.fichas\`"
            echo "- APK SHA-256: \`${{ steps.apk.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
