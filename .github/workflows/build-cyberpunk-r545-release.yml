name: BRASEIRO Cyberpunk RED R5.45 APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-cyberpunk-r545-release.yml"
      - "CYBERPUNK_RED_R5_45_BUILD_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  PART00_URL: "https://firestorage.ai/ja/f/pUfGe9UHS3mr"
  PART01_URL: "https://firestorage.ai/ja/f/-xqoSeCFILBV"
  PART02_URL: "https://firestorage.ai/ja/f/nCJuyMD3s5RH"
  PART03_URL: "https://firestorage.ai/ja/f/WoWHsDZmO-hE"
  PART04_URL: "https://firestorage.ai/ja/f/_7Oe6A9ve-od"
  CPRED_SOURCE_SHA256: "6fc7249c1be82a2e2af483d2c03343629ec65a91d8209ae4dd2ccaf54d71a34d"
  CPRED_SOURCE_NAME: "CYBERPUNK_RED_R5_45_DEVICE_RUNTIME_FIX_CHECKPOINT.zip"
  RELEASE_TAG: "cyberpunk-red-r5.45-device-runtime-fix"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        name: Checkout braseirobuild

      - name: Download exact R5.45 source parts
        id: download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming /tmp/cpred-browser
          cd /tmp/cpred-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium

          cat > download-one.mjs <<'NODE'
          import { chromium } from 'playwright';
          const url=process.argv[2];
          const output=process.argv[3];
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
          const page=await context.newPage();

          async function openShare(){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2200);
          }

          async function attempt(){
            const candidates=page.locator('a,button,[role="button"]');
            const count=Math.min(await candidates.count(),150);
            for(let i=0;i<count;i++){
              const el=candidates.nth(i);
              let text='',href='',title='',aria='';
              try{text=(await el.innerText({timeout:500})).trim();}catch{}
              try{href=(await el.getAttribute('href'))||'';}catch{}
              try{title=(await el.getAttribute('title'))||'';}catch{}
              try{aria=(await el.getAttribute('aria-label'))||'';}catch{}
              if(!/download|ダウンロード|保存|取得|ZIP|ファイル/i.test(text+' '+href+' '+title+' '+aria)) continue;
              try{
                const pending=page.waitForEvent('download',{timeout:10000});
                await el.click({timeout:5000});
                const d=await pending;
                await d.saveAs(output);
                console.log('DOWNLOAD_OK '+output+' '+(await d.suggestedFilename()));
                return true;
              }catch{}
            }
            return false;
          }

          await openShare();
          for(let attemptNo=1;attemptNo<=18;attemptNo++){
            if(await attempt()){await browser.close();process.exit(0);}
            await page.waitForTimeout(2500);
            if(attemptNo%4===0) await openShare();
          }
          console.error((await page.locator('body').innerText()).slice(0,8000));
          await browser.close();
          process.exit(2);
          NODE

          node download-one.mjs "$PART00_URL" "$GITHUB_WORKSPACE/incoming/source.zip.part00"
          node download-one.mjs "$PART01_URL" "$GITHUB_WORKSPACE/incoming/source.zip.part01"
          node download-one.mjs "$PART02_URL" "$GITHUB_WORKSPACE/incoming/source.zip.part02"
          node download-one.mjs "$PART03_URL" "$GITHUB_WORKSPACE/incoming/source.zip.part03"
          node download-one.mjs "$PART04_URL" "$GITHUB_WORKSPACE/incoming/source.zip.part04"

          cd "$GITHUB_WORKSPACE"
          test "$(stat -c %s incoming/source.zip.part00)" -eq 50331648
          test "$(stat -c %s incoming/source.zip.part01)" -eq 50331648
          test "$(stat -c %s incoming/source.zip.part02)" -eq 50331648
          test "$(stat -c %s incoming/source.zip.part03)" -eq 50331648
          test "$(stat -c %s incoming/source.zip.part04)" -eq 10984431
          cat incoming/source.zip.part00 incoming/source.zip.part01 incoming/source.zip.part02 incoming/source.zip.part03 incoming/source.zip.part04 > "incoming/$CPRED_SOURCE_NAME"
          echo "$CPRED_SOURCE_SHA256  incoming/$CPRED_SOURCE_NAME" | sha256sum -c -
          unzip -t "incoming/$CPRED_SOURCE_NAME" >/dev/null
          ls -lh "incoming/$CPRED_SOURCE_NAME"

      - name: Extract project and detect Android root
        id: android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q "incoming/$CPRED_SOURCE_NAME" -d work
          ROOT=""
          while IFS= read -r -d '' W; do
            D="$(dirname "$W")"
            if [ -f "$D/settings.gradle.kts" ] || [ -f "$D/settings.gradle" ]; then ROOT="$D"; break; fi
          done < <(find work -type f -name gradlew -print0)
          [ -n "$ROOT" ] || { echo "::error::Android root not found"; exit 1; }
          chmod +x "$ROOT/gradlew"
          test -f "$ROOT/gradle/wrapper/gradle-wrapper.jar"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          grep -F 'applicationId = "com.braseiro.cyberpunkred"' "$ROOT/app/build.gradle.kts"
          grep -F 'versionCode = 4005' "$ROOT/app/build.gradle.kts"
          grep -F 'versionName = "4.0.5"' "$ROOT/app/build.gradle.kts"
          grep -F 'compileSdk = 36' "$ROOT/app/build.gradle.kts"
          grep -F 'minSdk = 24' "$ROOT/app/build.gradle.kts"
          grep -F 'targetSdk = 36' "$ROOT/app/build.gradle.kts"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "ANDROID_ROOT=$ROOT"

      - name: Run R5.45 runtime gates
        id: runtime
        shell: bash
        env:
          ROOT: ${{ steps.android.outputs.root }}
        run: |
          set -euo pipefail
          (cd "$ROOT" && node qa/DEVICE_RUNTIME_RECOVERY_GATE_R5_45.mjs)
          find "$ROOT" -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' F; do node --check "$F" >/dev/null; done
          python3 - "$ROOT" <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          root=pathlib.Path(sys.argv[1])
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in root.rglob('*.xml'):
              try: ET.parse(p)
              except ET.ParseError as e: raise SystemExit(f'XML_FAIL {p}: {e}')
          print('STATIC_PARSE_PASS')
          PY

      - uses: actions/setup-java@v4
        name: Configure Java 17
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        name: Configure Gradle cache

      - name: Gradle project and resource checks
        id: gradle_checks
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew projects --stacktrace --no-daemon
          ./gradlew :app:processDebugMainManifest :app:processDebugResources --stacktrace --no-daemon

      - name: Compile and build debug APK
        id: compile
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace --no-daemon
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect and validate APK
        id: apk
        shell: bash
        env:
          ROOT: ${{ steps.android.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find "$ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -n1)"
          [ -n "${APK:-}" ] && [ -f "$APK" ] || { echo "::error::Debug APK not found"; exit 1; }
          NAME="BRASEIRO-CYBERPUNK-RED-R5.45-DEBUG.apk"
          FINAL="out/$NAME"
          cp "$APK" "$FINAL"
          unzip -t "$FINAL" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' | tee out/APK_BADGING.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL" | tee out/APK_SIGNATURE.txt
          grep -q "package: name='com.braseiro.cyberpunkred' versionCode='4005' versionName='4.0.5'" out/APK_BADGING.txt
          sha256sum "$FINAL" | tee "out/$NAME.sha256"
          stat -c 'APK_SIZE_BYTES=%s' "$FINAL" | tee out/APK_SIZE.txt
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Actions artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberpunk-red-r5.45-apk
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish APK in GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          TITLE="BRASEIRO Cyberpunk RED R5.45 Device Runtime Fix APK"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "Cyberpunk RED R5.45 Device Runtime Fix. Source SHA-256: $CPRED_SOURCE_SHA256. Java 17 / Gradle Wrapper / SDK 36. R5.45 runtime gate, manifest/resources, Kotlin/Java compile, assembleDebug, aapt and apksigner validated by this workflow."
          fi
          gh release upload "$RELEASE_TAG" out/* --clobber
          RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "RELEASE_URL=$RELEASE_URL"

      - name: Summary
        shell: bash
        run: |
          echo "## BRASEIRO Cyberpunk RED R5.45" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA-256: $CPRED_SOURCE_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime gate: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android manifest/resources: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kotlin/Java compile: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- assembleDebug: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: com.braseiro.cyberpunkred" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 4.0.5 (4005)" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: ${{ steps.apk.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: ${{ steps.release.outputs.release_url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Record verifiable build status
        if: always()
        shell: bash
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          EXTRACT: ${{ steps.android.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
          GRADLE_CHECKS: ${{ steps.gradle_checks.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          APK: ${{ steps.apk.outcome }}
          ARTIFACT: ${{ steps.artifact.outcome }}
          RELEASE: ${{ steps.release.outcome }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p cyberpunk-red
          STATUS="cyberpunk-red/r5.45-build-status-${GITHUB_RUN_ID}.txt"
          {
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "COMMIT=$GITHUB_SHA"
            echo "JOB_STATUS=${{ job.status }}"
            echo "DOWNLOAD=$DOWNLOAD"
            echo "EXTRACT=$EXTRACT"
            echo "RUNTIME=$RUNTIME"
            echo "GRADLE_CHECKS=$GRADLE_CHECKS"
            echo "COMPILE=$COMPILE"
            echo "APK=$APK"
            echo "ARTIFACT=$ARTIFACT"
            echo "RELEASE=$RELEASE"
            if [ -f out/BRASEIRO-CYBERPUNK-RED-R5.45-DEBUG.apk.sha256 ]; then cat out/BRASEIRO-CYBERPUNK-RED-R5.45-DEBUG.apk.sha256; fi
          } > "$STATUS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATUS"
          git commit -m "build(cyberpunk): record R5.45 run $GITHUB_RUN_ID" || exit 0
          git push origin HEAD:main
