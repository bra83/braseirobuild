name: Tales v1.3.25 verified candidate (existing Braseiro signature)
on:
  push:
    branches:
      - fix/tales-1325-narracao-continuua-atualizador
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm installed Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -print
      - name: Run all unit tests and build debug APK
        working-directory: android/tales-vtt
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Align and sign APK with existing Braseiro stable certificate
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/tales-vtt/release-artifacts"
          mkdir -p "$OUT"
          KS="$RUNNER_TEMP/braseiro-stable.keystore"
          base64 -d build-signing/braseiro-stable-debug.keystore.b64 > "$KS"
          chmod 600 "$KS"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APK_IN="android/tales-vtt/app/build/outputs/apk/debug/app-debug.apk"
          "$BT/zipalign" -p -f 4 "$APK_IN" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled false --v2-signing-enabled true --out "$OUT/braseiro-tales-flood-v1.3.25-rc1.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT/braseiro-tales-flood-v1.3.25-rc1.apk" | tee "$OUT/APK_VERIFICATION.txt"
          grep -i '6aa87a24a2eb4762c3f493c9d5fddbf10b60cc8659a90423aed7cde8ae582bd3' "$OUT/APK_VERIFICATION.txt"
          "$BT/aapt" dump badging "$OUT/braseiro-tales-flood-v1.3.25-rc1.apk" | tee "$OUT/APK_BADGING.txt"
          grep "package: name='com.braseiro.talesvtt' versionCode='32' versionName='1.3.25'" "$OUT/APK_BADGING.txt"
          "$BT/zipalign" -c -v 4 "$OUT/braseiro-tales-flood-v1.3.25-rc1.apk"
          (cd "$OUT" && sha256sum braseiro-tales-flood-v1.3.25-rc1.apk > SHA256SUMS.txt)
          rm -f "$KS" "$OUT/aligned.apk"
      - name: Publish JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tales-v1325-unit-tests
          path: android/tales-vtt/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - name: Publish verified installable APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tales-v1325-verified-signed-apk
          path: android/tales-vtt/release-artifacts/
          if-no-files-found: error
      - name: Create prerelease for device validation
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd android/tales-vtt/release-artifacts
          gh release create v1.3.25-rc1             braseiro-tales-flood-v1.3.25-rc1.apk             SHA256SUMS.txt APK_VERIFICATION.txt APK_BADGING.txt             --target "$GITHUB_SHA"             --title "Braseiro Tales/Flood 1.3.25 RC1 - correcoes de atualizacao, voz e persistencia"             --notes "Candidato assinado com o mesmo certificado Braseiro v1.3.20. Testes unitarios executados no CI. Teste fisico Galaxy A57 pendente. Nao substitui o canal oficial 1.3.20."             --prerelease
