name: Build Braseiro Fichas 1.0.1 UI Fix

on:
  push:
    branches: [fichas-final-20260916]
    paths:
      - ".github/workflows/build-fichas-1.0.1-ui-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_URL: "https://firestorage.ai/ja/f/yADUApCbCX7e"
      SOURCE_SHA256: "491f8ae5932ee49c2cbabb936c634d6c1daea2158ba21b70c569b15fbabb9148"
      SOURCE_NAME: "BRASEIRO_FICHAS_MULTISSISTEMA_ANDROID_STUDIO_1.0.1_UI_FIX_2026-09-16.zip"

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Preparar navegador para baixar checkpoint
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_DIR="$RUNNER_TEMP/firestorage-browser"
          mkdir -p "$BROWSER_DIR"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          echo "BROWSER_DIR=$BROWSER_DIR" >> "$GITHUB_ENV"

      - name: Baixar projeto corrigido e validar SHA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/download-firestorage.cjs" <<'JS'
          const path = require('path');
          const { chromium } = require(path.join(process.env.BROWSER_DIR, 'node_modules', 'playwright'));
          (async () => {
            const out = path.join(process.env.RUNNER_TEMP, process.env.SOURCE_NAME);
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({acceptDownloads:true});
            const page = await context.newPage();
            await page.goto(process.env.SOURCE_URL, {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(7000);
            const controls = [
              page.getByRole('button', {name:/ダウンロード|download/i}),
              page.getByRole('link', {name:/ダウンロード|download/i}),
              page.locator('button').filter({hasText:/ダウンロード|download/i}),
              page.locator('a').filter({hasText:/ダウンロード|download/i})
            ];
            let saved=false;
            for (const loc of controls) {
              for (let i=0;i<await loc.count() && !saved;i++) {
                const el=loc.nth(i);
                if (!(await el.isVisible().catch(()=>false))) continue;
                const p=page.waitForEvent('download',{timeout:30000}).catch(()=>null);
                await el.click({timeout:15000}).catch(()=>el.click({force:true,timeout:10000}));
                const d=await p;
                if (d) { await d.saveAs(out); saved=true; }
              }
              if (saved) break;
            }
            await browser.close();
            if (!saved) throw new Error('Download do projeto não foi capturado');
          })().catch(e=>{console.error(e);process.exit(2)});
          JS
          node "$RUNNER_TEMP/download-firestorage.cjs"
          ZIP="$RUNNER_TEMP/$SOURCE_NAME"
          test -f "$ZIP"
          echo "$SOURCE_SHA256  $ZIP" | sha256sum -c -
          unzip -t "$ZIP"

      - name: Extrair projeto Android Studio
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/fichas-101"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$RUNNER_TEMP/$SOURCE_NAME" -d "$WORK"
          GRADLEW="$(find "$WORK" -type f -name gradlew -print -quit)"
          test -n "$GRADLEW"
          ROOT="$(dirname "$GRADLEW")"
          test -f "$ROOT/settings.gradle.kts" -o -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/build.gradle.kts" -o -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/assets/www/launcher-data.css"
          test -f "$ROOT/app/src/main/assets/www/launcher-braseiro.webp"
          test -f "$ROOT/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          echo "ANDROID_PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Usar Android SDK preinstalado do runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Instalar Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --stacktrace --no-daemon

      - name: Validar e publicar APK 1.0.1
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_PROJECT_ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -f "$APK"
          OUT="$GITHUB_WORKSPACE/deliverables/fichas-1.0.1-ui-fix"
          mkdir -p "$OUT"
          unzip -t "$APK" > "$OUT/unzip-apk.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$OUT/aapt.txt"
          grep -q "package: name='com.braseiro.fichas' versionCode='2' versionName='1.0.1'" "$OUT/aapt.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$OUT/apksigner.txt"
          cp "$APK" "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.1-ui-fix-debug.apk"
          sha256sum "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.1-ui-fix-debug.apk" | tee "$OUT/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.1-ui-fix-debug.apk.sha256"
          echo "$SOURCE_SHA256  $SOURCE_NAME" > "$OUT/source-project.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT"
          git commit -m "build: publish Braseiro Fichas 1.0.1 UI fix APK"
          git push origin HEAD:fichas-final-20260916
