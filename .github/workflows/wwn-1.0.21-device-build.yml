name: WWN 1.0.21 Device Build

on:
  push:
    branches:
      - wwn-1.0.21-device-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DIRECT_URL: https://eu-central.storage.cloudconvert.com/tasks/983dd00c-4706-48cf-8f65-77348789530c/BRASEIRO_WWN_1.0.21_ANDROID_STUDIO_DEVICE_CANDIDATE.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260920%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260920T001631Z&X-Amz-Expires=86400&X-Amz-Signature=80459a5781a5b9a649a83292b0b4f4f7df1885fb33005cc729911131bc8a9b6a&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22BRASEIRO_WWN_1.0.21_ANDROID_STUDIO_DEVICE_CANDIDATE.zip%22&response-content-type=application%2Fzip&x-amz-checksum-mode=ENABLED&x-id=GetObject
      EXPECTED_SHA256: d0ce8e27231a35981a6750c80583dfb2acb2acd1c3e0612583b8a93d8c19d482
      ARCHIVE_NAME: BRASEIRO_WWN_1.0.21_ANDROID_STUDIO_DEVICE_CANDIDATE.zip

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recover build input
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_DIRECT_URL" -o transport.zip
          rm -rf transport_unpack
          mkdir transport_unpack
          unzip -q transport.zip -d transport_unpack
          INNER="$(find transport_unpack -type f -name 'BRASEIRO_WWN_1.0.21_ANDROID_STUDIO_DEVICE_CANDIDATE.zip' | head -1)"
          test -n "$INNER"
          cp "$INNER" "$ARCHIVE_NAME"
          sha256sum "$ARCHIVE_NAME"
          echo "$EXPECTED_SHA256  $ARCHIVE_NAME" | sha256sum -c -

      - name: Unpack candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _wwn_build
          mkdir _wwn_build
          unzip -q "$ARCHIVE_NAME" -d _wwn_build
          ANDROID_DIR="$(find _wwn_build -type f -name gradlew -printf '%h\n' | head -1)"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android root: $ANDROID_DIR"
          test -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar"
          test -f "$ANDROID_DIR/app/build.gradle.kts"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          chmod +x gradlew
          java -version
          ./gradlew --version
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$ANDROID_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/BRASEIRO_WWN_1.0.21_DEVICE_CANDIDATE.apk
          sha256sum dist/BRASEIRO_WWN_1.0.21_DEVICE_CANDIDATE.apk | tee dist/BRASEIRO_WWN_1.0.21_DEVICE_CANDIDATE.apk.sha256

      - name: Publish APK directly to build branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          token=os.environ["GH_TOKEN"]
          repo=os.environ["GITHUB_REPOSITORY"]
          branch=os.environ["GITHUB_REF_NAME"]
          for local, path in [
              ("dist/BRASEIRO_WWN_1.0.21_DEVICE_CANDIDATE.apk","wwn-builds/BRASEIRO_WWN_1.0.21_DEVICE_CANDIDATE.apk"),
              ("dist/BRASEIRO_WWN_1.0.21_DEVICE_CANDIDATE.apk.sha256","wwn-builds/BRASEIRO_WWN_1.0.21_DEVICE_CANDIDATE.apk.sha256"),
          ]:
              data=base64.b64encode(open(local,"rb").read()).decode()
              api=f"https://api.github.com/repos/{repo}/contents/{path}"
              headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
              sha=None
              try:
                  rr=urllib.request.urlopen(urllib.request.Request(api+"?ref="+branch,headers=headers),timeout=30)
                  sha=json.load(rr).get("sha")
              except Exception:
                  pass
              payload={"message":"build(wwn): publish 1.0.21 device APK","content":data,"branch":branch}
              if sha: payload["sha"]=sha
              req=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={**headers,"Content-Type":"application/json"},method="PUT")
              with urllib.request.urlopen(req,timeout=120) as rr:
                  out=json.load(rr)
                  print("published", path, out.get("content",{}).get("html_url"))
          PY

