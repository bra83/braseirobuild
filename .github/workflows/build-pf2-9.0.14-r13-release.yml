name: Pathfinder 2e 9.0.14 R13 APK Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-pf2-9.0.14-r13-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: 'PATHFINDER2E-9.0.14-R13'
  APK_NAME: 'Braseiro_Pathfinder2e_9.0.14_R13_DEBUG.apk'
  SOURCE_SHA256: 'bc51f9f863d5265a130047336a2ffad8f19ae18ce6bba11a6d848a41505c3c6f'
  SHARE_URL: 'https://firestorage.ai/ja/f/uPz1-yd-YBIO'
  SOURCE_FILENAME: 'Braseiro_Pathfinder2e_9.0.14_MOTOR_BARBARA_1.1.2_RUNTIME_NARRATOR_TTS_R13_ATLAS_V6_ANDROID_STUDIO.zip'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact R13 source from temporary transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work out downloader
          cd downloader
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cd ..
          cat > downloader/download.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const share = process.env.SHARE_URL;
          const filename = process.env.SOURCE_FILENAME;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto(share, {waitUntil:'domcontentloaded', timeout:120000});
          await page.waitForTimeout(4000);
          const body = await page.locator('body').innerText();
          console.log(body.slice(0,10000));
          const exact = page.getByText(filename, {exact:false}).first();
          if (await exact.count()) {
            const downloadPromise = page.waitForEvent('download', {timeout:120000});
            await exact.click();
            const download = await downloadPromise;
            await download.saveAs('incoming/source.zip');
          } else {
            const anchors = page.locator('a');
            const n = await anchors.count();
            let clicked = false;
            for (let i=0;i<n;i++) {
              const a=anchors.nth(i);
              const txt=(await a.innerText().catch(()=>'')) || '';
              const href=(await a.getAttribute('href')) || '';
              if (txt.includes(filename) || /download/i.test(txt) || /download/i.test(href)) {
                const downloadPromise = page.waitForEvent('download', {timeout:120000});
                await a.click();
                const download = await downloadPromise;
                await download.saveAs('incoming/source.zip');
                clicked=true;
                break;
              }
            }
            if (!clicked) throw new Error('download control not found');
          }
          await browser.close();
          if (!fs.existsSync('incoming/source.zip')) throw new Error('source.zip not saved');
          EOF
          node downloader/download.mjs
          echo "$SOURCE_SHA256  incoming/source.zip" | sha256sum -c -
          unzip -t incoming/source.zip >/dev/null
          unzip -q incoming/source.zip -d work
          test -f work/gradlew
          grep -q '^VERSION_NAME=9.0.14$' work/version.properties
          grep -q '^VERSION_CODE=90014$' work/version.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble APK
        shell: bash
        working-directory: work
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "out/$APK_NAME" >/dev/null
          sha256sum "out/$APK_NAME" > "out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "out/$APK_NAME" | tee out/APK_BADGING.txt
          grep -q "package: name='com.braseiro.pathfinder2e'" out/APK_BADGING.txt
          grep -q "versionCode='90014'" out/APK_BADGING.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Braseiro Pathfinder 2e 9.0.14 R13 — Runtime Narrator/TTS. Corrige perguntas sem avanço de cena, contexto do Gemini/Mestre, timeout indevido, continuidade do Charon e seleção do fallback Android. Package com.braseiro.pathfinder2e; Motor Barbara 1.1.2; Atlas V6 preservado.'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title 'Braseiro Pathfinder 2e 9.0.14 R13' --notes "$NOTES"
          gh release upload "$TAG" "out/$APK_NAME" "out/$APK_NAME.sha256" out/APK_BADGING.txt out/GRADLE_BUILD.log --clobber
          gh release view "$TAG" --json url,tagName,name,assets
