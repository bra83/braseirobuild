name: DND V1 BASE - full regression and debug candidate (BRELGA)
on:
  push:
    branches:
      - wip/dnd-xmm-block02-resgate-20261015
    paths:
      - .github/workflows/dnd-v1-core-20241025-release-candidate-brelga.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: dnd-v1-core-brelga
  cancel-in-progress: false

jobs:
  verify-full-core:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 95
    steps:
      - name: Pin BRELGA source and dependencies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw 'V1_EXPECTED_BRELGA' }
          Write-Host ('V1_SOURCE_SHA='+$env:GITHUB_SHA)
          Write-Host 'V1_SCOPE=XPHB_2024_XDMG_2024_XMM_2025'
          Write-Host 'V1_RELEASE_AUTHORIZATION=NO; V1_APK_DEBUG_ONLY=YES'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Verify environment and canonical assets
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          if (!(Test-Path 'app/src/main/assets/maps/PACOTE_MAPA_FAERUN_2025_PTBR_MAX_V2.zip')) { throw 'V1_MAP_ASSET_MISSING' }
          if (!(Test-Path '.\\gradlew.bat')) { throw 'V1_WRAPPER_MISSING' }
          $java17='C:\actions-runner\_work\_tool\Java_Temurin-Hotspot_jdk\17.0.20-101\x64'
          if (Test-Path $java17) {
            Add-Content -Path $env:GITHUB_ENV -Value ('JAVA_HOME='+$java17)
            Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $java17 'bin')
          }
          $sdk=$env:ANDROID_HOME
          if (!$sdk -or !(Test-Path $sdk)) {$sdk=Join-Path $env:LOCALAPPDATA 'Android\Sdk'}
          if (!(Test-Path $sdk)) { throw 'V1_ANDROID_SDK_MISSING' }
          Add-Content -Path $env:GITHUB_ENV -Value ('ANDROID_HOME='+$sdk)
          Add-Content -Path $env:GITHUB_ENV -Value ('ANDROID_SDK_ROOT='+$sdk)
          $shared=Join-Path $env:USERPROFILE '.gradle'
          $isolated=Join-Path $env:RUNNER_TEMP ('v1-full-gradle-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $isolated | Out-Null
          foreach ($item in @('wrapper','caches')) {
            $source=Join-Path $shared $item
            $target=Join-Path $isolated $item
            if ((Test-Path $source) -and !(Test-Path $target)) {
              New-Item -ItemType Junction -Path $target -Target $source | Out-Null
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value ('GRADLE_USER_HOME='+$isolated)
          Get-Content 'version.properties'
          Write-Host 'V1_PINNED_ENVIRONMENT=PASS'
      - name: Full Android/Robolectric regression - no exclusions
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          $xml='app/build/test-results/testDebugUnitTest'
          if (Test-Path $xml) { Remove-Item -LiteralPath $xml -Recurse -Force }
          & .\gradlew.bat :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
          $exitCode=$LASTEXITCODE
          $reports=@()
          if (Test-Path $xml) {$reports=@(Get-ChildItem -LiteralPath $xml -Filter 'TEST-*.xml' -File)}
          $count=0;$fail=0;$errors=0;$skipped=0
          foreach($r in $reports) {
            [xml]$d=Get-Content -LiteralPath $r.FullName -Raw
            $count += [int]$d.testsuite.tests
            $fail += [int]$d.testsuite.failures
            $errors += [int]$d.testsuite.errors
            $skipped += [int]$d.testsuite.skipped
            foreach($node in @($d.SelectNodes('//testcase/failure | //testcase/error'))) {
              Write-Host ('V1_FAIL_CASE='+$node.ParentNode.GetAttribute('classname')+'::'+$node.ParentNode.GetAttribute('name'))
              Write-Host ('V1_FAIL_REASON='+$node.GetAttribute('message'))
            }
          }
          Write-Host ('V1_FULL_TESTS='+$count)
          Write-Host ('V1_FULL_XMLS='+$reports.Count)
          Write-Host ('V1_FAILURES='+$fail+' V1_ERRORS='+$errors+' V1_SKIPPED='+$skipped)
          if($exitCode -ne 0 -or $fail -gt 0 -or $errors -gt 0 -or $skipped -gt 0) { throw 'V1_FULL_SUITE_FAILED' }
          if($count -lt 2500) { throw 'V1_HISTORICAL_TEST_COUNT_REGRESSION_BELOW_2500' }
          $must=@(
            'com.braseiro.dnd5e.e2e.Core2024PlayableSessionRobolectricTest',
            'com.braseiro.dnd5e.e2e.E2EGatesIntegrationRobolectricTest',
            'com.braseiro.dnd5e.CoreGameLaunchRobolectricTest',
            'com.braseiro.dnd5e.AppDbBackupRobolectricTest',
            'com.braseiro.dnd5e.CharacterCreationUiRobolectricTest',
            'com.braseiro.dnd5e.SessionContinuityUiRobolectricTest'
          )
          foreach($c in $must) {
            $f=Join-Path $xml ('TEST-'+$c+'.xml')
            if(!(Test-Path $f)) { throw ('V1_REQUIRED_SUITE_MISSING='+$c) }
          }
          Write-Host 'V1_FULL_REGRESSION=PASS'
      - name: Build only full-assets debug APK candidate
        shell: powershell
        working-directory: dnd-normal/run247-mod005
        run: |
          $ErrorActionPreference='Stop'
          & .\gradlew.bat :app:assembleDebug --no-daemon --console=plain --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'V1_APK_DEBUG_ASSEMBLE_FAILED' }
          $apk=Get-ChildItem 'app/build/outputs/apk/debug' -File -Filter '*.apk' | Select-Object -First 1
          if (!$apk) { throw 'V1_APK_NOT_FOUND' }
          $hash=(Get-FileHash $apk.FullName -Algorithm SHA256).Hash
          Write-Host ('V1_APK_SHA256='+$hash)
          Write-Host ('V1_APK_BYTES='+$apk.Length)
          $bt=Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if(!$bt){throw 'V1_AAPT_APKSIGNER_TOOLS_MISSING'}
          $aapt=Join-Path $bt.FullName 'aapt.exe'
          $signer=Join-Path $bt.FullName 'apksigner.bat'
          if(!(Test-Path $aapt)-or !(Test-Path $signer)){throw 'V1_APK_TOOLS_MISSING'}
          $badge=& $aapt dump badging $apk.FullName
          if($LASTEXITCODE -ne 0 -or !($badge -match "package: name='com.braseiro.dnd5e'")){throw 'V1_APK_PACKAGE_MISMATCH'}
          & $signer verify --verbose $apk.FullName
          if($LASTEXITCODE -ne 0){throw 'V1_APK_SIGNATURE_INVALID'}
          Write-Host 'V1_APK_DEBUG_CANDIDATE=PASS'
          Write-Host 'V1_ANDROID_PHYSICAL=NOT_TESTED'
          Write-Host 'V1_UPDATE_SIGNATURE_CONTINUITY=NOT_TESTED'
      - name: Publish reports and debug APK candidate if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-v1-base-preflight-${{ github.sha }}
          path: |
            dnd-normal/run247-mod005/app/build/test-results/testDebugUnitTest/TEST-*.xml
            dnd-normal/run247-mod005/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 3
