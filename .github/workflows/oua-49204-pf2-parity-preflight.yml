# pf2-parity-preflight-r8
name: OUA 4.9.204 PF2 Gemini FINAL hosted build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oua-49204-pf2-parity-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            ci/oua-4.9.197
            ci/oua-4.9.199
            ci/oua-4.9.200
            ci/oua-4.9.201
            ci/oua-4.9.202
            ci/oua-4.9.203
            ci/oua-4.9.204
            build-signing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Reconstruct exact 4.9.204 source
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/oua-49204-preflight"
          IN="$WORK/incoming"
          EX="$WORK/extract"
          OUT="$WORK/out"
          rm -rf "$WORK"
          mkdir -p "$IN" "$EX" "$OUT"

          curl -L --fail --retry 5 --retry-delay 2             -o "$IN/OUA_4.9.196_FULL_OUTER.zip"             "https://drive.usercontent.google.com/download?id=1yIvAylIHStuCnUdIMxxpaAMxlOluStDC&export=download&confirm=t"

          unzip -q "$IN/OUA_4.9.196_FULL_OUTER.zip" -d "$EX"
          INNER="$(find "$EX" -type f -name 'OUA_4.9.196_BRELGA_SOURCE.zip' | head -n 1 || true)"
          if [ -n "$INNER" ]; then
            mkdir -p "$EX/source"
            unzip -q "$INNER" -d "$EX/source"
            SEARCH="$EX/source"
          else
            SEARCH="$EX"
          fi

          PKG=""
          while IFS= read -r candidate; do
            if [ -d "$(dirname "$candidate")/android" ]; then PKG="$candidate"; break; fi
          done < <(find "$SEARCH" -type f -name package.json | sort)
          test -n "$PKG"
          ROOT="$(dirname "$PKG")"
          echo "OUA_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "OUA_OUT=$OUT" >> "$GITHUB_ENV"

          cat ci/oua-4.9.197/patch.part{0,1,2,3} | tr -d '\r\n' | base64 -d | gzip -d > "$WORK/197.patch"
          (cd "$ROOT" && git apply --ignore-space-change --ignore-whitespace "$WORK/197.patch")

          for ver in 4.9.199 4.9.200; do
            base64 -d "ci/oua-$ver/apply-fix-$ver.mjs.gz.b64" | gzip -d > "$WORK/apply-$ver.mjs"
            node "$WORK/apply-$ver.mjs" "$ROOT"
          done
          echo "HOTFIX_SCRIPT=$WORK/apply-4.9.199.mjs" >> "$GITHUB_ENV"

          node ci/oua-4.9.201/apply-fix-4.9.201.mjs "$ROOT"
          node ci/oua-4.9.202/apply-fix-4.9.202.mjs "$ROOT"

          # Token recrop already passed on BRELGA R12 and is unchanged by the
          # Pathfinder Gemini parity patch. Hosted preflight focuses on code compilation.
          node ci/oua-4.9.203/apply-fix-4.9.203.mjs "$ROOT"
          node ci/oua-4.9.203/verify-4.9.203.mjs "$ROOT"

          cat ci/oua-4.9.204/apply.part{0,1,2,3} | tr -d '\r\n' | base64 -d > "$WORK/apply-4.9.204.mjs"
          node "$WORK/apply-4.9.204.mjs" "$ROOT"
          node ci/oua-4.9.204/hotfix-pf2-gemini-parity.mjs "$ROOT"

          cat ci/oua-4.9.204/verify.part{0,1} | tr -d '\r\n' | base64 -d > "$WORK/verify-4.9.204.mjs"
          node "$WORK/verify-4.9.204.mjs" "$ROOT"
          echo "VERIFY_204=$WORK/verify-4.9.204.mjs" >> "$GITHUB_ENV"

      - name: TypeScript and web build
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUA_ROOT"
          npm config set registry https://registry.npmjs.org/
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm install --no-save --ignore-scripts --no-audit --no-fund @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
          npm run lint
          npm run build
          node scripts/sync-android-assets.mjs
          node "$HOTFIX_SCRIPT" "$OUA_ROOT" --verify-built
          node "$VERIFY_204" "$OUA_ROOT"

      - name: Android compile preflight
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUA_ROOT/android"
          if [ -n "${ANDROID_HOME:-}" ]; then printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties; fi
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Sign, verify and publish corrected APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/braseiro-stable-debug.keystore"
          base64 -d "$GITHUB_WORKSPACE/build-signing/braseiro-stable-debug.keystore.b64" > "$KEYSTORE"

          APK_IN="$(find "$OUA_ROOT/android/app/build/outputs/apk/debug" -type f -name '*.apk' | sort | head -n1)"
          test -n "$APK_IN" && test -f "$APK_IN"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -d "$BUILD_TOOLS"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          ALIGNED="$RUNNER_TEMP/oua-49204-aligned.apk"
          FINAL="$GITHUB_WORKSPACE/BRASEIRO_O_UM_ANEL_4.9.204_UPDATE.apk"
          "$ZIPALIGN" -p -f 4 "$APK_IN" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$FINAL" "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$FINAL" | tee "$GITHUB_WORKSPACE/OUA_49204_FINAL_SIGNATURE.txt"
          "$AAPT" dump badging "$FINAL" | tee "$GITHUB_WORKSPACE/OUA_49204_FINAL_BADGING.txt"

          grep -q "package: name='com.braseiro.oumanel'" "$GITHUB_WORKSPACE/OUA_49204_FINAL_BADGING.txt"
          grep -q "versionCode='49204'" "$GITHUB_WORKSPACE/OUA_49204_FINAL_BADGING.txt"
          grep -q "versionName='4.9.204'" "$GITHUB_WORKSPACE/OUA_49204_FINAL_BADGING.txt"

          BASE_DIR="$RUNNER_TEMP/oua-49204-base"
          mkdir -p "$BASE_DIR"
          gh release download OUA-v4.9.204 \
            --pattern "BRASEIRO_O_UM_ANEL_4.9.204_UPDATE.apk" \
            --dir "$BASE_DIR" \
            --clobber
          BASE="$BASE_DIR/BRASEIRO_O_UM_ANEL_4.9.204_UPDATE.apk"
          test -f "$BASE"

          BASE_DIGEST="$("$APKSIGNER" verify --print-certs "$BASE" | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}')"
          NEW_DIGEST="$("$APKSIGNER" verify --print-certs "$FINAL" | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}')"
          test -n "$BASE_DIGEST" && test "$BASE_DIGEST" = "$NEW_DIGEST"

          sha256sum "$FINAL" | tee "$GITHUB_WORKSPACE/BRASEIRO_O_UM_ANEL_4.9.204_UPDATE.apk.sha256"

          cat > "$GITHUB_WORKSPACE/OUA_49204_FINAL_VALIDATION.txt" <<EOF
          PASS - Pathfinder-style Gemini startup/failover patch included
          PASS - opening-atlas-nonblocking
          PASS - TypeScript
          PASS - Vite/web build
          PASS - Android assembleDebug
          PASS - package com.braseiro.oumanel
          PASS - versionName 4.9.204
          PASS - versionCode 49204
          PASS - signing certificate matches the currently published install-over APK
          RESULT - corrected APK ready for install-over.
          EOF

          gh release upload OUA-v4.9.204 \
            "$FINAL" \
            "$GITHUB_WORKSPACE/BRASEIRO_O_UM_ANEL_4.9.204_UPDATE.apk.sha256" \
            "$GITHUB_WORKSPACE/OUA_49204_FINAL_VALIDATION.txt" \
            "$GITHUB_WORKSPACE/OUA_49204_FINAL_SIGNATURE.txt" \
            "$GITHUB_WORKSPACE/OUA_49204_FINAL_BADGING.txt" \
            --clobber

          gh release edit OUA-v4.9.204 \
            --title "Braseiro O Um Anel 4.9.204 — startup corrigido" \
            --notes "APK 4.9.204 substituído pela build validada com o fluxo de início/Gemini baseado no Pathfinder 2e. A abertura não é mais bloqueada por ausência de hex no Atlas; a cadeia de fallback Gemini, perfil narrativo, TTS/Kokoro e demais gates 4.9.204 foram validados antes da publicação."
