name: PF2 R34 Release Auth Check

on:
  push:
    branches: [pf2-r34-closure-20260929]
    paths:
      - '.github/workflows/pf2-r34-publish-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pf2-r34-closure-20260929
          persist-credentials: true

      - name: Ensure R34 release exists
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_REPOSITORY
          $tag='PATHFINDER2E-9.0.35-R34'
          $api="https://api.github.com/repos/$repo"
          $auth=& git config --local --get http.https://github.com/.extraheader
          if([string]::IsNullOrWhiteSpace($auth)){throw 'Checkout authentication header unavailable.'}
          $common=@('--header',$auth,'--header','Accept: application/vnd.github+json','--header','X-GitHub-Api-Version: 2022-11-28')
          $response=Join-Path $env:RUNNER_TEMP 'r34-release-auth.json'
          $status=& curl.exe -L --silent --show-error @common --output $response --write-out '%{http_code}' "$api/releases/tags/$tag"
          if($status -eq '404'){
            $payload=@{
              tag_name=$tag
              target_commitish='pf2-r34-closure-20260929'
              name='Braseiro Pathfinder 2e 9.0.35 R34 - Kingmaker Closure + Kokoro + Token Fix'
              body='R34: Restov sandbox com chegada variável; mansão de Lady Jamandi em fases persistentes; Atlas sincronizado; cenas principais 5-6 mil caracteres; Kokoro alinhado ao Forbidden Lands; correção do retorno da imagem Gemini para o token do personagem. Assets serão anexados após a compilação validada.'
              draft=$false
              prerelease=$false
            } | ConvertTo-Json -Compress
            $payloadPath=Join-Path $env:RUNNER_TEMP 'r34-release-auth-payload.json'
            [System.IO.File]::WriteAllText($payloadPath,$payload,(New-Object System.Text.UTF8Encoding($false)))
            $status=& curl.exe -L --silent --show-error @common --header 'Content-Type: application/json' --data-binary "@$payloadPath" --output $response --write-out '%{http_code}' "$api/releases"
          }
          if($status -notmatch '^20'){throw "GitHub Release authentication failed: HTTP $status"}
          $release=Get-Content $response -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "RELEASE_OK=$($release.html_url)"
