name: Build Star Wars Edge of the Galaxy R38 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-star-wars-r38.yml"
      - "star-wars/r38/SOURCE.json"
      - "STAR_WARS_R38_BUILD_TRIGGER.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Read pinned Star Wars R38 source manifest
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json', encoding='utf-8'))
          print('url='+d['source_share_url'])
          print('sha='+d['sha256'])
          print('file='+d['file'])
          print('app_id='+d['application_id'])
          print('compile_sdk='+str(d['compile_sdk']))
          PY

      - name: Configure Python download helper
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium downloader
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Download exact Star Wars R38 source
        env:
          SHARE_URL: ${{ steps.source.outputs.url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          python3 - <<'PY'
          import os, pathlib
          from playwright.sync_api import sync_playwright
          url=os.environ['SHARE_URL']
          filename=os.environ['SOURCE_FILE']
          out=pathlib.Path('incoming') / filename
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(accept_downloads=True)
              page.goto(url, wait_until='domcontentloaded', timeout=120000)
              page.wait_for_timeout(5000)
              for label in ['Accept','Aceitar','同意する','OK']:
                  try:
                      loc=page.get_by_text(label, exact=True)
                      if loc.count() and loc.first.is_visible(): loc.first.click(timeout=1500)
                  except Exception:
                      pass
              selectors=['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']
              done=False
              for sel in selectors:
                  try:
                      loc=page.locator(sel).first
                      if not loc.count() or not loc.is_visible(): continue
                      with page.expect_download(timeout=120000) as info: loc.click(timeout=10000)
                      info.value.save_as(str(out)); done=True; break
                  except Exception: continue
              if not done:
                  try:
                      card=page.get_by_text(filename, exact=False).first
                      parent=card.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
                      ctrl=parent.locator('a,button').last
                      with page.expect_download(timeout=120000) as info: ctrl.click(timeout=10000)
                      info.value.save_as(str(out)); done=True
                  except Exception as e:
                      pathlib.Path('incoming/firestorage_debug.html').write_text(page.content(), encoding='utf-8')
                      page.screenshot(path='incoming/firestorage_debug.png', full_page=True)
                      print('Download control failure:', repr(e))
              browser.close()
          if not done or not out.exists(): raise SystemExit('Could not download Star Wars R38 source ZIP')
          PY
          echo "Downloaded: $(stat -c '%s' "incoming/$SOURCE_FILE") bytes"
          echo "${EXPECTED_SHA}  incoming/${SOURCE_FILE}" | sha256sum -c -
          unzip -t "incoming/${SOURCE_FILE}" >/dev/null

      - name: Extract and detect Android project
        id: project
        env:
          SOURCE_FILE: ${{ steps.source.outputs.file }}
        run: |
          set -euo pipefail
          rm -rf work; mkdir work
          unzip -q "incoming/${SOURCE_FILE}" -d work
          GRADLEW="$(find work -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | head -n1)"
          [ -n "$GRADLEW" ] || { echo '::error::gradlew not found'; exit 1; }
          ROOT="$(dirname "$GRADLEW")"
          [ -f "$ROOT/settings.gradle.kts" ] || [ -f "$ROOT/settings.gradle" ] || { echo '::error::settings.gradle not found'; exit 1; }
          chmod +x "$ROOT/gradlew"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected project root: $ROOT"

      - name: Verify R38 identity and required fixes
        env:
          ROOT: ${{ steps.project.outputs.root }}
          EXPECTED_APP_ID: ${{ steps.source.outputs.app_id }}
        run: |
          set -euo pipefail
          grep -Rqs "applicationId = \"${EXPECTED_APP_ID}\"" "$ROOT/app/build.gradle.kts" || { echo '::error::Unexpected applicationId'; exit 1; }
          grep -Rqs 'targetSdk = 36' "$ROOT/app/build.gradle.kts" || { echo '::error::targetSdk 36 not preserved'; exit 1; }
          grep -Rqs 'compileSdk = 36' "$ROOT/app/build.gradle.kts" || { echo '::error::compileSdk 36 not preserved'; exit 1; }
          grep -Rqs 'INICIAR AVENTURA' "$ROOT/app/src/main/assets/vtt/r46/final-runtime.js" || { echo '::error::R38 adventure gate missing'; exit 1; }
          grep -Rqs 'GERAR ILUSTRAÇÃO' "$ROOT/app/src/main/assets/vtt/r46/final-runtime.js" || { echo '::error::R38 scene illustration action missing'; exit 1; }
          grep -Rqs 'GERAR FICHA ALEATÓRIA' "$ROOT/app/src/main/assets/vtt/r46/final-runtime.js" || { echo '::error::R38 random character action missing'; exit 1; }
          test -f "$ROOT/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" || { echo '::error::R38 launcher icon missing'; exit 1; }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-${{ steps.source.outputs.compile_sdk }}'

      - name: Run R38 source tests
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          node --test tests/r38-mobile-ux-fixes.test.mjs tests/gemini-host-r25.test.mjs tests/native-bridge-contract.test.mjs tests/android-json-file-chooser-contract-r16.test.mjs tests/random-character-r24.test.mjs tests/library-ui.test.mjs tests/r46-bridge-contract.test.mjs
          node tools/java-syntax-gate.mjs

      - name: Compile Star Wars R38 debug APK
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Validate APK
        id: apk
        env:
          ROOT: ${{ steps.project.outputs.root }}
          EXPECTED_APP_ID: ${{ steps.source.outputs.app_id }}
        run: |
          set -euo pipefail
          mkdir -p APK_SAIDA
          APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | sort | head -n1)"
          [ -f "$APK" ] || { echo '::error::APK not found'; exit 1; }
          FINAL='APK_SAIDA/STAR_WARS_EDGE_OF_THE_GALAXY_R38_DEBUG.apk'
          cp "$APK" "$FINAL"
          unzip -t "$FINAL" >/dev/null
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS/aapt"
          "$AAPT" dump badging "$FINAL" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' | tee APK_SAIDA/STAR_WARS_EDGE_OF_THE_GALAXY_R38_DEBUG.info.txt
          grep -q "package: name='${EXPECTED_APP_ID}'" APK_SAIDA/STAR_WARS_EDGE_OF_THE_GALAXY_R38_DEBUG.info.txt || { echo '::error::package id mismatch'; exit 1; }
          grep -q "targetSdkVersion:'36'" APK_SAIDA/STAR_WARS_EDGE_OF_THE_GALAXY_R38_DEBUG.info.txt || { echo '::error::targetSdk mismatch'; exit 1; }
          sha256sum "$FINAL" | tee APK_SAIDA/STAR_WARS_EDGE_OF_THE_GALAXY_R38_DEBUG.sha256
          stat -c 'size_bytes=%s' "$FINAL" | tee -a APK_SAIDA/STAR_WARS_EDGE_OF_THE_GALAXY_R38_DEBUG.info.txt
          echo "path=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Publish R38 APK to tmpfiles.org
        id: tmpfiles
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl --fail --silent --show-error -F 'file=@APK_SAIDA/STAR_WARS_EDGE_OF_THE_GALAXY_R38_DEBUG.apk' https://tmpfiles.org/api/v1/upload)"
          echo "$JSON" | tee APK_SAIDA/tmpfiles-response.json
          URL="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["data"]["url"])' <<< "$JSON")"
          DIRECT="${URL/https:\/\/tmpfiles.org\//https:\/\/tmpfiles.org\/dl\/}"
          echo "page_url=$URL" >> "$GITHUB_OUTPUT"
          echo "direct_url=$DIRECT" >> "$GITHUB_OUTPUT"
          echo "TMPFILES_PAGE=$URL"
          echo "TMPFILES_DIRECT=$DIRECT"

      - name: Upload R38 APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: STAR-WARS-EDGE-OF-THE-GALAXY-R38-APK
          path: APK_SAIDA/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo '## Star Wars Edge of the Galaxy R38'
            echo '- R38 source SHA verified.'
            echo '- Focused R38 source tests executed before Android build.'
            echo '- Gradle task: `:app:assembleDebug`.'
            echo '- applicationId: `com.braseiro.starwarsedge`.'
            echo '- targetSdk: `36`.'
            if [ -f APK_SAIDA/STAR_WARS_EDGE_OF_THE_GALAXY_R38_DEBUG.sha256 ]; then cat APK_SAIDA/STAR_WARS_EDGE_OF_THE_GALAXY_R38_DEBUG.sha256; fi
            if [ -f APK_SAIDA/tmpfiles-response.json ]; then
              echo '- tmpfiles upload: success.'
              echo "- page: ${{ steps.tmpfiles.outputs.page_url }}"
              echo "- direct: ${{ steps.tmpfiles.outputs.direct_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
