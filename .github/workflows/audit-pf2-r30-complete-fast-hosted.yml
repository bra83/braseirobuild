name: PF2 R30 Complete Fast Audit Hosted

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-pf2-r30-complete-fast-hosted.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  AUDIO_SHA: '030b807acebbc05471b67d0b61228dfc221f814637247593bebb20e166de141f'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact R30 working source
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIO_SHARE: 'bXE49-WofMfp'
          AUDIO_FILE: '01a0d617a20d75e5b561194b0c7fe976'
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'pf2-r30-audit-hosted'
          $work=Join-Path $root 'work'
          $audio=Join-Path $root 'audio'
          New-Item -ItemType Directory -Path $work,$audio -Force | Out-Null
          $srcZip=Join-Path $root 'r29.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" -o $srcZip "https://api.github.com/repos/bra83/braseirobuild/releases/assets/585242045"
          if($LASTEXITCODE -ne 0){throw 'R29 source download failed'}
          tar.exe -xf $srcZip -C $work
          if($LASTEXITCODE -ne 0){throw 'R29 extract failed'}

          $api='https://api.firestorage.ai/dev/file'
          $d=Invoke-RestMethod -Method Post -Uri "$api/shares/$env:AUDIO_SHARE/files/$env:AUDIO_FILE/download"
          $audioZip=Join-Path $root 'audio.zip'
          Invoke-WebRequest -Uri $d.downloadUrl -OutFile $audioZip
          if((Get-FileHash $audioZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:AUDIO_SHA){throw 'Audio bundle SHA mismatch'}
          tar.exe -xf $audioZip -C $audio
          python (Join-Path $audio 'patch.py') $work
          if($LASTEXITCODE -ne 0){throw 'R30 Kokoro patch failed'}
          "WORK_ROOT=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Existing mechanical suite
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -q pytest
          $vp=Get-Content 'version.properties' -Raw
          $compat=$vp -replace 'VERSION_NAME=9\.0\.30','VERSION_NAME=9.0.29' -replace 'VERSION_CODE=90030','VERSION_CODE=90029'
          Set-Content 'version.properties' $compat -Encoding ascii
          try {
            python -m pytest tests_pf2 -q 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\PF2_R30_AUDIT_TESTS_HOSTED.log"
            if($LASTEXITCODE -ne 0){throw 'Existing PF2 suite failed'}
          } finally {
            Set-Content 'version.properties' $vp -Encoding ascii
          }

      - name: Generate audit report
        shell: powershell
        working-directory: ${{ env.WORK_ROOT }}
        run: |
          $py=@'
          from pathlib import Path
          import re, os, collections
          root=Path(os.environ["WORK_ROOT"])
          out=Path(os.environ["RUNNER_TEMP"])/"PF2_R30_COMPLETE_AUDIT_REPORT_HOSTED.txt"
          exts={".ts",".tsx",".js",".jsx",".kt",".java",".py",".json",".html",".xml"}
          skip={"node_modules","build","dist",".gradle",".git"}
          files=[]
          for p in root.rglob("*"):
              if p.is_file() and p.suffix.lower() in exts and p.stat().st_size<3_000_000 and not any(x in skip for x in p.parts):
                  files.append(p)
          def read(p):
              try:return p.read_text(encoding="utf-8",errors="ignore")
              except:return ""
          alltxt={p:read(p) for p in files}
          lines=["PF2 R30 COMPLETE FAST AUDIT HOSTED",f"FILES_SCANNED={len(files)}"]

          pats={
            "TODO_STUB":r"TODO|FIXME|NotImplemented|not implemented|throw new Error\([^)]*(?:TODO|implement)",
            "HP_DYING":r"dying|wounded|doomed|temporary.?hp|temp.?hp|massive damage|nonlethal",
            "CONDITIONS":r"frightened|clumsy|enfeebled|drained|stupefied|slowed|stunned|quickened|persistent damage|persistentDamage|off-guard|flat-footed",
            "DAMAGE_TYPES":r"resistance|weakness|immunity|damageType|damage type",
            "TRAVEL":r"travel|exploration|hustle|difficult terrain|greater difficult|movement speed|Speed",
            "REST":r"rest|daily preparation|Treat Wounds|Refocus|fatigued|fatigue",
            "PROGRESSION":r"\bxp\b|experience|level.?up|levelUp|feat|proficiency",
            "INVENTORY":r"bulk|encumbered|invested|ammo|ammunition|charges|stowed|worn|held",
            "KINGMAKER":r"kingdom|event phase|warfare|army|armies|rout|routed|kingmaker",
            "PERSISTENCE":r"localStorage|IndexedDB|indexedDB|SharedPreferences|save|load|persist|backup|restore",
          }
          for label,pat in pats.items():
              rx=re.compile(pat,re.I)
              hits=[]
              for p,t in alltxt.items():
                  for m in rx.finditer(t):
                      ln=t.count("\n",0,m.start())+1
                      hits.append((str(p.relative_to(root)),ln,t[m.start():m.start()+220].splitlines()[0]))
                      if len(hits)>=240:break
                  if len(hits)>=240:break
              lines.append(f"\n=== {label} ({len(hits)}) ===")
              for h in hits:lines.append(f"{h[0]}:{h[1]}: {h[2]}")

          emit=collections.Counter(); handle=collections.Counter()
          er=re.compile(r"type\s*:\s*['\"]([a-zA-Z0-9_\-]+)['\"]")
          cr=re.compile(r"case\s+['\"]([a-zA-Z0-9_\-]+)['\"]")
          for p,t in alltxt.items():
              for m in er.finditer(t):emit[m.group(1)]+=1
              for m in cr.finditer(t):handle[m.group(1)]+=1
          lines.append("\n=== COMMAND_MATRIX ===")
          for k in sorted(set(emit)|set(handle)):
              lines.append(f"{k}\temit={emit[k]}\thandle={handle[k]}\tstatus={'OK' if handle[k] else 'NO_HANDLER'}")

          focus=["applyDamage","hp_delta","hp_set","recovery","persistentDamage","frightened","slowed","stunned","quickened","hustle","rest","daily preparation","Treat Wounds","Refocus","bulk","encumbered","levelUp","experience","event phase","warfare","army","saveGame","loadGame"]
          lines.append("\n=== FOCUSED_CONTEXT ===")
          for needle in focus:
              rx=re.compile(re.escape(needle),re.I); count=0
              for p,t in alltxt.items():
                  for m in rx.finditer(t):
                      ls=t.splitlines(); ln=t.count("\n",0,m.start()); a=max(0,ln-10); b=min(len(ls),ln+24)
                      lines.append(f"\n--- {needle} @ {p.relative_to(root)}:{ln+1} ---")
                      for i in range(a,b):lines.append(f"{i+1:5}: {ls[i]}")
                      count+=1
                      if count>=14:break
                  if count>=14:break

          tests=[]
          for p,t in alltxt.items():
              if "tests_pf2" not in str(p):continue
              for m in re.finditer(r"def\s+(test_[A-Za-z0-9_]+)",t):tests.append((str(p.relative_to(root)),m.group(1)))
          lines.append("\n=== TEST_INDEX ===")
          for p,n in tests:lines.append(f"{p}\t{n}")
          out.write_text("\n".join(lines),encoding="utf-8")
          print(out)
          '@
          $script=Join-Path $env:RUNNER_TEMP 'pf2_audit_hosted.py'
          [System.IO.File]::WriteAllText($script,$py,(New-Object System.Text.UTF8Encoding($false)))
          python $script

      - name: Commit report
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\audit" -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\PF2_R30_COMPLETE_AUDIT_REPORT_HOSTED.txt" "$env:GITHUB_WORKSPACE\audit\PF2_R30_COMPLETE_AUDIT_REPORT_HOSTED.txt" -Force
          Copy-Item "$env:RUNNER_TEMP\PF2_R30_AUDIT_TESTS_HOSTED.log" "$env:GITHUB_WORKSPACE\audit\PF2_R30_AUDIT_TESTS_HOSTED.log" -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/PF2_R30_COMPLETE_AUDIT_REPORT_HOSTED.txt audit/PF2_R30_AUDIT_TESTS_HOSTED.log
          git commit -m 'audit: PF2 R30 complete fast hosted inventory'
          git push origin HEAD:main
