name: Braseiro DnD 6.6.2 RUN103 APK FIX1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dnd-6.6.2-run103-fix1.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SHARE_00: 'https://firestorage.ai/ja/f/qe47r3Xkf4KX'
  SHARE_01: 'https://firestorage.ai/ja/f/_8f3hylcei_H'
  SHARE_02: 'https://firestorage.ai/ja/f/FCyXOcjcnGTJ'
  SHARE_03: 'https://firestorage.ai/ja/f/0s-YBpoGQYUj'
  SHARE_04: 'https://firestorage.ai/ja/f/vmO1EweC_whK'
  SOURCE_SHA256: '91ae5ea70b0e309b6c381b77fb63497e43fecd6eda2dd54974f49b2be04a06d5'
  TAG: 'DND-6.6.2-RUN103-FIX1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download exact RUN103 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming /tmp/dnd-download
          cd /tmp/dnd-download
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const urls=[process.env.SHARE_00,process.env.SHARE_01,process.env.SHARE_02,process.env.SHARE_03,process.env.SHARE_04];
          const names=['dnd103.part.00','dnd103.part.01','dnd103.part.02','dnd103.part.03','dnd103.part.04'];
          const browser=await chromium.launch({headless:true});
          for(let j=0;j<urls.length;j++){
            const ctx=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
            const page=await ctx.newPage();
            await page.goto(urls[j],{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2000);
            const out=process.env.GITHUB_WORKSPACE+'/incoming/'+names[j];
            let ok=false;
            for(const sel of ['text=/一括ダウンロード/i','text=/ダウンロード/i','text=/Download/i','button','a']){
              const loc=page.locator(sel), n=Math.min(await loc.count(),60);
              for(let i=0;i<n;i++){
                const el=loc.nth(i); let text=''; try{text=(await el.innerText({timeout:800})).trim()}catch{}
                if((sel==='button'||sel==='a')&&!/download|ダウンロード|一括|保存|ZIP|ファイル/i.test(text)) continue;
                try{const p=page.waitForEvent('download',{timeout:10000}); await el.click({timeout:5000}); const d=await p; await d.saveAs(out); ok=true; break}catch{}
              }
              if(ok) break;
            }
            await ctx.close();
            if(!ok || !fs.existsSync(out)) throw new Error('download failed '+j);
          }
          await browser.close();
          NODE
          node download.mjs
          cd "$GITHUB_WORKSPACE"
          cat incoming/dnd103.part.* > incoming/BRASEIRO_DND_6.6.2_RUN103_DND5E_ANDROID_STUDIO.zip
          echo "$SOURCE_SHA256  incoming/BRASEIRO_DND_6.6.2_RUN103_DND5E_ANDROID_STUDIO.zip" | sha256sum -c -
          unzip -t incoming/BRASEIRO_DND_6.6.2_RUN103_DND5E_ANDROID_STUDIO.zip >/dev/null

      - name: Extract and apply one-line structural fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          unzip -q incoming/BRASEIRO_DND_6.6.2_RUN103_DND5E_ANDROID_STUDIO.zip -d work
          MAIN="$(find work -type f -path '*/android/app/src/main/java/com/braseiro/dnd5e/MainActivity.java' | head -n1)"
          test -f "$MAIN"
          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          needle='String storyTrace=turn.optString("resolution_excerpt","");if(storyTrace.length()>0)parent.addView(text("NA HISTÓRIA: "+storyTrace,compact?10:11,Color.WHITE,false));}}\n    }'
          repl='String storyTrace=turn.optString("resolution_excerpt","");if(storyTrace.length()>0)parent.addView(text("NA HISTÓRIA: "+storyTrace,compact?10:11,Color.WHITE,false));}\n    }'
          if s.count(needle) != 1:
              raise SystemExit(f'expected exactly one malformed method tail, found {s.count(needle)}')
          s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          state='code'; depth=0; line=1; i=0; bad=[]
          while i < len(s):
              c=s[i]; n=s[i+1] if i+1<len(s) else ''
              if state=='code':
                  if c=='"': state='str'
                  elif c=="'": state='char'
                  elif c=='/' and n=='/': state='line'; i+=1
                  elif c=='/' and n=='*': state='block'; i+=1
                  elif c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth<0: bad.append((line,depth))
              elif state=='str':
                  if c=='\\': i+=1
                  elif c=='"': state='code'
              elif state=='char':
                  if c=='\\': i+=1
                  elif c=="'": state='code'
              elif state=='line':
                  if c=='\n': state='code'
              elif state=='block':
                  if c=='*' and n=='/': state='code'; i+=1
              if c=='\n': line+=1
              i+=1
          if depth != 0 or bad:
              raise SystemExit(f'brace validation failed depth={depth} bad={bad[:3]}')
          print('PATCH_OK MainActivity.java brace_depth=0')
          PY
          printf '%s\n' 'RUN103 FIX1: removed one extra closing brace at end of addMasterConversationHistory; no gameplay/content/map changes.' > out/BUILD_FIX.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble and validate APK
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find work -type f -path '*/android/gradlew' | head -n1)"
          test -n "$WRAPPER"
          ROOT="$(dirname "$WRAPPER")"
          chmod +x "$ROOT/gradlew"
          cd "$ROOT"
          ./gradlew clean :app:assembleDebug --stacktrace --console=plain --no-daemon
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/BRASEIRO_DND_6.6.2_RUN103_FIX1_DEBUG.apk"
          sha256sum "$GITHUB_WORKSPACE/out/BRASEIRO_DND_6.6.2_RUN103_FIX1_DEBUG.apk" > "$GITHUB_WORKSPACE/out/BRASEIRO_DND_6.6.2_RUN103_FIX1_DEBUG.apk.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/BRASEIRO_DND_6.6.2_RUN103_FIX1_DEBUG.apk" | tee "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.dnd5e'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/out/BRASEIRO_DND_6.6.2_RUN103_FIX1_DEBUG.apk" >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-DND-6.6.2-RUN103-FIX1-APK
          path: |
            out/BRASEIRO_DND_6.6.2_RUN103_FIX1_DEBUG.apk
            out/BRASEIRO_DND_6.6.2_RUN103_FIX1_DEBUG.apk.sha256
            out/APK_BADGING.txt
            out/BUILD_FIX.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title 'Braseiro DnD 6.6.2 RUN103 FIX1' --notes 'RUN103 com package com.braseiro.dnd5e. Única correção de build: remoção de uma chave extra em MainActivity.addMasterConversationHistory.'
          gh release upload "$TAG" \
            out/BRASEIRO_DND_6.6.2_RUN103_FIX1_DEBUG.apk \
            out/BRASEIRO_DND_6.6.2_RUN103_FIX1_DEBUG.apk.sha256 \
            out/APK_BADGING.txt \
            out/BUILD_FIX.txt --clobber
