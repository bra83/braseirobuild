name: Audit Star Wars R38 scene controls A/B
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-star-wars-r38-scene-controls-ab.yml"]
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: src
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'));print('url='+d['source_share_url']);print('sha='+d['sha256']);print('file='+d['file'])
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prepare SHA-pinned source and scenes
        env:
          U: ${{ steps.src.outputs.url }}
          F: ${{ steps.src.outputs.file }}
          S: ${{ steps.src.outputs.sha }}
          SU: https://firestorage.ai/ja/f/PbM3XvdzNMAk
          SF: scene-assets-v1-tiny.tar.gz
          SS: 2ca16b2cd0d3f489fe10f1df718be1243febeef38fb88a52bd50502528f60711
        run: |
          set -euo pipefail;rm -rf incoming work-a work-b;mkdir -p incoming work-a work-b
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          def dl(u,n,o):
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);q=b.new_page(accept_downloads=True);q.goto(u,wait_until='domcontentloaded',timeout=120000);q.wait_for_timeout(2500);done=False
              for s in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
                try:
                  x=q.locator(s).first
                  if not x.count() or not x.is_visible():continue
                  with q.expect_download(timeout=120000) as i:x.click(timeout=10000)
                  i.value.save_as(str(o));done=True;break
                except:pass
              if not done:
                x=q.get_by_text(n,exact=False).first
                with q.expect_download(timeout=120000) as i:x.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
                i.value.save_as(str(o));done=True
              b.close()
            if not done:raise SystemExit('download failed')
          dl(os.environ['U'],os.environ['F'],pathlib.Path('incoming')/os.environ['F']);dl(os.environ['SU'],os.environ['SF'],pathlib.Path('incoming')/os.environ['SF'])
          PY
          echo "${S}  incoming/${F}"|sha256sum -c -;echo "${SS}  incoming/${SF}"|sha256sum -c -
          unzip -q "incoming/${F}" -d work-a;cp -a work-a/. work-b/
          GA="$(find work-a -type f -name gradlew -not -path '*/build/*'|head -1)";GB="$(find work-b -type f -name gradlew -not -path '*/build/*'|head -1)";RA="$(dirname "$GA")";RB="$(dirname "$GB")";echo "$RA">/tmp/a;echo "$RB">/tmp/b
          base64 -w0 "incoming/${SF}" > star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          python3 star-wars/r38/patches/block01_repair_safe.py "$RA"
          python3 star-wars/r38/patches/block01_repair_safe.py "$RB"
          python3 star-wars/r38/patches/block02_scene_controls.py "$RB"
      - name: Compare live controls
        shell: bash
        run: |
          export A="$(cat /tmp/a)" B="$(cat /tmp/b)"
          python3 - <<'PY'
          import os,pathlib,threading,http.server,socketserver,json
          from playwright.sync_api import sync_playwright
          def inspect(root):
            vtt=pathlib.Path(root)/'app/src/main/assets/vtt';old=os.getcwd();os.chdir(vtt)
            class H(http.server.SimpleHTTPRequestHandler):
              def log_message(self,*a):pass
            s=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=s.serve_forever,daemon=True).start();port=s.server_address[1]
            out={}
            try:
              with sync_playwright() as p:
                b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915})
                pg.add_init_script('''const h={get:(t,p)=>{if(p==='then')return undefined;return(...a)=>JSON.stringify({ok:true,items:[],data:[],state:{}})}};for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroGemini','BraseiroImages','BraseiroFiles','BraseiroTts'])window[n]=new Proxy({},h);''')
                pg.goto(f'http://127.0.0.1:{port}/r46-shell.html',wait_until='domcontentloaded');pg.wait_for_timeout(1400);pg.locator('#sandbox-start-button').click();pg.wait_for_timeout(900)
                out['fallback']=pg.locator('.final-scene-library-image:visible').count()
                for key,sel in [('gemini','button[data-action="gemini"]'),('import','button[data-action="import"]')]:
                  q=pg.locator(sel);item={'count':q.count()}
                  if q.count():
                    item['visible']=q.first.is_visible();item['box']=q.first.bounding_box();item['text']=q.first.inner_text();item['computed']=q.first.evaluate('''e=>{const s=getComputedStyle(e),p=getComputedStyle(e.parentElement),w=getComputedStyle(e.closest('.final-scene-gemini'));return {display:s.display,visibility:s.visibility,opacity:s.opacity,pointerEvents:s.pointerEvents,parentDisplay:p.display,wrapDisplay:w.display,wrapPosition:w.position,wrapBottom:w.bottom,wrapZ:w.zIndex}}''')
                  out[key]=item
                b.close()
            finally:s.shutdown();s.server_close();os.chdir(old)
            return out
          result={'block01':inspect(os.environ['A']),'block02':inspect(os.environ['B'])}
          dest=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit/SCENE_CONTROLS_AB.json';dest.write_text(json.dumps(result,ensure_ascii=False,indent=2))
          md=['# R38 SCENE CONTROLS A/B','','## Block01 only',f"- `{result['block01']}`",'','## Block01 + Block02',f"- `{result['block02']}`"]
          (dest.parent/'SCENE_CONTROLS_AB.md').write_text('\n'.join(md)+'\n')
          PY
      - name: Commit evidence
        run: |
          git checkout -- star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          git config user.name braseiro-audit-bot;git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/SCENE_CONTROLS_AB.*;git commit -m 'audit(star-wars): compare scene controls before and after Block02' || true;git push
