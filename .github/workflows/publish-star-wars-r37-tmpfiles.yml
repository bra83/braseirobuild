name: Publish Star Wars R37 APK to tmpfiles.org

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-star-wars-r37-tmpfiles.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read source manifest
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r37/SOURCE.json', encoding='utf-8'))
          print('url='+d['source_share_url'])
          print('sha='+d['sha256'])
          print('file='+d['file'])
          print('app_id='+d['application_id'])
          print('compile_sdk='+str(d['compile_sdk']))
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium downloader
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Download exact source ZIP
        env:
          SHARE_URL: ${{ steps.source.outputs.url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          python3 - <<'PY'
          import os, pathlib
          from playwright.sync_api import sync_playwright
          url=os.environ['SHARE_URL']; filename=os.environ['SOURCE_FILE']
          out=pathlib.Path('incoming') / filename
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(accept_downloads=True)
              page.goto(url, wait_until='domcontentloaded', timeout=120000)
              page.wait_for_timeout(5000)
              selectors=['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']
              done=False
              for sel in selectors:
                  try:
                      loc=page.locator(sel).first
                      if not loc.count() or not loc.is_visible(): continue
                      with page.expect_download(timeout=120000) as info: loc.click(timeout=10000)
                      info.value.save_as(str(out)); done=True; break
                  except Exception:
                      pass
              if not done:
                  card=page.get_by_text(filename, exact=False).first
                  parent=card.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
                  ctrl=parent.locator('a,button').last
                  with page.expect_download(timeout=120000) as info: ctrl.click(timeout=10000)
                  info.value.save_as(str(out)); done=True
              browser.close()
          if not done or not out.exists(): raise SystemExit('download failed')
          PY
          echo "${EXPECTED_SHA}  incoming/${SOURCE_FILE}" | sha256sum -c -
          unzip -t "incoming/${SOURCE_FILE}" >/dev/null

      - name: Extract project
        id: project
        env:
          SOURCE_FILE: ${{ steps.source.outputs.file }}
        run: |
          set -euo pipefail
          mkdir work
          unzip -q "incoming/${SOURCE_FILE}" -d work
          GRADLEW="$(find work -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | head -n1)"
          ROOT="$(dirname "$GRADLEW")"
          chmod +x "$ROOT/gradlew"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-${{ steps.source.outputs.compile_sdk }}'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.root }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Validate and stage APK
        id: apk
        env:
          ROOT: ${{ steps.project.outputs.root }}
          EXPECTED_APP_ID: ${{ steps.source.outputs.app_id }}
        run: |
          set -euo pipefail
          APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | sort | head -n1)"
          cp "$APK" STAR_WARS_EDGE_OF_THE_GALAXY_R37_DEBUG.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS/aapt"
          "$AAPT" dump badging STAR_WARS_EDGE_OF_THE_GALAXY_R37_DEBUG.apk | grep -q "package: name='${EXPECTED_APP_ID}'"
          "$AAPT" dump badging STAR_WARS_EDGE_OF_THE_GALAXY_R37_DEBUG.apk | grep -q "targetSdkVersion:'36'"
          sha256sum STAR_WARS_EDGE_OF_THE_GALAXY_R37_DEBUG.apk | tee APK_SHA256.txt
          stat -c 'size_bytes=%s' STAR_WARS_EDGE_OF_THE_GALAXY_R37_DEBUG.apk

      - name: Upload APK to tmpfiles.org
        id: tmpfiles
        run: |
          set -euo pipefail
          RESP="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 -F 'file=@STAR_WARS_EDGE_OF_THE_GALAXY_R37_DEBUG.apk' https://tmpfiles.org/api/v1/upload)"
          echo "$RESP"
          URL="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["url"])' <<< "$RESP")"
          DIRECT="${URL/https:\/\/tmpfiles.org\//https:\/\/tmpfiles.org\/dl\/}"
          echo "TMPFILES_PAGE_URL=$URL"
          echo "TMPFILES_DIRECT_URL=$DIRECT"
          echo "page_url=$URL" >> "$GITHUB_OUTPUT"
          echo "direct_url=$DIRECT" >> "$GITHUB_OUTPUT"
          {
            echo '## tmpfiles.org'
            echo "- Page: $URL"
            echo "- Direct: $DIRECT"
            echo '- SHA-256:'
            cat APK_SHA256.txt
          } >> "$GITHUB_STEP_SUMMARY"
