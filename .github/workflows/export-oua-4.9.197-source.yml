name: Export OUA 4.9.197 source — BRELGA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-oua-4.9.197-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact OUA 4.9.197 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){ throw "Expected BRELGA; got $env:RUNNER_NAME" }
          $work=Join-Path $env:RUNNER_TEMP 'oua-49197-export'
          $incoming=Join-Path $work 'incoming'
          $extract=Join-Path $work 'extract'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $incoming,$extract -Force | Out-Null

          $outer=Join-Path $incoming 'OUA_4.9.196_BRELGA_SOURCE.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $outer "https://drive.usercontent.google.com/download?id=1yIvAylIHStuCnUdIMxxpaAMxlOluStDC&export=download&confirm=t"
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $outer)){ throw 'Could not download canonical 4.9.196 source' }
          & tar.exe -xf $outer -C $extract
          if($LASTEXITCODE -ne 0){ throw 'Could not extract source' }

          $pkg=Get-ChildItem $extract -Recurse -File -Filter package.json |
            Where-Object{Test-Path (Join-Path $_.Directory.FullName 'android')} |
            Sort-Object{$_.FullName.Length} |
            Select-Object -First 1
          if(-not $pkg){ throw 'Android Studio root not found' }
          $root=$pkg.Directory.FullName

          $payload=Join-Path $env:GITHUB_WORKSPACE 'ci\oua-4.9.197\patch.gz.b64'
          if(-not (Test-Path $payload)){ throw '4.9.197 patch payload missing' }
          $patch=Join-Path $work 'oua-49197.patch'
          $raw=[Convert]::FromBase64String((Get-Content $payload -Raw).Trim())
          $input=New-Object IO.MemoryStream(,$raw)
          $gzip=New-Object IO.Compression.GZipStream($input,[IO.Compression.CompressionMode]::Decompress)
          $output=[IO.File]::Create($patch)
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()

          Push-Location $root
          try {
            & git.exe apply --ignore-space-change --ignore-whitespace $patch
            if($LASTEXITCODE -ne 0){ throw 'Failed to apply 4.9.197 delta' }
          } finally { Pop-Location }

          $pkgJson=Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if($pkgJson.version -ne '4.9.197'){ throw "Expected package 4.9.197, got $($pkgJson.version)" }

          $zip=Join-Path $env:RUNNER_TEMP 'OUA_4.9.197_RECONSTRUCTED_SOURCE.zip'
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Fastest
          "EXPORT_ZIP=$zip"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: OUA_4.9.197_RECONSTRUCTED_SOURCE
          path: ${{ env.EXPORT_ZIP }}
          if-no-files-found: error
          retention-days: 1
