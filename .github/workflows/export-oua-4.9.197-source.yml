# rerun-2
name: Export OUA 4.9.197 source — BRELGA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-oua-4.9.197-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact OUA 4.9.197 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){ throw "Expected BRELGA; got $env:RUNNER_NAME" }
          $work=Join-Path $env:RUNNER_TEMP 'oua-49197-export'
          $incoming=Join-Path $work 'incoming'
          $extract=Join-Path $work 'extract'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $incoming,$extract -Force | Out-Null

          $outer=Join-Path $incoming 'OUA_4.9.196_BRELGA_SOURCE.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $outer "https://drive.usercontent.google.com/download?id=1yIvAylIHStuCnUdIMxxpaAMxlOluStDC&export=download&confirm=t"
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $outer)){ throw 'Could not download canonical 4.9.196 source' }
          & tar.exe -xf $outer -C $extract
          if($LASTEXITCODE -ne 0){ throw 'Could not extract source' }

          $pkg=Get-ChildItem $extract -Recurse -File -Filter package.json |
            Where-Object{Test-Path (Join-Path $_.Directory.FullName 'android')} |
            Sort-Object{$_.FullName.Length} |
            Select-Object -First 1
          if(-not $pkg){ throw 'Android Studio root not found' }
          $root=$pkg.Directory.FullName

          $patchDir=Join-Path $env:GITHUB_WORKSPACE 'ci\oua-4.9.197'
          $encoded=''
          foreach($name in @('patch.part0','patch.part1','patch.part2','patch.part3')){
            $part=Join-Path $patchDir $name
            if(-not (Test-Path $part)){ throw "Missing 4.9.197 patch chunk: $name" }
            $encoded += (Get-Content $part -Raw).Trim()
          }
          $patch=Join-Path $work 'oua-49197.patch'
          $raw=[Convert]::FromBase64String($encoded)
          $input=New-Object IO.MemoryStream(,$raw)
          $gzip=New-Object IO.Compression.GZipStream($input,[IO.Compression.CompressionMode]::Decompress)
          $output=[IO.File]::Create($patch)
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()

          Push-Location $root
          try {
            & git.exe apply --ignore-space-change --ignore-whitespace $patch
            if($LASTEXITCODE -ne 0){ throw 'Failed to apply 4.9.197 delta' }
          } finally { Pop-Location }

          $pkgJson=Get-Content (Join-Path $root 'package.json') -Raw | ConvertFrom-Json
          if($pkgJson.version -ne '4.9.197'){ throw "Expected package 4.9.197, got $($pkgJson.version)" }

          $snapshot=Join-Path $env:GITHUB_WORKSPACE 'ci\\oua-4.9.197\\snapshot'
          Remove-Item $snapshot -Recurse -Force -ErrorAction SilentlyContinue
          $files=@(
            'package.json',
            'lib\\version.ts',
            'lib\\apiKey.ts',
            'lib\\geminiModels.ts',
            'lib\\geminiTransport.ts',
            'lib\\rules\\combat.ts',
            'lib\\autonomy\\localFallbackDirector.ts',
            'services\\geminiService.ts',
            'components\\SettingsView.tsx',
            'components\\CombatTacticalView.tsx',
            'App.tsx',
            'android\\app\\build.gradle.kts',
            'android\\app\\src\\main\\java\\com\\braseiro\\oumanel\\MainActivity.kt'
          )
          foreach($rel in $files){
            $src=Join-Path $root $rel
            if(-not (Test-Path $src)){ throw "Snapshot source missing: $rel" }
            $dst=Join-Path $snapshot $rel
            New-Item -ItemType Directory -Path (Split-Path $dst -Parent) -Force | Out-Null
            Copy-Item $src $dst -Force
          }

      - name: Publish reconstructed 4.9.197 code snapshot
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name "braseiro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci/oua-4.9.197/snapshot
          if((git status --porcelain).Length -gt 0){
            git commit -m "OUA 4.9.197 publish reconstructed code snapshot [skip ci]"
            git push origin HEAD:main
          }
