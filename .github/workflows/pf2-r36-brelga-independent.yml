name: PF2 Kingmaker R36 BRELGA Independent Build And Book Gates
on:
  push:
    branches: [pf2-kingmaker-r36-official-rule-fixes-20261011]
    paths:
      - '.github/workflows/pf2-r36-brelga-independent.yml'
      - 'ci/pf2-kingmaker-r36/**'
  workflow_dispatch:
    inputs:
      compile_apk:
        description: 'Compile and publish TEST APK only when this implementation batch is ready'
        type: boolean
        default: false
        required: false
permissions:
  contents: write
concurrency:
  group: pf2-r36-brelga-independent
  cancel-in-progress: true
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 100
    env:
      # UTF-8 console logs, but default Windows subprocess decoding (cp1252)
      # for javac/JVM tools: PYTHONUTF8=1 caused four UnicodeDecodeError
      # regression failures on BRELGA run 38340947846.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '0'
      JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/pf2-kingmaker-r36
            ci/pf2-kingmaker-certification
            .github/workflows
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 73 structures, build UI and alternate-cost Python transformations
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install -q pytest
          if($LASTEXITCODE -ne 0){throw 'pytest installation failed'}
          python -m pytest -q ci/pf2-kingmaker-r36/test_catalog_expansion.py ci/pf2-kingmaker-r36/test_official_build_ui.py ci/pf2-kingmaker-r36/test_structure_effects_metadata.py
          if($LASTEXITCODE -ne 0){throw 'Catalog/UI synthetic contracts failed'}
          python -m pytest -q ci/pf2-kingmaker-certification/test_chapters_1_11_audit.py
          if($LASTEXITCODE -ne 0){throw 'Canonical 11-chapter auditor self-test failed'}
      - name: Verify canonical R35 source by SHA256 and apply official PDF corrections
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Wrong runner $env:RUNNER_NAME"}
          $dir=Join-Path $env:RUNNER_TEMP ("pf2-r36-book-"+$env:GITHUB_RUN_ID)
          $src=Join-Path $dir 'source'
          New-Item $src -ItemType Directory -Force|Out-Null
          $zip=Join-Path $dir 'r35-source.zip'
          $auth=& git config --local --get http.https://github.com/.extraheader
          if(!$auth){throw 'Missing checkout credential'}
          & curl.exe -L --fail --retry 5 --retry-delay 3 --header $auth --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' -o $zip 'https://api.github.com/repos/bra83/braseirobuild/releases/assets/629875743'
          if($LASTEXITCODE -ne 0){throw 'R35 source fetch failed'}
          if((Get-Item $zip).Length -ne 92975058){throw 'R35 size mismatch'}
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '86d9a6fd26e4139e084c8e4069f49ef53e0cf8654e0f9f5662b92f9183941aa6'){throw "Canonical R35 hash mismatch $sha"}
          & tar.exe -xf $zip -C $src
          if($LASTEXITCODE -ne 0){throw 'R35 source extraction failed'}
          $p=@(Get-ChildItem $src -Recurse -File -Filter version.properties | Where-Object{Test-Path (Join-Path $_.DirectoryName 'gradlew.bat')})
          if($p.Count -ne 1){throw "Found $($p.Count) Gradle roots, expected exactly one"}
          $project=$p[0].DirectoryName
          if(!(Test-Path (Join-Path $project 'tests_pf2'))){throw 'Missing tests'}
          python ci\pf2-kingmaker-r36\patch.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Official rules patch failed'}
          python ci\pf2-kingmaker-r36\patch_claim_hex_prepaid.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Claim Hex prepaid patch failed'}
          python ci\pf2-kingmaker-r36\patch_kingdom_accounting.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Kingdom accounting patch failed'}
          python ci\pf2-kingmaker-r36\patch_claim_hex_ui.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Claim Hex UI patch failed'}
          python ci\pf2-kingmaker-r36\patch_build_structure.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Build Structure patch failed'}
          python ci\pf2-kingmaker-r36\patch_build_structure_repairs.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Build Structure repair patch failed'}
          python ci\pf2-kingmaker-r36\patch_structure_catalog_values.py "$project"
          python ci\pf2-kingmaker-r36\patch_multi_structure.py "$project"
          if($LASTEXITCODE -ne 0){throw "Official multi-skill structure patch failed"}
          python ci\pf2-kingmaker-r36\patch_catalog_expansion.py "$project"
          if($LASTEXITCODE -ne 0){throw "Official 73-structure catalog patch failed"}
          python ci\pf2-kingmaker-r36\patch_official_build_ui.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Official Build Structure UI integration failed'}
          if($LASTEXITCODE -ne 0){throw 'Official structure catalog patch failed'}
          python ci\pf2-kingmaker-r36\patch_chapter11_gate.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Chapter 11 official story gate failed'}
          python ci\pf2-kingmaker-r36\patch_chapter9_canonical_anchors.py "$project"
          if($LASTEXITCODE -ne 0){throw 'R36 chapter narrative patch failed'}
          python ci\pf2-kingmaker-r36\patch_consumption_atomic.py "$project"
          if($LASTEXITCODE -ne 0){throw 'R36 consumption atomic patch failed'}
          python ci\pf2-kingmaker-r36\patch_turn_phase_atomic.py "$project"
          if($LASTEXITCODE -ne 0){throw 'R36 phase atomic patch failed'}
          python ci\pf2-kingmaker-r36\patch_war_atomic.py "$project"
          if($LASTEXITCODE -ne 0){throw 'R36 atomic warfare patch failed'}
          python ci\pf2-kingmaker-r36\patch_semantic_domains.py "$project"
          if($LASTEXITCODE -ne 0){throw 'R36 three-domain semantic patch failed'}
          python ci\pf2-kingmaker-r36\audit_catalog_expansion.py --project "$project" --out r36-catalog-73-brelga.json --require-73
          if($LASTEXITCODE -ne 0){throw 'Canonical 73-structure numerical audit failed'}
          python ci\pf2-kingmaker-certification\audit_structure_catalog.py --project "$project" --out r36-official-structure-delta-brelga.json --require-zero-mismatches
          if($LASTEXITCODE -ne 0){throw 'Official R36 structure catalog mismatches remain'}
          Copy-Item ci\pf2-kingmaker-r36\test_r36_book_fidelity.py (Join-Path $project 'tests_pf2\test_r36_book_fidelity.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_chapter11_production.py (Join-Path $project 'tests_pf2\test_chapter11_production.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_r36_claim_prepaid.py (Join-Path $project 'tests_pf2\test_r36_claim_prepaid.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_build_structure_production.py (Join-Path $project 'tests_pf2\test_build_structure_production.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_build_structure_repairs_production.py (Join-Path $project 'tests_pf2\test_build_structure_repairs_production.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_r36_ui_and_accounting_contract.py (Join-Path $project 'tests_pf2\test_r36_ui_and_accounting_contract.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_official_structure_production.py (Join-Path $project 'tests_pf2\test_official_structure_production.py') -Force
          Copy-Item ci\pf2-kingmaker-certification\kingmaker_official_structures_p544_552.json (Join-Path $project 'tests_pf2\kingmaker_official_structures_p544_552.json') -Force
          "PF2_R36_PROJECT=$project"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "JDK_JAVAC_OPTIONS=--source-path=$project\android\app\src\main\java"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R36_SOURCE_IDENTITY_R35_HASH=$sha"
          Write-Host 'R36_OFFICIAL_RULES_PATCH_APPLIED=true'
      - name: Parse all transformed production Java without building APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $classes=Join-Path $env:RUNNER_TEMP ("pf2-r36-syntax-"+$env:GITHUB_RUN_ID)
          New-Item $classes -ItemType Directory -Force | Out-Null
          javac -encoding UTF-8 -d "$classes" "$env:PF2_R36_PROJECT\tools\JavaSyntaxValidator.java"
          if($LASTEXITCODE -ne 0){throw 'JAVA_SYNTAX_VALIDATOR_COMPILATION_FAILED'}
          java -cp "$classes" JavaSyntaxValidator "$env:PF2_R36_PROJECT\android\app\src\main\java"
          if($LASTEXITCODE -ne 0){throw 'R36_PRODUCTION_JAVA_SYNTAX_FAILED'}
      - name: Execute book semantics in JVM (calculations and state gates)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $classes=Join-Path $env:RUNNER_TEMP ("pf2-r36-book-semantics-"+$env:GITHUB_RUN_ID)
          New-Item $classes -ItemType Directory -Force | Out-Null
          $src=Join-Path $env:PF2_R36_PROJECT 'android\app\src\main\java\com\braseiro\pathfinder2e'
          $sources=@(
            (Join-Path $src 'KingmakerStructureSemantics.java'),
            (Join-Path $src 'KingmakerCampaignGate.java'),
            (Join-Path $src 'KingmakerCompanionSemantics.java'),
            (Join-Path $src 'KingmakerLeadershipSemantics.java'),
            (Join-Path $env:GITHUB_WORKSPACE 'ci\pf2-kingmaker-r36\semantic\R36BookSemanticsHarness.java')
          )
          $sources+=@(Get-ChildItem (Join-Path $env:PF2_R36_PROJECT 'tools\runtime_json\org\json') -Filter '*.java' | Select-Object -ExpandProperty FullName)
          javac -encoding UTF-8 -d "$classes" $sources
          if($LASTEXITCODE -ne 0){throw 'R36_BOOK_SEMANTICS_JVM_COMPILATION_FAILED'}
          java -cp "$classes" com.braseiro.pathfinder2e.R36BookSemanticsHarness
          if($LASTEXITCODE -ne 0){throw 'R36_BOOK_SEMANTICS_STATE_ASSERTION_FAILED'}
      - name: Official-rule focused regression
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Push-Location $env:PF2_R36_PROJECT
          python -m pip install -q pytest
          if($LASTEXITCODE -ne 0){throw 'pytest unavailable'}
          python -m pytest tests_pf2\test_r36_book_fidelity.py tests_pf2\test_r36_claim_prepaid.py tests_pf2\test_build_structure_production.py tests_pf2\test_build_structure_repairs_production.py tests_pf2\test_r36_ui_and_accounting_contract.py tests_pf2\test_official_structure_production.py tests_pf2\test_chapter11_production.py -q
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw "Book rule contract failed: $code"}
          Write-Host 'R36_OFFICIAL_BOOK_CONTRACT_PASS=true'
      - name: Run all shipped Pathfinder and Kingmaker regression tests
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Push-Location $env:PF2_R36_PROJECT
          python -m pytest tests_pf2 -q
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw "Full PF2 regression failed: $code"}
          Write-Host 'R36_ALL_PF2_REGRESSION_PASS=true'
      - name: Audit all 11 official chapters and 40 parts against patched Android source
        shell: powershell
        timeout-minutes: 22
        run: |
          $ErrorActionPreference='Continue'
          $project=$env:PF2_R36_PROJECT
          if(!(Test-Path (Join-Path $project 'android\app\src\main\assets\pathfinder\kingmaker\chapters'))){throw 'R36_REAL_CHAPTER_ASSETS_MISSING'}
          $out=Join-Path $env:GITHUB_WORKSPACE 'r36-audit-evidence'
          New-Item $out -ItemType Directory -Force|Out-Null
          python ci/pf2-kingmaker-certification/audit_chapters_1_11.py --project "$project" --out (Join-Path $out 'KINGMAKER_CHAPTERS_1_11.json') --fail-on-critical
          $chaptersExit=$LASTEXITCODE
          python ci/pf2-kingmaker-certification/official_part_semantic_audit.py --project "$project" --out "$out"
          $partsExit=$LASTEXITCODE
          python ci/pf2-kingmaker-certification/crosswalk_runtime_audit.py --project "$project" --out "$out"
          $rulesExit=$LASTEXITCODE
          $summary=@('# R36: evidence from patched real R35 Android source',
            'These structural checks do not certify encounter/choice/outcome semantics, playthroughs, or Android AppDb.',
            "Chapter audit exit: $chaptersExit; all-40-parts audit exit: $partsExit; runtime crosswalk exit: $rulesExit",
            '')
          foreach($name in @('KINGMAKER_CHAPTERS_1_11_REVIEW.md','OFFICIAL_PART_SEMANTIC_SIGNALS.md','CROSSWALK_REPORT.md')){
            $path=Join-Path $out $name
            if(Test-Path $path){$summary+=Get-Content -LiteralPath $path -Raw -Encoding UTF8}
          }
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY,($summary -join [Environment]::NewLine)+[Environment]::NewLine,[System.Text.Encoding]::UTF8)
          Write-Host "R36_CHAPTERS_11_GATE_EXIT=$chaptersExit"
          Write-Host "R36_40_PARTS_SEMANTIC_INSPECTION_EXIT=$partsExit"
          Write-Host "R36_OFFICIAL_RUNTIME_CROSSWALK_EXIT=$rulesExit"
          if($chaptersExit -ne 0){throw 'R36_CANONICAL_11_CHAPTER_GATE_CRITICAL_FINDINGS'}
          if($partsExit -ne 0){throw 'R36_40_PARTS_SEMANTIC_AUDIT_FAILED'}
          if($rulesExit -ne 0){throw 'R36_BOOK_RUNTIME_CROSSWALK_FAILED'}
          Write-Host 'R36_11_CHAPTERS_STRUCTURAL_AUDIT=PASS; INTEGRAL_SEMANTIC_CERTIFICATION=OPEN'
      - name: Repair UTF-8 BOM in BRELGA Gradle cache init script
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Wrong runner $env:RUNNER_NAME"}
          $init=Join-Path $env:USERPROFILE '.gradle\init.d\braseiro-cache.init.gradle'
          if(!(Test-Path -LiteralPath $init)){Write-Host 'BRELGA_GRADLE_CACHE_INIT_ABSENT=true';exit 0}
          $bytes=[System.IO.File]::ReadAllBytes($init)
          if($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF){
            $clean=New-Object byte[] ($bytes.Length-3)
            [System.Array]::Copy($bytes,3,$clean,0,$clean.Length)
            [System.IO.File]::WriteAllBytes($init,$clean)
            Write-Host 'BRELGA_GRADLE_INIT_UTF8_BOM_REMOVED=true'
          }else{Write-Host 'BRELGA_GRADLE_INIT_ALREADY_NO_BOM=true'}
          $verified=[System.IO.File]::ReadAllBytes($init)
          if($verified.Length -ge 3 -and $verified[0] -eq 0xEF -and $verified[1] -eq 0xBB -and $verified[2] -eq 0xBF){throw 'GRADLE_INIT_BOM_REPAIR_FAILED'}
          Write-Host 'BRELGA_GRADLE_INIT_UTF8_CLEAN=true'
          # The runner's global cache init script also uses an invalid caches() block
          # (Gradle fails on line 3 before it ever loads the Android project).
          # Preserve it outside init.d, where Gradle no longer auto-executes it.
          $script=[System.IO.File]::ReadAllText($init)
          if($script -match '(?m)^\s*caches\s*\(' -or $script -match '(?m)^\s*caches\s*\{'){
            $archive=Join-Path $env:USERPROFILE ('.gradle\braseiro-cache.invalid.'+$env:GITHUB_RUN_ID+'.gradle')
            if(Test-Path -LiteralPath $archive){throw "GRADLE_INIT_ARCHIVE_ALREADY_EXISTS $archive"}
            Move-Item -LiteralPath $init -Destination $archive -ErrorAction Stop
            if(Test-Path -LiteralPath $init){throw 'GRADLE_INIT_QUARANTINE_FAILED'}
            Write-Host "BRELGA_INVALID_GRADLE_INIT_PRESERVED=$archive"
            Write-Host 'BRELGA_INVALID_GRADLE_INIT_DISABLED=true'
          }else{Write-Host 'BRELGA_GRADLE_INIT_NO_UNSUPPORTED_CACHES_CALL=true'}
      - name: Type-check Android Java without packaging an APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'))|Where-Object{$_ -and (Test-Path $_)}
          $sdk=$candidates|Where-Object {Test-Path (Join-Path $_ 'platforms')}|Select-Object -First 1
          if(!$sdk){throw 'Android SDK absent for Java type verification'}
          $env:ANDROID_SDK_ROOT=$sdk
          $env:ANDROID_HOME=$sdk
          $gradleRoot=$env:PF2_R36_PROJECT
          if(!(Test-Path (Join-Path $gradleRoot 'gradlew.bat'))){$gradleRoot=Join-Path $gradleRoot 'android'}
          if(!(Test-Path (Join-Path $gradleRoot 'gradlew.bat'))){throw 'Gradle wrapper absent'}
          Push-Location $gradleRoot
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:compileDebugJavaWithJavac --no-daemon --stacktrace
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw "R36 Android Java type verification failed code=$code"}
          Write-Host 'R36_ANDROID_JAVA_TYPECHECK_PASS=true'
          Write-Host 'Java classes checked; APK assembly and publication remain disabled.'
      - name: Provision Android Emulator and API 30 AVD on BRELGA
        shell: powershell
        timeout-minutes: 48
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'WRONG_RUNNER'}
          $candidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'))|Where-Object{$_ -and (Test-Path $_)}
          $sdk=$candidates|Where-Object{Test-Path (Join-Path $_ 'platform-tools\adb.exe')}|Select-Object -First 1
          if(!$sdk){throw 'ANDROID_SDK_WITH_ADB_NOT_FOUND'}
          $env:ANDROID_SDK_ROOT=$sdk
          $env:ANDROID_HOME=$sdk
          Write-Host "R36_ANDROID_SDK=$sdk"
          $bin=Join-Path $sdk 'emulator\emulator.exe'
          $sdkcmd=@(Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Filter sdkmanager.bat -Recurse -File -ErrorAction SilentlyContinue)
          $avdcmd=@(Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Filter avdmanager.bat -Recurse -File -ErrorAction SilentlyContinue)
          $manager=$sdkcmd|Select-Object -First 1 -ExpandProperty FullName
          $avdmanager=$avdcmd|Select-Object -First 1 -ExpandProperty FullName
          if(!$manager){
            $legacy=Join-Path $sdk 'tools\bin\sdkmanager.bat'
            if(Test-Path $legacy){$manager=$legacy}
          }
          if(!$avdmanager){
            $legacy=Join-Path $sdk 'tools\bin\avdmanager.bat'
            if(Test-Path $legacy){$avdmanager=$legacy}
          }
          Write-Host "R36_SDKMANAGER_AVAILABLE=$([bool]$manager)"
          Write-Host "R36_AVDMANAGER_AVAILABLE=$([bool]$avdmanager)"
          Write-Host "R36_EMULATOR_PREINSTALLED=$(Test-Path $bin)"
          if(!(Test-Path $bin) -or !(Test-Path (Join-Path $sdk 'system-images\android-30\google_apis\x86_64'))){
            if(!$manager){throw 'ANDROID_CMDLINE_TOOLS_MISSING_ON_BRELGA: sdkmanager required for emulator provisioning'}
            & $manager "--sdk_root=$sdk" --install 'emulator' 'platform-tools' 'system-images;android-30;google_apis;x86_64'
            if($LASTEXITCODE -ne 0){throw "ANDROID_EMULATOR_SDK_PACKAGE_INSTALL_FAILED=$LASTEXITCODE"}
          }
          if(!(Test-Path $bin)){throw 'ANDROID_EMULATOR_STILL_NOT_INSTALLED'}
          $avds=@(& $bin -list-avds 2>$null | Where-Object{$_ -and $_.Trim() -and $_ -notmatch '^INFO|^WARNING|^ERROR'})
          if($LASTEXITCODE -ne 0){throw 'ANDROID_AVD_ENUMERATION_FAILED'}
          # Never hijack a user's existing AVD (e.g. Pixel_7_Pro).
          # Use a dedicated, deterministic API-30 image with an isolated CI name.
          if('PF2_R36_CI' -notin $avds){
            if(!$avdmanager){throw 'ANDROID_AVDMANAGER_MISSING_ON_BRELGA'}
            # Supply a concrete Pixel device profile: this avoids the native
            # stdin encoding bug in Windows PowerShell ('?no is not a valid reply').
            & $avdmanager create avd -n 'PF2_R36_CI' -k 'system-images;android-30;google_apis;x86_64' -d 'pixel_6' --force
            if($LASTEXITCODE -ne 0){throw 'ANDROID_AVD_CREATION_FAILED'}
            $avds=@(& $bin -list-avds 2>$null | Where-Object{$_ -and $_.Trim() -and $_ -notmatch '^INFO|^WARNING|^ERROR'})
          }
          if('PF2_R36_CI' -notin $avds){throw 'ANDROID_CI_AVD_NOT_VISIBLE'}
          Write-Host 'R36_AVD_READY=PF2_R36_CI'
      - name: Assemble exact current R36 HEAD into local TEST APK without publishing
        shell: powershell
        timeout-minutes: 35
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw 'WRONG_RUNNER'}
          $sdk=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'))|Where-Object {$_ -and (Test-Path (Join-Path $_ 'platforms'))}|Select-Object -First 1
          if(!$sdk){throw 'ANDROID_SDK_MISSING_FOR_ASSEMBLE'}
          $env:ANDROID_SDK_ROOT=$sdk
          $env:ANDROID_HOME=$sdk
          $project=$env:PF2_R36_PROJECT
          if(!(Test-Path (Join-Path $project 'gradlew.bat'))){throw 'R36_GRADLE_ROOT_MISSING'}
          Push-Location $project
          try{
            $ErrorActionPreference='Continue'
            & .\gradlew.bat :app:assembleDebug --no-daemon --stacktrace
            $code=$LASTEXITCODE
          }finally{Pop-Location}
          if($code -ne 0){throw "R36_ASSEMBLE_DEBUG_FAILED=$code"}
          $path=Join-Path $project 'android\app\build\outputs\apk\debug'
          $apks=@(Get-ChildItem $path -Filter '*.apk' -File -ErrorAction Stop)
          if($apks.Count -ne 1){throw "R36_APK_COUNT_NOT_ONE=$($apks.Count)"}
          $out=Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $dst=Join-Path $out 'Braseiro-Kingmaker-R36-test.apk'
          Copy-Item -LiteralPath $apks[0].FullName -Destination $dst -Force
          $hash=(Get-FileHash $dst -Algorithm SHA256).Hash.ToLowerInvariant()
          if((Get-Item $dst).Length -le 100000){throw 'R36_APK_SUSPICIOUSLY_SMALL'}
          Write-Host "R36_LOCAL_APK_HEAD=$env:GITHUB_SHA"
          Write-Host "R36_LOCAL_APK_SHA256=$hash"
          Write-Host 'R36_LOCAL_DEBUG_ASSEMBLE=PASS; NO RELEASE/ARTIFACT PUBLISHED'
      - name: Android E2E and three AppDb restarts on exact HEAD APK
        shell: powershell
        timeout-minutes: 35
        run: |
          $ErrorActionPreference='Stop'
          $sdk=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'))|Where-Object{$_ -and (Test-Path (Join-Path $_ 'platform-tools\adb.exe'))}|Select-Object -First 1
          if(!$sdk){throw 'ANDROID_SDK_MISSING_AFTER_PROVISIONING'}
          $adb=Join-Path $sdk 'platform-tools\adb.exe'
          $emulator=Join-Path $sdk 'emulator\emulator.exe'
          if(!(Test-Path $emulator)){throw 'EMULATOR_BINARY_MISSING_AFTER_PROVISIONING'}
          $avdNames=@(& $emulator -list-avds 2>$null|Where-Object{$_ -and $_.Trim()})
          if('PF2_R36_CI' -notin $avdNames){throw 'DEDICATED_API30_AVD_MISSING'}
          $logs=Join-Path $env:GITHUB_WORKSPACE 'r36-runtime-logs'
          New-Item -ItemType Directory -Path $logs -Force|Out-Null
          $stdout=Join-Path $logs 'emulator.stdout.txt'
          $stderr=Join-Path $logs 'emulator.stderr.txt'
          $proc=$null
          try{
            # adb.exe can print "* daemon not running" on stderr the first time.
            # On Windows PowerShell this is a NativeCommandError with
            # ErrorActionPreference=Stop, even though adb itself is healthy.
            # Initialize adb safely before the boot poll.
            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName=$adb
            $psi.Arguments='start-server'
            $psi.UseShellExecute=$false
            $psi.CreateNoWindow=$true
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $adbInit=New-Object System.Diagnostics.Process
            $adbInit.StartInfo=$psi
            try{
              [void]$adbInit.Start()
              $adbOut=$adbInit.StandardOutput.ReadToEndAsync()
              $adbErr=$adbInit.StandardError.ReadToEndAsync()
              if(!$adbInit.WaitForExit(12000)){
                $adbInit.Kill()
                throw 'ADB_START_SERVER_HUNG_ON_BRELGA_12S'
              }
              $adbInit.WaitForExit()
              $adbInit.Refresh()
              $adbCode=$adbInit.ExitCode
              # A spawned daemon can inherit pipe handles: bound log draining too.
              if($adbOut.Wait(2000)){$adbOut.Result|Set-Content (Join-Path $logs 'adb-start.stdout.txt')}
              if($adbErr.Wait(2000)){$adbErr.Result|Set-Content (Join-Path $logs 'adb-start.stderr.txt')}
              Write-Host "R36_ADB_START_EXIT_CODE=$adbCode"
              if($null -eq $adbCode){throw 'ADB_START_SERVER_EXIT_CODE_UNAVAILABLE'}
              if($adbCode -ne 0){throw "ADB_START_SERVER_FAILED=$adbCode"}
            }finally{$adbInit.Dispose()}
            # The emulator startup log below records accelerator failures.
            # Avoid invoking -accel-check via PowerShell native stderr under Stop.
            Write-Host 'R36_ANDROID_EMULATOR_STARTING=true'
            $proc=Start-Process -FilePath $emulator -ArgumentList @('-avd','PF2_R36_CI','-no-window','-no-audio','-no-snapshot-load','-no-boot-anim','-gpu','swiftshader_indirect','-no-metrics') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Write-Host "R36_EMULATOR_PID=$($proc.Id)"
            $ready=$false
            $deadline=(Get-Date).AddMinutes(8)
            $i=0
            while((Get-Date) -lt $deadline){
              $psi=New-Object System.Diagnostics.ProcessStartInfo
              $psi.FileName=$adb
              $psi.Arguments='-e shell getprop sys.boot_completed'
              $psi.UseShellExecute=$false
              $psi.CreateNoWindow=$true
              $psi.RedirectStandardOutput=$true
              $psi.RedirectStandardError=$true
              $poll=New-Object System.Diagnostics.Process
              $poll.StartInfo=$psi
              $boot='NOT_READY'
              try{
                [void]$poll.Start()
                if(!$poll.WaitForExit(6000)){
                  $poll.Kill()
                  $boot='ADB_GETPROP_TIMEOUT'
                }elseif($poll.ExitCode -eq 0){
                  $boot=$poll.StandardOutput.ReadToEnd().Trim()
                }else{
                  $boot='ADB_EXIT_'+$poll.ExitCode
                }
              }finally{$poll.Dispose()}
              if($boot -eq '1'){$ready=$true;break}
              if($proc.HasExited){throw "ANDROID_EMULATOR_PROCESS_EXIT=$($proc.ExitCode)"}
              if($i%4 -eq 0){Write-Host "R36_ANDROID_BOOT_POLL=$i result=$boot"}
              Start-Sleep -Seconds 3
              $i++
            }
            if(!$ready){throw 'ANDROID_EMULATOR_BOOT_TIMEOUT_8MIN_WITH_BOUNDED_ADB_POLL'}
            $apk=Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk\Braseiro-Kingmaker-R36-test.apk'
            if(!(Test-Path $apk)){throw 'R36_CURRENT_HEAD_APK_MISSING'}
            & $adb -e install -r $apk
            if($LASTEXITCODE -ne 0){throw 'R36_TEST_APK_INSTALL_FAILED'}
            Write-Host 'R36_ANDROID_APK_INSTALLED=true'
            & python ci/pf2-kingmaker-certification/android_ui_endurance.py --adb $adb
            if($LASTEXITCODE -ne 0){throw 'REAL_ANDROID_APPDB_THREE_RESTART_GATE_FAILED'}
            Write-Host 'R36_REAL_ANDROID_UI_APPDB_3_RESTARTS=PASS'
          }catch{
            Write-Host "R36_REAL_ANDROID_FAILURE=$($_.Exception.Message)"
            foreach($name in @('adb-start.stdout.txt','adb-start.stderr.txt')){
              $path=Join-Path $logs $name
              if(Test-Path $path){Write-Host "R36_ADB_LOG=$name";Get-Content $path -Tail 80|ForEach-Object{Write-Host $_}}
            }
            if(Test-Path $stderr){Write-Host 'R36_EMULATOR_STDERR_TAIL';Get-Content $stderr -Tail 110|ForEach-Object{Write-Host $_}}
            if(Test-Path $stdout){Write-Host 'R36_EMULATOR_STDOUT_TAIL';Get-Content $stdout -Tail 35|ForEach-Object{Write-Host $_}}
            throw
          }finally{
            $oldAction=$ErrorActionPreference
            $ErrorActionPreference='SilentlyContinue'
            try{
              # Cleanup failures MUST NOT mask the real boot/Android result.
              if($proc -and !$proc.HasExited){
                & $adb -e emu kill 2>$null|Out-Null
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
            }catch{Write-Host 'R36_EMULATOR_CLEANUP_NONFATAL'}finally{$ErrorActionPreference=$oldAction}
          }
      - name: Compile real Android app with R36 modifications
        if: github.event_name == 'workflow_dispatch' && inputs.compile_apk
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'))|Where-Object{$_ -and (Test-Path $_)}
          $sdk=$candidate|Where-Object {Test-Path (Join-Path $_ 'platforms')}|Select-Object -First 1
          if(!$sdk){throw 'Android SDK absent'}
          $env:ANDROID_SDK_ROOT=$sdk
          $env:ANDROID_HOME=$sdk
          Push-Location $env:PF2_R36_PROJECT
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:assembleDebug --no-daemon --stacktrace
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw "R36 Gradle compilation failed code=$code"}
          $apk=@(Get-ChildItem "$env:PF2_R36_PROJECT\android\app\build\outputs\apk\debug" -Filter '*.apk' -File)
          if($apk.Count -ne 1){throw "Expected exactly one debug APK, found $($apk.Count)"}
          $hash=(Get-FileHash $apk[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $out=Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          Copy-Item $apk[0].FullName (Join-Path $out 'Braseiro-Kingmaker-R36-test.apk') -Force
          Set-Content -Path (Join-Path $out 'SHA256.txt') -Value ("$hash  Braseiro-Kingmaker-R36-test.apk") -Encoding ascii
          Write-Host "R36_TEST_APK_SHA256=$hash"
          Write-Host "R36_COMPILED_ANDROID_PASS=true"
      - name: Publish R36 TEST prerelease APK (does not use full Actions artifact storage)
        if: github.event_name == 'workflow_dispatch' && inputs.compile_apk
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag="PATHFINDER2E-9.0.37-R36-TEST-"+$env:GITHUB_SHA.Substring(0,8)
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $uri="https://api.github.com/repos/bra83/braseirobuild/releases/tags/$tag"
          $rel=$null
          try{$rel=Invoke-RestMethod -Uri $uri -Headers $headers -Method Get}
          catch{
            if(!$_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404){throw}
          }
          if(!$rel){
            $body=@{
              tag_name=$tag
              target_commitish=$env:GITHUB_SHA
              name='Braseiro Kingmaker R36 9.0.37 - TEST APK - NOT CERTIFIED'
              draft=$false
              prerelease=$true
              make_latest='false'
              body=("TEST BUILD ONLY - NOT A CERTIFIED RELEASE. " +
                "Source: "+$env:GITHUB_SHA+". R35 stable release is unchanged. " +
                "Source regression and Gradle build have passed; real Android UI/AppDb 3-restart " +
                "acceptance and semantic completeness of 73 structures, 11 chapters, companions " +
                "and kingdom warfare remain uncertified.")
            }|ConvertTo-Json -Compress -Depth 6
            $rel=Invoke-RestMethod -Uri 'https://api.github.com/repos/bra83/braseirobuild/releases' -Headers $headers -Method Post -ContentType 'application/json' -Body $body
          }
          if(!$rel.id -or !$rel.upload_url -or !$rel.prerelease){throw 'TEST_PRERELEASE_NOT_CONFIRMED'}
          $files=@(
            @{Name='Braseiro-Kingmaker-R36-test.apk';Type='application/vnd.android.package-archive'},
            @{Name='SHA256.txt';Type='text/plain'}
          )
          $prefix=($rel.upload_url -split '\{')[0]
          foreach($entry in $files){
            $file=Join-Path (Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk') $entry.Name
            if(!(Test-Path $file)){throw "TEST_RELEASE_FILE_MISSING $($entry.Name)"}
            $prior=@($rel.assets|Where-Object{$_.name -eq $entry.Name})
            if($prior.Count -gt 0){
              if($prior[0].size -ne (Get-Item $file).Length){throw 'EXISTING_RELEASE_ASSET_SIZE_MISMATCH'}
              Write-Host "R36_TEST_ASSET_ALREADY_PRESENT=$($entry.Name)"
              continue
            }
            $url=$prefix+'?name='+[uri]::EscapeDataString($entry.Name)
            $raw=& curl.exe -L -sS --fail --retry 3 --request POST --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/vnd.github+json' --header "Content-Type: $($entry.Type)" --data-binary "@$file" "$url"
            if($LASTEXITCODE -ne 0){throw "GITHUB_PRERELEASE_UPLOAD_FAILED $($entry.Name)"}
            $asset=($raw -join "`n")|ConvertFrom-Json
            if(!$asset.id -or $asset.size -ne (Get-Item $file).Length){throw "GITHUB_PRERELEASE_ASSET_NOT_CONFIRMED $($entry.Name)"}
            Write-Host "R36_TEST_ASSET_URL=$($asset.browser_download_url)"
          }
          Write-Host "R36_TEST_PRERELEASE_URL=$($rel.html_url)"

      - name: Clean only temporary R36 source and local APK on BRELGA
        if: always()
        shell: powershell
        run: |
          $tmp=Join-Path $env:RUNNER_TEMP ("pf2-r36-book-"+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $tmp){Remove-Item -LiteralPath $tmp -Force -Recurse -ErrorAction SilentlyContinue}
          $apkdir=Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk'
          if(Test-Path -LiteralPath $apkdir){Remove-Item -LiteralPath $apkdir -Force -Recurse -ErrorAction SilentlyContinue}
          Write-Host 'R36_JOB_SCOPED_TEMP_CLEANUP_DONE'
      - name: State scope truthfully
        if: always()
        shell: powershell
        run: |
          Write-Host 'Only selected official book rules tested in this candidate. NOT whole-campaign certification.'
          Write-Host 'TEST-only GitHub prerelease, not a final or certified release. Stable R35 remains unchanged.'

  android-ui-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.compile_apk
    name: Real Android emulator / AppDb 3-restart acceptance
    needs: [verify]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/pf2-kingmaker-certification
          ref: ${{ github.sha }}
      - name: Download exact R36 TEST APK and checksum from the prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag="PATHFINDER2E-9.0.37-R36-TEST-"+$env:GITHUB_SHA.Substring(0,8)
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $rel=Invoke-RestMethod -Uri "https://api.github.com/repos/bra83/braseirobuild/releases/tags/$tag" -Headers $headers -Method Get
          if(!$rel.id -or !$rel.prerelease -or $rel.target_commitish -ne $env:GITHUB_SHA){throw 'TEST_RELEASE_IDENTITY_MISMATCH'}
          $out=Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          foreach($name in @('Braseiro-Kingmaker-R36-test.apk','SHA256.txt')){
            $asset=@($rel.assets|Where-Object{$_.name -eq $name})
            if($asset.Count -ne 1){throw "TEST_RELEASE_ASSET_MISSING $name"}
            $url="https://api.github.com/repos/bra83/braseirobuild/releases/assets/"+$asset[0].id
            & curl.exe -L --fail --retry 3 --retry-delay 3 --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' -o (Join-Path $out $name) $url
            if($LASTEXITCODE -ne 0){throw "TEST_RELEASE_ASSET_DOWNLOAD_FAILED $name"}
            if((Get-Item (Join-Path $out $name)).Length -ne $asset[0].size){throw "TEST_RELEASE_ASSET_SIZE_MISMATCH $name"}
          }
          Write-Host "R36_TEST_RELEASE_CHECKED=$($rel.html_url)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Boot a real Android emulator and validate production AppDb
        shell: powershell
        timeout-minutes: 65
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Wrong runner: $env:RUNNER_NAME"}
          $apk=Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk\Braseiro-Kingmaker-R36-test.apk'
          $checksum=Join-Path $env:GITHUB_WORKSPACE 'r36-test-apk\SHA256.txt'
          if(!(Test-Path $apk) -or !(Test-Path $checksum)){throw 'TEST_APK_ARTIFACT_MISSING'}
          $known=((Get-Content $checksum -Raw).Trim() -split '\s+')[0]
          $actual=(Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          if($known -ne $actual){throw "TEST_APK_SHA256_MISMATCH $actual"}
          $sdkCandidates=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'))|Where-Object {$_ -and (Test-Path $_)}
          $sdk=$sdkCandidates|Where-Object {Test-Path (Join-Path $_ 'platform-tools\adb.exe')}|Select-Object -First 1
          if(!$sdk){throw 'ANDROID_SDK_PLATFORM_TOOLS_MISSING_ON_BRELGA'}
          $adb=Join-Path $sdk 'platform-tools\adb.exe'
          $emulator=Join-Path $sdk 'emulator\emulator.exe'
          if(!(Test-Path $emulator)){throw 'ANDROID_EMULATOR_BINARY_MISSING_ON_BRELGA'}
          $env:ANDROID_SDK_ROOT=$sdk
          $env:ANDROID_HOME=$sdk
          $avds=@(& $emulator -list-avds | Where-Object {$_ -and $_.Trim() -ne '' -and $_ -notmatch '^INFO|^WARNING|^ERROR'})
          if($LASTEXITCODE -ne 0){throw 'ANDROID_AVD_LIST_FAILED'}
          if($avds.Count -eq 0){throw 'ANDROID_AVD_MISSING_ON_BRELGA: create a Pixel Android 11 (API 30) x86_64 AVD to permit real AppDb tests'}
          $avd=$avds[0].Trim()
          Write-Host "REAL_ANDROID_AVD=$avd"
          $proc=$null
          try{
            $proc=Start-Process -FilePath $emulator -ArgumentList @('-avd',$avd,'-no-window','-no-audio','-no-snapshot-load','-no-boot-anim','-gpu','swiftshader_indirect') -PassThru
            $booted=$false
            for($n=0;$n -lt 90;$n++){
              Start-Sleep -Seconds 5
              $status=(& $adb -e shell getprop sys.boot_completed 2>$null | Out-String).Trim()
              if($status -eq '1'){$booted=$true;break}
              if($proc.HasExited){throw "ANDROID_EMULATOR_EXITED_EARLY code=$($proc.ExitCode)"}
            }
            if(!$booted){throw 'ANDROID_EMULATOR_BOOT_TIMEOUT'}
            & $adb -e shell input keyevent 82
            & $adb -e install -r "$apk"
            if($LASTEXITCODE -ne 0){throw 'ANDROID_APK_INSTALL_FAILED'}
            $evidence=Join-Path $env:GITHUB_WORKSPACE 'r36-real-android-evidence'
            New-Item -ItemType Directory -Path $evidence -Force|Out-Null
            & python ci/pf2-kingmaker-certification/android_ui_endurance.py --adb "$adb" 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'AppDb-3-restarts.txt')
            if($LASTEXITCODE -ne 0){throw 'ANDROID_PRODUCTION_APPDB_ACCEPTANCE_FAILED'}
            Write-Host 'R36_REAL_ANDROID_APPDB_ACCEPTANCE=PASS'
          }finally{
            & $adb -e emu kill 2>$null
            if($proc -and !$proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
          }
      - name: Preserve real Android evidence even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kingmaker-R36-Android-AppDb-Evidence
          path: r36-real-android-evidence/
          if-no-files-found: warn
          retention-days: 30
