name: PF2 Kingmaker R36 A01 Official Taxes Source And Android Build
on:
  push:
    branches: [pf2-kingmaker-r36-official-rule-fixes-20261011]
    paths:
      - '.github/workflows/pf2-r36-a01-official-taxes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pf2-r36-rules-production-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore hash-verified R35 Android source from published release
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Wrong runner: $env:RUNNER_NAME"}
          $root=Join-Path $env:RUNNER_TEMP 'pf2-r36-a01'
          $work=Join-Path $root 'source'
          New-Item $work -ItemType Directory -Force|Out-Null
          $zip=Join-Path $root 'R35_VERIFIED.zip'
          $auth=& git config --local --get http.https://github.com/.extraheader
          if(!$auth){throw 'GitHub auth header unavailable'}
          & curl.exe -L --fail --retry 5 --retry-delay 3 --header $auth --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' -o $zip 'https://api.github.com/repos/bra83/braseirobuild/releases/assets/629875743'
          if($LASTEXITCODE -ne 0){throw 'Source fetch failed'}
          if((Get-Item $zip).Length -ne 92975058){throw 'Wrong R35 source length'}
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '86d9a6fd26e4139e084c8e4069f49ef53e0cf8654e0f9f5662b92f9183941aa6'){throw "R35 source checksum mismatch $hash"}
          Write-Host "VERIFIED_R35_SOURCE_HASH=$hash"
          & tar.exe -xf $zip -C $work
          if($LASTEXITCODE -ne 0){throw 'Extraction failed'}
          $projects=@(Get-ChildItem $work -Recurse -File -Filter version.properties|Where-Object{Test-Path (Join-Path $_.Directory.FullName 'gradlew.bat')})
          if($projects.Count -ne 1){throw "Expected one Android project, found $($projects.Count)"}
          $project=$projects[0].Directory.FullName
          if((Get-Content (Join-Path $project 'version.properties') -Raw) -notmatch 'VERSION_NAME=9.0.36'){throw 'Wrong source release'}
          "PF2_R36_A01_PROJECT=$project"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Apply official tax fix to isolated R35 and run dedicated proofs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & python ci\pf2-kingmaker-r36\patch_official_taxes.py $env:PF2_R36_A01_PROJECT
          if($LASTEXITCODE -ne 0){throw 'R36 A01 patch refused source drift'}
          Copy-Item ci\pf2-kingmaker-r36\test_official_taxes.py (Join-Path $env:PF2_R36_A01_PROJECT 'tests_pf2\test_r36_official_taxes.py') -Force
          Push-Location $env:PF2_R36_A01_PROJECT
          $ErrorActionPreference='Continue'
          python -m pytest tests_pf2\test_r36_official_taxes.py -q
          $rc=$LASTEXITCODE
          Pop-Location
          if($rc -ne 0){throw "Official tax tests failed: $rc"}
      - name: Execute all official Kingmaker and Pathfinder regression suites
        shell: powershell
        run: |
          Push-Location $env:PF2_R36_A01_PROJECT
          $ErrorActionPreference='Continue'
          python -m pytest tests_pf2 -q
          $rc=$LASTEXITCODE
          Pop-Location
          if($rc -ne 0){throw "R36 regression failed: $rc"}
      - name: Validate corrected production Java compiles into Android debug APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sdk='C:\actions-runner\android-sdk'
          if(!(Test-Path $sdk)){throw 'Android SDK absent'}
          $env:ANDROID_HOME=$sdk
          $env:ANDROID_SDK_ROOT=$sdk
          Push-Location $env:PF2_R36_A01_PROJECT
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:assembleDebug --no-daemon --stacktrace 2>&1|Select-Object -Last 90
          $rc=$LASTEXITCODE
          Pop-Location
          if($rc -ne 0){throw "R36 A01 Android compilation failed: $rc"}
          Write-Host 'R36_A01_TAXES_COMPILED_PASS=true'
          Write-Host 'R36_A01_NOT_PUBLISHED=Further official rule defects still open'
