name: Dispatch Tales 1.3.7 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-tales-1.3.7.yml"
      - ".github/TALES_137_APK_TRIGGER"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch universal APK builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --repo bra83/braseirobuild --ref main -f tag=TALES-1.3.7
