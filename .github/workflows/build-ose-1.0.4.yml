name: Build BRASEIRO OSE 1.0.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ose-1.0.4.yml"
      - "OSE_1_0_4_TRIGGER.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout braseirobuild
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize TTS playback
        run: |
          set -euo pipefail
          python tools/ose104_tts_finalize.py
          node --check ose/1.0.0/source/web-ui-p1/p1.js

      - name: Static QA 1.0.4
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          grep -q 'versionName = "1.0.4"' ose/1.0.0/source/app-android/build.gradle.kts
          grep -q 'output_audio' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/GeminiInteractionsClient.kt
          grep -q 'playTestPhrase' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/GeminiTtsController.kt
          grep -q 'prepareAsync' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/GeminiTtsController.kt
          grep -q 'ScenePromptShare' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt
          grep -q 'com.google.android.apps.bard' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt
          grep -q 'characterPreserved' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt
          grep -q 'actionCostSummary' ose/1.0.0/source/web-ui-p1/p1.js
          grep -q 'announceStateChanges' ose/1.0.0/source/web-ui-p1/p1.js
          grep -q 'android.intent.action.SEND' ose/1.0.0/source/app-android/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('ose/1.0.0/source')
          wild=(root/'referee-boundary/src/main/kotlin/braseiro/ose/referee/WildernessRuntimeRules.kt').read_text()
          marker='private fun reveal(w:HexWorldSnapshot,q:Int,r:Int):HexWorldSnapshot'
          block=wild[wild.index(marker):wild.index('private fun revealKnowledge',wild.index(marker))]
          assert 'hexDistance' not in block
          assert 'known = c.known || here' in block and 'visible = here' in block
          files=sorted((root/'web-ui-p1/equipment-icons').glob('*.png'))
          assert len(files)==102, len(files)
          bad=[]
          for p in files:
              im=Image.open(p).convert('RGB')
              assert im.size==(128,128), (p.name,im.size)
              # outer 16px must be black after bleed cleanup
              px=im.load(); w,h=im.size
              maxv=0
              for y in range(h):
                  for x in range(w):
                      if x<16 or y<16 or x>=w-16 or y>=h-16:
                          maxv=max(maxv,*px[x,y])
              if maxv>24: bad.append((p.name,maxv))
          assert not bad, bad[:10]
          print('equipment_icon_bleed=PASS 102/102')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and compile APK
        working-directory: ose/1.0.0/source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app-android:testDebugUnitTest :app-android:assembleDebug --stacktrace --no-daemon

      - name: Validate publish and upload 1.0.4
        run: |
          set -euo pipefail
          APK="$(find ose/1.0.0/source/app-android/build/outputs/apk/debug -type f -name '*.apk' | sort | head -n1)"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          OUT=build-artifacts/ose/1.0.4
          mkdir -p "$OUT"
          cp "$APK" "$OUT/BRASEIRO_OSE_1_0_4_DEBUG.apk"
          sha256sum "$OUT/BRASEIRO_OSE_1_0_4_DEBUG.apk" | tee "$OUT/BRASEIRO_OSE_1_0_4_DEBUG.sha256"
          stat -c 'size_bytes=%s' "$OUT/BRASEIRO_OSE_1_0_4_DEBUG.apk" | tee "$OUT/BRASEIRO_OSE_1_0_4_DEBUG.info.txt"
          curl --fail-with-body -sS -F "file=@$OUT/BRASEIRO_OSE_1_0_4_DEBUG.apk" https://tmpfiles.org/api/v1/upload > "$OUT/tmpfiles_response.json"
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('build-artifacts/ose/1.0.4')
          d=json.loads((p/'tmpfiles_response.json').read_text())
          url=d['data']['url']
          if '/dl/' not in url: url=url.replace('https://tmpfiles.org/','https://tmpfiles.org/dl/',1)
          (p/'TMPFILES_DIRECT_URL.txt').write_text(url+'\n')
          print(url)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ose/1.0.0/source build-artifacts/ose/1.0.4
          if ! git diff --cached --quiet; then
            git commit -m 'BRASEIRO OSE 1.0.4: finalize TTS playback and UX fixes'
            git push origin HEAD:main
          fi

      - name: Summary
        run: |
          {
            echo '## BRASEIRO OSE 1.0.4'
            echo '- TTS: output_audio + audible test + async playback/error reporting.'
            echo '- ILUSTRAR: prompt detalhado abre no Gemini; imagem pode ser compartilhada de volta.'
            echo '- Confirmações antes de viagem/descanso e avisos após mudança de tempo/mundo.'
            echo '- Personagem/inventário preservados ao recomeçar campanha.'
            echo '- Viagem revela apenas hexes atravessados.'
            echo '- 102/102 ícones auditados contra bleed na borda.'
            cat build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.sha256
            cat build-artifacts/ose/1.0.4/TMPFILES_DIRECT_URL.txt
          } >> "$GITHUB_STEP_SUMMARY"
