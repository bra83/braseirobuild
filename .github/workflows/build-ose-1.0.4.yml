name: Build BRASEIRO OSE 1.0.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ose-1.0.4.yml"
      - "OSE_1_0_4_TRIGGER.txt"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout braseirobuild
        uses: actions/checkout@v4

      - name: Download exact 1.0.4 scripts
        env:
          SCRIPT_SHARE: https://firestorage.ai/ja/f/JlcU8X1OA3q0
          SCRIPT_SHA: 4393a9d94892637bd63f3ff32648405aac350cfc06ece768095c2b7889d100ba
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os, pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('/tmp/ose104_scripts.zip')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(accept_downloads=True)
              page.goto(os.environ['SCRIPT_SHARE'], wait_until='domcontentloaded', timeout=120000)
              page.wait_for_timeout(3500)
              for label in ['Accept','Aceitar','同意する','OK']:
                  try:
                      loc=page.get_by_text(label, exact=True)
                      if loc.count() and loc.first.is_visible(): loc.first.click(timeout=1200)
                  except Exception: pass
              done=False
              for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
                  try:
                      loc=page.locator(sel).first
                      if not loc.count() or not loc.is_visible(): continue
                      with page.expect_download(timeout=120000) as info: loc.click(timeout=10000)
                      info.value.save_as(str(out)); done=True; break
                  except Exception: pass
              if not done:
                  card=page.get_by_text('ose104_scripts_v2.zip', exact=False).first
                  parent=card.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
                  with page.expect_download(timeout=120000) as info: parent.locator('a,button').last.click(timeout=10000)
                  info.value.save_as(str(out)); done=True
              browser.close()
          if not done or not out.exists(): raise SystemExit('script download failed')
          PY
          echo "$SCRIPT_SHA  /tmp/ose104_scripts.zip" | sha256sum -c -
          rm -rf /tmp/ose104 && mkdir -p /tmp/ose104
          unzip -q /tmp/ose104_scripts.zip -d /tmp/ose104

      - name: Apply runtime and UX fixes
        run: |
          set -euo pipefail
          python3 /tmp/ose104/apply104_v2.py
          python3 -m pip install --quiet pillow
          python3 /tmp/ose104/script1.py
          # The source atlas exports include fragments from neighboring cells in the outer band.
          # Visual QA showed an 8px crop still leaked, while 16px removed the bleed cleanly.
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          d=Path('ose/1.0.0/source/web-ui-p1/equipment-icons')
          count=0
          for p in sorted(d.glob('*.png')):
              im=Image.open(p).convert('RGBA')
              w,h=im.size
              inset=max(16, min(w,h)//8)
              px=im.load()
              for y in range(h):
                  for x in range(w):
                      if x < inset or y < inset or x >= w-inset or y >= h-inset:
                          px[x,y]=(0,0,0,255)
              im.save(p,optimize=True)
              count+=1
          assert count==102, count
          print(f'equipment_icons_strict_bleed_cleanup={count}/102 inset>=16px')
          PY

      - name: Static QA for 1.0.4
        run: |
          set -euo pipefail
          grep -q 'versionName = "1.0.4"' ose/1.0.0/source/app-android/build.gradle.kts
          grep -q 'output_audio' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/GeminiInteractionsClient.kt
          grep -q 'playTestPhrase' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/GeminiTtsController.kt
          grep -q 'ScenePromptShare' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt
          grep -q 'com.google.android.apps.bard' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt
          grep -q 'characterPreserved' ose/1.0.0/source/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt
          grep -q 'c.copy(known = c.known || here, visible = here)' ose/1.0.0/source/referee-boundary/src/main/kotlin/braseiro/ose/referee/WildernessRuntimeRules.kt
          grep -q 'actionCostSummary' ose/1.0.0/source/web-ui-p1/p1.js
          grep -q 'announceStateChanges' ose/1.0.0/source/web-ui-p1/p1.js
          grep -q 'ScenePromptShare' ose/1.0.0/source/web-ui-p1/p1.js
          grep -q 'android.intent.action.SEND' ose/1.0.0/source/app-android/src/main/AndroidManifest.xml
          test "$(find ose/1.0.0/source/web-ui-p1/equipment-icons -maxdepth 1 -name '*.png' | wc -l)" -eq 102
          node --check ose/1.0.0/source/web-ui-p1/p1.js
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          d=Path('ose/1.0.0/source/web-ui-p1/equipment-icons')
          files=sorted(d.glob('*.png'))
          assert len(files)==102
          for p in files:
              im=Image.open(p).convert('RGBA'); w,h=im.size; inset=max(16,min(w,h)//8)
              px=im.load()
              assert all(px[x,y][:3]==(0,0,0) for y in range(h) for x in range(w) if x<inset or y<inset or x>=w-inset or y>=h-inset), p
          print('equipment_icon_bleed_border=PASS 102/102')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and install platform 35
        run: |
          set -euo pipefail
          ANDROID_HOME=/usr/local/lib/android/sdk
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and compile APK
        working-directory: ose/1.0.0/source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app-android:testDebugUnitTest :app-android:assembleDebug --stacktrace --no-daemon

      - name: Validate and publish 1.0.4
        run: |
          set -euo pipefail
          APK="$(find ose/1.0.0/source/app-android/build/outputs/apk/debug -type f -name '*.apk' | sort | head -n1)"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p build-artifacts/ose/1.0.4
          cp "$APK" build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.apk
          sha256sum build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.apk | tee build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.sha256
          stat -c 'size_bytes=%s' build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.apk | tee build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.info.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ose/1.0.0/source build-artifacts/ose/1.0.4
          if ! git diff --cached --quiet; then
            git commit -m 'BRASEIRO OSE 1.0.4: TTS, Gemini share, confirmation UX, persistence, fog fix'
            git push origin HEAD:main
          fi

      - name: Summary
        run: |
          {
            echo '## BRASEIRO OSE 1.0.4'
            echo '- TTS: Gemini Interactions output_audio + audible test.'
            echo '- ILUSTRAR: detailed scene prompt shared to Gemini app; OSE receives shared image.'
            echo '- UX: confirmations before day/resource costs and popup after world/time changes.'
            echo '- Recomeçar: character, inventory and equipment preserved.'
            echo '- Map: travel reveals traversed path only.'
            echo '- Equipment: 102/102 icons with strict outer-band bleed cleanup.'
            cat build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.sha256
          } >> "$GITHUB_STEP_SUMMARY"
