name: Braseiro O Um Anel 4.9.7 Visual POI Overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oua-4.9.7-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: 'OUA-v4.9.7'
  BASE_TAG: 'OUA-v4.9.5'
  BASE_SOURCE: 'OUA_4.9.5_MAP_PARTY_CAMPAIGN_RECOVERY_ANDROID_STUDIO.zip'
  SOURCE_NAME: 'OUA_4.9.7_VISUAL_POI_OVERLAY_ANDROID_STUDIO.zip'
  APK_NAME: 'BRASEIRO_O_UM_ANEL_4.9.7_DEBUG.apk'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Download exact current 4.9.5 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming work out
          mkdir -p incoming work out
          gh release download "$BASE_TAG" --pattern "$BASE_SOURCE" --dir incoming
          unzip -t "incoming/$BASE_SOURCE" >/dev/null
          unzip -q "incoming/$BASE_SOURCE" -d work
          ROOT="$(dirname "$(find work -maxdepth 6 -type f -name package.json | head -n1)")"
          test -n "$ROOT"
          test -f "$ROOT/package.json"
          test -f "$ROOT/components/EriadorMap.tsx"
          test -d "$ROOT/android"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply 4.9.7 visual repair
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/oua-4.9.7/patch.py "$ROOT" | tee out/PATCH_GATE.txt
          grep -q 'PATCH_OUA_4.9.7_VISUAL_OK' out/PATCH_GATE.txt
          grep -q '"version": "4.9.7"' "$ROOT/package.json"
          grep -q 'versionName = "4.9.7"' "$ROOT/android/app/build.gradle.kts"
          grep -q "right: '-5%'" "$ROOT/components/EriadorMap.tsx"
          grep -q "opacity: .48" "$ROOT/components/EriadorMap.tsx"
          grep -q "Ilustração do local atual" "$ROOT/components/EriadorMap.tsx"
          grep -q "selectedPoiPresentation.asset" "$ROOT/components/EriadorMap.tsx"
          grep -q "PartyCluster" "$ROOT/components/EriadorMap.tsx"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild offline runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm run build:offline 2>&1 | tee "$GITHUB_WORKSPACE/out/OFFLINE_BUILD.log"
          node scripts/use-offline-dist.mjs
          node scripts/sync-android-assets.mjs

      - name: Validate visual regression contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$ROOT" python3 - <<'PY' | tee out/VISUAL_REGRESSION.txt
          from pathlib import Path
          import os
          root=Path(os.environ['ROOT'])
          mp=(root/'components/EriadorMap.tsx').read_text(encoding='utf-8')
          imm=(root/'components/immersive/ImmersiveJourneyView.tsx').read_text(encoding='utf-8')
          checks={
            'Atlas remains interactive': 'onPointerMove={pointerMove}' in mp and 'onWheel={event =>' in mp,
            'current POI image still uses catalog asset': 'resolvePoiAsset(immersiveAssets, locationKey)' in mp,
            'hex fallback asset retained': 'resolvePoiAssetsForHex(immersiveAssets, discovery.currentHexId)[0]' in mp,
            'current illustration fixed on right': "right: '-5%'" in mp and "top: '15%'" in mp,
            'context illustration translucent': 'opacity: .48' in mp,
            'soft radial fade': 'maskImage:' in mp and 'radial-gradient' in mp,
            'illustration cannot block touch': "pointerEvents: 'none'" in mp,
            'selected POI remains map-bound': 'selectedPoiPresentation.asset' in mp,
            'party marker remains real': 'PartyCluster' in mp and 'currentPartyPresentation' in mp,
            '4.9.4 immersive shell retained': 'data-braseiro-immersive-root="true"' in imm,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items():
              print(('PASS' if v else 'FAIL'), k)
          if failed:
              raise SystemExit('FAILED: '+', '.join(failed))
          PY

          cat > "$ROOT/VALIDACAO_OUA_4.9.7_VISUAL_POI_OVERLAY.txt" <<'EOF'
          O Um Anel 4.9.7 — VISUAL POI OVERLAY
          PASS — ilustração do local atual usa asset contextual local/hex
          PASS — ilustração fixa no canto direito da tela
          PASS — opacidade reduzida e máscara radial
          PASS — overlay não captura toque
          PASS — mapa continua com pan/zoom/seleção
          PASS — Companhia continua ancorada ao estado real
          PASS — POI selecionado continua vinculado ao hex
          PASS — UI imersiva 415×915 preservada
          EOF

      - name: Package corrected Android Studio source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$ROOT" SOURCE_NAME="$SOURCE_NAME" python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          out=Path(os.environ['GITHUB_WORKSPACE'])/'out'/os.environ['SOURCE_NAME']
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in root.rglob('*'):
                  if p.is_file() and 'node_modules' not in p.parts and '.git' not in p.parts and '.gradle' not in p.parts and 'build' not in p.parts:
                      z.write(p, Path('OUA497')/p.relative_to(root))
          PY
          unzip -t "out/$SOURCE_NAME" >/dev/null
          sha256sum "out/$SOURCE_NAME" > "out/$SOURCE_NAME.sha256"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$ROOT/android/gradlew"
          cd "$ROOT/android"
          ./gradlew clean :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" > "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.oumanel'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null

      - name: Publish one release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" --target main \
            --title 'Braseiro O Um Anel 4.9.7 — Visual POI Overlay' \
            --notes 'Parte da 4.9.5 atual. Mantém Atlas, Companhia, POIs, rotas e UI 415×915. A ilustração contextual do local atual fica fixa no canto direito com transparência e máscara suave, sem bloquear controles ou acompanhar o hex durante o pan.'
          gh release upload "$TAG" \
            "out/$SOURCE_NAME" \
            "out/$SOURCE_NAME.sha256" \
            "out/$APK_NAME" \
            "out/$APK_NAME.sha256" \
            out/APK_BADGING.txt \
            out/GRADLE_BUILD.log \
            out/OFFLINE_BUILD.log \
            out/PATCH_GATE.txt \
            out/VISUAL_REGRESSION.txt \
            "$ROOT/VALIDACAO_OUA_4.9.7_VISUAL_POI_OVERLAY.txt"

# build trigger: visual correction 4.9.7
