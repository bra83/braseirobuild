name: Export Braseiro APK Base64 Small

on:
  push:
    branches: [fichas-final-20260916]
    paths:
      - ".github/workflows/export-apk-base64-small.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fichas-final-20260916
      - name: Exportar em blocos pequenos
        shell: bash
        run: |
          set -euo pipefail
          APK="deliverables/fichas-final-20260916/BRASEIRO_FICHAS_MULTISSISTEMA-1.0.0-final-debug.apk"
          SHA="8b217b8122695a848297c20d4a5966bdcd34942e1ce0c3199f485fc843c60da6"
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$SHA"
          DIR="deliverables/fichas-final-20260916/base64-small"
          rm -rf "$DIR" && mkdir -p "$DIR"
          base64 -w0 "$APK" > "$DIR/all.b64"
          split -b 10000 -d -a 3 "$DIR/all.b64" "$DIR/part-"
          rm "$DIR/all.b64"
          sha256sum "$APK" > "$DIR/apk.sha256"
          wc -c "$APK" > "$DIR/apk.size"
          ls "$DIR"/part-* | wc -l > "$DIR/part-count"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          git commit -m "build: export final APK in 10k base64 chunks"
          git push origin HEAD:fichas-final-20260916
