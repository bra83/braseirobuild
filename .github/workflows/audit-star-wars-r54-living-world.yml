name: Audit Star Wars R54 Living World
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "star-wars/r54/audit_living_world_e2e.py"
      - ".github/workflows/audit-star-wars-r54-living-world.yml"
permissions: {contents: read}
jobs:
  living-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover canonical R54
        id: root
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip
          test -f "$ZIP"
          rm -rf living-world-work && mkdir living-world-work
          unzip -q "$ZIP" -d living-world-work
          SET="$(find living-world-work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"
          test -n "$SET"; ROOT="$(dirname "$SET")"; echo "path=$ROOT" >> "$GITHUB_OUTPUT"
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Validate persistent living world
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          python3 -m py_compile star-wars/r54/audit_living_world_e2e.py
          python3 -m http.server 8765 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/living-world-http.log 2>&1 & PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          python3 star-wars/r54/audit_living_world_e2e.py "$ROOT" | tee /tmp/LIVING_WORLD_E2E.txt
          grep -q 'R54_LIVING_WORLD_E2E_PASS' /tmp/LIVING_WORLD_E2E.txt
