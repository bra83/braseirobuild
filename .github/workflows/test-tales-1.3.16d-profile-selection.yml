name: Test Tales 1.3.16d Profile Selection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-tales-1.3.16d-profile-selection.yml"
      - "tales-1.3.16d-transform.py"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Recover source and apply profile selection lifecycle
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work
          mkdir -p incoming work
          gh release download TALES-1.3.8 --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip' --dir incoming
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip -d work
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          chmod +x "$ROOT/gradlew"
          python3 -m pip install --quiet pillow
          python3 tales-1.3.14-transform.py "$ROOT"
          python3 tales-1.3.16d-transform.py "$ROOT" | tee /tmp/tales-transform-1316d.txt
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and run full regression plus profile lifecycle
        working-directory: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew compileDebugKotlin testDebugUnitTest --stacktrace --no-daemon
          ! grep -R 'failures="[1-9]' app/build/test-results/testDebugUnitTest/*.xml
          ! grep -R 'errors="[1-9]' app/build/test-results/testDebugUnitTest/*.xml
          test -f app/build/test-results/testDebugUnitTest/TEST-com.braseiro.talesvtt.game.FloodProfileLifecycleV1316Test.xml
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          total=failed=errors=0
          for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(p).getroot(); total+=int(r.attrib.get('tests',0)); failed+=int(r.attrib.get('failures',0)); errors+=int(r.attrib.get('errors',0))
          print(f'UNIT_TOTAL={total} FAILURES={failed} ERRORS={errors}')
          assert failed==0 and errors==0 and total>=98
          PY

      - name: Save cumulative checkpoint
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          DEST=audit/tales-1.3.16-dev-current
          rm -rf "$DEST"
          mkdir -p "$DEST/java/com/braseiro/talesvtt/game" "$DEST/java/com/braseiro/talesvtt/data" "$DEST/java/com/braseiro/talesvtt/screens" "$DEST/java/com/braseiro/talesvtt/navigation" "$DEST/test/java/com/braseiro/talesvtt/game"
          cp /tmp/tales-transform-1316d.txt "$DEST/transform.txt"
          for f in CanonicalTalesRules.kt CanonicalFloodRules.kt RulesProfile.kt TalesCore.kt GameSnapshotCodec.kt GameViewModel.kt MotorBarbaraContract.kt MotorBarbaraTransport.kt MotorBarbaraWireAdapter.kt GmPrivateSnapshotCodec.kt RandomKidFactory.kt RandomTeenFactory.kt; do cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/$f" "$DEST/java/com/braseiro/talesvtt/game/"; done
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/data/KidJsonCodec.kt" "$DEST/java/com/braseiro/talesvtt/data/"
          for f in MenuScreen.kt KidScreen.kt TroubleScreen.kt EndingScreen.kt; do cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/screens/$f" "$DEST/java/com/braseiro/talesvtt/screens/"; done
          cp "$ROOT/app/src/main/java/com/braseiro/talesvtt/navigation/AppNavGraph.kt" "$DEST/java/com/braseiro/talesvtt/navigation/"
          for f in FloodProfileFoundationV1316Test.kt FloodCoreMechanicsV1316Test.kt FloodProfileLifecycleV1316Test.kt ThirtyThreeSessionSimulationV1315Test.kt; do cp "$ROOT/app/src/test/java/com/braseiro/talesvtt/game/$f" "$DEST/test/java/com/braseiro/talesvtt/game/"; done
          cp "$ROOT/TALES_RETOMADA_CURRENT.md" "$DEST/TALES_RETOMADA_CURRENT.md"
          printf '\n## Evidência executada — 1.3.16d\n- compileDebugKotlin: PASS no workflow %s.\n- regressão Tales + Flood profile lifecycle: PASS.\n- nenhum APK publicado.\n' "$GITHUB_RUN_ID" >> "$DEST/TALES_RETOMADA_CURRENT.md"
          cp "$DEST/TALES_RETOMADA_CURRENT.md" TALES_RETOMADA_CURRENT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST" TALES_RETOMADA_CURRENT.md
          git commit -m 'Checkpoint Tales Flood 1.3.16d profile selection' || exit 0
          git push
