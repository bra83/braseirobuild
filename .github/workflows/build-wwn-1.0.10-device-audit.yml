name: Build WWN 1.0.10 Device Audit

on:
  push:
    branches: [wwn-source-105-bridge]
    paths:
      - ".github/workflows/build-wwn-1.0.10-device-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout current WWN source
        uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run physical-device complaint regression gate
        run: node tools/wwn_device_audit_gate.mjs

      - name: Validate production JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; count=$((count+1)); done < <(find app/src/main/assets/www -type f -name '*.js' -print0)
          echo "WWN_JS_SYNTAX_PASS=$count"
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('app/src/main/assets/www').rglob('*.json'))
          for p in files: json.loads(p.read_text(encoding='utf-8'))
          print(f'WWN_JSON_PARSE_PASS={len(files)}')
          PY
          grep -q 'versionCode = 110' app/build.gradle.kts
          grep -q 'versionName = "1.0.10"' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android /opt /home/runner -type f -name sdkmanager -perm -111 2>/dev/null | head -n1 || true)"
          fi
          test -n "$SDKMANAGER"
          SDK_ROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test assembleDebug --stacktrace --no-daemon

      - name: Collect and hash APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" out/BRASEIRO_WWN_v1.0.10.apk
          unzip -t out/BRASEIRO_WWN_v1.0.10.apk >/dev/null
          sha256sum out/BRASEIRO_WWN_v1.0.10.apk | tee out/BRASEIRO_WWN_v1.0.10.apk.sha256
          stat -c 'APK_SIZE_BYTES=%s' out/BRASEIRO_WWN_v1.0.10.apk

      - name: Publish APK to source branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp out/BRASEIRO_WWN_v1.0.10.apk delivery/BRASEIRO_WWN_v1.0.10.apk
          cp out/BRASEIRO_WWN_v1.0.10.apk.sha256 delivery/BRASEIRO_WWN_v1.0.10.apk.sha256
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add delivery/BRASEIRO_WWN_v1.0.10.apk delivery/BRASEIRO_WWN_v1.0.10.apk.sha256
          git commit -m "build: publish WWN 1.0.10 audited APK"
          git push origin HEAD:wwn-source-105-bridge

      - name: Publish visible APK on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/wwn-main
          git worktree add /tmp/wwn-main origin/main
          cd /tmp/wwn-main
          git switch -c publish-wwn-110
          mkdir -p delivery
          cp "$GITHUB_WORKSPACE/out/BRASEIRO_WWN_v1.0.10.apk" BRASEIRO_WWN_v1.0.10.apk
          cp "$GITHUB_WORKSPACE/out/BRASEIRO_WWN_v1.0.10.apk" delivery/BRASEIRO_WWN_v1.0.10.apk
          cp "$GITHUB_WORKSPACE/out/BRASEIRO_WWN_v1.0.10.apk.sha256" delivery/BRASEIRO_WWN_v1.0.10.apk.sha256
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add BRASEIRO_WWN_v1.0.10.apk delivery/BRASEIRO_WWN_v1.0.10.apk delivery/BRASEIRO_WWN_v1.0.10.apk.sha256
          git commit -m "release: publish BRASEIRO WWN v1.0.10 audited APK"
          git push origin HEAD:main
