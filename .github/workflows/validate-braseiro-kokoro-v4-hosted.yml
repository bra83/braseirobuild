name: Validate Braseiro Kokoro V4 Hosted

on:
  push:
    branches:
      - sherpa-kokoro-ptbr
    paths:
      - 'tools/patch_braseiro_kokoro_ptbr_v4.ps1'
      - '.github/workflows/validate-braseiro-kokoro-v4-hosted.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare dedicated engine
        shell: powershell
        run: |
          .\tools\patch_braseiro_kokoro_ptbr_v4.ps1 -WorkDir "$env:RUNNER_TEMP\braseiro-kokoro-ptbr-v4"
      - name: Compile
        shell: powershell
        working-directory: ${{ runner.temp }}\braseiro-kokoro-ptbr-v4
        run: |
          .\gradlew.bat :app:assembleDebug --stacktrace --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Gradle failed" }
      - name: Verify package and embedded asset
        shell: powershell
        run: |
          $apk = "$env:RUNNER_TEMP\braseiro-kokoro-ptbr-v4\app\build\outputs\apk\debug\app-debug.apk"
          if (-not (Test-Path $apk)) { throw "APK missing" }
          $aapt = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Recurse -Filter aapt.exe | Sort-Object FullName -Descending | Select-Object -First 1
          $badging = & $aapt.FullName dump badging $apk
          if (($badging -join "`n") -notmatch "package: name='com\.braseiro\.kokoro\.ptbr'") { throw "wrong package" }
          if (-not ((& jar tf $apk) -contains 'assets/braseiro-kokoro-pt.zip')) { throw "embedded model missing" }
          Write-Host "HOSTED_V4_COMPILE_PASS"
