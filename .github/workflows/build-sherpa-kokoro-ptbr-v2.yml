name: Build Sherpa Kokoro PT-BR Flow Fix V2

on:
  push:
    branches:
      - sherpa-kokoro-ptbr
    paths:
      - 'tools/patch_jing332_kokoro_ptbr_v2.ps1'
      - '.github/workflows/build-sherpa-kokoro-ptbr-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA runner, got $env:RUNNER_NAME" }

          $candidates = @()
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          $candidates += 'C:\actions-runner\android-sdk'
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }

          $sdkRoot = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sdkRoot) { throw 'Android SDK not found on BRELGA' }

          $sdkmanager = Get-ChildItem $sdkRoot -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdkmanager) { throw "sdkmanager.bat not found under $sdkRoot" }

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          1..100 | ForEach-Object { 'y' } | & $sdkmanager.FullName --licenses | Out-Null
          & $sdkmanager.FullName 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package install failed' }

      - name: Prepare updated jing332 engine
        shell: powershell
        run: |
          .\tools\patch_jing332_kokoro_ptbr.ps1

      - name: Build APK
        shell: powershell
        working-directory: ${{ runner.temp }}\jing332-sherpa-kokoro
        run: |
          .\gradlew.bat :app:assembleDebug --stacktrace --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed with $LASTEXITCODE" }

      - name: Validate APK
        id: apk
        shell: powershell
        run: |
          $apk = Join-Path $env:RUNNER_TEMP 'jing332-sherpa-kokoro\app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path $apk)) { throw 'APK not found' }

          $out = Join-Path $env:RUNNER_TEMP 'sherpa-kokoro-output'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dest = Join-Path $out 'Sherpa-Kokoro-PTBR-FlowFix-V2-debug.apk'
          Copy-Item $apk $dest -Force

          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Sherpa-Kokoro-PTBR-FlowFix-V2-debug.apk" | Set-Content (Join-Path $out 'SHA256.txt') -Encoding ascii
          Write-Host "APK=$dest"
          Write-Host "SHA256=$hash"
          "path=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify install-over-existing compatibility
        shell: powershell
        env:
          NEW_APK: ${{ steps.apk.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP 'Sherpa-Kokoro-PTBR-1.13.8-debug-old.apk'
          & curl.exe -L --fail --retry 4 --retry-delay 2 -o $old "https://github.com/bra83/braseirobuild/releases/download/sherpa-kokoro-ptbr-v1/Sherpa-Kokoro-PTBR-1.13.8-debug.apk"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $old)) { throw 'Could not download working baseline APK' }

          $sdkRoot = $env:ANDROID_SDK_ROOT
          $apksigner = Get-ChildItem $sdkRoot -Recurse -Filter apksigner.bat -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $apksigner) { throw 'apksigner.bat not found' }

          $oldInfo = & $apksigner.FullName verify --verbose --print-certs $old 2>&1
          $newInfo = & $apksigner.FullName verify --verbose --print-certs $env:NEW_APK 2>&1

          $oldDigestLine = $oldInfo | Where-Object { $_ -match 'certificate SHA-256 digest:' } | Select-Object -First 1
          $newDigestLine = $newInfo | Where-Object { $_ -match 'certificate SHA-256 digest:' } | Select-Object -First 1
          if (-not $oldDigestLine -or -not $newDigestLine) { throw 'Could not read signing certificate digest' }

          $oldDigest = ($oldDigestLine -split ':', 2)[1].Trim()
          $newDigest = ($newDigestLine -split ':', 2)[1].Trim()
          Write-Host "OLD_CERT=$oldDigest"
          Write-Host "NEW_CERT=$newDigest"
          if ($oldDigest -ne $newDigest) { throw 'Signing certificate mismatch' }

          $oldHash = (Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($oldHash -ne '38f8b29534f24b8e53aec9796295ea3027c28aff89c4edc6af22b7c626a1d12a') { throw "Unexpected old APK SHA256: $oldHash" }

          Write-Host 'PASS: same signing certificate as working 1.26.092312_debug baseline.'

      - name: Publish APK to GitHub Release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'sherpa-kokoro-ptbr-flow-v2'
          $assetName = 'Sherpa-Kokoro-PTBR-FlowFix-V2-debug.apk'
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-sherpa-publisher'
          }

          $release = $null
          try {
            $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }

          if (-not $release) {
            $body = @{
              tag_name = $tag
              target_commitish = 'sherpa-kokoro-ptbr'
              name = 'Sherpa Kokoro PT-BR Flow Fix V2'
              body = "Flow Fix V2 sobre a mesma base que gerou 1.26.092312_debug: upstream fixado em 5d91a72, modelo externo preservado, maxNumSentences=2, silenceScale=0.06, 4 threads reais, Kokoro residente, prewarm assíncrono, streaming imediato e proteção do primeiro fonema. Vozes Dora 42, Alex 43, Santa 44. SHA256: $env:APK_SHA256"
              draft = $false
              prerelease = $true
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$repo/releases"
          }

          $existing = @($release.assets) | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if ($existing) {
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" | Out-Null
          }

          $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$assetName"
          $curlArgs = @(
            '-L','--fail','--retry','4','--retry-delay','3',
            '-X','POST',
            '-H',"Authorization: Bearer $env:GITHUB_TOKEN",
            '-H','Accept: application/vnd.github+json',
            '-H','X-GitHub-Api-Version: 2022-11-28',
            '-H','Content-Type: application/vnd.android.package-archive',
            '--data-binary',"@$env:APK_PATH",
            $uploadUrl
          )
          & curl.exe @curlArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }

          Write-Host "Release=$($release.html_url)"
