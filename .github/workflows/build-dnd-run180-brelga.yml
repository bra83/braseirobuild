name: Braseiro DnD 6.6.2 RUN180 BRELGA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-dnd-run180-brelga.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: 'DND-6.6.2-RUN180'
  APK_NAME: 'BRASEIRO_DND_6.6.2_RUN180_DEBUG.apk'
  PACKAGE_ID: 'com.braseiro.dnd5e'
  BASELINE_SHA256: '2acf32fe57437c5d2472f7a65104791828a5305f44fb722ee545af0a01a52937'
  OVERLAY_SHA256: '731731a1ddcf2e91167fb47695ab8d0c2ca505c97edc2db94e5149f104183c21'
  FIRE_API: 'https://api.firestorage.ai/dev/file'
  OVERLAY_SHARE_ID: '_CHpy1eoPVry'
  OVERLAY_FILE_ID: '01a10f706b8b745f8897888b4ab8d692'

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Confirm BRELGA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Runner incorreto: $env:RUNNER_NAME" }

      - name: Reconstruct frozen DnD baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='C:\DND180'
          $incoming="$base\incoming"
          $work="$base\work"
          $out="$base\out"
          Remove-Item $base -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $incoming,$work,$out | Out-Null

          function Fetch-Share([string]$share,[string]$dest) {
            $list=Invoke-RestMethod -Uri "$env:FIRE_API/shares/$share/files?maxResults=1000" -Method Get
            if (-not $list.files -or $list.files.Count -lt 1) { throw "Share vazio: $share" }
            $fid=$list.files[0].fileId
            $dl=Invoke-RestMethod -Uri "$env:FIRE_API/shares/$share/files/$fid/download" -Method Post
            if (-not $dl.downloadUrl) { throw "downloadUrl ausente: $share" }
            Invoke-WebRequest -Uri $dl.downloadUrl -OutFile $dest
          }

          $shares=@('QRFGq33xocDC','v7WCbOWJt2l0','tyVmjxfKwbWS','JtFk5UVAOYbD','PQpyJskFB702')
          $hashes=@(
            '7799a6d20fa5b0f362cf4ab386139c31130b5807da44afd4841b9b6bb8fe2ac6',
            '06864dd74d1c3ef62a2010210cbd63275bd3046476d7c1e1af3b15ed6bdeb61d',
            '86534362f7892834b7de98e154a6d122bf7e73f95cb2d6a80d8c2884c9434ebc',
            '8ba61dc700efc75aa1499621cd502ed46bab5e0f59952850aad5c89af3f5d7d5',
            'c3984239c2db218db020180c71a67069276abe6c0ea8f8085a0c1cee0131e5fc'
          )
          $parts=@()
          for($i=0;$i -lt $shares.Count;$i++){
            $p=Join-Path $incoming ("part.{0:D2}" -f $i)
            Fetch-Share $shares[$i] $p
            $got=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
            if($got -ne $hashes[$i]){throw "Baseline part $i SHA mismatch: $got"}
            $parts += $p
          }

          $zip=Join-Path $incoming 'baseline.zip'
          $o=[IO.File]::Create($zip)
          foreach($p in $parts){$s=[IO.File]::OpenRead($p);$s.CopyTo($o);$s.Dispose()}
          $o.Dispose()
          $got=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($got -ne $env:BASELINE_SHA256){throw "Baseline SHA mismatch: $got"}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead($zip);$z.Dispose()
          Expand-Archive $zip $work -Force

          $root=Join-Path $work 'BRASEIRO_DND_6.6.2_ANDROID_STUDIO'
          if(!(Test-Path "$root\android\gradlew.bat")){throw 'Baseline Android Studio inválida'}
          "ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download and apply exact RUN180 overlay
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dl=Invoke-RestMethod -Uri "$env:FIRE_API/shares/$env:OVERLAY_SHARE_ID/files/$env:OVERLAY_FILE_ID/download" -Method Post
          if(-not $dl.downloadUrl){throw 'RUN180 overlay downloadUrl ausente'}
          $overlay='C:\DND180\incoming\RUN180_ANDROID_OVERLAY.tar.gz'
          Invoke-WebRequest -Uri $dl.downloadUrl -OutFile $overlay
          $got=(Get-FileHash $overlay -Algorithm SHA256).Hash.ToLowerInvariant()
          if($got -ne $env:OVERLAY_SHA256){throw "RUN180 overlay SHA mismatch: $got"}

          $javaRoot="$env:ROOT\android\app\src\main\java\com\braseiro\dnd5e"
          Remove-Item $javaRoot -Recurse -Force -ErrorAction SilentlyContinue
          tar -xzf $overlay -C $env:ROOT
          if($LASTEXITCODE -ne 0){throw 'Falha ao extrair RUN180 overlay'}

          $vp="$env:ROOT\version.properties"
          $txt=Get-Content $vp -Raw
          if($txt -match '(?m)^VERSION_NAME='){ $txt=[regex]::Replace($txt,'(?m)^VERSION_NAME=.*$','VERSION_NAME=6.6.2-r180') } else { $txt=('VERSION_NAME=6.6.2-r180'+[Environment]::NewLine+$txt) }
          if($txt -match '(?m)^VERSION_CODE='){ $txt=[regex]::Replace($txt,'(?m)^VERSION_CODE=.*$','VERSION_CODE=606280') } else { $txt=('VERSION_CODE=606280'+[Environment]::NewLine+$txt) }
          [IO.File]::WriteAllText($vp,$txt,(New-Object Text.UTF8Encoding($false)))

          $build="$env:ROOT\android\app\build.gradle.kts"
          if(!(Select-String -Quiet -Path $build -Pattern 'applicationId = "com.braseiro.dnd5e"')){throw 'applicationId incorreto'}
          if(!(Test-Path "$javaRoot\SageAdvice2025RulesEngine.java")){throw 'XSAC RUN180 ausente'}
          if(!(Select-String -Quiet -Path "$javaRoot\AndroidTtsBackend.java" -Pattern 'Braseiro Kokoro PT-BR')){throw 'Kokoro contract ausente'}
          if(!(Select-String -Quiet -Path "$javaRoot\SageAdvice2025RulesEngine.java" -Pattern 'auto_rolls')){throw 'auto_rolls contract ausente'}
          Write-Host 'RUN180_OVERLAY_APPLIED=YES'

      - name: Prepare Java and Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(!(Get-Command java.exe -ErrorAction SilentlyContinue)){
            $j='C:\Program Files\Android\Android Studio\jbr'
            if(Test-Path "$j\bin\java.exe"){$env:JAVA_HOME=$j;$env:Path="$j\bin;$env:Path"}
          }
          if(!(Get-Command java.exe -ErrorAction SilentlyContinue)){throw 'Java não encontrado no BRELGA'}
          if(!$env:ANDROID_HOME){
            $sdk="$env:LOCALAPPDATA\Android\Sdk"
            if(Test-Path $sdk){$env:ANDROID_HOME=$sdk}
          }
          if(!$env:ANDROID_HOME -or !(Test-Path $env:ANDROID_HOME)){throw 'ANDROID_HOME não encontrado no BRELGA'}
          "JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_HOME=$env:ANDROID_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          java -version

      - name: Compile Java
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:ROOT\android"
          .\gradlew.bat :app:compileDebugJavaWithJavac --no-daemon --console=plain 2>&1 | Tee-Object "$env:OUT\JAVAC_RUN180.log"
          if($LASTEXITCODE -ne 0){throw 'compileDebugJavaWithJavac falhou'}

      - name: Assemble debug APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:ROOT\android"
          .\gradlew.bat :app:assembleDebug --no-daemon --console=plain 2>&1 | Tee-Object "$env:OUT\GRADLE_BUILD_RUN180.log"
          if($LASTEXITCODE -ne 0){throw 'assembleDebug falhou'}

      - name: Validate RUN180 APK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $apk=Get-ChildItem "$env:ROOT\android\app\build\outputs\apk\debug" -Filter *.apk | Select-Object -First 1
          if(!$apk){throw 'APK ausente'}
          $final="$env:OUT\$env:APK_NAME"
          Copy-Item $apk.FullName $final -Force

          $bt=Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object {[version]$_.Name} -Descending | Select-Object -First 1
          if(!$bt){throw 'Android build-tools ausente'}
          $badging=(& "$($bt.FullName)\aapt.exe" dump badging $final) -join [Environment]::NewLine
          Set-Content "$env:OUT\APK_BADGING_RUN180.txt" $badging
          if($badging -notmatch "package: name='com\.braseiro\.dnd5e'"){throw 'package badging incorreto'}
          if($badging -notmatch "versionCode='606280'"){throw 'versionCode badging incorreto'}
          if($badging -notmatch "versionName='6\.6\.2-r180-debug'"){throw 'versionName badging incorreto'}

          & "$($bt.FullName)\apksigner.bat" verify --verbose --print-certs $final 2>&1 | Tee-Object "$env:OUT\APK_SIGNATURE_RUN180.txt"
          if($LASTEXITCODE -ne 0){throw 'apksigner falhou'}
          $z=[IO.Compression.ZipFile]::OpenRead($final);$z.Dispose()
          $sha=(Get-FileHash $final -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $env:APK_NAME" | Set-Content "$env:OUT\$env:APK_NAME.sha256" -Encoding ascii
          @(
            "RUNNER_NAME=$env:RUNNER_NAME",
            'PACKAGE=com.braseiro.dnd5e',
            'VERSION_NAME=6.6.2-r180-debug',
            'VERSION_CODE=606280',
            "APK_SHA256=$sha"
          ) | Set-Content "$env:OUT\RUN180_BUILD_PROOF.txt" -Encoding utf8
          Write-Host "APK_SHA256=$sha"

      - name: Publish RUN180 GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){
            gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Braseiro DnD 6.6.2 RUN180' --notes 'RUN180 final Android build compiled and validated on self-hosted BRELGA.'
          }
          Get-ChildItem $env:OUT -File | ForEach-Object { gh release upload $env:TAG --repo $env:GITHUB_REPOSITORY $_.FullName --clobber }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json url,tagName,name,assets

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_DND_6.6.2_RUN180_BRELGA
          path: C:\DND180\out\*
          if-no-files-found: error
