name: Braseiro DnD 6.6.2 RUN180 BRELGA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-dnd-run180-brelga.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build RUN180 complete source
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Runner incorreto: $env:RUNNER_NAME" }
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          $base='C:\DND180'; $incoming="$base\incoming"; $extract="$base\extract"; $out="$base\out"
          Remove-Item $base -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $incoming,$extract,$out | Out-Null
          $urls=@(
            'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-8840-81fa-a0cf-d1f079d38e6b/raw?se=2026-10-06T04%3A19%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=33f143a9-a40d-5ffb-8bcb-3bbb7ef72b81&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A16%3A33Z&ske=2026-10-07T02%3A16%3A33Z&sks=b&skv=2026-02-06&sig=UrpQ/TqlW0EndDgyaXDvDS%2BexNu3ia5OqskCEJaPI3k%3D',
            'https://sdmntprnznorth.oaiusercontent.com/files/00000000-09fc-820b-800b-30455f3ad323/raw?se=2026-10-06T04%3A19%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=4cebdac3-3320-530c-957d-ea04e2c90e75&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A47%3A28Z&ske=2026-10-07T02%3A47%3A28Z&sks=b&skv=2026-02-06&sig=MnHlfSSM6RJO32lgh3hJJAFY%2BNxMgjkfksc4IvZaVPI%3D',
            'https://sdmntprwestus.oaiusercontent.com/files/00000000-0ec8-8230-a786-b71c383fbdeb/raw?se=2026-10-06T04%3A20%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=2d8910db-cfbd-5888-bdb3-7b8b787d8c3c&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A59%3A39Z&ske=2026-10-07T01%3A59%3A39Z&sks=b&skv=2026-02-06&sig=GOms2NM8J4zvNl912cvEARbf8Y2EPtV9qNBeJzW0E0Y%3D',
            'https://sdmntprnznorth.oaiusercontent.com/files/00000000-854c-820b-8e26-2ccf87d9fd55/raw?se=2026-10-06T04%3A20%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=c5c606a0-919a-5011-abe8-21f5e8c79623&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A47%3A29Z&ske=2026-10-07T02%3A47%3A29Z&sks=b&skv=2026-02-06&sig=7zwkbvICANA3C/VLnkrGWByzK%2B2w9m6T9L6Mia3qL/A%3D',
            'https://sdmntprwestus.oaiusercontent.com/files/00000000-f1b8-8230-bcc0-e5609b1a0542/raw?se=2026-10-06T04%3A20%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=f7d70806-38cf-5309-91da-9fbd09ecbc19&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A52%3A02Z&ske=2026-10-07T01%3A52%3A02Z&sks=b&skv=2026-02-06&sig=rFeHmC%2BQKF8VR56wqcY1jxyPFwbpMT4s%2BmR%2BvzvpaC0%3D',
            'https://sdmntprnznorth.oaiusercontent.com/files/00000000-2f48-820b-8f4e-dd60931d397a/raw?se=2026-10-06T04%3A20%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=54cce3e2-1b5c-5b2a-91cf-2d67be6bcca7&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A59%3A35Z&ske=2026-10-07T01%3A59%3A35Z&sks=b&skv=2026-02-06&sig=9HQiY/jggxJ5EuwsHkjf69TvAaEgLxMk2dBEMUDIMkM%3D',
            'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-97e0-81fa-b80c-57515b686fd5/raw?se=2026-10-06T04%3A20%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=eb65841d-d92d-5e66-88de-b0c69578f940&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A47%3A11Z&ske=2026-10-07T02%3A47%3A11Z&sks=b&skv=2026-02-06&sig=uQEo7ZoWIQBmAJge8b6ZCTa0MxkBTD0jDSwTAuhH%2BjY%3D'
          )
          $hashes=@('8dd31da8d9c9805aca05f2b3a19a80d4e35c3dba2d0eaa62bdec8e5ced6be9eb','3b3bc483807b372a193c7e12ef8917254ca7e070775fb570b6f76176090cf687','a50528b062123f767df13e18fb3cda7026a2cf1c93ec1ecb60132f49a62dc2d0','797a1c097cf43526d732caf9eded2993e3dcd82e940001cb742bb0ce3d0bbfe9','2e28a84895d5d3ebdddae5dca4e7edbc0944d02ea128586be8142b28f7b9b506','7640d597596bb49957f06268e37b8c0fb68cd8acf8dbdc3b3f5b916c02fccc17','8469336040fe3dc2d45128c7d2c4d5dce293c26ac57d97021efa5700856ed068')
          $parts=@()
          for($i=0;$i -lt 7;$i++){ $p="$incoming\part{0:D2}" -f $i; Invoke-WebRequest $urls[$i] -OutFile $p; if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hashes[$i]){throw "part $i SHA"}; $parts += $p }
          $zip="$incoming\BRASEIRO_DND_6.6.2_RUN180_ANDROID_STUDIO.zip"; $o=[IO.File]::Create($zip); foreach($p in $parts){$s=[IO.File]::OpenRead($p);$s.CopyTo($o);$s.Dispose()};$o.Dispose()
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2013bccf5e12e006ddbc3e644177613bc405e6bc828b18f52a2cdd5ebc5aa078'){throw 'final source SHA'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem; $z=[IO.Compression.ZipFile]::OpenRead($zip);$z.Dispose(); Expand-Archive $zip $extract -Force
          $gradle=Get-ChildItem $extract -Recurse -Filter gradlew.bat | Where-Object {$_.Directory.Name -eq 'android'} | Select-Object -First 1; if(!$gradle){throw 'android/gradlew.bat ausente'}; $android=$gradle.Directory.FullName; $root=Split-Path $android -Parent; Write-Host "SOURCE_ROOT=$root"
          [IO.File]::WriteAllText("$root\version.properties","VERSION_NAME=6.6.2-r180`nVERSION_CODE=606280`n",(New-Object Text.UTF8Encoding($false)))
          $buildFile="$android\app\build.gradle.kts"; if(!(Test-Path $buildFile)){throw 'app build.gradle.kts ausente'}; if(!(Select-String -Quiet -Path $buildFile -Pattern 'com.braseiro.dnd5e')){throw 'package contract'}
          if(!(Get-Command java.exe -ErrorAction SilentlyContinue)){$j='C:\Program Files\Android\Android Studio\jbr';if(Test-Path "$j\bin\java.exe"){$env:JAVA_HOME=$j;$env:Path="$j\bin;$env:Path"}}
          if(!$env:ANDROID_HOME){$s="$env:LOCALAPPDATA\Android\Sdk";if(Test-Path $s){$env:ANDROID_HOME=$s}};$env:ANDROID_SDK_ROOT=$env:ANDROID_HOME
          Set-Location $android; .\gradlew.bat :app:compileDebugJavaWithJavac --no-daemon --console=plain 2>&1 | Tee-Object "$out\JAVAC_RUN180.log"; if($LASTEXITCODE -ne 0){throw 'compileDebugJavaWithJavac falhou'}
          .\gradlew.bat :app:assembleDebug --no-daemon --console=plain 2>&1 | Tee-Object "$out\GRADLE_BUILD_RUN180.log"; if($LASTEXITCODE -ne 0){throw 'assembleDebug falhou'}
          $apk=Get-ChildItem "$android\app\build\outputs\apk\debug" -Filter *.apk | Select-Object -First 1;if(!$apk){throw 'APK ausente'};$final="$out\BRASEIRO_DND_6.6.2_RUN180_DEBUG.apk";Copy-Item $apk.FullName $final
          $bt=Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory|Sort-Object Name -Descending|Select-Object -First 1;$badging=(& "$($bt.FullName)\aapt.exe" dump badging $final)-join "`n";Set-Content "$out\APK_BADGING_RUN180.txt" $badging
          if($badging -notmatch "package: name='com\.braseiro\.dnd5e'" -or $badging -notmatch "versionCode='606280'" -or $badging -notmatch "versionName='6\.6\.2-r180-debug'"){throw 'badging contract'}
          & "$($bt.FullName)\apksigner.bat" verify --verbose --print-certs $final 2>&1|Tee-Object "$out\APK_SIGNATURE_RUN180.txt";if($LASTEXITCODE -ne 0){throw 'apksigner'};$za=[IO.Compression.ZipFile]::OpenRead($final);$za.Dispose()
          $sha=(Get-FileHash $final -Algorithm SHA256).Hash.ToLowerInvariant();"$sha  BRASEIRO_DND_6.6.2_RUN180_DEBUG.apk"|Set-Content "$out\BRASEIRO_DND_6.6.2_RUN180_DEBUG.apk.sha256" -Encoding ascii
          $tag='DND-6.6.2-RUN180';gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null;if($LASTEXITCODE -ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Braseiro DnD 6.6.2 RUN180' --notes 'RUN180 final Android build on BRELGA.'};gh release upload $tag --repo $env:GITHUB_REPOSITORY "$out\*" --clobber
          Write-Host "APK_SHA256=$sha"
