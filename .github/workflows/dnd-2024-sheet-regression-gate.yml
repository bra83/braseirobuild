name: D&D 2024 Inventory and Scene Reliability APK — gated RC
on:
  push:
    branches: [fix/dnd-6639-inventory-integrated-20261101, fix/dnd-6641-scene-options-ui-stalls-20261101, fix/dnd-6642-actions-android-gemini-dialogue-20261101]
  pull_request:
    paths:
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/Character2024SheetReconciler.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/CharacterSheetGenerator.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/Core2024EberronCharacterEngine.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/MainActivity.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/SceneOptionDiversifier.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/SceneOptionQualityRegressionTest.java'
      - 'dnd-normal/run247-mod005/version.properties'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/AppDb.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/CharacterRulesValidator.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/CharacterInventory2024.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/InventoryTransactions2024.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/InventoryPersistence2024.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/InventoryPersistence2024Test.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/MasterInventoryStateUpdate2024.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/MasterInventoryStateUpdate2024Test.java'
      - 'dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/InventoryLedgerEngine.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/CharacterInventory2024Test.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/Character2024SheetReconcilerTest.java'
      - 'dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/Character2024SheetDatabaseTest.java'
      - '.github/workflows/dnd-2024-sheet-regression-gate.yml'
  workflow_dispatch:

concurrency:
  group: dnd2024-sheet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sheet-2024:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout D&D only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 with absolute sdkmanager
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compile Java safely (do not create an APK)
        working-directory: dnd-normal/run247-mod005
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --console=plain
      - name: 2024 golden fixture and engine regression
        working-directory: dnd-normal/run247-mod005
        run: |
          ./gradlew :app:testDebugUnitTest --tests com.braseiro.dnd5e.Character2024SheetReconcilerTest \
            --tests com.braseiro.dnd5e.Character2024SheetDatabaseTest \
            --tests com.braseiro.dnd5e.CharacterInventory2024Test \
            --tests com.braseiro.dnd5e.InventoryPersistence2024Test \
            --tests com.braseiro.dnd5e.MasterInventoryStateUpdate2024Test \
            -Pbraseiro.qaLiteAssets=true --no-daemon --console=plain
      - name: Full D&D JVM regression (all tests except two mapped archive tests)
        working-directory: dnd-normal/run247-mod005
        timeout-minutes: 30
        run: |
          # qaLite excludes only the two map-archive integration tests; all other
          # 2024, persistence, narrative, import and combat regressions run.
          ./gradlew :app:testDebugUnitTest -Pbraseiro.qaLiteAssets=true --no-daemon --console=plain
      - name: Verify bundled Faerun archive with full Android assets (two real-map tests)
        working-directory: dnd-normal/run247-mod005
        timeout-minutes: 25
        run: |
          # Run exactly the two tests omitted from the preceding lightweight suite.
          # The real original 100 MB ZIP is mounted for these two, not for 3000 tests.
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.braseiro.dnd5e.Issue27MapAndOAuthIntegrationTest.testBundledFaerunAssetLocationAndPresence' \
            --tests 'com.braseiro.dnd5e.Issue27MapAndOAuthIntegrationTest.testFaerunManifestGeometryParsing' \
            --no-daemon --console=plain
      - name: Assemble signed Android debug APK after all gates pass
        working-directory: dnd-normal/run247-mod005
        timeout-minutes: 40
        run: |
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Validate installable upgrade, signer and real Faerun map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out baseline
          gh release download dnd-6.6.39-dialogue-alignment-leak-20261031 --pattern SIGNATURE.txt --pattern BADGING.txt --dir baseline
          APK="$(find dnd-normal/run247-mod005/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -s "$APK"
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' dnd-normal/run247-mod005/version.properties)"
          if [[ "$VERSION_NAME" == "6.6.40-dnd2024-inventory-20261101" ]]; then
            DND_APK_NAME="BRASEIRO_DND_6.6.40_INVENTARIO_2024.apk"
          else
            DND_APK_NAME="BRASEIRO_DND_${VERSION_NAME//[^[:alnum:]._-]/_}.apk"
          fi
          export DND_APK_NAME
          echo "DND_APK_NAME=$DND_APK_NAME" >> "$GITHUB_ENV"
          cp "$APK" "out/$DND_APK_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "out/$DND_APK_NAME" > out/BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "out/$DND_APK_NAME" > out/SIGNATURE.txt
          python3 - <<'PY'
          from pathlib import Path
          import os,re,zipfile
          props=dict(line.split('=',1) for line in
              Path('dnd-normal/run247-mod005/version.properties').read_text().splitlines()
              if '=' in line and not line.startswith('#'))
          pattern=r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'"
          old=re.search(pattern,Path('baseline/BADGING.txt').read_text())
          new=re.search(pattern,Path('out/BADGING.txt').read_text())
          assert old and new, 'APK_BADGING_UNREADABLE'
          assert old[1]==new[1]=='com.braseiro.dnd5e', 'APPLICATION_ID_CHANGED'
          assert int(new[2])==int(props['VERSION_CODE']), 'APK_VERSION_CODE_NOT_CONFIGURED'
          assert int(new[2])>int(old[2]), 'ANDROID_UPGRADE_VERSION_NOT_GREATER'
          assert new[3]==props['VERSION_NAME']+'-debug', 'APK_VERSION_NAME_NOT_CONFIGURED'
          cert=r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]+)'
          prior=re.search(cert,Path('baseline/SIGNATURE.txt').read_text())
          current=re.search(cert,Path('out/SIGNATURE.txt').read_text())
          assert prior and current and prior[1].lower()==current[1].lower(),'SIGNER_CHANGED_UPGRADE_BLOCKED'
          apk=Path('out')/os.environ['DND_APK_NAME']
          with zipfile.ZipFile(apk) as z:
              assert any(n.endswith('assets/maps/PACOTE_MAPA_FAERUN_2025_PTBR_MAX_V2.zip') for n in z.namelist()),'REAL_FAERUN_MAP_MISSING'
          p=Path('dnd-normal/run247-mod005/version.properties').read_text()
          assert 'DB_SCHEMA=61' in p and 'BACKUP_FORMAT=21' in p
          Path('out/BUILD_PROOF.txt').write_text(
              'COMMIT='+__import__('os').environ['GITHUB_SHA']+'\n'
              +'VERSION_CODE='+new[2]+'\nDB_SCHEMA=61\nBACKUP_FORMAT=21\n'
              +'SIGNER_SHA256='+current[1]+'\n'
              +'SHEET_AND_FULL_REGRESSION=PASS\nFAERUN_MAP_TESTS=PASS\n'
              +'ANDROID_PHYSICAL_TEST=NOT_PERFORMED\n')
          print('DND_UPGRADE_SIGNATURE_VERSION_MAP_SCHEMA_PASS: '+new[3])
          PY
          (cd out && sha256sum "$DND_APK_NAME" > "$DND_APK_NAME.sha256")
      - name: Upload validated APK candidate for Galaxy A57 acceptance
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/dnd-6641-scene-options-ui-stalls-20261101' }}
        uses: actions/upload-artifact@v4
        with:
          name: Braseiro-DND-A57-Candidate
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct 6.6.42 APK only after all gates pass
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/dnd-6642-actions-android-gemini-dialogue-20261101' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api repos/${{ github.repository }}/git/ref/heads/fix/dnd-6642-actions-android-gemini-dialogue-20261101 --jq '.object.sha')"
          test "$CURRENT" = "$GITHUB_SHA"
          test "$DND_APK_NAME" = "BRASEIRO_DND_6.6.42-actions-audio-dialogue-20261101.apk"
          TAG="dnd-6.6.42-actions-audio-dialogue-20261101"
          ! gh release view "$TAG" >/dev/null 2>&1
          gh release create "$TAG" \
            "out/$DND_APK_NAME" "out/$DND_APK_NAME.sha256" \
            out/BADGING.txt out/SIGNATURE.txt out/BUILD_PROOF.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Braseiro D&D 6.6.42 — Ações, voz Android, Gemini e diálogos" \
            --notes "APK candidato para Galaxy A57; ações sugeridas contextuais, ritmo Android 0,60x–1,60x, variação de vozes Gemini 0–100% e contrato de diálogos. Testes de compilação, regressão, assinatura e mapas em CI passaram. TTS remoto e Android físico ainda requerem homologação."
      - name: Publish validated 6.6.40 APK prerelease for physical acceptance
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fix/dnd-6639-inventory-integrated-20261101' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api repos/${{ github.repository }}/git/ref/heads/fix/dnd-6639-inventory-integrated-20261101 --jq '.object.sha')"
          test "$CURRENT" = "$GITHUB_SHA"
          TAG="dnd-6.6.40-inventario-2024-20261101"
          ! gh release view "$TAG" >/dev/null 2>&1
          gh release create "$TAG" \
            out/BRASEIRO_DND_6.6.40_INVENTARIO_2024.apk \
            out/BRASEIRO_DND_6.6.40_INVENTARIO_2024.apk.sha256 \
            out/BADGING.txt out/SIGNATURE.txt out/BUILD_PROOF.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Braseiro D&D 6.6.40 — Inventário 2024 integrado à 6.6.39" \
            --notes "APK candidato de atualização, sobre a versão 6.6.39; ficha e inventário transacionais com pesos, moedas e itens do Mestre. Testes JVM e mapa executados, assinatura e versão conferidas. Homologação física no Galaxy A57 pendente."
