name: Braseiro Universal Android Builder

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release a compilar (vazio = Release mais recente)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Escolher Release e baixar ZIP
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${MANUAL_TAG:-}"
          fi
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName -q .tagName)"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p incoming

          gh release download "$TAG" \
            --pattern '*.zip' \
            --dir incoming

          ZIP="$(find incoming -maxdepth 1 -type f -iname '*.zip' -printf '%s %p\n' \
            | sort -nr | head -n1 | cut -d' ' -f2-)"

          if [ -z "${ZIP:-}" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Nenhum ZIP encontrado na Release $TAG"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Fonte escolhida: $ZIP"
          sha256sum "$ZIP"

      - name: Extrair projeto
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q "${{ steps.source.outputs.zip }}" -d work

      - name: Detectar projeto Android
        id: detect
        run: |
          set -euo pipefail

          mapfile -t WRAPPERS < <(find work -type f -name gradlew \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' | sort)

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::Nenhum gradlew encontrado dentro do ZIP."
            exit 1
          fi

          ROOT=""
          for W in "${WRAPPERS[@]}"; do
            D="$(dirname "$W")"
            if [ -f "$D/settings.gradle.kts" ] || [ -f "$D/settings.gradle" ]; then
              ROOT="$D"
              break
            fi
          done

          if [ -z "$ROOT" ]; then
            ROOT="$(dirname "${WRAPPERS[0]}")"
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          chmod +x "$ROOT/gradlew"

          PROPS="$ROOT/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_VERSION=""
          if [ -f "$PROPS" ]; then
            GRADLE_VERSION="$(grep -oE 'gradle-[0-9]+(\.[0-9]+){1,2}' "$PROPS" \
              | head -n1 | sed 's/gradle-//')"
          fi

          JAVA=17
          if [ -n "$GRADLE_VERSION" ]; then
            MAJOR="${GRADLE_VERSION%%.*}"
            MINOR="$(echo "$GRADLE_VERSION" | cut -d. -f2)"
            if [ "$MAJOR" -lt 7 ]; then
              JAVA=11
            elif [ "$MAJOR" -eq 7 ] && [ "${MINOR:-0}" -lt 3 ]; then
              JAVA=11
            fi
          fi

          echo "gradle_version=${GRADLE_VERSION:-desconhecida}" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"

          SDK="$(grep -RhoE 'compileSdk(Version)?[[:space:]]*[= ]+[0-9]+' \
              "$ROOT" --include='*.gradle' --include='*.gradle.kts' 2>/dev/null \
              | grep -oE '[0-9]+' | sort -nr | head -n1 || true)"

          if [ -z "$SDK" ]; then
            SDK=35
          fi

          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"

          echo "Android root: $ROOT"
          echo "Gradle: ${GRADLE_VERSION:-desconhecida}"
          echo "Java: $JAVA"
          echo "compileSdk: $SDK"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.detect.outputs.java }}

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android necessária
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${{ steps.detect.outputs.sdk }}"

      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar Debug APK
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Coletar e validar APKs
        id: apk
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/APK_SAIDA"
          mkdir -p "$OUT"

          mapfile -t APKS < <(find . -type f -path '*/build/outputs/apk/*/*.apk' \
            -not -path '*/androidTest/*' | sort)

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Gradle terminou, mas nenhum APK foi encontrado."
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt \
            | sort -V | tail -n1 || true)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner \
            | sort -V | tail -n1 || true)"

          REPORT="$OUT/VALIDACAO_APK.txt"
          : > "$REPORT"

          for APK in "${APKS[@]}"; do
            NAME="$(basename "$APK")"
            cp "$APK" "$OUT/$NAME"

            echo "========================================" | tee -a "$REPORT"
            echo "APK: $NAME" | tee -a "$REPORT"
            echo "size: $(stat -c%s "$APK")" | tee -a "$REPORT"
            sha256sum "$APK" | tee -a "$REPORT"

            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$APK" \
                | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' \
                | tee -a "$REPORT" || true
            fi

            if [ -n "$APKSIGNER" ]; then
              if "$APKSIGNER" verify --verbose "$APK" >/dev/null 2>&1; then
                echo "signature: OK" | tee -a "$REPORT"
              else
                echo "signature: FAIL" | tee -a "$REPORT"
              fi
            fi
          done

          (
            cd "$OUT"
            sha256sum *.apk > SHA256SUMS.txt
          )

          echo "count=${#APKS[@]}" >> "$GITHUB_OUTPUT"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ steps.source.outputs.tag }}
          path: APK_SAIDA/*
          if-no-files-found: error
          retention-days: 30

      - name: Resumo
        run: |
          {
            echo "## Braseiro Universal Android Builder"
            echo ""
            echo "- Release: \`${{ steps.source.outputs.tag }}\`"
            echo "- ZIP: \`${{ steps.source.outputs.zip }}\`"
            echo "- Android root: \`${{ steps.detect.outputs.root }}\`"
            echo "- Gradle: \`${{ steps.detect.outputs.gradle_version }}\`"
            echo "- Java: \`${{ steps.detect.outputs.java }}\`"
            echo "- compileSdk: \`${{ steps.detect.outputs.sdk }}\`"
            echo "- APK(s): \`${{ steps.apk.outputs.count }}\`"
            echo ""
            echo "Baixe o artifact **APK-${{ steps.source.outputs.tag }}**."
          } >> "$GITHUB_STEP_SUMMARY"
