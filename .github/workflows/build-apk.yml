name: Braseiro Universal Android Builder

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release a compilar (vazio = Release mais recente)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "build-signing/**"
      - ".github/TALES_BUILD_TRIGGER"

permissions:
  contents: write

env:
  DEFAULT_TAG: "TALES-1.3.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Escolher Release e baixar ZIP fonte
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then TAG="${MANUAL_TAG:-}"; fi
          if [ -z "$TAG" ]; then TAG="$DEFAULT_TAG"; fi

          mkdir -p incoming
          gh release download "$TAG" --pattern '*.zip' --dir incoming
          ZIP="$(find incoming -maxdepth 1 -type f -iname '*.zip' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [ -z "${ZIP:-}" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Nenhum ZIP encontrado na Release $TAG"
            exit 1
          fi
          unzip -t "$ZIP" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Fonte: $ZIP"
          sha256sum "$ZIP"

      - name: Extrair projeto
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q "${{ steps.source.outputs.zip }}" -d work

      - name: Detectar projeto Android
        id: detect
        run: |
          set -euo pipefail
          mapfile -t WRAPPERS < <(find work -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | sort)
          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::Nenhum gradlew encontrado dentro do ZIP."
            exit 1
          fi
          ROOT=""
          for W in "${WRAPPERS[@]}"; do
            D="$(dirname "$W")"
            if [ -f "$D/settings.gradle.kts" ] || [ -f "$D/settings.gradle" ]; then ROOT="$D"; break; fi
          done
          if [ -z "$ROOT" ]; then ROOT="$(dirname "${WRAPPERS[0]}")"; fi
          chmod +x "$ROOT/gradlew"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          PROPS="$ROOT/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_VERSION="$(grep -oE 'gradle-[0-9]+(\.[0-9]+){1,2}' "$PROPS" 2>/dev/null | head -n1 | sed 's/gradle-//' || true)"
          JAVA=17
          if [ -n "$GRADLE_VERSION" ]; then
            MAJOR="${GRADLE_VERSION%%.*}"
            MINOR="$(echo "$GRADLE_VERSION" | cut -d. -f2)"
            if [ "$MAJOR" -lt 7 ] || { [ "$MAJOR" -eq 7 ] && [ "${MINOR:-0}" -lt 3 ]; }; then JAVA=11; fi
          fi
          SDK="$(grep -RhoE 'compileSdk(Version)?[[:space:]]*[= ]+[0-9]+' "$ROOT" --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oE '[0-9]+' | sort -nr | head -n1 || true)"
          if [ -z "$SDK" ]; then SDK=35; fi
          echo "gradle_version=${GRADLE_VERSION:-desconhecida}" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "Android root: $ROOT | Gradle: ${GRADLE_VERSION:-?} | Java: $JAVA | compileSdk: $SDK"

      - name: Preparar assinatura estável e variante compatível
        env:
          ROOT: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/braseiro-stable-debug.keystore"
          base64 -d "$GITHUB_WORKSPACE/build-signing/braseiro-stable-debug.keystore.b64" > "$KEYSTORE"
          echo "keystore=$KEYSTORE" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ['ROOT'])
          gradle = root / 'app' / 'build.gradle.kts'
          text = gradle.read_text(encoding='utf-8')

          # ARM-only: remove emulador/x86 do APK de celular.
          needle = '    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"\n'
          if 'abiFilters += listOf("arm64-v8a", "armeabi-v7a")' not in text:
              text = text.replace(needle, needle + '    ndk {\n      abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n    }\n')

          # Stable signing config, not the ephemeral GitHub runner debug key.
          build_types = '  buildTypes {\n'
          signing = '''  signingConfigs {\n    create("stableDebug") {\n      storeFile = file(System.getenv("BRASEIRO_STABLE_KEYSTORE"))\n      storePassword = "android"\n      keyAlias = "androiddebugkey"\n      keyPassword = "android"\n      enableV1Signing = true\n      enableV2Signing = true\n    }\n  }\n'''
          if 'create("stableDebug")' not in text:
              text = text.replace(build_types, signing + '\n' + build_types)

          text = text.replace('    debug { }', '''    debug {\n      applicationIdSuffix = ".stable"\n      versionNameSuffix = "-stable"\n      signingConfig = signingConfigs.getByName("stableDebug")\n    }''')

          # Legacy JNI packaging maximizes install compatibility on older OEM installers.
          if 'useLegacyPackaging = true' not in text:
              text = text.replace('  dependenciesInfo {\n', '''  packaging {\n    jniLibs {\n      useLegacyPackaging = true\n    }\n  }\n  dependenciesInfo {\n''')

          gradle.write_text(text, encoding='utf-8')
          print(gradle.read_text(encoding='utf-8'))
          PY

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.detect.outputs.java }}

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android necessária
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${{ steps.detect.outputs.sdk }}"

      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK compatível
        working-directory: ${{ steps.detect.outputs.root }}
        env:
          BRASEIRO_STABLE_KEYSTORE: ${{ env.keystore }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Validar e preparar APK
        id: apk
        working-directory: ${{ steps.detect.outputs.root }}
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/APK_SAIDA"
          mkdir -p "$OUT"
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -n1)"
          if [ -z "${APK:-}" ] || [ ! -f "$APK" ]; then
            echo "::error::APK não encontrado."
            exit 1
          fi

          NAME="${TAG}-stable-compat.apk"
          cp "$APK" "$OUT/$NAME"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          REPORT="$OUT/VALIDACAO_APK_STABLE_COMPAT.txt"

          unzip -t "$OUT/$NAME" >/dev/null
          "$ZIPALIGN" -c -P 16 -v 4 "$OUT/$NAME" | tail -n3 | tee "$REPORT"
          "$AAPT" dump badging "$OUT/$NAME" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' | tee -a "$REPORT"
          "$APKSIGNER" verify --verbose --print-certs "$OUT/$NAME" | tee -a "$REPORT"
          sha256sum "$OUT/$NAME" | tee -a "$REPORT"
          (cd "$OUT" && sha256sum *.apk > SHA256SUMS_STABLE_COMPAT.txt)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar artifact de backup
        uses: actions/upload-artifact@v4
        with:
          name: APK-STABLE-COMPAT-${{ steps.source.outputs.tag }}
          path: APK_SAIDA/*
          if-no-files-found: error
          retention-days: 30

      - name: Anexar APK compatível diretamente à Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" APK_SAIDA/*.apk APK_SAIDA/VALIDACAO_APK_STABLE_COMPAT.txt APK_SAIDA/SHA256SUMS_STABLE_COMPAT.txt --clobber

      - name: Resumo
        run: |
          {
            echo "## APK Stable Compatibility"
            echo ""
            echo "- Release: \`${{ steps.source.outputs.tag }}\`"
            echo "- APK: \`${{ steps.apk.outputs.name }}\`"
            echo "- assinatura: chave estável V1 + V2"
            echo "- package separado: \`com.braseiro.talesvtt.stable\`"
            echo "- ABI: ARM64 + ARMv7"
            echo "- JNI legacy packaging: ativo"
            echo ""
            echo "Pode ser instalado ao lado de builds antigos sem conflito de certificado."
          } >> "$GITHUB_STEP_SUMMARY"
