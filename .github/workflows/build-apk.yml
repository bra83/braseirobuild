name: Braseiro Universal Android Builder

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release a compilar (vazio = TALES-1.3.5)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "build-signing/**"
      - ".github/TALES_BUILD_TRIGGER"

permissions:
  contents: write

env:
  DEFAULT_TAG: "TALES-1.3.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Escolher Release e baixar ZIP fonte
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then TAG="${MANUAL_TAG:-}"; fi
          if [ -z "$TAG" ]; then TAG="$DEFAULT_TAG"; fi
          mkdir -p incoming
          gh release download "$TAG" --pattern '*.zip' --dir incoming
          ZIP="$(find incoming -maxdepth 1 -type f -iname '*.zip' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          [ -n "${ZIP:-}" ] && [ -f "$ZIP" ] || { echo "::error::ZIP fonte não encontrado"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP"

      - name: Extrair projeto
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q "${{ steps.source.outputs.zip }}" -d work

      - name: Detectar projeto Android
        id: detect
        run: |
          set -euo pipefail
          mapfile -t WRAPPERS < <(find work -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | sort)
          [ "${#WRAPPERS[@]}" -gt 0 ] || { echo "::error::gradlew não encontrado"; exit 1; }
          ROOT=""
          for W in "${WRAPPERS[@]}"; do
            D="$(dirname "$W")"
            if [ -f "$D/settings.gradle.kts" ] || [ -f "$D/settings.gradle" ]; then ROOT="$D"; break; fi
          done
          [ -n "$ROOT" ] || ROOT="$(dirname "${WRAPPERS[0]}")"
          chmod +x "$ROOT/gradlew"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          SDK="$(grep -RhoE 'compileSdk(Version)?[[:space:]]*[= ]+[0-9]+' "$ROOT" --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oE '[0-9]+' | sort -nr | head -n1 || true)"
          [ -n "$SDK" ] || SDK=35
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "Android root: $ROOT | compileSdk: $SDK"

      - name: Preparar variante LEGACY COMPAT
        env:
          ROOT: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/braseiro-stable-debug.keystore"
          base64 -d "$GITHUB_WORKSPACE/build-signing/braseiro-stable-debug.keystore.b64" > "$KEYSTORE"
          echo "BRASEIRO_STABLE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['ROOT'])
          gradle = root / 'app' / 'build.gradle.kts'
          text = gradle.read_text(encoding='utf-8')

          # Universal para celulares ARM: 64 e 32 bits.
          needle = '    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"\n'
          if 'abiFilters += listOf("arm64-v8a", "armeabi-v7a")' not in text:
              text = text.replace(needle, needle + '    ndk {\n      abiFilters += listOf("arm64-v8a", "armeabi-v7a")\n    }\n')

          # Package e versionCode completamente novos para eliminar qualquer conflito anterior.
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 10', text, count=1)
          text = text.replace('    release {\n      isCrunchPngs = false', '    release {\n      applicationIdSuffix = ".compat2"\n      versionNameSuffix = "-legacy-compat"\n      isCrunchPngs = false')

          # JNI dentro do APK em modo compatível com instaladores OEM antigos.
          if 'useLegacyPackaging = true' not in text:
              text = text.replace('  dependenciesInfo {\n', '  packaging {\n    jniLibs {\n      useLegacyPackaging = true\n    }\n  }\n  dependenciesInfo {\n')

          gradle.write_text(text, encoding='utf-8')
          print(gradle.read_text(encoding='utf-8'))
          PY

      - name: Reduzir recursos gráficos sem mudar geometria
        env:
          ROOT: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os

          root = Path(os.environ['ROOT']) / 'app' / 'src' / 'main' / 'res'
          before = 0
          after = 0
          converted = 0

          for p in list(root.rglob('*.png')):
              size = p.stat().st_size
              before += size
              if size <= 250_000 or p.name.endswith('.9.png'):
                  after += size
                  continue

              target = p.with_suffix('.webp')
              with Image.open(p) as im:
                  im.save(target, format='WEBP', quality=90, method=6)
              new_size = target.stat().st_size
              if new_size < size:
                  p.unlink()
                  after += new_size
                  converted += 1
              else:
                  target.unlink(missing_ok=True)
                  after += size

          print(f'converted={converted}')
          print(f'graphics_before={before}')
          print(f'graphics_after={after}')
          print(f'saved={before-after}')
          PY

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${{ steps.detect.outputs.sdk }}"

      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK release LEGACY COMPAT
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Zipalign, assinar V1 V2 V3 e validar
        id: apk
        working-directory: ${{ steps.detect.outputs.root }}
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/APK_SAIDA"
          mkdir -p "$OUT"
          UNSIGNED="$(find . -type f -path '*/build/outputs/apk/release/*.apk' | sort | head -n1)"
          [ -n "${UNSIGNED:-}" ] && [ -f "$UNSIGNED" ] || { echo "::error::APK release não encontrado"; exit 1; }

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          ALIGNED="$RUNNER_TEMP/tales-legacy-compat-aligned.apk"
          NAME="${TAG}-LEGACY-COMPAT.apk"
          FINAL="$OUT/$NAME"
          REPORT="$OUT/VALIDACAO_LEGACY_COMPAT.txt"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$BRASEIRO_STABLE_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 21 \
            --out "$FINAL" \
            "$ALIGNED"

          unzip -t "$FINAL" >/dev/null
          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL" | tail -n5 | tee "$REPORT"
          "$AAPT" dump badging "$FINAL" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' | tee -a "$REPORT"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL" | tee -a "$REPORT"

          grep -q 'Verified using v1 scheme (JAR signing): true' "$REPORT" || { echo "::error::V1 não validou"; exit 1; }
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$REPORT" || { echo "::error::V2 não validou"; exit 1; }
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$REPORT" || { echo "::error::V3 não validou"; exit 1; }
          grep -q "native-code: 'arm64-v8a' 'armeabi-v7a'" "$REPORT" || { echo "::error::ABIs ARM esperadas não encontradas"; exit 1; }
          grep -q "package: name='com.braseiro.talesvtt.compat2'" "$REPORT" || { echo "::error::Package compat incorreto"; exit 1; }

          SIZE="$(stat -c '%s' "$FINAL")"
          echo "size=$SIZE" | tee -a "$REPORT"
          [ "$SIZE" -lt 100000000 ] || { echo "::error::APK ainda >=100MB ($SIZE bytes)"; exit 1; }

          sha256sum "$FINAL" | tee -a "$REPORT"
          (cd "$OUT" && sha256sum *.apk > SHA256SUMS_LEGACY_COMPAT.txt)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar artifact de backup
        uses: actions/upload-artifact@v4
        with:
          name: APK-LEGACY-COMPAT-${{ steps.source.outputs.tag }}
          path: APK_SAIDA/*
          if-no-files-found: error
          retention-days: 30

      - name: Anexar APK LEGACY COMPAT diretamente à Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" APK_SAIDA/*.apk APK_SAIDA/VALIDACAO_LEGACY_COMPAT.txt APK_SAIDA/SHA256SUMS_LEGACY_COMPAT.txt --clobber

      - name: Resumo
        run: |
          {
            echo "## Tales LEGACY COMPAT APK"
            echo ""
            echo "- Release: \`${{ steps.source.outputs.tag }}\`"
            echo "- APK: \`${{ steps.apk.outputs.name }}\`"
            echo "- package: \`com.braseiro.talesvtt.compat2\`"
            echo "- versionCode: \`10\`"
            echo "- ABI: \`arm64-v8a + armeabi-v7a\`"
            echo "- assinatura validada: V1 + V2 + V3"
            echo "- APK: menor que 100 MB"
            echo "- JNI legacy packaging: ativo"
            echo "- zipalign: validado"
          } >> "$GITHUB_STEP_SUMMARY"