name: Braseiro Universal Android Builder

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release a compilar (vazio = TALES-1.3.5)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "build-signing/**"
      - ".github/TALES_BUILD_TRIGGER"

permissions:
  contents: write

env:
  DEFAULT_TAG: "TALES-1.3.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Escolher Release e baixar ZIP fonte
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then TAG="${MANUAL_TAG:-}"; fi
          if [ -z "$TAG" ]; then TAG="$DEFAULT_TAG"; fi
          mkdir -p incoming
          gh release download "$TAG" --pattern '*.zip' --dir incoming
          ZIP="$(find incoming -maxdepth 1 -type f -iname '*.zip' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          [ -n "${ZIP:-}" ] && [ -f "$ZIP" ] || { echo "::error::ZIP fonte não encontrado"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP"

      - name: Extrair projeto
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q "${{ steps.source.outputs.zip }}" -d work

      - name: Detectar projeto Android
        id: detect
        run: |
          set -euo pipefail
          mapfile -t WRAPPERS < <(find work -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | sort)
          [ "${#WRAPPERS[@]}" -gt 0 ] || { echo "::error::gradlew não encontrado"; exit 1; }
          ROOT=""
          for W in "${WRAPPERS[@]}"; do
            D="$(dirname "$W")"
            if [ -f "$D/settings.gradle.kts" ] || [ -f "$D/settings.gradle" ]; then ROOT="$D"; break; fi
          done
          [ -n "$ROOT" ] || ROOT="$(dirname "${WRAPPERS[0]}")"
          chmod +x "$ROOT/gradlew"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          SDK="$(grep -RhoE 'compileSdk(Version)?[[:space:]]*[= ]+[0-9]+' "$ROOT" --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oE '[0-9]+' | sort -nr | head -n1 || true)"
          [ -n "$SDK" ] || SDK=35
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "Android root: $ROOT | compileSdk: $SDK"

      - name: Preparar variante ARM64 de instalação
        env:
          ROOT: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/braseiro-stable-debug.keystore"
          base64 -d "$GITHUB_WORKSPACE/build-signing/braseiro-stable-debug.keystore.b64" > "$KEYSTORE"
          echo "BRASEIRO_STABLE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['ROOT'])
          gradle = root / 'app' / 'build.gradle.kts'
          text = gradle.read_text(encoding='utf-8')

          # APK exclusivo para celulares ARM64: reduz tamanho e evita x86/ARMv7 desnecessários.
          needle = '    testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"\n'
          if 'abiFilters += listOf("arm64-v8a")' not in text:
              text = text.replace(needle, needle + '    ndk {\n      abiFilters += listOf("arm64-v8a")\n    }\n')

          # VersionCode maior para atualizar qualquer tentativa stable anterior.
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 9', text, count=1)

          # Package separado elimina conflito de certificado com versões antigas do app.
          text = text.replace('    release {\n      isCrunchPngs = false', '    release {\n      applicationIdSuffix = ".stable"\n      versionNameSuffix = "-arm64"\n      isCrunchPngs = false')

          # Compatibilidade com instaladores OEM: extrair libs nativas durante instalação.
          if 'useLegacyPackaging = true' not in text:
              text = text.replace('  dependenciesInfo {\n', '  packaging {\n    jniLibs {\n      useLegacyPackaging = true\n    }\n  }\n  dependenciesInfo {\n')

          gradle.write_text(text, encoding='utf-8')
          print(gradle.read_text(encoding='utf-8'))
          PY

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${{ steps.detect.outputs.sdk }}"

      - name: Configurar cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK release ARM64
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --stacktrace --no-daemon

      - name: Zipalign, assinar e validar
        id: apk
        working-directory: ${{ steps.detect.outputs.root }}
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/APK_SAIDA"
          mkdir -p "$OUT"
          UNSIGNED="$(find . -type f -path '*/build/outputs/apk/release/*.apk' | sort | head -n1)"
          [ -n "${UNSIGNED:-}" ] && [ -f "$UNSIGNED" ] || { echo "::error::APK release não encontrado"; exit 1; }

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          ALIGNED="$RUNNER_TEMP/tales-arm64-aligned.apk"
          NAME="${TAG}-ARM64-INSTALL.apk"
          FINAL="$OUT/$NAME"
          REPORT="$OUT/VALIDACAO_ARM64_INSTALL.txt"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$BRASEIRO_STABLE_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --min-sdk-version 24 \
            --out "$FINAL" \
            "$ALIGNED"

          unzip -t "$FINAL" >/dev/null
          "$ZIPALIGN" -c -P 16 -v 4 "$FINAL" | tail -n5 | tee "$REPORT"
          "$AAPT" dump badging "$FINAL" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' | tee -a "$REPORT"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL" | tee -a "$REPORT"

          # Android 7+ (minSdk 24) usa APK Signature Scheme V2; V3 também deve validar.
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$REPORT" || { echo "::error::V2 não validou"; exit 1; }
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$REPORT" || { echo "::error::V3 não validou"; exit 1; }
          grep -q "native-code: 'arm64-v8a'" "$REPORT" || { echo "::error::APK não é ARM64"; exit 1; }
          grep -q "package: name='com.braseiro.talesvtt.stable'" "$REPORT" || { echo "::error::Package estável incorreto"; exit 1; }

          stat -c 'size=%s' "$FINAL" | tee -a "$REPORT"
          sha256sum "$FINAL" | tee -a "$REPORT"
          (cd "$OUT" && sha256sum *.apk > SHA256SUMS_ARM64_INSTALL.txt)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar artifact de backup
        uses: actions/upload-artifact@v4
        with:
          name: APK-ARM64-INSTALL-${{ steps.source.outputs.tag }}
          path: APK_SAIDA/*
          if-no-files-found: error
          retention-days: 30

      - name: Anexar APK ARM64 diretamente à Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" APK_SAIDA/*.apk APK_SAIDA/VALIDACAO_ARM64_INSTALL.txt APK_SAIDA/SHA256SUMS_ARM64_INSTALL.txt --clobber

      - name: Resumo
        run: |
          {
            echo "## Tales ARM64 Install APK"
            echo ""
            echo "- Release: \`${{ steps.source.outputs.tag }}\`"
            echo "- APK: \`${{ steps.apk.outputs.name }}\`"
            echo "- package: \`com.braseiro.talesvtt.stable\`"
            echo "- versionCode: \`9\`"
            echo "- ABI: \`arm64-v8a\`"
            echo "- assinatura validada: V2 + V3"
            echo "- JNI legacy packaging: ativo"
            echo "- zipalign: validado"
          } >> "$GITHUB_STEP_SUMMARY"
