name: Prepare Tales 1.3.6 Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/TALES_136_PREPARE_TRIGGER"
      - ".github/workflows/prepare-tales-1.3.6.yml"
      - "tales-1.3.6.patch"

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Download proven 1.3.5 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work out
          mkdir -p incoming work out
          gh release download TALES-1.3.5 \
            --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.5.zip' \
            --dir incoming
          unzip -t incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.5.zip >/dev/null
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.5.zip -d work

      - name: Apply 1.3.6 adventure-start fix
        run: |
          set -euo pipefail
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          [ -n "$ROOT" ] && [ -f "$ROOT/app/build.gradle.kts" ]
          (cd "$ROOT" && patch --dry-run -p1 < "$GITHUB_WORKSPACE/tales-1.3.6.patch")
          (cd "$ROOT" && patch -p1 < "$GITHUB_WORKSPACE/tales-1.3.6.patch")
          grep -q 'versionName = "1.3.6"' "$ROOT/app/build.gradle.kts"
          grep -q '_adventureStarted.value = true' "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/GameViewModel.kt"
          grep -q 'MAX_TRANSIENT_ATTEMPTS = 3' "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/MotorBarbaraTransport.kt"
          ! grep -q 'pendingAdventureStart' "$ROOT/app/src/main/java/com/braseiro/talesvtt/game/GameViewModel.kt"
          grep -q 'val startedNow = gameViewModel.adventureStarted.value' "$ROOT/app/src/main/java/com/braseiro/talesvtt/navigation/AppNavGraph.kt"

      - name: Package corrected Android Studio source
        id: pack
        run: |
          set -euo pipefail
          TOP="$(find work -mindepth 1 -maxdepth 1 -type d | head -n1)"
          NEW="work/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.6"
          if [ "$TOP" != "$NEW" ]; then mv "$TOP" "$NEW"; fi
          (cd work && zip -qr "$GITHUB_WORKSPACE/out/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.6.zip" BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.6)
          unzip -t out/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.6.zip >/dev/null
          sha256sum out/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.6.zip | tee out/SHA256SUMS_SOURCE_1.3.6.txt

      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view TALES-1.3.6 >/dev/null 2>&1; then
            gh release delete TALES-1.3.6 -y --cleanup-tag || true
          fi
          gh release create TALES-1.3.6 --draft \
            --title 'BRASEIRO TALES VTT 1.3.6' \
            --notes 'Correção do fluxo NOVA AVENTURA: início determinístico local, navegação MENU→CENA sem corrida de estado, parser Gemini tolerante e retry limitado para erros transitórios 500/502/503/504. Base: TALES-1.3.5.'
          gh release upload TALES-1.3.6 \
            out/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.6.zip \
            out/SHA256SUMS_SOURCE_1.3.6.txt \
            tales-1.3.6.patch
          gh release edit TALES-1.3.6 --draft=false

      - name: Trigger proven APK builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-apk.yml --ref main -f tag=TALES-1.3.6

      - name: Summary
        run: |
          echo '## TALES 1.3.6 source prepared' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source release: `TALES-1.3.6`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Universal APK builder dispatched for `TALES-1.3.6`.' >> "$GITHUB_STEP_SUMMARY"
