name: Braseiro O Um Anel 4.9.3 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oua-4.9.3-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: 'OUA-v4.9.3'
  SOURCE_NAME: 'OUA_4.9.3_IMMERSIVE_LAYOUT_HOTFIX_ANDROID_STUDIO.zip'
  SOURCE_SHA256: '65da81a79796b1567ed452de99f998e843c430d73c8487fa85014a8b1a1c227c'
  APK_NAME: 'BRASEIRO_O_UM_ANEL_4.9.3_DEBUG.apk'
  SOURCE_URL_B64: ''

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download exact source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming outer work out
          SOURCE_URL="$(printf '%s' "$SOURCE_URL_B64" | base64 -d)"
          curl -fL --retry 5 --retry-delay 3 "$SOURCE_URL" -o incoming/wrapper.zip
          unzip -t incoming/wrapper.zip >/dev/null
          unzip -q incoming/wrapper.zip -d outer
          INNER="$(find outer -type f -name '*.zip' | head -n1)"
          test -f "$INNER"
          cp "$INNER" "out/$SOURCE_NAME"
          echo "$SOURCE_SHA256  out/$SOURCE_NAME" | sha256sum -c -
          unzip -t "out/$SOURCE_NAME" >/dev/null

      - name: Extract Android Studio project
        id: source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "out/$SOURCE_NAME" -d work
          WRAPPER="$(find work -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | head -n1)"
          test -n "$WRAPPER"
          ROOT="$(dirname "$WRAPPER")"
          test -f "$ROOT/settings.gradle.kts" -o -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/build.gradle.kts" -o -f "$ROOT/app/build.gradle"
          grep -R -q 'com.braseiro.oumanel' "$ROOT/app"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.source.outputs.root }}"
          chmod +x "$ROOT/gradlew"
          cd "$ROOT"
          ./gradlew clean :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" > "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.oumanel'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y --cleanup-tag || true
          fi
          gh release create "$TAG" --target main             --title 'Braseiro O Um Anel 4.9.3'             --notes '4.9.3: hotfix da tela imersiva após o boot. Release única com ZIP-fonte e APK debug.'
          gh release upload "$TAG"             "out/$SOURCE_NAME"             "out/$APK_NAME"             "out/$APK_NAME.sha256"             out/APK_BADGING.txt             out/GRADLE_BUILD.log
