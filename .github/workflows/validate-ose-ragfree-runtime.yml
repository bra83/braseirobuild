name: Validate BRASEIRO OSE RAG-free Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/validate-ose-ragfree-runtime.yml"
      - "ose/1.0.0/source/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-ose-ragfree-runtime.yml"
      - "ose/1.0.0/source/**"

permissions:
  contents: read

concurrency:
  group: ose-ragfree-runtime-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform from runner SDK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35'
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: JavaScript syntax gate
        run: |
          node --check ose/1.0.0/source/web-ui-p1/generated_map_assets.js
          node --check ose/1.0.0/source/web-ui-p1/p1.js
          node --check ose/1.0.0/source/web-ui-p1/multiple_character_smoke.js

      - name: WebView multi-character smoke
        run: |
          node ose/1.0.0/source/web-ui-p1/multiple_character_smoke.js

      - name: Generated local maps gate
        run: |
          set -euo pipefail
          ROOT=ose/1.0.0/source
          JS="$ROOT/web-ui-p1/p1.js"
          PACK="$ROOT/web-ui-p1/generated_map_assets.js"
          PROJECTOR="$ROOT/app-android/src/main/kotlin/braseiro/ose/app/AppViewStateProjector.kt"
          grep -q 'settlement_gate' "$PACK"
          grep -q 'settlement_market' "$PACK"
          grep -q 'dungeon_room' "$PACK"
          grep -q 'dungeon_cave' "$PACK"
          grep -q 'renderSettlementMap' "$JS"
          grep -q 'renderDungeonMap' "$JS"
          grep -q 'localMaps' "$PROJECTOR"
          grep -q 'Local desconhecido' "$PROJECTOR"
          echo "State-driven settlement/dungeon generated-map surfaces: PASS"

      - name: RAG-independence gate
        run: |
          set -euo pipefail
          ROOT=ose/1.0.0/source
          for module in rules-classic rules-advanced referee-boundary session-engine world-domain character-domain npc-domain; do
            if grep -RIn --exclude-dir=build --exclude='*.md' -E 'project\(":rag-source-registry"\)|braseiro\.ose\.rag' "$ROOT/$module"; then
              echo "::error::$module has a runtime dependency on RAG/evidence registry"
              exit 1
            fi
          done
          grep -q 'evidence lookup only: it never resolves mechanics' "$ROOT/rag-source-registry/src/main/kotlin/braseiro/ose/rag/RuleEvidenceRegistry.kt"
          echo "RAG-free mechanics boundary: PASS"

      - name: Kokoro Android TTS static gate
        run: |
          set -euo pipefail
          ROOT=ose/1.0.0/source
          TTS="$ROOT/tts-android/src/main/kotlin/braseiro/ose/tts/android/AndroidTtsController.kt"
          MAIN="$ROOT/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt"
          grep -q 'com.k2fsa.sherpa.onnx.tts.engine' "$TTS"
          grep -q 'UtteranceProgressListener' "$TTS"
          grep -q 'override fun onDone' "$TTS"
          grep -q 'TextToSpeech.QUEUE_ADD' "$TTS"
          grep -q 'TtsTextSegmenter.segment' "$TTS"
          grep -q 'AndroidTtsController(applicationContext)' "$MAIN"
          ! grep -q 'tts = GeminiTtsController' "$MAIN"
          ! grep -RIn --exclude-dir=build -E '"[^"]*(Android/data|model\.onnx|voices\.bin)[^"]*"' "$ROOT/tts-android" "$ROOT/app-android/src/main/kotlin"
          echo "Installed-engine Kokoro boundary: PASS"

      - name: Presentation media and text-first UI gate
        run: |
          set -euo pipefail
          ROOT=ose/1.0.0/source
          MAIN="$ROOT/app-android/src/main/kotlin/braseiro/ose/app/MainActivity.kt"
          MEDIA="$ROOT/app-android/src/main/kotlin/braseiro/ose/app/PresentationMediaStore.kt"
          JS="$ROOT/web-ui-p1/p1.js"
          grep -q 'PortraitPromptShare' "$MAIN"
          grep -q 'buildCharacterPortraitPrompt' "$MAIN"
          grep -q 'buildNpcPortraitPrompt' "$MAIN"
          grep -q 'rememberExternalImageTarget' "$MAIN"
          grep -q 'consumeExternalImageTarget' "$MAIN"
          grep -q 'SCENE, CHARACTER, NPC, ITEM' "$MEDIA"
          grep -q 'data-photo-item' "$JS"
          grep -q 'equipment-icons/' "$JS"
          grep -q 'hexes-runtime/' "$JS"
          grep -q 'data-scene-prompt' "$JS"
          grep -q 'data-scene-import' "$JS"
          grep -q 'sceneImageUrl' "$JS"
          grep -q 'confirmWildernessAction' "$JS"
          grep -q 'data-travel-roll' "$JS"
          grep -q 'ScenePromptShare' "$MAIN"
          grep -q '"SCENE" -> PresentationMediaStore.Scope.SCENE' "$MAIN"
          ! grep -q 'data-generate-character' "$JS"
          ! grep -q 'data-generate-npc' "$JS"
          ! grep -q 'data-photo-character' "$JS"
          ! grep -q 'data-photo-npc' "$JS"
          ! grep -q 'tokens_compactos/' "$JS"
          echo "Text-first UI with scene/hex/interior/equipment imagery and dormant character/NPC portraits: PASS"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Full JVM runtime and heavy integration suites
        working-directory: ose/1.0.0/source
        run: |
          set -euo pipefail
          chmod +x gradlew
          tasks=(
            :core-model:test
            :core-rng:test
            :campaign-domain:test
            :persistence-api:test
            :migration-registry:test
            :test-support:test
            :asset-resolver:test
            :rules-api:test
            :rules-shared-confirmed:test
            :rules-classic:test
            :rules-advanced:test
            :character-domain:test
            :referee-boundary:test
            :session-engine:test
            :barbara-adapter:test
            :rag-source-registry:test
            :map-core:test
            :map-dungeon:test
            :map-hex:test
            :map-settlement:test
            :procedural-dungeon:test
            :procedural-hex:test
            :world-domain:test
            :npc-domain:test
            :backup-restore:test
            :tts-api:test
            :integration-tests:test
          )
          ./gradlew --no-daemon "${tasks[@]}" --stacktrace

      - name: Android persistence app and TTS compile gates
        working-directory: ose/1.0.0/source
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :persistence-room:testDebugUnitTest \
            :app-android:testDebugUnitTest \
            :tts-android:compileDebugKotlin \
            :app-android:compileDebugKotlin \
            --stacktrace

      - name: Heavy campaign closure marker gate
        run: |
          set -euo pipefail
          STRESS=ose/1.0.0/source/integration-tests/src/test/kotlin/braseiro/ose/integration/FinalClosureStressTest.kt
          grep -q '40 heavy sixty-day campaigns' "$STRESS"
          grep -q 'character creation remains profile isolated across a large deterministic corpus' "$STRESS"
          grep -q 'large procedural corpus stays deterministic coherent reachable and profile clean' "$STRESS"
          echo "Heavy multi-campaign closure suite: PASS"

      - name: Summary
        run: |
          {
            echo "## OSE RAG-free runtime validation"
            echo "- Mechanics core has no runtime dependency on rag-source-registry."
            echo "- Android TTS is installed-engine based and Kokoro/Sherpa-aware."
            echo "- Primary UI is text-first; scene, map and equipment imagery are enabled; character/NPC portrait UI stays dormant."
            echo "- Full JVM suite, heavy multi-campaign stress, Android persistence/app unit tests and Android Kotlin compile passed."
            echo "- No APK was assembled by this validation workflow."
          } >> "$GITHUB_STEP_SUMMARY"
