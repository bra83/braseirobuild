name: Export BRASEIRO OSE APK

on:
  push:
    paths:
      - '.github/workflows/export-ose-apk.yml'
  workflow_dispatch:

jobs:
  export-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify committed APK
        shell: bash
        run: |
          set -euo pipefail
          APK='build-artifacts/ose/1.0.0/BRASEIRO_OSE_1_0_0_DEBUG.apk'
          test -f "$APK"
          echo '3b57b19014ce1a8ee92273fe2837fcebea9481a9bbd70799e757e916a4c41e78  '"$APK" | sha256sum -c -
          ls -lh "$APK"

      - name: Temporary export for ChatGPT retrieval
        shell: bash
        run: |
          set -euo pipefail
          APK='build-artifacts/ose/1.0.0/BRASEIRO_OSE_1_0_0_DEBUG.apk'
          RESPONSE=$(curl --fail-with-body --retry 3 -sS -F "file=@${APK}" https://tmpfiles.org/api/v1/upload)
          echo "$RESPONSE"
          URL=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["url"])')
          DIRECT=${URL/https:\/\/tmpfiles.org\//https:\/\/tmpfiles.org\/dl\/}
          echo "DIRECT_URL=$DIRECT"
