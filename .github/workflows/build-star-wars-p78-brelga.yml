name: Build Star Wars R54 P78 APK on BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-star-wars-p78-brelga.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-wars-r54-p78-brelga
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          $candidates = @('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $candidates += 'C:\Android\Sdk'
          $sdk = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ($candidate -and (Test-Path $candidate) -and (Test-Path (Join-Path $candidate 'platform-tools'))) {
              $sdk = $candidate
              break
            }
          }
          if (-not $sdk) { throw 'Android SDK not found on BRELGA' }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download exact P78 source checkpoint
        id: src
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.firestorage.ai/dev/file/shares/b_wspt9QTcIf'
          $work = Join-Path $env:RUNNER_TEMP 'sw-p78-transfer'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $meta = Invoke-RestMethod -Method Get -Uri ($api + '/files?maxResults=100')
          if (-not $meta.files -or $meta.files.Count -ne 1) { throw "Expected 1 transfer file, got $($meta.files.Count)" }
          $file = $meta.files[0]
          if ($file.fileName -ne 'BRASEIRO_STAR_WARS_EDGE_R54_P78_SOURCE_CHECKPOINT.zip') { throw "Unexpected transfer file $($file.fileName)" }
          $ticket = Invoke-RestMethod -Method Post -Uri ($api + '/files/' + $file.fileId + '/download')
          if (-not $ticket.downloadUrl) { throw 'No P78 download URL' }
          $zip = Join-Path $work 'BRASEIRO_STAR_WARS_EDGE_R54_P78_SOURCE_CHECKPOINT.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $zip $ticket.downloadUrl
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $LASTEXITCODE" }
          $bytes = (Get-Item $zip).Length
          if ($bytes -ne 88869717) { throw "P78 byte count mismatch: $bytes" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '1b25a79f0b855f94f055e7e6e1e87a99b87f9217efbeb43432fcc69e813450d0') { throw "P78 SHA mismatch: $hash" }
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract and detect Android project
        id: project
        shell: powershell
        env:
          SOURCE_ZIP: ${{ steps.src.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'sw-p78-project'
          Remove-Item $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          & tar.exe -xf $env:SOURCE_ZIP -C $extractRoot
          if ($LASTEXITCODE -ne 0) { throw 'P78 extraction failed' }
          $settings = Get-ChildItem $extractRoot -Recurse -File |
            Where-Object {
              $_.Name -in @('settings.gradle','settings.gradle.kts') -and
              $_.FullName -notmatch '[\\/](build|[.]gradle)[\\/]' -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradlew.bat')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradle\wrapper\gradle-wrapper.jar')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'app\src\main\AndroidManifest.xml'))
            } | Sort-Object FullName | Select-Object -First 1
          if (-not $settings) { throw 'Complete Android Studio project not found in P78' }
          "root=$($settings.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Source gates before Android build
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          node --check app/src/main/assets/vtt/r46/final-runtime.js
          if ($LASTEXITCODE -ne 0) { throw 'final-runtime syntax failed' }
          node --check app/src/main/assets/vtt/js/core/uiBridge.bundle.js
          if ($LASTEXITCODE -ne 0) { throw 'uiBridge bundle syntax failed' }
          node --test tests/r54-p76-tts-kokoro-pipeline.test.mjs tests/r54-p77-android-build-fix.test.mjs tests/r54-p78-mobile-session-repair.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'P78 focal source gates failed' }

      - name: Build debug APK
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          & .\gradlew.bat --version --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Gradle wrapper failed: $LASTEXITCODE" }
          & .\gradlew.bat clean assembleDebug --stacktrace --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "assembleDebug failed: $LASTEXITCODE" }

      - name: Validate P78 APK
        id: apk
        shell: powershell
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Get-ChildItem $env:ROOT -Recurse -File -Filter '*.apk' |
            Where-Object { $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]' } |
            Sort-Object FullName | Select-Object -First 1
          if (-not $apk) { throw 'Debug APK not found' }
          $outDir = Join-Path $env:RUNNER_TEMP 'sw-p78-apk-out'
          Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $dest = Join-Path $outDir 'BRASEIRO_STAR_WARS_EDGE_R54_P78_DEBUG.apk'
          Copy-Item $apk.FullName $dest -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($dest)
          try {
            $shellEntry = $z.GetEntry('assets/vtt/r46-shell.html')
            $runtimeEntry = $z.GetEntry('assets/vtt/r46/final-runtime.js')
            if (-not $shellEntry -or -not $runtimeEntry) { throw 'Packaged VTT runtime missing' }
            $sr = New-Object IO.StreamReader($shellEntry.Open())
            $shellText = $sr.ReadToEnd(); $sr.Dispose()
            $rr = New-Object IO.StreamReader($runtimeEntry.Open())
            $runtimeText = $rr.ReadToEnd(); $rr.Dispose()
            if ($shellText -notmatch 'data-version="1[.]0[.]78"') { throw 'APK shell is not 1.0.78' }
            if ($runtimeText -notmatch 'R54 P78') { throw 'APK runtime is not P78' }
            foreach ($needle in @('campaignSetup','boundedVisualRoll','MESTRE LOCAL','final-published-last-roll','CAMPANHA','final-tts-engine','Velocidade Kokoro')) {
              if ($runtimeText -notmatch [regex]::Escape($needle)) { throw "APK missing required P78/P76 marker: $needle" }
            }
          } finally { $z.Dispose() }

          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BRASEIRO_STAR_WARS_EDGE_R54_P78_DEBUG.apk" | Set-Content (Join-Path $outDir 'BRASEIRO_STAR_WARS_EDGE_R54_P78_DEBUG.apk.sha256') -Encoding ascii

          $bt = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $bt) { throw 'Android build-tools unavailable' }
          $aapt = Join-Path $bt.FullName 'aapt.exe'
          $signer = Join-Path $bt.FullName 'apksigner.bat'
          & $aapt dump badging $dest 2>&1 | Tee-Object -FilePath (Join-Path $outDir 'APK_BADGING.txt')
          if ($LASTEXITCODE -ne 0) { throw 'aapt badging failed' }
          $badging = Get-Content (Join-Path $outDir 'APK_BADGING.txt') -Raw
          if ($badging -notmatch "package: name='com[.]braseiro[.]starwarsedge'") { throw 'Wrong applicationId' }
          if ($badging -notmatch "versionCode='10078'") { throw 'Wrong versionCode' }
          if ($badging -notmatch "versionName='1[.]0[.]78'") { throw 'Wrong versionName' }

          $sig='not-checked'
          if (Test-Path $signer) {
            & $signer verify --verbose --print-certs $dest 2>&1 | Tee-Object -FilePath (Join-Path $outDir 'APK_SIGNATURE.txt')
            if ($LASTEXITCODE -ne 0) { throw 'APK signature validation failed' }
            $sig='verified'
          }

          @(
            'STATUS=PASS',
            "RUNNER_NAME=$env:RUNNER_NAME",
            "GITHUB_RUN_ID=$env:GITHUB_RUN_ID",
            'SOURCE_NAME=BRASEIRO_STAR_WARS_EDGE_R54_P78_SOURCE_CHECKPOINT.zip',
            'SOURCE_BYTES=88869717',
            'SOURCE_SHA256=1b25a79f0b855f94f055e7e6e1e87a99b87f9217efbeb43432fcc69e813450d0',
            'APK_NAME=BRASEIRO_STAR_WARS_EDGE_R54_P78_DEBUG.apk',
            "APK_BYTES=$((Get-Item $dest).Length)",
            "APK_SHA256=$hash",
            'PACKAGE=com.braseiro.starwarsedge',
            'VERSION_CODE=10078',
            'VERSION_NAME=1.0.78',
            'PACKAGED_NEW_WORLD_FORCE_SETUP=PASS',
            'PACKAGED_ROLL_RESULT_PERSISTENCE=PASS',
            'PACKAGED_MASTER_STATUS=PASS',
            'PACKAGED_CAMPAIGN_HUB=PASS',
            'PACKAGED_TTS_P76_P77=PASS',
            "SIGNATURE=$sig"
          ) | Set-Content (Join-Path $outDir 'P78_BRELGA_BUILD_PROOF.txt') -Encoding utf8
          "dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload P78 APK and proof
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_STAR_WARS_EDGE_R54_P78_BRELGA
          path: |
            ${{ steps.apk.outputs.dir }}/BRASEIRO_STAR_WARS_EDGE_R54_P78_DEBUG.apk
            ${{ steps.apk.outputs.dir }}/BRASEIRO_STAR_WARS_EDGE_R54_P78_DEBUG.apk.sha256
            ${{ steps.apk.outputs.dir }}/APK_BADGING.txt
            ${{ steps.apk.outputs.dir }}/APK_SIGNATURE.txt
            ${{ steps.apk.outputs.dir }}/P78_BRELGA_BUILD_PROOF.txt
          if-no-files-found: error
          retention-days: 7


      - name: Publish validated P78 release assets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'bra83/braseirobuild'
          $tag = 'star-wars-r54-p78-apk'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'BRELGA-Star-Wars-P78'
          }
          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = 'main'
              name = 'Braseiro Star Wars R54 P78 APK'
              body = 'APK debug compilado e validado no BRELGA a partir do checkpoint P78 congelado no Google Drive. GitHub usado somente como esteira de compilação.'
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $payload -Uri "https://api.github.com/repos/$repo/releases"
          }
          $uploadBase = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets"
          $assets = Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach ($name in @('BRASEIRO_STAR_WARS_EDGE_R54_P78_DEBUG.apk','BRASEIRO_STAR_WARS_EDGE_R54_P78_DEBUG.apk.sha256','APK_BADGING.txt','APK_SIGNATURE.txt','P78_BRELGA_BUILD_PROOF.txt')) {
            $existing = $assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($existing) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" | Out-Null }
            $path = Join-Path $env:APK_DIR $name
            if (Test-Path $path) {
              $type = if ($name -like '*.apk') {'application/vnd.android.package-archive'} else {'text/plain'}
              $assetUrl = $uploadBase + '?name=' + [uri]::EscapeDataString($name)
              & curl.exe -L --fail -X POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: $type" --data-binary "@$path" $assetUrl
              if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed for $name" }
            }
          }
          Write-Host "P78 release: $($release.html_url)"


      - name: Persist final BRELGA job status
        if: always()
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'bra83/braseirobuild'
          $path = 'diagnostics/star-wars-p78-brelga-status.json'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'BRELGA-Star-Wars-P78-Status'
          }
          $statusObject = [ordered]@{
            project = 'BRASEIRO_STAR_WARS_EDGE_R54_P78'
            runner = $env:RUNNER_NAME
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            status = $env:JOB_STATUS
            source_name = 'BRASEIRO_STAR_WARS_EDGE_R54_P78_SOURCE_CHECKPOINT.zip'
            source_bytes = 88869717
            source_sha256 = '1b25a79f0b855f94f055e7e6e1e87a99b87f9217efbeb43432fcc69e813450d0'
            version_code = 10078
            version_name = '1.0.78'
            timestamp_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $json = $statusObject | ConvertTo-Json
          $bytes = [Text.Encoding]::UTF8.GetBytes($json)
          $content64 = [Convert]::ToBase64String($bytes)
          $api = "https://api.github.com/repos/$repo/contents/$path"
          $existingSha = $null
          try {
            $existing = Invoke-RestMethod -Method Get -Headers $headers -Uri ($api + '?ref=main')
            $existingSha = $existing.sha
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          $payload = @{
            message = "ci: persist Star Wars P78 BRELGA status $env:JOB_STATUS"
            content = $content64
            branch = 'main'
          }
          if ($existingSha) { $payload.sha = $existingSha }
          Invoke-RestMethod -Method Put -Headers $headers -ContentType 'application/json' -Body ($payload | ConvertTo-Json) -Uri $api | Out-Null
          Write-Host "Persisted $path status=$env:JOB_STATUS run=$env:GITHUB_RUN_ID"
