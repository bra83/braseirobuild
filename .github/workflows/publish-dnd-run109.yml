name: DnD 6.6.2 RUN109 Release Publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dnd-run109.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: 'DND-6.6.2-RUN109'
  ASSET_NAME: 'BRASEIRO_DND_6.6.2_RUN109_STARTUP_ANR_HOTFIX_PATCH.zip'
  EXPECTED_SHA256: '317894b07717f9180f5724896b1c34187c1e80fafda78b5278c326ff9b0291cf'
  API_BASE: 'https://api.firestorage.ai/dev/file'
  SHARE_ID: '-ixtpPOskWLY'
  FILE_ID: '01a0b8da565674c698bc9d2144257d92'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch RUN109 release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          LIST_URL="$API_BASE/shares/$SHARE_ID/files?maxResults=1000"
          DOWNLOAD_API="$API_BASE/shares/$SHARE_ID/files/$FILE_ID/download"

          echo "Checking temporary transfer..."
          curl -fsSL "$LIST_URL" -o /tmp/files.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/files.json', encoding='utf-8'))
          wanted=os.environ['FILE_ID']
          files=data.get('files') or []
          if not any(str(x.get('fileId'))==wanted for x in files):
              raise SystemExit(f'RUN109 file id {wanted} not present in share')
          PY

          curl -fsSL -X POST "$DOWNLOAD_API" -o /tmp/download.json
          DOWNLOAD_URL="$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/download.json', encoding='utf-8'))
          print(data.get('downloadUrl') or '')
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$DOWNLOAD_URL" -o "out/$ASSET_NAME"

      - name: Validate asset
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "out/$ASSET_NAME" >/dev/null
          ACTUAL="$(sha256sum "out/$ASSET_NAME" | awk '{print $1}')"
          echo "SHA256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_SHA256"
          printf '%s  %s\n' "$ACTUAL" "$ASSET_NAME" > "out/$ASSET_NAME.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Braseiro DnD 6.6.2 RUN109. Hotfix de ANR no início da aventura: preflight/Atlas/contexto pesado removidos da UI thread. Inclui as correções cumulativas RUN105–RUN108. Package Android: com.braseiro.dnd5e. Regressão autoritativa local: 78/78 PASS. O build físico no aparelho continua sendo o gate final.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Braseiro DnD 6.6.2 RUN109 — Startup ANR Hotfix' --notes "$NOTES"
          gh release upload "$TAG" "out/$ASSET_NAME" "out/$ASSET_NAME.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
