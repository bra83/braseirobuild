name: DnD 6.6.80 Live Master and Adventure Journal QA
on:
  push:
    branches:
      - fix/dnd-6668-startup-master-continuity-20261126
    paths:
      - dnd-normal/run247-mod005/**
      - .github/workflows/dnd-6668-startup-master-continuity-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK check
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Verify startup, imported sidequest, permanent memory and blocked-Master recovery
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          run_regression() {
          ./gradlew :app:testDebugUnitTest \
            --tests com.braseiro.dnd5e.DndStartupContinuityPerformanceRobolectricTest \
            --tests com.braseiro.dnd5e.AtlasBundledImportRobolectricTest \
            --tests com.braseiro.dnd5e.LiveMaster674RegressionTest \
            --tests com.braseiro.dnd5e.LiveMasterProseRegressionTest \
            --tests com.braseiro.dnd5e.AdventureInitialEnvironmentTest \
            --tests com.braseiro.dnd5e.MasterActionDurabilityRobolectricTest \
            --tests com.braseiro.dnd5e.PortraitStorageDurabilityRobolectricTest \
            --tests com.braseiro.dnd5e.NpcPortraitBindingRobolectricTest \
            --tests com.braseiro.dnd5e.RemoteMasterTransportPolicyTest \
            --tests com.braseiro.dnd5e.SupplementAndNpcEngineTest \
            --tests com.braseiro.dnd5e.StrixhavenSceneBoundaryRobolectricTest \
            --tests com.braseiro.dnd5e.NarrativeDefinitiveLeakRegressionTest \
            --tests com.braseiro.dnd5e.AtlasBootstrapGateTest \
            --tests com.braseiro.dnd5e.ImportedPrincipalStartRegressionTest \
            --tests com.braseiro.dnd5e.CanonicalSceneAudioRegressionTest \
            --tests com.braseiro.dnd5e.BarbaraStartupLazyTest \
            --tests com.braseiro.dnd5e.BarbaraColdStartValidationRegressionTest \
            --tests com.braseiro.dnd5e.BraseiroSideQuestStoreRobolectricTest \
            --tests com.braseiro.dnd5e.MasterPreparationExecutorRecoveryRobolectricTest \
            --tests com.braseiro.dnd5e.AdventureContinuityPersistenceTest \
            --tests com.braseiro.dnd5e.IndependentOfflineRecoveryRobolectricTest \
            --no-daemon --console=plain
          }
          for attempt in 1 2 3; do
            if run_regression 2>&1 | tee /tmp/dnd-regression.log; then break; fi
            if ! grep -Eq 'Received status code (429|502|503|504) from server' /tmp/dnd-regression.log || [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
      - name: Show failed regression details
        if: failure()
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for file in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              for case in ET.parse(file).iter('testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      print(case.attrib.get('classname'), case.attrib.get('name'))
                      print(failure.attrib.get('message', ''), (failure.text or '')[:6000])
          PY
      - name: Assemble Android candidate
        working-directory: dnd-normal/run247-mod005
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
          grep -q '^VERSION_CODE=203900643$' version.properties
          grep -q '^DB_SCHEMA=61$' version.properties
          grep -q '^BACKUP_FORMAT=21$' version.properties
      - name: Upload Android QA build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_DND_6.6.80_MASTER_TRANSPORT_RECOVERY_QA
          path: dnd-normal/run247-mod005/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
