name: Audit Star Wars R38 Block05 actions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-star-wars-r38-block05-actions.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: source
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json')); print('url='+d['source_share_url']); print('sha='+d['sha256']); print('file='+d['file'])
          PY
      - name: Download pinned source and recovered scene pack
        env:
          SHARE_URL: ${{ steps.source.outputs.url }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
          SCENE_URL: https://firestorage.ai/ja/f/PbM3XvdzNMAk
          SCENE_FILE: scene-assets-v1-tiny.tar.gz
          SCENE_SHA: 2ca16b2cd0d3f489fe10f1df718be1243febeef38fb88a52bd50502528f60711
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          rm -rf incoming work; mkdir -p incoming/scenes work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          def dl(url,name,out):
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True); pg=b.new_page(accept_downloads=True); pg.goto(url,wait_until='domcontentloaded',timeout=120000); pg.wait_for_timeout(3000)
              for label in ['Accept','Aceitar','同意する','OK']:
                try:
                  q=pg.get_by_text(label,exact=True)
                  if q.count() and q.first.is_visible(): q.first.click(timeout=1000)
                except: pass
              done=False
              for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
                try:
                  q=pg.locator(sel).first
                  if q.count() and q.is_visible():
                    with pg.expect_download(timeout=120000) as info:q.click(timeout=10000)
                    info.value.save_as(str(out));done=True;break
                except:pass
              if not done:
                q=pg.get_by_text(name,exact=False).first;par=q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
                with pg.expect_download(timeout=120000) as info:par.locator('a,button').last.click(timeout=10000)
                info.value.save_as(str(out))
              b.close()
          dl(os.environ['SHARE_URL'],os.environ['SOURCE_FILE'],pathlib.Path('incoming')/os.environ['SOURCE_FILE'])
          dl(os.environ['SCENE_URL'],os.environ['SCENE_FILE'],pathlib.Path('incoming/scenes')/os.environ['SCENE_FILE'])
          PY
          echo "${EXPECTED_SHA}  incoming/${SOURCE_FILE}" | sha256sum -c -
          echo "${SCENE_SHA}  incoming/scenes/${SCENE_FILE}" | sha256sum -c -
          unzip -q "incoming/${SOURCE_FILE}" -d work
          base64 -w0 "incoming/scenes/${SCENE_FILE}" > star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"; echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Apply current green patches
        run: |
          set -euo pipefail
          python3 star-wars/r38/patches/block01_repair_safe.py "$ROOT" >/tmp/b1
          python3 star-wars/r38/patches/block02_scene_controls.py "$ROOT" >/tmp/b2
          node --check "$ROOT/app/src/main/assets/vtt/r46/final-runtime.js"
      - name: Audit declarative actions and runtime handlers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,json,pathlib,collections
          root=pathlib.Path(os.environ['ROOT']); r46=root/'app/src/main/assets/vtt/r46'; out=pathlib.Path('star-wars/r38/audit'); out.mkdir(parents=True,exist_ok=True)
          files=list(r46.glob('*.js'))+list(r46.glob('*.html'))
          texts={p.name:p.read_text(encoding='utf-8',errors='replace') for p in files}
          combined='\n'.join(texts.values())
          actions=[]
          for fname,t in texts.items():
            for m in re.finditer(r'data-action=["\']([^"\']+)["\']',t): actions.append({'action':m.group(1),'file':fname,'offset':m.start()})
          counts=collections.Counter(x['action'] for x in actions)
          audit=[]
          for a,n in sorted(counts.items()):
            refs=len(re.findall(r'(?<!data-)action[^\n]{0,120}["\']'+re.escape(a)+r'["\']|["\']'+re.escape(a)+r'["\'][^\n]{0,120}(?:case|action|dataset)',combined,re.I))
            raw=combined.count(a)
            audit.append({'action':a,'declarations':n,'raw_occurrences':raw,'handler_signal_count':refs,'status':'suspect' if raw<=n else 'referenced'})
          # buttons without data-action/type links, for manual evidence
          plain=[]
          for fname,t in texts.items():
            for m in re.finditer(r'<button\b([^>]*)>(.*?)</button>',t,re.I|re.S):
              attrs=m.group(1); label=re.sub('<[^>]+>',' ',m.group(2)); label=' '.join(label.split())[:100]
              if 'data-action=' not in attrs and 'onclick=' not in attrs: plain.append({'file':fname,'label':label,'attrs':attrs[:300]})
          report={'declared_action_count':len(actions),'unique_actions':len(counts),'actions':audit,'plain_buttons':plain[:300]}
          (out/'BLOCK05_ACTION_AUDIT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          suspects=[x for x in audit if x['status']=='suspect']
          md=['# STAR WARS R38 — BLOCK05 ACTION AUDIT','',f'- Declared data-action nodes: **{len(actions)}**',f'- Unique actions: **{len(counts)}**',f'- Suspect orphan actions: **{len(suspects)}**',f'- Buttons without declarative action: **{len(plain)}**','','## Suspect actions']
          md += [f"- `{x['action']}` declarations={x['declarations']} raw={x['raw_occurrences']}" for x in suspects] or ['- none']
          md += ['','## Plain buttons (review evidence)']+[f"- `{x['label']}` in `{x['file']}`" for x in plain[:80]]
          (out/'BLOCK05_ACTION_AUDIT.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          PY
      - name: Run current focused regression suite
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          node --test tests/r38-mobile-ux-fixes.test.mjs tests/gemini-host-r25.test.mjs tests/native-bridge-contract.test.mjs tests/android-json-file-chooser-contract-r16.test.mjs tests/random-character-r24.test.mjs tests/library-ui.test.mjs tests/r46-bridge-contract.test.mjs | tee /tmp/tests.txt
      - name: Commit audit report
        run: |
          git checkout -- star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          git config user.name braseiro-audit-bot; git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/BLOCK05_ACTION_AUDIT.*
          git commit -m 'audit(star-wars): verify R46 action wiring' || exit 0
          git push
