name: PF2 Kingmaker R35 Independent Deep Audit
on:
  push:
    branches: [pf2-kingmaker-r35-deep-certification-20261011]
    paths: ['.github/workflows/pf2-r35-deep-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pf2-r35-deep-audit
  cancel-in-progress: false
jobs:
  certify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pf2-kingmaker-r35-deep-certification-20261011
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact R35 code with SHA256 check
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Wrong runner: $env:RUNNER_NAME"}
          $dir=Join-Path $env:RUNNER_TEMP 'pf2-r35-deep-audit'
          $src=Join-Path $dir 'source'
          $rep=Join-Path $dir 'reports'
          New-Item $src -ItemType Directory -Force|Out-Null
          New-Item $rep -ItemType Directory -Force|Out-Null
          $zip=Join-Path $dir 'r35.zip'
          $auth=& git config --local --get http.https://github.com/.extraheader
          if([string]::IsNullOrWhiteSpace($auth)){throw 'Checkout auth header unavailable'}
          & curl.exe -L --fail --retry 5 --retry-delay 3 --header $auth --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' -o $zip 'https://api.github.com/repos/bra83/braseirobuild/releases/assets/629875743'
          if($LASTEXITCODE -ne 0){throw 'R35 download failed'}
          if((Get-Item $zip).Length -ne 92975058){throw 'Wrong archive size'}
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '86d9a6fd26e4139e084c8e4069f49ef53e0cf8654e0f9f5662b92f9183941aa6'){throw "Wrong R35 SHA256: $hash"}
          & tar.exe -xf $zip -C $src
          if($LASTEXITCODE -ne 0){throw 'Archive extraction failed'}
          $projects=@(Get-ChildItem $src -Recurse -File -Filter version.properties | Where-Object {Test-Path (Join-Path $_.DirectoryName 'gradlew.bat')})
          if($projects.Count -ne 1){throw "Expected one project: found $($projects.Count)"}
          $project=$projects[0].DirectoryName
          if(-not (Get-Content (Join-Path $project 'version.properties') -Raw).Contains('VERSION_NAME=9.0.36')){throw 'Incorrect version identity'}
          "AUDIT_SOURCE=$project"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "AUDIT_REPORTS=$rep"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SOURCE_SHA256_VERIFIED=$hash"
      - name: Audit real Kingmaker chapter content, quest chains and twenty disk restarts
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          & python ci\pf2-kingmaker-certification\audit_campaign.py --project "$env:AUDIT_SOURCE" --out "$env:AUDIT_REPORTS" 2>&1 | Tee-Object -FilePath (Join-Path $env:AUDIT_REPORTS 'CONTENT_CONSOLE.log')
          $code=$LASTEXITCODE
          "AUDIT_CONTENT_CODE=$code"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CONTENT_GATE_CODE=$code"
          exit 0
      - name: Execute E2E, warfare, kingdom, companion, chapter import and backup harnesses
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Push-Location $env:AUDIT_SOURCE
          python -m pip install -q pytest
          if($LASTEXITCODE -ne 0){throw 'pytest unavailable'}
          $tests=@(
            'tests_pf2\test_kingmaker_campaign_e2e.py',
            'tests_pf2\test_kingmaker_activities_and_structures.py',
            'tests_pf2\test_kingmaker_warfare.py',
            'tests_pf2\test_kingmaker_m5_director_backup.py',
            'tests_pf2\test_kingmaker_m2_chapters1_to_4.py',
            'tests_pf2\test_kingmaker_m3_chapters5_to_8.py',
            'tests_pf2\test_kingmaker_m4_chapters9_to_12.py',
            'tests_pf2\test_kingmaker_mechanics_complete.py'
          )
          python -m pytest @tests -q 2>&1 | Tee-Object -FilePath (Join-Path $env:AUDIT_REPORTS 'KINGMAKER_JAVA_AND_SQLITE.log')
          $code=$LASTEXITCODE
          Pop-Location
          "AUDIT_ENGINE_CODE=$code"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ENGINE_GATE_CODE=$code"
          exit 0
      - name: Inventory Android runtime without assuming device playthrough
        shell: powershell
        run: |
          $file=Join-Path $env:AUDIT_REPORTS 'ANDROID_RUNTIME_INVENTORY.txt'
          'Android runtime is not certified by this inventory'|Set-Content $file
          if(Get-Command adb -ErrorAction SilentlyContinue){
            'adb devices -l'|Out-File $file -Append
            (& adb devices -l 2>&1)|Out-File $file -Append
          }else{'adb unavailable on PATH'|Out-File $file -Append}
          if(Get-Command emulator -ErrorAction SilentlyContinue){
            'emulator -list-avds'|Out-File $file -Append
            (& emulator -list-avds 2>&1)|Out-File $file -Append
          }else{'emulator unavailable on PATH'|Out-File $file -Append}
          Write-Host (Get-Content $file -Raw)
      - name: Emit truthfully scoped four-gate verdict
        shell: powershell
        run: |
          @(
            '# Independent Kingmaker R35 Homologation Evidence',
            '',
            'Exact source: release 9.0.36/R35 verified by SHA256 86d9a6fd26e4139e084c8e4069f49ef53e0cf8654e0f9f5662b92f9183941aa6.',
            '',
            '## Books vs code: NOT CERTIFIED',
            'Official Adventure Path, Companion Guide and PF2 base PDFs unavailable in inspected PATHFINDER_2E Drive folder. Historical rule matrix has inconsistent page numbers (Commerce ~518 instead of 538; Army Conditions ~568 instead of 582).',
            '## Full campaign: PARTIAL',
            'Real chapter source JSON and prerequisite graph checked. Files 11/12 are compendiums, not sequential adventure chapters. This is not a real UI playthrough.',
            '## Kingdom, war and consequences: PARTIAL',
            'Production Java mechanics verified with existing harness suites; no uninterrupted real device kingdom-to-war-to-event session.',
            '## Prolonged save/restore: PARTIAL',
            '20 save/reopen/rollback cycles use actual chapter objects and file-backed audit SQLite, not Android AppDb. Separate original backup tests also executed.',
            '',
            "Content gate code: $env:AUDIT_CONTENT_CODE",
            "Engine gate code: $env:AUDIT_ENGINE_CODE",
            'Device inventory: ANDROID_RUNTIME_INVENTORY.txt',
            'Findings: REPORT_DATA.json; content: AUDITORIA_R35.md; JVM: KINGMAKER_JAVA_AND_SQLITE.log.',
            '',
            'A passing workflow DOES NOT mean 100 percent official-content or Android device homologation.'
          )|Set-Content (Join-Path $env:AUDIT_REPORTS 'VEREDICTO_QUATRO_GATES.md') -Encoding utf8
          Write-Host "DEEP_AUDIT_CONTENT_CODE=$env:AUDIT_CONTENT_CODE"
          Write-Host "DEEP_AUDIT_ENGINE_CODE=$env:AUDIT_ENGINE_CODE"
      - name: Preserve evidence even on failing gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PF2_R35_INDEPENDENT_DEEP_AUDIT
          path: \${{ runner.temp }}\pf2-r35-deep-audit\reports\*
          if-no-files-found: warn
          retention-days: 30
      - name: Fail on newly confirmed technical defects
        shell: powershell
        run: |
          if($env:AUDIT_CONTENT_CODE -ne '0'){throw "Content graph or data invariants failed: $env:AUDIT_CONTENT_CODE"}
          if($env:AUDIT_ENGINE_CODE -ne '0'){throw "Production JVM mechanics tests failed: $env:AUDIT_ENGINE_CODE"}
          Write-Host 'SOURCE_AND_ENGINE_GATES_PASS; OFFICIAL_FULL_HOMOLOGATION_STILL_NOT_PROVEN'

# Audit v2: no false errors for urban prelude without scenes, recurring NPC identity or WorldEvent without event_key.
