name: WWN real-flow source closeout

on:
  push:
    branches: [wwn-source-105-bridge]
    paths:
      - ".github/workflows/wwn-real-flow-source-closeout.yml"

permissions:
  contents: write

jobs:
  source-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge
          fetch-depth: 1

      - name: Patch canonical WWN source
        run: python3 tools/wwn_apply_real_flow_closeout.py

      - name: Validate JS syntax and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/www/jornada.js
          node --check app/src/main/assets/www/scr014.js
          node --check app/src/main/assets/www/core/scene-image-state-service.js
          node --check app/src/main/assets/www/core/runtime-narrative-provider.js
          node tools/wwn_real_flow_runtime_gate.mjs
          node tools/wwn_device_audit_gate.mjs

      - name: Commit integrated source closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/www/jornada.js app/src/main/assets/www/jornada.html app/src/main/assets/www/scr014.js app/src/main/assets/www/scr014.css app/src/main/assets/www/core/runtime-narrative-provider.js
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "fix(wwn): close real-flow source regressions"
          git push origin HEAD:wwn-source-105-bridge
