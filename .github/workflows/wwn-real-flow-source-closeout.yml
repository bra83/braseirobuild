name: WWN real-flow source closeout

on:
  push:
    branches: [wwn-source-105-bridge]
    paths:
      - ".github/workflows/wwn-real-flow-source-closeout.yml"

permissions:
  contents: write

jobs:
  source-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wwn-source-105-bridge
          fetch-depth: 0

      - name: Patch canonical WWN source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{label}: pattern not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Jornada: make PT-BR, dynamic discovery, and scene-image persistence canonical source behavior.
          p=Path('app/src/main/assets/www/jornada.js'); s=p.read_text(encoding='utf-8')
          old="import { PlayerMechanicsFacade } from './core/player-mechanics-facade.js';"
          new=old+"\nimport { skillLabelPtBr } from './core/ptbr-labels.js';\nimport { selectJourneyFeed, knownJourneyLocations } from './core/journey-discovery.js';\nimport { attachSceneImageToCampaign, storePendingSceneImageForCampaign, removeSceneImageFromCampaign, pendingSceneImageFromState } from './core/scene-image-state-service.js';"
          if old not in s: raise SystemExit('jornada imports: pattern not found')
          s=s.replace(old,new,1)

          old="function renderBars(){const m=activeCharacter();if(!m)return;const b=m.statusBars??m;$('statusName').textContent=m.name;$('hpFill').style.width=`${Math.round((b?.hp?.fill??0)*100)}%`;$('strainFill').style.width=`${Math.round((b?.systemStrain?.fill??0)*100)}%`;$('hpText').textContent=b?.hp?`${b.hp.current} / ${b.hp.max}`:'—';$('strainText').textContent=b?.systemStrain?`${b.systemStrain.current} / ${b.systemStrain.max}`:'—'}"
          new="function renderBars(){const m=activeCharacter();if(!m){$('statusName').textContent='SEM PERSONAGEM';$('hpFill').style.width='0%';$('strainFill').style.width='0%';$('hpText').textContent='—';$('strainText').textContent='—';return;}const b=m.statusBars??m;$('statusName').textContent=m.name;$('hpFill').style.width=`${Math.round((b?.hp?.fill??0)*100)}%`;$('strainFill').style.width=`${Math.round((b?.systemStrain?.fill??0)*100)}%`;$('hpText').textContent=b?.hp?`${b.hp.current} / ${b.hp.max}`:'—';$('strainText').textContent=b?.systemStrain?`${b.systemStrain.current} / ${b.systemStrain.max}`:'—'}"
          if old not in s: raise SystemExit('renderBars: pattern not found')
          s=s.replace(old,new,1)

          old="label:`${k}${known.has(k)?` ${c.skills[k]>=0?`+${c.skills[k]}`:c.skills[k]}`:' (não treinado)'}`"
          new="label:`${skillLabelPtBr(k)}${known.has(k)?` ${c.skills[k]>=0?`+${c.skills[k]}`:c.skills[k]}`:' (não treinado)'}`"
          if old not in s: raise SystemExit('skill visible label: pattern not found')
          s=s.replace(old,new,1)

          old="const starterHooks=content?.startingHooks??[],campaignRevision=Number(currentCanonicalState()?.revision??0),hookHost=$('hooks');if(starterHooks.length){const visible=Math.min(2,starterHooks.length),start=((campaignRevision%starterHooks.length)+starterHooks.length)%starterHooks.length;for(let i=0;i<visible;i++)hookHost.appendChild(card(starterHooks[(start+i)%starterHooks.length],'startingHook'));}const rumorPool=Array.isArray(pack?.rumors)?pack.rumors:[];if(rumorPool.length)hookHost.appendChild(rumorCard(rumorPool[((campaignRevision*3+1)%rumorPool.length+rumorPool.length)%rumorPool.length]));for(const s of content?.majorSites??[])$('sites').appendChild(card(s,'majorSite'));"
          new="const journeyState=currentCanonicalState(),hookHost=$('hooks');const journeyFeed=selectJourneyFeed(journeyState,{startingHooks:content?.startingHooks??[],rumors:Array.isArray(pack?.rumors)?pack.rumors:[]},{hookCount:2,rumorCount:1});for(const hook of journeyFeed.hooks)hookHost.appendChild(card(hook,'startingHook'));for(const rumor of journeyFeed.rumors)hookHost.appendChild(rumorCard(rumor));const knownLocations=knownJourneyLocations(journeyState,{majorSites:content?.majorSites??[],minorPois:content?.minorPois??[]});for(const site of knownLocations.majorSites)$('sites').appendChild(card(site,'majorSite'));"
          if old not in s: raise SystemExit('dynamic opportunities: pattern not found')
          s=s.replace(old,new,1)

          start=s.find('function attachSceneImageResult(')
          end=s.find("\n$('sceneMasterButton').onclick",start)
          if start<0 or end<0: raise SystemExit('attachSceneImageResult block not found')
          replacement="""function attachSceneImageResult(result,{generated=false,interactionId=null,model=null}={}){const attached=attachSceneImageToCampaign({persistence,campaignId,result,generated,interactionId,model});if(attached.status==='OK'){loaded=scenes.load({campaignId});projection=loaded.projection;renderScene(loaded.narrative);}return attached}\nfunction pendingSceneImage(){return pendingSceneImageFromState(currentCanonicalState())}\nfunction removeCurrentSceneImage(){const removed=removeSceneImageFromCampaign({persistence,campaignId});if(removed.status==='OK'){loaded=scenes.load({campaignId});projection=loaded.projection;renderScene(loaded.narrative);}return removed}\n"""
          s=s[:start]+replacement+s[end:]

          old="async function openScene(contentType,contentId){const result=await scenes.openContentScene({campaignId,contentType,contentId});if(!['OK','SCENE_ALREADY_OPEN_NO_MUTATION'].includes(result.status))return;loaded=scenes.load({campaignId});projection=loaded.projection;renderScene(result.narrative??loaded.narrative);const deferred=globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT??null;if(deferred){const attached=attachSceneImageResult(deferred,{generated:false});if(attached.status==='OK'){globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT=null;$('sceneImageStatus').textContent='Imagem recebida anteriormente e vinculada a esta cena.';}}syncAudio();document.querySelector('.content').scrollTo({top:0,behavior:'smooth'})}"
          new="async function openScene(contentType,contentId){const result=await scenes.openContentScene({campaignId,contentType,contentId});if(!['OK','SCENE_ALREADY_OPEN_NO_MUTATION'].includes(result.status))return;loaded=scenes.load({campaignId});projection=loaded.projection;renderScene(result.narrative??loaded.narrative);const deferred=pendingSceneImage()??globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT??null;if(deferred){const attached=attachSceneImageResult(deferred,{generated:false});if(attached.status==='OK'){globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT=null;$('sceneImageStatus').textContent='Imagem recebida anteriormente e vinculada a esta cena.';}}syncAudio();document.querySelector('.content').scrollTo({top:0,behavior:'smooth'})}"
          if old not in s: raise SystemExit('openScene deferred image: pattern not found')
          s=s.replace(old,new,1)

          old="sceneImages.onImport(result=>{if(result.status!=='OK'){$('sceneImageStatus').textContent=result.status==='CANCELLED'?'Importação cancelada.':`Imagem não importada: ${result.reason??result.status}`;return;}if(!projection.scene||projection.scene.status!=='OK'){globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT=result;$('sceneImageStatus').textContent='Imagem recebida. Abra uma oportunidade ou local; ela será vinculada à próxima cena.';return;}const attached=attachSceneImageResult(result,{generated:false});$('sceneImageStatus').textContent=attached.status==='OK'?'Imagem importada e vinculada à cena atual.':`Imagem importada, mas não vinculada: ${attached.status}`;});"
          new="sceneImages.onImport(result=>{if(result.status!=='OK'){$('sceneImageStatus').textContent=result.status==='CANCELLED'?'Importação cancelada.':`Imagem não importada: ${result.reason??result.status}`;return;}if(!projection.scene||projection.scene.status!=='OK'){const stored=storePendingSceneImageForCampaign({persistence,campaignId,result});if(stored.status==='OK'){globalThis.__BRASEIRO_DEFERRED_SCENE_IMAGE_RESULT=result;$('sceneImageStatus').textContent='Imagem recebida e guardada nesta campanha. Abra uma oportunidade ou local; ela será vinculada à próxima cena.';}else $('sceneImageStatus').textContent=`Imagem recebida, mas não persistida: ${stored.status}`;return;}const attached=attachSceneImageResult(result,{generated:false});$('sceneImageStatus').textContent=attached.status==='OK'?'Imagem importada e vinculada à cena atual.':`Imagem importada, mas não vinculada: ${attached.status}`;});"
          if old not in s: raise SystemExit('scene import persistence: pattern not found')
          s=s.replace(old,new,1)

          old="$('sceneImageButton').onclick=()=>{const r=sceneImages.requestImport();$('sceneImageStatus').textContent=r.status==='PENDING'?'Escolha uma imagem local para esta cena.':`Importação indisponível: ${r.reason??r.status}`};"
          new=old+"\n$('sceneRemoveImageButton').onclick=()=>{const removed=removeCurrentSceneImage();$('sceneImageStatus').textContent=removed.status==='OK'?'Imagem removida desta cena.':removed.status==='NO_SCENE_IMAGE_NO_MUTATION'?'Esta cena não possui imagem para remover.':`Não foi possível remover a imagem: ${removed.status}`};"
          if old not in s: raise SystemExit('scene remove button handler insertion: pattern not found')
          s=s.replace(old,new,1)

          old="renderBars();renderScene(loaded.narrative);renderMasterStatus();syncAudio();setupMechanicsUi();window.__BRASEIRO_JORNADA__={campaignId,projection:()=>structuredClone(projection),mechanicsSummary:()=>structuredClone(mechanicsSummary),refreshMechanics,openScene};"
          new="renderBars();renderScene(loaded.narrative);const bootPending=pendingSceneImage();if(bootPending&&projection.scene?.status==='OK'){const attached=attachSceneImageResult(bootPending,{generated:false});if(attached.status==='OK')$('sceneImageStatus').textContent='Imagem pendente restaurada e vinculada à cena atual.';}renderMasterStatus();syncAudio();setupMechanicsUi();window.__BRASEIRO_JORNADA__={campaignId,projection:()=>structuredClone(projection),mechanicsSummary:()=>structuredClone(mechanicsSummary),refreshMechanics,openScene};"
          if old not in s: raise SystemExit('boot pending image: pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          replace_once('app/src/main/assets/www/jornada.html',
            '<button id="sceneImageButton">IMPORTAR IMAGEM</button></div>',
            '<button id="sceneImageButton">IMPORTAR / SUBSTITUIR IMAGEM</button><button id="sceneRemoveImageButton">REMOVER IMAGEM</button></div>',
            'jornada scene image controls')

          # Atlas: never abbreviate or rotate POI names vertically.
          replace_once('app/src/main/assets/www/scr014.js',
            "label.textContent=String(rec.poiName??'POI').slice(0,18);",
            "label.textContent=String(rec.poiName??'POI');",
            'atlas POI full label')
          css=Path('app/src/main/assets/www/scr014.css')
          marker='/* WWN_REAL_FLOW_POI_HORIZONTAL_V1 */'
          text=css.read_text(encoding='utf-8')
          if marker not in text:
              text += "\n"+marker+"\n.poi-structure.poi-symbol{left:5px;top:37px;width:82px;height:auto;min-height:20px;overflow:visible;clip-path:none;filter:drop-shadow(0 2px 3px #000c);border:0;background:transparent}.poi-symbol>i{display:block;width:82px;max-width:82px;padding:3px 4px;border:1px solid #b18a4f;background:#08100fea;color:#f0d7a1;font:700 7px/1.05 Arial,sans-serif;font-style:normal;text-align:center;transform:none;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}\n"
              css.write_text(text,encoding='utf-8')

          # Canonical campaign-scoped scene-image state service.
          Path('app/src/main/assets/www/core/scene-image-state-service.js').write_text(r'''import { canonicalJson } from './canonical-json.js';

function clone(v){return structuredClone(v)}
function load(persistence,campaignId){const loaded=persistence?.loadCampaign?.(campaignId);if(!loaded||loaded.status!=='OK')return{loaded:loaded??{status:'CAMPAIGN_UNAVAILABLE'},state:null};try{return{loaded,state:JSON.parse(loaded.stateJson)}}catch{return{loaded:{...loaded,status:'CORRUPT_STATE'},state:null}}}
function normalizeImage(result){const url=String(result?.url??'').trim();if(!url)return null;return{url,sha256:String(result?.sha256??'').trim()||null,width:Number.isFinite(Number(result?.width))?Number(result.width):null,height:Number.isFinite(Number(result?.height))?Number(result.height):null}}
function commitState({persistence,campaignId,loaded,next,eventKind,eventPayload}){const newRevision=loaded.revision+1;next.revision=newRevision;const eventId=`scene-image:${campaignId}:r${newRevision}:${eventKind.toLowerCase()}`;const receipt=persistence.commit({campaignId,expectedRevision:loaded.revision,eventId,eventKind,eventPayloadJson:canonicalJson({eventId,revision:newRevision,...eventPayload,mechanicalMutation:false}),newStateJson:canonicalJson(next),rngCountersJson:canonicalJson(next.rngState?.counters??{})});return Object.freeze({status:receipt.status,receipt,eventId,revision:receipt.status==='OK'?receipt.newRevision:loaded.revision})}

export function pendingSceneImageFromState(state){const p=state?.encounterState?.pendingSceneImage;if(!p?.url)return null;return clone(p)}

export function storePendingSceneImageForCampaign({persistence,campaignId,result}={}){const image=normalizeImage(result);if(!image)return Object.freeze({status:'IMAGE_URL_REQUIRED_NO_MUTATION'});const {loaded,state}=load(persistence,campaignId);if(!state)return Object.freeze({status:loaded.status});const next=clone(state);next.encounterState={...(next.encounterState??{}),pendingSceneImage:{...image,campaignId,receivedAtRevision:loaded.revision+1}};return commitState({persistence,campaignId,loaded,next,eventKind:'SCENE_IMAGE_PENDING',eventPayload:{image}})}

export function attachSceneImageToCampaign({persistence,campaignId,result,generated=false,interactionId=null,model=null}={}){const image=normalizeImage(result);if(!image)return Object.freeze({status:'IMAGE_URL_REQUIRED_NO_MUTATION'});const {loaded,state}=load(persistence,campaignId);if(!state)return Object.freeze({status:loaded.status});const current=state.encounterState?.currentScene;if(!current)return Object.freeze({status:'ACTIVE_SCENE_REQUIRED_NO_MUTATION'});const next=clone(state);next.encounterState={...(next.encounterState??{}),currentScene:{...current,imageRef:image.url,imageSha256:image.sha256}};delete next.encounterState.pendingSceneImage;if(generated){const prior=next.aiState?.sceneVisualSession??{};next.aiState={...(next.aiState??{}),sceneVisualSession:{previousInteractionId:interactionId??prior.previousInteractionId??null,model:model??prior.model??null,sequence:(prior.sequence??0)+1,lastSceneRevision:loaded.revision+1,lastImageSha256:image.sha256??null}}}return commitState({persistence,campaignId,loaded,next,eventKind:generated?'SCENE_IMAGE_GENERATED':'SCENE_IMAGE_ATTACHED',eventPayload:{image,generated,interactionId:interactionId??null,model:model??null}})}

export function removeSceneImageFromCampaign({persistence,campaignId}={}){const {loaded,state}=load(persistence,campaignId);if(!state)return Object.freeze({status:loaded.status});const current=state.encounterState?.currentScene;const pending=state.encounterState?.pendingSceneImage;if(!current?.imageRef&&!current?.imageUrl&&!pending?.url)return Object.freeze({status:'NO_SCENE_IMAGE_NO_MUTATION'});const next=clone(state);if(next.encounterState?.currentScene){delete next.encounterState.currentScene.imageRef;delete next.encounterState.currentScene.imageUrl;delete next.encounterState.currentScene.imageSha256}if(next.encounterState)delete next.encounterState.pendingSceneImage;return commitState({persistence,campaignId,loaded,next,eventKind:'SCENE_IMAGE_REMOVED',eventPayload:{removed:true}})}
''',encoding='utf-8')

          # Offline major-scene fallback: substantive and non-inventive rather than a one-line stub.
          rp=Path('app/src/main/assets/www/core/runtime-narrative-provider.js'); rs=rp.read_text(encoding='utf-8')
          anchor='export class RuntimeBarbaraProvider{'
          if anchor not in rs: raise SystemExit('runtime narrative class anchor missing')
          helper=r'''function majorLocalFallback(mechanicalEvent,state){
  const scene=mechanicalEvent?.scene??{};const title=String(scene.title??'CENA').trim();const summary=String(scene.summary??'').trim();const situation=String(scene.situation??scene.premise??'').trim();const leads=(scene.leads??[]).map(v=>String(v??'').trim()).filter(Boolean);const pos=state?.worldState?.position??{};const where=String(pos.name??'').trim();
  const facts=[summary,situation,...leads].filter(Boolean);if(!facts.length)return null;
  const core=facts.join(' ');const place=where?`A posição registrada do grupo é ${where}. `:'';
  const paragraphs=[
    `${title}. ${core}`,
    `${place}A cena se abre sem antecipar o que está oculto. O que o personagem pode tomar como certo é apenas o que já está exposto pelos fatos acima; qualquer ameaça, intenção, passagem secreta, criatura, recurso ou consequência que não esteja presente nesse contexto continua desconhecida.`,
    `Antes de qualquer resolução mecânica, o Mestre mantém o foco no presente: ${summary||core} Isso é situação, não resultado. Nenhum teste foi rolado por este texto, nenhum recurso foi gasto, nenhuma posição mudou e nenhuma decisão foi tomada pelo personagem.`,
    situation?`A tensão imediata vem desta situação pública: ${situation} Ela permanece aberta. O personagem pode observar, conversar, recuar, investigar, viajar ou declarar outra intenção; quando alguma dessas escolhas exigir risco ou regra, a resolução mecânica deve acontecer antes de a ficção afirmar sucesso ou falha.`:`A situação ainda não determina um caminho obrigatório. O personagem pode declarar livremente o que tenta fazer; se a intenção exigir risco ou regra, a resolução mecânica deve acontecer antes de a ficção afirmar sucesso ou falha.`,
    leads.length?`Entre os elementos já perceptíveis que podem orientar uma decisão estão: ${leads.join('; ')}. Eles são possibilidades, não missões obrigatórias, e podem ser ignorados.`:`Não há uma missão obrigatória embutida nesta abertura. O mundo permanece disponível para exploração e a próxima direção depende da declaração do jogador.`,
    `Sem uma resposta do modelo narrativo, Barbara local não acrescenta clima, pessoas, objetos ou lore que o estado não forneceu. Em vez de preencher lacunas com invenção, ela preserva o quadro público e deixa espaço para que a próxima ação revele mais do mundo por meios canônicos.`,
    `O instante fica suspenso nesse ponto: ${core} O que acontece em seguida ainda não foi decidido. Diga o que seu personagem faz, pergunta, procura ou tenta alcançar; a campanha continua a partir dessa escolha, mantendo separados descrição, segredo do Mestre e resultado mecânico.`
  ];
  return paragraphs.join('\n\n');
}

'''
          if 'function majorLocalFallback(' not in rs: rs=rs.replace(anchor,helper+anchor,1)
          old="if(mechanicalEvent?.kind==='SCENE_OPENED'&&scene){const visible=[scene.summary,scene.situation,scene.premise].map(v=>String(v??'').trim()).filter(Boolean);if(visible.length)return Object.freeze({status:'OK',provider:'LOCAL_SCENE',parentMechanicalEventId:mechanicalEvent.eventId,mechanicalRevision:mechanicalEvent.revision,text:visible.join('\\n\\n')})}"
          new="if(mechanicalEvent?.kind==='SCENE_OPENED'&&scene){const text=majorLocalFallback(mechanicalEvent,state);if(text)return Object.freeze({status:'OK',provider:'LOCAL_SCENE',parentMechanicalEventId:mechanicalEvent.eventId,mechanicalRevision:mechanicalEvent.revision,text})}"
          if old not in rs: raise SystemExit('runtime narrative opening fallback pattern missing')
          rs=rs.replace(old,new,1)
          old="if(scene&&['travelArrival','travelEncounter','hexExploration','worldEvent'].includes(scene.contentType)){const visible=[scene.title,scene.summary,scene.situation,scene.premise].map(v=>String(v??'').trim()).filter(Boolean);if(visible.length)return Object.freeze({status:'OK',provider:'LOCAL_WORLD_SCENE',parentMechanicalEventId:mechanicalEvent.eventId,mechanicalRevision:mechanicalEvent.revision,text:visible.join('\\n\\n')})}"
          new="if(scene&&['travelArrival','travelEncounter','hexExploration','worldEvent'].includes(scene.contentType)){const text=majorLocalFallback(mechanicalEvent,state);if(text)return Object.freeze({status:'OK',provider:'LOCAL_WORLD_SCENE',parentMechanicalEventId:mechanicalEvent.eventId,mechanicalRevision:mechanicalEvent.revision,text})}"
          if old not in rs: raise SystemExit('runtime narrative world fallback pattern missing')
          rs=rs.replace(old,new,1);rp.write_text(rs,encoding='utf-8')

          # Gates: execute behavior, not only regex.
          Path('tools/wwn_real_flow_runtime_gate.mjs').write_text(r'''import assert from 'node:assert/strict';
import fs from 'node:fs';
import { MemoryPersistenceAdapter } from '../app/src/main/assets/www/core/persistence-port.js';
import { storePendingSceneImageForCampaign, attachSceneImageToCampaign, removeSceneImageFromCampaign, pendingSceneImageFromState } from '../app/src/main/assets/www/core/scene-image-state-service.js';
import { selectJourneyFeed, knownJourneyLocations } from '../app/src/main/assets/www/core/journey-discovery.js';
import { WorldActionService } from '../app/src/main/assets/www/core/world-service.js';
import { RuntimeBarbaraProvider } from '../app/src/main/assets/www/core/runtime-narrative-provider.js';

function create(p,id,state){p.createCampaign({campaignId:id,displayName:id,stateJson:JSON.stringify(state),masterSeed:'seed:'+id,rngAlgorithm:'xoshiro128ss-v1',initialSnapshotId:'s0'})}
const p=new MemoryPersistenceAdapter();
create(p,'A',{campaignId:'A',revision:0,rngState:{counters:{}},worldState:{position:{q:17,r:22,name:'RUÍNAS DA VIGÍLIA'},atlas:{hexes:{'17,22':{q:17,r:22,discovered:true,visited:true,poiName:'RUÍNAS DA VIGÍLIA'}}}},encounterState:{}});
create(p,'B',{campaignId:'B',revision:0,rngState:{counters:{}},worldState:{position:{q:3,r:3}},encounterState:{}});
const img={url:'https://appassets.androidplatform.net/scene-images/a.png',sha256:'abc',width:100,height:60};
assert.equal(storePendingSceneImageForCampaign({persistence:p,campaignId:'A',result:img}).status,'OK');
let a=JSON.parse(p.loadCampaign('A').stateJson),b=JSON.parse(p.loadCampaign('B').stateJson);assert.equal(pendingSceneImageFromState(a).url,img.url);assert.equal(pendingSceneImageFromState(b),null);
let loaded=p.loadCampaign('A');a=JSON.parse(loaded.stateJson);a.revision=loaded.revision+1;a.encounterState.currentScene={contentType:'majorSite',contentId:'site',publicScene:{status:'OK',contentType:'majorSite',contentId:'site',title:'LOCAL',summary:'Uma ruína conhecida.'}};assert.equal(p.commit({campaignId:'A',expectedRevision:loaded.revision,eventId:'scene-open',eventKind:'SCENE_OPENED',eventPayloadJson:'{}',newStateJson:JSON.stringify(a),rngCountersJson:'{}'}).status,'OK');
assert.equal(attachSceneImageToCampaign({persistence:p,campaignId:'A',result:img}).status,'OK');a=JSON.parse(p.loadCampaign('A').stateJson);assert.equal(a.encounterState.currentScene.imageRef,img.url);assert.equal(a.encounterState.pendingSceneImage,undefined);assert.equal(removeSceneImageFromCampaign({persistence:p,campaignId:'A'}).status,'OK');a=JSON.parse(p.loadCampaign('A').stateJson);assert.equal(a.encounterState.currentScene.imageRef,undefined);
const feed1=selectJourneyFeed({revision:1,rngState:{masterSeed:'x'}},{startingHooks:[{id:'h1'},{id:'h2'},{id:'h3'}],rumors:['r1','r2','r3']},{hookCount:2,rumorCount:1});const feed2=selectJourneyFeed({revision:2,rngState:{masterSeed:'x'}},{startingHooks:[{id:'h1'},{id:'h2'},{id:'h3'}],rumors:['r1','r2','r3']},{hookCount:2,rumorCount:1});assert.equal(feed1.hooks.length,2);assert.notDeepEqual(feed1.hooks,feed2.hooks);
