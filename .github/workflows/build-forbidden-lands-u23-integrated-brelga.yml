name: Forbidden Lands U26 integrated - BRELGA APK and Android smoke
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fl-u23-integrated-apk
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  SOURCE_COMMIT: 423798ac3f8cefb8fc14caf114cb2779b6d57d92
  SOURCE_NAME: BRASEIRO_FORBIDDEN_LANDS_U19_CI_WINDOWS_BROWSER_FIXED_FULL_SOURCE.zip
  SOURCE_SHA256: fd6485a92b2337b854de06279cf98fb14119b121db0c4ebb05be805317d9aa91
  SOURCE_BYTES: '40470551'
  SOURCE_API: https://api.firestorage.ai/dev/file/shares/gw3IuQ6vowPp
  NATIVE_DONOR_API: https://api.firestorage.ai/dev/file/shares/7yPVWDuI4kl_
  NATIVE_DONOR_NAME: BRASEIRO_FORBIDDEN_LANDS_3.3.19_R23_SOURCE.zip
  NATIVE_DONOR_SHA256: 2ee4e3af34459421a4b1e0389125cfcf057ce6938e8ddb8e281a770fca599f83
  EXPECTED_SIGNER: 9d0f1089b3fb6c225f1f59462750864e897c4d92
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover pinned private native source and apply exact integrated runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Unexpected runner $env:RUNNER_NAME" }
          if (-not (Test-Path 'D:\') -or (Get-PSDrive D).Free -lt 5GB) { throw 'BRELGA needs 5 GB free on D:' }
          $root="D:\brelga-fl-u23-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "FL_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $zip=Join-Path $root $env:SOURCE_NAME
          $cached=Get-ChildItem 'D:\' -Directory -Filter 'brelga-fl-u*' | ForEach-Object { $candidate=Join-Path $_.FullName $env:SOURCE_NAME; if (Test-Path $candidate) { Get-Item $candidate } } | Where-Object { $_.Length -eq [int64]$env:SOURCE_BYTES } | Select-Object -First 1
          if ($cached) { Copy-Item $cached.FullName $zip }
          else {
            $meta=Invoke-RestMethod -Uri ($env:SOURCE_API + '/files?maxResults=100')
            $matches=@($meta.files | Where-Object { $_.fileName -eq $env:SOURCE_NAME })
            if ($matches.Count -ne 1) { throw 'Pinned native source unavailable; do not use an older source' }
            $ticket=Invoke-RestMethod -Method Post -Uri ($env:SOURCE_API + '/files/' + $matches[0].fileId + '/download')
            & curl.exe --fail --location --retry 4 --retry-all-errors -o $zip $ticket.downloadUrl
            if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SOURCE_SHA256 -or (Get-Item $zip).Length -ne [int64]$env:SOURCE_BYTES) { throw 'Source SHA/length mismatch' }
          $project=Join-Path $root 'project'
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          & tar.exe -xf $zip -C $project
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          & python.exe "$env:GITHUB_WORKSPACE\ci\fl-u23\prepare_source.py" $project
          if ($LASTEXITCODE -ne 0) { throw 'Runtime differs from integrated source' }
          # Restore only the three private native files; never use donor runtime.
          $donorZip=Join-Path $root $env:NATIVE_DONOR_NAME
          $nativeCache=Get-ChildItem 'D:\' -Directory -Filter 'brelga-fl-u*' | ForEach-Object { $candidate=Join-Path $_.FullName $env:NATIVE_DONOR_NAME; if (Test-Path $candidate) { Get-Item $candidate } } | Select-Object -First 1
          if ($nativeCache) { Copy-Item $nativeCache.FullName $donorZip }
          else {
            $nativeMeta=Invoke-RestMethod -Uri ($env:NATIVE_DONOR_API + '/files?maxResults=100')
            $nativeMatches=@($nativeMeta.files | Where-Object { $_.fileName -eq $env:NATIVE_DONOR_NAME })
            if ($nativeMatches.Count -ne 1) { throw 'Pinned historical native donor unavailable' }
            $nativeTicket=Invoke-RestMethod -Method Post -Uri ($env:NATIVE_DONOR_API + '/files/' + $nativeMatches[0].fileId + '/download')
            & curl.exe --fail --location --retry 4 --retry-all-errors -o $donorZip $nativeTicket.downloadUrl
            if ($LASTEXITCODE -ne 0) { throw 'Historical native donor download failed' }
          }
          if ((Get-FileHash $donorZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:NATIVE_DONOR_SHA256) { throw 'Native donor SHA mismatch' }
          & python.exe "$env:GITHUB_WORKSPACE\ci\fl-u23\recover_native_config.py" $project $donorZip
          if ($LASTEXITCODE -ne 0) { throw 'Native configuration recovery failed' }
          $candidates=@('C:\actions-runner\android-sdk',$env:ANDROID_HOME,$env:ANDROID_SDK_ROOT)
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $sdk=$candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ 'platforms\android-36')) -and (Test-Path (Join-Path $_ 'build-tools\36.0.0\aapt.exe')) } | Select-Object -First 1
          if (-not $sdk) { throw 'Android SDK 36 not found' }
          "ANDROID_HOME=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GRADLE_USER_HOME=$root\gradle-home" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exact dependencies and source checks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:FL_ROOT\project"
          & npm.cmd ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          foreach($entry in @(@('@rollup/rollup-win32-x64-msvc','rollup'),@('@esbuild/win32-x64','esbuild'))) {
            & node.exe -e "try { require.resolve('$($entry[0])/package.json'); } catch (_) { process.exit(1); }"
            if ($LASTEXITCODE -ne 0) {
              $v=(& node.exe -p "require('./node_modules/$($entry[1])/package.json').version").Trim()
              Write-Host "Recovering exact native module $($entry[0])@$v"
              $packed=& npm.cmd pack "$($entry[0])@$v" --json --ignore-scripts --pack-destination $env:FL_ROOT
              if ($LASTEXITCODE -ne 0) { throw 'Windows native package download failed' }
              $archive=Join-Path $env:FL_ROOT (($packed -join "`n" | ConvertFrom-Json)[0].filename)
              $module=Join-Path (Join-Path (Get-Location) 'node_modules') $entry[0]
              New-Item -ItemType Directory -Path $module -Force | Out-Null
              & tar.exe -xf $archive -C $module --strip-components=1
              if ($LASTEXITCODE -ne 0) { throw 'Windows native package extraction failed' }
              & node.exe -e "try { require.resolve('$($entry[0])/package.json'); } catch (_) { process.exit(1); }"
              if ($LASTEXITCODE -ne 0) { throw 'Installed Windows native module cannot be resolved' }
            }
          }
          & npm.cmd run lint
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
          # Supply the Unix compiler locator used by historical validators on Windows.
          # It returns the real npm-locked TypeScript compiler, not a .cmd shim.
          $tools=Join-Path $env:FL_ROOT 'validation-tools'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          $compiler=Join-Path (Get-Location).Path 'node_modules\typescript\bin\tsc'
          if (-not (Test-Path $compiler)) { throw 'Locked TypeScript compiler missing' }
          $env:FL_TYPESCRIPT_COMPILER=$compiler
          $locator=@'
          using System;
          using System.IO;
          public static class WhichCompiler {
            public static int Main(string[] args) {
              if (args.Length != 1 || args[0] != "tsc") {
                Console.Error.WriteLine("Unsupported compiler lookup");
                return 2;
              }
              string compiler = Environment.GetEnvironmentVariable("FL_TYPESCRIPT_COMPILER");
              if (String.IsNullOrEmpty(compiler) || !File.Exists(compiler)) return 1;
              Console.WriteLine(Path.GetFullPath(compiler));
              return 0;
            }
          }
          '@
          Add-Type -TypeDefinition $locator -OutputAssembly (Join-Path $tools 'which.exe') -OutputType ConsoleApplication
          $env:PATH="$tools;$env:PATH"
          & which.exe tsc
          if ($LASTEXITCODE -ne 0) { throw 'Windows compiler locator failed' }
          & npm.cmd run verify:unified-u19
          if ($LASTEXITCODE -ne 0) { throw 'Source contracts failed' }
          & node.exe --experimental-strip-types scripts/verify-u25-travel-karg-closure.mjs
          if ($LASTEXITCODE -ne 0) { throw 'U25 travel/Karg regression failed' }
          & node.exe --experimental-strip-types scripts/verify-u25-forced-march-failclosed.mjs
          if ($LASTEXITCODE -ne 0) { throw 'U25 forced march regression failed' }
          & node.exe -r ./work/tsx-userinfo-shim.cjs --import tsx scripts/verify-u26-legacy-resource-dice-migration.mjs
          if ($LASTEXITCODE -ne 0) { throw 'U26 legacy-resource-dice-migration gate failed' }
          & node.exe -r ./work/tsx-userinfo-shim.cjs --import tsx scripts/verify-u26-50-day-campaign-clock.mjs
          if ($LASTEXITCODE -ne 0) { throw 'U26 50-day-campaign-clock gate failed' }
          & node.exe -r ./work/tsx-userinfo-shim.cjs --import tsx scripts/verify-u26-gm-spell-pending.mjs
          if ($LASTEXITCODE -ne 0) { throw 'U26 gm-spell-pending gate failed' }
      - name: All fourteen Chromium groups and strict 82 gate on integrated runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:FL_ROOT\project"
          & python.exe -m pip install playwright==1.55.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          & python.exe -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed' }
          $server=Start-Process node.exe -ArgumentList @('node_modules/vite/bin/vite.js','--host','127.0.0.1','--port','4173','--strictPort') -WorkingDirectory (Get-Location).Path -PassThru -RedirectStandardOutput 'vite-server.log' -RedirectStandardError 'vite-server-error.log'
          try {
            $ready=$false
            for($i=0;$i -lt 60;$i++) {
              try { Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:4173/e2e/official-ui-browser-harness.html' | Out-Null; $ready=$true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Vite did not start' }
            $env:FL_E2E_ORIGIN='http://127.0.0.1:4173'
            & python.exe e2e/run_official_suite.py
            if ($LASTEXITCODE -ne 0) { throw 'At least one real browser group failed' }
          $suite=Get-Content 'e2e-results/u13-browser-suite-summary.json' -Raw | ConvertFrom-Json
          if ($suite.cases.Count -ne 14 -or @($suite.cases | Where-Object { $_.status -ne 'PASS' }).Count -ne 0) { throw 'U26 requires all 14 fresh browser groups' }
            & python.exe scripts/verify_u14_browser_evidence.py e2e-results
            if ($LASTEXITCODE -ne 0) { throw 'Initial evidence failed' }
            $env:GITHUB_SHA=$env:SOURCE_COMMIT
            & python.exe scripts/verify_u22_complete_82.py e2e-results reports/U19_OFFICIAL_MATRIX_43.json
            if ($LASTEXITCODE -ne 0) { throw 'Strict 82/82 gate failed' }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
      - name: Build fresh native Android and unit tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:FL_ROOT\project"
          & npm.cmd run android:sync
          if ($LASTEXITCODE -ne 0) { throw 'Capacitor sync failed' }
          & npm.cmd run verify:android-assets
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Android assets failed' }
          & npm.cmd run verify:google-drive-signing
          if ($LASTEXITCODE -ne 0) { throw 'Historical signing configuration changed' }
          & node.exe scripts/run-gradle-task.mjs assembleDebug
          if ($LASTEXITCODE -ne 0) { throw 'APK compilation failed' }
          & node.exe scripts/run-gradle-task.mjs testDebugUnitTest
          if ($LASTEXITCODE -ne 0) { throw 'Native unit tests failed' }
      - name: Verify binary identity, historic signature, source and every bundled web asset
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $project="$env:FL_ROOT\project"
          $out="$env:FL_ROOT\release"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $apk="$out\BRASEIRO_FORBIDDEN_LANDS_3.3.24_U26_INTEGRATED.apk"
          Copy-Item "$project\android\app\build\outputs\apk\debug\app-debug.apk" $apk
          $bt="$env:ANDROID_HOME\build-tools\36.0.0"
          $badging=(& "$bt\aapt.exe" dump badging $apk | Out-String)
          if ($LASTEXITCODE -ne 0 -or $badging -notmatch "package: name='com\.braseiro\.forbiddenlands'" -or $badging -notmatch "versionCode='303924'" -or $badging -notmatch "versionName='3\.3\.24'") { throw 'APK identity mismatch' }
          $sig=(& "$bt\apksigner.bat" verify --verbose --print-certs $apk | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Invalid APK signature' }
          $m=[regex]::Match($sig,'(?im)certificate SHA-1 digest:\s*([0-9a-f:]+)')
          if (-not $m.Success -or $m.Groups[1].Value.Replace(':','').ToLowerInvariant() -ne $env:EXPECTED_SIGNER) { throw 'Signer differs from installed application' }
          & python.exe "$env:GITHUB_WORKSPACE\ci\fl-u23\verify_apk.py" $project $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK bundled source proof failed' }
          Copy-Item "$project\e2e-results\u22-complete-82.json" "$out\U26_STRICT_82_GATE.json"
          Copy-Item "$project\e2e-results\u13-browser-suite-summary.json" "$out\U26_BROWSER_SUITE.json"
          $sig | Set-Content "$out\APK_SIGNATURE.txt"
          $badging | Set-Content "$out\APK_IDENTITY.txt"
      - name: Publish verified test APK and proof
        id: publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag="forbidden-lands-u23-integrated-$env:GITHUB_RUN_ID"
          $out="$env:FL_ROOT\release"
          $notes="$out\RELEASE_NOTES.md"
          @('Forbidden Lands U26 integrado.','43 encontros, 121 escolhas e 82 caminhos na suíte real; fonte integrada conferida antes do build.','Assinatura histórica, identidade e todos os assets web comparados no APK.','Pré-release de teste. Smoke Android automatizado é executado no job seguinte; aparelho físico e motores TTS externos não certificados.',"SOURCE_COMMIT=$env:SOURCE_COMMIT") | Set-Content $notes -Encoding utf8
          # BRELGA is self-hosted Windows and has no gh.exe. Use official GitHub
          # Releases REST API with the short-lived job token and a DRAFT gate.
          $api="https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept="application/vnd.github+json"
            'X-GitHub-Api-Version'="2022-11-28"
          }
          $metadata=@{
            tag_name=$tag
            target_commitish=$env:GITHUB_SHA
            name='Forbidden Lands 3.3.24 U26 integrado - teste'
            body=[System.IO.File]::ReadAllText($notes)
            draft=$true
            prerelease=$true
          } | ConvertTo-Json -Depth 6
          $release=Invoke-RestMethod -Method Post -Uri $api -Headers $headers -Body ([Text.Encoding]::UTF8.GetBytes($metadata)) -ContentType 'application/json; charset=utf-8'
          if (-not $release.id -or -not $release.upload_url) { throw 'GitHub returned no draft release/upload endpoint' }
          $uploadBase=([string]$release.upload_url).Split('{')[0]
          $assets=@(Get-ChildItem $out -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' })
          if (-not ($assets | Where-Object { $_.Name -eq 'BRASEIRO_FORBIDDEN_LANDS_3.3.24_U26_INTEGRATED.apk' }) -or
              -not ($assets | Where-Object { $_.Name -eq 'BRASEIRO_FORBIDDEN_LANDS_3.3.24_U26_INTEGRATED.apk.sha256' }) -or
              -not ($assets | Where-Object { $_.Name -eq 'BUILD_PROOF_U26.json' })) {
            throw 'Required APK, SHA and build proof are missing; release remains draft'
          }
          foreach ($file in $assets) {
            $uri=$uploadBase+'?name='+[Uri]::EscapeDataString($file.Name)
            $uploaded=Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -InFile $file.FullName -ContentType 'application/octet-stream'
            if ($uploaded.state -ne 'uploaded' -or [int64]$uploaded.size -ne [int64]$file.Length) {
              throw "Asset readback mismatch: $($file.Name); release remains draft"
            }
          }
          # GitHub can return nested arrays from Windows PowerShell's JSON pipeline.
          # Flatten exactly one JSON asset level and cast the PROPERTY, never $_.
          $responseAssets=Invoke-RestMethod -Method Get -Uri "$api/$($release.id)/assets?per_page=100" -Headers $headers
          $serverAssets=New-Object 'System.Collections.Generic.List[object]'
          foreach ($entry in $responseAssets) {
            if ($entry -is [array]) {
              foreach ($nested in $entry) { [void]$serverAssets.Add($nested) }
            } else { [void]$serverAssets.Add($entry) }
          }
          foreach ($file in $assets) {
            $matches=0
            foreach ($entry in $serverAssets) {
              if ([string]($entry.name) -eq [string]($file.Name) -and [int64]($entry.size) -eq [int64]($file.Length)) { $matches++ }
            }
            if ($matches -ne 1) { throw "Asset inventory mismatch: $($file.Name); release remains draft" }
          }
          if ($serverAssets.Count -ne $assets.Count) { throw 'Release inventory has unexpected or missing assets' }
          $publishBody=@{draft=$false;prerelease=$true} | ConvertTo-Json
          $published=Invoke-RestMethod -Method Patch -Uri "$api/$($release.id)" -Headers $headers -Body ([Text.Encoding]::UTF8.GetBytes($publishBody)) -ContentType 'application/json; charset=utf-8'
          if ($published.draft -ne $false -or $published.tag_name -ne $tag) { throw 'Release did not finish publishing' }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "RELEASE_URL=$($published.html_url)"
      - name: Preserve failure diagnosis in logs
        if: failure()
        shell: powershell
        run: |
          $project="$env:FL_ROOT\project"
          if (Test-Path "$project\e2e-results") {
            Get-ChildItem "$project\e2e-results\*.stderr.log" | ForEach-Object { Write-Host $_.Name; Get-Content $_.FullName -Tail 80 }
          }
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact published APK and verify digest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -Eeuo pipefail
          gh release download "$RELEASE_TAG" --pattern 'BRASEIRO_FORBIDDEN_LANDS_3.3.24_U26_INTEGRATED.apk*' --dir incoming
          cd incoming
          sha256sum -c BRASEIRO_FORBIDDEN_LANDS_3.3.24_U26_INTEGRATED.apk.sha256
          python -m pip install playwright==1.55.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed APK - native WebView and three reopens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r incoming/BRASEIRO_FORBIDDEN_LANDS_3.3.24_U26_INTEGRATED.apk
            adb logcat -c
            python ci/fl-u23/emulator_smoke.py
      - name: Attach emulator proof to the same release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" fl-u23-android-smoke.json fl-u23-android-smoke.png --clobber
