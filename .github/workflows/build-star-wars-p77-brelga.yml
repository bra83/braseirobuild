name: Build Star Wars R54 P77 APK on BRELGA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-star-wars-p77-brelga.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          $candidates = @('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $candidates += 'C:\Android\Sdk'
          $sdk = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ($candidate -and (Test-Path $candidate) -and (Test-Path (Join-Path $candidate 'platform-tools'))) {
              $sdk = $candidate
              break
            }
          }
          if (-not $sdk) { throw 'Android SDK not found on BRELGA' }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download exact P77 source checkpoint
        id: src
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.firestorage.ai/dev/file/shares/tc9KTTZ6oSai'
          $work = Join-Path $env:RUNNER_TEMP 'sw-p77-transfer'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $meta = Invoke-RestMethod -Method Get -Uri ($api + '/files?maxResults=100')
          if (-not $meta.files -or $meta.files.Count -ne 1) { throw "Expected 1 transfer file, got $($meta.files.Count)" }
          $file = $meta.files[0]
          if ($file.fileName -ne 'BRASEIRO_STAR_WARS_EDGE_R54_P77_SOURCE_CHECKPOINT.zip') { throw "Unexpected transfer file $($file.fileName)" }
          $ticket = Invoke-RestMethod -Method Post -Uri ($api + '/files/' + $file.fileId + '/download')
          if (-not $ticket.downloadUrl) { throw 'No P77 download URL' }
          $zip = Join-Path $work 'BRASEIRO_STAR_WARS_EDGE_R54_P77_SOURCE_CHECKPOINT.zip'
          & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $zip $ticket.downloadUrl
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $LASTEXITCODE" }
          $bytes = (Get-Item $zip).Length
          if ($bytes -ne 79377122) { throw "P77 byte count mismatch: $bytes" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '3703dff112a097a2fa4a71d46639ba3a7a2515139121dd8c737a6d6ada08d46c') { throw "P77 SHA mismatch: $hash" }
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract and detect Android project
        id: project
        shell: powershell
        env:
          SOURCE_ZIP: ${{ steps.src.outputs.zip }}
        run: |
          $ErrorActionPreference = 'Stop'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'sw-p77-project'
          Remove-Item $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          & tar.exe -xf $env:SOURCE_ZIP -C $extractRoot
          if ($LASTEXITCODE -ne 0) { throw 'P77 extraction failed' }
          $settings = Get-ChildItem $extractRoot -Recurse -File |
            Where-Object {
              $_.Name -in @('settings.gradle','settings.gradle.kts') -and
              $_.FullName -notmatch '[\\/](build|[.]gradle)[\\/]' -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradlew.bat')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradle\wrapper\gradle-wrapper.jar')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'app\src\main\AndroidManifest.xml'))
            } | Sort-Object FullName | Select-Object -First 1
          if (-not $settings) { throw 'Complete Android Studio project not found in P77' }
          "root=$($settings.Directory.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Source gates before Android build
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          node --check app/src/main/assets/vtt/r46/final-runtime.js
          if ($LASTEXITCODE -ne 0) { throw 'final-runtime syntax failed' }
          node --check app/src/main/assets/vtt/js/core/uiBridge.bundle.js
          if ($LASTEXITCODE -ne 0) { throw 'uiBridge bundle syntax failed' }
          node --test tests/r54-p76-tts-kokoro-pipeline.test.mjs tests/r54-p77-android-build-fix.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'P77 TTS focal failed' }

      - name: Build debug APK
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path variable:PSNativeCommandUseErrorActionPreference) { $PSNativeCommandUseErrorActionPreference = $false }
          & .\gradlew.bat --version --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Gradle wrapper failed: $LASTEXITCODE" }
          & .\gradlew.bat clean assembleDebug --stacktrace --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "assembleDebug failed: $LASTEXITCODE" }

      - name: Validate packaged correction and APK
        id: apk
        shell: powershell
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Get-ChildItem $env:ROOT -Recurse -File -Filter '*.apk' |
            Where-Object { $_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]' } |
            Sort-Object FullName | Select-Object -First 1
          if (-not $apk) { throw 'Debug APK not found' }
          $outDir = Join-Path $env:RUNNER_TEMP 'sw-p77-apk-out'
          Remove-Item $outDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $dest = Join-Path $outDir 'BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk'
          Copy-Item $apk.FullName $dest -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($dest)
          try {
            $shellEntry = $z.GetEntry('assets/vtt/r46-shell.html')
            $runtimeEntry = $z.GetEntry('assets/vtt/r46/final-runtime.js')
            if (-not $shellEntry -or -not $runtimeEntry) { throw 'Packaged VTT runtime missing' }
            $sr = New-Object IO.StreamReader($shellEntry.Open())
            $shellText = $sr.ReadToEnd(); $sr.Dispose()
            $rr = New-Object IO.StreamReader($runtimeEntry.Open())
            $runtimeText = $rr.ReadToEnd(); $rr.Dispose()
            if ($shellText -notmatch 'data-version="1[.]0[.]77"') { throw 'APK shell is not 1.0.77' }
            if ($runtimeText -notmatch 'R54 P77') { throw 'APK runtime is not P77' }
            if ($runtimeText -notmatch 'CAMPANHA') { throw 'APK does not contain corrected CAMPANHA control' }
            if ($runtimeText -notmatch 'final-tts-engine') { throw 'APK missing dynamic TTS engine UI' }
            if ($runtimeText -notmatch 'Velocidade Kokoro') { throw 'APK missing Kokoro speed UI' }
          } finally { $z.Dispose() }

          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk" | Set-Content (Join-Path $outDir 'BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk.sha256') -Encoding ascii

          $bt = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $bt) { throw 'Android build-tools unavailable' }
          $aapt = Join-Path $bt.FullName 'aapt.exe'
          $signer = Join-Path $bt.FullName 'apksigner.bat'
          & $aapt dump badging $dest 2>&1 | Tee-Object -FilePath (Join-Path $outDir 'APK_BADGING.txt')
          if ($LASTEXITCODE -ne 0) { throw 'aapt badging failed' }
          $badging = Get-Content (Join-Path $outDir 'APK_BADGING.txt') -Raw
          if ($badging -notmatch "package: name='com[.]braseiro[.]starwarsedge'") { throw 'Wrong applicationId' }
          if ($badging -notmatch "versionCode='10077'") { throw 'Wrong versionCode' }
          if ($badging -notmatch "versionName='1[.]0[.]77'") { throw 'Wrong versionName' }
          $sig='not-checked'
          if (Test-Path $signer) {
            & $signer verify --verbose --print-certs $dest 2>&1 | Tee-Object -FilePath (Join-Path $outDir 'APK_SIGNATURE.txt')
            if ($LASTEXITCODE -ne 0) { throw 'APK signature validation failed' }
            $sig='verified'
          }
          @(
            'STATUS=PASS',
            "RUNNER_NAME=$env:RUNNER_NAME",
            "GITHUB_RUN_ID=$env:GITHUB_RUN_ID",
            'SOURCE_NAME=BRASEIRO_STAR_WARS_EDGE_R54_P77_SOURCE_CHECKPOINT.zip',
            'SOURCE_BYTES=79377122',
            'SOURCE_SHA256=3703dff112a097a2fa4a71d46639ba3a7a2515139121dd8c737a6d6ada08d46c',
            'APK_NAME=BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk',
            "APK_BYTES=$((Get-Item $dest).Length)",
            "APK_SHA256=$hash",
            'PACKAGE=com.braseiro.starwarsedge',
            'VERSION_CODE=10077',
            'VERSION_NAME=1.0.77',
            'PACKAGED_CAMPAIGN_HUB=PASS',
            'PACKAGED_TTS_P77=PASS',
            "SIGNATURE=$sig"
          ) | Set-Content (Join-Path $outDir 'P77_BUILD_PROOF.txt') -Encoding utf8
          "dir=$outDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish P77 APK release assets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_DIR: ${{ steps.apk.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'bra83/braseirobuild'
          $tag = 'star-wars-r54-p77-apk'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'BRELGA-Star-Wars-P77'
          }
          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          if (-not $release) {
            $payload = @{
              tag_name = $tag
              target_commitish = 'main'
              name = 'Braseiro Star Wars R54 P77 APK'
              body = 'APK debug compilado e validado no BRELGA a partir do checkpoint P77 do Google Drive. GitHub usado somente como esteira de compilação.'
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $payload -Uri "https://api.github.com/repos/$repo/releases"
          }
          $uploadBase = ($release.upload_url -replace '\\{.*$','')
          $assets = Invoke-RestMethod -Method Get -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($release.id)/assets?per_page=100"
          foreach ($name in @('BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk','BRASEIRO_STAR_WARS_EDGE_R54_P77_DEBUG.apk.sha256','APK_BADGING.txt','APK_SIGNATURE.txt','P77_BUILD_PROOF.txt')) {
            $existing = $assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($existing) { Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" | Out-Null }
            $path = Join-Path $env:APK_DIR $name
            if (Test-Path $path) {
              $type = if ($name -like '*.apk') {'application/vnd.android.package-archive'} else {'text/plain'}
              Invoke-RestMethod -Method Post -Headers $headers -ContentType $type -InFile $path -Uri ($uploadBase + '?name=' + [uri]::EscapeDataString($name)) | Out-Null
            }
          }
          Write-Host "P77 release: $($release.html_url)"
