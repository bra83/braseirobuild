name: DnD 6.6.59 stuck local context diagnosis
on:
  workflow_dispatch:
  push:
    branches: [fix/dnd-6658-real-scene-four-actions-20261115]
    paths: [.github/workflows/dnd-6659-stuck-context-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dnd-normal/run247-mod005/app/src/main/java
      - name: Find and inspect stuck status call sites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('dnd-normal/run247-mod005/app/src/main/java')
          needles=['Contexto local pronto','montando o estado da campanha','sem nova busca de regras','addSceneActionDropdown','setStatusText','statusLabel','statusText','contexto local']
          for p in root.rglob('*.java'):
            s=p.read_text(errors='replace')
            ls=s.splitlines()
            found=[i for i,l in enumerate(ls) if any(n.lower() in l.lower() for n in needles)]
            if not found:continue
            if p.name!='MainActivity.java' and len(found)>5:found=found[:5]
            print('FILE',p,'LINES',len(ls),'MATCHES',len(found))
            for i in found[:45]:
              print('MATCH',i+1)
              for j in range(max(0,i-12),min(len(ls),i+20)):
                print(f'{j+1}: {ls[j][:320]}')
          p=Path('dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/MainActivity.java')
          lines=p.read_text().splitlines()
          for start,end in [(7278,7355),(7550,7660),(7680,7810),(7800,7875)]:
            print('FOCUSED_MAIN',start,end)
            for i in range(start-1,end):
              print(f'{i+1}: {lines[i][:700]}')
          p=Path('dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/MasterOrchestrator.java')
          lines=p.read_text().splitlines()
          for i,l in enumerate(lines):
            if 'Plan prepare(' in l or 'prepare(' in l and 'Plan' in l:
              print('ORCHESTRATOR_PREPARE',i+1)
              for j in range(max(0,i-10),min(len(lines),i+150)):
                print(f'{j+1}: {lines[j][:600]}')
          PY
