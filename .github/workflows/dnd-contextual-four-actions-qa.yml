name: DnD four contextual actions and dropdown QA

on:
  push:
    branches:
      - fix/dnd-contextual-four-actions-20261105
    paths:
      - .github/workflows/dnd-contextual-four-actions-qa.yml
      - dnd-normal/run247-mod005/app/src/main/java/com/braseiro/dnd5e/**
      - dnd-normal/run247-mod005/app/src/test/java/com/braseiro/dnd5e/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnd-four-actions-qa
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and run the scene-choice and dropdown regressions
        working-directory: dnd-normal/run247-mod005
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest -Pbraseiro.qaLiteAssets=true --no-daemon --console=plain \
            --tests 'com.braseiro.dnd5e.FourSceneActionsDropdownRegressionTest' \
            --tests 'com.braseiro.dnd5e.SceneOptionQualityRegressionTest' \
            --tests 'com.braseiro.dnd5e.SceneActionContinuityRegressionTest' \
            --tests 'com.braseiro.dnd5e.StoryMomentumActionRegressionTest' \
            --tests 'com.braseiro.dnd5e.BraseiroVttEndToEndAuditTest'
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dnd-four-actions-regression-results
          path: dnd-normal/run247-mod005/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
