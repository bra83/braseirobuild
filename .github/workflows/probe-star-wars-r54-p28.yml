name: Probe Star Wars R54 P28 compiled source on BRELGA

on:
  push:
    branches: [star-wars-r54-p28-adventure-engine]
    paths:
      - '.github/workflows/probe-star-wars-r54-p28.yml'
      - 'star-wars/r54/p28/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe persisted P27 APK assets
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Expected BRELGA"}
          $apk='C:\actions-runner\artifacts\star-wars\r54\p27\app-debug.apk'
          if(-not(Test-Path $apk)){throw "Persisted P27 APK missing: $apk"}
          $dest=Join-Path $env:RUNNER_TEMP 'p28-probe-apk'
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          & tar.exe -xf $apk -C $dest
          if($LASTEXITCODE -ne 0){throw 'APK extraction failed'}
          $root=Join-Path $dest 'assets\vtt'
          $env:PYTHONIOENCODING='utf-8'
          [Console]::OutputEncoding=[System.Text.Encoding]::UTF8
          python star-wars/r54/p28/probe_p27_source.py "$dest"
