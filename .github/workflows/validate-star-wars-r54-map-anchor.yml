name: Validate Star Wars R54 map anchor
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-star-wars-r54-map-anchor.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACK_URL: https://firestorage.ai/ja/f/fpHIoZHL9wUf
      PACK_FILE: STAR_WARS_R54_VISUAL_DATA_PACK.zip
      PACK_SHA: f18bf92117bf00dfe6641c7ca31c8037904e79ef9816694c4e844099a4307f60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover R53 baseline and R54 pack
        run: |
          set -euo pipefail
          rm -rf map-anchor-work map-anchor-pack map-anchor-incoming
          mkdir -p map-anchor-work map-anchor-pack map-anchor-incoming
          unzip -q star-wars/final-1.0.0/output-r53/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R53_REAL_DEVICE_HOTFIX.zip -d map-anchor-work
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('map-anchor-incoming')/os.environ['PACK_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True); page=b.new_page(accept_downloads=True)
            page.goto(os.environ['PACK_URL'],wait_until='domcontentloaded',timeout=120000); page.wait_for_timeout(2500)
            done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
              try:
                loc=page.locator(sel).first
                if not loc.count() or not loc.is_visible(): continue
                with page.expect_download(timeout=120000) as info: loc.click(timeout=10000)
                info.value.save_as(str(out)); done=True; break
              except Exception: pass
            if not done:
              card=page.get_by_text(os.environ['PACK_FILE'],exact=False).first
              ctrl=card.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last
              with page.expect_download(timeout=120000) as info: ctrl.click(timeout=10000)
              info.value.save_as(str(out)); done=True
            b.close()
          if not done or not out.exists(): raise SystemExit('R54 pack download failed')
          PY
          echo "$PACK_SHA  map-anchor-incoming/$PACK_FILE" | sha256sum -c -
          unzip -q "map-anchor-incoming/$PACK_FILE" -d map-anchor-pack
      - name: Apply current R54 hotfix
        id: root
        run: |
          set -euo pipefail
          python3 -m py_compile star-wars/r54/hotfix_r54.py
          SET="$(find map-anchor-work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"
          test -n "$SET"; ROOT="$(dirname "$SET")"
          python3 star-wars/r54/hotfix_r54.py "$ROOT" "$(pwd)/map-anchor-pack"
          printf '\n.final-start-list button[hidden]{display:none!important}\n' >> "$ROOT/app/src/main/assets/vtt/r46/final-runtime.css"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Prove Shantipole x/y persists into world state
        env:
          ROOT: "${{ steps.root.outputs.path }}"
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/r54-map-anchor-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          sleep 1
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            page=b.new_page(viewport={'width':415,'height':915})
            page.goto('http://127.0.0.1:8765/r46-shell.html?screen=00',wait_until='networkidle',timeout=120000)
            page.wait_for_selector('#braseiro-sandbox-setup',timeout=10000)
            sh=page.locator('#sandbox-list button[data-point]',has_text='Shantipole').first
            assert sh.count()==1,'Shantipole missing from 82 start points'
            sh.click()
            page.locator('#sandbox-start-button').click()
            page.wait_for_selector('#braseiro-sandbox-setup',state='detached',timeout=10000)
            state=page.evaluate('window.BraseiroGameBridge.readState().data') or {}
            anchor=(((state.get('world') or {}).get('sandbox') or {}).get('startMapPoint'))
            assert isinstance(anchor,dict),f'startMapPoint missing: {anchor!r}'
            assert isinstance(anchor.get('x'),(int,float)) and isinstance(anchor.get('y'),(int,float)),f'invalid startMapPoint: {anchor!r}'
            assert 0 <= float(anchor['x']) <= 100 and 0 <= float(anchor['y']) <= 100,f'out-of-range startMapPoint: {anchor!r}'
            print('R54_MAP_ANCHOR_PASS',anchor)
            b.close()
          PY
