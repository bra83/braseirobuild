name: DnD 6.6.53 Heroes scenes consultation fixes

on:
  push:
    branches:
      - fix/dnd-6653-heroes-performance-scene-grounding-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run scene grounding, consultation, dropdown and continuity tests
        working-directory: dnd-normal/run247-mod005
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest -Pbraseiro.qaLiteAssets=true --no-daemon --console=plain \
            --tests 'com.braseiro.dnd5e.NarratorConsultationRoutingRegressionTest' \
            --tests 'com.braseiro.dnd5e.SceneOptionVisibleEvidenceRegressionTest' \
            --tests 'com.braseiro.dnd5e.FourSceneActionsDropdownRegressionTest' \
            --tests 'com.braseiro.dnd5e.SceneOptionQualityRegressionTest' \
            --tests 'com.braseiro.dnd5e.SceneActionContinuityRegressionTest' \
            --tests 'com.braseiro.dnd5e.StoryMomentumActionRegressionTest' \
            --tests 'com.braseiro.dnd5e.BraseiroVttEndToEndAuditTest'
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DND_6653_TEST_RESULTS
          path: dnd-normal/run247-mod005/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
  apk:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate version and no DB migration
        run: |
          set -euo pipefail
          project=dnd-normal/run247-mod005
          grep -q '^VERSION_CODE=203900616$' "$project/version.properties"
          grep -q '^VERSION_NAME=6.6.53-heroes-scene-grounding-20261106$' "$project/version.properties"
          grep -q '^DB_SCHEMA=61$' "$project/version.properties"
          grep -q '^BACKUP_FORMAT=21$' "$project/version.properties"
          test -s "$project/signing/debug.keystore"
      - name: Assemble signed debug APK with production assets
        working-directory: dnd-normal/run247-mod005
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signature, version and hash
        run: |
          set -euo pipefail
          apk=dnd-normal/run247-mod005/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > SIGNATURE_6653.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > BADGING_6653.txt
          grep -q "versionCode='203900616'" BADGING_6653.txt
          grep -q "package: name='com.braseiro.dnd5e'" BADGING_6653.txt
          sha256sum "$apk" > APK_SHA256_6653.txt
          cp "$apk" BRASEIRO_DND_6.6.53_HEROES_CONSULT_FIX.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_DND_6_6_53_HEROES_CONSULT_APK
          path: |
            BRASEIRO_DND_6.6.53_HEROES_CONSULT_FIX.apk
            APK_SHA256_6653.txt
            SIGNATURE_6653.txt
            BADGING_6653.txt
          if-no-files-found: error
