name: Build Braseiro Kokoro PT-BR V4

on:
  push:
    branches:
      - sherpa-kokoro-ptbr
    paths:
      - 'tools/patch_braseiro_kokoro_ptbr_v4.ps1'
      - '.github/workflows/build-braseiro-kokoro-ptbr-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: braseiro-kokoro-ptbr-v4
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA runner, got $env:RUNNER_NAME" }

          $candidates = @()
          if ($env:ANDROID_SDK_ROOT) { $candidates += $env:ANDROID_SDK_ROOT }
          if ($env:ANDROID_HOME) { $candidates += $env:ANDROID_HOME }
          $candidates += 'C:\actions-runner\android-sdk'
          if ($env:LOCALAPPDATA) { $candidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }

          $sdkRoot = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sdkRoot) { throw 'Android SDK not found on BRELGA' }
          $sdkmanager = Get-ChildItem $sdkRoot -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdkmanager) { throw "sdkmanager.bat not found under $sdkRoot" }

          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          1..100 | ForEach-Object { 'y' } | & $sdkmanager.FullName --licenses | Out-Null
          & $sdkmanager.FullName 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package install failed' }

      - name: Prepare dedicated Braseiro Kokoro engine
        shell: powershell
        run: |
          .\tools\patch_braseiro_kokoro_ptbr_v4.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Braseiro Kokoro V4 patch failed' }

      - name: Build APK
        shell: powershell
        working-directory: ${{ runner.temp }}\braseiro-kokoro-ptbr-v4
        run: |
          .\gradlew.bat :app:assembleDebug --stacktrace --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed with $LASTEXITCODE" }

      - name: Validate dedicated package, embedded model and APK
        id: apk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'braseiro-kokoro-ptbr-v4'
          $apk = Join-Path $root 'app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path $apk)) { throw 'APK not found' }

          $sdkRoot = $env:ANDROID_SDK_ROOT
          $aapt = Get-ChildItem $sdkRoot -Recurse -Filter aapt.exe -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          $apksigner = Get-ChildItem $sdkRoot -Recurse -Filter apksigner.bat -File -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $aapt -or -not $apksigner) { throw 'Android validation tools missing' }

          $badging = & $aapt.FullName dump badging $apk
          $badging | Write-Host
          if (($badging -join "`n") -notmatch "package: name='com\.braseiro\.kokoro\.ptbr'") { throw 'Wrong package: this would not be the dedicated Braseiro Kokoro engine' }
          if (($badging -join "`n") -notmatch "versionCode='40100'") { throw 'Wrong versionCode' }
          if (($badging -join "`n") -notmatch "application-label.*Braseiro Kokoro PT-BR V4") { throw 'Wrong app label' }

          & $apksigner.FullName verify --verbose --print-certs $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature invalid' }

          $entries = & jar tf $apk
          if (-not ($entries | Where-Object { $_ -eq 'assets/braseiro-kokoro-pt.zip' })) { throw 'Embedded Kokoro model asset missing from APK' }

          $source = (Get-ChildItem $root -Recurse -File -Include *.kt,*.kts,*.xml | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          $checks = @{
            'dedicated-package' = $source.Contains('applicationId = "com.braseiro.kokoro.ptbr"')
            'dedicated-label' = $source.Contains('Braseiro Kokoro PT-BR V4')
            'embedded-installer' = $source.Contains('EmbeddedModelInstaller.ensureInstalled')
            'model-auto-scan' = $source.Contains('models.addAll(analyzeToModels())')
            'real-android-voice' = $source.Contains('model.id + "_" + speaker.id')
            'ptbr-speakers' = $source.Contains('id = 42') -and $source.Contains('id = 43') -and $source.Contains('id = 44')
            'resident-kokoro' = $source.Contains('persistentKokoro')
            'four-threads' = $source.Contains('if (isKokoro(cfg)) 4')
            'streaming-callback' = $source.Contains('generateWithConfigAndCallback')
            'sentence-profile' = $source.Contains('maxNumSentences = if (kokoro) 2')
            'silence-profile' = $source.Contains('silenceScale = if (kokoro) 0.06f')
          }
          foreach ($pair in $checks.GetEnumerator()) {
            Write-Host "$($pair.Key)=$($pair.Value)"
            if (-not $pair.Value) { throw "V4 gate failed: $($pair.Key)" }
          }

          $out = Join-Path $env:RUNNER_TEMP 'braseiro-kokoro-v4-output'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dest = Join-Path $out 'BRASEIRO_KOKORO_PTBR_ENGINE_1.13.8_V4.apk'
          Copy-Item $apk $dest -Force
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BRASEIRO_KOKORO_PTBR_ENGINE_1.13.8_V4.apk" | Set-Content (Join-Path $out 'BRASEIRO_KOKORO_PTBR_ENGINE_1.13.8_V4.apk.sha256') -Encoding ascii
          "path=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "APK=$dest"
          Write-Host "SHA256=$hash"

      - name: Publish Braseiro Kokoro V4 APK asset
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = 'sherpa-kokoro-ptbr-v1'
          $assetName = 'BRASEIRO_KOKORO_PTBR_ENGINE_1.13.8_V4.apk'
          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-kokoro-v4-publisher'
          }

          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
          if (-not $release.id) { throw 'Existing Kokoro release not found' }

          $existing = @($release.assets) | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if ($existing) {
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/assets/$($existing.id)" | Out-Null
          }

          $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$assetName"
          & curl.exe -L --fail --retry 5 --retry-delay 3 --retry-all-errors -X POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/vnd.android.package-archive" --data-binary "@$env:APK_PATH" $uploadUrl
          if ($LASTEXITCODE -ne 0) { throw 'Braseiro Kokoro V4 asset upload failed' }

          Write-Host "SHA256=$env:APK_SHA256"
          Write-Host "APK_URL=https://github.com/$repo/releases/download/$tag/$assetName"
