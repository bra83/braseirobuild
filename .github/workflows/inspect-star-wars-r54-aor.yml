name: Validate Star Wars R54 AoR runtime
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-star-wars-r54-aor.yml"
      - "star-wars/r54/fix_aor_talent_runtime.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Recover R53 source and activate existing AoR trees
        id: root
        run: |
          set -euo pipefail
          rm -rf aor-work && mkdir aor-work
          unzip -q star-wars/final-1.0.0/output-r53/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R53_REAL_DEVICE_HOTFIX.zip -d aor-work
          SET="$(find aor-work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"
          test -n "$SET"; ROOT="$(dirname "$SET")"
          python3 -m py_compile star-wars/r54/fix_aor_talent_runtime.py
          python3 star-wars/r54/fix_aor_talent_runtime.py "$ROOT"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Validate source and live browser bundle
        env:
          ROOT: "${{ steps.root.outputs.path }}"
        run: |
          set -euo pipefail
          V="$ROOT/app/src/main/assets/vtt"
          node --check "$V/js/core/uiBridge.bundle.js"
          ! grep -Fq 'no active Age of Rebellion tree data' "$V/js/core/uiBridge.bundle.js"
          ! grep -Fq 'no active Age of Rebellion tree data' "$V/js/rules/talentTreesData.mjs"
          grep -Fq '"ace":{"gunner"' "$V/js/core/uiBridge.bundle.js"
          grep -Fq '"bounty_hunter"' "$V/js/core/uiBridge.bundle.js"
          python3 - "$V" <<'PY'
          from pathlib import Path
          import json,sys
          v=Path(sys.argv[1])
          def catalog(path,marker):
              s=path.read_text('utf-8'); pos=s.index(marker); start=s.index('{',pos+len(marker)); return json.JSONDecoder().raw_decode(s[start:])[0]
          src=catalog(v/'js/rules/talentTreesData.mjs','export const TALENT_TREES = Object.freeze(')
          bun=catalog(v/'js/core/uiBridge.bundle.js','exports.TALENT_TREES = Object.freeze(')
          def count(x): return (len(x),sum(len(s) for s in x.values()),sum(len(t['nodes']) for s in x.values() for t in s.values()))
          assert count(src)==count(bun),(count(src),count(bun))
          assert count(src)==(12,36,720),count(src)
          assert len(src['ace']['gunner']['nodes'])==20
          assert src['ace']['gunner']['edges']
          assert 'bounty_hunter' in src
          print('R54_AOR_RUNTIME_VALIDATED',count(src))
          PY
