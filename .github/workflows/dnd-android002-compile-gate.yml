name: DND ANDROID-002 Compile Gate

on:
  push:
    branches:
      - dnd/master-run164-android002-compile-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout anchor
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download recovered ANDROID-002 compile source
        shell: bash
        env:
          SHARE_URL: 'https://firestorage.ai/ja/f/GwPs-zFJBDSO'
        run: |
          set -euo pipefail
          mkdir -p work /tmp/fire-download
          cd /tmp/fire-download
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium >/dev/null
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url=process.env.SHARE_URL;
          const out=process.env.GITHUB_WORKSPACE+'/source.zip';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
          const page=await ctx.newPage();
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);
          let ok=false;
          const links=await page.locator('a[href]').evaluateAll(as=>as.map(a=>({href:a.href,text:(a.innerText||a.textContent||'').trim(),download:a.getAttribute('download')||''})));
          for(const a of links){
            if(/download|file|asset|storage|object|blob|zip|ダウンロード/i.test(a.href+' '+a.text+' '+a.download)){
              try{
                const r=await ctx.request.get(a.href,{timeout:60000});
                const h=r.headers(); const ct=(h['content-type']||'').toLowerCase(); const cd=(h['content-disposition']||'').toLowerCase();
                if(r.ok() && (cd.includes('attachment')||ct.includes('octet-stream')||ct.includes('zip'))){const b=await r.body();if(b.length>100000){fs.writeFileSync(out,b);ok=true;break;}}
              }catch{}
            }
          }
          if(!ok){
            for(const sel of ['button','a','[role="button"]']){
              const loc=page.locator(sel); const n=Math.min(await loc.count(),100);
              for(let i=0;i<n && !ok;i++){
                const el=loc.nth(i); let desc='';
                try{desc=((await el.innerText({timeout:400}))||'')+' '+((await el.getAttribute('aria-label'))||'')+' '+((await el.getAttribute('title'))||'');}catch{}
                if(/download|ダウンロード|zip|保存/i.test(desc)){
                  try{const wait=page.waitForEvent('download',{timeout:30000});await el.click({timeout:5000});const d=await wait;await d.saveAs(out);ok=true;}catch{}
                }
              }
            }
          }
          await browser.close();
          if(!ok||!fs.existsSync(out)||fs.statSync(out).size<100000) throw new Error('download failed');
          console.log('DOWNLOADED',fs.statSync(out).size);
          NODE
          node download.mjs
          cd "$GITHUB_WORKSPACE"
          echo 'bd1823bca7a2320bdfc6621cd85e076ab5d8cd2510943f20928c34dc4512fda8  source.zip' | sha256sum -c -
          unzip -t source.zip >/dev/null
          unzip -q source.zip -d work
          test -f work/version.properties
          test -f work/android/gradlew
          test -f work/android/app/src/main/java/com/braseiro/dnd5e/MainActivity.java
          chmod +x work/android/gradlew

      - name: Setup Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Java only
        shell: bash
        run: |
          set -euo pipefail
          cd work/android
          ./gradlew --no-daemon --console=plain :app:compileDebugJavaWithJavac

      - name: Process resources only
        shell: bash
        run: |
          set -euo pipefail
          cd work/android
          ./gradlew --no-daemon --console=plain :app:processDebugResources

      - name: Merge manifest only
        shell: bash
        run: |
          set -euo pipefail
          cd work/android
          ./gradlew --no-daemon --console=plain :app:processDebugMainManifest

      - name: Assert no APK or AAB
        shell: bash
        run: |
          set -euo pipefail
          if find work/android -type f \( -name '*.apk' -o -name '*.aab' \) | grep -q .; then
            echo 'Unexpected package artifact generated'
            find work/android -type f \( -name '*.apk' -o -name '*.aab' \)
            exit 1
          fi
          echo 'NO_APK_AAB=PASS'
