name: Fix Star Wars R54 Real Device P2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-star-wars-r54-device-p2.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover P1 project and patch P2
        id: root
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P1.zip
          test -f "$ZIP"; rm -rf /tmp/r54-p2; mkdir /tmp/r54-p2; unzip -q "$ZIP" -d /tmp/r54-p2
          SET=$(find /tmp/r54-p2 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -1); ROOT=$(dirname "$SET"); echo "path=$ROOT" >> "$GITHUB_OUTPUT"
          python3 star-wars/r54/fix_device_p2.py "$ROOT"
          node --check "$ROOT/app/src/main/assets/vtt/r54-device-p2.js"
      - name: Strict browser regression 415x915
        env: {ROOT: '${{ steps.root.outputs.path }}'}
        run: |
          set -euo pipefail; python -m pip install --quiet playwright; python -m playwright install --with-deps chromium >/dev/null
          python -m http.server 8782 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/http.log 2>&1 & PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          python - <<'PY' | tee /tmp/P2_BROWSER.txt
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915});errs=[];pg.on('pageerror',lambda e:errs.append(str(e)))
            pg.goto('http://127.0.0.1:8782/r46-shell.html?screen=09',wait_until='domcontentloaded');pg.wait_for_timeout(1200)
            pg.wait_for_function("()=>window.BraseiroGameBridge&&typeof window.BraseiroGameBridge.initializeLivingSandbox==='function'")
            pg.evaluate("()=>{const b=window.BraseiroGameBridge;try{b.setCampaignMode('EOTE')}catch(e){};try{b.initializeLivingSandbox({startingPoint:'Mos Eisley · Tatooine',regionLabel:'Mos Eisley',startMapPoint:{x:65,y:55},startLocationId:'mos_eisley'})}catch(e){};if(!b.readState()?.data?.player?.character)b.generateRandomCharacter({name:'Veya Tann'},{createSnapshot:true})}")
            pg.reload(wait_until='domcontentloaded');pg.wait_for_timeout(1200)
            cards=pg.locator('button',has_text='Propor ao Mestre'); assert cards.count()>0
            for i in range(cards.count()):
              btn=cards.nth(i);host=btn.locator('xpath=..');
              for _ in range(6):
                if host.locator('.r54-item-visual img').count():break
                host=host.locator('xpath=..')
              im=host.locator('.r54-item-visual img').first; assert im.count()==1, f'item card {i} missing image'; assert im.evaluate('(x)=>x.complete&&x.naturalWidth>0'),im.get_attribute('src'); assert 'inventory.png' not in (im.get_attribute('src') or '')
            pg.evaluate("()=>document.querySelector('.r53-dice-fab')?.click()");pg.wait_for_timeout(100);roll=pg.locator('.r53-roll');assert roll.count()==1;roll.click();pg.wait_for_timeout(100);txt=pg.locator('.r53-result').inner_text();assert 'indisponível' not in txt.lower() and 'não conectado' not in txt.lower(),txt
            assert not [e for e in errs if 'favicon' not in e.lower()],errs
            print('P2_BROWSER_PASS',{'catalog_cards':cards.count(),'all_card_images_loaded':True,'dice_connected':True});b.close()
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', validate-wrappers: false}
      - name: Build APK
        working-directory: ${{ steps.root.outputs.path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Persist P2
        env: {ROOT: '${{ steps.root.outputs.path }}'}
        run: |
          set -euo pipefail; OUT=star-wars/final-1.0.0/output-r54; APK=$(find "$ROOT/app/build/outputs/apk/debug" -name '*.apk' | head -1); test -f "$APK"
          cp "$APK" /tmp/P2.apk; (cd "$ROOT" && zip -qr /tmp/P2.zip . -x '*/build/*' '.gradle/*'); sha256sum /tmp/P2.apk >/tmp/P2.apk.sha256; sha256sum /tmp/P2.zip >/tmp/P2.zip.sha256
          git config user.name github-actions; git config user.email github-actions@github.com; git reset --hard HEAD; git clean -fd; git fetch origin main; git reset --hard origin/main; mkdir -p "$OUT" star-wars/r54/audit
          cp /tmp/P2.apk "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P2_DEBUG.apk"; cp /tmp/P2.zip "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P2.zip"; cp /tmp/P2.apk.sha256 "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P2_DEBUG.apk.sha256"; cp /tmp/P2.zip.sha256 "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P2.zip.sha256"; cp /tmp/P2_BROWSER.txt star-wars/r54/audit/DEVICE_P2_BROWSER_2026-09-17.txt
          git add -f "$OUT" star-wars/r54/audit; git commit -m 'build(star-wars): persist R54 device P2 strict repair'; git push origin HEAD:main
