name: BRASEIRO WWN Source Transfer Build

on:
  push:
    branches: [main]
    paths:
      - "WWN_BUILD_TRIGGER.txt"
      - ".github/workflows/build-wwn-firestorage.yml"

permissions:
  contents: read

env:
  WWN_SOURCE_SHARE_URL: "https://firestorage.ai/ja/f/zMStC53yvoQ4"
  WWN_SOURCE_SHA256: "656fa6ad39d8df697a47974c46163bf9a41c623de328be76f34bd8fd1a340921"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Download exact WWN source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          TMP="incoming/source.download"
          ZIP="incoming/BRASEIRO_WWN_POST071_ANDROID_STUDIO_SOURCE_2026-09-13.zip"

          # Fast path: some one-file shares resolve directly to the payload.
          curl -fL --retry 3 --retry-delay 2 "$WWN_SOURCE_SHARE_URL" -o "$TMP" || true
          if unzip -t "$TMP" >/dev/null 2>&1; then
            mv "$TMP" "$ZIP"
          else
            rm -f "$TMP"
            mkdir -p /tmp/wwn-browser
            pushd /tmp/wwn-browser >/dev/null
            npm init -y >/dev/null 2>&1
            npm install --silent playwright@1.55.0
            npx playwright install chromium
            cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const url = process.env.WWN_SOURCE_SHARE_URL;
          const out = process.env.GITHUB_WORKSPACE + '/incoming/BRASEIRO_WWN_POST071_ANDROID_STUDIO_SOURCE_2026-09-13.zip';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({acceptDownloads:true, locale:'ja-JP'});
          const page = await context.newPage();
          await page.goto(url, {waitUntil:'domcontentloaded', timeout:60000});
          await page.waitForTimeout(4000);

          // Try explicit downloadable anchors first.
          const links = await page.locator('a').evaluateAll(as => as.map(a => ({href:a.href, text:(a.textContent||'').trim(), download:a.getAttribute('download')})));
          console.log('LINKS', JSON.stringify(links));
          for (const l of links) {
            if (!l.href) continue;
            if (/\.zip(?:\?|$)/i.test(l.href) || l.download || /download|ダウンロード|一括|保存/i.test(l.text)) {
              try {
                const r = await page.request.get(l.href, {timeout:60000});
                if (r.ok()) {
                  const b = await r.body();
                  if (b.length > 1000000 && b[0] === 0x50 && b[1] === 0x4b) {
                    fs.writeFileSync(out, b);
                    await browser.close();
                    process.exit(0);
                  }
                }
              } catch {}
            }
          }

          // Click likely download controls and capture the browser download.
          const candidates = [
            'text=/一括ダウンロード/i',
            'text=/ダウンロード/i',
            'text=/Download/i',
            'button',
            'a'
          ];
          for (const sel of candidates) {
            const loc = page.locator(sel);
            const n = Math.min(await loc.count(), 40);
            for (let i=0;i<n;i++) {
              const el = loc.nth(i);
              let text='';
              try { text=(await el.innerText({timeout:1000})).trim(); } catch {}
              if (sel === 'button' || sel === 'a') {
                if (!/download|ダウンロード|一括|保存|ZIP|ファイル/i.test(text)) continue;
              }
              try {
                const d = page.waitForEvent('download', {timeout:10000});
                await el.click({timeout:5000});
                const download = await d;
                await download.saveAs(out);
                await browser.close();
                process.exit(0);
              } catch {}
            }
          }

          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/incoming/firestorage-page.html', await page.content());
          console.log('BODY', (await page.locator('body').innerText()).slice(0,8000));
          await browser.close();
          process.exit(2);
          NODE
            node download.mjs
            popd >/dev/null
          fi

          test -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          echo "$WWN_SOURCE_SHA256  $ZIP" | sha256sum -c -
          ls -lh "$ZIP"

      - name: Extract project and detect Android root
        id: android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q incoming/BRASEIRO_WWN_POST071_ANDROID_STUDIO_SOURCE_2026-09-13.zip -d work
          ROOT=""
          while IFS= read -r -d '' W; do
            D="$(dirname "$W")"
            if [ -f "$D/settings.gradle.kts" ] || [ -f "$D/settings.gradle" ]; then ROOT="$D"; break; fi
          done < <(find work -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' -print0)
          [ -n "$ROOT" ] || { echo "::error::Android project root not found"; find work -maxdepth 4 -type f | head -200; exit 1; }
          chmod +x "$ROOT/gradlew"
          SDK="$(grep -RhoE 'compileSdk(Version)?[[:space:]]*[= ]+[0-9]+' "$ROOT" --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oE '[0-9]+' | sort -nr | head -n1 || true)"
          [ -n "$SDK" ] || SDK=35
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "ROOT=$ROOT SDK=$SDK"

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${{ steps.android.outputs.sdk }}"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build WWN debug APK
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew clean test assembleDebug --stacktrace --no-daemon

      - name: Collect and validate APK
        id: apk
        shell: bash
        env:
          ROOT: ${{ steps.android.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find "$ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -n1)"
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "::error::Debug APK not found"; exit 1; }
          NAME="BRASEIRO-WWN-POST071-DEBUG.apk"
          cp "$APK" "out/$NAME"
          unzip -t "out/$NAME" >/dev/null
          sha256sum "out/$NAME" | tee "out/$NAME.sha256"
          stat -c 'APK_SIZE_BYTES=%s' "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-WWN-POST071-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## BRASEIRO WWN POST071"
            echo "- Source SHA-256: $WWN_SOURCE_SHA256"
            echo "- Gradle tests: PASS"
            echo "- assembleDebug: PASS"
            echo "- APK: ${{ steps.apk.outputs.name }}"
          } >> "$GITHUB_STEP_SUMMARY"
