name: BRASEIRO WWN Source Transfer Build

on:
  push:
    branches: [main]
    paths:
      - "WWN_BUILD_TRIGGER.txt"
      - ".github/workflows/build-wwn-firestorage.yml"

permissions:
  contents: read

env:
  WWN_SOURCE_SHARE_URL: "https://firestorage.ai/ja/f/zMStC53yvoQ4"
  WWN_SOURCE_SHA256: "656fa6ad39d8df697a47974c46163bf9a41c623de328be76f34bd8fd1a340921"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        name: Checkout builder repository

      - name: Download exact WWN source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming /tmp/wwn-browser
          ZIP="$GITHUB_WORKSPACE/incoming/BRASEIRO_WWN_POST071_ANDROID_STUDIO_SOURCE_2026-09-13.zip"
          cd /tmp/wwn-browser
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({acceptDownloads:true, locale:'ja-JP'});
          const page = await context.newPage();
          await page.goto(process.env.WWN_SOURCE_SHARE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3000);
          for (const sel of ['text=/一括ダウンロード/i','text=/ダウンロード/i','text=/Download/i','button','a']) {
            const loc=page.locator(sel); const n=Math.min(await loc.count(),50);
            for(let i=0;i<n;i++){
              const el=loc.nth(i); let text=''; try{text=(await el.innerText({timeout:1000})).trim()}catch{}
              if((sel==='button'||sel==='a')&&!/download|ダウンロード|一括|保存|ZIP|ファイル/i.test(text)) continue;
              try{const p=page.waitForEvent('download',{timeout:10000}); await el.click({timeout:5000}); const d=await p; await d.saveAs(process.env.GITHUB_WORKSPACE+'/incoming/BRASEIRO_WWN_POST071_ANDROID_STUDIO_SOURCE_2026-09-13.zip'); await browser.close(); process.exit(0)}catch{}
            }
          }
          console.log((await page.locator('body').innerText()).slice(0,8000)); await browser.close(); process.exit(2);
          NODE
          node download.mjs
          cd "$GITHUB_WORKSPACE"
          unzip -t "$ZIP" >/dev/null
          echo "$WWN_SOURCE_SHA256  $ZIP" | sha256sum -c -
          ls -lh "$ZIP"

      - name: Extract project and detect Android root
        id: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          unzip -q incoming/BRASEIRO_WWN_POST071_ANDROID_STUDIO_SOURCE_2026-09-13.zip -d work
          ROOT=""
          while IFS= read -r -d '' W; do D="$(dirname "$W")"; if [ -f "$D/settings.gradle.kts" ] || [ -f "$D/settings.gradle" ]; then ROOT="$D"; break; fi; done < <(find work -type f -name gradlew -print0)
          [ -n "$ROOT" ] || { echo "::error::Android root not found"; exit 1; }
          chmod +x "$ROOT/gradlew"
          SDK="$(grep -hoE 'compileSdk[[:space:]]*=[[:space:]]*[0-9]+' "$ROOT/app/build.gradle.kts" | grep -oE '[0-9]+' | head -n1)"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "ROOT=$ROOT REQUESTED_SDK=$SDK"

      - uses: actions/setup-java@v4
        name: Configure Java 17
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        name: Configure Android SDK

      - name: Install Android platform
        shell: bash
        env:
          ROOT: ${{ steps.android.outputs.root }}
          REQUESTED_SDK: ${{ steps.android.outputs.sdk }}
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          SDK="$REQUESTED_SDK"
          if [ "$SDK" -gt 36 ]; then
            echo "Trying preview/canary Android API $SDK"
            if yes | sdkmanager --channel=3 "platform-tools" "platforms;android-${SDK}"; then
              echo "CI_ANDROID_API=$SDK" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "API $SDK is not installable even from preview/canary; patching CI copy to API 36 only."
            SDK=36
            python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path(os.environ['ROOT'])/'app'/'build.gradle.kts'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'compileSdk\s*=\s*\d+','compileSdk = 36',s,count=1)
          s=re.sub(r'targetSdk\s*=\s*\d+','targetSdk = 36',s,count=1)
          p.write_text(s,encoding='utf-8')
          print('CI_PATCHED_TO_API36')
          PY
          fi
          sdkmanager "platform-tools" "platforms;android-${SDK}"
          echo "CI_ANDROID_API=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        name: Configure Gradle cache

      - name: Test and build WWN debug APK
        working-directory: ${{ steps.android.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew clean test assembleDebug --stacktrace --no-daemon

      - name: Collect and validate APK
        id: apk
        shell: bash
        env:
          ROOT: ${{ steps.android.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find "$ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -n1)"
          [ -f "$APK" ] || { echo "::error::Debug APK not found"; exit 1; }
          NAME="BRASEIRO-WWN-POST071-DEBUG.apk"
          cp "$APK" "out/$NAME"
          unzip -t "out/$NAME" >/dev/null
          sha256sum "out/$NAME" | tee "out/$NAME.sha256"
          stat -c 'APK_SIZE_BYTES=%s' "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        name: Upload APK artifact
        with:
          name: BRASEIRO-WWN-POST071-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          echo "## BRASEIRO WWN POST071" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA-256: $WWN_SOURCE_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI Android API: $CI_ANDROID_API" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle test + assembleDebug: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: ${{ steps.apk.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
