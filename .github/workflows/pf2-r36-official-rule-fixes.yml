name: PF2 Kingmaker R36 Official Book Fixes — Test and Compile
on:
  push:
    branches: [pf2-kingmaker-r36-official-rule-fixes-20261011]
    paths:
      - '.github/workflows/pf2-r36-official-rule-fixes.yml'
      - 'ci/pf2-kingmaker-r36/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pf2-r36-official-book-rules-${{ github.sha }}
  cancel-in-progress: false
jobs:
  civic-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci/pf2-kingmaker-r36
      - name: Read verified R35 source for next civic correction
        shell: bash
        run: |
          set -euo pipefail
          auth="$(git config --local --get http.https://github.com/.extraheader)"
          test -n "$auth"
          curl -L --fail --retry 3 --header "$auth" --header 'Accept: application/octet-stream' -o r35-source.zip 'https://api.github.com/repos/bra83/braseirobuild/releases/assets/629875743'
          echo '86d9a6fd26e4139e084c8e4069f49ef53e0cf8654e0f9f5662b92f9183941aa6  r35-source.zip' | sha256sum -c -
          unzip -q r35-source.zip -d r35-source
          python ci/pf2-kingmaker-r36/inspect_civic_surface.py r35-source
  official-content-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci/pf2-kingmaker-certification
      - name: Inspect real published R35 chapter/companion/war files
        shell: bash
        run: |
          set -euo pipefail
          auth="$(git config --local --get http.https://github.com/.extraheader)"
          test -n "$auth"
          curl -L --fail --retry 4 --header "$auth" --header 'Accept: application/octet-stream' -o r35-source.zip 'https://api.github.com/repos/bra83/braseirobuild/releases/assets/629875743'
          test "$(stat -c %s r35-source.zip)" = "92975058"
          echo '86d9a6fd26e4139e084c8e4069f49ef53e0cf8654e0f9f5662b92f9183941aa6  r35-source.zip' | sha256sum -c -
          unzip -q r35-source.zip -d r35-source
          python ci/pf2-kingmaker-certification/crosswalk_runtime_audit.py --project r35-source --out official-book-evidence
          python ci/pf2-kingmaker-certification/audit_companions_warfare_depth.py --project r35-source --out official-book-evidence
          python ci/pf2-kingmaker-certification/audit_campaign.py --project r35-source --out official-book-evidence
          python ci/pf2-kingmaker-certification/audit_structure_catalog.py --project r35-source --out official-book-evidence/structure_catalog_delta.json
          python ci/pf2-kingmaker-certification/official_part_semantic_audit.py --project r35-source --out official-book-evidence
      - name: Publish audit in GitHub job summary (artifact quota independent)
        if: always()
        shell: bash
        run: |
          if [ -f official-book-evidence/CROSSWALK_REPORT.md ]; then
            cat official-book-evidence/CROSSWALK_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f official-book-evidence/AUDITORIA_R35.md ]; then
            cat official-book-evidence/AUDITORIA_R35.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Reports are visible in this job summary. No artifact upload or release."
  patch-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/pf2-kingmaker-r36
            ci/pf2-kingmaker-certification
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate R36 patch contracts without Android claims
        run: |
          python -m pip install -q pytest
          python -m compileall -q ci/pf2-kingmaker-r36
          python -m pytest -q ci/pf2-kingmaker-r36/test_prepaid_transform_synthetic.py ci/pf2-kingmaker-r36/test_kingdom_accounting_transform.py ci/pf2-kingmaker-r36/test_claim_ui_transform.py ci/pf2-kingmaker-r36/test_build_structure_transform.py ci/pf2-kingmaker-r36/test_build_structure_repairs.py ci/pf2-kingmaker-r36/test_structure_catalog_values.py
  verify-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/pf2-kingmaker-r36
            ci/pf2-kingmaker-certification
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and verify immutable R35 Android Studio source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r35-source
          auth="$(git config --local --get http.https://github.com/.extraheader)"
          test -n "$auth"
          curl -L --fail --retry 5 --retry-delay 3 --header "$auth" --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' -o r35-source.zip 'https://api.github.com/repos/bra83/braseirobuild/releases/assets/629875743'
          test "$(stat -c %s r35-source.zip)" = "92975058"
          echo '86d9a6fd26e4139e084c8e4069f49ef53e0cf8654e0f9f5662b92f9183941aa6  r35-source.zip' | sha256sum -c -
          unzip -q r35-source.zip -d r35-source
          mapfile -t roots < <(find r35-source -type f -name version.properties | while read -r f; do test -f "$(dirname "$f")/gradlew.bat" && echo "$f"; done)
          test "${#roots[@]}" -eq 1
          project="$(dirname "${roots[0]}")"
          test -d "$project/tests_pf2"
          test -f "$project/gradlew"
          echo "PF2_R36_PROJECT=$project" >> "$GITHUB_ENV"
          python ci/pf2-kingmaker-r36/patch.py "$project"
          python ci/pf2-kingmaker-r36/patch_claim_hex_prepaid.py "$project"
          python ci/pf2-kingmaker-r36/patch_kingdom_accounting.py "$project"
          python ci/pf2-kingmaker-r36/patch_claim_hex_ui.py "$project"
          python ci/pf2-kingmaker-r36/patch_build_structure.py "$project"
          python ci/pf2-kingmaker-r36/patch_build_structure_repairs.py "$project"
          python ci/pf2-kingmaker-r36/patch_structure_catalog_values.py "$project"
          cp ci/pf2-kingmaker-r36/test_r36_book_fidelity.py "$project/tests_pf2/"
          cp ci/pf2-kingmaker-r36/test_r36_claim_prepaid.py "$project/tests_pf2/"
          cp ci/pf2-kingmaker-r36/test_build_structure_production.py "$project/tests_pf2/"
          cp ci/pf2-kingmaker-r36/test_build_structure_repairs_production.py "$project/tests_pf2/"
          cp ci/pf2-kingmaker-r36/test_r36_ui_and_accounting_contract.py "$project/tests_pf2/"
          cp ci/pf2-kingmaker-r36/test_official_structure_production.py "$project/tests_pf2/"
          cp ci/pf2-kingmaker-certification/kingmaker_official_structures_p544_552.json "$project/tests_pf2/"
      - name: Inspect Build Structure source for official-rule remediation
        shell: bash
        run: python ci/pf2-kingmaker-r36/inspect_civic_surface.py "$PF2_R36_PROJECT"
      - name: Run official-rule and full PF2 regression on extracted source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          cd "$PF2_R36_PROJECT"
          python -m pytest tests_pf2/test_r36_book_fidelity.py tests_pf2/test_r36_claim_prepaid.py tests_pf2/test_build_structure_production.py tests_pf2/test_build_structure_repairs_production.py tests_pf2/test_r36_ui_and_accounting_contract.py tests_pf2/test_official_structure_production.py -q
          python -m pytest tests_pf2 -q
      - name: Compile Android debug APK on hosted runner (no release)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PF2_R36_PROJECT"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          find android/app/build/outputs/apk/debug -name '*.apk' -type f -exec sha256sum {} \;
      - name: Run Android JVM unit tests with R36 production code
        shell: bash
        run: |
          set -euo pipefail
          cd "$PF2_R36_PROJECT"
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          echo "R36_ANDROID_JVM_UNIT_TESTS_PASS=true"
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/pf2-kingmaker-r36
            ci/pf2-kingmaker-certification
            .github/workflows
          ref: pf2-kingmaker-r36-official-rule-fixes-20261011
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical R35 source by SHA256 and apply official PDF corrections
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ne 'BRELGA'){throw "Wrong runner $env:RUNNER_NAME"}
          $dir=Join-Path $env:RUNNER_TEMP ("pf2-r36-book-"+$env:GITHUB_RUN_ID)
          $src=Join-Path $dir 'source'
          New-Item $src -ItemType Directory -Force|Out-Null
          $zip=Join-Path $dir 'r35-source.zip'
          $auth=& git config --local --get http.https://github.com/.extraheader
          if(!$auth){throw 'Missing checkout credential'}
          & curl.exe -L --fail --retry 5 --retry-delay 3 --header $auth --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' -o $zip 'https://api.github.com/repos/bra83/braseirobuild/releases/assets/629875743'
          if($LASTEXITCODE -ne 0){throw 'R35 source fetch failed'}
          if((Get-Item $zip).Length -ne 92975058){throw 'R35 size mismatch'}
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne '86d9a6fd26e4139e084c8e4069f49ef53e0cf8654e0f9f5662b92f9183941aa6'){throw "Canonical R35 hash mismatch $sha"}
          & tar.exe -xf $zip -C $src
          if($LASTEXITCODE -ne 0){throw 'R35 source extraction failed'}
          $p=@(Get-ChildItem $src -Recurse -File -Filter version.properties | Where-Object{Test-Path (Join-Path $_.DirectoryName 'gradlew.bat')})
          if($p.Count -ne 1){throw "Found $($p.Count) Gradle roots, expected exactly one"}
          $project=$p[0].DirectoryName
          if(!(Test-Path (Join-Path $project 'tests_pf2'))){throw 'Missing tests'}
          python ci\pf2-kingmaker-r36\patch.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Official rules patch failed'}
          python ci\pf2-kingmaker-r36\patch_claim_hex_prepaid.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Claim Hex prepaid patch failed'}
          python ci\pf2-kingmaker-r36\patch_kingdom_accounting.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Kingdom accounting patch failed'}
          python ci\pf2-kingmaker-r36\patch_claim_hex_ui.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Claim Hex UI patch failed'}
          python ci\pf2-kingmaker-r36\patch_build_structure.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Build Structure patch failed'}
          python ci\pf2-kingmaker-r36\patch_build_structure_repairs.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Build Structure repair patch failed'}
          python ci\pf2-kingmaker-r36\patch_structure_catalog_values.py "$project"
          if($LASTEXITCODE -ne 0){throw 'Official structure catalog patch failed'}
          Copy-Item ci\pf2-kingmaker-r36\test_r36_book_fidelity.py (Join-Path $project 'tests_pf2\test_r36_book_fidelity.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_r36_claim_prepaid.py (Join-Path $project 'tests_pf2\test_r36_claim_prepaid.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_build_structure_production.py (Join-Path $project 'tests_pf2\test_build_structure_production.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_build_structure_repairs_production.py (Join-Path $project 'tests_pf2\test_build_structure_repairs_production.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_r36_ui_and_accounting_contract.py (Join-Path $project 'tests_pf2\test_r36_ui_and_accounting_contract.py') -Force
          Copy-Item ci\pf2-kingmaker-r36\test_official_structure_production.py (Join-Path $project 'tests_pf2\test_official_structure_production.py') -Force
          Copy-Item ci\pf2-kingmaker-certification\kingmaker_official_structures_p544_552.json (Join-Path $project 'tests_pf2\kingmaker_official_structures_p544_552.json') -Force
          "PF2_R36_PROJECT=$project"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R36_SOURCE_IDENTITY_R35_HASH=$sha"
          Write-Host 'R36_OFFICIAL_RULES_PATCH_APPLIED=true'
      - name: Official-rule focused regression
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Push-Location $env:PF2_R36_PROJECT
          python -m pip install -q pytest
          if($LASTEXITCODE -ne 0){throw 'pytest unavailable'}
          python -m pytest tests_pf2\test_r36_book_fidelity.py tests_pf2\test_r36_claim_prepaid.py tests_pf2\test_build_structure_production.py tests_pf2\test_build_structure_repairs_production.py tests_pf2\test_r36_ui_and_accounting_contract.py tests_pf2\test_official_structure_production.py -q
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw "Book rule contract failed: $code"}
          Write-Host 'R36_OFFICIAL_BOOK_CONTRACT_PASS=true'
      - name: Run all shipped Pathfinder and Kingmaker regression tests
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Push-Location $env:PF2_R36_PROJECT
          python -m pytest tests_pf2 -q
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw "Full PF2 regression failed: $code"}
          Write-Host 'R36_ALL_PF2_REGRESSION_PASS=true'
      - name: Compile real Android app with R36 modifications
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidate=@('C:\actions-runner\android-sdk',$env:ANDROID_SDK_ROOT,$env:ANDROID_HOME,(Join-Path $env:LOCALAPPDATA 'Android\Sdk'))|Where-Object{$_ -and (Test-Path $_)}
          $sdk=$candidate|Where-Object {Test-Path (Join-Path $_ 'platforms')}|Select-Object -First 1
          if(!$sdk){throw 'Android SDK absent'}
          $env:ANDROID_SDK_ROOT=$sdk
          $env:ANDROID_HOME=$sdk
          Push-Location $env:PF2_R36_PROJECT
          $ErrorActionPreference='Continue'
          & .\gradlew.bat :app:assembleDebug --no-daemon --stacktrace
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw "R36 Gradle compilation failed code=$code"}
          $apk=@(Get-ChildItem "$env:PF2_R36_PROJECT\android\app\build\outputs\apk\debug" -Filter '*.apk' -File)
          if($apk.Count -eq 0){throw 'Compiled APK output missing'}
          foreach($f in $apk){Write-Host "R36_TEST_APK_SHA256=$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"}
          Write-Host "R36_COMPILED_ANDROID_PASS=true"
      - name: State scope truthfully
        if: always()
        shell: powershell
        run: |
          Write-Host 'Only selected official book rules tested in this candidate. NOT whole-campaign certification.'
          Write-Host 'No artifact upload and no release until source/regressions/Android checks pass.'
