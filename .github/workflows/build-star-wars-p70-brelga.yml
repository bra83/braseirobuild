name: Build Star Wars R54 P70 APK on BRELGA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-star-wars-p70-brelga.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }
          $candidates=@('C:\actions-runner\android-sdk')
          if($env:ANDROID_SDK_ROOT){$candidates+=$env:ANDROID_SDK_ROOT}
          if($env:ANDROID_HOME){$candidates+=$env:ANDROID_HOME}
          if($env:LOCALAPPDATA){$candidates+=(Join-Path $env:LOCALAPPDATA 'Android\Sdk')}
          $candidates+='C:\Android\Sdk'
          $sdk=$null
          foreach($c in ($candidates|Select-Object -Unique)){
            if($c -and (Test-Path $c) -and (Test-Path (Join-Path $c 'platform-tools'))){$sdk=$c;break}
          }
          if(-not $sdk){throw 'Android SDK not found on BRELGA'}
          "ANDROID_HOME=$sdk"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ANDROID_SDK_ROOT=$sdk"

      - name: Download and reconstruct exact P70
        id: src
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $api='https://api.firestorage.ai/dev/file/shares/UIPwpTBvtyqi'
          $work=Join-Path $env:RUNNER_TEMP 'sw-p70-transfer'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work -Force|Out-Null
          $meta=Invoke-RestMethod -Method Get -Uri ($api+'/files?maxResults=1000')
          if(-not $meta.files -or $meta.files.Count -ne 4){throw "Expected 4 transfer files, got $($meta.files.Count)"}
          foreach($f in ($meta.files|Sort-Object fileName)){
            if($f.fileName -notmatch '^p70\.part\.0[0-3]\.zip$'){throw "Unexpected transfer file $($f.fileName)"}
            $ticket=Invoke-RestMethod -Method Post -Uri ($api+'/files/'+$f.fileId+'/download')
            if(-not $ticket.downloadUrl){throw "No download URL for $($f.fileName)"}
            $dest=Join-Path $work $f.fileName
            & curl.exe -L --fail --retry 5 --retry-delay 2 --retry-all-errors -o $dest $ticket.downloadUrl
            if($LASTEXITCODE -ne 0){throw "Download failed for $($f.fileName)"}
            if((Get-Item $dest).Length -ne [int64]$f.sizeBytes){throw "Size mismatch for $($f.fileName)"}
            Expand-Archive -Path $dest -DestinationPath $work -Force
          }
          $parts=0..3|ForEach-Object{Join-Path $work ("p70.part.{0:d2}" -f $_)}
          foreach($p in $parts){if(-not(Test-Path $p)){throw "Missing $p"}}
          $zip=Join-Path $work 'BRASEIRO_STAR_WARS_EDGE_R54_P70_SOURCE_CHECKPOINT.zip'
          $out=[IO.File]::Open($zip,[IO.FileMode]::Create)
          try{
            foreach($p in $parts){
              $inp=[IO.File]::OpenRead($p)
              try{$inp.CopyTo($out)}finally{$inp.Dispose()}
            }
          }finally{$out.Dispose()}
          $bytes=(Get-Item $zip).Length
          if($bytes -ne 78855656){throw "P70 byte count mismatch: $bytes"}
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '839ec1f649a9128585d71d6197e9f123904b50e5591c023c9410487220c5bc47'){throw "P70 SHA mismatch: $hash"}
          Write-Host "P70_BYTES=$bytes"
          Write-Host "P70_SHA256=$hash"
          "zip=$zip"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract and detect Android Studio project
        id: project
        shell: powershell
        env:
          SOURCE_ZIP: ${{ steps.src.outputs.zip }}
        run: |
          $ErrorActionPreference='Stop'
          $rootOut=Join-Path $env:RUNNER_TEMP 'sw-p70-project'
          Remove-Item $rootOut -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $rootOut -Force|Out-Null
          & tar.exe -xf $env:SOURCE_ZIP -C $rootOut
          if($LASTEXITCODE -ne 0){throw 'P70 extraction failed'}
          $settings=Get-ChildItem $rootOut -Recurse -File -ErrorAction SilentlyContinue|
            Where-Object{
              $_.Name -in @('settings.gradle','settings.gradle.kts') -and
              $_.FullName -notmatch '[\\/](build|\.gradle)[\\/]' -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradlew.bat')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'gradle\wrapper\gradle-wrapper.jar')) -and
              (Test-Path (Join-Path $_.Directory.FullName 'app\src\main\AndroidManifest.xml'))
            }|Sort-Object FullName|Select-Object -First 1
          if(-not $settings){throw 'Complete Android Studio project not found in P70'}
          $root=$settings.Directory.FullName
          Write-Host "ANDROID_ROOT=$root"
          "root=$root"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build debug APK
        shell: powershell
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference='Continue'
          if(Test-Path variable:PSNativeCommandUseErrorActionPreference){$PSNativeCommandUseErrorActionPreference=$false}
          & .\gradlew.bat --version --no-daemon
          if($LASTEXITCODE -ne 0){throw "Gradle wrapper failed: $LASTEXITCODE"}
          & .\gradlew.bat clean assembleDebug --stacktrace --no-daemon
          if($LASTEXITCODE -ne 0){throw "assembleDebug failed: $LASTEXITCODE"}

      - name: Validate and stage APK
        id: apk
        shell: powershell
        env:
          ROOT: ${{ steps.project.outputs.root }}
        run: |
          $ErrorActionPreference='Stop'
          $apk=Get-ChildItem $env:ROOT -Recurse -File -Filter '*.apk'|
            Where-Object{$_.FullName -match '[\\/]build[\\/]outputs[\\/]apk[\\/]debug[\\/]'}|
            Sort-Object FullName|Select-Object -First 1
          if(-not $apk){throw 'Debug APK not found'}
          $out=Join-Path $env:RUNNER_TEMP 'sw-p70-apk-out'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $dest=Join-Path $out 'BRASEIRO_STAR_WARS_EDGE_R54_P70_DEBUG.apk'
          Copy-Item $apk.FullName $dest -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z=[IO.Compression.ZipFile]::OpenRead($dest);$z.Dispose()
          $hash=(Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BRASEIRO_STAR_WARS_EDGE_R54_P70_DEBUG.apk"|Set-Content (Join-Path $out 'BRASEIRO_STAR_WARS_EDGE_R54_P70_DEBUG.apk.sha256') -Encoding ascii

          $bt=Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory -ErrorAction SilentlyContinue|
            Sort-Object Name -Descending|Select-Object -First 1
          if(-not $bt){throw 'Android build-tools not found'}
          $aapt=Join-Path $bt.FullName 'aapt.exe'
          $signer=Join-Path $bt.FullName 'apksigner.bat'
          if(-not(Test-Path $aapt)){throw 'aapt.exe not found'}
          & $aapt dump badging $dest 2>&1|Tee-Object -FilePath (Join-Path $out 'APK_BADGING.txt')
          if($LASTEXITCODE -ne 0){throw 'aapt validation failed'}
          $badging=Get-Content (Join-Path $out 'APK_BADGING.txt') -Raw
          if($badging -notmatch "package: name='com\.braseiro\.starwarsedge'"){throw 'Wrong applicationId in APK'}
          if(Test-Path $signer){
            & $signer verify --verbose --print-certs $dest 2>&1|Tee-Object -FilePath (Join-Path $out 'APK_SIGNATURE.txt')
            if($LASTEXITCODE -ne 0){throw 'APK signature validation failed'}
          }
          Write-Host "APK_BYTES=$((Get-Item $dest).Length)"
          Write-Host "APK_SHA256=$hash"
          "dir=$out"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_STAR_WARS_EDGE_R54_P70_APK
          path: ${{ steps.apk.outputs.dir }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
