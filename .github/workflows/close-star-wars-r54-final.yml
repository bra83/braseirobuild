name: Close Star Wars Edge of the Galaxy R54 Final
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/close-star-wars-r54-final.yml"
      - "star-wars/r54/final_map_travel_integration.py"
permissions: {contents: write}
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FINAL_URL: https://firestorage.ai/ja/f/qvNlG1k2Qu3e
      FINAL_FILE: STAR_WARS_EDGE_OF_THE_GALAXY_VISUAL_COMPLETION_PACK.zip
      FINAL_SHA: 4114abdfa909ea7877a655f4d929cf2b64c92681c3925e5bfd565e17221966f6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: root
        name: Recover exact canonical R54
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip
          test -f "$ZIP"
          rm -rf final-close-work final-pack incoming final-close-evidence && mkdir -p final-close-work final-pack incoming final-close-evidence
          unzip -q "$ZIP" -d final-close-work
          SET="$(find final-close-work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"; test -n "$SET"; ROOT="$(dirname "$SET")"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Recover approved R39-R46 visual completion pack
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('incoming')/os.environ['FINAL_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);pg=b.new_page(accept_downloads=True)
            pg.goto(os.environ['FINAL_URL'],wait_until='domcontentloaded',timeout=120000);pg.wait_for_timeout(1500);done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
              try:
                q=pg.locator(sel).first
                if not q.count() or not q.is_visible():continue
                with pg.expect_download(timeout=120000) as info:q.click(timeout=10000)
                info.value.save_as(str(out));done=True;break
              except Exception:pass
            if not done:
              q=pg.get_by_text(os.environ['FINAL_FILE'],exact=False).first
              parent=q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
              with pg.expect_download(timeout=120000) as info:parent.locator('a,button').last.click(timeout=10000)
              info.value.save_as(str(out));done=True
            b.close()
          if not done or not out.exists():raise SystemExit('visual completion pack download failed')
          PY
          echo "$FINAL_SHA  incoming/$FINAL_FILE" | sha256sum -c -
          unzip -q "incoming/$FINAL_FILE" -d final-pack
      - name: Apply final integrated closure stack
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          V="$ROOT/app/src/main/assets/vtt"
          python3 star-wars/r54/final_map_travel_integration.py "$ROOT" | tee final-close-evidence/MAP_TRAVEL_PATCH.txt
          python3 star-wars/r54/fix_map_anchor_state.py "$ROOT" | tee final-close-evidence/MAP_ANCHOR.txt
          if ! grep -Fq 'dataset.r54VisualBound=key' "$V/r46/final-runtime.js"; then
            python3 star-wars/r54/fix_item_binding_idempotence.py "$ROOT" | tee final-close-evidence/ITEM_BINDING.txt
          else
            printf 'R54 ITEM BINDING IDEMPOTENCE PASS already_applied=1\n' | tee final-close-evidence/ITEM_BINDING.txt
          fi
          if grep -Fq 'no active Age of Rebellion tree data' "$V/js/core/uiBridge.bundle.js"; then
            python3 star-wars/r54/fix_aor_talent_runtime.py "$ROOT" | tee final-close-evidence/AOR_RUNTIME.txt
          else
            printf 'R54_AOR_TALENT_RUNTIME_PASS already_active=1\n' | tee final-close-evidence/AOR_RUNTIME.txt
          fi
          python3 star-wars/r54/fix_r54_ux.py "$ROOT" | tee final-close-evidence/UX_PATCH.txt
          python3 star-wars/r54/fix_supplement_species_runtime.py "$ROOT" | tee final-close-evidence/SUPPLEMENTS.txt
          python3 star-wars/r54/fix_barbara_narration_contract.py "$ROOT" | tee final-close-evidence/BARBARA_NARRATION.txt
          python3 star-wars/r54/fix_barbara_opening_master.py "$ROOT" | tee final-close-evidence/BARBARA_OPENING.txt
          python3 star-wars/r54/restore_historical_visuals.py "$ROOT" "$(pwd)/final-pack" | tee final-close-evidence/VISUAL_RESTORE.txt
          node --check "$V/r54-final-map-travel.js"
          node --check "$V/r46/final-runtime.js"
          node --check "$V/r46/r46-shell.bundle.js"
          node --check "$V/js/core/uiBridge.bundle.js"
      - name: Static final gates
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          V="$ROOT/app/src/main/assets/vtt"
          grep -Fq '<script src="r54-final-map-travel.js"></script>' "$V/r46-shell.html"
          grep -Fq 'LOCALIZAÇÃO ATUAL' "$V/r54-final-map-travel.js"
          grep -Fq 'OBJETIVOS PÚBLICOS' "$V/r54-final-map-travel.js"
          grep -Fq 'ROTAS A PARTIR DAQUI' "$V/r54-final-map-travel.js"
          grep -Fq 'b.travelToLocation(to' "$V/r54-final-map-travel.js"
          grep -Fq '[VIAGEM_BARBARA]' "$V/r54-final-map-travel.js"
          grep -Fq 'dataset.r54VisualBound=key' "$V/r46/final-runtime.js"
          grep -Fq 'R54_BARBARA_OPENING_MASTER' "$V/r46/final-runtime.js"
          grep -Fq '400–700' "$V/js/core/uiBridge.bundle.js"
          grep -Fq 'R54_SUPPLEMENT_SPECIES_REFERENCE' "$V/r46/final-runtime.js"
          python3 - "$V" <<'PY'
          import json,sys
          from pathlib import Path
          v=Path(sys.argv[1]);m=json.loads((v/'image-library/manifest.json').read_text('utf-8'))
          final=[a for a in m.get('assets',[]) if str(a.get('assetId','')).startswith('local.final.')]
          assert len(final)==42,len(final)
          counts={k:sum(a.get('category')==k for a in final) for k in ['scene','vehicle','creature','portrait','equipment']}
          assert counts=={'scene':26,'vehicle':9,'creature':3,'portrait':2,'equipment':2},counts
          s=(v/'js/rules/talentTreesData.mjs').read_text('utf-8');mark='export const TALENT_TREES = Object.freeze(';i=s.index(mark);j=s.index('{',i+len(mark));trees=json.JSONDecoder().raw_decode(s[j:])[0]
          counts2=(len(trees),sum(len(x) for x in trees.values()),sum(len(t['nodes']) for x in trees.values() for t in x.values()))
          assert counts2==(12,36,720),counts2
          print('R54_STATIC_FINAL_PASS visuals=',counts,'talents=',counts2)
          PY
      - name: Browser map + travel + colored controls 415x915
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/r54-final-map-http.log 2>&1 & PID=$!;trap 'kill $PID || true' EXIT;sleep 1
          python3 - <<'PY' | tee final-close-evidence/MAP_TRAVEL_BROWSER.txt
          from playwright.sync_api import sync_playwright
          base='http://127.0.0.1:8765/r46-shell.html'
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915});errs=[];pg.on('pageerror',lambda e:errs.append(str(e)))
            pg.route('**/*',lambda route,req: route.continue_() if req.url.startswith('http://127.0.0.1:8765/') else route.abort())
            pg.goto(base+'?screen=00',wait_until='domcontentloaded',timeout=30000);pg.wait_for_function("()=>window.BraseiroGameBridge&&typeof window.BraseiroGameBridge.readState==='function'",timeout=15000)
            if pg.locator('#braseiro-sandbox-setup').count():
              pg.locator('#sandbox-list button[data-point]').first.click();pg.locator('#sandbox-start-button').click();pg.wait_for_selector('#braseiro-sandbox-setup',state='detached',timeout=10000)
            before=pg.evaluate("()=>window.BraseiroGameBridge.readState().data.scene?.locationId")
            pg.goto(base+'?screen=16',wait_until='domcontentloaded',timeout=30000);pg.wait_for_selector('#r54-map-live-panel',timeout=10000);pg.wait_for_timeout(250)
            assert pg.locator('#r54-map-live-panel').count()==1
            text=pg.locator('#r54-map-live-panel').inner_text();assert 'LOCALIZAÇÃO ATUAL' in text and 'OBJETIVOS PÚBLICOS' in text and 'ROTAS A PARTIR DAQUI' in text,text
            assert pg.locator('.r54-live-map-anchor').count()==1,'current-location marker missing at initial point'
            buttons=pg.locator('#r54-map-live-panel .r54-route-travel');assert buttons.count()>0,'no connected travel routes'
            style=buttons.first.evaluate("e=>getComputedStyle(e).backgroundImage");assert style!='none',style
            destination=buttons.first.locator('xpath=preceding-sibling::div[1]/b').inner_text()
            buttons.first.click();pg.wait_for_timeout(500)
            after=pg.evaluate("()=>window.BraseiroGameBridge.readState().data.scene?.locationId")
            assert after and after!=before,(before,after)
            msg=pg.locator('#r54-map-live-panel .r54-message').inner_text();assert 'Chegada confirmada' in msg or destination in pg.locator('#r54-map-live-panel').inner_text(),msg
            pg.reload(wait_until='domcontentloaded',timeout=30000);pg.wait_for_selector('#r54-map-live-panel',timeout=10000)
            persisted=pg.evaluate("()=>window.BraseiroGameBridge.readState().data.scene?.locationId");assert persisted==after,(after,persisted)
            assert not errs,errs
            print('R54_MAP_TRAVEL_BROWSER_PASS',{'before':before,'after':after,'destination':destination,'persisted':persisted,'routes':buttons.count()})
            b.close()
          PY
      - name: Browser historical visuals 415x915
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/r54-final-visual-http.log 2>&1 & PID=$!;trap 'kill $PID || true' EXIT;sleep 1
          python3 - <<'PY' | tee final-close-evidence/VISUAL_BROWSER.txt
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915});errs=[];pg.on('pageerror',lambda e:errs.append(str(e)))
            pg.route('**/*',lambda route,req: route.continue_() if req.url.startswith('http://127.0.0.1:8766/') else route.abort())
            pg.goto('http://127.0.0.1:8766/r46-shell.html?screen=00',wait_until='domcontentloaded',timeout=30000);pg.wait_for_timeout(200)
            if pg.locator('#braseiro-sandbox-setup').count():pg.locator('#sandbox-list button[data-point]').first.click();pg.locator('#sandbox-start-button').click();pg.wait_for_selector('#braseiro-sandbox-setup',state='detached',timeout=10000)
            pg.wait_for_timeout(300);completion=pg.evaluate('window.BraseiroFinalVisualCompletion||null');assert completion and completion['scenes']==26,completion
            imgs=pg.locator('.scene-media-slot img.final-scene-library-image:visible');assert imgs.count()>=1,imgs.count();assert imgs.first.evaluate('(i)=>i.complete&&i.naturalWidth>0')
            assert not errs,errs;print('R54_HISTORICAL_VISUAL_BROWSER_PASS',completion);b.close()
          PY
      - name: Living world + NAVE end-to-end
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/r54-final-e2e-http.log 2>&1 & PID=$!;trap 'kill $PID || true' EXIT;sleep 1
          python3 star-wars/r54/audit_living_world_e2e.py "$ROOT" | tee final-close-evidence/LIVING_WORLD_E2E.txt
          grep -q 'R54_LIVING_WORLD_E2E_PASS' final-close-evidence/LIVING_WORLD_E2E.txt
          python3 star-wars/r54/audit_nave_e2e.py "$ROOT" | tee final-close-evidence/NAVE_E2E.txt
          grep -q 'R54_NAVE_E2E_PASS' final-close-evidence/NAVE_E2E.txt
      - name: Deep 31-screen regression
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          cp star-wars/r54/audit_deep_vtt.py /tmp/audit_deep_vtt.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/audit_deep_vtt.py');s=p.read_text('utf-8')
          s=s.replace("ok=(new URL(page.url)).searchParams.get('screen')==target","ok=(re.search(r'[?&]screen=([0-9]+)',page.url).group(1)==target)")
          s=s.replace("wait_until='networkidle'","wait_until='domcontentloaded'").replace("timeout=120000","timeout=30000")
          s=s.replace("imgs=>imgs.filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute('src'))","imgs=>imgs.filter(i=>i.complete&&i.naturalWidth===0&&i.src.startsWith('http://127.0.0.1:8765/')).map(i=>i.getAttribute('src'))")
          s=s.replace("page=ctx.new_page();page.on('pageerror',lambda e:page_errors.append(str(e)))","page=ctx.new_page();page.on('pageerror',lambda e:page_errors.append(str(e)));page.route('**/*',lambda route,req: route.continue_() if req.url.startswith('http://127.0.0.1:8765/') else route.abort())")
          s=s.replace("p2=c2.new_page();errs2=[];p2.on('pageerror',lambda e:errs2.append(str(e)))","p2=c2.new_page();errs2=[];p2.on('pageerror',lambda e:errs2.append(str(e)));p2.route('**/*',lambda route,req: route.continue_() if req.url.startswith('http://127.0.0.1:8765/') else route.abort())")
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m http.server 8765 --directory "$ROOT/app/src/main/assets/vtt" >/tmp/r54-final-deep-http.log 2>&1 & PID=$!;trap 'kill $PID || true' EXIT;sleep 1
          python3 /tmp/audit_deep_vtt.py "$ROOT" final-close-evidence
          python3 - <<'PY' | tee final-close-evidence/FINAL_NO_FAIL.txt
          import json
          d=json.load(open('final-close-evidence/DEEP_AUDIT.json',encoding='utf-8'));fails=[x for x in d['findings'] if x.get('status')=='FAIL'];assert not fails,fails
          assert len(d.get('screens',{}).get('registry',[]))==31
          assert len(d.get('screens',{}).get('runtime',{}))==31
          assert not d.get('screens',{}).get('360x800',{}).get('bad_routes',[])
          print('R54_FINAL_DEEP_NO_FAIL PASS findings=',len(d['findings']))
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', validate-wrappers: false}
      - name: Configure Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}";SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n1)";yes | "$SDKMANAGER" --licenses >/dev/null || true;"$SDKMANAGER" 'platform-tools' 'platforms;android-36';echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Build final Android R54
        working-directory: ${{ steps.root.outputs.path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Persist final canonical package and evidence
        env: {ROOT: "${{ steps.root.outputs.path }}"}
        run: |
          set -euo pipefail
          OUT=star-wars/final-1.0.0/output-r54;TMP="$(mktemp -d)";AUDTMP="$(mktemp -d)"
          APK="$(find "$ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n1)";test -f "$APK";cp "$APK" "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk";unzip -t "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk" >/dev/null
          (cd "$ROOT" && zip -qr "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip" . -x '*/build/*' '.gradle/*')
          sha256sum "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk" > "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_ASSETS_HOTFIX_DEBUG.apk.sha256"
          sha256sum "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip" > "$TMP/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip.sha256"
          cp final-close-evidence/DEEP_AUDIT.md "$AUDTMP/DEEP_VTT_AUDIT_2026-09-16.md";cp final-close-evidence/DEEP_AUDIT.json "$AUDTMP/DEEP_VTT_AUDIT_2026-09-16.json";cp final-close-evidence/NAVE_E2E.txt "$AUDTMP/NAVE_E2E_2026-09-16.txt";cp final-close-evidence/LIVING_WORLD_E2E.txt "$AUDTMP/LIVING_WORLD_E2E_2026-09-16.txt"
          printf '%s\n' 'R54 FINAL CLOSEOUT PASS: map/current-location/objectives/routes/travel + Barbara travel narration; 42 historical visuals restored/bound; idempotent item images; AoR active; supplements active; 31-screen deep regression NO FAIL; NAVE PASS; living-world PASS; Android build PASS.' > "$TMP/FINAL_CLOSEOUT_2026-09-16.txt"
          git config user.name github-actions;git config user.email github-actions@github.com
          git fetch origin main;git rebase origin/main
          mkdir -p "$OUT" star-wars/r54/audit
          cp "$TMP"/* "$OUT/";cp "$AUDTMP"/* star-wars/r54/audit/
          git add -f "$OUT" star-wars/r54/audit
          git commit -m 'build: close Star Wars R54 final integrated package' || true
          git push origin HEAD:main
