name: Publish BRASEIRO OSE 1.0.4 to tmpfiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-ose-1.0.4-tmpfiles.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate APK and SHA
        run: |
          set -euo pipefail
          test -f build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.apk
          sha256sum -c build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.sha256
          unzip -t build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.apk >/dev/null
      - name: Upload to tmpfiles
        run: |
          set -euo pipefail
          APK=build-artifacts/ose/1.0.4/BRASEIRO_OSE_1_0_4_DEBUG.apk
          curl --fail --retry 3 --retry-delay 3 -sS -F "file=@${APK}" https://tmpfiles.org/api/v1/upload | tee /tmp/tmpfiles.json
          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('/tmp/tmpfiles.json').read_text())
          url=data.get('data',{}).get('url')
          if not url: raise SystemExit(data)
          direct=url.replace('https://tmpfiles.org/','https://tmpfiles.org/dl/',1)
          out=pathlib.Path('build-artifacts/ose/1.0.4/TMPFILES_URL.txt')
          out.write_text('page='+url+'\ndirect='+direct+'\n')
          print(direct)
          PY
      - name: Save link
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-artifacts/ose/1.0.4/TMPFILES_URL.txt
          git commit -m 'Publish BRASEIRO OSE 1.0.4 tmpfiles link'
          git push origin HEAD:main
