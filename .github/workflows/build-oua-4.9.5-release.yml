name: Braseiro O Um Anel 4.9.5 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oua-4.9.5-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: OUA-v4.9.5
  SOURCE_NAME: OUA_4.9.5_MAP_PARTY_CAMPAIGN_RECOVERY_ANDROID_STUDIO.zip
  APK_NAME: BRASEIRO_O_UM_ANEL_4.9.5_DEBUG.apk

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download 4.9.4 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work out
          gh release download OUA-v4.9.4 --pattern 'OUA_4.9.4_VISUAL_FIX_ANDROID_STUDIO.zip' --dir incoming
          unzip -q incoming/OUA_4.9.4_VISUAL_FIX_ANDROID_STUDIO.zip -d work
          ROOT="$(dirname "$(find work -maxdepth 3 -type f -name package.json | head -n1)")"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply 4.9.5 map/party/campaign recovery
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ci/oua-4.9.5/patch.gz.b64 | gzip -dc > /tmp/oua495.patch
          (cd "$ROOT" && patch -p1 < /tmp/oua495.patch)
          grep -q "APP_VERSION = '4.9.5'" "$ROOT/lib/version.ts"
          grep -q 'versionName = "4.9.5"' "$ROOT/android/app/build.gradle.kts"
          grep -q 'followParty={false}' "$ROOT/components/immersive/ImmersiveJourneyView.tsx"
          grep -q 'data-braseiro-start-adventure' "$ROOT/components/immersive/ImmersiveJourneyView.tsx"
          grep -q 'data-braseiro-map-selection' "$ROOT/components/EriadorMap.tsx"

      - name: Rebuild and validate runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          npm install --ignore-scripts --no-save --package-lock=false typescript@5.8.3
          npm run build:offline
          node scripts/use-offline-dist.mjs
          node scripts/sync-android-assets.mjs
          node scripts/test-map-campaign-recovery-4.9.5.mjs
          node --experimental-vm-modules scripts/test-android-module-graph.mjs
          cat > VALIDACAO_OUA_4.9.5_MAP_PARTY_CAMPAIGN_RECOVERY.txt <<'EOF'
          O Um Anel 4.9.5 MAP / PARTY / CAMPAIGN RECOVERY
          PASS — mapa interativo restaurado antes da primeira cena
          PASS — pan/zoom liberados no modo Atlas
          PASS — seleção de hex e local/POI restaurada
          PASS — ilustração contextual de POI/local restaurada
          PASS — Companhia ancorada ao hex atual
          PASS — posicionar/mover Companhia atualiza estado canônico
          PASS — planejamento de rota disponível
          PASS — ABRIR CRÔNICA restaurado e ligado ao início real da campanha
          PASS — runtime offline recompilado e assets Android sincronizados
          PASS — grafo Android validado
          EOF

      - name: Package corrected source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-src
          cp -a "$ROOT" release-src/OUA495
          rm -rf release-src/OUA495/node_modules release-src/OUA495/android/.gradle release-src/OUA495/android/app/build
          (cd release-src && zip -qr "../out/$SOURCE_NAME" OUA495)
          unzip -t "out/$SOURCE_NAME" >/dev/null
          sha256sum "out/$SOURCE_NAME" > "out/$SOURCE_NAME.sha256"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$ROOT/android/gradlew"
          cd "$ROOT/android"
          ./gradlew clean :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" > "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.oumanel'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null

      - name: Publish one release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" --target main             --title 'Braseiro O Um Anel 4.9.5 — Map/Party/Campaign Recovery'             --notes 'Recupera o Atlas funcional: pan/zoom, seleção de hex, POIs e ilustrações, Companhia ancorada ao mapa e início real da crônica. Preserva os hotfixes de boot, UI 4.9.4 e Motor Barbara 1.1.3.'
          gh release upload "$TAG"             "out/$SOURCE_NAME"             "out/$SOURCE_NAME.sha256"             "out/$APK_NAME"             "out/$APK_NAME.sha256"             out/APK_BADGING.txt             out/GRADLE_BUILD.log             "$ROOT/VALIDACAO_OUA_4.9.5_MAP_PARTY_CAMPAIGN_RECOVERY.txt"
