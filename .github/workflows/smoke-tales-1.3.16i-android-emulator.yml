name: Smoke Tales 1.3.16i Android Emulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-tales-1.3.16i-android-emulator.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Recover exact cumulative source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work
          mkdir -p incoming work
          gh release download TALES-1.3.8 --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip' --dir incoming
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip -d work
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          chmod +x "$ROOT/gradlew"
          python3 -m pip install --quiet pillow
          python3 tales-1.3.14-transform.py "$ROOT"
          python3 tales-1.3.16i-transform.py "$ROOT" >/tmp/tales-emulator-transform.txt
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK and emulator image
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 || sudo apt-get install -y --no-install-recommends libpulse0t64
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          test -x "$ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -version | head -n 2
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble internal debug APK
        working-directory: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Boot clean emulator
        run: |
          set -euo pipefail
          EMU="$ANDROID_HOME/emulator/emulator"
          test -x "$EMU"
          echo no | avdmanager create avd --force --name tales_ci --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          adb start-server

          boot_wait() {
            local seconds="$1"
            for i in $(seq 1 "$seconds"); do
              if adb get-state >/dev/null 2>&1 && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                echo "EMULATOR_BOOT_SECONDS=$i"
                return 0
              fi
              if ! pgrep -f 'emulator.*tales_ci' >/dev/null 2>&1; then
                echo 'Emulator process exited before boot.'
                return 1
              fi
              sleep 1
            done
            return 1
          }

          launch_emulator() {
            local accel="$1"
            rm -f /tmp/emulator.log
            nohup "$EMU" @tales_ci \
              -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot \
              -camera-back none -camera-front none -cores 2 -memory 2048 \
              -accel "$accel" >/tmp/emulator.log 2>&1 &
          }

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            echo 'Trying KVM acceleration first.'
            launch_emulator on
            if ! boot_wait 180; then
              echo 'KVM boot failed; emulator log follows:'
              tail -200 /tmp/emulator.log || true
              adb emu kill >/dev/null 2>&1 || true
              pkill -f 'emulator.*tales_ci' >/dev/null 2>&1 || true
              sleep 3
              echo 'Retrying with software acceleration.'
              launch_emulator off
              boot_wait 420 || { tail -300 /tmp/emulator.log || true; exit 1; }
            fi
          else
            echo '/dev/kvm unavailable; using software acceleration.'
            launch_emulator off
            boot_wait 420 || { tail -300 /tmp/emulator.log || true; exit 1; }
          fi

          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk | grep -qx 35

      - name: Install and launch Tales profile
        env:
          ROOT: ${{ steps.source.outputs.root }}
        run: |
          set -euo pipefail
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          adb install -r "$APK"
          adb logcat -c
          adb shell monkey -p com.braseiro.talesvtt -c android.intent.category.LAUNCHER 1 >/tmp/monkey-start.txt
          sleep 5
          adb shell pidof com.braseiro.talesvtt >/tmp/tales-pid.txt
          test -s /tmp/tales-pid.txt
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb pull /sdcard/window.xml /tmp/tales-before.xml >/dev/null
          grep -q 'TALES' /tmp/tales-before.xml
          grep -q 'FLOOD' /tmp/tales-before.xml

      - name: Switch UI to Flood Teens and verify visible state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          root=ET.parse('/tmp/tales-before.xml').getroot()
          candidates=[]
          for n in root.iter('node'):
              text=n.attrib.get('text','').upper()
              if 'FLOOD' in text and 'TEENS' in text:
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2=map(int,m.groups())
                      candidates.append(((x1+x2)//2,(y1+y2)//2,text))
          assert candidates, 'Flood/Teens control not found in UIAutomator tree'
          x,y,text=candidates[-1]
          print(f'FLOOD_CONTROL={text} TAP={x},{y}')
          open('/tmp/flood-tap.txt','w').write(f'{x} {y}')
          PY
          read X Y < /tmp/flood-tap.txt
          adb shell input tap "$X" "$Y"
          sleep 3
          adb shell uiautomator dump /sdcard/window2.xml >/dev/null
          adb pull /sdcard/window2.xml /tmp/tales-after.xml >/dev/null
          grep -q 'THINGS FROM THE FLOOD' /tmp/tales-after.xml
          grep -q 'TEEN' /tmp/tales-after.xml
          adb exec-out screencap -p > /tmp/tales-flood-smoke.png
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/tales-flood-smoke.png')
          print('SCREENSHOT_SIZE=%sx%s' % im.size)
          assert im.width>0 and im.height>0
          PY

      - name: Ten relaunch anti-crash loop
        run: |
          set -euo pipefail
          adb logcat -c
          for i in $(seq 1 10); do
            adb shell am force-stop com.braseiro.talesvtt
            adb shell monkey -p com.braseiro.talesvtt -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 2
            PID=$(adb shell pidof com.braseiro.talesvtt | tr -d '\r')
            test -n "$PID"
            echo "RELAUNCH_$i=PASS PID=$PID"
          done
          adb logcat -d > /tmp/tales-logcat.txt
          if grep -A25 -B5 'FATAL EXCEPTION' /tmp/tales-logcat.txt | grep -q 'com.braseiro.talesvtt'; then
            echo 'FAIL: app fatal exception detected during relaunch loop'
            grep -A25 -B5 'FATAL EXCEPTION' /tmp/tales-logcat.txt || true
            exit 1
          fi
          adb shell uiautomator dump /sdcard/window3.xml >/dev/null
          adb pull /sdcard/window3.xml /tmp/tales-final.xml >/dev/null
          grep -q 'THINGS FROM THE FLOOD' /tmp/tales-final.xml

      - name: Save emulator smoke evidence
        run: |
          set -euo pipefail
          REPORT=audit/tales-1.3.16-dev-current/ANDROID_EMULATOR_SMOKE.md
          cat > "$REPORT" <<EOF
          # Android emulator smoke — Tales/Flood 1.3.16-dev

          - Workflow: $GITHUB_RUN_ID
          - Clean Android 35 emulator boot: PASS.
          - Install and launcher start: PASS.
          - Tales/Kids profile visible at startup: PASS.
          - Flood/Teens selector discovered through UIAutomator: PASS.
          - Flood/Teens selection reflected in visible UI: PASS.
          - 10 consecutive force-stop/relaunch cycles: PASS.
          - App-process fatal exception scan after relaunch loop: PASS.
          - APK used only inside CI and NOT uploaded/published.
          EOF
          printf '\n## Evidência Android interna — emulator smoke\n- Android 35: launcher + troca Tales→Flood + 10 relaunches sem fatal exception: PASS no workflow %s.\n- APK interno de smoke NÃO publicado.\n' "$GITHUB_RUN_ID" >> TALES_RETOMADA_CURRENT.md
          cp TALES_RETOMADA_CURRENT.md audit/tales-1.3.16-dev-current/TALES_RETOMADA_CURRENT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT" TALES_RETOMADA_CURRENT.md audit/tales-1.3.16-dev-current/TALES_RETOMADA_CURRENT.md
          git commit -m 'Record Tales Flood Android emulator smoke' || exit 0
          git restore .
          git pull --rebase origin main
          git push
