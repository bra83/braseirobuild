name: WWN Final Build + Publish v2

on:
  push:
    branches:
      - wwn-final-build-sync

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHARE_URL: https://firestorage.ai/ja/f/t7wST7E2Vp6w
      TARGET_BRANCH: wwn-source-105-bridge
      BASE_SHA: a57c0e2cf5a1ab67f26a3aca200d000824bf6423
      SOURCE_ZIP_NAME: BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL_WITH_ICON.zip

    steps:
      - name: Checkout build bridge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          cat > /tmp/get_source.py <<'PY'
          import os, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          share = os.environ['SOURCE_SHARE_URL']
          filename = os.environ['SOURCE_ZIP_NAME']
          out = Path('/tmp/wwn-source.zip')
          chrome = (shutil.which('google-chrome') or shutil.which('google-chrome-stable') or
                    shutil.which('chromium') or shutil.which('chromium-browser'))
          if not chrome:
              raise SystemExit('Chrome/Chromium unavailable')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, executable_path=chrome, args=['--no-sandbox'])
              ctx = browser.new_context(accept_downloads=True, locale='ja-JP')
              page = ctx.new_page()
              page.goto(share, wait_until='networkidle', timeout=120000)
              controls = page.locator('a,button')
              chosen = None
              for i in range(controls.count()):
                  el = controls.nth(i)
                  try:
                      blob = ((el.inner_text(timeout=1000) or '') + (el.get_attribute('aria-label') or '') + (el.get_attribute('title') or ''))
                      if filename in blob:
                          chosen = el
                          break
                  except Exception:
                      pass
              if chosen is None:
                  raise SystemExit('Uploaded source ZIP control not found')
              with page.expect_download(timeout=30000) as info:
                  chosen.click()
              info.value.save_as(str(out))
              browser.close()

          if out.stat().st_size < 1000000:
              raise SystemExit(f'ZIP unexpectedly small: {out.stat().st_size}')
          print('SOURCE_ZIP_BYTES', out.stat().st_size)
          PY
          python /tmp/get_source.py
          sha256sum /tmp/wwn-source.zip
          unzip -t /tmp/wwn-source.zip >/dev/null
          rm -rf /tmp/wwn-final
          mkdir -p /tmp/wwn-final
          unzip -q /tmp/wwn-source.zip -d /tmp/wwn-final
          test -f /tmp/wwn-final/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE/settings.gradle.kts

      - name: Verify final source QA in clean tree
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/wwn-final/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE
          cd "$SRC"
          count=0
          for test in qa/*.mjs; do
            node "$test"
            count=$((count + 1))
          done
          test "$count" -eq 31
          echo "31/31 WWN QA suites PASS"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/wwn-final/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE
          cd "$SRC"
          chmod +x gradlew
          ./gradlew --version
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publish final source and APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/wwn-final/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE

          rsync -a --delete "$SRC/" ./ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='delivery/' \
            --exclude='.gradle/' \
            --exclude='.idea/' \
            --exclude='**/build/' \
            --exclude='local.properties' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.jks' \
            --exclude='*.keystore' \
            --exclude='*.apk' \
            --exclude='*.aab'

          rm -f .github/workflows/wwn-final-release-v2.yml
          mkdir -p delivery
          cp "$SRC/app/build/outputs/apk/debug/app-debug.apk" delivery/BRASEIRO_WWN_v1.0.5.apk

          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE"
          rsync -a ./ "$STAGE/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='delivery/' \
            --exclude='.gradle/' \
            --exclude='.idea/' \
            --exclude='**/build/' \
            --exclude='local.properties' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.jks' \
            --exclude='*.keystore' \
            --exclude='*.apk' \
            --exclude='*.aab'
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/delivery/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL.zip" BRASEIRO_WWN_ANDROID_STUDIO_SOURCE)

          if zipinfo -1 delivery/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL.zip | grep -E '(^|/)(build|\.gradle|\.idea)/|\.apk$|\.aab$|\.jks$|\.keystore$|(^|/)local\.properties$|(^|/)\.env($|\.)'; then
            echo 'Forbidden file detected in source-only ZIP' >&2
            exit 1
          fi

          sha256sum delivery/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL.zip delivery/BRASEIRO_WWN_v1.0.5.apk > delivery/SHA256SUMS_FINAL_WWN.txt
          cat > delivery/APK_BUILD_INFO.md <<'EOF'
          # Braseiro WWN Android build

          - Application ID: `com.braseiro.wwn`
          - Version: `1.0.5` (`versionCode 105`)
          - APK: Android debug-signed build, directly installable outside Play Store
          - Source gate: 31/31 QA suites PASS in a clean extracted source tree
          - Launcher: professional Braseiro WWN icon, graphite/dark-fantasy with aged-gold compass mark
          - Source ZIP excludes APK/AAB, build outputs, caches, keys, `local.properties`, and `.env` files
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft "$BASE_SHA"
          git add -A
          git commit -m "release: WWN final audited source + Android APK"
          git push origin HEAD:"$TARGET_BRANCH"
          cat delivery/SHA256SUMS_FINAL_WWN.txt

      - name: Upload backup delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_WWN_FINAL_DELIVERY
          path: |
            delivery/BRASEIRO_WWN_v1.0.5.apk
            delivery/BRASEIRO_WWN_ANDROID_STUDIO_SOURCE_FINAL.zip
            delivery/SHA256SUMS_FINAL_WWN.txt
            delivery/APK_BUILD_INFO.md
          if-no-files-found: error
          retention-days: 30
