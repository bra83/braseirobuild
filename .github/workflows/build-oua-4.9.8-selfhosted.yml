name: OUA 4.9.8 Scene Entities Gemini — BRELGA

concurrency:
  group: oua-4.9.8-brelga
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oua-4.9.8-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BASE_TAG: OUA-v4.9.5
      BASE_SOURCE: OUA_4.9.5_MAP_PARTY_CAMPAIGN_RECOVERY_ANDROID_STUDIO.zip
      TAG: OUA-v4.9.8
      SOURCE_NAME: OUA_4.9.8_SCENE_ENTITIES_GEMINI_ANDROID_STUDIO.zip
      APK_NAME: BRASEIRO_O_UM_ANEL_4.9.8_DEBUG.apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build, validate and publish 4.9.8
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'BRELGA') { throw "Expected BRELGA, got $env:RUNNER_NAME" }

          $python = (Get-Command python.exe -ErrorAction SilentlyContinue)
          if (-not $python) { $python = (Get-Command python -ErrorAction SilentlyContinue) }
          if (-not $python) { throw 'Python not found on BRELGA' }
          if (-not (Get-Command npm.cmd -ErrorAction SilentlyContinue)) { throw 'npm.cmd not found on BRELGA' }
          if (-not (Get-Command node.exe -ErrorAction SilentlyContinue)) { throw 'node.exe not found on BRELGA' }

          $headers = @{
            'Authorization' = "Bearer $env:GITHUB_TOKEN"
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'braseiro-oua-498-brelga'
          }

          $repo = $env:GITHUB_REPOSITORY
          $baseTag = [uri]::EscapeDataString($env:BASE_TAG)
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$baseTag"
          $asset = @($release.assets | Where-Object { $_.name -eq $env:BASE_SOURCE -and $_.state -eq 'uploaded' }) | Select-Object -First 1
          if (-not $asset) { throw "Base source asset not found: $env:BASE_SOURCE" }

          $work = Join-Path $env:RUNNER_TEMP 'oua-498-work'
          $incoming = Join-Path $work 'incoming'
          $extract = Join-Path $work 'extract'
          $out = Join-Path $work 'out'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $incoming,$extract,$out -Force | Out-Null

          $zip = Join-Path $incoming $env:BASE_SOURCE
          & curl.exe -L --fail --retry 4 --retry-delay 2 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" -o $zip $asset.url
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) { throw 'Failed to download 4.9.5 source' }

          & tar.exe -xf $zip -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract 4.9.5 source' }
          $pkg = Get-ChildItem $extract -Recurse -File -Filter package.json |
            Where-Object { Test-Path (Join-Path $_.Directory.FullName 'android') } |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1
          if (-not $pkg) { throw 'Android Studio project root not found' }
          $root = $pkg.Directory.FullName
          Write-Host "ROOT=$root"

          $map497 = "$env:GITHUB_WORKSPACE\ci\oua-4.9.7\source-snapshot\components\EriadorMap.tsx"
          if (-not (Test-Path $map497)) { throw 'Materialized 4.9.7 EriadorMap source is missing' }
          Copy-Item $map497 (Join-Path $root 'components\EriadorMap.tsx') -Force
          & $python.Source "$env:GITHUB_WORKSPACE\ci\oua-4.9.8\patch_core.py" $root
          if ($LASTEXITCODE -ne 0) { throw '4.9.8 core patch failed' }
          & $python.Source "$env:GITHUB_WORKSPACE\ci\oua-4.9.8\patch_app.py" $root
          if ($LASTEXITCODE -ne 0) { throw '4.9.8 app patch failed' }
          & $python.Source "$env:GITHUB_WORKSPACE\ci\oua-4.9.8\patch_ui.py" $root
          if ($LASTEXITCODE -ne 0) { throw '4.9.8 UI patch failed' }
          & $python.Source "$env:GITHUB_WORKSPACE\ci\oua-4.9.8\patch_android_version.py" $root
          if ($LASTEXITCODE -ne 0) { throw '4.9.8 Android/version patch failed' }

          $appText = Get-Content (Join-Path $root 'App.tsx') -Raw
          $gameText = Get-Content (Join-Path $root 'components\GameView.tsx') -Raw
          $immText = Get-Content (Join-Path $root 'components\immersive\ImmersiveJourneyView.tsx') -Raw
          $dbText = Get-Content (Join-Path $root 'lib\db.ts') -Raw
          $nativeText = Get-Content (Join-Path $root 'android\app\src\main\java\com\braseiro\oumanel\MainActivity.kt') -Raw
          $gates = @{
            'scene-16x9' = $dbText.Contains("'9:16' | '16:9'")
            'prompt-persisted' = $appText.Contains('sceneVisualPromptCreatedAt: Date.now()')
            'npc-sync' = $appText.Contains('reconcileSceneNpcPresence')
            'npc-stable-token' = $appText.Contains("'npc_portrait_' + safeNpcId")
            'npc-target-routing' = $appText.Contains('handleImportNpcPortrait(dataUrl, npcTargetId)')
            'scene-gemini' = $gameText.Contains('Gerar ilustração')
            'npc-gemini' = $gameText.Contains('Regenerar no Gemini')
            'immersive-entities' = $immText.Contains('NPCs presentes')
            'gemini-package' = $nativeText.Contains('com.google.android.apps.bard')
            'poi-overlay-497' = (Get-Content (Join-Path $root 'components\EriadorMap.tsx') -Raw).Contains("right: '-5%'")
          }
          $gateLog = Join-Path $out 'VALIDACAO_OUA_4.9.8.txt'
          foreach ($entry in $gates.GetEnumerator() | Sort-Object Name) {
            $status = if ($entry.Value) { 'PASS' } else { 'FAIL' }
            $line = $status + ' - ' + $entry.Name
            $line | Tee-Object -FilePath $gateLog -Append
          }
          if (@($gates.GetEnumerator() | Where-Object { -not $_.Value }).Count -gt 0) { throw 'Static contract gates failed' }

          Push-Location $root
          try {
            & npm.cmd ci --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
            & npm.cmd run build:offline 2>&1 | Tee-Object -FilePath (Join-Path $out 'OFFLINE_BUILD.log')
            if ($LASTEXITCODE -ne 0) { throw 'offline frontend build failed' }
            & node.exe scripts/use-offline-dist.mjs
            if ($LASTEXITCODE -ne 0) { throw 'use-offline-dist failed' }
            & node.exe scripts/sync-android-assets.mjs
            if ($LASTEXITCODE -ne 0) { throw 'sync-android-assets failed' }
          } finally { Pop-Location }

          $sourceZip = Join-Path $out $env:SOURCE_NAME
          $parent = Split-Path $root -Parent
          $leaf = Split-Path $root -Leaf
          & tar.exe -a -c -f $sourceZip --exclude='node_modules' --exclude='.gradle' --exclude='build' --exclude='android/.gradle' --exclude='android/app/build' -C $parent $leaf
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $sourceZip)) { throw 'source ZIP creation failed' }

          $sdkCandidates = @('C:\actions-runner\android-sdk')
          if ($env:ANDROID_SDK_ROOT) { $sdkCandidates += $env:ANDROID_SDK_ROOT }
          if ($env:LOCALAPPDATA) { $sdkCandidates += (Join-Path $env:LOCALAPPDATA 'Android\Sdk') }
          $sdkRoot = $sdkCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $sdkRoot) { throw 'Android SDK not found on BRELGA' }
          $env:ANDROID_HOME = $sdkRoot
          $env:ANDROID_SDK_ROOT = $sdkRoot

          $gradleRoot = Join-Path $root 'android'
          $gradleLog = Join-Path $out 'GRADLE_BUILD.log'
          Push-Location $gradleRoot
          try {
            & .\gradlew.bat clean :app:assembleDebug --stacktrace --no-daemon 2>&1 | Tee-Object -FilePath $gradleLog
            if ($LASTEXITCODE -ne 0) { throw 'Gradle assembleDebug failed' }
          } finally { Pop-Location }

          $apk = Get-ChildItem (Join-Path $gradleRoot 'app\build\outputs\apk\debug') -File -Filter '*.apk' | Select-Object -First 1
          if (-not $apk) { throw 'APK not found' }
          $apkDest = Join-Path $out $env:APK_NAME
          Copy-Item $apk.FullName $apkDest -Force

          $sourceHash = (Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $apkHash = (Get-FileHash $apkDest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sourceHash  $env:SOURCE_NAME" | Set-Content "$sourceZip.sha256" -Encoding ascii
          "$apkHash  $env:APK_NAME" | Set-Content "$apkDest.sha256" -Encoding ascii

          $encodedTag = [uri]::EscapeDataString($env:TAG)
          $existing = $null
          try { $existing = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$encodedTag" } catch {}
          if ($existing) {
            Invoke-RestMethod -Method Delete -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/$($existing.id)" | Out-Null
          }

          $body = @{
            tag_name = $env:TAG
            target_commitish = $env:GITHUB_SHA
            name = 'Braseiro O Um Anel 4.9.8 - Scene Entities + Gemini Images'
            body = 'Scene 16:9 above narration; persistent prompt; direct Gemini opening; share-back import; synchronized present NPCs; persistent unique portraits by npcId; includes visual overlay 4.9.7.'
            draft = $false
            prerelease = $false
          } | ConvertTo-Json
          $newRelease = Invoke-RestMethod -Method Post -Headers $headers -ContentType 'application/json' -Body $body -Uri "https://api.github.com/repos/$repo/releases"

          $files = Get-ChildItem $out -File
          foreach ($file in $files) {
            $encodedName = [uri]::EscapeDataString($file.Name)
            $upload = "https://uploads.github.com/repos/$repo/releases/$($newRelease.id)/assets?name=$encodedName"
            & curl.exe -L --fail --retry 5 --retry-delay 2 --request POST -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/octet-stream" --data-binary "@$($file.FullName)" $upload
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $($file.Name)" }
          }

          Write-Host "RELEASE_URL=$($newRelease.html_url)"
          Write-Host "APK_SHA256=$apkHash"
          Write-Host "SOURCE_SHA256=$sourceHash"

# trigger 4.9.8 build retry 3