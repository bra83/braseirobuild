name: BRASEIRO WWN Android Builder

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing the WWN source ZIP"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/WWN_BUILD_TRIGGER"

permissions:
  contents: write

env:
  DEFAULT_WWN_TAG: "WWN-POST071-2026-09-13"

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.event.release.tag_name, 'WWN-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Select WWN release and download source ZIP
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then TAG="${MANUAL_TAG:-}"; fi
          if [ -z "$TAG" ]; then TAG="$DEFAULT_WWN_TAG"; fi
          case "$TAG" in WWN-*) ;; *) echo "::error::Tag must start with WWN-"; exit 1;; esac
          mkdir -p incoming
          gh release download "$TAG" --pattern '*.zip' --dir incoming
          ZIP="$(find incoming -maxdepth 1 -type f -iname '*.zip' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          [ -n "${ZIP:-}" ] && [ -f "$ZIP" ] || { echo "::error::WWN source ZIP not found in release $TAG"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          sha256sum "$ZIP"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q "${{ steps.source.outputs.zip }}" -d work

      - name: Detect Android project
        id: android
        run: |
          set -euo pipefail
          ROOT=""
          while IFS= read -r -d '' W; do
            D="$(dirname "$W")"
            if [ -f "$D/settings.gradle.kts" ] || [ -f "$D/settings.gradle" ]; then ROOT="$D"; break; fi
          done < <(find work -type f -name gradlew -print0)
          [ -n "$ROOT" ] || { echo "::error::gradlew/settings.gradle not found"; exit 1; }
          chmod +x "$ROOT/gradlew"
          SDK="$(grep -RhoE 'compileSdk(Version)?[[:space:]]*[= ]+[0-9]+' "$ROOT" --include='*.gradle' --include='*.gradle.kts' 2>/dev/null | grep -oE '[0-9]+' | sort -nr | head -n1 || true)"
          [ -n "$SDK" ] || SDK=35
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "ROOT=$ROOT SDK=$SDK"

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${{ steps.android.outputs.sdk }}"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        working-directory: ${{ steps.android.outputs.root }}
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew clean test assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        id: apk
        env:
          ROOT: ${{ steps.android.outputs.root }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find "$ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -n1)"
          [ -n "$APK" ] && [ -f "$APK" ] || { echo "::error::Debug APK not found"; exit 1; }
          NAME="${TAG}-DEBUG.apk"
          cp "$APK" "out/$NAME"
          unzip -t "out/$NAME" >/dev/null
          sha256sum "out/$NAME" | tee "out/$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-WWN-APK-${{ steps.source.outputs.tag }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to WWN release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" out/* --clobber

      - name: Summary
        run: |
          {
            echo "## BRASEIRO WWN Android build"
            echo "- Source release: \`${{ steps.source.outputs.tag }}\`"
            echo "- Gradle unit tests: PASS"
            echo "- assembleDebug: PASS"
            echo "- APK: \`${{ steps.apk.outputs.name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
