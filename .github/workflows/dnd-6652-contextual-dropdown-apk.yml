name: Braseiro DnD 6.6.52 contextual dropdown APK

on:
  push:
    branches:
      - fix/dnd-contextual-four-actions-20261105
    paths:
      - .github/workflows/dnd-6652-contextual-dropdown-apk.yml
      - dnd-normal/run247-mod005/version.properties
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            dnd-normal/run247-mod005
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check version, stable signature and no data migration
        run: |
          set -euo pipefail
          project=dnd-normal/run247-mod005
          grep -q '^VERSION_CODE=203900615$' "$project/version.properties"
          grep -q '^VERSION_NAME=6.6.52-contextual-dropdown-20261105$' "$project/version.properties"
          grep -q '^DB_SCHEMA=61$' "$project/version.properties"
          grep -q '^BACKUP_FORMAT=21$' "$project/version.properties"
          test -f "$project/signing/debug.keystore"
      - name: Compile installable signed debug APK with all production assets
        working-directory: dnd-normal/run247-mod005
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify signing and APK version
        run: |
          set -euo pipefail
          apk=dnd-normal/run247-mod005/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > SIGNATURE_6652.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > BADGING_6652.txt
          grep -q "versionCode='203900615'" BADGING_6652.txt
          grep -q "package: name='com.braseiro.dnd5e'" BADGING_6652.txt
          sha256sum "$apk" > APK_SHA256_6652.txt
          cp "$apk" BRASEIRO_DND_6.6.52_CONTEXTUAL_DROPDOWN.apk
      - name: Upload installable APK and checks
        uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO_DND_6_6_52_CONTEXTUAL_DROPDOWN_APK
          path: |
            BRASEIRO_DND_6.6.52_CONTEXTUAL_DROPDOWN.apk
            APK_SHA256_6652.txt
            SIGNATURE_6652.txt
            BADGING_6652.txt
          if-no-files-found: error
