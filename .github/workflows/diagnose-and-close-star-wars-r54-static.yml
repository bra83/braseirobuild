name: Diagnose and Close Star Wars R54 Static Gates
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-and-close-star-wars-r54-static.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FINAL_URL: https://firestorage.ai/ja/f/qvNlG1k2Qu3e
      FINAL_FILE: STAR_WARS_EDGE_OF_THE_GALAXY_VISUAL_COMPLETION_PACK.zip
      FINAL_SHA: 4114abdfa909ea7877a655f4d929cf2b64c92681c3925e5bfd565e17221966f6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: prep
        name: Reconstruct exact final stack
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_ASSETS_HOTFIX.zip
          rm -rf diag-work diag-pack diag-incoming && mkdir -p diag-work diag-pack diag-incoming
          unzip -q "$ZIP" -d diag-work
          SET="$(find diag-work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -n1)"; test -n "$SET"; ROOT="$(dirname "$SET")"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('diag-incoming')/os.environ['FINAL_FILE']
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True);pg=b.new_page(accept_downloads=True)
            pg.goto(os.environ['FINAL_URL'],wait_until='domcontentloaded',timeout=120000);pg.wait_for_timeout(1200);done=False
            for sel in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")']:
              try:
                q=pg.locator(sel).first
                if not q.count() or not q.is_visible():continue
                with pg.expect_download(timeout=120000) as info:q.click(timeout=10000)
                info.value.save_as(str(out));done=True;break
              except Exception:pass
            if not done:
              q=pg.get_by_text(os.environ['FINAL_FILE'],exact=False).first
              parent=q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]')
              with pg.expect_download(timeout=120000) as info:parent.locator('a,button').last.click(timeout=10000)
              info.value.save_as(str(out));done=True
            b.close()
          if not done or not out.exists():raise SystemExit('visual completion pack download failed')
          PY
          echo "$FINAL_SHA  diag-incoming/$FINAL_FILE" | sha256sum -c -
          unzip -q "diag-incoming/$FINAL_FILE" -d diag-pack
          V="$ROOT/app/src/main/assets/vtt"
          python3 star-wars/r54/final_map_travel_integration.py "$ROOT"
          python3 star-wars/r54/fix_map_anchor_state.py "$ROOT"
          if ! grep -Fq 'dataset.r54VisualBound=key' "$V/r46/final-runtime.js"; then python3 star-wars/r54/fix_item_binding_idempotence.py "$ROOT"; fi
          python3 star-wars/r54/fix_aor_talent_runtime.py "$ROOT"
          python3 star-wars/r54/fix_r54_ux.py "$ROOT"
          python3 star-wars/r54/fix_supplement_species_runtime.py "$ROOT"
          python3 star-wars/r54/fix_barbara_narration_contract.py "$ROOT"
          python3 star-wars/r54/fix_barbara_opening_master.py "$ROOT"
          python3 star-wars/r54/restore_historical_visuals.py "$ROOT" "$(pwd)/diag-pack"
      - name: Label every final static gate
        env: {ROOT: "${{ steps.prep.outputs.path }}"}
        run: |
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]);v=root/'app/src/main/assets/vtt'
          checks={
            'map_script_mounted':'<script src="r54-final-map-travel.js"></script>' in (v/'r46-shell.html').read_text('utf-8'),
            'map_current_location':'LOCALIZAÇÃO ATUAL' in (v/'r54-final-map-travel.js').read_text('utf-8'),
            'map_objectives':'OBJETIVOS PÚBLICOS' in (v/'r54-final-map-travel.js').read_text('utf-8'),
            'map_routes':'ROTAS A PARTIR DAQUI' in (v/'r54-final-map-travel.js').read_text('utf-8'),
            'travel_bridge':'b.travelToLocation(to' in (v/'r54-final-map-travel.js').read_text('utf-8'),
            'barbara_travel':'[VIAGEM_BARBARA]' in (v/'r54-final-map-travel.js').read_text('utf-8'),
            'item_binding':'dataset.r54VisualBound=key' in (v/'r46/final-runtime.js').read_text('utf-8'),
            'map_idempotence':'dataset.r54Sig===sig' in (v/'r54-final-map-travel.js').read_text('utf-8'),
            'barbara_opening':'R54_BARBARA_OPENING_MASTER' in (v/'r46/final-runtime.js').read_text('utf-8'),
            'barbara_long_contract':'400-700 palavras em 4-7 parágrafos' in (root/'app/src/main/java/com/braseiro/starwarsedge/GeminiBridge.java').read_text('utf-8'),
            'supplements':'R54_SUPPLEMENT_SPECIES_REFERENCE' in (v/'r46/final-runtime.js').read_text('utf-8'),
          }
          m=json.loads((v/'image-library/manifest.json').read_text('utf-8'));final=[a for a in m.get('assets',[]) if str(a.get('assetId','')).startswith('local.final.')]
          cats={k:sum(a.get('category')==k for a in final) for k in ['scene','vehicle','creature','portrait','equipment']}
          checks['visual_count']=len(final)==42
          checks['visual_categories']=cats=={'scene':26,'vehicle':9,'creature':3,'portrait':2,'equipment':2}
          def decode(path,marker):
            s=path.read_text('utf-8');i=s.index(marker);j=s.index('{',i+len(marker));return json.JSONDecoder().raw_decode(s[j:])[0]
          def count(t):return (len(t),sum(len(x) for x in t.values()),sum(len(tree['nodes']) for x in t.values() for tree in x.values()))
          src=decode(v/'js/rules/talentTreesData.mjs','export const TALENT_TREES = Object.freeze(')
          bun=decode(v/'js/core/uiBridge.bundle.js','exports.TALENT_TREES = Object.freeze(')
          checks['talent_source_12_36_720']=count(src)==(12,36,720)
          checks['talent_bundle_12_36_720']=count(bun)==(12,36,720)
          checks['talent_source_bundle_equal']=src==bun
          for k,val in checks.items():print(('PASS' if val else 'FAIL'),k)
          print('visual_categories',cats,'source_talents',count(src),'bundle_talents',count(bun))
          bad=[k for k,vv in checks.items() if not vv]
          if bad:raise SystemExit('STATIC_GATE_FAIL: '+', '.join(bad))
          print('R54_STATIC_GATE_DIAG_PASS')
          PY
      - name: Dispatch integrated closeout after clean static diagnosis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/close-star-wars-r54-final.yml/dispatches" \
            -d '{"ref":"main"}'
          echo R54_CLOSEOUT_REDISPATCHED_AFTER_STATIC_DIAG
