name: O Um Anel 4.9.2 Boot Hotfix APK Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-oua-4.9.2-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_URL: 'https://eu-central.storage.cloudconvert.com/tasks/1f5b951f-d637-4c79-ba63-e91aa9a33f52/OUA_4.9.2_BOOT_HOTFIX_ANDROID_STUDIO.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=cloudconvert-production%2F20260919%2Ffra%2Fs3%2Faws4_request&X-Amz-Date=20260919T081018Z&X-Amz-Expires=86400&X-Amz-Signature=ddaeeabfc25558194405579a4fa0723e33a21a02b2d322439bbf85629b0ed1f1&X-Amz-SignedHeaders=host&response-content-disposition=attachment%3B%20filename%3D%22OUA_4.9.2_BOOT_HOTFIX_ANDROID_STUDIO.zip%22&response-content-type=application%2Fzip&x-amz-checksum-mode=ENABLED&x-id=GetObject'
  TAG: 'OUA-v4.9.2-test'
  APK_NAME: 'BRASEIRO_O_UM_ANEL_4.9.2_BOOT_HOTFIX_DEBUG.apk'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Download exact 4.9.2 source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming work out
          curl -fL --retry 5 --retry-delay 3 "$SOURCE_URL" -o incoming/source.zip
          unzip -t incoming/source.zip >/dev/null
          sha256sum incoming/source.zip | tee out/SOURCE_DOWNLOAD_SHA256.txt

      - name: Extract Android Studio project
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/incoming/source.zip"
          ROOT=""
          for N in 1 2 3; do
            DEST="$GITHUB_WORKSPACE/work/layer$N"
            mkdir -p "$DEST"
            unzip -q "$SRC" -d "$DEST"
            WRAPPER="$(find "$DEST" -type f -name gradlew -not -path '*/.gradle/*' -not -path '*/build/*' | head -n1 || true)"
            if [ -n "$WRAPPER" ]; then
              ROOT="$(dirname "$WRAPPER")"
              break
            fi
            NEXT="$(find "$DEST" -type f -name '*.zip' | head -n1 || true)"
            [ -n "$NEXT" ] || { echo '::error::Android Gradle project not found in source package'; exit 1; }
            SRC="$NEXT"
          done
          [ -n "$ROOT" ] || { echo '::error::gradlew not found after nested archive extraction'; exit 1; }
          test -f "$ROOT/settings.gradle.kts" -o -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/build.gradle.kts" -o -f "$ROOT/app/build.gradle"
          grep -R -q 'com.braseiro.oumanel' "$ROOT/app"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android root: $ROOT" | tee out/ANDROID_ROOT.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.source.outputs.root }}"
          chmod +x "$ROOT/gradlew"
          cd "$ROOT"
          set +e
          ./gradlew clean :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/out/GRADLE_BUILD.log"
          RC=${PIPESTATUS[0]}
          set -e
          [ "$RC" -eq 0 ] || exit "$RC"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$APK_NAME" > "$GITHUB_WORKSPACE/out/$APK_NAME.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$GITHUB_WORKSPACE/out/$APK_NAME" | tee "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          grep -q "package: name='com.braseiro.oumanel'" "$GITHUB_WORKSPACE/out/APK_BADGING.txt"
          unzip -t "$GITHUB_WORKSPACE/out/$APK_NAME" >/dev/null

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: OUA-4.9.2-BOOT-HOTFIX-APK
          path: |
            out/BRASEIRO_O_UM_ANEL_4.9.2_BOOT_HOTFIX_DEBUG.apk
            out/BRASEIRO_O_UM_ANEL_4.9.2_BOOT_HOTFIX_DEBUG.apk.sha256
            out/APK_BADGING.txt
            out/GRADLE_BUILD.log
            out/SOURCE_DOWNLOAD_SHA256.txt
            out/ANDROID_ROOT.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish test GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES='O Um Anel 4.9.2 BOOT HOTFIX — APK debug para validação física do boot corrigido. Corrige acesso ao WebView fora da main thread. Package: com.braseiro.oumanel. Esta é uma release de teste; após validar no aparelho, promover para release assinada.'
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title 'Braseiro O Um Anel 4.9.2 BOOT HOTFIX — Test APK' --notes "$NOTES"
          gh release upload "$TAG"             "out/$APK_NAME"             "out/$APK_NAME.sha256"             out/APK_BADGING.txt             out/GRADLE_BUILD.log             out/SOURCE_DOWNLOAD_SHA256.txt --clobber
