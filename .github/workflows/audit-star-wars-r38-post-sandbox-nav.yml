name: Audit Star Wars R38 post-sandbox nav
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-star-wars-r38-post-sandbox-nav.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: src
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'));print('url='+d['source_share_url']);print('sha='+d['sha256']);print('file='+d['file'])
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Prepare exact Block01 state
        env:
          U: ${{ steps.src.outputs.url }}
          F: ${{ steps.src.outputs.file }}
          S: ${{ steps.src.outputs.sha }}
          SU: https://firestorage.ai/ja/f/PbM3XvdzNMAk
          SF: scene-assets-v1-tiny.tar.gz
          SS: 2ca16b2cd0d3f489fe10f1df718be1243febeef38fb88a52bd50502528f60711
        run: |
          set -euo pipefail;rm -rf incoming work;mkdir -p incoming work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          def dl(u,n,o):
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);q=b.new_page(accept_downloads=True);q.goto(u,wait_until='domcontentloaded',timeout=120000);q.wait_for_timeout(3000);done=False
              for s in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
                try:
                  x=q.locator(s).first
                  if not x.count() or not x.is_visible():continue
                  with q.expect_download(timeout=120000) as i:x.click(timeout=10000)
                  i.value.save_as(str(o));done=True;break
                except:pass
              if not done:
                x=q.get_by_text(n,exact=False).first
                with q.expect_download(timeout=120000) as i:x.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
                i.value.save_as(str(o));done=True
              b.close()
            if not done:raise SystemExit('download failed')
          dl(os.environ['U'],os.environ['F'],pathlib.Path('incoming')/os.environ['F']);dl(os.environ['SU'],os.environ['SF'],pathlib.Path('incoming')/os.environ['SF'])
          PY
          echo "${S}  incoming/${F}"|sha256sum -c -;echo "${SS}  incoming/${SF}"|sha256sum -c -
          unzip -q "incoming/${F}" -d work;G="$(find work -name gradlew -type f -not -path '*/build/*'|head -1)";R="$(dirname "$G")";echo "$R">/tmp/root
          base64 -w0 "incoming/${SF}" > star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64;python3 star-wars/r38/patches/block01_repair_safe.py "$R"
      - name: Start sandbox then test all five nav tabs
        run: |
          export ROOT="$(cat /tmp/root)"
          python3 - <<'PY'
          import os,json,pathlib,threading,http.server,socketserver
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(os.environ['ROOT']);vtt=root/'app/src/main/assets/vtt';os.chdir(vtt)
          class H(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          s=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=s.serve_forever,daemon=True).start();port=s.server_address[1]
          r={'start':{},'nav':[],'page_errors':[],'console_errors':[]}
          try:
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915})
              pg.on('pageerror',lambda e:r['page_errors'].append(str(e)));pg.on('console',lambda m:r['console_errors'].append(m.text) if m.type=='error' else None)
              pg.add_init_script('''const h={get:(t,p)=>{if(p==='then')return undefined;return(...a)=>JSON.stringify({ok:true,items:[],data:[],state:{}})}};for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroGemini','BraseiroImages','BraseiroFiles','BraseiroTts'])window[n]=new Proxy({},h);''')
              pg.goto(f'http://127.0.0.1:{port}/r46-shell.html',wait_until='domcontentloaded');pg.wait_for_timeout(1500)
              st=pg.locator('#sandbox-start-button');r['start']['present']=st.count()>0;r['start']['enabled']=r['start']['present'] and not st.is_disabled()
              try:st.click(timeout=3000);r['start']['clicked']=True
              except Exception as e:r['start']['clicked']=False;r['start']['error']=str(e)[:1200]
              pg.wait_for_timeout(800);ov=pg.locator('#braseiro-sandbox-setup');r['start']['modal_closed']=not (ov.count()>0 and ov.is_visible())
              labels=['CENA','PERSONAGEM','ITENS','NAVE','REGISTROS']
              for idx,label in enumerate(labels):
                loc=pg.locator('.bottom-nav-button:visible').nth(idx);item={'label':label}
                try:
                  loc.click(timeout=2500);pg.wait_for_timeout(150);item['clicked']=True
                  cur=pg.locator('.bottom-nav-button[aria-current="page"]');item['current']=(cur.first.inner_text().strip().replace('\n',' ') if cur.count() else None)
                except Exception as e:item['clicked']=False;item['error']=str(e)[:1500]
                r['nav'].append(item)
              b.close()
          finally:s.shutdown();s.server_close()
          dest=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit/POST_SANDBOX_NAV.json';dest.write_text(json.dumps(r,ensure_ascii=False,indent=2))
          md=['# R38 POST-SANDBOX NAV','',f"- Start present: **{r['start'].get('present')}**",f"- Start enabled: **{r['start'].get('enabled')}**",f"- Start clicked: **{r['start'].get('clicked')}**",f"- Modal closed: **{r['start'].get('modal_closed')}**",f"- Page errors: **{len(r['page_errors'])}**",f"- Console errors: **{len(r['console_errors'])}**",'','## Navigation']+[f"- {x['label']}: clicked **{x.get('clicked')}**, current=`{x.get('current')}`"+(f" — {x.get('error')}" if x.get('error') else '') for x in r['nav']]
          (dest.parent/'POST_SANDBOX_NAV.md').write_text('\n'.join(md)+'\n')
          PY
      - name: Commit evidence
        run: |
          git checkout -- star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          git config user.name braseiro-audit-bot;git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/POST_SANDBOX_NAV.*;git commit -m 'audit(star-wars): verify post-sandbox nav' || true;git push
