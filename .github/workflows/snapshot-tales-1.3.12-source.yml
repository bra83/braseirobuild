name: Snapshot Tales 1.3.12 Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snapshot-tales-1.3.12-source.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming work audit/tales-1.3.12-current
          mkdir -p incoming work
          gh release download TALES-1.3.8 --pattern 'BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip' --dir incoming
          unzip -q incoming/BRASEIRO_TALES_VTT_GITHUB_BUILD_1.3.8.zip -d work
          ROOT="$(dirname "$(find work -type f -name gradlew | head -n1)")"
          python3 -m pip install --quiet pillow
          python3 tales-1.3.12-transform.py "$ROOT"
          mkdir -p audit/tales-1.3.12-current
          cp -R "$ROOT/app/src/main/java" audit/tales-1.3.12-current/
          cp -R "$ROOT/app/src/test" audit/tales-1.3.12-current/ 2>/dev/null || true
          cp "$ROOT/app/build.gradle.kts" audit/tales-1.3.12-current/app-build.gradle.kts
          cp "$ROOT/TALES_RETOMADA_CURRENT.md" audit/tales-1.3.12-current/TALES_RETOMADA_CURRENT.md
      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/tales-1.3.12-current
          git commit -m 'Snapshot reconstructed Tales 1.3.12 source' || exit 0
          git push
