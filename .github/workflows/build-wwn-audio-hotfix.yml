name: BRASEIRO WWN Audio Hotfix Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-wwn-audio-hotfix.yml"

permissions:
  contents: read

env:
  WWN_SOURCE_SHARE_URL: "https://firestorage.ai/ja/f/N1AyRBWcUmQw"
  WWN_SOURCE_SHA256: "59d61d54083c560c7ae9c10449a75e9a977f2116472320b1ba25910224c47642"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download exact audio-hotfix source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming /tmp/wwn-download
          cd /tmp/wwn-download
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install chromium
          cat > download.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({acceptDownloads:true,locale:'ja-JP'});
          const page=await ctx.newPage();
          await page.goto(process.env.WWN_SOURCE_SHARE_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3000);
          const out=process.env.GITHUB_WORKSPACE+'/incoming/wwn.zip';
          for(const sel of ['text=/一括ダウンロード/i','text=/ダウンロード/i','text=/Download/i','button','a']){
            const loc=page.locator(sel), n=Math.min(await loc.count(),50);
            for(let i=0;i<n;i++){
              const el=loc.nth(i); let text=''; try{text=(await el.innerText({timeout:1000})).trim()}catch{}
              if((sel==='button'||sel==='a')&&!/download|ダウンロード|一括|保存|ZIP|ファイル/i.test(text)) continue;
              try{const p=page.waitForEvent('download',{timeout:10000}); await el.click({timeout:5000}); const d=await p; await d.saveAs(out); await browser.close(); process.exit(0)}catch{}
            }
          }
          await browser.close(); process.exit(2);
          NODE
          node download.mjs
          cd "$GITHUB_WORKSPACE"
          unzip -t incoming/wwn.zip >/dev/null
          echo "$WWN_SOURCE_SHA256  incoming/wwn.zip" | sha256sum -c -

      - name: Extract and validate hotfix source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q incoming/wwn.zip -d work
          chmod +x work/gradlew
          grep -q 'KEY_SAFE_AUDIO_DEFAULTS_APPLIED' work/app/src/main/java/com/braseiro/wwn/bridge/NativeAudioRuntime.kt
          grep -q 'getBoolean(KEY_AMBIENCE, false)' work/app/src/main/java/com/braseiro/wwn/bridge/NativeAudioRuntime.kt
          grep -q 'getBoolean(KEY_MUSIC, false)' work/app/src/main/java/com/braseiro/wwn/bridge/NativeAudioRuntime.kt
          grep -q 'smoothNoise' work/app/src/main/java/com/braseiro/wwn/audio/ProceduralAudioSynth.java
          grep -q 'default -> sample = 0.0' work/app/src/main/java/com/braseiro/wwn/audio/ProceduralAudioSynth.java
          grep -E 'compileSdk|targetSdk' work/app/build.gradle.kts
          grep distributionSha256Sum work/gradle/wrapper/gradle-wrapper.properties

      - name: Run audio regression contracts
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python3 tools/closure069_native_audio_contract.py
          cd web-tests
          npm test -- --test-name-pattern='regressão|áudio|audio|Configurações'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew clean test assembleDebug --stacktrace --no-daemon

      - name: Collect and validate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find work -type f -path '*/build/outputs/apk/debug/*.apk' | sort | head -n1)"
          test -f "$APK"
          NAME="BRASEIRO-WWN-POST071-AUDIO-HOTFIX-DEBUG.apk"
          cp "$APK" "out/$NAME"
          unzip -t "out/$NAME" >/dev/null
          sha256sum "out/$NAME" | tee "out/$NAME.sha256"
          stat -c 'APK_SIZE_BYTES=%s' "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: BRASEIRO-WWN-POST071-AUDIO-HOTFIX-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
