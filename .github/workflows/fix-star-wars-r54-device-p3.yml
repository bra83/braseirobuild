name: Fix Star Wars R54 Real Device P3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-star-wars-r54-device-p3.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover P2 and apply P3
        id: root
        run: |
          set -euo pipefail
          ZIP=star-wars/final-1.0.0/output-r54/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P2.zip
          test -f "$ZIP"; rm -rf /tmp/r54-p3; mkdir /tmp/r54-p3; unzip -q "$ZIP" -d /tmp/r54-p3
          SET=$(find /tmp/r54-p3 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' | head -1); ROOT=$(dirname "$SET"); echo "path=$ROOT" >> "$GITHUB_OUTPUT"
          python3 star-wars/r54/fix_device_p3.py "$ROOT" | tee /tmp/P3_AUDIT.txt
          grep -q '900-1400 palavras' "$ROOT/app/src/main/java/com/braseiro/starwarsedge/GeminiBridge.java"
          grep -q 'takePersistableUriPermission' "$ROOT/app/src/main/java/com/braseiro/starwarsedge/MainActivity.java"
          grep -q 'pages.jsonl' "$ROOT/app/src/main/java/com/braseiro/starwarsedge/MainActivity.java"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', validate-wrappers: false}
      - name: Compile APK
        working-directory: ${{ steps.root.outputs.path }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Persist P3
        env: {ROOT: '${{ steps.root.outputs.path }}'}
        run: |
          set -euo pipefail; OUT=star-wars/final-1.0.0/output-r54; APK=$(find "$ROOT/app/build/outputs/apk/debug" -name '*.apk' | head -1); test -f "$APK"
          cp "$APK" /tmp/P3.apk; (cd "$ROOT" && zip -qr /tmp/P3.zip . -x '*/build/*' '.gradle/*'); sha256sum /tmp/P3.apk >/tmp/P3.apk.sha256; sha256sum /tmp/P3.zip >/tmp/P3.zip.sha256
          git config user.name github-actions; git config user.email github-actions@github.com; git reset --hard HEAD; git clean -fd; git fetch origin main; git reset --hard origin/main; mkdir -p "$OUT" star-wars/r54/audit
          cp /tmp/P3.apk "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P3_DEBUG.apk"; cp /tmp/P3.zip "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P3.zip"; cp /tmp/P3.apk.sha256 "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_R54_DEVICE_P3_DEBUG.apk.sha256"; cp /tmp/P3.zip.sha256 "$OUT/STAR_WARS_EDGE_OF_THE_GALAXY_ANDROID_STUDIO_R54_DEVICE_P3.zip.sha256"; cp /tmp/P3_AUDIT.txt star-wars/r54/audit/DEVICE_P3_PERSISTENCE_NARRATION_2026-09-17.txt
          git add -f "$OUT" star-wars/r54/audit; git commit -m 'build(star-wars): persist R54 device P3 narration persistence repair'; git push origin HEAD:main
