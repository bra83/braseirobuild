name: Audit Star Wars R38 Block02 v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/audit-star-wars-r38-block02-v3.yml"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: source
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('star-wars/r38/SOURCE.json'))
          print('url='+d['source_share_url']); print('sha='+d['sha256']); print('file='+d['file'])
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Download exact source and recovered scene pack
        env:
          SHARE_URL: ${{ steps.source.outputs.url }}
          SOURCE_FILE: ${{ steps.source.outputs.file }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          SCENE_URL: https://firestorage.ai/ja/f/PbM3XvdzNMAk
          SCENE_FILE: scene-assets-v1-tiny.tar.gz
          SCENE_SHA: 2ca16b2cd0d3f489fe10f1df718be1243febeef38fb88a52bd50502528f60711
        shell: bash
        run: |
          set -euo pipefail
          rm -rf incoming work; mkdir -p incoming/scenes work
          python3 - <<'PY'
          import os,pathlib
          from playwright.sync_api import sync_playwright
          def get(url,name,out):
            with sync_playwright() as p:
              b=p.chromium.launch(headless=True); pg=b.new_page(accept_downloads=True)
              pg.goto(url,wait_until='domcontentloaded',timeout=120000);pg.wait_for_timeout(3000)
              done=False
              for s in ['a[download]','a[href*="download"]','button:has-text("Download")','a:has-text("Download")','button:has-text("ダウンロード")','a:has-text("ダウンロード")','button:has-text("保存")','a:has-text("保存")']:
                try:
                  q=pg.locator(s).first
                  if not q.count() or not q.is_visible():continue
                  with pg.expect_download(timeout=120000) as di:q.click(timeout=10000)
                  di.value.save_as(str(out));done=True;break
                except:pass
              if not done:
                q=pg.get_by_text(name,exact=False).first
                with pg.expect_download(timeout=120000) as di:q.locator('xpath=ancestor::*[self::div or self::li or self::article][1]').locator('a,button').last.click(timeout=10000)
                di.value.save_as(str(out));done=True
              b.close()
            if not done:raise SystemExit('download failed '+name)
          get(os.environ['SHARE_URL'],os.environ['SOURCE_FILE'],pathlib.Path('incoming')/os.environ['SOURCE_FILE'])
          get(os.environ['SCENE_URL'],os.environ['SCENE_FILE'],pathlib.Path('incoming/scenes')/os.environ['SCENE_FILE'])
          PY
          echo "${EXPECTED_SHA}  incoming/${SOURCE_FILE}"|sha256sum -c -
          echo "${SCENE_SHA}  incoming/scenes/${SCENE_FILE}"|sha256sum -c -
          unzip -q "incoming/${SOURCE_FILE}" -d work
          G="$(find work -type f -name gradlew -not -path '*/build/*'|head -n1)";R="$(dirname "$G")";echo "$R">/tmp/root
          base64 -w0 "incoming/scenes/${SCENE_FILE}" > star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          python3 star-wars/r38/patches/block01_repair_safe.py "$R"
      - name: Run corrected static and browser audit
        shell: bash
        run: |
          set -euo pipefail
          export ROOT="$(cat /tmp/root)"
          python3 - <<'PY'
          import os,re,json,pathlib,collections,datetime,subprocess,threading,http.server,socketserver
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(os.environ['ROOT']);vtt=root/'app/src/main/assets/vtt';r46=vtt/'r46';shell=vtt/'r46-shell.html'
          issues=[];stats={}
          def add(s,c,m,p=None,e=None):issues.append({'severity':s,'code':c,'message':m,'path':p,'evidence':e})
          def rd(p):return p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          # syntax
          js=list(r46.rglob('*.js'));stats['js_checked']=len(js)
          for p in js:
            q=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if q.returncode:add('critical','JS_SYNTAX','JavaScript syntax failure',str(p.relative_to(root)),q.stderr[-800:])
          # shell structure
          st=rd(shell)
          if not st:add('critical','SHELL_MISSING','Actual R46 shell missing')
          ids=re.findall(r'\bid=["\']([^"\']+)',st)
          for k,n in collections.Counter(ids).items():
            if n>1:add('high','DUPLICATE_ID',f'Duplicate DOM id {k}',str(shell.relative_to(root)))
          for x in re.findall(r'\bfor=["\']([^"\']+)',st):
            if x not in ids:add('medium','LABEL_TARGET',f'Label target missing: {x}',str(shell.relative_to(root)))
          if 'viewport-fit=cover' not in st:add('medium','VIEWPORT_FIT','viewport-fit=cover missing')
          # static references: HTML/CSS only
          refs=[]
          for p in [shell]+list(r46.rglob('*.html')):
            refs += [(p,x) for x in re.findall(r'(?:src|href)\s*=\s*["\']([^"\'#?]+)',rd(p),re.I)]
          for p in r46.rglob('*.css'):
            refs += [(p,x) for x in re.findall(r'url\(\s*["\']?([^"\')?#]+)',rd(p),re.I)]
          miss=[]
          for p,x in refs:
            if x.startswith(('http:','https:','data:','blob:','javascript:','#')):continue
            if not (p.parent/x).resolve().exists() and not (vtt/x.lstrip('/')).resolve().exists():miss.append((p,x));add('high','MISSING_ASSET',f'Missing static asset: {x}',str(p.relative_to(root)))
          stats['static_refs']=len(refs);stats['missing_static']=len(miss)
          alltxt='\n'.join(rd(p) for p in [shell]+[x for x in r46.rglob('*') if x.is_file() and x.suffix.lower() in {'.js','.css','.html'}])
          for code,tok in [('SAFE_BOTTOM','--android-safe-bottom'),('SAFE_ENV','safe-area-inset-bottom'),('SCENE_FALLBACK','RECOVERED_SCENE_VISUALS'),('SCENE_IMPORT','IMPORTAR'),('ILLUSTRATION','ILUSTRAÇÃO')]:
            if tok not in alltxt:add('high',code,'Required marker missing: '+tok)
          png=sorted(set(re.findall(r'[^"\'\s()]+\.png',alltxt,re.I)));stats['png_refs']=png
          if len(png)<5:add('high','NAV_ICONS',f'Only {len(png)} PNG refs found',e=png)
          java='\n'.join(rd(p) for p in root.glob('app/src/main/java/**/*.java'));man=rd(root/'app/src/main/AndroidManifest.xml')
          if 'applySystemInsetsToWeb' not in java:add('high','ANDROID_INSETS','Insets bridge method missing')
          if 'adjustResize' not in man:add('medium','IME_RESIZE','adjustResize missing')
          if not all(x in java for x in ['com.google.android.apps.bard','Intent.ACTION_SEND','Intent.EXTRA_TEXT']):add('high','GEMINI_HANDOFF','Gemini handoff contract incomplete')
          # Browser runtime at actual shell
          os.chdir(vtt)
          class H(http.server.SimpleHTTPRequestHandler):
            def log_message(self,*a):pass
          srv=socketserver.TCPServer(('127.0.0.1',0),H);threading.Thread(target=srv.serve_forever,daemon=True).start();port=srv.server_address[1]
          rt={'loaded':False,'page_errors':[],'console_errors':[],'broken_images':[],'nav':[]}
          try:
            with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True);pg=b.new_page(viewport={'width':415,'height':915})
              pg.on('pageerror',lambda e:rt['page_errors'].append(str(e)))
              pg.on('console',lambda m:rt['console_errors'].append(m.text) if m.type=='error' else None)
              pg.add_init_script('''const h={get:(t,p)=>{if(p==='then')return undefined;return(...a)=>JSON.stringify({ok:true,items:[],data:[],state:{}})}};for(const n of ['BraseiroUiBridge','BraseiroLibrary','BraseiroGemini','BraseiroImages','BraseiroFiles','BraseiroTts'])window[n]=new Proxy({},h);''')
              resp=pg.goto(f'http://127.0.0.1:{port}/r46-shell.html',wait_until='domcontentloaded',timeout=30000)
              rt['loaded']=bool(resp and resp.status<400)
              if not rt['loaded']:add('critical','R46_BOOT','Actual shell did not load',e=resp.status if resp else None)
              else:
                pg.wait_for_timeout(2000)
                rt['broken_images']=pg.evaluate('() => [...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute("src"))')
                for x in rt['broken_images']:add('high','BROKEN_IMAGE','Rendered image failed',e=x)
                loc=pg.locator('nav button:visible,.bottom-nav button:visible,[data-tab]:visible')
                for i in range(min(loc.count(),10)):
                  el=loc.nth(i);lab=(el.get_attribute('aria-label') or el.get_attribute('data-tab') or el.inner_text() or f'#{i}')[:80]
                  try:el.click(timeout=1500);pg.wait_for_timeout(80);rt['nav'].append({'label':lab,'ok':True})
                  except Exception as ex:rt['nav'].append({'label':lab,'ok':False});add('high','NAV_CLICK','Visible nav click failed: '+lab,e=str(ex)[:200])
              b.close()
          finally:srv.shutdown();srv.server_close()
          for x in rt['page_errors']:add('high','PAGE_ERROR','Runtime page error',e=x)
          for x in rt['console_errors']:
            if 'favicon' not in x.lower() and '404' not in x.lower():add('medium','CONSOLE_ERROR','Runtime console error',e=x)
          c=collections.Counter(x['severity'] for x in issues)
          rep={'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'stats':stats,'issue_counts':dict(c),'issues':issues,'runtime':rt}
          out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'star-wars/r38/audit/BLOCK02_BROAD_AUDIT_V3.json';out.write_text(json.dumps(rep,ensure_ascii=False,indent=2))
          md=['# BLOCK02 BROAD AUDIT V3','',f'- Critical: **{c["critical"]}**',f'- High: **{c["high"]}**',f'- Medium: **{c["medium"]}**',f'- JS checked: **{len(js)}**',f'- Static refs: **{len(refs)}**, missing **{len(miss)}**',f'- PNG refs: **{len(png)}**',f'- Runtime shell loaded: **{rt["loaded"]}**',f'- Broken rendered images: **{len(rt["broken_images"])}**',f'- Navigation controls exercised: **{len(rt["nav"])}**','','## Findings']+[f'- **{x["severity"].upper()} · {x["code"]}** — {x["message"]}'+(f' — `{str(x["evidence"])[:350]}`' if x.get('evidence') else '') for x in issues]
          if not issues:md.append('- No reproducible issue found in this audit scope.')
          (out.parent/'BLOCK02_BROAD_AUDIT_V3.md').write_text('\n'.join(md)+'\n')
          PY
      - name: Commit audit result
        run: |
          git checkout -- star-wars/r38/patches/assets/scene-assets-v1.tar.gz.b64
          git config user.name braseiro-audit-bot;git config user.email actions@users.noreply.github.com
          git add star-wars/r38/audit/BLOCK02_BROAD_AUDIT_V3.*
          git commit -m 'audit(star-wars): record Block02 v3 findings' || true
          git push
