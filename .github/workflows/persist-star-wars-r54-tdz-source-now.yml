name: Persist Star Wars R54 TDZ Source Fix Now
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/persist-star-wars-r54-tdz-source-now.yml"
permissions:
  contents: write
jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist source correction
        run: |
          set -euo pipefail
          SRC=star-wars/r54/fix_supplement_species_runtime.py
          sed -i 's/let r54SupplementSpeciesPromise=null;/var r54SupplementSpeciesPromise=null;/' "$SRC"
          grep -Fq 'var r54SupplementSpeciesPromise=null;' "$SRC"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$SRC"
          git commit -m 'fix(star-wars): eliminate supplement species TDZ at source'
          git push origin HEAD:main
