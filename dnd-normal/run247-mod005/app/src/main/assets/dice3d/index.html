<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f3eadc;font-family:system-ui,sans-serif}#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#hud{position:absolute;left:0;right:0;top:0;padding:calc(18px + env(safe-area-inset-top)) 18px 12px;text-align:center;pointer-events:none;background:linear-gradient(#100c0ab8,transparent)}#title{font-size:13px;letter-spacing:.12em;color:#d9a84c;font-weight:800}#status{font-size:16px;margin-top:8px}.result{font-size:24px;font-weight:800;margin-top:7px}.detail{font-size:14px;color:#d8cec0;margin-top:4px}#close{position:absolute;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));border:1px solid #8d7655;background:#2d241d;color:#f3eadc;border-radius:10px;padding:12px 18px;font-weight:700}#quality{position:absolute;left:14px;bottom:calc(20px + env(safe-area-inset-bottom));font-size:11px;color:#8f8172}.crit{animation:pulse .5s ease-out 1}@keyframes pulse{50%{transform:scale(1.08);text-shadow:0 0 18px #ffd36c}}
</style></head><body><canvas id="stage"></canvas><div id="hud"><div id="title">MESA FÍSICA 3D</div><div id="status">Preparando lançamento…</div><div id="result" class="result"></div><div id="detail" class="detail"></div></div><div id="quality"></div><button id="close">CANCELAR</button><script src="dice3d_core.js"></script><script src="dice3d_app.js"></script></body></html>
